[build]
  # Netlify clona il repo completo — il loader legge da ../../01_MATRICE_MC e ../../08_TESTI
  base    = "05_APP/tecnologia-sito-web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS    = "--legacy-peer-deps"

# Regole SPA per routing Next.js statico
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache aggressiva per asset statici
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
