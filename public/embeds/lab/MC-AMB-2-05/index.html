<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Il viaggio dell'acqua</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},

    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-AMB-2-05","F":[["Quante sono le fasi del ciclo artificiale dell'acqua urbana?",["Tre: captazione, distribuzione e depurazione","Sei: captazione, potabilizzazione, distribuzione, uso, fognatura, depurazione e restituzione","Due: prelievo dall'ambiente e scarico in fognatura","Dieci, incluse filtrazione, clorazione, osmosi inversa, nanofiltrazione e disinfezione UV"],1,"Il ciclo artificiale dell'acqua urbana ha sei fasi: 1) Captazione (da fiumi, laghi, falde); 2) Potabilizzazione (filtrazione, sedimentazione, disinfezione); 3) Distribuzione (acquedotto, torri d'acqua); 4) Uso (domestico, industriale); 5) Fognatura e raccolta (reti separate); 6) Depurazione e restituzione all'ambiente.",["Non è corretto. Il ciclo artificiale dell'acqua urbana ha più fasi intermedie tra captazione e depurazione.","Esatto! Il ciclo artificiale ha sei fasi: 1) captazione, 2) potabilizzazione, 3) distribuzione, 4) uso, 5) fognatura e raccolta, 6) depurazione e restituzione all'ambiente.","Non è corretto. Il ciclo ha molte fasi intermedie tra il prelievo e lo scarico, incluse potabilizzazione, distribuzione e depurazione.","Non è corretto. Queste sono tecnologie usate nella fase di potabilizzazione, non fasi separate del ciclo artificiale."]],["Qual è la percentuale media di perdite nella rete idrica italiana?",["Circa il 6%, simile alla Germania","Il 42% dell'acqua immessa in rete","Circa il 15%, nella media europea","Circa il 25%, considerato fisiologico per reti datate"],1,"L'Italia perde mediamente il 42% dell'acqua immessa in rete (Germania: 6%, media UE: 23%). Le cause: tubature vecchie (molte degli anni '50-'60), rotture non rilevate tempestivamente, allacci abusivi. Ogni anno si disperdono miliardi di m³ di acqua già potabilizzata e pompata.",["Non è corretto. La Germania perde circa il 6% — è una delle più efficienti d'Europa. L'Italia ha perdite molto maggiori.","Esatto! L'Italia perde mediamente il 42% dell'acqua immessa in rete prima che raggiunga i rubinetti. Alcune città del sud superano il 50-60%. La media europea è 23%.","Non è corretto. Il 15% sarebbe un ottimo risultato. L'Italia è tra i peggiori in Europa: 42% di media vs. 23% europeo.","Non è corretto. Il 25% è circa la media europea. L'Italia è significativamente peggio: 42% di media, con punte al 50-60% in alcune città del sud."]],["Perché l'acqua del rubinetto a volte ha sapore o odore di cloro?",["Perché la concentrazione di cloro è eccessiva e supera i limiti di legge","Perché il cloro reagisce con sostanze organiche dell'acqua formando cloramine, che evaporano lasciando l'acqua in un bicchiere aperto per 30 minuti","Perché le tubature in PVC rilasciano composti clorurati nell'acqua che scorre","Perché il cloro viene aggiunto in eccesso nelle giornate calde per compensare la crescita batterica maggiore"],1,"Il 'sapore di piscina' dell'acqua del rubinetto non viene dal cloro libero (0,2-0,5 mg/L, innocuo) ma dalle cloramine: composti che si formano quando il cloro reagisce con azoto organico presente nell'acqua. Lasciare l'acqua in un bicchiere aperto per 30 minuti fa evaporare le cloramine e il sapore scompare.",["Non è corretto. Il testo indica che la sensazione di 'piscina' non viene dal cloro libero ma da sostanze derivate dalla reazione del cloro con composti organici. Non è un segnale di concentrazione eccessiva.","Esatto! Non è il cloro libero ma le cloramine (cloro + composti azotati organici) che danno il sapore caratteristico. Lasciando l'acqua in un bicchiere aperto per 30 minuti le cloramine evaporano e il sapore scompare.","Non è corretto. Le tubature in PVC approvate per uso alimentare non rilasciano cloro. Il sapore viene dal processo di trattamento (disinfezione) dell'acqua.","Non è corretto. La concentrazione di cloro è regolamentata (0,2-0,5 mg/L) e non viene aumentata arbitrariamente in estate. Il sapore è legato alle cloramine, non alla quantità di cloro."]],["Cos'è il 'principio di invarianza idraulica' per le nuove costruzioni?",["Il principio che l'acqua potabile deve mantenere la stessa qualità dalla fonte al rubinetto","Il principio che ogni nuova costruzione non deve aumentare il deflusso di acque piovane rispetto alla situazione preesistente","Il principio che la pressione dell'acqua rimane costante in tutto il sistema di distribuzione","Il principio che i contatori dell'acqua devono registrare gli stessi valori in tutte le abitazioni di un condominio"],1,"Il principio di invarianza idraulica impone che ogni nuova costruzione non aumenti il deflusso di acque piovane rispetto alla situazione prima della costruzione. Se prima c'era un prato (50-60% di infiltrazione), dopo la costruzione l'acqua che esce deve essere uguale. Si realizza con vasche di laminazione, pavimentazioni permeabili, tetti verdi.",["Non è corretto. La qualità dell'acqua potabile è garantita da altri principi e norme. L'invarianza idraulica riguarda la gestione delle acque piovane.","Esatto! L'invarianza idraulica impone che dopo la costruzione l'acqua piovana che defluisce fuori dal lotto sia la stessa di prima (quando c'era il prato). Le superfici impermeabili devono essere compensate con vasche di laminazione, tetti verdi, pavimentazioni drenanti.","Non è corretto. La pressione costante è gestita dalle torri d'acqua e dalle stazioni di pompaggio. L'invarianza idraulica riguarda le acque piovane, non l'acquedotto.","Non è corretto. Questo riguarda la misurazione individuale dei consumi, non l'invarianza idraulica. I due concetti sono completamente separati."]],["Quanti litri d'acqua consuma mediamente un italiano al giorno?",["Circa 50 litri al giorno","Circa 220 litri al giorno","Circa 500 litri al giorno","Circa 100 litri al giorno"],1,"In Italia il consumo medio domestico è di circa 220 litri per persona al giorno. Include: bere/cucinare (5-10 L), igiene personale (80-100 L), WC (40-50 L), lavatrice (40-60 L), lavastoviglie (15-20 L), altro. Molto più dei 50-100 L/giorno dei paesi in via di sviluppo.",["Non è corretto. 50 litri è il consumo minimo raccomandato dall'OMS per le necessità di base. In Italia il consumo è molto più alto.","Esatto! In Italia il consumo medio domestico è di circa 220 litri per persona al giorno. Questo include tutto: bere, cucinare, lavarsi, WC, lavatrice, lavastoviglie, irrigazione.","Non è corretto. 500 litri sarebbe un consumo eccezionalmente alto. Il consumo medio italiano è di circa 220 litri/giorno.","Non è corretto. 100 litri sarebbe un consumo molto contenuto, tipico di paesi in via di sviluppo o di situazioni di razionamento. La media italiana è circa il doppio."]],["Quale percentuale dell'acqua dolce presente sulla Terra è effettivamente disponibile per l'uso umano?",["Il 70%","Il 2,5%","Il 30%","Il 15%"],1,"Solo il 2,5% dell'acqua sulla Terra è dolce. Di questo 2,5%, circa il 70% è intrappolato nei ghiacciai e nelle nevi perenni; il 30% è in falde sotterranee (spesso profonde). Solo l'1% circa è facilmente accessibile (fiumi, laghi, falde superficiali). L'acqua dolce è una risorsa preziosa e limitata.",["Non è corretto. Il 70% è la percentuale della superficie terrestre coperta da acqua. La quota di acqua dolce disponibile è molto minore.","Esatto! Solo il 2,5% dell'acqua sulla Terra è dolce. E di questo 2,5%, la maggior parte è nei ghiacciai, nelle nevi perenni o in falde profonde difficili da raggiungere. L'acqua dolce facilmente accessibile è una frazione ancora più piccola.","Non è corretto. Il 30% è la quota di superficie terrestre emersa (terre emerse). L'acqua dolce è solo il 2,5% del totale dell'acqua sulla Terra.","Non è corretto. Il 15% sarebbe già una percentuale enorme. L'acqua dolce è solo il 2,5% del totale, e non tutta è accessibile."]]],"I":[["Perché la disinfezione UV dell'acqua potabile non sostituisce completamente la clorazione nelle reti?",["Perché i raggi UV sono più costosi da produrre e richiedono energia elettrica","Perché i raggi UV non garantiscono protezione lungo tutta la rete dopo l'impianto: il cloro rimane attivo nell'acqua mentre gli UV no","Perché i raggi UV danneggiano le tubature in PVC delle reti idriche","Perché i raggi UV non sono efficaci contro i batteri presenti nell'acqua dei fiumi"],1,"I raggi UV distruggono il DNA dei microrganismi nell'impianto di trattamento, ma non lasciano residui nell'acqua. Il cloro invece rimane attivo nell'acqua durante il percorso in rete (effetto residuo), proteggendo contro eventuali contaminazioni lungo i km di tubature. Per questo i due metodi si usano spesso in combinazione.",["Parzialmente vero, ma non è la ragione principale per cui non sostituisce la clorazione. Il testo indica un limite tecnico specifico.","Esatto! I raggi UV distruggono i microrganismi nell'impianto di trattamento, ma l'acqua poi percorre decine di km di rete. Il cloro rimane attivo nell'acqua (effetto residuo), i raggi UV no. Per questo la clorazione è necessaria per la protezione lungo tutta la rete.","Non è corretto. I raggi UV vengono applicati prima dell'immissione in rete, nell'impianto di trattamento, non nelle tubature. Non danneggiano le reti.","Non è corretto. I raggi UV sono efficaci contro tutti i microrganismi (batteri, virus, protozoi) nell'acqua. Il problema non è l'efficacia puntuale ma l'effetto residuo nella rete."]],["Il Mar d'Aral si è quasi completamente prosciugato. Qual è la causa principale descritta nel testo?",["Il cambiamento climatico ha ridotto le precipitazioni nell'Asia centrale negli ultimi decenni","L'URSS ha deviato i due fiumi tributari per irrigare i campi di cotone, privando il lago del suo rifornimento d'acqua","L'uso eccessivo di pesticidi nei campi circostanti ha contaminato l'acqua rendendola tossica e facendola evaporare","L'estrazione di gas naturale dal sottosuolo ha causato subsidenza e drenaggio del lago"],1,"Il Mar d'Aral (un tempo quarto lago del mondo) si è prosciugato perché l'URSS ha deviato i due fiumi tributari (Amu Darya e Syr Darya) per irrigare enormi campi di cotone in Kazakistan e Uzbekistan. Il lago, privato del suo rifornimento naturale, ha perso il 90% del suo volume in pochi decenni. È uno dei peggiori disastri ambientali del XX secolo.",["Non è corretto. Il cambiamento climatico ha contribuito marginalmente. La causa principale è stata una scelta umana di deviare i fiumi per l'agricoltura.","Esatto! L'URSS ha deviato i fiumi Amu Darya e Syr Darya per irrigare enormi campi di cotone in Kazakistan e Uzbekistan. Il lago, privato del suo rifornimento, si è prosciugato in pochi decenni.","Non è corretto. I pesticidi hanno contaminato le acque residue, ma la causa del prosciugamento è la riduzione del rifornimento idrico per la deviazione dei fiumi.","Non è corretto. Non ci sono operazioni di gas naturale che abbiano causato il prosciugamento del Mar d'Aral. La causa è la deviazione dei fiumi tributari."]],["Come funzionano le pavimentazioni permeabili per rispettare il principio di invarianza idraulica?",["Raccolgono l'acqua piovana in serbatoi sotterranei per l'irrigazione dei giardini circostanti","Permettono all'acqua piovana di infiltrarsi nel sottosuolo attraverso la struttura porosa, riducendo il deflusso superficiale","Evaporano immediatamente l'acqua piovana grazie ai materiali ad alta assorbenza termica","Rallentano il deflusso superficiale grazie alla rugosità della superficie che crea attrito con l'acqua"],1,"Le pavimentazioni permeabili (blocchi drenanti, asfalto poroso, ghiaia stabilizzata) permettono all'acqua piovana di filtrare nel sottosuolo invece di scorrere in superficie. Sono una delle misure di invarianza idraulica: mantengono il comportamento idrologico del terreno simile a quello naturale (prato), riducendo il rischio di allagamenti urbani.",["Non è corretto. Le pavimentazioni permeabili non raccolgono l'acqua in serbatoi. Lasciano semplicemente infiltrare l'acqua nel sottosuolo attraverso la loro struttura porosa.","Esatto! Blocchi drenanti, asfalto poroso e ghiaia stabilizzata permettono all'acqua di infiltrarsi nel terreno sottostante invece di scorrere in superficie verso le fognature. Riducono il picco di deflusso durante i temporali.","Non è corretto. La pavimentazione permeabile non evapora l'acqua: la fa infiltrare nel sottosuolo. L'evaporazione è lenta e avviene nel suolo, non sulla superficie.","Non è corretto. Il rallentamento per attrito riduce la velocità del deflusso ma non la sua quantità. Le pavimentazioni permeabili riducono la quantità di acqua che scorre in superficie, facendola filtrare nel suolo."]],["Cape Town nel 2018 ha quasi raggiunto il 'Day Zero', il giorno senza più acqua. Qual è stata la causa principale?",["Un terremoto ha danneggiato la rete idrica principale e le dighe di stoccaggio","Tre anni consecutivi di siccità eccezionale in combinazione con la crescita demografica che aveva superato le infrastrutture idriche","La contaminazione delle riserve idriche da parte di attività industriali minerarie","Il massiccio uso di acqua desalinizzata che aveva esaurito le riserve naturali in pochi mesi"],1,"Cape Town ha quasi raggiunto il 'Day Zero' nel 2018 per due cause combinate: 1) tre anni consecutivi di siccità eccezionale che hanno svuotato i sei bacini idrici della città; 2) crescita demografica (da 3 a 4 milioni in pochi anni) che aveva superato la capacità delle infrastrutture idriche. Il razionamento a 50 L/persona/giorno ha evitato il Day Zero.",["Non è corretto. Cape Town non è stata colpita da un terremoto significativo nel 2018. La crisi idrica è stata causata dalla combinazione di siccità e crescita demografica.","Esatto! Cape Town ha subito tre anni consecutivi di siccità eccezionale (2015-2018) in combinazione con una crescita demografica che aveva superato la capacità delle infrastrutture idriche. Il 'Day Zero' (acqua azzerata) fu evitato con un razionamento estremo a 50 L/persona/giorno.","Non è corretto. La contaminazione mineraria è un problema reale in Sud Africa ma non è la causa della crisi idrica del 2018. La causa principale è stata la siccità pluriennale.","Non è corretto. La desalinizzazione non esaurisce le riserve naturali: usa acqua di mare. Cape Town non aveva sufficiente capacità di desalinizzazione: era questa la debolezza."]],["L'impronta idrica di 1 kg di carne bovina è circa 15.000 litri. Cosa include questo calcolo?",["Solo l'acqua che la mucca beve direttamente durante la sua vita","Tutta l'acqua usata in ogni fase della produzione: l'acqua per coltivare il cibo dell'animale, per abbeverarlo e per le strutture di allevamento","Solo l'acqua usata nel macello e nel processo di lavorazione della carne dopo la macellazione","L'acqua evaporata dai pascoli dove l'animale vive durante tutta la sua vita"],1,"L'impronta idrica include tutta l'acqua usata in ogni fase della produzione (water footprint). Per la carne bovina: ~90% per coltivare il mangime vegetale (cereali, soia), ~5% per abbeverare la mucca, ~5% per strutture e lavorazione. La parte della 'bere diretto' è minima rispetto al mangime.",["Non è corretto. Il bere diretto è una piccola parte dell'impronta idrica. Il calcolo include tutta l'acqua incorporata nella produzione.","Esatto! L'impronta idrica include: acqua per coltivare i cereali/foraggio (la parte maggiore), acqua per abbeverare l'animale, acqua per le strutture di allevamento (pulizia, lavorazione). La parte della 'bere diretto' è solo il 2-5%.","Non è corretto. L'acqua di lavorazione è una frazione minima. La parte dominante è l'acqua per produrre il mangime: circa il 90% dell'impronta idrica totale della carne bovina.","Non è corretto. L'evapotraspirazione dai pascoli contribuisce, ma la parte dominante è l'acqua per coltivare il mangime concentrato (cereali, soia) che l'animale consuma."]],["Perché le reti fognarie separate per acque reflue e acque meteoriche sono preferibili alle reti combinate?",["Perché le reti separate costano meno da costruire grazie ai tubi di diametro ridotto","Perché evitano di sovraccaricare il depuratore durante i temporali con enormi volumi di acqua piovana diluita","Perché l'acqua piovana è più inquinata delle acque reflue domestiche e richiede un trattamento più intenso","Perché la normativa UE impone le reti separate per tutti i nuovi insediamenti dal 2020"],1,"Nelle reti combinate, i temporali intensi portano enormi volumi di acqua piovana nei depuratori: questi si saturano e scaricano le acque miste (reflue + piovane) non completamente trattate nei fiumi. Le reti separate mandano le acque reflue al depuratore (flusso controllato) e le piovane direttamente ai corsi d'acqua, riducendo il rischio di scarichi non trattati.",["Non è corretto. Le reti separate costano di più perché richiedono due sistemi di tubature invece di uno. Il vantaggio è funzionale, non economico.","Esatto! Nelle reti combinate, i temporali intensi portano enormi volumi di acqua piovana nei depuratori, che non riescono a trattarli: le acque miste non trattate vengono scaricate nei fiumi. Con reti separate, l'acqua piovana va direttamente ai corsi d'acqua (già trattata o meno inquinata).","Non è corretto. Le acque reflue domestiche (WC, cucina, lavatrice) sono molto più inquinate dell'acqua piovana. La separazione serve per non sovraccaricare il depuratore con l'acqua piovana.","Non è corretto. La separazione delle reti è raccomandata e incentivata, ma non esiste un obbligo UE universale dal 2020 per tutti i nuovi insediamenti."]]],"A":[["La crisi del Po nell'estate 2022 ha mostrato che l'Italia non è 'povera d'acqua' in termini assoluti ma ha problemi specifici. Quali?",["Mancanza di fiumi: l'Italia è un paese essenzialmente arido senza corsi d'acqua significativi","Distribuzione temporale squilibrata delle piogge (siccità estive, piogge intense autunnali) e infrastrutture insufficienti di raccolta e stoccaggio","Consumo pro capite troppo alto (più di 1.000 litri al giorno) rispetto alla media europea","Posizione geografica sfavorevole: l'Italia è troppo lontana dalle fonti di approvvigionamento idrico europee"],1,"L'Italia ha precipitazioni medie di 800-900 mm/anno (non un paese arido) ma ha due problemi: 1) distribuzione temporale squilibrata (secco d'estate, abbondante in primavera/autunno); 2) solo il 13% delle precipitazioni viene raccolto in bacini artificiali (Spagna: 40%). Questo, combinato con le perdite in rete (42%), crea crisi idriche come quella del Po nel 2022.",["Non è corretto. L'Italia ha fiumi significativi (Po, Adige, Arno, Tevere) e buone precipitazioni medie. Il problema non è la mancanza di acqua in assoluto.","Esatto! L'Italia ha precipitazioni medie di 800-900 mm/anno, ma: 1) sono concentrate in primavera e autunno, non in estate quando serve di più; 2) si raccoglie solo il 13% in bacini artificiali (vs. 40% della Spagna). Il problema è infrastrutturale e di distribuzione temporale.","Non è corretto. Il consumo domestico italiano (circa 220 L/giorno) è nella media europea. Il problema non è il consumo domestico ma la combinazione di siccità estiva e infrastrutture inadeguate.","Non è corretto. L'Italia non importa acqua da altri paesi. Le sue risorse idriche sono locali. Il problema è la gestione delle risorse disponibili."]],["Un comune italiano vuole costruire un nuovo quartiere residenziale in un'area precedentemente verde. Quali misure di invarianza idraulica deve prevedere?",["Costruire solo edifici alti per ridurre la superficie impermeabile totale del lotto","Combinare pavimentazioni permeabili, vasche di laminazione sotterranee, tetti verdi e giardini della pioggia per mantenere il deflusso pre-costruzione","Piantare alberi in numero sufficiente per assorbire tutta l'acqua piovana che cade nel quartiere","Installare pompe che raccolgono l'acqua piovana e la pompano nelle fognature con portata controllata"],1,"L'invarianza idraulica si realizza con una combinazione di misure: 1) pavimentazioni permeabili (parcheggi, vialetti); 2) vasche di laminazione sotterranee che trattengono l'acqua durante i picchi di pioggia e la rilasciano lentamente; 3) tetti verdi che trattengono fino all'80% dell'acqua; 4) giardini della pioggia (rain gardens) che raccolgono il deflusso. L'obiettivo: il quartiere deve 'comportarsi' idrologicamente come il verde preesistente.",["Non è corretto. Gli edifici alti su impronta ridotta aiutano, ma non compensano completamente la perdita di permeabilità. Servono misure specifiche di gestione dell'acqua piovana.","Esatto! La combinazione ottimale: pavimentazioni permeabili nei parcheggi e strade secondarie, vasche di laminazione sotterranee nei punti più bassi, tetti verdi sugli edifici, giardini della pioggia nei cortili. L'obiettivo: deflusso post-costruzione = deflusso pre-costruzione.","Non è corretto. Gli alberi contribuiscono (intercettazione fogliare, evapotraspirazione) ma non possono compensare completamente la perdita di permeabilità del suolo. Servono misure infrastrutturali specifiche.","Non è corretto. Pompare l'acqua in fognatura potrebbe non rispettare l'invarianza idraulica se la fognatura non ha capacità sufficiente. Le misure di invarianza devono ridurre il deflusso, non semplicemente spostarlo."]],["Come calcoli l'impronta idrica di un pasto con 150g di carne bovina (15.000 L/kg), 80g di pasta (1.500 L/kg) e 100g di insalata (130 L/kg)?",["2.250 + 120 + 13 = 2.383 litri","15.000 + 1.500 + 130 = 16.630 litri","15.000 × 3 = 45.000 litri perché ci sono tre ingredienti","Non si può calcolare perché i metodi di produzione variano da azienda ad azienda"],0,"Impronta idrica: carne (0,15 kg × 15.000) = 2.250 L + pasta (0,08 kg × 1.500) = 120 L + insalata (0,10 kg × 130) = 13 L = totale 2.383 litri. La carne bovina (150g) rappresenta il 94% dell'impronta idrica dell'intero pasto. Confronta con un pasto vegetariano equivalente: pasta (120L) + verdure (20L) = ~140 litri. Differenza: 17 volte.",["Esatto! 0,15 kg × 15.000 L/kg = 2.250 L (carne) + 0,08 kg × 1.500 L/kg = 120 L (pasta) + 0,10 kg × 130 L/kg = 13 L (insalata) = 2.383 litri totali. La carne rappresenta il 94% dell'impronta idrica del pasto.","Non è corretto. Non si sommano i valori per kg: bisogna moltiplicare ciascun valore per il peso effettivo della porzione (espresso in kg, non in grammi).","Non è corretto. Si calcola per ogni ingrediente moltiplicando il suo peso in kg per l'impronta idrica per kg. Non si moltiplica per il numero di ingredienti.","Non è corretto. I valori di impronta idrica per alimento sono medie standard usate per confronti orientativi. Non richiedono dati specifici di ogni singola azienda."]],["Un ingegnere idraulico deve scegliere tra clorazione e UV per trattare l'acqua di un piccolo acquedotto. Quali fattori determinano la scelta?",["Solo il costo dell'energia elettrica: la scelta è esclusivamente economica","La lunghezza della rete di distribuzione: per reti lunghe il cloro è necessario per l'effetto residuo; per impianti chiusi piccoli gli UV possono essere sufficienti","Il pH dell'acqua: cloro per acque acide, UV per acque basiche","La stagione: cloro in estate, UV in inverno, per ragioni di efficacia biologica"],1,"Il fattore chiave: il cloro mantiene l'effetto antimicrobico lungo tutta la rete di distribuzione (effetto residuo). Gli UV agiscono solo nell'impianto. Per acquedotti con reti lunghe (km), il cloro è necessario. Per sistemi chiusi di piccola dimensione (edificio, piccola comunità), gli UV possono essere sufficienti — e non lasciano sapore.",["Non è corretto. Il costo è un fattore ma non l'unico. La caratteristica tecnica fondamentale (effetto residuo in rete) è il fattore determinante per la sicurezza.","Esatto! Per reti lunghe (decine o centinaia di km), il cloro è necessario perché mantiene l'effetto antimicrobico lungo tutto il percorso. Per sistemi chiusi o brevi (es. impianto di un edificio), gli UV possono bastare.","Non è corretto. Sia il cloro che gli UV funzionano in un ampio range di pH. Il fattore determinante è l'effetto residuo in rete, non il pH dell'acqua.","Non è corretto. Cloro e UV non hanno stagionalità specifica. Il fattore determinante è la necessità di effetto residuo nella rete di distribuzione."]],["L'Italia perde il 42% dell'acqua in rete. Se rinnovasse le tubature riducendo le perdite al 15% (standard tedesco), quanta acqua risparmierebbe su 10 miliardi di m³ immessi annualmente?",["Risparmierebbe 2,7 miliardi di m³, che è il 27% dei 10 miliardi immessi","Risparmierebbe 4,2 miliardi di m³, eliminando tutte le perdite attuali","Risparmierebbe 570 milioni di m³, meno di quanto appare","Non si può calcolare senza conoscere la distribuzione delle perdite per regione"],0,"Perdite attuali: 42% × 10 mld m³ = 4,2 mld. Perdite target (15%): 15% × 10 mld = 1,5 mld. Risparmio: 4,2 - 1,5 = 2,7 miliardi di m³ all'anno. Per riferimento: 2,7 miliardi di m³ è più del consumo annuo di acqua dell'intera Lombardia. Acqua già potabilizzata, già pompata, che invece di disperdersi nelle tubature arriverebbe agli utenti.",["Esatto! Perdite attuali: 42% di 10 miliardi = 4,2 miliardi. Perdite target: 15% di 10 miliardi = 1,5 miliardi. Risparmio: 4,2 - 1,5 = 2,7 miliardi di m³. Acqua già potabilizzata e pompata che invece di disperdersi arriverebbe agli utenti.","Non è corretto. Il target non è zero perdite ma 15% (standard tedesco). Il risparmio è la differenza tra 42% e 15%, non il 42% totale. 4,2 miliardi - 1,5 miliardi = 2,7 miliardi.","Non è corretto. Il calcolo è: (42% - 15%) × 10 miliardi = 27% × 10 miliardi = 2,7 miliardi di m³. Non 570 milioni.","Non è corretto. Si può calcolare la stima nazionale con i dati forniti. La distribuzione regionale serve per pianificare gli interventi ma non è necessaria per il calcolo totale."]],["Perché il ciclo naturale dell'acqua e quello artificiale urbano spesso entrano in conflitto?",["Perché le citta estraggono troppa acqua piovana dall'atmosfera alterando il ciclo delle nuvole","Perché le superfici impermeabili delle città alterano il ciclo naturale (riducendo l'infiltrazione, aumentando il deflusso) e le estrazioni di falda possono superare la capacità di ricarica naturale","Perché i depuratori scaricano acqua troppo fredda nei fiumi alterando gli ecosistemi acquatici","Perché i canali artificiali cambiano il percorso naturale dei fiumi creando allagamenti in pianura"],1,"Il ciclo artificiale urbano entra in conflitto con quello naturale su due fronti principali: 1) impermeabilizzazione (asfalto, cemento riduce l'infiltrazione, aumenta il deflusso superficiale e diminuisce la ricarica delle falde); 2) estrazioni (prelievi dalle falde che in certi periodi superano la ricarica naturale, abbassando progressivamente la falda). La città altera la geometria idrologica del territorio.",["Non è corretto. Le città non 'estraggono' acqua dall'atmosfera in modo significativo. Il conflitto è a livello del suolo e dei corsi d'acqua.","Esatto! Le città impermeabilizzano il suolo (asfalto, cemento) riducendo l'infiltrazione e aumentando il deflusso superficiale: il ciclo naturale si altera. Le estrazioni di falda possono superare la ricarica naturale annuale, abbassando progressivamente le falde.","Non è corretto. La temperatura dell'acqua depurata è raramente un problema critico. Il conflitto principale tra ciclo naturale e artificiale è l'impermeabilizzazione del suolo e le estrazioni.","Non è corretto. Le opere idrauliche (canalizzazioni, arginature) modificano il percorso dei fiumi, ma il conflitto principale del testo riguarda l'impermeabilizzazione e le estrazioni di falda."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
