<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Detective delle fonti</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-DIG-1-02","F":[["Come funziona Google quando cerchi qualcosa? Quale affermazione è corretta?",["Cerca in tempo reale tutte le pagine di internet che contengono le tue parole","Consulta un indice già costruito in anticipo, poi ordina i risultati con un algoritmo di ranking","Mostra solo le pagine che altri utenti hanno valutato con cinque stelle","Mostra prima le pagine che hanno pagato Google per apparire nei risultati"],1,"Google usa crawler (ragni) che esplorano il web continuamente e costruiscono un enorme indice. Quando cerchi qualcosa, l'algoritmo di ranking — tra cui il PageRank — non naviga internet: consulta quell'indice e ordina i risultati in millisecondi.",["Non è corretto. Google non naviga internet in tempo reale quando cerchi: sarebbe troppo lento. Consulta un indice già costruito in anticipo dai suoi crawler.","Esatto. Il processo ha tre fasi: crawling (ragni esplorano il web), indicizzazione (ogni pagina viene catalogata), ranking (l'algoritmo ordina i risultati per autorevolezza, pertinenza e freschezza).","Non è corretto. Google non usa valutazioni esplicite degli utenti. Il comportamento degli utenti (tempo sulla pagina, clic) è uno dei molti fattori automatici, non l'unico.","Non è corretto. I risultati a pagamento (annunci) sono separati e chiaramente etichettati. La maggior parte dei risultati è organica e non dipende da pagamenti."]],["Cosa misura il PageRank di Google per decidere quale pagina è più autorevole?",["Il numero totale di parole contenute nella pagina","Quanti siti autorevoli rimandano a quella pagina con un link","Quante volte la pagina è stata aggiornata nell'ultimo mese","Quante pubblicità contiene la pagina rispetto al testo"],1,"Il PageRank — inventato da Larry Page nel 1998 — ordina le pagine in base a quanti link ricevono da altri siti autorevoli. È simile al sistema di citazioni nella ricerca scientifica: una fonte è credibile se molti esperti la citano. Ma attenzione: Google misura autorevolezza percepita, non veridicità.",["Non è corretto. La lunghezza del testo non determina l'autorevolezza. Una pagina breve scritta da un'università autorevole può superare in classifica pagine lunghissime di scarsa qualità.","Esatto. Il PageRank funziona come un sistema di citazioni: se molti siti autorevoli rimandano a una pagina, quella pagina viene considerata autorevole. Più autorevole è chi linka, più vale il link.","Non è corretto. La freschezza è uno dei fattori del ranking ma non è il PageRank. Il PageRank misura l'autorevolezza tramite i link in entrata, non la frequenza di aggiornamento.","Non è corretto. Le pubblicità non aumentano l'autorevolezza — anzi, una densità eccessiva di annunci può ridurre il ranking. Il PageRank si basa sui link in entrata da siti autorevoli."]],["Nel metodo SIFT per valutare le fonti, cosa significa la S?",["Scrivi — prendi nota del contenuto prima di condividere","Seleziona — scegli solo le fonti con dominio .gov o .edu","Stop — Fermati prima di reagire o condividere","Studia — leggi l'articolo per intero prima di giudicarlo"],2,"SIFT è un metodo in 4 passi: Stop (Fermati), Investigate the source (Indaga la fonte), Find better coverage (Trova copertura migliore), Trace claims (Risali alla fonte originale). Il primo passo — Stop — è il più critico: le fake news progettano titoli emotivamente forti per impedire alla mente critica di attivarsi.",["Non è corretto. SIFT non include un passo di scrittura. La S sta per Stop: fermarsi prima di reagire o condividere. È il passo più importante perché blocca la reazione impulsiva.","Non è corretto. Il metodo SIFT non si riduce a filtrare per dominio. La S sta per Stop: è un invito a rallentare prima di condividere, qualunque sia la fonte.","Esatto. La S di SIFT è Stop: fermati prima che la reazione emotiva ti porti a condividere senza pensare. Le fake news usano titoli che vogliono farti reagire di impulso — fermarsi è la prima difesa.","Non è corretto. Leggere per intero è utile ma non è il primo passo SIFT. La S è Stop: fermarsi prima ancora di leggere, per decidere consapevolmente se vale la pena approfondire."]],["Quale dominio offre generalmente la più alta affidabilità per contenuti scientifici accademici?",[".com",".org",".edu",".gov"],2,"Il dominio .edu è riservato alle università americane accreditate: non può essere registrato da privati o aziende. I siti .edu pubblicano generalmente ricerche scientifiche peer-reviewed. Il dominio .gov indica istituzioni governative — ufficiali, ma non necessariamente neutrali. Il dominio .org è molto variabile. Il dominio .com non dice nulla sulla qualità del contenuto.",["Non è corretto. Il dominio .com è commerciale e non fornisce nessuna informazione sulla natura del sito. Chiunque può registrare un .com — aziende, privati, siti di disinformazione.","Non è corretto. Il dominio .org è riservato alle organizzazioni non profit, ma l'affidabilità varia moltissimo: da Wikipedia a organizzazioni lobbistiche. Non è una garanzia di qualità scientifica.","Esatto. Il dominio .edu è riservato alle università americane riconosciute — non può essere registrato liberamente. I siti .edu pubblicano ricerche peer-reviewed e contenuti accademici verificati.","Non è corretto. Il dominio .gov indica istituzioni governative, non universitarie. I contenuti .gov sono ufficiali ma possono avere interessi politici. Per contenuti scientifici accademici, .edu è lo standard più affidabile."]],["Qual è la caratteristica più importante che permette a una fake news di diffondersi rapidamente?",["È scritta in modo semplice, senza parole difficili","Contiene un titolo emotivamente forte che suscita paura, rabbia o indignazione","Viene pubblicata prima sui siti .gov per sembrare ufficiale","È scritta da persone con molti follower che la condividono per prime"],1,"Le fake news hanno quasi sempre: un nucleo di verità, un titolo emotivamente forte, un'estetica credibile e una risonanza con credenze preesistenti. Il titolo emotivo è il principale motore di diffusione: attiva paura o rabbia, che riducono il pensiero critico e aumentano la condivisione impulsiva. Secondo il MIT 2018, sono le persone — non i bot — a diffonderle 6 volte più velocemente delle notizie vere.",["Non è corretto. La semplicità del linguaggio aiuta ma non spiega la velocità di diffusione. La ricerca MIT mostra che il fattore chiave è la risposta emotiva — non la leggibilità.","Esatto. Le fake news usano titoli che attivano emozioni forti. Il cervello in stato emotivo riduce il pensiero critico e aumenta la probabilità di condividere prima di verificare. Le persone (non i bot) sono il vettore principale.","Non è corretto. I siti di fake news non hanno accesso ai domini .gov. La diffusione avviene sui social media, dove chiunque può condividere qualsiasi contenuto.","Non è corretto. Molte fake news si diffondono senza un influencer iniziale. Lo studio MIT mostra che la novità e il contenuto emotivo spiegano la velocità di diffusione meglio del numero di follower."]],["Cos'è il bias di conferma?",["Un errore tecnico dei motori di ricerca che mostra solo risultati simili a quelli già cercati","La tendenza a cercare, notare e credere informazioni che confermano le nostre credenze preesistenti","Un sistema automatico dei social media che conferma le notizie prima di mostrarle","Il messaggio di conferma che i siti inviano quando ti registri con l'email"],1,"Il bias di conferma è la tendenza a cercare, notare e ricordare informazioni che confermano quello che già crediamo, ignorando quelle contrarie. È evolutivamente utile (riduce lo sforzo cognitivo), ma problematico: ci rende tutti vulnerabili alla disinformazione. Chi crea fake news lo sfrutta: i contenuti più efficaci mirano a confermare paure o credenze preesistenti del pubblico target.",["Non è corretto. Quella è la filter bubble — un effetto degli algoritmi. Il bias di conferma è un meccanismo psicologico umano: la tendenza a credere informazioni che confermano quello che già pensiamo.","Esatto. Il bias di conferma è evolutivamente utile (elaborare meno informazioni risparmia energia cognitiva), ma nell'era dell'informazione digitale diventa un punto debole che le fake news sfruttano deliberatamente.","Non è corretto. I social media non verificano le notizie prima di mostrarle. Il bias di conferma è un fenomeno psicologico interno, non un sistema esterno di verifica.","Non è corretto. La 'conferma' nel bias di conferma riguarda le credenze, non le email. È la tendenza psicologica a filtrare la realtà in modo che confermi quello che già crediamo."]]],"I":[["A cosa serve l'operatore 'site:' in una ricerca su Google?",["Mostra la mappa del sito (sitemap) con tutte le pagine disponibili","Limita i risultati alle pagine di un dominio specifico (es. site:nasa.gov cerca solo nella NASA)","Cerca solo nelle barre laterali dei siti web, dove ci sono spesso le informazioni più importanti","Verifica se un sito ha un certificato di sicurezza SSL valido (https)"],1,"L'operatore site: è uno degli strumenti più potenti per trovare fonti affidabili. Esempi: 'fotosintesi site:edu' trova pagine universitarie americane; 'inquinamento atmosferico site:who.int' cerca solo nel sito dell'OMS. Combinato con altri operatori (es. filetype:pdf) diventa ancora più preciso.",["Non è corretto. L'operatore site: non mostra una mappa. Filtra i risultati di ricerca limitandoli alle pagine di un dominio specifico. Per vedere la struttura di un sito si usa altri strumenti.","Esatto. 'cambiamento climatico site:nasa.gov' mostra solo le pagine della NASA sull'argomento. È lo strumento più utile per trovare informazioni verificate su siti istituzionali specifici.","Non è corretto. Il 'site' di site: si riferisce al sito web (dominio), non alle colonne laterali della pagina. L'operatore filtra per dominio, non per posizione del testo nella pagina.","Non è corretto. La verifica del certificato SSL si vede dall'icona del lucchetto nel browser, non dall'operatore site:. Quest'ultimo è un filtro di ricerca per dominio."]],["Cos'è il 'lateral reading' (lettura laterale) e perché i fact-checker lo preferiscono alla lettura approfondita della pagina?",["Leggere l'articolo dall'inizio alla fine più volte per trovare contraddizioni interne","Invece di leggere in profondità una pagina, aprire nuove schede per cercare cosa dicono fonti esterne su quella fonte","Leggere solo le colonne laterali e i box evidenziati dove si trova il riassunto delle notizie principali","Confrontare la notizia in italiano con la versione originale in inglese per verificare le traduzioni"],1,"I ricercatori di Stanford hanno scoperto che i fact-checker professionisti dedicano pochissimo tempo a leggere la pagina in questione. Aprono subito nuove schede per cercare: 'Chi è questo sito?', 'Altri parlano di questa fonte?'. Se la fonte è affidabile, si trovano citazioni positive. Se è inaffidabile, si trovano probabilmente smentite o avvertimenti. La lettura approfondita di una sola pagina non ti dice nulla sulla sua affidabilità.",["Non è corretto. Quella è la lettura approfondita — esattamente ciò che il lateral reading evita. Leggere in profondità una pagina non ti dice se la fonte è affidabile.","Esatto. I fact-checker professionisti usano questa tecnica: invece di leggere l'articolo in profondità, aprono subito nuove schede e cercano cosa dicono altre fonti su quel sito o su quell'affermazione. È molto più efficiente.","Non è corretto. Il 'laterale' del lateral reading non si riferisce alla posizione nella pagina, ma all'apertura di fonti esterne parallele per valutare l'affidabilità della fonte originale.","Non è corretto. Il lateral reading non riguarda la comparazione linguistica. Si tratta di cercare informazioni sulla fonte in siti terzi indipendenti, indipendentemente dalla lingua."]],["Secondo la ricerca MIT del 2018 su 126.000 storie su Twitter, quante volte più velocemente si diffondono le fake news rispetto alle notizie vere? E chi è il responsabile principale?",["2 volte più velocemente; responsabili i bot automatici","6 volte più velocemente; responsabili le persone, non i bot","10 volte più velocemente; responsabili i bot automatici","Alla stessa velocità; la differenza è nella durata, non nella velocità iniziale"],1,"Lo studio MIT del 2018 (pubblicato su Science) ha analizzato 126.000 storie condivise su Twitter tra il 2006 e il 2017. Risultato: le notizie false si diffondono 6 volte più velocemente di quelle vere. Sorprendentemente, i bot non sono la causa principale: sono le persone a condividerle di più. Il motivo è psicologico: le fake news usano contenuti più emotivamente coinvolgenti, che stimolano la condivisione impulsiva.",["Non è corretto su entrambi i punti. Le fake news si diffondono 6 volte più velocemente, non 2. E la ricerca MIT ha dimostrato che sono le persone — non i bot — a essere responsabili della maggior parte delle condivisioni.","Esatto. La ricerca MIT (Vosoughi, Roy, Aral, 2018) su 126.000 storie Twitter (2006-2017) ha mostrato che le fake news viaggiano 6 volte più veloci delle vere, e che le persone sono il principale vettore di diffusione.","Non è corretto. Il dato corretto è 6 volte, non 10. E la ricerca MIT ha mostrato che i bot diffondono sia notizie vere sia false in misura simile: la differenza è fatta dagli esseri umani.","Non è corretto. La ricerca MIT ha misurato una differenza significativa nella velocità di diffusione iniziale: 6 volte più veloce per le fake news. Le notizie false raggiungono 1.500 persone in un sesto del tempo rispetto alle notizie vere."]],["Cos'è la 'filter bubble' e chi ha coniato il termine?",["Un sistema di controllo parentale che filtra i contenuti inappropriati per i minori; creato da Facebook","La bolla di contenuti personalizzati che gli algoritmi creano mostrando sempre di più ciò con cui hai già interagito; il termine è di Eli Pariser (2011)","Un filtro antispam che blocca le email indesiderate; inventato da Google nel 2004","Un errore di programmazione che fa vedere gli stessi annunci pubblicitari ripetutamente; scoperto da Apple nel 2019"],1,"Eli Pariser coniò il termine 'filter bubble' nel 2011 per descrivere il fenomeno per cui gli algoritmi dei social media e dei motori di ricerca mostrano contenuti sempre più simili a quelli con cui hai già interagito. Il risultato è una versione personalizzata di internet che restringe progressivamente i punti di vista ai quali sei esposto. La stessa ricerca su Google dà risultati diversi a persone diverse in base al loro profilo.",["Non è corretto. La filter bubble non è un sistema di controllo genitoriale. È un effetto non intenzionale degli algoritmi di raccomandazione, descritto da Eli Pariser nel 2011.","Esatto. Eli Pariser, nel libro 'The Filter Bubble' (2011), descrisse come gli algoritmi di personalizzazione creino una versione di internet sempre più ristretta, basata sulla cronologia dell'utente.","Non è corretto. La filter bubble riguarda la personalizzazione dei feed dei social media e dei risultati di ricerca, non i filtri antispam. Il concetto fu introdotto da Eli Pariser nel 2011.","Non è corretto. La filter bubble è un effetto deliberato (anche se con conseguenze non previste) degli algoritmi di personalizzazione. Fu teorizzata da Eli Pariser nel 2011, non da Apple nel 2019."]],["Cosa significa in pratica il passo T (Trace) del metodo SIFT?",["Traccia una mappa concettuale dell'argomento prima di cercare informazioni","Risalire alla fonte originale dei dati, delle citazioni e delle immagini — non fermarsi al riassunto dell'articolo","Tradurre l'articolo in un'altra lingua per verificare se il significato cambia","Telefonare direttamente all'autore dell'articolo per chiedergli le fonti"],1,"Il passo T (Trace claims, quotes and media) è il passo più 'investigativo' di SIFT: risalire alla fonte primaria. Se un articolo dice 'uno studio dimostra che X', cerca quello studio su Google Scholar. Se usa un'immagine, fai una ricerca inversa (reverse image search) per trovare l'originale. Spesso si scopre che il dato originale diceva qualcosa di molto più sfumato del titolo dell'articolo.",["Non è corretto. Il passo T non riguarda la mappatura concettuale. Trace claims significa risalire alla fonte originale dei dati, delle citazioni e delle immagini usate nell'articolo.","Esatto. Se un articolo cita uno studio, non fermarti all'interpretazione del giornalista: cerca lo studio originale su Google Scholar e leggi cosa dice davvero. Spesso la distanza tra il dato originale e il titolo è enorme.","Non è corretto. Il passo T non riguarda la traduzione. Significa tracciare il percorso indietro fino alla fonte primaria: lo studio originale, l'immagine originale, il dato originale.","Non è corretto. Il passo T è un processo di ricerca autonomo online. Si tratta di cercare la fonte originale su Google Scholar, reverse image search, o siti istituzionali — non di contattare l'autore."]],["Quale query di ricerca avanzata troverebbe articoli sul cambiamento climatico SOLO nel sito ufficiale della NASA?",["cambiamento climatico OR nasa","\"cambiamento climatico\" -nasa","cambiamento climatico site:nasa.gov","cambiamento climatico filetype:nasa"],2,"Gli operatori di ricerca avanzata di Google permettono di affinare i risultati: site: filtra per dominio, filetype: filtra per tipo di file, \" \" cerca la frase esatta, - esclude parole, OR cerca l'una o l'altra. La query 'cambiamento climatico site:nasa.gov' mostra solo le pagine NASA sull'argomento — uno strumento fondamentale per trovare dati istituzionali verificati.",["Non è corretto. L'operatore OR allarga la ricerca (cerca l'uno O l'altro). Questa query cercherebbe qualsiasi articolo che contenga 'cambiamento climatico' oppure 'nasa', non solo quello della NASA.","Non è corretto. L'operatore - esclude una parola. Questa query cercherebbe articoli con 'cambiamento climatico' che NON menzionano 'nasa' — esattamente il contrario di quello che si vuole.","Esatto. L'operatore site:nasa.gov limita i risultati alle sole pagine del dominio nasa.gov. È la combinazione più efficace per trovare informazioni verificate su un argomento specifico in una fonte istituzionale.","Non è corretto. L'operatore filetype: indica il tipo di file (es. filetype:pdf), non il dominio. 'filetype:nasa' non è un tipo di file valido e non darebbe risultati utili."]]],"A":[["Secondo il D.M. 183/2024 (Traguardo D1 di Cittadinanza digitale), perché saper valutare le fonti online è un atto di cittadinanza democratica e non solo un'abilità tecnica?",["Perché le persone che sanno usare Google trovano lavoro più facilmente","Perché la disinformazione erode la fiducia nelle istituzioni e può influenzare elezioni — e il SDG 16.10 garantisce il diritto all'accesso all'informazione","Perché la legge italiana obbliga a verificare le fonti prima di qualsiasi condivisione sui social","Perché i siti che diffondono fake news pagano meno tasse e danneggiano l'economia"],1,"Il D.M. 183/2024 — Linee guida per l'Educazione Civica — identifica la competenza di valutare criticamente le fonti come Traguardo D1 di Cittadinanza digitale. Il motivo è politico e democratico: la disinformazione ha dimostrato di poter influenzare elezioni (caso Cambridge Analytica), indebolire la fiducia in istituzioni scientifiche (negazionismo climatico, no-vax), e violare il diritto all'informazione garantito dall'SDG 16.10 dell'Agenda 2030.",["Non è corretto. Il Traguardo D1 riguarda la partecipazione democratica, non le opportunità lavorative. La valutazione delle fonti è collegata al diritto all'informazione e alla capacità di partecipare al dibattito pubblico in modo consapevole.","Esatto. Saper distinguere fonti affidabili da disinformazione è un atto di cittadinanza attiva: la disinformazione può condizionare il voto, indebolire la fiducia nelle istituzioni democratiche, e limitare di fatto il diritto all'informazione sancito dall'SDG 16.10.","Non è corretto. Non esiste un obbligo legale di verificare le fonti prima di condividere. Il punto del D.M. 183/2024 è la formazione di cittadini consapevoli, non un vincolo normativo sulla condivisione.","Non è corretto. Il collegamento tra valutazione delle fonti e cittadinanza democratica riguarda il diritto all'informazione e la tenuta delle istituzioni, non la fiscalità dei siti web."]],["Google personalizza i risultati di ricerca in base al profilo di ogni utente. Qual è l'implicazione più problematica per la qualità del dibattito pubblico?",["Che gli studenti vedono risultati diversi da quelli degli adulti, rendendo impossibile studiare insieme","Che persone diverse vedono versioni diverse della stessa realtà: non esiste 'la stessa Google' per tutti, rendendo più difficile trovare un terreno comune nel dibattito pubblico","Che Google guadagna di più mostrando pubblicità personalizzate, e questo è sleale verso i concorrenti","Che i risultati personalizzati sono meno precisi tecnicamente rispetto ai risultati uguali per tutti"],1,"La personalizzazione dei risultati di ricerca crea un problema strutturale per il dibattito democratico: due cittadini che cercano lo stesso argomento politico o scientifico possono trovare risultati radicalmente diversi, costruendo visioni incompatibili della stessa realtà. Il termine 'echo chamber' descrive l'effetto amplificato: non solo vedi meno punti di vista diversi, ma la tua visione viene continuamente confermata. Questo si collega direttamente al Traguardo D1 del D.M. 183/2024.",["Non è corretto. La differenza per fascia d'età è un effetto marginale. Il problema principale è che persone diverse vedono versioni diverse della stessa realtà sull'intera gamma di argomenti — politica, scienza, attualità.","Esatto. Se la mia Google sul cambiamento climatico mi mostra fonti negazioniste e la tua mostra dati IPCC, partiamo da premesse diverse sulla stessa realtà. Questo rende il dibattito pubblico strutturalmente più difficile.","Non è corretto. La questione economica è reale ma non è il problema principale per il dibattito pubblico. L'implicazione più grave è la frammentazione dell'informazione condivisa in 'versioni personalizzate' della realtà.","Non è corretto. La personalizzazione spesso migliora la pertinenza dei risultati per l'utente. Il problema non è la qualità tecnica ma l'effetto politico: persone diverse costruiscono visioni diverse del mondo."]],["Un sito ha ricevuto milioni di link in entrata ed è altamente popolare: Google lo mostra sempre in cima. Questo garantisce che il suo contenuto sia vero?",["Sì — Google verifica la veridicità delle informazioni prima di assegnare un alto PageRank","No — Google valuta autorevolezza percepita e popolarità, non la veridicità. Una pagina molto popolare può contenere informazioni false","Dipende: se il sito ha dominio .com garantisce la veridicità, se ha dominio .org no","Sì — se molti siti autorevoli rimandano a una pagina, è perché la giudicano vera"],1,"Questa è una delle illusioni più pericolose dell'era digitale: 'se Google lo mette primo, è vero.' Google non valuta la veridicità dei contenuti: misura autorevolezza percepita (quanti link autorevoli puntano alla pagina), pertinenza e comportamento degli utenti. Una disinformazione molto condivisa può scalare i risultati. La posizione nei risultati di ricerca non è una garanzia di veridicità — il metodo SIFT è necessario proprio per questo.",["Non è corretto. Google non verifica la veridicità dei contenuti. L'algoritmo misura autorevolezza percepita (link in entrata) e comportamento degli utenti — non se le informazioni sono vere o false.","Esatto. Questa è una delle trappole più insidiose: identificare 'primo risultato di Google' con 'informazione vera'. Google non ha un rilevatore di bugie. Un sito popolare con molti link può diffondere disinformazione.","Non è corretto. Il tipo di dominio non determina la veridicità. Un .com può pubblicare ricerche scientifiche verificate, e un .org può diffondere disinformazione. La veridicità deve essere verificata indipendentemente dal ranking.","Non è corretto. I link possono essere costruiti artificialmente (link farms), acquistati, o provenire da siti che non hanno verificato il contenuto. La popolarità misura diffusione, non accuratezza."]],["La storia 'le banane sono radioattive e fanno male alla salute' è un esempio classico di disinformazione. Quale tecnica specifica utilizza?",["Fabricazione — la storia è inventata completamente, senza nessun elemento reale","Decontestualizzazione — fatto vero (le banane contengono potassio-40) presentato senza il contesto che ne riduce il significato allarmante","Impersonazione — la storia è attribuita falsamente a un'agenzia scientifica come l'OMS","Clickbait — il titolo è volutamente esagerato per ricevere più clic, ma il testo spiega la verità"],1,"La decontestualizzazione è una delle tecniche di disinformazione più difficili da riconoscere perché parte da dati reali. Nel caso delle banane: è vero che contengono potassio-40 (radioattivo). Ma il contesto omesso è che la dose è circa 0,1 microsievert — miliardi di volte sotto la soglia di rischio. Rimuovere il contesto trasforma un fatto scientifico neutro in un allarme infondato. Il passo T di SIFT — risalire alla fonte originale — è la difesa specifica contro questa tecnica.",["Non è corretto. La storia non è inventata: le banane contengono davvero potassio-40, un isotopo radioattivo naturale. Il problema non è l'invenzione del fatto, ma la rimozione del contesto che ne cambia il significato.","Esatto. La decontestualizzazione è una delle forme più insidiose di disinformazione: usa fatti reali ma rimuove il contesto cruciale. Nel caso delle banane, il contesto è che il livello di radioattività è miliardi di volte sotto qualsiasi soglia di rischio.","Non è corretto. L'impersonazione implica falsificare l'autore. Nel caso delle banane, il problema è che un fatto vero viene presentato fuori contesto, non che si finga di citare un'autorità scientifica.","Non è corretto. Il clickbait è un titolo esagerato con contenuto che poi ridimensiona. Nella decontestualizzazione, la disinformazione è nel messaggio complessivo: fatto vero + contesto mancante = conclusione falsa."]],["Come il bias di conferma viene sfruttato deliberatamente da chi produce contenuti di disinformazione?",["Usando parole difficili e tecnicismi che la gente accetta senza capire","Creando contenuti che confermano paure e ostilità preesistenti del pubblico target — chi si irrita emotivamente condivide senza verificare","Pubblicando le notizie di notte quando le persone sono stanche e meno attente","Usando solo immagini, senza testo, perché le immagini bypassano il ragionamento critico"],1,"I creatori di disinformazione efficace non inventano credenze dal nulla: mappano le paure, le ostilità e le credenze preesistenti del pubblico target, poi producono contenuti che le confermano e le amplificano. La reazione emotiva (rabbia, paura, indignazione) riduce l'attività della corteccia prefrontale — la parte del cervello responsabile del pensiero critico — e aumenta la probabilità di condivisione impulsiva. La prima linea di difesa è riconoscere le proprie reazioni emotive: 'Questo mi fa arrabbiare molto? Prima di condividere, verifico.'",["Non è corretto. Il bias di conferma non si sfrutta con il tecnicismo: le fake news più efficaci usano linguaggio semplice e familiare. Il meccanismo è la risonanza con credenze preesistenti, non la difficoltà del linguaggio.","Esatto. La disinformazione efficace non contraddice le credenze del pubblico: le amplifica. Chi vede una notizia che conferma quello che già teme o odia è molto più propenso a condividerla — e meno propenso a verificarla.","Non è corretto. Il bias di conferma è un meccanismo cognitivo che funziona indipendentemente dall'orario. Il fattore chiave è la risonanza emotiva con le credenze preesistenti, non la stanchezza.","Non è corretto. Le fake news usano sia immagini sia testo. Il bias di conferma viene sfruttato attraverso il contenuto che risuona con le credenze preesistenti, non solo attraverso il formato visivo."]],["Qual è la differenza tra misinformazione e disinformazione?",["La misinformazione riguarda le notizie politiche, la disinformazione quelle scientifiche","Misinformazione = informazione falsa diffusa in buona fede (errore sincero); disinformazione = informazione falsa diffusa con intenzione deliberata di ingannare","La misinformazione è sempre più pericolosa perché si diffonde più velocemente della disinformazione","Sono sinonimi: entrambi i termini indicano qualsiasi notizia non verificata"],1,"La distinzione tra misinformazione (misinformation) e disinformazione (disinformation) è cruciale per il D.M. 183/2024 Traguardo D1: misinformazione = contenuto falso condiviso in buona fede (l'autore crede che sia vero); disinformazione = campagna deliberata che produce e diffonde contenuti falsi con l'intenzione di ingannare. Un terzo termine è 'malinformazione': informazione vera usata con l'intenzione di nuocere (es. far trapelare informazioni private). Riconoscere l'intenzione cambia la risposta: errore vs attacco deliberato all'informazione.",["Non è corretto. La distinzione non è tematica (politica vs scienza), ma riguarda l'intenzione di chi diffonde: la misinformazione è diffusa in buona fede (errore sincero), la disinformazione con intenzione deliberata di ingannare.","Esatto. La distinzione è nell'intenzione: chi diffonde misinformazione crede (erroneamente) che sia vera; chi diffonde disinformazione sa che è falsa e vuole ingannare. Questa distinzione cambia la risposta etica e legale.","Non è corretto. Non è detto che la misinformazione si diffonda più velocemente. La distinzione riguarda l'intenzione, non la velocità di diffusione. Entrambe possono essere pericolose.","Non è corretto. I due termini hanno significati distinti e importanti. La differenza è l'intenzionalità: misinformazione è diffusione inconsapevole di falso; disinformazione è campagna deliberata di inganno."]]]};

  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
</body>
</html>
