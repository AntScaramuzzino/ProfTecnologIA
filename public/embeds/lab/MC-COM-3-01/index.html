<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Mappa del Wi-Fi</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-COM-3-01","F":[["Cosa significa la parola 'telecomunicazione'?",["Comunicare a distanza","Comunicare via telefono","Comunicare in televisione","Comunicare in modo digitale"],0,"Telecomunicazione significa letteralmente comunicare a distanza. Il prefisso 'tele' viene dal greco e indica lontananza. Gli esseri umani comunicano a distanza da millenni, con fuochi, tamburi, torri di segnalazione, fino alle reti digitali moderne.",["Esatto! 'Tele' viene dal greco e significa 'lontano': telecomunicazione = comunicare a distanza.","Non è corretto. Il termine è più ampio: include qualsiasi forma di comunicazione a distanza, non solo il telefono.","Non è corretto. La televisione è un mezzo di telecomunicazione, non il significato del termine.","Non è corretto. Le telecomunicazioni esistevano già in forma analogica prima del digitale."]],["Chi inventò il telegrafo elettrico nel 1837?",["Samuel Morse","Alexander Graham Bell","Guglielmo Marconi","Tim Berners-Lee"],0,"Samuel Morse inventò il telegrafo elettrico nel 1837. Fu la prima tecnologia in grado di trasmettere messaggi complessi attraverso fili conduttori usando impulsi di corrente elettrica, aprendo l'era delle telecomunicazioni moderne.",["Esatto! Samuel Morse inventò il telegrafo elettrico nel 1837, permettendo per la prima volta di trasmettere messaggi complessi via filo conduttore.","Non è corretto. Bell inventò il telefono nel 1876, quarant'anni dopo il telegrafo.","Non è corretto. Marconi realizzò la prima trasmissione radio senza fili nel 1895, quasi 60 anni dopo il telegrafo.","Non è corretto. Berners-Lee inventò il World Wide Web nel 1991."]],["Cos'è un segnale digitale?",["Un segnale che usa solo due valori: 0 e 1","Un segnale che varia in modo continuo","Un segnale trasmesso solo via fibra ottica","Un segnale ad alta frequenza"],0,"Un segnale digitale usa solo due valori: 0 e 1 (spento/acceso). Qualsiasi informazione — voce, immagine, testo — viene convertita in una sequenza di 0 e 1 prima di essere trasmessa. Questa conversione si chiama digitalizzazione.",["Esatto! Un segnale digitale usa solo due valori (spento/acceso, 0/1), a differenza del segnale analogico che varia in modo continuo.","Non è corretto. Quello che descrivi è un segnale analogico, non digitale.","Non è corretto. I segnali digitali si trasmettono su molti tipi di supporto, non solo fibra ottica.","Non è corretto. La frequenza non è ciò che distingue un segnale digitale da uno analogico."]],["Cosa significa 'latenza' nelle reti mobili?",["Il ritardo nella trasmissione dei dati","La velocità massima di download","La copertura geografica della rete","Il numero di dispositivi connessi"],0,"La latenza è il ritardo nella trasmissione dei dati, misurato in millisecondi. Il 4G ha una latenza di 30-50 ms; il 5G la riduce a 1-10 ms. Questa differenza è cruciale per applicazioni in tempo reale come veicoli autonomi.",["Esatto! La latenza è il ritardo tra l'invio e la ricezione di un segnale. È misurata in millisecondi e distingue le generazioni di rete mobile.","Non è corretto. La velocità di download misura quanti dati si trasferiscono al secondo, non il ritardo.","Non è corretto. La copertura indica dove la rete è disponibile, non la latenza.","Non è corretto. Il numero di dispositivi connessi riguarda la capacità della rete, non la latenza."]],["Cosa fa un router nella rete?",["Collega reti diverse e instrada i pacchetti tra esse","Collega dispositivi all'interno della stessa rete locale","Traduce nomi di dominio in indirizzi IP","Amplifica il segnale Wi-Fi"],0,"Il router collega reti diverse e instrada i pacchetti tra esse basandosi sull'indirizzo IP. A casa connette la rete locale (LAN) alla rete dell'operatore (WAN). Diverso dallo switch, che collega dispositivi all'interno della stessa rete.",["Esatto! Il router connette reti diverse (es. la tua rete locale con Internet) e instrada i pacchetti basandosi sugli indirizzi IP.","Non è corretto. Quello che descrivi è la funzione di uno switch, non di un router.","Non è corretto. Quella è la funzione del DNS (Domain Name System), non del router.","Non è corretto. Il router può avere un access point Wi-Fi integrato, ma la sua funzione principale è instradare il traffico tra reti."]],["Quanti cavi sottomarini trasportano circa il 95% del traffico Internet mondiale?",["Circa 400 cavi sottomarini attivi","Circa 50 cavi sottomarini","Circa 20 cavi sottomarini","Circa 1.000 cavi sottomarini"],0,"Nel 2024 esistono circa 400 cavi sottomarini attivi, per una lunghezza totale superiore a 1,3 milioni di km. Questi cavi, spessi quanto un tubo da giardino esternamente, trasportano oltre il 95% di tutto il traffico Internet mondiale.",["Esatto! Nel 2024 esistono circa 400 cavi sottomarini attivi, per oltre 1,3 milioni di km di lunghezza totale, che trasportano più del 95% del traffico Internet globale.","Non è corretto. Il numero reale è molto superiore: circa 400 cavi nel 2024.","Non è corretto. Questo numero sarebbe insufficiente per connettere tutti i continenti con la banda necessaria.","Non è corretto. Il numero reale è inferiore: circa 400 cavi nel 2024."]]],"I":[["Perché la luce percorre 9.200 km da Roma a Tokyo in meno di 50 ms, ma il ritardo reale è circa 200 ms?",["I restanti 150 ms sono dovuti all'elaborazione nei router, conversioni digitali e routing","La fibra ottica trasmette la luce più lentamente dell'aria","Il segnale deve essere amplificato ogni 100 km, il che causa ritardi","Il cavo sottomarino non va in linea retta e percorre il doppio della distanza"],0,"La luce nella fibra ottica percorre 9.200 km in meno di 50 ms. I restanti 150 ms del ritardo reale (~200 ms totali) sono causati dall'elaborazione dei segnali nei router, dalle conversioni digitali e dal routing tra reti diverse lungo il percorso.",["Esatto! Il testo lo spiega nel box Fisica: il percorso fisico richiede meno di 50 ms, ma l'elaborazione nei nodi di rete aggiunge circa 150 ms.","Non è corretto. La luce nella fibra viaggia a ~200.000 km/s: la velocità è sufficiente per coprire la distanza in meno di 50 ms.","Non è corretto. Anche gli amplificatori contribuiscono, ma il testo indica i router e le conversioni digitali come cause principali.","Non è corretto. Il percorso più lungo spiega parte del ritardo, ma il testo identifica l'elaborazione nei router come causa principale."]],["Qual è la differenza pratica tra la banda 2,4 GHz e 5 GHz del Wi-Fi?",["2,4 GHz ha più portata ma meno velocità; 5 GHz ha meno portata ma più velocità","5 GHz ha sempre più portata e più velocità del 2,4 GHz","Le due bande sono equivalenti, si scelgono in base al dispositivo","2,4 GHz è sempre preferibile perché ha meno interferenze"],0,"Il 2,4 GHz offre maggiore portata (~30 m) e penetra meglio le pareti, ma ha velocità inferiore e più interferenze. Il 5 GHz è molto più veloce (fino a 3,5 Gbit/s) ma copre meno distanza (~15 m) e viene assorbito dai muri. Usa il 5 GHz vicino al router, il 2,4 GHz nelle stanze lontane.",["Esatto! Il 2,4 GHz arriva fino a ~30 m al chiuso e penetra meglio i muri; il 5 GHz è più veloce ma raggiunge solo ~15 m e viene assorbito dai muri.","Non è corretto. Il 5 GHz è più veloce ma ha portata inferiore e viene assorbito più facilmente dai muri.","Non è corretto. Le due bande hanno caratteristiche tecniche diverse e si scelgono in base a distanza e tipo di utilizzo.","Non è corretto. Il 2,4 GHz soffre di più interferenze (forni a microonde, Bluetooth) rispetto al 5 GHz."]],["Cosa garantisce il protocollo TCP rispetto al protocollo IP?",["Che tutti i pacchetti arrivino a destinazione e nel giusto ordine","Che i dati viaggino alla massima velocità possibile","Che i pacchetti prendano sempre lo stesso percorso","Che i dati siano cifrati durante la trasmissione"],0,"TCP (Transmission Control Protocol) garantisce che tutti i pacchetti arrivino a destinazione e nel giusto ordine. Se un pacchetto si perde, TCP chiede la ritrasmissione. IP invece si occupa solo di assegnare indirizzi e suddividere i dati in pacchetti.",["Esatto! TCP si occupa di garantire che tutti i pacchetti arrivino e nel giusto ordine. Se un pacchetto si perde, TCP lo ritrasmette.","Non è corretto. TCP è più lento ma affidabile. UDP è più veloce ma non garantisce la consegna.","Non è corretto. IP non garantisce percorsi fissi: i pacchetti possono passare per router diversi.","Non è corretto. La cifratura è gestita da protocolli come TLS/HTTPS, non da TCP."]],["Perché si preferisce il protocollo UDP al TCP per il gaming online in tempo reale?",["UDP è più veloce perché non garantisce la consegna di ogni pacchetto","UDP cifra i dati meglio di TCP","UDP usa indirizzi IP più efficienti","UDP comprime i dati in modo più efficiente"],0,"UDP (User Datagram Protocol) non garantisce che tutti i pacchetti arrivino a destinazione, ma è molto più veloce di TCP. Nel gaming online in tempo reale, la bassa latenza è fondamentale: è meglio perdere un pacchetto (e avere un piccolo 'lag') che aspettare la ritrasmissione.",["Esatto! UDP non aspetta la conferma di ricezione di ogni pacchetto, quindi è più veloce. In un gioco in tempo reale, perdere un pacchetto è meglio che attendere la ritrasmissione.","Non è corretto. UDP e TCP non differiscono per cifratura: entrambi trasmettono dati in chiaro senza HTTPS.","Non è corretto. UDP e TCP usano entrambi indirizzi IP: la differenza riguarda l'affidabilità della consegna.","Non è corretto. UDP non comprime i dati: la sua velocità deriva dall'assenza del meccanismo di conferma ricezione."]],["Cosa fa un firewall in una rete scolastica?",["Filtra il traffico in base a regole predefinite su indirizzi IP, porte e protocolli","Cifra tutte le comunicazioni della scuola","Aumenta la velocità della connessione Internet","Distribuisce la connessione tra tutti i dispositivi scolastici"],0,"Il firewall filtra il traffico di rete in entrata e uscita secondo regole predefinite. Controlla l'indirizzo IP di origine, la porta di destinazione e il tipo di protocollo. Nelle scuole, impedisce l'accesso a siti non appropriati e blocca connessioni non autorizzate.",["Esatto! Il firewall controlla ogni pacchetto in entrata e uscita secondo regole: da quale IP arriva, a quale porta è diretto, che protocollo usa.","Non è corretto. La cifratura è gestita da VPN o HTTPS, non dal firewall.","Non è corretto. Il firewall può rallentare leggermente il traffico per analizzarlo, ma il suo scopo è la sicurezza.","Non è corretto. La distribuzione della connessione è compito del router e degli switch."]],["Cosa NON garantisce una VPN gratuita, contrariamente a quanto si crede?",["L'anonimato completo, perché il server VPN conosce la tua identità","La cifratura del traffico","L'accesso a contenuti geograficamente limitati","La protezione su reti Wi-Fi pubbliche"],0,"Una VPN non garantisce l'anonimato: il server VPN sa sempre chi sei (ti ha fornito accesso). Rende più difficile, non impossibile, tracciare il traffico. Le VPN gratuite spesso vendono i dati degli utenti per finanziarsi — esattamente l'opposto del motivo per cui le si usa.",["Esatto! Una VPN non ti rende anonimo: il server VPN sa chi sei. Inoltre, una VPN gratuita spesso vende i tuoi dati per finanziarsi.","Non è corretto. Anche una VPN gratuita cifra il traffico tra te e il server VPN. Il problema è l'anonimato e la fiducia nel fornitore.","Non è corretto. Le VPN possono effettivamente sbloccare contenuti geograficamente limitati.","Non è corretto. Le VPN proteggono il traffico anche su reti Wi-Fi pubbliche non sicure."]]],"A":[["Il cavo sottomarino MAREA (2017) connette Virginia Beach e Bilbao: quali implicazioni politiche ha il fatto che sia di proprietà di Microsoft e Facebook?",["Concentra il controllo dell'infrastruttura di comunicazione globale in poche mani private","Rende il cavo più sicuro perché le aziende private investono in protezione","Riduce i costi per gli utenti finali grazie alle economie di scala","Garantisce che il traffico sia sempre neutrale e non monitorato"],0,"Quando Google, Meta, Microsoft e Amazon posseggono i cavi sottomarini, si concentra il controllo dell'infrastruttura di comunicazione globale in poche mani private. Il testo afferma esplicitamente che 'chi possiede i cavi possiede l'infrastruttura della comunicazione globale' con implicazioni politiche enormi.",["Esatto! Il testo sottolinea che chi possiede i cavi possiede l'infrastruttura della comunicazione globale — con implicazioni politiche che vanno oltre la tecnologia.","Non è corretto. Il testo non indica la sicurezza come conseguenza della proprietà privata, anzi evidenzia la vulnerabilità dei cavi.","Non è corretto. Il testo non collega la proprietà privata dei cavi ai costi per gli utenti.","Non è corretto. Il testo evidenzia proprio il contrario: la proprietà concentrata crea potenziali rischi per la neutralità."]],["Nel 2022, il vulcano Hunga Tonga recise i cavi sottomarini delle isole Tonga. Quale vulnerabilità sistemica evidenzia questo evento?",["Il 95% del traffico Internet globale dipende da infrastrutture fisiche facilmente danneggiabili","Le isole remote non dovrebbero dipendere da Internet","I satelliti potrebbero sostituire i cavi sottomarini in qualsiasi situazione","Solo i vulcani sono una minaccia reale per i cavi sottomarini"],0,"L'evento di Tonga (2022) dimostra che nonostante Internet sia progettata per essere distribuita e resiliente, la sua infrastruttura fisica — i cavi sottomarini — è vulnerabile. Circa 100.000 persone rimasero isolate per 5 settimane. La riparazione richiede navi specializzate che impiegano settimane.",["Esatto! L'evento di Tonga mostra che Internet, nonostante la sua architettura distribuita, dipende da cavi fisici vulnerabili. 100.000 persone rimasero isolate per 5 settimane.","Non è corretto. Il testo evidenzia la vulnerabilità dell'infrastruttura come problema sistemico, non suggerisce l'isolamento.","Non è corretto. Il testo non propone i satelliti come soluzione alternativa e non ne discute le limitazioni.","Non è corretto. Il testo cita anche ancore, terremoti e sabotaggi deliberati come minacce ai cavi."]],["Analizza la mappa Wi-Fi della tua scuola: perché un segnale di -80 dBm è considerato scarso?",["Perché i dBm sono logaritmici: -80 dBm è 1.000 volte più debole di -50 dBm","Perché -80 è un numero troppo grande per il Wi-Fi","Perché il router non è configurato correttamente a quella potenza","Perché gli standard Wi-Fi richiedono un segnale positivo"],0,"I dBm usano una scala logaritmica: ogni 10 dB di differenza corrispondono a un segnale 10 volte più forte o debole. Quindi -50 dBm è 10 volte più forte di -60 dBm, e 100 volte più forte di -70 dBm. Sotto -80 dBm la connessione diventa instabile perché il segnale è troppo debole rispetto al rumore di fondo.",["Esatto! I dBm usano una scala logaritmica dove ogni 10 dB corrispondono a un segnale 10 volte più forte. -50 dBm è ottimo; -80 dBm è sotto la soglia di stabilità.","Non è corretto. I dBm sono negativi: più vicino a zero = più forte il segnale. -40 dBm è eccellente, -80 dBm è scarso.","Non è corretto. Il valore in dBm indica la potenza del segnale ricevuto, non una configurazione del router.","Non è corretto. I valori dBm sono sempre negativi per i segnali Wi-Fi: più vicini a zero = più potenti."]],["La connessione Internet è lenta. Quale approccio sistematico permette di identificare la causa reale?",["Testare la velocità con speedtest.net e poi isolare il problema tra Wi-Fi, banda verso Internet, o server remoto","Riavviare il router: risolve sempre il problema","Chiedere all'operatore di aumentare la velocità della connessione","Passare sempre alla banda 5 GHz del Wi-Fi"],0,"Il testo insegna che la lentezza della connessione può dipendere da cause diverse: troppi dispositivi sull'access point, saturazione della banda dell'operatore, interferenze sul canale Wi-Fi, o problemi sul server remoto. Solo un test sistematico (speedtest, analisi del canale, verifica del numero di dispositivi) permette di identificare la causa reale.",["Esatto! Il testo insegna a separare i possibili problemi: numero di dispositivi sull'access point, saturazione della banda, interferenze Wi-Fi, o problemi sul server remoto.","Non è corretto. Il riavvio del router può aiutare ma non identifica la causa: il problema potrebbe essere sul server remoto o nella banda dell'operatore.","Non è corretto. Prima di contattare l'operatore occorre verificare se il problema dipende da fattori interni (Wi-Fi, dispositivi) o effettivamente dalla connessione.","Non è corretto. Il 5 GHz può migliorare la situazione se il problema è il Wi-Fi, ma non risolve problemi di banda verso Internet o sul server remoto."]],["Valuta questa affermazione: 'La distribuzione dei cavi sottomarini è equa a livello globale'. È corretta?",["No: la maggior parte dei punti di atterraggio è in Europa occidentale, Nord America e Asia orientale","Sì: Internet è distribuita per definizione, quindi la copertura è uniforme","Sì: il 5G sta colmando le lacune nelle zone non coperte da cavi","No, ma solo perché le aree meno sviluppate non hanno domanda di Internet"],0,"La distribuzione dei cavi sottomarini è profondamente diseguale. Il testo invita a osservare su submarinecablemap.com come la gran parte dei punti di atterraggio sia concentrata in Europa occidentale, Nord America e Asia orientale. Africa subsahariana, Oceania rurale e centro-sud dell'Asia hanno copertura molto inferiore. La 'connettività universale' è ancora lontana dall'essere universale.",["Esatto! Il testo indica che la copertura è molto disomogenea: Africa subsahariana, Oceania rurale e centro-sud dell'Asia hanno copertura molto inferiore.","Non è corretto. L'architettura distribuita riguarda la resilienza, non l'equità geografica dei punti di atterraggio.","Non è corretto. Il 5G è tecnologia radio locale, non un sostituto dei cavi sottomarini per la connettività intercontinentale.","Non è corretto. Il testo indica che la 'connettività universale è ancora molto lontana', suggerendo che la domanda esiste ma l'offerta non è equamente distribuita."]],["In che modo il ruolo di Network Infrastructure Designer diventerà più complesso con l'arrivo del 5G e dell'IoT?",["Perché milioni di dispositivi connessi richiedono reti molto più complesse da progettare e proteggere","Perché il 5G eliminerà la necessità dei cavi e semplificherà le reti","Perché il Network Designer dovrà imparare a riparare i cavi sottomarini","Perché il 5G richiede antenne più grandi e costose da installare"],0,"Con il 5G e l'IoT, la complessità delle reti aumenta enormemente: un'abitazione moderna ha decine di dispositivi connessi, una fabbrica 4.0 ne ha migliaia, una città intelligente ne ha milioni. Il Network Infrastructure Designer deve progettare reti che gestiscano questa complessità in modo affidabile e sicuro.",["Esatto! Il testo indica che con IoT una fabbrica ha migliaia di dispositivi connessi e una città intelligente ne ha milioni: la complessità cresce enormemente.","Non è corretto. Il 5G si affianca all'infrastruttura cablata senza eliminarla: la complessità aumenta, non diminuisce.","Non è corretto. La riparazione dei cavi sottomarini è un'attività specializzata diversa dalla progettazione delle reti.","Non è corretto. Il testo non menziona le dimensioni delle antenne come fattore di complessità per il Network Designer."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
