<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Studio di registrazione</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-COM-3-02","F":[["Qual è la differenza principale tra compressione 'lossless' e compressione 'lossy'?",["Lossless ricostruisce il file identico all'originale; lossy elimina per sempre i dettagli meno percepibili","Lossless è più veloce da elaborare; lossy richiede più tempo di calcolo perché è più complessa","Lossless funziona solo per immagini; lossy funziona solo per audio e video","Lossless produce file più piccoli perché è un algoritmo più efficiente; lossy produce file più grandi"],0,"La compressione lossless (PNG, FLAC, ZIP) permette di ricostruire esattamente il file originale: zero informazioni perse. La compressione lossy (JPEG, MP3, H.264) scarta informazioni che occhio o orecchio percepisce meno, producendo file molto più piccoli ma senza possibilità di recupero dell'originale. Esempio pratico: 5.000 foto JPEG occupano circa 15 GB; le stesse foto in RAW non compresso occuperebbero 75-150 GB.",["Esatto. Con la compressione lossless (PNG, FLAC, ZIP) si può ricostruire bit per bit il file originale. Con la compressione lossy (JPEG, MP3, H.264) alcune informazioni vengono eliminate definitivamente — scelte perché occhio o orecchio le percepiscono meno.","Non è corretto. La distinzione riguarda la perdita o meno di informazioni, non la velocità di elaborazione. Paradossalmente, gli algoritmi lossy come JPEG e MP3 richiedono calcoli sofisticati (DCT, psicoacustica) che possono essere più complessi degli algoritmi lossless più semplici.","Non è corretto. Entrambi i tipi di compressione si applicano a immagini, audio e video. PNG è lossless per le immagini; FLAC è lossless per l'audio; JPEG è lossy per le immagini; MP3 è lossy per l'audio; H.264 è lossy per il video.","Non è corretto. È il contrario: la compressione lossy produce file molto più piccoli perché elimina informazioni. La lossless non può comprimere più di quanto la ridondanza del file permetta. Una foto JPEG occupa tipicamente il 10-15% di quanto occuperebbe non compressa; la stessa foto in PNG lossless è molto più grande."]],["Quando nasce il diritto d'autore su un'opera originale in Italia?",["Automaticamente, quando l'opera viene creata: non servono registrazione né simbolo ©","Solo dopo la registrazione dell'opera presso la SIAE (Società Italiana degli Autori ed Editori)","Solo quando l'opera viene pubblicata e diventa accessibile al pubblico per la prima volta","Solo dopo che l'autore appone il simbolo © sull'opera con la data di creazione"],0,"In Italia (e in tutti i paesi che aderiscono alla Convenzione di Berna) il diritto d'autore nasce automaticamente al momento della creazione dell'opera originale e della sua fissazione su un supporto fisico o digitale. Non servono registrazioni, depositi o simboli. La protezione dura tutta la vita dell'autore più 70 anni dalla sua morte, dopodiché l'opera entra nel dominio pubblico.",["Esatto. In Italia (L. 633/1941) il diritto d'autore nasce automaticamente al momento della creazione: non serve registrarsi, depositare l'opera o apporre il simbolo ©. La protezione esiste anche senza questi formalismi.","Non è corretto. La registrazione alla SIAE non è necessaria per far nascere il diritto d'autore: è una forma di deposito volontario che può aiutare a provare la paternità in caso di controversia, ma la protezione legale esiste già dalla creazione.","Non è corretto. Il diritto d'autore nasce al momento della creazione e fissazione su un supporto, indipendentemente dalla pubblicazione. Un'opera non pubblicata è comunque protetta: il diritto di decidere se e quando pubblicare è parte dei diritti morali dell'autore.","Non è corretto. Il simbolo © non è obbligatorio in Italia né in nessun paese che aderisce alla Convenzione di Berna. La protezione del diritto d'autore esiste automaticamente anche senza il simbolo, dalla creazione."]],["Cosa permette la licenza CC0 (Creative Commons Zero)?",["Uso totalmente libero, anche commerciale, senza obbligo di citare l'autore","Uso libero ma solo per scopi non commerciali, con obbligo di citare l'autore","Uso libero per chiunque, ma le opere derivate devono mantenere la stessa licenza CC0","Uso libero a condizione che le opere derivate non vengano vendute commercialmente"],0,"CC0 (Creative Commons Zero) è la licenza più permissiva del sistema Creative Commons: l'autore rinuncia volontariamente a tutti i diritti possibili nell'ambito delle leggi applicabili. Chi usa un'opera CC0 può farne qualsiasi cosa: usarla, modificarla, distribuirla, venderla commercialmente, senza citare la fonte. Siti utili per trovare risorse CC0: Unsplash e Pixabay per foto, Freesound per audio (verifica sempre la licenza specifica di ogni file).",["Esatto. CC0 è la licenza più permissiva: l'autore rinuncia a tutti i diritti possibili e l'opera può essere usata, modificata, distribuita e sfruttata commercialmente da chiunque, senza dover citare la fonte. È l'equivalente del dominio pubblico per opere ancora sotto copyright.","Non è corretto. CC0 non ha restrizioni commerciali né obbligo di citazione. La licenza che richiede la citazione è CC BY (attribuzione obbligatoria). La licenza che limita l'uso commerciale è CC BY-NC. CC0 non impone nessun obbligo.","Non è corretto. L'obbligo di mantenere la stessa licenza sulle opere derivate si chiama ShareAlike (SA) — es. CC BY-SA. CC0 non ha questa restrizione: le opere derivate possono avere qualsiasi licenza, incluse le licenze commerciali più restrittive.","Non è corretto. CC0 non ha restrizioni commerciali: è la licenza più libera possibile. Chi riceve un'opera CC0 può usarla, modificarla e venderla commercialmente senza alcun obbligo verso l'autore originale."]],["Per quanti anni è protetta un'opera dal diritto d'autore italiano dopo la morte dell'autore?",["70 anni dalla morte dell'autore — solo dopo l'opera entra nel dominio pubblico","20 anni dalla morte dell'autore, come per i brevetti industriali","50 anni dalla prima pubblicazione dell'opera","100 anni dalla creazione dell'opera, indipendentemente dalla morte dell'autore"],0,"In Italia, la Legge n. 633 del 22 aprile 1941 (Legge sul Diritto d'Autore, più volte aggiornata) stabilisce che il diritto d'autore dura per tutta la vita dell'autore più 70 anni dalla sua morte. Solo al termine di questo periodo l'opera entra nel dominio pubblico. Esempio: un'opera di un autore morto nel 1954 (come Alan Turing) è entrata nel dominio pubblico nel 2024 (1954 + 70 = 2024).",["Esatto. In Italia (L. 633/1941, più volte aggiornata in conformità alle direttive europee) il diritto d'autore dura tutta la vita dell'autore più 70 anni dalla sua morte. Solo al termine di questo periodo l'opera diventa di dominio pubblico e chiunque può usarla liberamente.","Non è corretto. I 20 anni sono la durata tipica dei brevetti (diritto industriale), non del diritto d'autore. Il diritto d'autore in Italia dura molto più a lungo: 70 anni dalla morte, per tutta la durata della vita più questo periodo aggiuntivo.","Non è corretto. Il termine non si calcola dalla pubblicazione: decorre dalla morte dell'autore. E la durata è di 70 anni, non 50. Alcuni paesi (es. Stati Uniti per opere pubblicate prima del 1978) usano calcoli diversi, ma in Italia è vita + 70 anni dalla morte.","Non è corretto. In Italia (e in tutta l'Unione Europea) la durata è 70 anni dalla morte dell'autore, non 100 anni dalla creazione. Il momento della creazione non è rilevante per il calcolo della scadenza: conta la morte dell'autore."]],["Tra i segnali visivi per riconoscere un deepfake, quale è tra i più facili da individuare a occhio nudo?",["Bordi del viso incoerenti e occhi che non battono le palpebre in modo naturale","Il fatto che nel video la persona non lancia mai ombre sul pavimento","Il fatto che la persona nel video non fa mai gesti con le mani","La qualità dell'audio, che nei deepfake è sempre distorta e facilmente riconoscibile"],0,"Le GAN (Generative Adversarial Networks) che producono deepfake faticano su alcune zone specifiche: i bordi del viso (capelli, orecchie, collo) in condizioni di luce laterale, dove la rete fatica a separare il soggetto dallo sfondo in modo realistico. Anche il battito delle palpebre è spesso anomalo (troppo lento, troppo veloce o assente). Altri segnali: denti sfumati, riflessi negli occhi che non corrispondono all'illuminazione della scena, lips sync imperfetto (movimento delle labbra non sincronizzato con l'audio).",["Esatto. Le GAN che generano deepfake faticano a ricreare fedelmente le zone di confine tra il viso e lo sfondo (capelli, orecchie, collo) in condizioni di illuminazione laterale. Anche il battito delle palpebre è spesso irregolare o assente: un segnale relativamente facile da osservare rallentando il video.","Non è corretto. Le GAN moderne gestiscono bene le ombre del corpo: non è un segnale affidabile per riconoscere i deepfake. I segnali più utili riguardano le zone di confine del viso (capelli, orecchie) e il comportamento degli occhi.","Non è corretto. La maggior parte dei deepfake include gesti naturali delle mani — non è un segnale affidabile. Le persone nei video originali possono anche non gesticolare. I segnali utili riguardano il viso: bordi incoerenti, palpebre, riflessi negli occhi.","Non è corretto. I deepfake audio di qualità moderna non sono facilmente riconoscibili dalla qualità sonora: usano la stessa psicoacustica degli MP3 per produrre voci realistiche. I segnali più affidabili sono visivi, nelle zone di confine del viso."]],["Per fotografie di paesaggi e ritratti da pubblicare su un sito web, quale formato di compressione è più adatto: JPEG o PNG?",["JPEG: file molto più piccoli con una qualità visiva buona, perché è pensato per le fotografie","PNG: produce file identici all'originale senza perdita di qualità, quindi è sempre la scelta migliore","Dipende dal colore: JPEG per foto a colori, PNG per foto in bianco e nero","PNG: perché JPEG non supporta la trasparenza necessaria per le fotografie di paesaggi"],0,"JPEG è il formato ottimale per fotografie naturali (paesaggi, ritratti, scene) perché la sua compressione lossy è progettata per sfruttare come l'occhio percepisce le fotografie: elimina le frequenze visive che percepiamo meno, producendo file molto più piccoli con qualità accettabile. PNG lossless è preferibile per loghi, screenshot, icone e immagini con aree di colore uniforme e bordi netti, dove la compressione JPEG produce artefatti visibili (blocchi quadrati).",["Esatto. JPEG è ottimizzato per le fotografie: la sua compressione lossy (blocchi DCT 8x8) sfrutta il fatto che l'occhio percepisce meno le variazioni di alta frequenza nelle fotografie naturali. 5.000 foto JPEG occupano circa 15 GB; le stesse foto in PNG lossless occuperebbero 50-100 GB.","Non è corretto. Per le fotografie naturali, il PNG produce file enormemente più grandi del JPEG con una differenza di qualità percepibile solo all'ingrandimento estremo o in stampa professionale. 'Sempre la scelta migliore' è una semplificazione: PNG è preferibile per loghi, icone e immagini con aree di colore uniforme e bordi netti.","Non è corretto. La scelta tra JPEG e PNG non dipende dalla presenza del colore ma dal tipo di immagine: fotografie naturali (JPEG) vs. immagini con aree uniformi e bordi netti come loghi e screenshot (PNG). Entrambi i formati supportano sia il colore sia il bianco e nero.","Non è corretto. Le fotografie di paesaggi non richiedono trasparenza — la trasparenza serve per loghi, icone e elementi grafici da sovrapporre ad altri sfondi. JPEG non supporta la trasparenza, ma questo non è un problema per le fotografie naturali."]]],"I":[["Cosa significa 'ShareAlike' (SA) nella licenza CC BY-SA, e quale famosa piattaforma usa questa licenza?",["Le opere derivate devono avere la stessa licenza; la usa Wikipedia per i suoi contenuti","ShareAlike significa che l'opera può essere condivisa su qualsiasi piattaforma social senza restrizioni","ShareAlike significa che l'opera può essere condivisa gratuitamente ma non modificata","ShareAlike significa che chiunque usi l'opera deve condividere i propri profitti con l'autore originale"],0,"CC BY-SA impone due obblighi: 1) BY — attribuire la paternità all'autore originale; 2) SA — distribuire le opere derivate con la stessa licenza. Questo meccanismo è chiamato 'copyleft' e garantisce che i contenuti rimangano liberamente accessibili attraverso le generazioni di modifiche. Wikipedia usa CC BY-SA: chiunque può usare e modificare i suoi articoli, ma le versioni modificate devono restare ugualmente libere.",["Esatto. ShareAlike (SA = condividi allo stesso modo) è la clausola virale: chi modifica un'opera CC BY-SA deve distribuire il risultato con la stessa licenza CC BY-SA. Wikipedia usa questa licenza per garantire che chiunque possa usare e modificare i suoi contenuti, ma le opere derivate devono restare ugualmente libere.","Non è corretto. ShareAlike non ha nulla a che fare con i social media: è una clausola sulla licenza delle opere derivate. Chi crea un'opera modificando un contenuto CC BY-SA deve distribuirla con la stessa licenza — non può appropriarsi dei diritti o usare una licenza più restrittiva.","Non è corretto. La restrizione che impedisce le modifiche si chiama NoDerivatives (ND) — es. CC BY-ND. ShareAlike permette le modifiche ma richiede che le opere derivate mantengano la stessa licenza. Non impedisce la modifica: la regola il modo in cui le opere modificate vengono distribuite.","Non è corretto. Le licenze Creative Commons non prevedono compensi economici per l'autore (salvo nella licenza CC BY-NC che restringe l'uso commerciale). ShareAlike riguarda la licenza delle opere derivate, non la distribuzione di profitti."]],["Quale citazione è corretta per un'immagine fotografica trovata e usata in un podcast scolastico?",["Nome del fotografo/autore + fonte/sito originale + tipo di licenza (es. CC BY-SA 4.0)","'Immagine da Google Immagini' con il link alla pagina dei risultati di ricerca","Il nome del sito web da cui l'immagine è stata scaricata","Basta scrivere 'immagine senza copyright' se l'immagine è stata trovata su un sito gratuito"],0,"La citazione corretta di un'immagine fotografica prevede: 1) Nome del fotografo/autore originale (non chi l'ha trovata); 2) Fonte/sito in cui è stata originalmente pubblicata (non il motore di ricerca); 3) Tipo di licenza che permette l'uso (es. CC BY 4.0, dominio pubblico). Google non è autore: è un motore di ricerca che mostra anteprime. Per trovare immagini con licenza libera: Wikimedia Commons, Unsplash, Pixabay — verificando sempre la licenza specifica di ogni file.",["Esatto. Citare correttamente un'immagine significa indicare chi l'ha creata (non chi l'ha trovata), dove è stata pubblicata originalmente (non dove l'hai trovata tu) e quale licenza permette l'uso. 'Immagine da Google' non è una citazione: Google non è autore di nessuna immagine.","Non è corretto. Google non è autore di nessuna immagine: è un motore di ricerca che mostra anteprime di immagini di altri. Citare Google come fonte è scorrecto — bisogna indicare il fotografo originale e il sito in cui l'immagine è stata pubblicata. Questo errore è tra i più comuni nelle produzioni scolastiche.","Non è corretto. Citare solo il sito di download (es. 'da Pixabay' o 'da Wikipedia') è insufficiente: bisogna indicare l'autore dell'immagine, non solo dove si trovava. Molti siti aggregano immagini di autori diversi — citare il sito senza il fotografo è incompleto.","Non è corretto. 'Gratuito' non significa 'senza copyright': molte immagini su siti gratuiti sono comunque protette da diritto d'autore e richiedono licenze specifiche. Trovare un'immagine su un sito gratuito non autorizza automaticamente il suo uso — bisogna verificare la licenza specifica di ogni immagine."]],["Come funziona il sistema Content ID di YouTube e perché la giustificazione 'è un video scolastico non commerciale' non protegge dal copyright in Italia?",["Confronta in automatico l'audio con un archivio di brani protetti; in Italia l'uso scolastico non è un'eccezione","Content ID è un sistema manuale in cui i detentori dei diritti controllano i video uno per uno e decidono se fare reclamo","Content ID funziona solo per video con più di 1.000 visualizzazioni, quindi i video scolastici con poche visualizzazioni sono al sicuro","In Italia esiste un'eccezione per uso didattico simile al 'fair use' americano che protegge i video scolastici"],0,"Content ID è il sistema automatico di YouTube che confronta ogni video caricato con un database di impronte audio e video registrate dai titolari dei diritti. Se c'è una corrispondenza, il video viene automaticamente silenziato, rimosso o monetizzato a favore dell'avente diritto. In Italia non esiste un'eccezione automatica per uso educativo o non commerciale (diversamente dal 'fair use' americano): chiunque pubblichi un video con musica protetta è soggetto al copyright, indipendentemente dall'intento. La soluzione è usare esclusivamente musica con licenza CC esplicita che permette l'uso in video.",["Esatto. Content ID è un sistema automatico di YouTube che analizza ogni video caricato e lo confronta con il database dei detentori dei diritti. A differenza degli USA (dove esiste il 'fair use'), in Italia non c'è un'eccezione automatica per uso educativo: la mancanza di guadagno non equivale a permesso di usare musica protetta.","Non è corretto. Content ID è completamente automatico: YouTube carica ogni nuovo video e lo confronta in tempo reale con milioni di impronte audio e video registrate dai detentori dei diritti. Il processo è istantaneo e avviene senza revisione umana caso per caso.","Non è corretto. Content ID si attiva su tutti i video caricati, indipendentemente dal numero di visualizzazioni: l'analisi avviene al momento del caricamento, prima che qualcuno guardi il video. Non esiste una soglia di visualizzazioni che protegge dal sistema.","Non è corretto. Questo è uno degli errori più comuni. In Italia non esiste un'eccezione automatica per uso educativo o non commerciale equivalente al 'fair use' americano. La Legge sul Diritto d'Autore prevede eccezioni molto limitate per l'uso didattico in ambito scolastico fisico, ma non per la pubblicazione online di contenuti con musica protetta."]],["Cosa deve fare il hook narrativo di un episodio podcast nei primi 60-90 secondi per essere efficace?",["Agganciare l'ascoltatore con un fatto sorprendente, una domanda aperta o una storia breve — NON con 'oggi parleremo di...' o il sommario dell'episodio","Presentare il nome del podcast, i conduttori e ringraziare gli sponsor prima di qualsiasi altro contenuto","Leggere il sommario completo dell'episodio con tutti gli argomenti trattati, per permettere all'ascoltatore di decidere se continuare","Spiegare perché il tema dell'episodio è importante e rilevante per l'ascoltatore, con dati statistici a supporto"],0,"La struttura di un podcast efficace: Intro (max 30 sec, titolo, conduttori) → Hook narrativo (60-90 sec, DECISIVO) → Corpo (sequenze di 3-5 min) → Conclusione → Outro. Il hook narrativo è la finestra critica: un fatto sorprendente, una domanda che crea tensione cognitiva, una storia breve in medias res. Non iniziare mai con 'oggi parleremo di...': chi ascolta ha già smesso di prestare attenzione prima che tu finisca la frase.",["Esatto. I primi 60-90 secondi sono decisivi: se l'ascoltatore non è agganciato entro questo tempo, smette di ascoltare. Un hook efficace crea una tensione narrativa o cognitiva che spinge l'ascoltatore a voler sapere come va a finire. Il sommario o l'annuncio dell'argomento è il modo peggiore per iniziare.","Non è corretto. Le presentazioni e i ringraziamenti fanno parte dell'intro (massimo 30 secondi), non del hook. Il hook narrativo viene dopo l'intro ed è il momento cruciale in cui si cattura l'attenzione. Iniziare con le presentazioni è il modo più rapido per far abbandonare l'ascolto.","Non è corretto. Il sommario completo all'inizio è una delle tecniche meno efficaci per tenere l'ascoltatore: toglie la suspense e non crea nessuna tensione narrativa. Un hook efficace fa il contrario: crea una domanda nella mente dell'ascoltatore che può essere risolta solo continuando ad ascoltare.","Non è corretto. Spiegare l'importanza di un tema (approccio saggistico) è meno coinvolgente di un fatto sorprendente o di una storia: attiva il pensiero analitico ma non l'engagement emotivo. Un hook con dati statistici funziona solo se il dato è sufficientemente sorprendente da creare stupore immediato."]],["A cosa servono Google Reverse Image Search e TinEye nella verifica di contenuti sospetti?",["Cercano la stessa immagine nel web, per scoprire se è stata tolta dal suo contesto","Rilevano se un'immagine è stata creata artificialmente da un'AI o è una fotografia reale","Verificano se un'immagine è protetta da copyright o se è di dominio pubblico","Rilevano i metadati EXIF dell'immagine per verificare quando e dove è stata scattata"],0,"Google Reverse Image Search (fai clic destro su un'immagine → 'Cerca immagine su Google') e TinEye cercano la stessa immagine in tutto il web indicizzato, mostrando tutti i contesti in cui è apparsa. Una foto presentata come prova di un evento può essere una foto reale di un evento diverso, spesso di anni prima: la ricerca inversa lo rivela. Strumento specializzato: InVID/WeVerify (plugin browser) per verificare anche video e frammenti video.",["Esatto. Una foto presentata come 'prova' di un evento può essere una foto reale ma di un evento diverso (spesso di anni prima). La ricerca inversa mostra tutti i contesti in cui l'immagine è apparsa nel web, permettendo di verificare l'origine reale. Strumenti alternativi: InVID/WeVerify (plugin browser specifico per la verifica di video e immagini).","Non è corretto. Google Reverse Image Search e TinEye non rilevano l'uso di AI: cercano l'immagine nel web per trovare dove è apparsa in precedenza. Per rilevare immagini generate da AI esistono strumenti specifici come FotoForensics (analisi ELA) o AI Image Detector.","Non è corretto. La ricerca inversa non verifica le licenze delle immagini: individua dove l'immagine è apparsa nel web. Per verificare le licenze bisogna controllare il sito di origine o le metadata EXIF del file.","Non è corretto. La ricerca inversa non analizza i metadati EXIF: confronta visivamente l'immagine con il proprio database web. L'analisi dei metadati EXIF richiede strumenti specifici (Exiftool, Jeffrey's EXIF viewer) e va considerata con cautela perché i metadati possono essere modificati."]],["Quante parole di script sono necessarie per un podcast di 5 minuti registrato al ritmo normale di conversazione?",["Circa 750 parole — a 150 parole al minuto, il ritmo normale del parlato","Circa 250 parole — i podcast devono essere sintetici e densi di informazioni","Circa 1.500 parole — i podcaster parlano molto più velocemente di quanto si legga in silenzio","Non serve scrivere uno script: i podcast migliori sono improvvisati per suonare naturali"],0,"Il parlato normale è di circa 150 parole al minuto (ritmo di conversazione chiara e comprensibile — non di lettura veloce). Per un podcast: 3 minuti = 450 parole; 5 minuti = 750 parole; 10 minuti = 1.500 parole. Scrivere lo script completo prima della registrazione è indispensabile: garantisce qualità, riduce le pause, rende il montaggio più veloce e assicura che tutti i fatti citati siano stati verificati in anticipo.",["Esatto. Il parlato normale è di circa 150 parole al minuto: 5 minuti × 150 = 750 parole. Questa stima è utile per pianificare: scrivere prima lo script completo evita pause prolungate, ripetizioni e incoerenze nella registrazione. Lo script non va letto meccanicamente, ma è una guida indispensabile.","Non è corretto. 250 parole corrisponderebbero a meno di 2 minuti di parlato a ritmo normale. Il testo indica 150 parole/minuto: per 5 minuti servono circa 750 parole. Scrivere troppo poco rischia di produrre un podcast sottostimato o pieno di pause.","Non è corretto. 1.500 parole corrisponderebbero a circa 10 minuti di parlato a ritmo normale (150 parole/min). Il parlato normale non è più veloce della lettura ad alta voce: 150 parole al minuto è il ritmo tipico del parlato chiaro e comprensibile.","Non è corretto. I podcast che 'suonano naturali' sono quasi sempre il risultato di uno script ben scritto letto con abilità — non di improvvisazione. Senza script le pause aumentano, le incoerenze si moltiplicano e il montaggio successivo richiede molto più tempo. Lo script garantisce qualità e rispetto dei tempi."]]],"A":[["Il DM 183/2024 (Traguardi D1 e D2) collega la produzione di contenuti digitali responsabili alla cittadinanza civica. In che senso rispettare il copyright, citare le fonti e produrre contenuti verificabili sono 'atti di cittadinanza digitale'?",["Perché ogni contenuto falso o copiato peggiora l'informazione di tutti: produrre con cura è il modo pratico di difenderla","Perché la legge italiana obbliga chiunque produca contenuti online a rispettare copyright e veridicità, quindi è un obbligo legale prima che civico","Perché i contenuti digitali prodotti dagli studenti sono soggetti a valutazione scolastica, e la valutazione richiede correttezza formale come il copyright","Perché le piattaforme rimuovono automaticamente i contenuti che violano il copyright, rendendo necessario rispettarlo per rimanere online"],0,"Il DM 183/2024 (Linee guida Educazione Civica) Traguardo D1 riguarda la veridicità dei contenuti che si condividono; Traguardo D2 riguarda il rispetto dei diritti altrui online (copyright, privacy, identità digitale). L'inquadratura come 'atti di cittadinanza' è deliberata: chi produce contenuti contribuisce all'ecosistema informativo condiviso. Un podcast con fonti verificate e licenze rispettate è un contributo positivo alla qualità del dibattito pubblico — la risposta pratica alla disinformazione non è solo la verifica critica del consumo ma la produzione consapevole.",["Esatto. Il DM 183/2024 Traguardo D1 (veridicità dei contenuti) e D2 (rispetto dei diritti altrui online) identificano la produzione responsabile come atto civico. Chi produce contenuti contribuisce all'ecosistema informativo: un podcast con fonti verificate è un contributo alla qualità del dibattito pubblico.","Non è corretto. L'inquadratura 'atto di cittadinanza' è più ampia di quella legale: la legge fissa i minimi, ma la cittadinanza digitale riguarda la responsabilità verso la comunità, non solo la conformità legale. Si può rispettare la legge producendo contenuti mediocri o fuorvianti senza essere illegali.","Non è corretto. Il collegamento con la valutazione scolastica è secondario. Il DM 183/2024 collega la produzione responsabile alla qualità del dibattito democratico: ogni contenuto pubblicato online diventa parte dell'ecosistema informativo condiviso, indipendentemente dal fatto che sia stato valutato a scuola.","Non è corretto. La rimozione automatica (Content ID, DMCA) è una conseguenza tecnica, non la motivazione civica. L'argomento 'rispetto le regole per non essere rimosso' è opportunistico, non civico. La prospettiva del DM 183/2024 è il contributo positivo alla qualità dell'ecosistema informativo condiviso."]],["In Italia non esiste il 'fair use' per l'uso educativo come negli USA. Quali sono le implicazioni concrete per insegnanti e studenti che producono video scolastici con musica?",["Possono usare solo musica con licenza che lo permette: niente canzoni famose, anche se il video è scolastico e gratuito","Possono usare qualsiasi musica purché il video sia pubblicato come 'privato' su YouTube e visto solo dagli studenti della classe","Possono usare musica protetta a patto di non caricare il video su Internet, ma solo mostrarlo in classe su un dispositivo locale","Possono usare musica protetta per massimo 30 secondi, poi devono interrompere o cambiare brano: esiste una regola dei '30 secondi' nel diritto italiano"],0,"In Italia, diversamente dagli USA (dove esiste il 'fair use' con test a 4 fattori), non c'è un'eccezione automatica per uso educativo o non commerciale nel diritto d'autore applicato ai contenuti online. Il sistema Content ID di YouTube opera automaticamente indipendentemente dall'intento del creator. L'unica soluzione sicura per video scolastici pubblicati online: usare musica con licenza CC esplicita che permette l'uso in video (Freesound.org, ccMixter) e documentare la licenza nelle show notes.",["Esatto. In Italia l'assenza di guadagno non equivale a permesso di usare musica protetta. Content ID di YouTube opera automaticamente indipendentemente dall'intento educativo. L'unica soluzione sicura: usare esclusivamente musica con licenza CC esplicita che permette l'uso in video (es. Freesound.org, ccMixter, YouTube Audio Library per i file CC).","Non è corretto. Content ID di YouTube analizza tutti i video al momento del caricamento, inclusi quelli impostati come privati. La modalità 'privata' non protegge dal sistema automatico di rilevamento del copyright. Anche un video visto da una sola persona può essere colpito da Content ID se contiene musica protetta.","Non è corretto. Per la diffusione in classe su un dispositivo locale (non su Internet) la situazione giuridica è diversa e più permissiva (il L. 633/1941 prevede eccezioni limitate per uso didattico in ambito fisico). Ma non appena il contenuto viene pubblicato online, il copyright si applica integralmente.","Non è corretto. La 'regola dei 30 secondi' è un mito popolare senza fondamento legale in Italia (e negli USA). Non esiste nessuna legge che permetta di usare liberamente i primi 30 secondi di un brano protetto: anche un secondo di musica coperta da copyright può essere soggetto a reclamo tramite Content ID."]],["Hai prodotto un podcast con licenza CC BY e qualcuno lo usa in un video su YouTube senza citarti. Quali diritti ti conferisce la licenza CC BY e come puoi farli valere? (DM 183/2024 Traguardo D2)",["CC BY obbliga a citare l'autore: puoi chiedere la correzione o la rimozione e segnalare il video","Nessun diritto: CC BY significa che chiunque può fare qualsiasi cosa con l'opera, incluso non citarti","Puoi richiedere un compenso economico perché il video genera visualizzazioni e quindi profitto indiretto","Puoi segnalare il video solo se è stato monetizzato: i video non monetizzati non violano il copyright"],0,"La licenza CC BY (Creative Commons Attribution) impone un solo obbligo ma inderogabile: l'attribuzione. Chi usa un'opera CC BY deve citare l'autore, il titolo dell'opera e la licenza, in modo ragionevole e visibile. La mancanza di attribuzione è una violazione della licenza che conferisce al titolare il diritto di: richiedere la correzione (aggiunta della citazione), richiedere la rimozione, segnalare la piattaforma, agire legalmente in casi gravi. Il DM 183/2024 Traguardo D2 (rispetto dei diritti altrui online) include la comprensione di questi meccanismi come competenza di cittadinanza digitale.",["Esatto. CC BY non è 'senza diritti': 'BY' sta per attribuzione obbligatoria. Chi usa un'opera CC BY deve sempre citare l'autore, il titolo e la licenza. La mancanza di attribuzione è una violazione della licenza che autorizza il titolare a richiedere correzione, rimozione o, in casi estremi, azione legale.","Non è corretto. CC BY non è 'senza diritti': è una licenza che impone un obbligo preciso — l'attribuzione (BY = by attribution). Chi usa un'opera CC BY deve sempre citare l'autore. Chi non cita viola la licenza esattamente come chi viola qualsiasi altro contratto.","Non è corretto. La licenza CC BY permette l'uso commerciale senza compenso: l'autore ha scelto di permettere l'uso anche commerciale. Il problema non è l'eventuale guadagno di chi usa l'opera, ma la mancanza di attribuzione — l'unico obbligo che CC BY impone.","Non è corretto. La violazione della licenza CC BY (mancanza di attribuzione) non dipende dalla monetizzazione del video. Anche un video con zero visualizzazioni e zero guadagni viola la licenza se non cita l'autore. Il diritto all'attribuzione è indipendente dall'aspetto economico."]],["Perché il meccanismo generatore/discriminatore delle GAN produce deepfake così difficili da riconoscere, e perché il problema tende a peggiorare nel tempo?",["Due reti si sfidano: una genera falsi, l'altra li smaschera, e così i falsi migliorano fino a ingannare anche lei","Perché le GAN hanno accesso a database di milioni di fotografie rubate che permettono di copiare i volti reali","Perché le GAN usano la stessa tecnologia dei filtri di Instagram, che è già familiare agli utenti e quindi non insospettisce","Perché le GAN accedono direttamente ai frame del video originale e li sostituiscono pixel per pixel con immagini generate"],0,"Le GAN (Generative Adversarial Networks) usano un meccanismo di addestramento antagonistico: la rete generatrice produce immagini false cercando di ingannare la rete discriminatrice; la rete discriminatrice cerca di distinguere il falso dal vero. Le due si allenano reciprocamente — il generatore migliora man mano che il discriminatore migliora, e viceversa. Il sistema converge quando il generatore produce output indistinguibili dal reale persino per il discriminatore stesso. Questo crea una 'corsa agli armamenti' continua tra chi produce deepfake e chi sviluppa strumenti per rilevarli — e la qualità dei deepfake migliora costantemente.",["Esatto. La GAN (Generative Adversarial Network) è un sistema di addestramento antagonistico: le due reti si migliorano reciprocamente. Quando il generatore inganna sistematicamente il discriminatore, il discriminatore migliora — e il generatore deve migliorare a sua volta. Il risultato è un miglioramento continuo della qualità dei deepfake.","Non è corretto. Le GAN non 'copiano' fotografie: imparano le distribuzioni statistiche delle caratteristiche visive (texture, illuminazione, proporzioni) e generano nuovi contenuti sintetici. Non è un processo di copia ma di apprendimento generativo.","Non è corretto. I filtri di Instagram sono sovrapposizioni 2D semplici; le GAN sono reti neurali profonde che generano contenuti completamente sintetici. La difficoltà di riconoscimento dei deepfake non dipende dalla familiarità con i filtri social.","Non è corretto. Le GAN non 'sostituiscono pixel per pixel' frame esistenti: generano nuovi contenuti sintetici imparando le distribuzioni statistiche dei dati di addestramento. Il risultato è un contenuto nuovo, non una modifica di contenuto esistente."]],["La compressione MP3 scarta fino al 90% dell'informazione audio originale eppure la qualità è accettabile per la maggior parte degli ascoltatori. Quale principio della psicoacustica rende possibile questo?",["Elimina ciò che l'orecchio non percepirebbe: suoni deboli coperti da quelli forti e frequenze estreme","Il fatto che gli altoparlanti degli smartphone moderni non riproducono le frequenze alte, quindi eliminarle non fa differenza","Il fatto che la musica moderna è già compressa in produzione, quindi partendo da un file già ridotto si perde meno","Il fatto che il cervello 'ricostruisce' automaticamente le frequenze mancanti usando la memoria delle versioni originali dei brani"],0,"L'algoritmo MP3 usa la psicoacustica — la scienza di come l'orecchio umano percepisce il suono. Il principio chiave è il masking: suoni forti mascherano i suoni deboli presenti nello stesso momento (masking simultaneo) e in momenti immediatamente precedenti o successivi (masking temporale). Inoltre, le frequenze molto alte (>15 kHz) e molto basse vengono percepite meno intensamente dall'orecchio umano. Eliminando tutto questo, l'MP3 a 256 kbit/s scarta circa il 90% dell'informazione originale — eppure la maggior parte delle persone non sente differenza in ascolto normale.",["Esatto. L'algoritmo MP3 usa la psicoacustica (la scienza di come l'orecchio percepisce il suono): il masking temporale e simultaneo permette di eliminare i suoni che il cervello non percepirebbe comunque in quel contesto. A 256 kbit/s è difficile sentire differenza rispetto al FLAC in ascolto normale.","Non è corretto. La psicoacustica dell'MP3 è progettata per funzionare su qualsiasi sistema di riproduzione, non solo sugli altoparlanti degli smartphone. L'eliminazione delle frequenze si basa su come il sistema uditivo umano percepisce il suono, non sulle limitazioni tecniche dei dispositivi.","Non è corretto. La qualità dell'MP3 non dipende dalla compressione dinamica applicata in produzione musicale. La psicoacustica MP3 analizza le caratteristiche percettive del segnale audio specifico da comprimere, indipendentemente dal genere musicale o dalle scelte di produzione.","Non è corretto. Il cervello non 'ricostruisce' frequenze mancanti attingendo alla memoria: l'MP3 elimina le frequenze che non sarebbero percepite comunque in quel contesto di ascolto, non quelle che il cervello poi 'recupera'. Il principio è il masking — non la ricostruzione."]],["Perché la scelta della licenza CC BY-SA per un podcast scolastico pubblicato su Internet Archive è una decisione strategica con implicazioni educative, non solo una questione tecnica di copyright?",["Perché permette ad altri di usare e modificare il lavoro mantenendolo aperto, e così ne moltiplica l'utilità educativa","CC BY-SA è la licenza obbligatoria per i contenuti pubblicati su Internet Archive, quindi non è una scelta strategica ma un obbligo della piattaforma","CC BY-SA è la licenza più restrittiva disponibile su Internet Archive e protegge meglio il lavoro degli studenti dal plagio","CC BY-SA garantisce che il podcast riceva più ascolti perché le piattaforme promuovono i contenuti con licenza aperta"],0,"La scelta della licenza CC BY-SA per un podcast scolastico è una decisione strategica con implicazioni educative precise: 1) Contribuisce agli Open Educational Resources (OER) — contenuti che altri possono riusare e migliorare; 2) Il meccanismo ShareAlike garantisce che le versioni modificate restino ugualmente aperte; 3) Documentare fonti, licenze della musica e metodologia rende il podcast un modello di produzione responsabile; 4) Questo è esattamente ciò che il DM 183/2024 Traguardi D1+D2 intende per 'produzione di contenuto come atto di cittadinanza digitale'.",["Esatto. La scelta di CC BY-SA non è solo tecnica: è un atto deliberato di contributo alla comunità educativa. Chi pubblica sotto CC BY-SA dà agli altri la possibilità di costruire su quel lavoro — a condizione che anche le versioni modificate restino aperte. Questo è il principio degli Open Educational Resources (OER).","Non è corretto. Internet Archive non impone la licenza CC BY-SA: permette di caricare contenuti con qualsiasi licenza, incluse le licenze proprietarie o il copyright standard. La scelta di CC BY-SA è deliberata da parte del creatore, non imposta dalla piattaforma.","Non è corretto. CC BY-SA non è la più restrittiva (quella è CC BY-NC-ND); è una licenza di apertura condizionale. Non 'protegge dal plagio': al contrario, permette esplicitamente l'uso e la modifica. La protezione dal plagio viene dalla corretta attribuzione (BY), non dalla restrizione d'uso.","Non è corretto. Le piattaforme come Internet Archive o Spotify non promuovono i contenuti in base alla licenza. La scelta di CC BY-SA non aumenta la visibilità: la sua importanza è nel significato civico e nell'impatto sulla comunità educativa, non nella promozione algoritmica."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
