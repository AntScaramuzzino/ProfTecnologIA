<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Bussola delle professioni</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-SIS-3-04","F":[["Secondo il World Economic Forum Future of Jobs 2023, quale percentuale dei bambini delle scuole primarie di oggi lavorerà in mestieri che non esistono ancora?",["65%","20%","5%","100%"],0,"Il WEF (World Economic Forum) Future of Jobs 2023 stima che il 65% dei bambini attuali delle scuole primarie lavorerà in professioni non ancora esistenti. Per chi è in terza media oggi la percentuale è più bassa, ma il principio resta: prepararsi al futuro significa costruire competenze trasversali, non solo scegliere la professione 'giusta' ora.",["Esatto! Il WEF stima che il 65% dei bambini che oggi frequentano la scuola primaria lavorerà in mestieri che non esistono ancora. Questo non significa che non ci si possa preparare: significa che le competenze trasversali contano più di quelle specifiche.","Non corretto. La stima del WEF è molto più alta: il 65% dei bambini attuali lavorerà in mestieri non ancora esistenti. Il cambiamento tecnologico è rapidissimo.","Non corretto. Il 5% sarebbe una stima molto conservativa. Il WEF stima il 65% dei bambini attuali lavorerà in professioni non ancora esistenti.","Non corretto. Il 100% significherebbe che nessuna professione attuale sopravviverà, il che è eccessivo. La stima WEF è del 65% per i bambini delle scuole primarie."]],["Il modello RIASEC classifica le persone in base a sei tipi di interessi. Cosa significa la lettera 'S' in RIASEC?",["Social (Sociale): chi ama lavorare con le persone, insegnare, aiutare, curare","Scientific (Scientifico): chi ama la ricerca e l'analisi dei dati","Systematic (Sistematico): chi preferisce ambienti ordinati e procedure chiare","Skilled (Abile): chi ha abilità manuali eccezionali per i lavori artigianali"],0,"Il modello RIASEC (Holland): R=Realistic (manuale, pratico), I=Investigative (analitico, ricerca), A=Artistic (creativo, espressivo), S=Social (persone, aiuto, cura), E=Enterprising (leadership, persuasione), C=Conventional (ordine, procedure, precisione). Il codice Holland è una tripletta (es. ISA) che descrive i tre tipi dominanti di una persona.",["Esatto! RIASEC: R=Realistic (pratico), I=Investigative (analitico), A=Artistic (creativo), S=Social (lavora con le persone), E=Enterprising (intraprendente, persuasivo), C=Conventional (metodico, strutturato).","Non corretto. Il tipo scientifico nel RIASEC è la lettera I (Investigative). La S sta per Social: chi ama lavorare con le persone, insegnare, aiutare, curare.","Non corretto. Il tipo sistematico e metodico è la lettera C (Conventional). La S sta per Social: chi ama lavorare con le persone.","Non corretto. Il tipo con forte orientamento manuale è la lettera R (Realistic). La S sta per Social: chi ama lavorare con le persone, insegnare, aiutare, curare."]],["Qual è la differenza tra 'soft skills' (competenze trasversali) e competenze tecniche, secondo il testo?",["Le soft skills (comunicazione, pensiero critico, collaborazione) si trasferiscono da un settore a un altro; le competenze tecniche sono specifiche di un settore e si possono rendere obsolete più rapidamente","Le soft skills si imparano solo tramite corsi specifici; le competenze tecniche si imparano sul lavoro","Le soft skills sono valutate con i voti scolastici; le competenze tecniche con i certificati professionali","Le soft skills sono innate e non si possono sviluppare; le competenze tecniche si imparano sempre con lo studio"],0,"Soft skills (competenze trasversali) vs competenze tecniche: Soft skills = comunicazione, collaborazione, pensiero critico, adattabilità, intelligenza emotiva → transferable tra settori diversi, difficilmente automatizzabili. Competenze tecniche = specifiche di un settore/strumento → si possono rendere obsolete rapidamente (es. un linguaggio di programmazione che esce di uso). Nel 2025, >50% dei lavoratori dovrà riqualificarsi significativamente.",["Esatto! Le soft skills sono transferable skills: chi sa comunicare bene e pensare in modo critico lo fa in qualsiasi settore, anche se quello specifico cambia. Le competenze tecniche (programmazione in un linguaggio specifico, uso di un software) possono diventare obsolete in anni.","Non corretto. Le soft skills si sviluppano principalmente attraverso l'esperienza (pratiche di team, laboratori, compiti di realtà), non necessariamente tramite corsi. Le competenze tecniche si imparano sia a scuola sia sul lavoro.","Non corretto. Le soft skills (comunicazione, pensiero critico) sono difficilmente valutabili con voti standardizzati. Si dimostrano attraverso portfolio, progetti, esperienze pratiche.","Non corretto. Le soft skills NON sono innate: si sviluppano attraverso pratica, feedback, esperienza. Il testo dice esplicitamente che il libro stesso è costruito per sviluppare competenze trasversali."]],["Il testo cita quattro 'megatrend' che stanno trasformando il mercato del lavoro. Quale non fa parte di questi quattro?",["L'aumento della popolazione mondiale che crea più consumatori","Automazione e intelligenza artificiale","Crisi climatica e transizione ecologica","Cambiamenti demografici (invecchiamento della popolazione)"],0,"I quattro megatrend del mercato del lavoro citati nel testo: 1) Automazione e IA (saldo -14M posti 2023-2027), 2) Crisi climatica e transizione ecologica (edilizia, energia, industria si trasformano), 3) Cambiamenti demografici (invecchiamento → sanità, cura), 4) Digitalizzazione (anche settori tradizionali incorporano tecnologie digitali). L'aumento della popolazione mondiale non è uno dei quattro megatrend identificati.",["Esatto! L'aumento della popolazione mondiale (sebbene rilevante per altri aspetti) non è uno dei quattro megatrend citati. I quattro sono: automazione/IA, crisi climatica/transizione ecologica, cambiamenti demografici (invecchiamento), e digitalizzazione.","Non corretto. L'automazione e l'IA è esplicitamente il primo dei quattro megatrend citati nel testo: entro il 2027 si stima la creazione di 69M di nuovi posti e la distruzione di 83M.","Non corretto. La crisi climatica e la transizione ecologica è il secondo megatrend: edilizia, energia, industria, trasporti devono decarbonizzarsi, creando nuovi mercati e professioni.","Non corretto. I cambiamenti demografici (invecchiamento nei paesi sviluppati) sono il terzo megatrend: alta domanda di lavoro nel settore cura/sanità, necessità di produttività più alta."]],["Cos'è un 'portfolio delle competenze' secondo il testo?",["Una raccolta di prove concrete di quello che sai fare: progetti realizzati, problemi risolti, processi migliorati — non un curriculum vitae con titoli di studio","Un documento contabile con il valore monetario delle competenze di una persona","Una lista di corsi di formazione completati con i relativi certificati","Un social network professionale come LinkedIn dove si mostrano le esperienze lavorative"],0,"Il portfolio delle competenze: raccolta di PROVE CONCRETE di quello che sai fare. Per uno studente di terza media: il progetto CAD di MC-DIS-3-02, l'analisi dell'impronta carbonica di MC-ENE-3-02, il Business Model Canvas di MC-SIS-3-03, il piano energetico della scuola di MC-ENE-3-03. Ogni compito di realtà è un pezzo potenziale di portfolio. Mostra cosa sai FARE, non solo cosa hai STUDIATO.",["Esatto! Il portfolio non è un CV (lista di titoli, date, posizioni). È una raccolta di prove concrete: 'Ho progettato questo oggetto in CAD', 'Ho analizzato l'impronta carbonica della mia famiglia', 'Ho gestito questo progetto di gruppo'. Ogni compito di realtà del libro è un pezzo potenziale di portfolio.","Non corretto. Il portfolio delle competenze non è un bilancio monetario. È una raccolta di prove concrete di quello che sai fare: progetti, lavori, soluzioni a problemi reali.","Non corretto. Una lista di corsi è più simile a un CV che a un portfolio. Il portfolio mostra PROVE di competenza (progetti, artefatti), non solo titoli e certificazioni.","Non corretto. LinkedIn è uno strumento per documentare la rete professionale e le esperienze, ma non è la stessa cosa del portfolio. Il portfolio contiene artefatti e prove concrete di competenza, non solo descrizioni di esperienze."]],["Cosa sono i PCTO (Percorsi per le Competenze Trasversali e per l'Orientamento)?",["Lo strumento istituzionale per acquisire esperienza professionale reale durante la scuola superiore ('alternanza scuola-lavoro')","Una piattaforma online per trovare lavoro dopo il diploma","Esami speciali che si sostituiscono alla maturità per chi vuole entrare nel mondo del lavoro","Corsi di formazione professionale per adulti disoccupati finanziati dalla Regione"],0,"PCTO (Percorsi per le Competenze Trasversali e per l'Orientamento), ex alternanza scuola-lavoro: obbligatori nelle scuole superiori italiane (200-400 ore nei 5 anni, secondo l'indirizzo). Non sono 'solo stage': il valore è nell'acquisire competenze in contesti reali e documentarle per il portfolio. Vanno presentati al colloquio dell'esame di maturità.",["Esatto! I PCTO (ex alternanza scuola-lavoro) sono stage e percorsi che le scuole superiori devono attivare per permettere agli studenti di acquisire competenze in contesti lavorativi reali. Non è solo 'fare lo stage': è documentare le competenze acquisite.","Non corretto. I PCTO non sono una piattaforma di job placement. Sono percorsi didattici che combinano formazione scolastica con esperienza in contesti lavorativi reali, durante gli anni della scuola superiore.","Non corretto. I PCTO non sostituiscono la maturità. Sono esperienze di apprendimento in contesti lavorativi che integrano la formazione scolastica e vengono presentate al colloquio dell'esame di maturità.","Non corretto. Quelli sono i corsi di formazione professionale regionali (riqualificazione). I PCTO sono percorsi per gli STUDENTI delle scuole superiori, non per adulti disoccupati."]]],"I":[["Il testo analizza 5 offerte di lavoro reali (tecnico fotovoltaico, data analyst, educatore, UX designer, agronomo di precisione). Quale competenza trasversale è richiesta da tutti e cinque i profili?",["Comunicazione chiara, lavoro in team, pensiero critico, capacità di gestire dati di qualche tipo, autonomia organizzativa","Conoscenza approfondita dell'inglese tecnico specifico del settore","Uso avanzato di Microsoft Office e degli strumenti di produttività digitale","Disponibilità a lavorare in turni e in ambienti difficili"],0,"Analisi delle 5 offerte di lavoro: tecnico fotovoltaico + data analyst + educatore + UX designer + agronomo di precisione. Tutte e cinque richiedono: comunicazione chiara, lavoro in team, pensiero critico, capacità di gestire dati (in forme diverse), autonomia organizzativa. Le competenze tecniche sono completamente diverse; il nucleo trasversale è quasi identico. Questo conferma che investire nelle soft skills è un'assicurazione sul futuro professionale.",["Esatto! Il testo evidenzia esplicitamente: 'tutte e cinque — settori completamente diversi — richiedono: comunicazione chiara, lavoro in team, pensiero critico, capacità di gestire dati di qualche tipo, autonomia organizzativa'. Le competenze tecniche variano; il nucleo trasversale è quasi identico.","Non corretto. L'inglese non è esplicitamente citato come competenza comune a tutti e 5 i profili. Le competenze trasversali identificate riguardano comunicazione, team, pensiero critico, dati, autonomia.","Non corretto. Microsoft Office non è citato come competenza comune universale. Il nucleo trasversale comune identificato è comunicazione, team, pensiero critico, gestione dati, autonomia.","Non corretto. La disponibilità a turni è specifica di alcuni profili (tecnico fotovoltaico, educatore) ma non è una competenza trasversale universale. Il nucleo comune è comunicazione, team, pensiero critico, dati, autonomia."]],["Il testo descrive lo 'STEM gap': le donne rappresentano solo il 17% dei laureati in informatica. Il testo elenca cause documentate. Quale NON è una causa documentata nel testo?",["Le donne hanno capacità matematiche biologicamente inferiori agli uomini","Stereotipi culturali interiorizzati precocemente (prima dei 10 anni) attraverso i giocattoli e i media","Mancanza di modelli di ruolo femminili visibili nelle carriere tecniche","Aspettative degli insegnanti (Effetto Pigmalione) che comunicano inconsciamente minori aspettative verso le ragazze in matematica"],0,"Il testo elenca cause documentate dello STEM gap: stereotipi culturali precoci, effetto Pigmalione (aspettative insegnanti), mancanza di modelli di ruolo femminili, ambiente ostile nelle comunità tech. NON elenca 'capacità biologiche inferiori' come causa: il testo afferma esplicitamente che le ragazze hanno risultati uguali o superiori in matematica fino alla scuola secondaria. La disparità è culturale e sociale, non biologica.",["Esatto! Questa affermazione è esplicitamente confutata nel testo: 'le ragazze ottengono risultati scolastici uguali o migliori dei ragazzi nelle materie scientifiche fino alla scuola secondaria'. La disparità emerge nelle scelte di indirizzo, non nelle capacità.","Non corretto. Questa è una delle cause documentate nel testo. Il testo dice che l'idea che 'la tecnologia è per i maschi' viene interiorizzata spesso prima dei 10 anni.","Non corretto. Questa è una delle cause documentate nel testo: 'se non vedi donne che lavorano in informatica, è più difficile immaginarti in quel ruolo'.","Non corretto. L'effetto Pigmalione è esplicitamente citato nel testo come causa documentata dello STEM gap."]],["Il testo descrive l''adattabilità' come una competenza trasversale critica. In quale modo specifico la descrive che la distingue dalla semplice 'flessibilità'?",["L'adattabilità include la capacità di imparare cose nuove rapidamente, lavorare in contesti di incertezza, e cambiare metodo quando quello che funzionava smette di funzionare","L'adattabilità significa essere disponibili a lavorare in qualsiasi posto geografico, anche all'estero","L'adattabilità significa accettare qualsiasi condizione lavorativa senza lamentarsi","L'adattabilità è sinonimo di intelligenza emotiva: chi è emotivamente intelligente si adatta bene"],0,"Adattabilità nel testo: capacità di imparare cose nuove rapidamente (upskilling veloce), lavorare in contesti di alta incertezza (senza tutte le informazioni), cambiare metodo quando quello attuale smette di funzionare (abbandonare approcci consolidati). Il WEF stima che nel 2025 oltre il 50% dei lavoratori dovrà riqualificarsi: l'adattabilità è la meta-competenza che rende possibile questa riqualificazione.",["Esatto! L'adattabilità è più specifica della generica 'flessibilità': include la capacità di apprendimento rapido (acquisire nuove competenze in tempi brevi), la tolleranza all'incertezza (lavorare senza tutte le informazioni necessarie), e la capacità di abbandonare metodi consolidati quando non funzionano più.","Non corretto. La mobilità geografica non è la definizione di adattabilità nel testo. L'adattabilità riguarda la capacità di apprendimento rapido, la tolleranza all'incertezza, e il cambiamento dei metodi quando necessario.","Non corretto. L'adattabilità non significa passività o accettazione di condizioni svantaggiose. È una capacità attiva: apprendimento rapido, tolleranza all'incertezza, disponibilità a cambiare metodo.","Non corretto. Intelligenza emotiva e adattabilità sono due competenze diverse nel testo, entrambe elencate come distinte. L'intelligenza emotiva riguarda il riconoscimento e la gestione delle emozioni; l'adattabilità riguarda l'apprendimento rapido e il cambiamento di metodo."]],["Il testo afferma che le competenze STEM (tecnico fotovoltaico, analista dati, ecc.) offrono alcune delle professioni più richieste ma che lo STEM gap esclude molte persone da queste opportunità. Quali azioni concrete cita il testo per ridurre il gap?",["Programmi di mentoring con professioniste STEM, rappresentazione nei libri di testo e nei media, laboratori di coding inclusivi, sensibilizzazione degli insegnanti sugli stereotipi inconsci","Abbassare i requisiti matematici nei corsi STEM per renderli più accessibili alle ragazze","Creare scuole separate per ragazze e ragazzi in modo da eliminare la competizione mista","Rendere obbligatoria la laurea STEM per tutte le professsioni, indipendentemente dal settore"],0,"Le quattro azioni concrete citate: 1) Programmi di mentoring (ragazze con professioniste STEM che mostrano che è possibile); 2) Rappresentazione (libri di testo e media con donne in ruoli tecnici); 3) Laboratori inclusivi (coding/robotica con approcci non stereotipati); 4) Sensibilizzazione degli insegnanti (gli stereotipi inconsci influenzano le aspettative che influenzano le prestazioni → effetto Pigmalione). Il testo stesso si presenta come un esempio di tentativo di rappresentazione.",["Esatto! Il testo cita quattro azioni concrete: 1) mentoring (ragazze con professioniste STEM), 2) rappresentazione (visibilità di modelli femminili nei media e libri di testo), 3) laboratori inclusivi (coding e robotica in contesti non stereotipati), 4) formazione degli insegnanti sugli stereotipi inconsci.","Non corretto. Il testo non suggerisce di abbassare gli standard accademici. Il problema non è la difficoltà dei corsi STEM ma le barriere culturali e sociali che scoraggiano le ragazze dall'avvicinarsi a questi percorsi.","Non corretto. La separazione delle scuole non è citata come soluzione nel testo. Le soluzioni proposte riguardano i modelli di ruolo, il mentoring e la sensibilizzazione culturale, non la separazione.","Non corretto. Rendere la laurea STEM obbligatoria non è citato come soluzione. L'obiettivo è permettere a chi vuole scegliere un percorso STEM di farlo senza barriere culturali, non obbligare tutti."]],["Il testo afferma che il WEF stima che nel 2025 'oltre il 50% dei lavoratori avrà bisogno di riqualificazione significativa'. Come si collega questa stima al concetto di 'apprendimento continuo' descritto nel testo?",["L'apprendimento non finisce con la scuola: è una pratica permanente necessaria per mantenere la propria rilevanza professionale in un mercato che cambia rapidamente","Significa che le scuole sono inutili: tutto si impara meglio sul lavoro e non serve la formazione formale","Significa che i lavoratori sopra i 40 anni devono essere sostituiti da giovani con competenze più aggiornate","Significa che non si può pianificare la propria carriera: è inutile pensare al futuro professionale"],0,"La stima WEF (50% riqualificazione entro 2025) e il concetto di apprendimento continuo si collegano: se le competenze diventano obsolete in 5-7 anni in molti settori, l'apprendimento non può finire con la scuola. Piattaforme come Coursera, edX, Google Skillshop rendono accessibile la formazione continua. L'apprendimento permanente è la risposta individuale alla velocità del cambiamento tecnologico.",["Esatto! Se la metà dei lavoratori deve riqualificarsi in 5 anni, il modello 'studio una volta per tutta la vita' non funziona più. L'apprendimento continuo — aggiornare le competenze tramite corsi online, certificazioni, esperienza pratica — diventa una necessità professionale, non un'opzione.","Non corretto. Il testo non sostiene l'inutilità della scuola. Dice che l'apprendimento non si ferma con la scuola: la formazione iniziale è fondamentale, ma deve essere seguita da apprendimento permanente lungo tutta la carriera.","Non corretto. Il testo non sostiene la sostituzione dei lavoratori anziani. L'apprendimento continuo riguarda TUTTI i lavoratori di qualsiasi età che devono aggiornare le proprie competenze.","Non corretto. Il testo propone esattamente l'opposto: costruire una mappa di competenze trasversali e un percorso professionale iterativo (come un Lean Startup applicato alla propria vita) è il modo per navigare il cambiamento."]],["Il testo afferma che i dati di crescita delle professioni ('specialisti big data +2,3M di posti') si confrontano con dati di declino ('addetti data entry -3M'). Quale osservazione metodologica fa il testo su questi dati?",["'I posti che spariscono sono concentrati in certi settori e geografie; quelli che nascono, in altri.' La distribuzione geografica e settoriale è diversa, non solo il saldo totale","I dati WEF sono inaffidabili e non dovrebbero essere usati per l'orientamento professionale","I dati di crescita e declino si compensano esattamente: non ci saranno problemi occupazionali complessivi","I dati si riferiscono solo all'Europa e non sono applicabili all'Italia"],0,"L'osservazione metodologica critica: il saldo numerico (+69M creati, -83M eliminati = -14M netto) non cattura la distribuzione geografica e settoriale. I posti di data entry persi sono nelle città e in tutti i settori; i nuovi posti di big data specialist nascono in specifiche aree tecnologiche e geografiche. La transizione richiede politiche attive di riqualificazione, non solo la 'magia del mercato' che compenserebbe automaticamente.",["Esatto! Il testo fa questa osservazione metodologica critica: il saldo netto può essere positivo (69M creati vs 83M eliminati = -14M, ma contando anche quelli creati in altri scenari il saldo cambia) ma la DISTRIBUZIONE non è uniforme. Chi perde lavoro in un settore/area non può automaticamente trovarne uno nell'altro.","Non corretto. Il testo usa i dati WEF come riferimento. L'osservazione metodologica non mette in dubbio l'affidabilità dei dati ma la loro interpretazione (saldo netto ≠ transizione senza problemi).","Non corretto. Il testo non afferma che tutto si compensi perfettamente. Anzi, cita un 'saldo negativo di 14 milioni' e nota che la distribuzione è fondamentalmente diseguale.","Non corretto. I dati WEF sono globali, non solo europei. E il testo li usa per discussioni applicabili anche al contesto italiano."]]],"A":[["Il testo afferma che 'non esiste una scelta professionale che garantisce stabilità per 40 anni'. Come cambia questa affermazione il modo di pensare all'orientamento scolastico rispetto al modello tradizionale di 'scegliere la professione giusta'?",["L'orientamento dovrebbe puntare a costruire competenze trasversali solide e flessibili invece di ottimizzare per un singolo percorso professionale: si tratta di aumentare la 'resilienza professionale' nella variabilità","Non ha senso fare orientamento: tanto nessuno sa quale professione fare e qualsiasi scelta è uguale","I giovani dovrebbero evitare qualsiasi specializzazione professionale e rimanere generalisti","Gli insegnanti e i genitori non dovrebbero dare consigli sull'orientamento perché il mercato del lavoro è imprevedibile"],0,"Il modello tradizionale: 'scegli il percorso giusto ora → avrai stabilità per sempre'. Il nuovo modello: 'costruisci competenze trasversali solide + alcune specializzazioni aggiornabili → puoi navigare le transizioni professionali future'. Tra il 2000 e il 2020, molti lavori 'sicuri' sono quasi scomparsi (cassieri bancari, tipografi, operatori centralino). Non è pessimismo: è realismo che porta a prepararsi diversamente.",["Esatto! Se nessun percorso professionale garantisce stabilità per 40 anni, l'obiettivo non è 'trovare il lavoro giusto per sempre' ma costruire una base di competenze (soft skills + competenze tecniche aggiornabili) che permetta di adattarsi. Il testo dice: 'non esiste una scelta professionale stabile; esiste un modo di costruire competenze che aumenta la capacità di adattarsi'.","Non corretto. Il testo non sostiene l'equivalenza di tutte le scelte. Dice che invece di ottimizzare per una singola professione 'sicura', è meglio costruire competenze trasversali che permettano l'adattamento. L'orientamento rimane utile con questo obiettivo diverso.","Non corretto. Il testo non sostiene il puro generalismo. Dice di costruire competenze sia tecniche (alcune specializzazioni) sia trasversali (trasferibili). Il mix è importante: non specializzazione rigida ma nemmeno mancanza di competenze specifiche.","Non corretto. Il testo non sostiene il silenzio degli adulti sull'orientamento. Chiede invece un orientamento basato su competenze trasversali e autoconoscenza, piuttosto che su previsioni di professioni specifiche 'sicure'."]],["La mappa 'da MC a professione' mostra che MC-DIG-2-02 (privacy, identità digitale) porta a DPO (Data Protection Officer) e cybersecurity analyst. Come si usa questo tipo di connessione per costruire un percorso formativo coerente?",["Identificando le MC che sviluppano competenze simili a quelle richieste dalla professione target, poi cercando percorsi formativi (liceo, istituto tecnico) che approfondiscono quelle aree","Seguendo solo le MC con il punteggio più alto nel proprio voto scolastico, indipendentemente dalla professione target","Applicando per ogni professione target solo il programma ufficiale del ministero, senza altri apprendimenti","La mappa ha scopo decorativo e non può essere usata per l'orientamento pratico"],0,"Come usare la mappa MC → professione: 1) Identifica la professione che ti interessa (es. cybersecurity analyst). 2) Guarda quali MC sviluppano competenze rilevanti (MC-DIG-2-02 privacy, MC-DIG-3-01 robotica, MC-DIG-3-03 IoT/dati). 3) Scegli il percorso superiore che approfondisce quelle aree (istituto tecnico informatico, liceo scientifico). 4) Cerca PCTO coerenti. 5) Costruisci il portfolio con i lavori di quelle MC. La mappa collega il presente (scuola media) al futuro (professione).",["Esatto! Se si è interessati alla cybersecurity: 1) identifico le MC rilevanti (DIG-2-02, DIG-3-01, DIG-3-03), 2) cerco quale percorso scolastico superiore sviluppa quelle competenze (istituto tecnico informatico, liceo scientifico con potenziamento digitale), 3) cerco PCTO in aziende di sicurezza informatica, 4) costruisco il portfolio di competenze.","Non corretto. Il percorso formativo dovrebbe essere guidato dagli interessi e dalla coerenza con gli obiettivi professionali, non solo dai voti. Spesso le competenze si sviluppano meglio nelle aree dove c'è curiosità e motivazione.","Non corretto. Il testo enfatizza la costruzione attiva di un percorso con portfolio, PCTO, apprendimento continuo. Il programma ministeriale è la base, non l'unico elemento.","Non corretto. Il testo presenta la mappa come strumento pratico di orientamento e ne suggerisce l'uso per il colloquio d'esame di terza media. È uno strumento operativo, non decorativo."]],["Il testo dice che il career coach 'non dice alle persone cosa fare della loro vita. Le aiuta a vedere quello che già sanno di sé, ma non hanno ancora guardato.' Quale principio metodologico sottende questa distinzione?",["L'orientamento professionale efficace parte dall'autoconoscenza (preferenze, competenze, valori) della persona, non dall'imposizione di percorsi esterni: il coach facilita la riflessione, non prescrive soluzioni","Il career coach non può dare consigli perché non conosce abbastanza il mercato del lavoro del futuro","Il career coach fa solo test psicologici standardizzati per determinare la professione adatta","Il career coach non parla mai direttamente con la persona: usa solo questionari scritti per evitare bias"],0,"Il principio metodologico: nella facilitazione dell'orientamento, il coach NON decide per la persona ma la aiuta a scoprire cosa sa già di sé (preferenze, competenze, valori) ma non ha ancora articolato consapevolmente. Il test RIASEC è uno strumento di riflessione, non una 'macchina che decide'. La distinzione facilita/prescrive è fondamentale: le decisioni di vita autonome (non imposte) sono più sostenibili nel tempo.",["Esatto! Il principio è la distinzione tra facilitazione e prescrizione nell'orientamento. Prescrivere ('devi fare l'ingegnere') non funziona perché ignora la complessità individuale. Facilitare la riflessione ('quali attività ti hanno coinvolto di più? Quando ti senti più capace?') permette alla persona di costruire autonomamente una direzione più autentica e sostenibile.","Non corretto. Il career coach usa effettivamente conoscenze del mercato del lavoro. La distinzione non riguarda la competenza professionale ma l'approccio metodologico: facilitazione vs prescrizione.","Non corretto. I test (incluso il RIASEC) sono strumenti, non la totalità del processo. Il testo cita un approccio basato su 'evidenze' (test, feedback ricevuti, lavori svolti) non solo sui test psicologici.","Non corretto. La relazione con la persona è centrale nel coaching. Il testo descrive un processo che usa 'ascolto attivo' come competenza chiave: richiede interazione diretta, non solo questionari."]],["Il testo afferma che 'il 65% dei bambini lavorerà in mestieri non ancora esistenti, ma le competenze sì'. Come si trasferisce questo principio alla pianificazione del percorso formativo durante la scuola media?",["Le competenze trasversali (pensiero critico, comunicazione, adattabilità) e le competenze fondamentali (logica, matematica, lingua) sono stabili e utili anche in professioni sconosciute: costruirle adesso è investire su qualsiasi futuro","Non ha senso studiare nulla adesso perché le competenze di oggi saranno obsolete domani","Si dovrebbe imparare solo le materie STEM perché quelle sono le uniche stabili nel tempo","Le scuole medie dovrebbero smettere di insegnare e lasciare che i ragazzi imparino da soli su internet"],0,"'Le competenze sì' significa che alcune categorie di competenze sono stabili indipendentemente dalle professioni specifiche: competenze matematiche e logiche (fondamento del pensiero quantitativo), competenze linguistiche (comunicazione in qualsiasi contesto), pensiero critico (valutare fonti, argomentare), collaborazione (lavorare in team). Costruire queste basi solide durante la scuola media è investire su qualsiasi futuro professionale, anche su professioni che non esistono ancora.",["Esatto! 'Le competenze sì' significa che anche se la professione specifica non esiste ancora, le competenze fondamentali (matematica, logica, comunicazione scritta) e trasversali (pensiero critico, collaborazione) saranno rilevanti in qualsiasi contesto professionale futuro.","Non corretto. Il testo non dice che le competenze siano obsolete. Dice che le professioni cambieranno, ma le competenze fondamentali e trasversali rimangono utili. 'Le competenze sì' è un messaggio di ottimismo, non di nichilismo.","Non corretto. Il testo sottolinea il valore sia delle competenze tecniche (incluse STEM) sia di quelle umanistiche e trasversali (comunicazione, pensiero critico). Non c'è un solo tipo di competenza 'sicura'.","Non corretto. Il testo valorizza la formazione scolastica come fondamentale per costruire le basi. Il 'prepararsi al futuro' non significa rinunciare alla formazione strutturata ma costruire, accanto alle competenze tecniche, competenze trasversali attraverso approcci attivi."]],["Il testo descrive la 'rete professionale' come 'non solo chi conosci: è chi ti conosce come professionista'. Perché questa distinzione è importante per il percorso di un giovane che inizia la propria carriera?",["Essere riconosciuti come professionisti richiede di contribuire attivamente a comunità del proprio settore, non solo accumulare contatti passivi: la visibilità nasce da quello che si fa e si condivide, non da quante persone si seguono","La rete professionale si costruisce solo dopo aver trovato il primo lavoro: inutile pensarci prima","La rete professionale è importante solo per chi lavora nelle vendite: per i tecnici conta solo la competenza","Avere molti followers su Instagram è equivalente ad avere una rete professionale solida"],0,"La distinzione 'chi conosci' vs 'chi ti conosce come professionista' è fondamentale: 1) Connettere passivamente su LinkedIn 500 persone che non ti conoscono → valore limitato. 2) Contribuire a un progetto open source → ti rende visibile come sviluppatore. 3) Pubblicare un'analisi sul tuo settore → ti rende riconoscibile come esperto. 4) Partecipare attivamente a eventi del settore → ti rende conoscibile. La rete si costruisce con contributi, non con accumulo passivo di contatti.",["Esatto! Una rete passiva (tanti contatti che non ti conoscono) ha poco valore. Una rete attiva (poche persone che ti conoscono come qualcuno che risolve problemi specifici, che ha realizzato progetti rilevanti, che contribuisce a discussioni del settore) ha molto più valore per opportunità professionali.","Non corretto. Il testo suggerisce di costruire la rete partecipando a eventi, contribuendo a progetti, essendo presente nelle comunità del settore — attività possibili anche prima del primo lavoro.","Non corretto. Il testo non fa distinzioni per ruolo professionale. La rete professionale è utile per qualsiasi ruolo: anche i tecnici trovano opportunità di lavoro, collaborazioni e aggiornamento attraverso le proprie reti.","Non corretto. I follower di Instagram e la rete professionale sono cose diverse. Il testo cita LinkedIn come 'sistema di documentazione della rete professionale digitale' — uno strumento professionale specifico, non i social media in senso generale."]],["Il testo è definito come 'l'unica MC del libro che ha te come oggetto di studio'. Quale implicazione metodologica ha questa affermazione sull'approccio alla valutazione in questa MC?",["La risposta 'corretta' non è quella che il docente vuole ma quella onesta e basata su evidenze: autoconoscenza autentica (cosa so fare, dove ho lacune, cosa mi piace) è più utile di una risposta performativa o socialmente desiderabile","Non c'è valutazione in questa MC: essendo soggettiva, non può essere valutata con criteri oggettivi","Si valuta solo il numero di MC elencate nel portfolio: più MC = voto più alto","Questa MC non ha valutazione: serve solo a preparare il colloquio d'esame informalmente"],0,"'L'unica MC che ha te come oggetto di studio' implica che il criterio di valutazione è l'autenticità dell'autoanalisi, non la correttezza di informazioni esterne. La rubrica valuta: conoscenza del mercato (informazioni verificabili), mappa competenze-professioni (strumento orientativo), autoconoscenza vocazionale (distingue 'cosa mi piace', 'cosa so fare', 'cosa il mercato cerca'), e portfolio delle competenze (basato su prove, non solo dichiarazioni). Il criterio è la qualità dell'autoriflessione, non una risposta 'giusta' universale.",["Esatto! Il testo lo dice esplicitamente nella rubrica: 'Non esiste una risposta giusta. Esistono risposte oneste e risposte disoneste. La risposta onesta non è quella perfetta — è quella che riflette davvero dove sei adesso.' Questo è un criterio di valutazione insolito per la scuola: premia l'autenticità, non la correttezza convenzionale.","Non corretto. Il testo include una rubrica di valutazione specifica. La soggettività non esclude la valutazione: il criterio è la qualità dell'autoriflessione (è fondata su evidenze? distingue preferenze da competenze? è onesta sui gap?) non la 'risposta giusta'.","Non corretto. La rubrica valuta la qualità dell'autoriflessione, non la quantità di MC elencate. Il portfolio deve distinguere competenze dimostrate da quelle dichiarate e identificare gap da colmare.","Non corretto. Il testo include una rubrica a 4 criteri. La mappa 'competenze acquisite → professioni possibili' è presentata come documento usabile al colloquio d'esame — non in modo informale ma come documento strutturato di orientamento."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
