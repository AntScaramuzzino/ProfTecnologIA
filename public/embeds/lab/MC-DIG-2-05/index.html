<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Benessere digitale</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-DIG-2-05","F":[["Cos'è la dopamina e che ruolo ha nel rapporto con gli schermi?",["Un ormone che regola il sonno — viene bloccato dalla luce blu degli schermi","Un neurotrasmettitore che il cervello rilascia in risposta a una ricompensa — attivato anche solo dall'anticipazione di essa","Una proteina che rafforza la memoria durante il sonno","Un segnale chimico che regola la frequenza cardiaca sotto stress"],1,"La dopamina viene rilasciata in anticipazione della ricompensa, non quando la ricevi. Questo spiega perché la notifica non letta crea tensione: il cervello anticipa qualcosa di interessante e rilascia dopamina — prima ancora che tu apra l'app.",["Non è corretto. Quello che descrivi è la melatonina. La dopamina è un neurotrasmettitore diverso, legato al sistema di ricompensa.","Esatto! La dopamina è il meccanismo che le app sfruttano: si attiva prima ancora di aprire la notifica — solo vedendola non letta — e crea la sensazione di 'voglio guardare'.","Non è corretto. La dopamina è un neurotrasmettitore, non una proteina, e la sua funzione principale riguarda il sistema di ricompensa — non la memoria del sonno.","Non è corretto. Il segnale principale dello stress cardiaco è l'adrenalina (epinefrina). La dopamina ha un ruolo diverso — nel sistema di ricompensa e motivazione."]],["Qual è la definizione corretta di cyberbullismo?",["Qualsiasi commento negativo pubblicato online, anche se fatto una sola volta","Comportamento aggressivo, intenzionale e ripetuto attuato tramite strumenti digitali contro chi non può facilmente difendersi","L'uso eccessivo dei social media da parte dei ragazzi, con conseguenze negative sulla salute","Il furto di identità digitale attraverso phishing o hacking"],1,"La definizione di cyberbullismo ha tre elementi indispensabili: (1) intenzionale — non è un malinteso; (2) ripetuto — un pattern sistematico, non un episodio singolo; (3) squilibrio di potere — la vittima non può facilmente difendersi. Tutti e tre devono essere presenti.",["Non è corretto. Un singolo commento cattivo è brutto, ma non è cyberbullismo. La parola 'ripetuto' è fondamentale nella definizione — il cyberbullismo è un pattern sistematico.","Esatto! Le tre caratteristiche chiave sono: aggressivo (intenzionalmente offensivo), ripetuto (non un episodio isolato), e con uno squilibrio di potere (la vittima non può difendersi facilmente).","Non è corretto. Quello che descrivi è l'uso problematico della tecnologia. Il cyberbullismo riguarda un comportamento aggressivo verso una persona specifica.","Non è corretto. Il furto di identità è un reato informatico diverso. Può essere collegato al cyberbullismo (es. nell'impersonificazione), ma non è la sua definizione."]],["Quale meccanismo di design rende i social media più potenti per creare abitudini — secondo il testo?",["Le notifiche — perché arrivano sempre nello stesso momento della giornata","La ricompensa a intervallo variabile — like e notifiche arrivano in modo irregolare e imprevedibile","La qualità dei contenuti — più i video sono interessanti, più si torna sull'app","La gratuità dell'app — siccome non si paga, si tende a usarla di più"],1,"La ricompensa a intervallo variabile è il meccanismo psicologico più potente per creare comportamenti ripetitivi. Non sai quando arriverà la prossima ricompensa (like, messaggio, notifica interessante) — quindi continui a controllare. È lo stesso principio delle slot machine.",["Non è corretto. Le notifiche sono importanti, ma non è la loro prevedibilità a creare le abitudini più forti — è esattamente il contrario.","Esatto! La variabilità è il meccanismo più potente: non sai quando arriverà il prossimo like, quindi controlli continuamente. È lo stesso principio delle slot machine.","Non è corretto. La qualità dei contenuti conta, ma non è il meccanismo psicologico più potente per creare abitudini compulsive. La variabilità della ricompensa lo è.","Non è corretto. La gratuità è parte del modello di business, ma non è il meccanismo psicologico che crea l'abitudine. Le app a pagamento possono essere ugualmente addictive."]],["Cosa fa la luce blu degli schermi al sonno?",["Stimola la produzione di melatonina, aiutando ad addormentarsi prima","Blocca la produzione di melatonina, ritardando l'addormentamento e riducendo la qualità del sonno","Non ha effetti scientificamente documentati sul sonno degli adolescenti","Causa affaticamento visivo che porta ad addormentarsi prima"],1,"La melatonina è l'ormone che dice al cervello 'è ora di dormire'. La luce blu degli schermi — che simula la luce del giorno — blocca questa produzione. Usare lo schermo nelle ore prima di dormire ritarda l'addormentamento e riduce la qualità del sonno.",["Non è corretto — è esattamente il contrario. La luce blu blocca la produzione di melatonina, rendendo più difficile addormentarsi.","Esatto! La melatonina è l'ormone che regola il sonno. La luce blu degli schermi segnala al cervello che è ancora giorno, bloccandone la produzione e ritardando l'addormentamento.","Non è corretto. L'effetto della luce blu sulla melatonina è ben documentato dalla ricerca scientifica. Non è un'opinione — è fisiologia.","Non è corretto. L'affaticamento visivo è reale ma diverso dall'effetto sulla melatonina. La luce blu agisce a livello ormonale, non solo visivo."]],["Quante ore di sonno ha bisogno un adolescente? E qual è la media reale italiana dei ragazzi tra 12 e 15 anni?",["Necessario: 6-7 ore. Media italiana: 6 ore.","Necessario: 8-10 ore. Media italiana: circa 7 ore.","Necessario: 7-8 ore. Media italiana: 7,5 ore.","Non esistono raccomandazioni scientifiche precise — dipende dal singolo ragazzo"],1,"Gli adolescenti hanno bisogno di 8-10 ore di sonno per supportare lo sviluppo fisico e neurologico. La media italiana dei 12-15enni è circa 7 ore — un deficit di 1-3 ore che si accumula ogni giorno. La differenza è spesso occupata dall'uso degli schermi nelle ore serali.",["Non è corretto. 6-7 ore non sono sufficienti per un adolescente in pieno sviluppo.","Esatto! Gli adolescenti hanno bisogno di 8-10 ore di sonno — ma la media italiana è di circa 7. La differenza di 1-2 ore al giorno è spesso occupata da schermi nelle ore serali.","Non è corretto. 7-8 ore è la raccomandazione per gli adulti, non per gli adolescenti che sono in piena crescita e sviluppo neurologico.","Non è corretto. Le organizzazioni sanitarie internazionali (OMS, CDC, AAP) hanno linee guida chiare: 8-10 ore per gli adolescenti tra 13 e 18 anni."]],["Cos'è lo 'scroll infinito' e perché è progettato così?",["Una funzione che accelera lo scorrimento dei contenuti per risparmiare tempo all'utente","Un design senza fine: l'app carica sempre nuovi contenuti senza mai dire 'hai finito', perché fermarsi richiede una decisione attiva","Una tecnologia che personalizza i contenuti in base ai tuoi interessi","Una forma di pubblicità nascosta che mostra più annunci rispetto alle app tradizionali"],1,"Lo scroll infinito elimina il segnale di stop: un libro finisce, un film finisce, un feed non finisce mai. L'effetto è che continuare è automatico (percorso di minor resistenza) mentre fermarsi richiede una decisione attiva — che molti non prendono.",["Non è corretto. Lo scroll infinito non è pensato per risparmiare tempo — è progettato per eliminarti qualsiasi segnale che ti dica 'hai finito, puoi fermarti'.","Esatto! Lo scroll infinito elimina il segnale di stop naturale. Continuare è il percorso di minor resistenza — fermarsi richiede una scelta consapevole. E spesso quella scelta non viene presa.","Non è corretto. Quella è la personalizzazione algoritmica (recommendation engine). Lo scroll infinito riguarda invece l'assenza di un punto di fine — non i contenuti specifici mostrati.","Non è corretto. Lo scroll infinito è una scelta di design dell'interfaccia, non un formato pubblicitario."]]],"I":[["Nel cyberbullismo, quale forma consiste nel rivelare informazioni private (foto, segreti) senza consenso, spesso dopo averle ottenute con l'inganno?",["Cyberstalking","Outing e trickery","Impersonificazione","Esclusione"],1,"L'outing (rivelare informazioni private senza consenso) e il trickery (ottenerle con l'inganno) sono spesso combinati: qualcuno conquista la fiducia di una persona per farsi rivelare segreti, foto o informazioni personali — e poi le usa per danneggiarla pubblicamente.",["Non è corretto. Il cyberstalking è il monitoraggio ossessivo e continuo di qualcuno online — seguire il profilo, messaggi continui non desiderati. Non riguarda la rivelazione di informazioni private.","Esatto! L'outing è la rivelazione non consensuale di informazioni private. Il trickery è ottenerle con l'inganno per poi rivelarle. Spesso vanno insieme: si conquista la fiducia della vittima per avere informazioni che poi si usano contro di lei.","Non è corretto. L'impersonificazione è creare profili falsi fingendo di essere qualcun altro. Non riguarda la rivelazione di informazioni private reali.","Non è corretto. L'esclusione è escludere deliberatamente qualcuno da gruppi online o conversazioni condivise — non riguarda la rivelazione di informazioni."]],["Nel cyberbullismo, il TESTIMONE è la figura più numerosa. Quale azione è descritta come la più efficace — e meno rischiosa — per un testimone?",["Scontrarsi pubblicamente nel gruppo con l'autore per difendere la vittima","Supportare privatamente la vittima + segnalare il contenuto alla piattaforma + coinvolgere un adulto","Non fare nulla per non esporsi — è un problema tra autore e vittima","Pubblicare uno screenshot del cyberbullismo per 'smascherare' l'autore agli altri"],1,"Il testimone ha più potere di quanto pensi. La strategia raccomandata è a tre livelli: (1) non amplificare (no like, no condivisioni); (2) supportare privatamente la vittima — riduce l'isolamento; (3) segnalare alla piattaforma e coinvolgere un adulto. Lo scontro frontale pubblico è da evitare perché spesso peggiora la situazione.",["Non è corretto. Il testo dice esplicitamente che lo scontro frontale pubblico può peggiorare la situazione per il testimone e per la vittima. Non è la strategia raccomandata.","Esatto! L'azione meno visibile è spesso la più efficace: il supporto privato alla vittima riduce l'isolamento; la segnalazione alla piattaforma può rimuovere il contenuto; il coinvolgimento di un adulto porta risorse reali.","Non è corretto. Il testimone silenzioso rafforza la percezione dell'autore di agire impunemente. Non fare nulla — o peggio, mettere like — contribuisce al problema.","Non è corretto. Ridiffondere il contenuto — anche con buone intenzioni — può aumentare il danno alla vittima (la cui reputazione viene ulteriormente esposta). Non è la strategia raccomandata."]],["Giulia controlla il telefono appena sveglia, prova irritabilità quando non può usarlo, e continua a scrollare anche dopo aver detto 'adesso smetto'. Quale categoria descrive meglio il suo comportamento?",["Uso sano — questi comportamenti sono normali per una ragazza della sua età","Segnali di uso problematico — indicatori che il rapporto con la tecnologia merita attenzione","Dipendenza clinica — Giulia ha bisogno di cure mediche immediate","Comportamento adolescenziale normale legato allo sviluppo cognitivo"],1,"Il testo elenca 6 segnali di uso problematico. Giulia ne mostra almeno tre: controlla il telefono appena sveglia, prova irritabilità senza di esso, continua dopo aver deciso di smettere. Non è una diagnosi di dipendenza — ma è un segnale che il suo rapporto con la tecnologia merita riflessione.",["Non è corretto. Controllare il telefono prima ancora di alzarsi, l'irritabilità senza dispositivo, e l'incapacità di fermarsi sono tutti segnali di uso problematico elencati nel testo.","Esatto! Il testo elenca esattamente questi tre come segnali di uso problematico: controllo del telefono appena svegli, irritabilità senza dispositivo, continuare a usare anche dopo aver deciso di smettere.","Non è corretto. Il testo specifica che questi segnali non significano automaticamente 'dipendenza' — sono indicatori che il rapporto merita attenzione. La diagnosi clinica richiede una valutazione professionale.","Non è corretto. Il testo distingue chiaramente tra la normalità dello sviluppo neurologico adolescenziale (corteccia prefrontale in sviluppo) e i segnali specifici di uso problematico."]],["Quale funzione dello smartphone permette di vedere i dati reali del proprio uso quotidiano?",["La cronologia del browser","'Tempo schermo' (iPhone) o 'Benessere digitale' (Android)","Le statistiche di utilizzo dati della SIM","Il calendario del telefono — puoi calcolare il tempo confrontando gli appuntamenti"],1,"La funzione 'Tempo schermo' (iPhone) o 'Benessere digitale' (Android) è già integrata in tutti gli smartphone moderni e mostra dati precisi: ore totali di utilizzo, app più usate, numero di notifiche. Il testo suggerisce di guardarli perché 'probabilmente ti sorprenderà'.",["Non è corretto. La cronologia mostra i siti visitati, non il tempo totale trascorso sulle app.","Esatto! Queste funzioni, disponibili su tutti gli smartphone moderni, mostrano quante ore al giorno hai usato il telefono, quali app hai usato di più, quante notifiche hai ricevuto. Sono molto più affidabili della memoria.","Non è corretto. Le statistiche dati mostrano quanti MB/GB hai consumato, non il tempo trascorso sulle singole app.","Non è corretto. Il calendario mostra gli eventi programmati, non il tempo di utilizzo effettivo dello smartphone."]],["Cosa prevede la Legge n. 71/2017 per le vittime minorenni di cyberbullismo in Italia?",["La vittima può denunciare solo tramite i genitori presso la procura dei minori","La vittima può chiedere direttamente alle piattaforme di rimuovere i contenuti; il questore può ammonire l'autore","Vieta alle piattaforme social di permettere l'iscrizione ai minori di 14 anni","Rende obbligatorio l'insegnamento del cyberbullismo in tutte le scuole italiane"],1,"La Legge n. 71/2017 tutela i minori vittime di cyberbullismo con un doppio strumento: (1) la vittima può chiedere direttamente alle piattaforme di rimuovere o bloccare i contenuti lesivi; (2) il questore può ammonire l'autore anche senza denuncia penale formale.",["Non è corretto. La legge prevede un percorso più diretto, senza obbligo di denuncia penale formale come primo passo.","Esatto! La L. 71/2017 ha creato un percorso specifico per i minori: richiesta diretta di rimozione alle piattaforme (senza passare per il tribunale) e ammonimento del questore per l'autore.","Non è corretto. Questo è il limite di età per l'iscrizione ai social (in parte regolato dal GDPR), non il contenuto della L. 71/2017 sul cyberbullismo.","Non è corretto. Il D.M. 183/2024 (Linee guida Educazione Civica) inserisce il tema nelle scuole. La L. 71/2017 si occupa invece della tutela delle vittime."]],["Tra le seguenti strategie per ridurre l'uso inconsapevole della tecnologia, quale è descritta come più efficace perché 'non richiede forza di volontà costante'?",["Disinstallare le app social dal telefono","Stabilire zone e orari senza schermo (es. niente telefono a tavola, niente schermo un'ora prima di dormire)","Usare il telefono solo per 30 minuti al giorno in totale","Chiedere ai genitori di controllare il telefono ogni sera"],1,"Le ricerche mostrano che le 'zone senza schermo' (niente telefono a tavola, niente schermo un'ora prima di dormire) riducono significativamente l'uso inconsapevole — senza richiedere forza di volontà costante. La regola viene decisa una volta sola e poi si applica automaticamente al contesto.",["Non è descritto nel testo come la strategia raccomandata — richiede una scelta radicale che spesso non è sostenibile nel lungo periodo.","Esatto! Le regole contestuali (per zona o per orario) funzionano perché creano automatismi — si smette di dover decidere ogni volta. Non c'è bisogno di 'forza di volontà' perché la regola è già stata presa.","Non è la strategia descritta nel testo. Limiti di tempo rigidi e molto bassi richiedono costante monitoraggio e autocontrollo — non sono automatici.","Non è la strategia descritta nel testo. Il controllo esterno non sviluppa la capacità personale di gestire il proprio uso — è una misura contingente, non una competenza."]]],"A":[["Perché è più difficile resistere alle notifiche a 13 anni che a 25, secondo il testo?",["Perché i ragazzi di 13 anni hanno meno esperienza nell'uso dei dispositivi","Perché la corteccia prefrontale — la parte che gestisce il controllo degli impulsi — è ancora in sviluppo negli adolescenti","Perché i social media sono progettati specificamente per i giovani","Perché gli adulti hanno più impegni e meno tempo per controllare il telefono"],1,"La corteccia prefrontale — responsabile del controllo degli impulsi, della valutazione delle conseguenze e del pensiero a lungo termine — non completa lo sviluppo fino ai 25 anni circa. Questo non è un difetto, è una fase normale dello sviluppo. Ma spiega perché il 'freno neurologico' degli adolescenti è più debole — non è mancanza di volontà, è biologia.",["Non è corretto. Non è una questione di esperienza — è una questione neurologica. I ragazzi di 13 anni usano i dispositivi spesso tanto quanto gli adulti.","Esatto! La corteccia prefrontale completa il suo sviluppo solo intorno ai 25 anni. È la parte del cervello che gestisce il controllo degli impulsi e il pensiero a lungo termine — il 'freno neurologico' è ancora in costruzione.","Non è corretto. I social media sono progettati per tutti gli utenti — non esiste un design specifico per gli adolescenti. La differenza nella resistenza è neurologica, non di design.","Non è corretto. Gli adulti con molti impegni non necessariamente resistono meglio alle notifiche. La differenza è neurologica — non dipende dal tempo disponibile."]],["Quale affermazione dimostra meglio che 'la qualità dell'uso conta più della quantità'?",["Guardare un video su YouTube per 2 ore è sempre dannoso, indipendentemente dal contenuto","Chiamare un amico su FaceTime per un'ora ha un impatto diverso dallo scrollare passivamente il feed per un'ora — stessa durata, uso qualitativamente diverso","Le app educative sono sempre migliori dei social media, qualunque sia il tempo di utilizzo","Nessuna tecnologia digitale è davvero utile — il tempo al computer è sempre meno produttivo del tempo di persona"],1,"La stessa durata può avere impatti molto diversi in base alla qualità dell'uso: chiamare un amico, imparare a suonare con un tutorial, leggere un approfondimento sono attività diverse dallo scroll passivo per un'ora. La ricerca suggerisce di chiedersi 'cosa sto facendo e perché' — non solo 'quante ore'.",["Non è corretto. È esattamente il contrario di ciò che il testo sostiene: la qualità — cosa stai facendo e perché — conta più della durata.","Esatto! Stessa durata, impatto radicalmente diverso: la video-chiamata è interazione sociale attiva; lo scroll passivo è consumo senza scopo. La differenza non è il tempo — è cosa e come.","Non è corretto. La distinzione non è per categoria di app, ma per qualità dell'uso: un'app educativa usata passivamente e senza scopo può essere meno benefica di un social usato per una comunicazione significativa.","Non è corretto. Il testo non sostiene questa posizione: 'usare la tecnologia non è di per sé un problema — il problema è la qualità e la consapevolezza dell'uso'."]],["Un'app social introduce un indicatore del tempo trascorso e suggerisce pause ogni 45 minuti. Qual è l'impatto probabile sul modello di business dell'app?",["Nessun impatto — gli utenti ignorano le notifiche di pausa","Riduzione del tempo trascorso sull'app → meno pubblicità visualizzata → meno entrate","Aumento delle entrate — gli utenti si fidano di più dell'app e la usano per più anni","Nessun impatto — le entrate vengono da abbonamenti premium, non dalla pubblicità"],1,"Il conflitto di interessi è reale: le app gratuite guadagnano dalla pubblicità, quindi ogni minuto in meno sull'app riduce le entrate. Design etico (indicatori del tempo, pause suggerite) è un costo immediato per l'azienda — bilanciato da potenziali benefici a lungo termine (fiducia, normativa favorevole).",["Non è corretto. Le ricerche mostrano che i nudge (piccoli spinti) cambiano il comportamento. Se le pause funzionassero anche solo per il 20% degli utenti, l'impatto sul tempo totale — e sulle entrate pubblicitarie — sarebbe significativo.","Esatto! Il modello di business si basa sul tempo di attenzione: più tempo sullo schermo = più pubblicità = più entrate. Qualsiasi design che riduca il tempo riduce anche le entrate nel breve termine — è il 'costo' del design etico.","Questo è un argomento che alcuni difensori del design etico fanno (fiducia a lungo termine = retention), ma il testo non lo presenta come l'effetto immediato. L'effetto diretto è una riduzione del tempo e delle entrate.","Non è corretto — il testo specifica che la maggior parte delle app gratuite guadagna dalla pubblicità: più tempo = più pubblicità = più entrate. La premessa della risposta è sbagliata."]],["Nel caso del WhatsApp di classe descritto (scenario INTERMEDIO), le 12 persone che mettono like o aggiungono commenti simili: sono autori o testimoni?",["Sono testimoni passivi — non hanno iniziato loro il cyberbullismo","Si trovano in una zona grigia: sono inizialmente testimoni ma diventano co-autori amplificando il contenuto","Sono autori a tutti gli effetti — la legge li tratta come l'iniziatore del cyberbullismo","Sono testimoni innocenti — la responsabilità è solo di chi ha pubblicato il messaggio iniziale"],1,"Il caso dello scenario INTERMEDIO mostra la zona grigia del testimone: le 12 persone non hanno iniziato il cyberbullismo, ma mettendo like e commenti simili lo amplificano — aumentano la visibilità del contenuto offensivo e segnalano all'autore che il comportamento è socialmente accettato. Il testo invita esplicitamente a riflettere su questa sfumatura.",["Non è corretto. Il testo specifica che chi mette like o condivide contribuisce al problema — non è semplicemente un testimone passivo. Il like amplifica il contenuto e rinforza l'autore.","Esatto! Il testo riconosce questa sfumatura: chi mette like o commenta non ha iniziato il cyberbullismo, ma contribuisce a esso. È una zona grigia — 'è autore o testimone?' — che il testo invita esplicitamente ad analizzare.","Non è corretto. La legge distingue tra autore principale e chi amplifica. La situazione legale è complessa, ma il testo non equipara chi mette like all'autore principale.","Non è corretto. Il testo dice esplicitamente che 'il testimone silenzioso rafforza la percezione dell'autore di agire impunemente' — e chi mette like fa ancora di più."]],["La Francia ha vietato gli smartphone nelle scuole (2018) con risultati positivi. Perché il testo presenta questa come una questione 'complessa' piuttosto che come una soluzione semplice?",["Perché il veto è illegale secondo la normativa europea sui diritti digitali","Perché interseca diritti individuali, salute pubblica e responsabilità di decisione (famiglie, scuole, governo, ragazzi) senza una risposta unica corretta","Perché la tecnologia è cambiata così tanto che le regole del 2018 sono già obsolete","Perché i dati della Francia mostrano risultati negativi che non vengono riportati"],1,"Il testo presenta la questione come complessa perché coinvolge valori in tensione: salute pubblica (i risultati positivi della Francia), libertà individuale e autonomia (dei ragazzi, delle famiglie), e ruoli diversi (chi decide — scuole, governo, famiglie, ragazzi?). Non esiste una risposta scientificamente 'corretta' — è una scelta politica e valoriale.",["Non è corretto. La Francia ha potuto vietare legalmente gli smartphone nelle scuole — la normativa europea non lo impedisce.","Esatto! Il testo conclude con 'la domanda da porsi: chi deve prendere questa decisione — famiglie, scuole, governo, o i ragazzi stessi?' Non c'è una risposta unica — è una questione di bilanciamento tra valori diversi.","Non è corretto. Il testo non usa questo argomento. La complessità è di natura etica e politica — non tecnologica.","Non è corretto. Il testo riporta risultati positivi del caso francese: più socializzazione, meno bullismo, nessun impatto negativo sui risultati scolastici."]],["Cosa distingue fondamentalmente un 'design etico' da un 'design per l'engagement massimo'?",["Il design etico è gratuito; il design per l'engagement è a pagamento","Il design etico ottimizza per il benessere dell'utente; il design per l'engagement ottimizza per il tempo sullo schermo e le entrate pubblicitarie","Il design etico è riservato alle app per bambini; il design per l'engagement è per gli adulti","Il design etico rimuove tutte le funzionalità social; il design per l'engagement le massimizza"],1,"Il design etico e il design per l'engagement massimizzano cose diverse: il primo il benessere dell'utente, il secondo il tempo sullo schermo. Esempi di design etico: indicatori del tempo trascorso, pause suggerite, notifiche controllabili, assenza di scroll infinito. Questi riducono il fatturato nel breve termine ma costruiscono fiducia a lungo termine.",["Non è corretto. Il modello di pagamento non definisce l'eticità del design — un'app gratuita può avere un design etico, e una a pagamento può massimizzare l'engagement.","Esatto! È una questione di obiettivo di ottimizzazione: il design etico si chiede 'cosa fa bene all'utente?'; il design per l'engagement si chiede 'come facciamo restare l'utente più a lungo possibile?'. I due obiettivi spesso si scontrano.","Non è corretto. Il design etico è un approccio applicabile a qualsiasi prodotto digitale, indipendentemente dall'età dell'utente.","Non è corretto. Il design etico non rimuove le funzionalità — le ridisegna per ridurre i danni. Es: le notifiche rimangono, ma diventano meno invadenti e più controllabili dall'utente."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
