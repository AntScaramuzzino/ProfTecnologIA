<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Banco dei materiali</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-MAT-1-01","F":[["Quante famiglie di materiali esistono secondo la classificazione del testo?",["Tre: legno, metallo e plastica","Sei: legno, metalli, plastiche, ceramiche, vetro e materiali compositi","Quattro: naturali, artificiali, riciclabili e non riciclabili","Dieci, una per ogni tipo di materia prima principale usata nell'industria"],1,"I materiali si raggruppano in sei grandi famiglie: legno, metalli, plastiche, ceramiche, vetro e materiali compositi. Ogni famiglia ha caratteristiche fisiche, meccaniche e ambientali comuni che la distinguono dalle altre e la rendono adatta a certi usi.",["Non è corretto. Il testo identifica sei famiglie di materiali, non solo tre.","Esatto! Le sei grandi famiglie di materiali sono: legno, metalli, plastiche, ceramiche, vetro e materiali compositi. Ognuna ha caratteristiche comuni che la distinguono dalle altre.","Non è corretto. Questa è una classificazione basata sull'origine e la sostenibilità, non sulla tipologia di materiale. Le sei famiglie del testo sono diverse.","Non è corretto. Le famiglie di materiali non coincidono con il numero di materie prime. Le sei famiglie raggruppano centinaia di materiali diversi per proprietà comuni."]],["Cos'è la 'materia prima' di un materiale?",["Il materiale già lavorato e pronto per essere usato nella produzione industriale","La risorsa naturale dal cui prelievo inizia il processo produttivo di un materiale (minerale, pianta, petrolio...)","Il rifiuto che rimane dopo che un materiale ha finito il suo ciclo di vita utile","Il componente chimico principale (es. carbonio, ferro) di cui è fatto un materiale"],1,"La materia prima è la risorsa naturale dal cui prelievo inizia il processo produttivo: legno dalle foreste, ferro da minerali di ematite, alluminio dalla bauxite, plastica dal petrolio. Ogni materia prima viene estratta o coltivata in luoghi specifici del mondo, percorrendo spesso migliaia di km prima di diventare oggetto.",["Non è corretto. Il materiale lavorato è il prodotto della trasformazione, non la materia prima. La materia prima è il punto di partenza grezzo.","Esatto! La materia prima è il punto di partenza: il legno dai boschi, il ferro dai minerali, la plastica dal petrolio. Da essa, attraverso lavorazioni, si ottiene il materiale finale.","Non è corretto. Il rifiuto è la fase finale del ciclo di vita. La materia prima è la fase iniziale, il punto di partenza naturale del processo produttivo.","Non è corretto. Il componente chimico è una proprietà del materiale. La materia prima è la risorsa naturale (es. bauxite per l'alluminio, non l'alluminio stesso)."]],["Perché il legno è considerato 'leggero rispetto alla sua resistenza'?",["Perché contiene grandi quantità di aria intrappolata che lo fanno galleggiare sull'acqua","Perché il legno di quercia è più resistente dell'alluminio a parità di peso","Perché il suo peso diminuisce progressivamente quando viene essiccato e lavorato","Perché le fibre di cellulosa che lo compongono sono più resistenti di qualsiasi fibra metallica"],1,"Il legno di quercia ha resistenza specifica superiore all'alluminio: a parità di peso, è più resistente. Questo è possibile grazie alla struttura delle fibre di cellulosa e alla bassa densità (600-900 kg/m³ vs 2.700 kg/m³ dell'alluminio). Per questo era il materiale per le imbarcazioni e oggi per le strutture in legno lamellare.",["Non è corretto. Il fatto che galleggi è una conseguenza, non la spiegazione della resistenza specifica. Il confronto rilevante è con i metalli a parità di peso.","Esatto! Il legno di quercia ha una resistenza specifica (resistenza per unità di peso) superiore all'alluminio. È leggero (densità ~700 kg/m³) ma robusto: per questo si usava per le barche e si usa per le strutture.","Non è corretto. L'essiccazione rimuove l'umidità e riduce il peso, ma questo non spiega perché è 'leggero rispetto alla resistenza'. Il concetto è di resistenza specifica.","Non è corretto. Le fibre di cellulosa non sono più resistenti delle fibre metalliche in termini assoluti. Il vantaggio del legno è nella resistenza specifica (resistenza/peso), non nella resistenza assoluta."]],["Cosa sono le 'proprietà' di un materiale?",["Il prezzo di mercato e la disponibilità commerciale del materiale in una certa regione","Le caratteristiche fisiche, meccaniche e ambientali che rendono un materiale adatto a certe funzioni","La storia geologica di come si è formato il materiale nell'ambiente naturale","Il peso totale e il volume di un materiale in una specifica applicazione"],1,"Le proprietà di un materiale sono le sue caratteristiche fisiche, meccaniche, termiche, elettriche e ambientali: durezza, resistenza, duttilità, conduttività, corrosione, biodegradabilità... Classificare un materiale attraverso le sue proprietà permette di scegliere quello giusto per ogni funzione.",["Non è corretto. Prezzo e disponibilità sono fattori economici e logistici, non proprietà del materiale in senso tecnico.","Esatto! Le proprietà descrivono il comportamento del materiale: resistenza meccanica, conduttività termica, durezza, flessibilità, resistenza alla corrosione, biodegradabilità... Queste caratteristiche determinano dove e come il materiale può essere usato.","Non è corretto. La storia geologica è interessante ma non è la proprietà del materiale in senso tecnico. Le proprietà descrivono il comportamento attuale, non l'origine.","Non è corretto. Peso e volume specifici di un'applicazione dipendono dal progetto. Le proprietà del materiale sono caratteristiche intrinseche (es. densità, non peso totale)."]],["Da dove proviene la plastica?",["Da minerali come la bauxite, estratti dalle miniere in Africa e Australia","Dal petrolio (o gas naturale), trasformato chimicamente in polimeri","Dagli alberi, attraverso un processo di distillazione del legno simile alla produzione del carbone","Dal vetro riciclato, trasformato attraverso trattamenti chimici in materiale flessibile"],1,"Quasi tutte le plastiche derivano dal petrolio (o dal gas naturale). Il petrolio viene raffinato per separare le sue componenti, e alcune vengono trasformate chimicamente in monomeri, poi polimerizzate in catene lunghe di molecole (polimeri). Diversi polimeri danno plastiche con proprietà molto diverse (PET, HDPE, PVC, PP...).",["Non è corretto. La bauxite è la materia prima dell'alluminio, non della plastica. La plastica deriva da una fonte organica fossile diversa.","Esatto! Quasi tutte le plastiche derivano dal petrolio. Il petrolio viene raffinato e alcune componenti vengono trasformate in monomeri, poi polimerizzate in catene lunghe (polimeri) che costituiscono le plastiche.","Non è corretto. La plastica non deriva dal legno. Dal legno si ottengono carta, compensato, cellulosa. La plastica viene quasi esclusivamente dal petrolio.","Non è corretto. Il vetro e la plastica sono materiali completamente diversi con origini diverse. La plastica non deriva dal vetro riciclato."]],["Perché il Giappone costruisce tradizionalmente molti edifici in legno?",["Perché il legno è il materiale più abbondante in Giappone e ha un costo molto basso","Perché il legno si piega e oscilla senza collassare durante i terremoti, mentre il cemento si sbriciolava","Perché gli architetti giapponesi hanno sviluppato uno stile estetico che preferisce i materiali naturali","Perché il legno è più igienico del cemento nelle case tradizionali giapponesi dove ci si toglie le scarpe"],1,"Il Giappone è uno dei paesi più sismici al mondo. Il legno ha duttilità: si piega, oscilla, assorbe l'energia sismica senza collassare di schianto. Il cemento è rigido e fragile: se supera la resistenza, si rompe improvvisamente. Le case di legno tradizionali giapponesi sopravvivono ai terremoti meglio delle costruzioni in muratura o cemento.",["Non è corretto. Il Giappone importa molta legna e il costo non è necessariamente basso. La ragione principale è strutturale e legata al rischio sismico.","Esatto! Il legno ha duttilità: si deforma prima di rompersi e assorbe l'energia sismica. Le case di legno resistono meglio alle scosse rispetto a quelle di cemento che si sbriciolano di schianto.","Non è corretto. Sebbene ci sia una tradizione estetica con materiali naturali, la ragione principale dell'uso del legno in Giappone è funzionale: la resistenza sismica.","Non è corretto. L'igiene non è la ragione principale. Il cemento può essere altrettanto igienico. La ragione è la resistenza sismica."]]],"I":[["Perché le finestre sono in vetro e non in legno, nonostante il legno sia più resistente?",["Perché il vetro è più economico del legno nel breve periodo","Perché il vetro è trasparente (lascia passare la luce), una proprietà che il legno non ha","Perché il vetro è più leggero del legno e non sovraccarica le pareti dell'edificio","Perché il legno a contatto con la pioggia si gonfia e ostruirebbe la finestra"],1,"Il ragionamento del progettista: quale funzione deve svolgere una finestra? Lasciare passare la luce (trasparenza), isolare dal freddo (isolamento termico) e dalla pioggia (impermeabilità), resistere al vento. Il vetro è trasparente e resistente alla pioggia: adatto. Il legno non è trasparente: per una finestra non va, per quanto sia resistente.",["Non è corretto. Il vetro non è necessariamente più economico. La ragione per cui le finestre sono in vetro è una proprietà specifica del vetro che il legno non ha.","Esatto! La finestra ha la funzione di far entrare la luce. Il vetro è trasparente: lascia passare la luce visibile. Il legno, per quanto resistente, è opaco. La scelta del materiale dipende dalla funzione richiesta.","Non è corretto. Il vetro (densità ~2.500 kg/m³) è più pesante del legno (600-900 kg/m³), non più leggero. La ragione è la trasparenza.","Non è corretto. Il gonfiamento del legno con l'umidità è un problema reale, ma non è la ragione principale per cui le finestre sono in vetro. La ragione è la trasparenza."]],["Perché i fili elettrici sono ricoperti di plastica e non di metallo?",["Perché la plastica è più flessibile del metallo e non si rompe quando si piega il cavo","Perché la plastica è un isolante elettrico: non fa passare la corrente, proteggendo chi tocca il cavo","Perché la plastica è più economica di qualsiasi altro materiale isolante disponibile","Perché la plastica riflette le onde elettromagnetiche emesse dai cavi ad alta tensione"],1,"Il progettista ha scelto: filo in rame (massima conduttività elettrica), rivestimento in PVC o polietilene (ottimi isolanti elettrici, flessibili, resistenti). La logica è: usa ogni materiale per la proprietà in cui eccelle. Il rame per condurre la corrente; la plastica per impedirle di uscire in modo pericoloso.",["Non è corretto. La flessibilità è un vantaggio ma non è la ragione principale del rivestimento plastico dei fili elettrici.","Esatto! Il filo interno è in rame (ottimo conduttore elettrico). Il rivestimento è in plastica (ottimo isolante elettrico): la corrente scorre nel rame ma non può uscire attraverso la plastica. Protegge dall'elettrocuzione.","Non è corretto. Ci sono altri isolanti (gomma, ceramica, vetro). La plastica è scelta per la combinazione di isolamento elettrico, flessibilità, resistenza chimica e costo. Ma la ragione principale è l'isolamento.","Non è corretto. I rivestimenti plastici non riflettono le onde elettromagnetiche. La funzione è l'isolamento elettrico: impedire il passaggio di corrente verso l'esterno."]],["L'anatomia di una scarpa da ginnastica usa materiali diversi per parti diverse. Quale principio di progettazione dimostra?",["Che i produttori usano più materiali per aumentare il prezzo di vendita del prodotto","Che ogni parte dell'oggetto usa il materiale ottimale per la funzione specifica di quella parte","Che i materiali naturali (cotone, gomma) sono sempre superiori ai sintetici nelle scarpe sportive","Che la durata della scarpa dipende dal numero di materiali diversi usati nella sua costruzione"],1,"L'anatomia di una scarpa da ginnastica è un caso studio di material selection: suola esterna (gomma: attrito, durata), intersuola (EVA: ammortizzazione), tomaia (mesh sintetica: traspirabilità, leggerezza), rinforzo tallone (plastica rigida: supporto). Ogni parte usa il materiale ottimale per la sua specifica funzione.",["Non è corretto. L'uso di materiali multipli ha ragioni funzionali, non di marketing. Ogni parte della scarpa ha esigenze diverse che richiedono materiali diversi.","Esatto! La suola usa gomma (attrito + ammortizzazione), la tomaia usa mesh (traspirabilità + leggerezza), la soletta usa schiuma EVA (ammortizzazione), il tallone usa plastica rigida (supporto). Ogni materiale è scelto per la funzione di quella parte.","Non è corretto. La scarpa da ginnastica usa sia materiali naturali che sintetici, scelti per le loro proprietà specifiche, non per la naturalità.","Non è corretto. La durata dipende dalla qualità di ogni materiale e dalla qualità del processo produttivo, non dal numero di materiali usati."]],["Perché la ceramica si usa per le tazze da caffè ma non per le suole delle scarpe?",["Perché la ceramica è troppo costosa per un uso quotidiano come le scarpe","Perché la ceramica regge bene le alte temperature e la chimica del caffè, ma è fragile all'impatto meccanico (colpi, flessioni)","Perché la ceramica assorbe l'umidità e si deteriorerebbe a contatto con il suolo bagnato","Perché la ceramica è troppo pesante per essere usata nelle suole senza affaticare eccessivamente chi cammina"],1,"La ceramica è ottima per le tazze: resistente al calore (caffè bollente), chimicamente inerte (non altera il sapore), facile da lavare, dura. Ma per le suole: ogni passo è un impatto, le suole si flettono continuamente → la ceramica si romperebbe subito. Ogni materiale va scelto in funzione delle sollecitazioni a cui sarà soggetto.",["Non è corretto. Il costo non è la ragione principale. Esistono ceramiche economiche. La ragione è meccanica: le proprietà della ceramica sono adatte a certi usi e inadatte ad altri.","Esatto! La ceramica è resistente al calore, chimicamente inerte (non reagisce con il caffè), igienicamente lavabile. Ma è fragile all'impatto e non flessibile: cadendo si rompe. Per una suola (impatti continui, flessioni ripetute) è inutilizzabile.","Non è corretto. Le ceramiche smaltate non assorbono l'umidità. Il problema delle ceramiche per le suole è la fragilità all'impatto meccanico, non l'umidità.","Non è corretto. Le ceramiche moderne possono essere leggere. Il problema principale è la fragilità all'impatto meccanico ripetuto, non il peso."]],["Da dove viene la materia prima dell'alluminio e perché questo è rilevante per il consumatore?",["Da cave di marmo in Italia e in Europa: una risorsa locale che non crea problemi di filiera","Dalla bauxite, estratta principalmente in Guinea, Australia e Vietnam: un oggetto di alluminio ha già percorso migliaia di km prima di arrivare da te","Da foreste italiane certificate FSC: l'alluminio è un materiale rinnovabile come il legno","Dal riciclo di altri metalli: l'alluminio prodotto oggi viene quasi interamente da materiale riciclato"],1,"La bauxite (minerale dell'alluminio) viene principalmente da Guinea, Australia, Vietnam. Viene poi trasportata in impianti di raffinazione, poi in fonderie, poi in fabbriche di prodotti finiti. Un oggetto di alluminio che compri ha già percorso decine di migliaia di km. Sapere da dove vengono le materie prime è il primo passo per valutare l'impatto di quello che compriamo.",["Non è corretto. La bauxite (materia prima dell'alluminio) viene principalmente dall'Africa occidentale, Australia, Vietnam: non da cave di marmo italiane.","Esatto! La bauxite viene da paesi lontani (Guinea, Australia, Vietnam), poi viene raffinate in alluminio in altri paesi, poi lavorata in altri ancora. Un oggetto di alluminio che compri ha già percorso migliaia di km, con impatti ambientali e sociali di cui potresti non essere consapevole.","Non è corretto. L'alluminio non viene dalle foreste: è un metallo che viene dalla bauxite (roccia minerale). Non è rinnovabile nel breve termine come il legno.","Non è corretto. Solo circa il 30-35% dell'alluminio viene dal riciclo: la maggior parte è ancora produzione primaria dalla bauxite. Il riciclo è importante ma non è la fonte dominante."]],["Cosa distingue un materiale 'naturale' da uno 'artificiale' nella classificazione del testo?",["Un materiale naturale è sempre biodegradabile; uno artificiale non lo è mai","Un materiale naturale esiste in natura senza processi umani (legno, pietra, cotone); uno artificiale richiede processi chimici o industriali per essere prodotto","Un materiale naturale viene dall'ambiente organico (piante, animali); uno artificiale viene dal suolo e dalle rocce (inorganico)","Un materiale naturale non può essere riciclato; uno artificiale può essere riciclato"],1,"Un materiale 'naturale' esiste in natura nella forma in cui si usa o con lavorazioni minime (legno, pietra, cotone, lana). Uno 'artificiale' richiede processi chimici o industriali per essere creato (acciaio, vetro, plastica, cemento). Ma questa distinzione non implica che naturale = buono, artificiale = cattivo: dipende dal contesto d'uso e dall'impatto ambientale totale.",["Non è corretto. Alcuni materiali naturali (come alcuni minerali) non sono biodegradabili. E alcune plastiche artificiali sono biodegradabili. Non è una distinzione sempre valida.","Esatto! Naturale = esiste in natura nella forma in cui si usa (o con lavorazioni minime). Artificiale = richiede processi chimici o industriali per essere creato (es. plastica, acciaio, vetro). Ma la distinzione non implica che uno sia migliore dell'altro.","Non è corretto. Il legno è naturale e organico; la pietra è naturale e inorganica. L'acciaio è artificiale e viene da rocce (inorganico). La distinzione organico/inorganico non coincide con naturale/artificiale.","Non è corretto. Molti materiali naturali si riciclano (carta, metalli da minerali naturali). E molte plastiche artificiali hanno bassi tassi di riciclo. Il riciclo non è il criterio che distingue naturale da artificiale."]]],"A":[["Un progettista deve scegliere il materiale per il telaio di una bicicletta. Vuole: leggerezza, resistenza alla corrosione, alta resistenza meccanica, costo moderato. Quale materiale suggerisce il testo?",["La ceramica avanzata: altissima resistenza meccanica e nessuna corrosione","L'alluminio: leggero (un terzo dell'acciaio), resistente alla corrosione (strato di ossido protettivo), buona resistenza meccanica specifica, costo moderato","Il legno massiccio: naturale, riciclabile, buona resistenza meccanica","Il vetro temeprato: leggero, resistente alla corrosione, costo basso"],1,"L'alluminio risponde a tutti i requisiti: leggero (un terzo dell'acciaio a parità di volume), non corrode (strato spontaneo di Al₂O₃), resistenza specifica buona, costo moderato. Per questo la maggior parte delle biciclette da 300 a 1.500 euro ha telaio in alluminio. Le bici professionali usano fibra di carbonio (più leggera e rigida, ma molto più costosa).",["Non è corretto. La ceramica è fragile all'impatto dinamico (tipico di una bicicletta). Non è adatta per un telaio soggetto a vibrazioni e colpi.","Esatto! L'alluminio è leggero (densità 2,7 g/cm³), non arrugginisce (strato di ossido spontaneo), ha buona resistenza specifica. Per questo è il materiale più usato per telai di bici entry-to-mid level. Il carbonio è meglio ma molto più costoso.","Non è corretto. Il legno ha buona resistenza ma assorbe l'umidità (si deforma, perde resistenza), è difficile da lavorare nelle forme complesse dei telai, e non è usato per biciclette moderne.","Non è corretto. Il vetro è fragile all'impatto (specialmente rilevante per un telaio di bici soggetto a cadute). Non è un materiale strutturale adatto per telai soggetti a carichi dinamici."]],["Perché le scarpe da ginnastica non sono fatte di un solo materiale?",["Perché le leggi italiane sulla sicurezza dei consumatori impongono l'uso di almeno tre materiali diversi","Perché nessun singolo materiale ottimizza tutte le proprietà necessarie in ogni parte della scarpa (attrito, ammortizzazione, traspirabilità, supporto, leggerezza)","Perché l'uso di materiali diversi riduce il costo di produzione permettendo di usare materiali più economici in ciascuna parte","Perché i consumatori preferiscono esteticamente le scarpe con più colori, e colori diversi richiedono materiali diversi"],1,"Una scarpa da ginnastica deve soddisfare requisiti diversi e spesso incompatibili: attrito con il suolo, ammortizzazione degli impatti, traspirabilità, supporto del tallone, leggerezza complessiva, durata. Nessun materiale ottimizza tutte queste proprietà. La soluzione è usare materiali diversi per parti diverse, ognuno ottimale per la sua specifica funzione.",["Non è corretto. Non esiste una legge che impone il numero di materiali. La ragione è funzionale: diverse parti della scarpa hanno esigenze diverse.","Esatto! La suola deve avere attrito e ammortizzazione (gomma, EVA). La tomaia deve essere traspirante e leggera (mesh). Il rinforzo del tallone deve dare supporto rigido (plastica). Nessun materiale eccelle in tutte queste proprietà contemporaneamente.","Non è corretto. L'uso di materiali multipli aumenta la complessità di produzione. La ragione è funzionale: ogni parte ha esigenze diverse che richiedono il materiale ottimale.","Non è corretto. I colori possono essere applicati allo stesso materiale. La scelta di materiali diversi è funzionale, non estetica."]],["Un ingegnere deve progettare un contenitore per alimenti che sia: trasparente, resistente ai grassi, non tossico, lavabile ad alte temperature, leggero. Quale famiglia di materiali è più indicata?",["I metalli: resistenti, non tossici e riciclabili","Le plastiche specifiche come il polipropilene (PP): trasparente o traslucido, resistente ai grassi, non tossico, resistente alle alte temperature del lavaggio","Il legno: naturale, non tossico, e con bel aspetto estetico","Il vetro: trasparente e non tossico, ma pesante per uso quotidiano"],1,"Il PP (polipropilene) soddisfa tutti i requisiti: semi-trasparente, resistente ai grassi alimentari, approvato per contatto alimentare (non tossico), resiste fino a 120-130°C (lavastoviglie e microonde), molto leggero (densità 0,9 g/cm³, galleggia sull'acqua). Per questo la maggior parte dei contenitori per alimenti riutilizzabili è in PP.",["Non è corretto. I metalli non sono trasparenti. Per un contenitore alimentare che deve permettere di vedere il contenuto, la trasparenza è un requisito che i metalli non soddisfano.","Esatto! Il PP (polipropilene, simbolo 5) è resistente al calore (microonde, lavastoviglie), ai grassi, non rilascia sostanze tossiche approvate per uso alimentare, è leggero, e può essere trasparente o traslucido.","Non è corretto. Il legno non è trasparente, assorbe l'umidità (difficile da igienizzare), non è adatto per il lavaggio ad alte temperature. Non soddisfa quasi nessuno dei requisiti richiesti.","Non è del tutto corretto. Il vetro soddisfa trasparenza, resistenza ai grassi e non tossicità, ma è pesante (non soddisfa 'leggero') e può rompersi. Il PP soddisfa meglio tutti i requisiti combinati."]],["Il testo afferma che 'classificare un materiale significa descriverlo attraverso le sue proprietà'. Perché questa competenza è utile per un consumatore, non solo per un ingegnere?",["Permette di capire se un materiale è italiano o straniero per fare scelte di acquisto patriottiche","Permette di capire perché un oggetto è fatto in quel modo, valutare la sua durata e il suo impatto ambientale, e fare scelte di acquisto più consapevoli","Permette di riparare autonomamente qualsiasi oggetto senza bisogno di tecnici specializzati","Permette di produrre artigianalmente materiali avanzati come la fibra di carbonio a casa"],1,"Conoscere le proprietà dei materiali permette al consumatore di: capire perché un oggetto ha determinate caratteristiche (funzionali e di durabilità), valutare se il materiale è adeguato all'uso (es. non usare PS nel microonde), confrontare prodotti alternativi, valutare l'impatto ambientale (riciclabile? biodegradabile? durevole?). È una competenza di cittadinanza consumatrice.",["Non è corretto. La classificazione per proprietà non dice niente sull'origine geografica. Il vantaggio per il consumatore è diverso.","Esatto! Un consumatore che conosce le proprietà dei materiali capisce: perché questo oggetto dura poco (materiale di bassa qualità), perché questa bottiglia non va in microonde (PS non regge le temperature), che impatto ha questa scelta sull'ambiente.","Non è corretto. Conoscere le proprietà dei materiali aiuta a capire l'oggetto, ma non sostituisce le competenze di riparazione che richiedono strumenti e tecniche specifiche.","Non è corretto. La produzione di materiali avanzati richiede processi industriali complessi. La conoscenza delle proprietà serve a valutare e scegliere, non a produrre materiali avanzati."]],["Perché l'acciaio inossidabile è scelto per posateria e rubinetti invece dell'acciaio ordinario?",["Perché l'acciaio inossidabile è più leggero dell'acciaio ordinario, riducendo il peso dei rubinetti","Perché il cromo (almeno 10,5%) forma uno strato di ossido protettivo spontaneo che impedisce la ruggine anche a contatto continuo con acqua","Perché è stato trattato con uno speciale rivestimento galvanico che deve essere rinnovato ogni 10 anni","Perché è prodotto da miniere speciali con minerali più puri che contengono meno impurità ossidanti"],1,"L'acciaio inossidabile contiene almeno 10,5% di cromo. Il cromo, a contatto con l'ossigeno dell'aria, forma spontaneamente uno strato di ossido di cromo (Cr₂O₃) di pochi nanometri: invisibile ma efficacissimo. Questo strato è autoricostituente: se viene graffiato, si riforma nell'aria. Per questo la posateria non arrugginisce dopo migliaia di lavaggi.",["Non è corretto. L'acciaio inossidabile e l'acciaio ordinario hanno densità simili. Il vantaggio non è il peso.","Esatto! L'acciaio inossidabile contiene almeno 10,5% di cromo che, a contatto con l'ossigeno, forma uno strato di Cr₂O₃ (ossido di cromo) sottilissimo e trasparente che impedisce l'ossidazione ulteriore. È autoprotettivo.","Non è corretto. I prodotti in acciaio inossidabile vero non hanno rivestimento galvanico che si consuma: la protezione viene dalla composizione stessa del materiale (il cromo forma uno strato protettivo permanente e autoricostituente).","Non è corretto. La resistenza alla ruggine dell'acciaio inossidabile non dipende dalla purezza del minerale di partenza ma dall'aggiunta intenzionale di cromo (almeno 10,5%) durante la produzione dell'acciaio."]],["Un designer sta sviluppando un nuovo prodotto e deve scegliere tra vetro, plastica e alluminio per il packaging. Descrive il processo di selezione basato sulle proprietà.",["Scegliere sempre il materiale con il costo più basso: la selezione basata sulle proprietà è accessoria al budget","Definire i requisiti funzionali del packaging (protezione, peso, trasparenza, riciclabilità, barriera, costo) poi confrontare quale materiale li soddisfa meglio in quel contesto specifico","Scegliere sempre il materiale più ecologico (meno impatto ambientale) indipendentemente dalle altre proprietà","Copiare il materiale usato da prodotti simili sul mercato: se funziona per i concorrenti, funzionerà anche per il nuovo prodotto"],1,"Il processo di selezione dei materiali: 1) definire i requisiti funzionali (protezione meccanica, barriera chimica, peso, trasparenza, riciclabilità nel mercato target, costo); 2) costruire una matrice di confronto ponderata; 3) scegliere il materiale che soddisfa meglio il profilo di requisiti nel contesto specifico. Non esiste una risposta universale: dipende sempre dai requisiti del prodotto.",["Non è corretto. Il costo è uno dei parametri ma non l'unico. Un packaging che si rompe (vetro senza protezione) o che non è riciclabile nel mercato target può costare molto di più in termini di resi e brand damage.","Esatto! Il processo corretto: 1) definire i requisiti (es. protezione meccanica? trasparenza per vedere il prodotto? riciclabile nel mercato target? peso max? budget?); 2) costruire una matrice di confronto; 3) scegliere il materiale che soddisfa meglio l'insieme dei requisiti ponderati.","Non è corretto. Un packaging 'ecologico' che non protegge il prodotto (sprechi alimentari, resi) o che costa troppo da produrre non è una buona soluzione. La sostenibilità è un parametro tra gli altri, non il solo criterio.","Non è corretto. I prodotti concorrenti possono avere scelte di materiale non ottimali, ereditate da decisioni storiche o da vincoli di costo specifici. Il processo corretto parte sempre dai requisiti funzionali."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
