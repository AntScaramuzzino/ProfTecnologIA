<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Addestra il classificatore</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

TRAIN.forEach(([s, l]) => tok(s).forEach((w) => { CNT[l][w] = (CNT[l][w] || 0) + 1; TOT[l]++; }));

        { type: "quiz", questions: [
          ["Qual è il tasso di ammissione complessivo?", ["48%", "41%", "55%"], 0, "(66 + 24 + 6) ÷ 200 = 96 ÷ 200 = 48%."],
          ["A parità di voto alto, le differenze fra Nord e Sud…", ["restano uguali", "quasi spariscono"], 1, "80% e 80%: gran parte della differenza dipende da quanti candidati con voto alto ci sono in ogni gruppo."],
          ["Allora non c'è nessun problema di equità?", ["Esatto, nessuno", "Non è detto: perché al Sud ci sono meno voti alti? I dati spostano la domanda, non la chiudono"], 1, "Un tasso diverso non prova da solo una discriminazione, ma nemmeno la esclude: va cercata la causa."],
          ["Un modello addestrato su queste ammissioni passate imparerebbe…", ["a essere imparziale", "a ripetere gli stessi schemi del passato"], 1, "Il modello riproduce i dati da cui impara."]] } ],
      reflect: "Quali altri dati vorresti avere prima di giudicare se il sistema di ammissione è equo?" },
    { label: "Scenario · i cassieri del supermercato", brief: "Una catena vuole un algoritmo che preveda l'afflusso ora per ora e decida quanti cassieri attivare, aggiornato ogni settimana. Progetta un sistema responsabile.",
      blocks: [
        { type: "order", title: "La pipeline del machine learning", items: [["Definire il problema e come misurare il successo", ""], ["Raccogliere e pulire i dati", "Scontrini per ora, giorni festivi, meteo, eventi in città…"], ["Addestrare il modello su una parte dei dati", ""], ["Testarlo su dati che non ha mai visto", "Altrimenti si misura solo quanto ha memorizzato."], ["Metterlo in uso e monitorare errori e conseguenze", ""], ["Aggiornarlo con dati nuovi, controllando che non peggiori", ""]] },
        { type: "canvas", fields: [["dati", "Dati necessari, e quali potrebbero mancare o essere sbagliati", ""], ["bias", "Dove sarà meno preciso (giorni, orari, eventi)?", ""], ["lav", "Conseguenze per i lavoratori: turni, preavviso, ore", ""], ["uomo", "Chi controlla le decisioni e può correggerle", ""]],
          checks: [["Hai considerato eventi rari (festività, scioperi, partite)", (v) => /fest|evento|sciopero|partit|natale|pasqua/i.test(v.bias)], ["Hai pensato ai lavoratori", (v) => v.lav.length > 20], ["C'è una persona che supervisiona", (v) => /responsab|manager|direttor|umano|persona|supervis/i.test(v.uomo)]],
          out: (v) => `SISTEMA DI IA RESPONSABILE\n\nDati: ${v.dati}\nLimiti e bias: ${v.bias}\nLavoratori: ${v.lav}\nSupervisione umana: ${v.uomo}` } ],
      reflect: "Se il modello sbaglia una domenica di dicembre, chi ne paga le conseguenze? Come lo eviteresti?" }],
  bridge: "Analizza tre algoritmi di raccomandazione che usi (musica, video, social): descrivi come funzionano, individua un possibile bias e proponi come renderli più trasparenti.",
});

<script>
window.LABVERIFICA={"id":"MC-INF-3-02","F":[["Cosa distingue il Machine Learning dalla programmazione tradizionale?",["Il Machine Learning usa computer più veloci rispetto alla programmazione tradizionale","Nel ML il sistema apprende da esempi e ottimizza le proprie prestazioni su dati, invece di seguire regole esplicite programmate","Il ML funziona solo su testi e immagini, la programmazione tradizionale su tutti i tipi di dati","Il ML richiede una connessione internet permanente, la programmazione tradizionale no"],1,"Nella programmazione tradizionale il programmatore scrive regole esplicite (if-then-else) che definiscono il comportamento del sistema. Nel Machine Learning il sistema riceve dati di esempio (training data) e apprende autonomamente i pattern che permettono di generalizzare su nuovi dati. Il ML non 'pensa' — ottimizza una funzione matematica su dati, trovando parametri che minimizzano l'errore sugli esempi.",["Non è corretto. La velocità del computer non è la distinzione tra ML e programmazione tradizionale. La differenza fondamentale riguarda come si ottiene il comportamento desiderato: con regole esplicite (programmazione tradizionale) o con l'apprendimento da esempi (ML).","Esatto! Nella programmazione tradizionale lo sviluppatore scrive regole esplicite ('SE spam ALLORA...'). Nel ML il sistema riceve esempi (email spam e non spam) e 'impara' da soli le regole che le distinguono, senza che nessuno le abbia codificate esplicitamente.","Non è corretto. Il ML si applica a dati di qualsiasi tipo: testo, immagini, audio, video, dati numerici, serie temporali, grafi. Non è limitato a testo e immagini.","Non è corretto. I modelli ML una volta addestrati possono funzionare completamente offline (es. riconoscimento vocale on-device su smartphone). La connessione internet non è una caratteristica discriminante."]],["Qual è la caratteristica che definisce il Machine Learning supervisionato?",["Il modello impara senza dati: crea da solo le regole basandosi solo sull'algoritmo","I dati di addestramento sono etichettati: ogni esempio ha l'output corretto già noto","Un supervisore umano controlla ogni predizione del modello e la corregge in tempo reale","Il modello viene addestrato solo su dati prodotti da altri modelli ML, non da umani"],1,"Il ML supervisionato usa dati di training etichettati: ogni esempio (x) ha un'etichetta corrispondente (y) che indica la risposta corretta. Il modello impara a mappare x→y. Esempi: classificazione email (spam/non spam), riconoscimento di immagini (gatto/cane), previsione del prezzo delle case (dato metratura, zona...). L'obiettivo è generalizzare: predire y correttamente su nuovi dati x mai visti prima.",["Non è corretto. Nessun tipo di ML impara senza dati. Il ML supervisionato impara da dati etichettati (input con l'output corretto già noto). Il ML non supervisionato impara da dati non etichettati trovando pattern.","Esatto! Nel ML supervisionato ogni esempio di training ha un'etichetta che indica la risposta corretta. Esempio: migliaia di email già classificate come 'spam' o 'non spam'. Il modello impara ad associare le caratteristiche dell'input alla risposta giusta e generalizza su nuovi dati.","Non è corretto. 'Supervisionato' non significa che un umano supervisiona ogni predizione in tempo reale — si riferisce al tipo di dati usati per l'addestramento: esempi già etichettati con la risposta corretta. Dopo l'addestramento il modello opera autonomamente.","Non è corretto. Quella descritta è una pratica emergente (modelli addestrati su dati sintetici o generati da altri modelli), ma non è la definizione di ML supervisionato. Il ML supervisionato usa dati etichettati da umani (o processi affidabili) che indicano la risposta corretta."]],["Cos'è un dataset nel contesto del Machine Learning?",["Il programma software che esegue l'algoritmo di Machine Learning","Un insieme strutturato di dati usato per addestrare, validare e testare un modello ML","Il risultato finale prodotto da un modello ML dopo l'addestramento","La memoria RAM utilizzata dal modello durante l'addestramento"],1,"Un dataset ML è un insieme strutturato di esempi, tipicamente diviso in: 1) Training set (60-80%): usato per addestrare il modello — il modello 'vede' questi dati e aggiusta i suoi parametri. 2) Validation set (10-20%): usato per ottimizzare gli iperparametri e monitorare l'overfitting durante l'addestramento. 3) Test set (10-20%): usato una sola volta alla fine per valutare le prestazioni reali del modello su dati mai visti. La qualità del dataset (quantità, diversità, correttezza delle etichette) è il fattore più importante per la qualità del modello.",["Non è corretto. Il programma software è l'implementazione dell'algoritmo (es. in Python con TensorFlow o PyTorch). Il dataset è la raccolta di dati usata per addestrare e valutare il modello.","Esatto! Un dataset è una raccolta strutturata di esempi usata nelle diverse fasi del ML: training set (per addestrare il modello), validation set (per ottimizzare i parametri) e test set (per valutare le prestazioni finali su dati mai visti). La qualità del dataset determina la qualità del modello.","Non è corretto. Il risultato prodotto dal modello si chiama output o predizione. Il dataset è la raccolta di dati di input (con le etichette nel ML supervisionato) usata per costruire il modello.","Non è corretto. La RAM è la memoria hardware dove i calcoli vengono eseguiti. Il dataset è la raccolta di dati (esempi, etichette, features) che viene usata per costruire e valutare il modello ML."]],["Cosa si intende per 'bias algoritmico' in un modello di Machine Learning?",["Un errore matematico nell'algoritmo che causa calcoli sbagliati","Una distorsione sistematica nelle predizioni del modello causata da squilibri o discriminazioni nei dati di training","La tendenza del modello a preferire dati numerici rispetto a dati testuali","Il tempo aggiuntivo necessario per addestrare il modello quando il dataset è molto grande"],1,"Il bias algoritmico si verifica quando il modello ML eredita e amplifica le distorsioni presenti nei dati di training. Esempi documentati: sistemi di riconoscimento facciale con tassi di errore più alti per persone con pelle scura (addestrati su dataset prevalentemente con persone bianche); sistemi di valutazione del credito che discriminano per zona geografica; algoritmi di selezione del personale che penalizzano le donne. La soluzione richiede dataset più bilanciati e tecniche di fairness nel training.",["Non è corretto. Un errore matematico nell'algoritmo è un bug di programmazione, non un bias algoritmico. Il bias algoritmico è una distorsione sistematica nelle predizioni del modello causata da squilibri o discriminazioni nei dati di training.","Esatto! Se i dati di training riflettono discriminazioni storiche (es. un dataset di curriculum con candidati assunti prevalentemente maschi), il modello le amplifica: imparerà a preferire i curriculum maschili anche per posizioni dove il genere non è rilevante. Il modello amplifica le distorsioni dei dati.","Non è corretto. La preferenza per tipi di dati diversi è una caratteristica dell'architettura del modello, non il bias algoritmico. Il bias algoritmico è una distorsione sistematica nelle predizioni che riflette squilibri nei dati di training.","Non è corretto. Il tempo di addestramento su dataset grandi è una questione computazionale, non di bias. Il bias algoritmico è una distorsione sistematica nelle predizioni causata da dati sbilanciati o discriminatori nel training set."]],["Cosa ha reso AlphaGo famoso nel 2016?",["È stato il primo programma a vincere un torneo di scacchi contro un campione del mondo","Ha sconfitto il campione mondiale di Go, un gioco di strategia considerato troppo complesso per le macchine","Ha prodotto la prima immagine digitale generata interamente da un'intelligenza artificiale","Ha superato il test di Turing conversando con umani in modo indistinguibile da una persona reale"],1,"AlphaGo (DeepMind, 2016) ha battuto Lee Sedol 4-1 al Go. Il Go era considerato troppo complesso per le macchine perché il numero di possibili partite supera il numero di atomi nell'universo osservabile. AlphaGo usava reinforcement learning (imparare giocando contro se stesso) combinato con deep learning (reti neurali profonde per valutare le posizioni). AlphaZero (2017) ha migliorato ulteriormente il metodo: ha imparato solo giocando contro se stesso, senza dati di partite umane.",["Non è corretto. Negli scacchi il traguardo fu raggiunto da Deep Blue (IBM) nel 1997 contro Kasparov. AlphaGo è famoso per una sfida diversa: ha vinto contro il campione mondiale di Go nel 2016.","Esatto! AlphaGo (DeepMind/Google) ha sconfitto Lee Sedol, campione mondiale di Go, 4 a 1. Go era considerato il bastione dell'intelligenza umana contro le macchine: ha 10¹⁷⁰ possibili posizioni (più atomi dell'universo osservabile) e richiede intuizione strategica che si pensava impossibile da formalizzare.","Non è corretto. Le prime immagini generate da AI risalgono agli anni '60-'70. AlphaGo è celebre per la vittoria contro il campione mondiale di Go nel 2016, usando un'architettura di reinforcement learning combinata con deep learning.","Non è corretto. Il test di Turing valuta la capacità conversazionale. AlphaGo è un sistema specializzato per giocare a Go — non ha capacità conversazionali. La sua celebrità deriva dalla vittoria contro il campione mondiale di Go nel 2016."]],["Cosa si intende per 'allucinazione' in un modello di AI generativa?",["Quando il modello produce immagini con colori o forme distorte","Quando il modello genera informazioni false o inesistenti presentandole con sicurezza come se fossero vere","Quando il modello si rifiuta di rispondere a domande difficili","Quando il modello impara troppo dai dati di training e non riesce a generalizzare"],1,"Le allucinazioni dell'AI sono un limite fondamentale dei modelli linguistici generativi: producono testo statisticamente plausibile ma fatalmente non vincolato alla verità. Il modello non ha accesso a un database di fatti verificati — genera sequenze di token basandosi su pattern statistici nei dati di training. Risultato: può citare articoli scientifici mai pubblicati, attribuire citazioni a persone che non le hanno mai dette, inventare date o statistiche. È fondamentale verificare sempre le affermazioni fattuali prodotte dall'AI.",["Non è corretto. Le distorsioni nelle immagini generate sono artefatti visivi, non allucinazioni. Le 'allucinazioni' dell'AI si riferiscono specificamente alla generazione di testo che afferma fatti falsi con apparente sicurezza.","Esatto! Un'allucinazione dell'AI si verifica quando il modello genera testo che afferma fatti falsi, cita articoli scientifici inesistenti, inventa biografie o dati, ma lo fa con la stessa sicurezza con cui fornirebbe informazioni corrette. Il modello non 'mente' consapevolmente: genera ciò che statisticamente appare plausibile.","Non è corretto. Rifiutarsi di rispondere a domande problematiche è un comportamento di sicurezza (guardrail) deliberato, non un'allucinazione. L'allucinazione è il contrario: il modello risponde con sicurezza fornendo informazioni false.","Non è corretto. Quello descritto è l'overfitting, un problema di generalizzazione. Le allucinazioni sono specifiche dell'AI generativa: il modello produce informazioni false presentate come vere, senza alcun meccanismo interno di verifica dei fatti."]]],"I":[["Qual è la differenza tra ML supervisionato e non supervisionato?",["Il supervisionato usa grandi quantità di dati, il non supervisionato usa pochi dati","Il supervisionato usa dati etichettati per predire output; il non supervisionato trova pattern nei dati senza etichette","Il supervisionato è sempre più accurato del non supervisionato per qualsiasi problema","Il non supervisionato richiede un supervisore umano che guida il modello durante ogni iterazione"],1,"ML supervisionato (supervised): usa dati etichettati (input + output corretto). Obiettivo: imparare a predire y dato x. Esempi: classificazione spam, riconoscimento immagini, previsione prezzi. ML non supervisionato (unsupervised): usa solo input non etichettati. Obiettivo: trovare strutture nascoste nei dati. Esempi: clustering (raggruppare clienti simili), riduzione della dimensionalità (PCA), anomaly detection. ML per rinforzo (RL): un agente impara tramite interazione con un ambiente, ricevendo ricompense o penalità.",["Non è corretto. La distinzione non riguarda la quantità di dati. Il ML supervisionato usa dati etichettati (con risposta corretta nota); il non supervisionato usa dati non etichettati e cerca autonomamente strutture e pattern nei dati.","Esatto! ML supervisionato: dati etichettati (input+output corretto), obiettivo predire l'output su nuovi dati. ML non supervisionato: solo input senza etichette, l'algoritmo trova autonomamente strutture, gruppi (clustering) o rappresentazioni nei dati senza sapere cosa cercare.","Non è corretto. La scelta tra supervisionato e non supervisionato dipende dal problema e dalla disponibilità di etichette, non da una superiorità assoluta. Il non supervisionato è l'unica opzione quando le etichette non esistono o sono troppo costose da produrre.","Non è corretto. 'Non supervisionato' significa l'opposto: nessun supervisore umano guida l'apprendimento. L'algoritmo trova autonomamente strutture nei dati senza feedback esterno su cosa è giusto o sbagliato."]],["Come funziona una rete neurale artificiale nella sua struttura di base?",["Imita il cervello umano con neuroni biologici connessi tramite sinapsi fisiche","Trasforma l'input attraverso strati di nodi (neuroni artificiali con pesi) producendo un output","Usa un database di regole if-then programmate manualmente per ogni possibile input","Memorizza tutti gli esempi del training set e restituisce il risultato dell'esempio più simile"],1,"Una rete neurale artificiale è composta da: Input layer (riceve i dati grezzi: pixel, parole, numeri), Hidden layer(s) (ogni neurone calcola una somma pesata degli input + applica una funzione di attivazione non lineare come ReLU o sigmoid), Output layer (produce la predizione finale: una classe, un numero, una probabilità). Durante il training, l'algoritmo di backpropagation aggiusta i pesi per minimizzare l'errore del modello. Il deep learning usa molti strati nascosti.",["Non è corretto. Le reti neurali artificiali si ispirano vagamente al cervello, ma non lo imitano fisicamente. I neuroni artificiali sono funzioni matematiche (somma pesata + funzione di attivazione), non componenti biologici.","Esatto! Una rete neurale ha: strato di input (riceve i dati), strati nascosti (hidden layers, che trasformano i dati tramite neuroni artificiali con pesi e funzioni di attivazione), strato di output (produce il risultato). Durante il training, i pesi vengono aggiustati per minimizzare l'errore.","Non è corretto. I sistemi basati su regole if-then sono i sistemi esperti tradizionali, non le reti neurali. Le reti neurali apprendono i propri 'pesi' automaticamente dai dati, senza regole programmate manualmente.","Non è corretto. Memorizzare tutti gli esempi e trovare il più simile è l'algoritmo k-Nearest Neighbors (kNN), non una rete neurale. Le reti neurali generalizzano: imparano rappresentazioni interne (i pesi) che catturano i pattern nei dati."]],["Come funziona il Machine Learning per rinforzo e in quale scenario è più adatto?",["Un agente impara da un dataset di esempi etichettati da esperti umani del settore","Un agente impara tramite interazione con un ambiente: riceve ricompense per azioni corrette e penalità per quelle sbagliate","Un agente trova automaticamente i cluster nei dati senza supervisione umana","Un agente crea i propri dati di training sintetici per ridurre i costi di etichettatura"],1,"Il Reinforcement Learning (RL) modella l'apprendimento per prove ed errori: un Agente osserva lo Stato dell'Ambiente, compie un'Azione, riceve una Ricompensa e aggiorna la sua Politica per massimizzare la ricompensa cumulativa futura. Scenari ideali: giochi (Go, scacchi, videogiochi), robotica, ottimizzazione di sistemi complessi (trading, gestione energetica), veicoli autonomi. Non richiede dati etichettati da umani, ma richiede un ambiente (reale o simulato) con cui interagire.",["Non è corretto. Quello descritto è il ML supervisionato, non il rinforzo. Il ML per rinforzo non usa dati etichettati: l'agente impara interagendo direttamente con un ambiente, ricevendo ricompense o penalità per le sue azioni.","Esatto! Nel reinforcement learning (RL) un agente esegue azioni in un ambiente, osserva lo stato risultante e riceve una ricompensa (positiva o negativa). L'obiettivo è massimizzare la ricompensa cumulativa nel tempo. Non ci sono etichette — solo feedback dall'ambiente. Adatto per problemi sequenziali dove non esiste una risposta predefinita.","Non è corretto. Trovare cluster senza supervisione è il clustering non supervisionato. Il ML per rinforzo usa invece la dinamica agente-ambiente-ricompensa: l'agente interagisce con il mondo e impara dalle conseguenze delle sue azioni.","Non è corretto. La generazione di dati sintetici è una tecnica di data augmentation usata in vari contesti. Il ML per rinforzo si basa sull'interazione con un ambiente (reale o simulato) e sul meccanismo di ricompensa, non sulla generazione di dati sintetici."]],["Cosa si intende per 'overfitting' in un modello di Machine Learning?",["Il modello usa troppa memoria RAM e rallenta il computer durante l'addestramento","Il modello impara troppo specificamente i dati di training (incluso il rumore) e non generalizza su dati nuovi","Il modello ha troppi pochi parametri per catturare i pattern nei dati","Il dataset di training è troppo grande e il modello impiega troppo tempo ad addestrarsi"],1,"Overfitting: il modello ha troppi parametri rispetto ai dati disponibili e 'memorizza' il training set, incluso il rumore. Risultato: training accuracy ≈ 99%, test accuracy ≈ 60% (generalizza male). Underfitting: il modello è troppo semplice e non cattura i pattern. Risultato: training accuracy ≈ 60%, test accuracy ≈ 60% (entrambe basse). La soluzione all'overfitting: più dati, regolarizzazione, dropout, early stopping, cross-validation.",["Non è corretto. L'overfitting è un concetto di apprendimento automatico, non di consumo di risorse. Riguarda le prestazioni del modello: alta accuratezza sui dati di training, bassa accuratezza su dati nuovi.","Esatto! In overfitting il modello 'memorizza' i dati di training (inclusi gli errori e il rumore) invece di imparare i pattern generali. Risultato: accuratezza altissima sul training set, accuratezza molto bassa su dati mai visti. È come uno studente che memorizza le domande passate invece di capire il concetto.","Non è corretto. Quello descritto è l'underfitting: il modello è troppo semplice e non riesce a catturare i pattern nei dati. L'overfitting è il problema opposto: il modello è troppo complesso e si adatta troppo ai dati di training, incluso il rumore.","Non è corretto. Avere un dataset grande è generalmente positivo per il ML. L'overfitting si verifica tipicamente con dataset piccoli e modelli complessi: il modello memorizza i pochi esempi disponibili invece di generalizzare."]],["Qual è la differenza tra deep learning e Machine Learning tradizionale in termini di feature engineering?",["Il deep learning richiede più feature engineering manuale del ML tradizionale","Il deep learning impara automaticamente le feature rilevanti dai dati; il ML tradizionale richiede feature engineering manuale da parte di esperti del dominio","Il ML tradizionale è sempre più veloce da addestrare del deep learning","Il deep learning funziona solo con testi, il ML tradizionale con immagini e numeri"],1,"Il ML tradizionale (SVM, random forest, gradient boosting) richiede feature engineering: esperti del dominio estraggono manualmente caratteristiche rilevanti dai dati grezzi. Per il riconoscimento di immagini: estrarre bordi, texture, istogrammi colore. Per il testo: tf-idf, n-gram. Il deep learning impara automaticamente le feature attraverso gli strati nascosti — le prime reti neurali imparano feature semplici (bordi), quelle più profonde feature complesse (forme, oggetti). Vantaggio: funziona bene con dati grezzi. Svantaggio: richiede molto più dati e potenza di calcolo.",["Non è corretto. È il contrario: il ML tradizionale tipicamente richiede feature engineering manuale (estrarre e selezionare le caratteristiche rilevanti dai dati grezzi). Il deep learning impara automaticamente le feature utili dagli strati nascosti della rete.","Esatto! Nel ML tradizionale (regressione, SVM, random forest) un esperto del dominio deve estrarre manualmente le feature rilevanti dai dati grezzi (es. da un'immagine: estrarre bordi, texture, colori). Il deep learning impara automaticamente le feature utili attraverso i suoi strati nascosti.","Non è corretto. Il tempo di addestramento dipende dalla dimensione del dataset e dalla complessità del modello. Su dataset piccoli il ML tradizionale è più veloce; ma non è questo il punto di distinzione principale riguardo al feature engineering.","Non è corretto. Il deep learning si applica a tutti i tipi di dati: immagini (CNN), testo (Transformer/BERT/GPT), audio (RNN/Transformer), dati tabellari. Il ML tradizionale si applica anch'esso a tutti i tipi di dati (con feature engineering appropriato)."]],["Come funziona il clustering come tecnica di ML non supervisionato? Fai un esempio concreto.",["Il clustering ordina i dati in ordine alfabetico e poi li divide in gruppi uguali","Il clustering raggruppa automaticamente dati simili tra loro; es. Spotify raggruppa brani con caratteristiche simili per creare playlist personalizzate","Il clustering predice il cluster di appartenenza di nuovi dati basandosi su etichette storiche","Il clustering usa internet per scaricare dati simili da siti web e aggiungerli al dataset"],1,"Il clustering raggruppa dati in base alla loro similarità senza usare etichette predefinite. K-means, il più comune, assegna ogni punto al cluster il cui centro è più vicino e aggiorna iterativamente i centri. Usi reali: segmentazione clienti (raggruppa clienti simili per comportamento d'acquisto), anomaly detection (punti lontani da qualsiasi cluster), compressione immagini, scoperta di strutture nei dati genomici, personalizzazione contenuti (Spotify, Netflix).",["Non è corretto. Il clustering non ordina i dati alfabeticamente né li divide in parti uguali. Raggruppa i dati in cluster (gruppi) in base alla loro similarità, usando misure di distanza matematiche — senza sapere a priori quanti o quali gruppi esistono.","Esatto! Il clustering trova autonomamente strutture nei dati raggruppando esempi simili. Spotify usa clustering per raggruppare brani con caratteristiche simili (BPM, tono, energia, valenza) e identificare 'micro-generi'. Nessuno ha etichettato a mano i generi — il modello li ha trovati da solo.","Non è corretto. Predire l'appartenenza a una categoria usando etichette storiche è classificazione supervisionata. Il clustering è non supervisionato: non usa etichette e scopre gruppi naturali nei dati senza avere una risposta 'corretta' di riferimento.","Non è corretto. Il clustering è un algoritmo matematico che opera sui dati già disponibili nel dataset, non un meccanismo di acquisizione di nuovi dati da internet."]]],"A":[["Perché i modelli di AI generativa tendono a 'allucinare' — generare informazioni false con apparente sicurezza?",["Perché i programmatori non hanno inserito un database di fatti verificati nell'AI","Perché ottimizzano la probabilità statistica del testo successivo, senza un meccanismo interno di verifica dei fatti: generano ciò che sembra plausibile, non ciò che è vero","Perché usano dati di training obsoleti che non includono le informazioni più recenti","Perché i modelli AI non hanno abbastanza potenza di calcolo per verificare ogni affermazione prima di produrla"],1,"I LLM (Large Language Models) sono addestrati con l'obiettivo di predire il token successivo più probabile dato il contesto (next token prediction). Non hanno un modello interno della verità — ottimizzano la fluidità e la plausibilità statistica del testo. Quando il modello 'non sa' qualcosa, non dice 'non lo so' (il token meno plausibile in molti contesti) — genera il testo più plausibile, che può essere falso. Soluzioni parziali: Retrieval Augmented Generation (RAG) che permette al modello di consultare fonti esterne, chain-of-thought prompting, verifica umana.",["Non è corretto. Alcuni sistemi AI integrano database di conoscenza, ma la causa fondamentale delle allucinazioni è strutturale: i modelli linguistici generativi ottimizzano la probabilità statistica del testo successivo, non la sua veridicità. Non 'sanno' cosa è vero — generano ciò che sembra plausibile.","Esatto! I Large Language Models (LLM) come GPT sono addestrati a predire il token successivo più probabile dato il contesto. Non hanno accesso a un 'ground truth' dei fatti del mondo — generano sequenze statisticamente plausibili. Quando mancano di informazioni, generano testo che sembra corretto stilisticamente ma può essere fattualmente falso.","Non è corretto. L'obsolescenza dei dati causa lacune di conoscenza recente, ma non spiega le allucinazioni su fatti storici ben documentati. Le allucinazioni avvengono anche su argomenti ampiamente presenti nei dati di training. La causa è strutturale: l'ottimizzazione sulla plausibilità, non sulla verità.","Non è corretto. Aumentare la potenza di calcolo non risolve il problema strutturale: i modelli attuali generano testo ottimizzando la probabilità statistica, non la veridicità. La verifica dei fatti richiederebbe un'architettura diversa, con accesso a fonti esterne affidabili."]],["Come si può ridurre il rischio di bias algoritmico in un sistema di ML usato per la selezione del personale?",["Rimuovere il nome del candidato dal curriculum analizzato dal modello","Usare dataset bilanciati demograficamente, applicare metriche di fairness durante il training e auditare regolarmente i risultati per gruppi protetti","Usare il modello ML solo come supporto decisionale, con revisione umana finale di tutte le decisioni di assunzione","Aumentare la dimensione del dataset: con più dati il bias si riduce automaticamente"],1,"Il bias algoritmico nella selezione del personale è documentato: Amazon ha dismesso nel 2018 un sistema ML per la selezione dei CV perché penalizzava sistematicamente le candidate donne (addestrato su 10 anni di assunzioni prevalentemente maschili). Le best practice: 1) Audit del dataset per bilanciamento demografico. 2) Rimozione delle feature proxy (variabili correlate a genere, etnia, classe). 3) Fairness-aware machine learning: ottimizzare anche per equità demografica. 4) Monitoraggio continuo delle decisioni per disparità. 5) Obbligo normativo (EU AI Act richiede valutazioni di conformità per sistemi AI ad alto rischio come la selezione del personale).",["Non è corretto. Rimuovere il nome è una misura parziale di 'blind recruitment'. Ma il bias può persistere attraverso altre variabili correlate (istituto scolastico frequentato, zona geografica, attività extracurriculari). Non è sufficiente come unica misura.","Esatto! Ridurre il bias richiede un approccio multi-strato: 1) Dataset bilanciato: assicurare rappresentazione equa di tutti i gruppi demografici; 2) Fairness constraints nel training: ottimizzare anche per equità, non solo per accuratezza; 3) Audit periodici: analizzare le predizioni separatamente per gruppi demografici; 4) Trasparenza: rendere spiegabili le decisioni del modello.","Non è del tutto sbagliato (la revisione umana è utile), ma non risponde alla domanda su come ridurre il bias nel modello ML stesso. Il bias algoritmico va affrontato alla fonte: nei dati e nell'architettura del modello, non solo aggiungendo una revisione umana che può perpetuare gli stessi bias.","Non è corretto. Aumentare un dataset sbilanciato amplifica il bias, non lo riduce. Se storicamente le donne sono state sottorappresentate nelle posizioni manageriali e il dataset lo riflette, addestrare su più dati storici rafforzerà questa distorsione. Servono dati bilanciati, non solo più dati."]],["Perché l'opacità dei modelli di deep learning è un problema etico in applicazioni critiche come la diagnosi medica o la concessione del credito?",["Perché i modelli opachi sono sempre meno accurati di quelli trasparenti","Perché non è possibile spiegare il ragionamento della decisione, rendendo impossibile contestarla, correggerla o verificarne la correttezza","Perché i modelli opachi consumano più energia dei modelli trasparenti","Perché i modelli opachi sono più vulnerabili agli attacchi informatici"],1,"Il problema della 'scatola nera' (black box) nel deep learning: i modelli con milioni di parametri prendono decisioni attraverso trasformazioni matematiche complesse impossibili da tradurre in ragionamento leggibile. In applicazioni critiche: un paziente a cui viene negato un trapianto basandosi su un modello opaco non può contestare la decisione; un richiedente di credito non sa quali caratteristiche l'hanno penalizzato; un giudice non può verificare se una diagnosi AI è basata su correlazioni legittime. EU AI Act (2024) impone requisiti di trasparenza e spiegabilità per sistemi AI ad alto rischio.",["Non è corretto. Spesso accade il contrario: i modelli di deep learning (opachi) raggiungono accuratezze superiori ai modelli interpretabili (alberi di decisione, regressione logistica). Il problema dell'opacità non è l'accuratezza ma l'impossibilità di spiegare le decisioni.","Esatto! Se un modello opaco nega un mutuo o suggerisce una diagnosi sbagliata, né il paziente/cliente né il medico/banca sanno perché. Questo viola il diritto alla spiegazione (Art. 22 GDPR), rende impossibile correggere errori sistematici, e impedisce di verificare se la decisione è basata su feature legittime o su correlazioni spurie (bias).","Non è corretto. Il consumo energetico non è il problema etico dell'opacità. Il problema è che le decisioni di modelli opachi non possono essere spiegate, contestate o verificate — critico in ambiti dove le decisioni impattano diritti fondamentali (salute, credito, libertà).","Non è corretto. La vulnerabilità agli attacchi (adversarial examples) esiste per tutti i tipi di modelli ML, opachi o trasparenti. Il problema etico dell'opacità è l'impossibilità di spiegare, contestare e correggere le decisioni del modello."]],["In quale scenario il ML per rinforzo è chiaramente più adatto rispetto al ML supervisionato?",["Quando si ha un grande dataset di immagini etichettate da classificare in categorie predefinite","Quando un agente deve imparare a prendere decisioni sequenziali in un ambiente dinamico, dove non esiste una risposta 'corretta' predefinita ma solo una funzione di ricompensa","Quando il dataset non ha etichette e si vogliono trovare gruppi naturali nei dati","Quando si vuole generare testo o immagini realistiche simili a esempi esistenti"],1,"Il Reinforcement Learning è la scelta naturale per: 1) Giochi (Go, Atari, scacchi) — non esistono partite 'corrette', solo vincere o perdere. 2) Robotica — il robot deve imparare sequenze di movimenti per completare compiti, con ricompensa solo al completamento. 3) Trading algoritmico — le decisioni influenzano i prezzi futuri. 4) Ottimizzazione di sistemi complessi (raffreddamento datacenter, gestione traffico). 5) Dialogo (RLHF: fine-tuning dei LLM con feedback umano). Limite principale: richiede un simulatore affidabile o un ambiente reale con cui interagire sicuramente.",["Non è corretto. Un grande dataset etichettato di immagini è il caso ideale per il ML supervisionato (classificazione con CNN). Il ML per rinforzo non usa dataset etichettati — impara interagendo con un ambiente dinamico.","Esatto! Il RL eccelle in problemi sequenziali con feedback ritardato: il gioco del Go (ogni mossa influenza posizioni future), il trading algoritmico (le decisioni di acquisto influenzano i prezzi futuri), la robotica (sequenze di movimenti per completare un compito), i veicoli autonomi (decisioni di guida continue). Non esiste una risposta 'giusta' predefinita — solo una ricompensa cumulativa da massimizzare.","Non è corretto. Trovare gruppi naturali in dati non etichettati è il clustering (ML non supervisionato). Il ML per rinforzo non riguarda la scoperta di pattern in dataset statici — usa la dinamica agente-ambiente-ricompensa.","Non è corretto. La generazione di testo realistico è il dominio dei modelli generativi (GPT, diffusion models) addestrati con ML supervisionato su grandi corpora. Il ML per rinforzo si applica a problemi di decisione sequenziale con ricompensa, non alla generazione di contenuti."]],["Come si valuta se un modello ML è in overfitting o underfitting durante lo sviluppo?",["Si valuta solo l'accuratezza finale sul dataset di test","Confrontando le prestazioni su training set e test set: overfitting = alta accuratezza su training, bassa su test; underfitting = bassa accuratezza su entrambi","Misurando la velocità di addestramento: modelli in overfitting si addestrano più lentamente","Verificando che il modello produca sempre la stessa predizione per input simili"],1,"Diagnosticare overfitting vs underfitting: si tracciano le curve di learning (training loss e validation loss in funzione delle epoche di addestramento). Overfitting: training loss scende continuamente, validation loss scende poi risale → il modello sta memorizzando. Underfitting: entrambe le loss sono alte e non scendono → il modello è troppo semplice. Good fit: entrambe le loss scendono e si stabilizzano a livelli simili. Soluzioni overfitting: dropout, L1/L2 regularization, data augmentation, early stopping, più dati.",["Non è corretto. Valutare solo il test set non permette di distinguere overfitting da underfitting. Per diagnosticare il problema bisogna confrontare le prestazioni su training set e test set: è il divario tra le due che rivela overfitting o underfitting.","Esatto! La diagnosi si fa confrontando training e test performance. Overfitting: training accuracy = 99%, test accuracy = 65% → il modello ha memorizzato il training. Underfitting: training accuracy = 65%, test accuracy = 63% → il modello è troppo semplice. Good fit: training ≈ test con entrambi alti.","Non è corretto. La velocità di addestramento dipende dall'architettura del modello, dalla dimensione del dataset e dall'hardware — non dall'overfitting. Un modello in overfitting può addestrarsi velocemente o lentamente indipendentemente dal fenomeno.","Non è corretto. La consistenza delle predizioni (determinismo) è una caratteristica degli algoritmi ML in generale, non un modo per diagnosticare overfitting. Persino un modello in overfitting è deterministico: dà sempre la stessa risposta a parità di input."]],["Un sistema di ML supervisionato per la diagnosi di tumori ha un'accuratezza del 95% sul test set. Un medico obietta che questo non è sufficiente per l'uso clinico. Quale analisi critica supporta la sua posizione?",["Il 95% di accuratezza è sempre sufficiente per qualsiasi applicazione clinica","L'accuratezza globale non distingue falsi negativi (tumori non rilevati) da falsi positivi (allarmi inutili): in oncologia un falso negativo è molto più pericoloso e richiede analisi di sensibilità e specificità","Il 95% di accuratezza è insufficiente solo se il dataset di test era più piccolo di 1000 pazienti","Il sistema ML non può essere approvato per uso clinico perché non è stato programmato da medici specialisti"],1,"In applicazioni mediche, l'accuratezza globale è una metrica insufficiente. Le metriche critiche: Sensibilità (Recall) = TP/(TP+FN): percentuale di malati correttamente identificati. Specificità = TN/(TN+FP): percentuale di sani correttamente identificati. Valore predittivo positivo (Precision). AUC-ROC: capacità discriminativa globale. In oncologia, un sistema con 95% accuratezza ma 70% sensibilità perde il 30% dei tumori — inaccettabile. Oltre alle metriche, per l'approvazione clinica servono: validazione su popolazioni diverse (età, etnia, equipaggiamento), trasparenza (XAI), integrazione workflow clinico, approvazione regolatoria (EU AI Act Class III, FDA 510k).",["Non è corretto. L'accuratezza media nasconde problemi critici per applicazioni mediche. Su 10.000 pazienti, 5% di errori = 500 diagnosi errate. Se la maggior parte degli errori sono falsi negativi (tumori non rilevati), l'impatto clinico è devastante indipendentemente dall'accuratezza globale.","Esatto! Per la diagnosi oncologica, l'accuratezza globale è insufficiente come unica metrica. Serve analizzare: Sensibilità (recall): quanti tumori veri vengono rilevati? Specificità: quanti sani vengono correttamente classificati sani? Un sistema con 95% di accuratezza ma bassa sensibilità può perdere molti tumori reali — un errore clinicamente inaccettabile.","Non è corretto. La dimensione del dataset influenza l'affidabilità statistica della stima di accuratezza, ma non è la critica principale del medico. Il problema fondamentale è la distribuzione degli errori tra falsi positivi e falsi negativi, non la dimensione del test set.","Non è corretto. La professione di chi ha sviluppato il sistema non è il criterio di approvazione clinica. Le autorità regolatorie (FDA, EMA) valutano le prestazioni cliniche del dispositivo, la validazione su popolazioni diverse, la trasparenza del metodo e l'integrazione nel flusso di lavoro clinico."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
