<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>La bolletta di casa</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-AMB-2-02","F":[["Cosa fa l'interruttore differenziale (salvavita) nel quadro elettrico?",["Misura il consumo di energia elettrica e trasmette i dati al fornitore","Stacca la corrente se rileva una dispersione verso terra","Riduce la tensione da 400V a 230V per l'uso domestico sicuro","Bilancia il carico elettrico tra le fasi del sistema trifase domestico"],1,"L'interruttore differenziale (salvavita) rileva le dispersioni di corrente verso terra. Se una persona tocca un filo scoperto, parte della corrente scorre attraverso il corpo verso terra: il differenziale rileva questa asimmetria e scatta in millesimi di secondo, potenzialmente salvando la vita.",["Non è corretto. La misurazione è funzione del contatore, non del differenziale. Il differenziale ha una funzione di sicurezza precisa.","Esatto! Il differenziale scatta quando rileva una dispersione di corrente verso terra, il caso tipico di un contatto accidentale con parti in tensione. Può salvare la vita.","Non è corretto. La riduzione di tensione avviene nelle cabine di trasformazione esterne all'edificio. Il differenziale è un dispositivo di sicurezza contro le dispersioni.","Non è corretto. Il bilanciamento delle fasi è gestito dall'impianto nel suo complesso. Il differenziale rileva le dispersioni e interrompe la corrente."]],["La formula P = V × I calcola cosa?",["La resistenza elettrica di un conduttore in Ohm","La potenza elettrica consumata da un dispositivo in Watt","L'energia consumata in un mese da un elettrodomestico in kWh","La caduta di tensione lungo un cavo elettrico di una certa lunghezza"],1,"P = V × I calcola la potenza elettrica in Watt. In Italia V = 230V (tensione domestica). L'energia consumata nel tempo si calcola con E = P × t (es. 100W × 4h = 400Wh = 0,4 kWh). Il costo si ottiene moltiplicando per il prezzo dell'energia (circa 0,25-0,35 €/kWh).",["Non è corretto. La resistenza si calcola con R = V/I (legge di Ohm). P = V × I calcola la potenza.","Esatto! P = V × I (Watt = Volt × Ampere). Con 230V domestici, un dispositivo che assorbe 1A consuma 230W. Moltiplicata per il tempo, dà l'energia in Wh o kWh.","Non è corretto. L'energia si calcola con E = P × t (Wattora). P = V × I dà la potenza istantanea, non l'energia nel tempo.","Non è corretto. La caduta di tensione dipende da resistenza e corrente (ΔV = R × I). P = V × I è la potenza consumata."]],["Perché le reti di trasmissione elettrica usano tensioni altissime (132.000-400.000 V) invece di 230V?",["Perché ad alta tensione l'elettricità si trasmette più velocemente lungo i cavi","Perché alta tensione vuol dire bassa corrente, e quindi meno perdite di calore","Perché i cavi ad alta tensione sono più leggeri e si possono stendere tra tralicci distanziati","Perché la normativa europea impone l'alta tensione per ragioni di sicurezza nelle reti pubbliche"],1,"Le perdite per effetto Joule sono P = R × I². Raddoppiare la tensione dimezza la corrente necessaria (stessa potenza trasmessa: P = V × I). Dimezzare la corrente riduce le perdite di quattro volte. Su reti di centinaia di km, questa differenza vale miliardi di kWh risparmiati ogni anno.",["Non è corretto. L'elettricità viaggia alla velocità della luce indipendentemente dalla tensione. Il vantaggio dell'alta tensione è energetico, non di velocità.","Esatto! Le perdite per calore sono P = R × I². Raddoppiare la tensione dimezza la corrente e riduce le perdite di quattro volte. Su centinaia di km di rete, il risparmio energetico è enorme.","Non è corretto. L'alta tensione richiede isolatori più grandi e più pesanti. Il vantaggio è energetico (riduzione delle perdite), non meccanico.","Non è corretto. L'alta tensione è tecnicamente meno sicura per le persone (maggiore rischio di elettrocuzione). Il motivo del suo uso è l'efficienza energetica nel trasporto."]],["Cosa fa il sifone nel sistema di scarico di un lavandino?",["Filtra le impurità dell'acqua di scarico per evitare che intasino le fognature","Trattiene acqua nella curva a U e impedisce ai gas di fogna di risalire","Accelera il deflusso dell'acqua di scarico grazie alla forma curva che crea una depressione","Riduce la pressione dell'acqua che sale dal piano inferiore attraverso i tubi di scarico"],1,"Il sifone è una curva a U nel tubo di scarico che trattiene permanentemente dell'acqua. Questa barriera liquida impedisce ai gas fognari (metano, acido solfidrico, altri gas tossici e maleodoranti) di risalire nell'appartamento. Se senti cattivi odori da uno scarico, il sifone si è asciugato: fai scorrere acqua per qualche minuto.",["Non è corretto. Il sifone non filtra le impurità. La sua funzione è tappare gli odori con una barriera d'acqua.","Esatto! Il sifone è una curva a U che trattiene sempre dell'acqua. Questa barriera liquida impedisce ai gas fognari (metano, acido solfidrico) di risalire dal sistema fognario nell'appartamento.","Non è corretto. Il sifone rallenta leggermente il deflusso per via della curva a U. La sua funzione è la barriera agli odori, non l'accelerazione del flusso.","Non è corretto. Le tubazioni di scarico funzionano per gravità (discendono), non per pressione. Il sifone serve per bloccare gli odori fognari."]],["Cos'è la classe energetica A4 di un edificio e cosa indica rispetto alla classe G?",["La classe A4 usa 4 fonti di energia rinnovabile; la G usa solo fonti fossili","A4 indica un edificio a consumo quasi nullo; G è la classe peggiore","La A4 è il certificato per gli edifici storici; la G è riservata ai nuovi edifici industriali","Sono classificazioni obbligatorie solo in fase di acquisto, non per la normale abitazione"],1,"La scala energetica degli edifici va da A4 (ottima efficienza, edificio quasi a zero energia) a G (peggiore, altissimi consumi). Un edificio in A4 consuma pochissima energia per il riscaldamento/raffrescamento perché è ben isolato e usa energie rinnovabili. Uno in G può consumare 10-15 volte di più.",["Non è corretto. Le classi energetiche non si riferiscono al numero di fonti rinnovabili. Misurano il consumo energetico per unità di superficie.","Esatto! La scala energetica va da A4 (migliore: edificio quasi a zero energia) a G (peggiore: altissimi consumi). Un edificio in classe G può consumare 10-15 volte più energia di uno in A4.","Non è corretto. Le classi energetiche si applicano a qualsiasi edificio residenziale o commerciale, storico o nuovo. Non sono categorie per tipologia di edificio.","Non è corretto. L'APE (Attestato di Prestazione Energetica) è obbligatorio in caso di compravendita o locazione ma il certificato deve essere disponibile anche per gli edifici esistenti."]],["A quale temperatura funziona un impianto di riscaldamento a radiatori tradizionali vs. a pavimento radiante?",["I radiatori funzionano a 70-80°C; il pavimento radiante a 30-35°C","I radiatori funzionano a 30-35°C; il pavimento radiante a 70-80°C","Entrambi funzionano alla stessa temperatura di 50°C per ragioni di sicurezza normativa","La temperatura dipende dalla marca della caldaia, non dal tipo di sistema di distribuzione"],0,"I radiatori hanno superficie piccola e richiedono acqua a 70-80°C. Il pavimento radiante ha superficie enorme (tutta la superficie del pavimento) e funziona a soli 30-35°C. A temperature basse le pompe di calore sono molto più efficienti (COP più alto), per questo pavimento radiante e pompa di calore sono un'accoppiata ottimale.",["Esatto! I radiatori tradizionali richiedono acqua a 70-80°C per emettere calore sufficiente. Il pavimento radiante, distribuendo il calore su tutta la superficie, funziona a soli 30-35°C: molto più efficiente con le pompe di calore.","Non è corretto. È il contrario. I radiatori richiedono temperature molto più alte perché la loro superficie di scambio termico è limitata rispetto al pavimento.","Non è corretto. Non esiste una temperatura normativa unica. La differenza è fisica: il pavimento radiante ha superficie enorme e può lavorare a bassa temperatura.","Non è corretto. La temperatura di lavoro è determinata principalmente dal sistema di distribuzione del calore (radiatori vs. pavimento), non dalla marca della caldaia."]]],"I":[["Perché i pannelli fotovoltaici producono energia anche in giornate nuvolose, anche se meno?",["Perché le nuvole riflettono parte della luce solare concentrandola sui pannelli","Perché i pannelli reagiscono alla luce diffusa che attraversa le nuvole, non solo alla luce diretta","Perché le nuvole mantengono i pannelli più freschi aumentando la loro efficienza","Perché le batterie di accumulo caricano i pannelli di notte e li 'rilasciano' durante il giorno"],1,"Le celle fotovoltaiche convertono i fotoni (particelle di luce) in elettricità. In giorni nuvolosi, la luce diffusa che attraversa le nuvole contiene comunque fotoni: i pannelli producono il 20-50% rispetto a una giornata serena. La luce diretta non è necessaria, anche se aumenta significativamente la produzione.",["Non è corretto. Le nuvole non concentrano la luce solare. Al contrario, la attenuano. I pannelli producono con la luce diffusa che passa attraverso le nuvole.","Esatto! I pannelli fotovoltaici reagiscono alla luce (fotoni), sia diretta che diffusa. In giorni nuvolosi producono il 20-50% rispetto a una giornata serena. Non hanno bisogno di sole diretto.","Parzialmente corretto: i pannelli funzionano meglio a temperature più basse. Ma questo non è il motivo per cui producono in giorni nuvolosi. La ragione è la luce diffusa.","Non è corretto. Le batterie immagazzinano energia già prodotta. Non caricano i pannelli. Il funzionamento nuvoloso dipende dalla luce diffusa."]],["Perché inserire troppi dispositivi in un'unica presa tramite adattatori multipli è pericoloso?",["Perché crea interferenze elettromagnetiche che danneggiano i dispositivi collegati","Perché la corrente totale supera il limite della presa: i cavi si surriscaldano","Perché la tensione si riduce progressivamente ad ogni dispositivo aggiuntivo fino a diventare insufficiente","Perché il contatore elettrico potrebbe non registrare correttamente i consumi con più prese attive"],1,"Ogni presa sopporta al massimo 10A (circa 2.200W a 230V). Collegare molti dispositivi tramite adattatori multipli può far superare facilmente questo limite: la corrente in eccesso riscalda il cavo. Il surriscaldamento del cavo è la causa principale degli incendi domestici da impianto elettrico. Gli interruttori magnetotermici nel quadro proteggono, ma spesso il cavo si surriscalda prima che scattino.",["Non è corretto. Le interferenze elettromagnetiche sono problemi diversi dalla sicurezza elettrica del sovraccarico di una presa.","Esatto! Ogni presa sopporta al massimo 10A (circa 2.200W a 230V). Con più adattatori si possono superare facilmente 2.200W: il cavo si surriscalda. Questa è la causa principale degli incendi elettrici domestici.","Non è corretto. La tensione di rete rimane nominalmente 230V indipendentemente dal numero di dispositivi collegati (può calare leggermente per caduta di tensione, ma non è il rischio principale).","Non è corretto. Il contatore misura correttamente la corrente totale assorbita indipendentemente dal numero di prese. Il rischio è il surriscaldamento del cavo."]],["Come si calcola il consumo mensile di una lavatrice da 0,6 kWh/lavaggio, usata 4 volte a settimana, con costo energetico di 0,30 €/kWh?",["0,6 × 4 × 4 × 0,30 = 2,88 € al mese","0,6 × 4 × 0,30 = 0,72 € a settimana, quindi 2,88 € al mese è troppo alto","0,6 × 4 × 0,30 = 0,72 € al mese","Non si può calcolare senza conoscere la potenza in Watt della lavatrice"],0,"0,6 kWh/lavaggio × 4 lavaggi/settimana × 4 settimane/mese × 0,30 €/kWh = 2,88 €/mese. Su base annua: circa 34,56 €. Questo tipo di calcolo permette di confrontare l'impatto di diversi elettrodomestici e decidere dove vale la pena investire in apparecchi più efficienti.",["Esatto! 0,6 kWh × 4 lavaggi/settimana × 4 settimane × 0,30 €/kWh = 2,88 €/mese. Su base annua: 2,88 × 12 ≈ 34,56 €. Calcoli simili per ogni elettrodomestico rivelano i veri 'mangiatori' di energia.","Non è corretto. 0,72 € a settimana × 4 settimane = 2,88 € al mese. Il calcolo nel testo e questa risposta danno lo stesso risultato: 2,88 € è corretto.","Non è corretto. Hai moltiplicato per 4 lavaggi ma dimenticato le 4 settimane del mese. 0,72 € è il costo settimanale, non mensile.","Non è corretto. Il dato fornito (0,6 kWh/lavaggio) è già il consumo per ciclo completo. Non serve conoscere la potenza istantanea per questo calcolo."]],["Perché i tubi di scarico devono avere una pendenza minima del 2%?",["Per permettere la ventilazione dell'aria lungo il tubo ed evitare il sifone negativo","Per garantire che l'acqua scorra per gravità verso le fognature senza creare depositi","Per rispettare la normativa sul risparmio idrico che limita la quantità d'acqua che può scorrere nei tubi","Per ridurre la velocità dell'acqua ed evitare che la pressione eroda il tubo in PVC"],1,"I tubi di scarico funzionano per gravità (non per pressione). Devono avere una pendenza minima del 2% verso il basso per garantire che l'acqua scorra continuamente senza fermarsi. Sotto il 2% l'acqua scorre troppo lento e lascia depositi organici che nel tempo ostruiscono il tubo.",["Non è corretto. La ventilazione nei sistemi di scarico esiste (colonne di ventilazione) ma non è la ragione della pendenza minima.","Esatto! I tubi di scarico funzionano per gravità. La pendenza minima del 2% garantisce che l'acqua scorra sempre verso il basso. Sotto il 2%, l'acqua scorre lenta e lascia depositi che nel tempo ostruiscono il tubo.","Non è corretto. La pendenza non è un requisito di risparmio idrico. È un requisito idraulico per garantire il corretto funzionamento dello scarico per gravità.","Non è corretto. Una pendenza eccessiva aumenta la velocità (non riduce l'erosione). La pendenza minima del 2% è il minimo per far scorrere l'acqua, non per ridurre la velocità."]],["Cosa fare immediatamente se si sente l'odore di gas (uova marce) in casa?",["Accendere la luce per vedere meglio dove si trova la perdita","Non accendere nulla di elettrico, aprire le finestre, chiudere il gas e uscire","Usare un cuscino per disperdere il gas verso le finestre e poi chiamare i soccorsi","Aspettare che il gas si disperda naturalmente prima di uscire, per evitare il panico"],1,"In caso di odore di gas: 1) NON accendere luci o qualsiasi dispositivo elettrico (possibile scintilla → esplosione); 2) Aprire immediatamente porte e finestre; 3) Chiudere il rubinetto del gas; 4) Uscire dall'edificio; 5) Chiamare l'emergenza gas: 800-900-700, attivo 24h. Il gas metano è inodore: il mercaptano aggiunto lo rende riconoscibile.",["Non è corretto. Accendere la luce può creare una scintilla elettrica che potrebbe innescare un'esplosione se il gas si è accumulato nell'aria.","Esatto! In caso di odore di gas: 1) non accendere luci o dispositivi (scintille); 2) aprire porte e finestre; 3) chiudere il rubinetto del gas; 4) uscire; 5) chiamare il numero di emergenza (800-900-700).","Non è corretto. Agitare l'aria può mescolare il gas con l'ossigeno creando una miscela esplosiva. La priorità è non creare scintille e aprire finestre per far uscire il gas.","Non è corretto. Il gas può accumularsi raggiungendo concentrazioni esplosive rapidamente. Non bisogna aspettare: uscire immediatamente è la scelta sicura."]],["Una bolletta elettrica indica 200 kWh consumati nel mese a 0,30 €/kWh. Come calcoli il costo totale?",["200 × 0,30 = 60 €","200 / 0,30 = 666 €","200 × 230 × 0,30 = 13.800 €","Non si può calcolare senza conoscere la potenza degli elettrodomestici usati"],0,"Costo energia = consumo (kWh) × prezzo unitario (€/kWh) = 200 × 0,30 = 60 €. In realtà la bolletta include anche quote fisse, oneri di sistema, imposte e IVA. La componente energia pura (a consumo) si calcola con questa formula semplice.",["Esatto! Costo = energia (kWh) × prezzo (€/kWh) = 200 × 0,30 = 60 €. In realtà la bolletta include anche quote fisse, oneri di sistema e tasse, ma la componente energia si calcola così.","Non è corretto. La divisione darebbe le unità sbagliate. Il costo si calcola moltiplicando i kWh per il prezzo unitario: 200 × 0,30 = 60 €.","Non è corretto. Non va moltiplicato per la tensione. L'energia è già espressa in kWh: basta moltiplicare per il prezzo al kWh.","Non è corretto. Il consumo totale in kWh è già il dato della bolletta. Non serve conoscere i singoli elettrodomestici per calcolare il costo totale mensile."]]],"A":[["Un appartamento ha bollette alte d'inverno. Come utilizzi le conoscenze degli impianti per identificare i possibili responsabili?",["Controllare se il contatore è guasto e segnalare al fornitore un malfunzionamento","Controllare caldaia, isolamento, classe energetica e consumi degli elettrodomestici","Sostituire immediatamente la caldaia con una a pompa di calore senza altri accertamenti","Cambiare il fornitore di energia perché i prezzi sono diversi da fornitore a fornitore"],1,"Bollette alte d'inverno si analizzano sistematicamente: 1) Caldaia: rendimento, manutenzione, tipo; 2) Isolamento: infissi, pareti, ponti termici; 3) Comportamenti: temperatura termostato, orari; 4) Elettrodomestici: frigorifero vecchio? Lavatrice in classe E? Solo dopo questa diagnosi si può investire nel modo giusto.",["Non è corretto. I contatori elettronici moderni raramente si guastano. Il consumo elevato d'inverno ha cause specifiche legate agli impianti di riscaldamento e all'isolamento.","Esatto! Il consumo invernale elevato si analizza verificando: 1) efficienza della caldaia (vecchia? rendimento basso?); 2) isolamento (ponti termici, infissi); 3) classe energetica dell'edificio; 4) comportamenti (termostato troppo alto).","Non è corretto. Prima di qualsiasi investimento, bisogna diagnosticare correttamente il problema. La pompa di calore è ottima ma non risolve problemi di isolamento o di altri elettrodomestici inefficienti.","Parzialmente corretto: cambiare fornitore può ridurre il costo per kWh. Ma se il consumo in kWh è eccessivo, ridurre solo il prezzo non risolve il problema strutturale."]],["Un appartamento usa 3.500 kWh/anno di energia elettrica. Il fotovoltaico produce 1.200 kWh/anno. Quale percentuale del fabbisogno copre?",["Circa il 34%: la bolletta scende ma non si azzera","Circa l'85%, coprendo quasi tutto il fabbisogno annuo","Il 100% perché l'eccesso estivo compensa il deficit invernale","Non si può calcolare senza sapere la distribuzione mensile dei consumi"],0,"1.200 kWh ÷ 3.500 kWh = 0,343 ≈ 34%. Il fotovoltaico copre circa un terzo del fabbisogno annuo. Il restante 66% viene ancora dalla rete. Per azzerare la bolletta servirebbe più potenza installata o un sistema di accumulo (batterie) per usare l'energia prodotta di giorno anche di notte.",["Esatto! 1.200/3.500 = 0,343 ≈ 34%. Il fotovoltaico copre circa un terzo del fabbisogno. Per coprire tutto il consumo servirebbero circa 8.750 W di pannelli (ipotizzando stessa produzione proporzionale) o una batteria di accumulo per le ore notturne.","Non è corretto. 1.200/3.500 = 34%, non 85%. Il fotovoltaico residenziale tipico copre una porzione significativa ma raramente tutto il fabbisogno senza accumulo.","Non è corretto. 1.200 kWh \u003c 3.500 kWh. Non c'è un eccesso da compensare: la produzione totale è inferiore al consumo totale.","Non è corretto. Per calcolare la percentuale annua basta dividere produzione annua per consumo annuo: 1.200/3.500 ≈ 34%. La distribuzione mensile serve per ottimizzare l'autoconsumo, non per il calcolo percentuale annuo."]],["Un genitore chiede perché la bolletta del gas è misurata in m³ ma il costo è in kWh. Come spieghi la conversione?",["1 m³ di gas equivale sempre a 1 kWh: la conversione è 1:1 per semplificare la bolletta","Ogni m³ di metano contiene circa 8,5 kWh di energia; la bolletta moltiplica i m³ per il potere calorifico","La conversione avviene automaticamente nel contatore digitale che registra direttamente i kWh","1 kWh = 1 m³ di gas ma la bolletta aggiunge tasse che rendono il costo finale diverso"],1,"Il contatore del gas misura i volumi consumati in m³. Poi la bolletta converte in kWh usando il potere calorifico del metano (circa 8,5 kWh/m³). Questa conversione permette di confrontare il costo dell'energia da gas con quella elettrica sulle stesse basi (€/kWh). Le tasse, gli oneri e l'IVA si aggiungono separatamente.",["Non è corretto. Il potere calorifico del metano è circa 8,5 kWh/m³, non 1:1. La conversione dipende dalla composizione chimica del gas.","Esatto! Il potere calorifico del metano è circa 8,5 kWh/m³. La bolletta misura i m³ con il contatore e poi li converte in kWh (m³ × 8,5) per uniformare il confronto con l'energia elettrica.","Non è corretto. Il contatore del gas misura volumi (m³). La conversione in kWh avviene nella bolletta, non nel contatore.","Non è corretto. 1 kWh ≠ 1 m³. Il potere calorifico del metano è circa 8,5 kWh/m³: 1 m³ contiene 8,5 volte l'energia di 1 kWh elettrico."]],["Un edificio ha classe energetica G. Quali interventi, nell'ordine di efficacia tipico, dovresti proporre per migliorarla?",["Prima sostituire la caldaia, poi installare il fotovoltaico, poi fare il cappotto termico","Prima isolare l'involucro, poi rinnovare il riscaldamento, poi il fotovoltaico","Prima installare il fotovoltaico che paga da solo la ristrutturazione successiva","La classe G non può essere migliorata significativamente senza demolire e ricostruire"],1,"L'ordine logico: 1) Isolare l'involucro (cappotto esterno + infissi) → riduce il fabbisogno; 2) Sostituire il sistema di riscaldamento (caldaia a condensazione o pompa di calore) dimensionato sul nuovo fabbisogno ridotto; 3) Installare fotovoltaico. Fare gli interventi nell'ordine sbagliato spreca investimenti.",["Non è corretto. Sostituire la caldaia senza prima isolare è inefficiente: una caldaia nuova su un edificio non isolato continuerà a disperdere calore. L'isolamento viene prima.","Esatto! L'ordine corretto è: 1) isolare prima (riduce il fabbisogno); 2) poi dimensionare il nuovo impianto sul fabbisogno ridotto; 3) poi aggiungere produzione rinnovabile. Fare il contrario spreca investimenti.","Non è corretto. Il fotovoltaico produce elettricità, ma se l'edificio non è isolato continua a disperdere calore (gas o pompa di calore). L'isolamento prima riduce il fabbisogno termico totale.","Non è corretto. Molti edifici in classe G sono stati portati a classe B o A con cappotto termico, nuovi infissi, nuova caldaia e fotovoltaico. È un intervento lungo e costoso ma realizzabile."]],["Sull'APE (Attestato di Prestazione Energetica) di un appartamento che stai per affittare trovi la classe E con un consumo di 220 kWh/m²/anno. Cosa significa praticamente per il tuo portafoglio?",["Significa che la bolletta annua del gas sarà esattamente di 220 × superficie × 0,10 €/kWh","È un edificio inefficiente: il riscaldamento costerà molto più che in classe A","È accettabile perché la classe E rientra nei limiti normativi per gli affitti residenziali","Il dato non è affidabile perché la classe energetica varia molto tra estate e inverno"],1,"Un appartamento in classe E (220 kWh/m²/anno) consume molto più di uno in classe A (\u003c30-50 kWh/m²/anno). In termini pratici: per un appartamento di 80 m², il consumo stimato è 17.600 kWh/anno. Se 60% è gas (6,2 kWh/m³ × prezzo) e 40% elettrico, le bollette saranno significativamente più alte rispetto a un'alternativa in classe A.",["Non è corretto. Il valore dell'APE è indicativo: stima il consumo in condizioni standardizzate. I consumi reali variano per abitudini, clima dell'anno e temperatura del termostato.","Esatto! La classe E con 220 kWh/m²/anno indica un edificio inefficiente. Le bollette di riscaldamento saranno molto più alte rispetto a un edificio in classe A (tipicamente meno di 30-50 kWh/m²/anno). Il costo energetico va valutato come parte del costo totale dell'affitto.","Non è corretto. Non esiste un limite normativo di classe energetica per gli affitti residenziali. La classe E è semplicemente meno efficiente: pagherai di più in bollette.","Non è corretto. L'APE fornisce un indice annuale standardizzato. Varia poco tra estate e inverno come indice globale, anche se i consumi reali sono stagionali."]],["Perché l'energia elettrica viene trasportata ad altissima tensione e poi abbassata più volte prima di arrivare a casa? Quale principio fisico spiega le perdite ridotte?",["L'alta tensione riduce la resistenza dei cavi: i cavi si comportano come superconduttori","Le perdite dipendono dal quadrato della corrente: alta tensione, poca corrente, poche perdite","L'alta tensione permette di usare cavi di rame più sottili e leggeri che disperdono meno calore","I trasformatori convertono l'energia termica in elettrica durante l'abbassamento della tensione, recuperando le perdite"],1,"Le perdite per effetto Joule nei cavi sono P = R × I². Per trasmettere la stessa potenza (P = V × I), raddoppiare la tensione dimezza la corrente. Dimezzare la corrente riduce le perdite di quattro volte (perché dipendono da I²). Su 300 km di rete, questo risparmio vale milioni di kWh. Per questo: centrale → 400kV → 132kV → 20kV → 230V domestici.",["Non è corretto. La resistenza dei cavi dipende dal materiale e dalla sezione, non dalla tensione. L'alta tensione non trasforma i cavi in superconduttori.","Esatto! A parità di potenza (P = V × I), raddoppiare V dimezza I. Le perdite per Joule sono P = R × I²: dimezzare I riduce le perdite di quattro volte. Su reti di centinaia di km questa differenza è enorme.","Non è corretto. I cavi ad alta tensione richiedono isolamento molto spesso (per la sicurezza) e non sono più sottili. Il vantaggio è la riduzione della corrente, non la sezione del conduttore.","Non è corretto. I trasformatori non recuperano energia termica. Sono dispositivi di trasformazione della tensione con alta efficienza (circa 98-99%) ma non generano energia: la trasferiscono."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
