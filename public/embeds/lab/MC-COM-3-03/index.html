<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Il tragitto casa-scuola</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>

<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
const FE = { auto1: ["Auto, 1 occupante", 130], auto2: ["Auto, 2 occupanti", 65], bus: ["Autobus urbano (pieno)", 65], moto: ["Moto", 90], bici: ["Bicicletta", 0], piedi: ["A piedi", 0] };
LABENGINE.run({
  id: "MC-COM-3-03", area: "COM", classe: 3, titolo: "Il tragitto casa-scuola", archetipo: "Calcolatore",
  hook: "Tutto si muove: persone, merci, informazioni. Il viaggio più ripetuto della tua vita, per ora, è quello fra casa e scuola. Quanto pesa sul clima, e quanto potrebbe pesare di meno?",
  footer: "Fattori di emissione in grammi di CO₂ per chilometro e per passeggero, dalla tabella del testo della MC.",
  levels: [
    { brief: "Misura su Google Maps la distanza fra casa e scuola. Imposta mezzo e giorni: il laboratorio calcola le emissioni di un anno scolastico.",
      blocks: [
        { type: "sim", params: [{ id: "km", label: "Distanza casa-scuola (solo andata)", min: 0.2, max: 30, step: 0.1, value: 3, unit: "km" }, { id: "m", label: "Mezzo", options: Object.entries(FE).map(([k, v]) => [k, v[0]]), value: "auto1" }, { id: "g", label: "Giorni di scuola all'anno", min: 150, max: 220, step: 1, value: 200 }],
          outputs: [{ key: "gg", label: "Al giorno (andata e ritorno)", f: (p) => p.km * 2 * FE[p.m][1], unit: "g CO₂" }, { key: "y", label: "In un anno scolastico", f: (p) => (p.km * 2 * FE[p.m][1] * p.g) / 1000, unit: "kg CO₂", d: 1 }],
          bars: (p) => Object.values(FE).map(([l, f]) => [l, (p.km * 2 * f * p.g) / 1000]), barsUnit: "kg/anno", barsD: 1, barsTitle: "Lo stesso tragitto con mezzi diversi",
          note: (p) => p.km <= 2 && (p.m === "auto1" || p.m === "auto2") ? ["warn", "Meno di 2 km: a piedi sono circa 25 minuti, in bici meno di 10."] : null } ],
      reflect: "Quale alternativa sarebbe davvero praticabile per te? Che cosa te lo impedisce?" },
    { brief: "Risultati del sondaggio di una classe di 24 studenti (dati d'esempio). Inserisci i tuoi dati reali al posto di questi e leggi dove pesa di più.",
      blocks: [
        { type: "sim", params: [{ id: "auto1", label: "In auto da soli con un genitore", min: 0, max: 30, step: 1, value: 9 }, { id: "auto2", label: "In auto con un fratello o un compagno", min: 0, max: 30, step: 1, value: 4 }, { id: "bus", label: "In autobus", min: 0, max: 30, step: 1, value: 5 }, { id: "bici", label: "In bici o monopattino", min: 0, max: 30, step: 1, value: 2 }, { id: "piedi", label: "A piedi", min: 0, max: 30, step: 1, value: 4 }, { id: "km", label: "Distanza media (solo andata)", min: 0.5, max: 15, step: 0.5, value: 3.5, unit: "km" }],
          outputs: [{ key: "tot", label: "Emissioni della classe in un anno (200 giorni)", f: (p) => ["auto1", "auto2", "bus", "bici", "piedi"].reduce((s, k) => s + p[k] * p.km * 2 * FE[k][1] * 200, 0) / 1000, unit: "kg CO₂" }, { key: "auto", label: "Quota dovuta alle auto", f: (p, o) => o.tot ? ((p.auto1 * 130 + p.auto2 * 65) * p.km * 2 * 200 / 1000 / o.tot) * 100 : 0, unit: "%" }],
          bars: (p) => [["Auto (1 occupante)", p.auto1 * p.km * 2 * 130 * 200 / 1000], ["Auto (2 occupanti)", p.auto2 * p.km * 2 * 65 * 200 / 1000], ["Autobus", p.bus * p.km * 2 * 65 * 200 / 1000], ["Bici e piedi", 0]], barsUnit: "kg/anno" } ],
      reflect: "Quanti compagni hanno risposto che potrebbero cambiare mezzo? Che cosa li aiuterebbe?" },
    { label: "Scenario · il Piano di mobilità della scuola", brief: "Simula l'effetto delle azioni del tuo piano su una scuola di 400 studenti che oggi arrivano per metà in auto da soli (distanza media 3,5 km, 200 giorni).",
      blocks: [
        { type: "sim", params: [{ id: "car", label: "Car pooling: studenti che passano da 1 a 2 occupanti", min: 0, max: 200, step: 10, value: 40 }, { id: "pb", label: "Piedibus e bicibus: studenti che lasciano l'auto", min: 0, max: 200, step: 10, value: 30 }, { id: "bus", label: "Abbonamento scolastico: studenti che passano all'autobus", min: 0, max: 200, step: 10, value: 30 }],
          outputs: [{ key: "pr", label: "Emissioni oggi", f: () => 200 * 3.5 * 2 * 130 * 200 / 1e6, unit: "t CO₂", d: 1 }, { key: "do", label: "Con il piano", f: (p) => { const resto = Math.max(0, 200 - p.car - p.pb - p.bus); return (resto * 130 + Math.min(p.car, 200) * 65 + p.bus * 65) * 3.5 * 2 * 200 / 1e6; }, unit: "t CO₂", d: 1 }, { key: "r", label: "Riduzione", f: (p, o) => (1 - o.do / o.pr) * 100, unit: "%" }],
          bars: (p, o) => [["Oggi", o.pr], ["Con il piano", o.do]], barsUnit: "t CO₂", barsD: 1,
          note: (p) => p.car + p.pb + p.bus > 200 ? ["ko", "Hai spostato più studenti di quelli che vengono in auto (200): ricontrolla i numeri."] : null },
        { type: "canvas", fields: [["dati", "Dati raccolti (almeno 100 risposte)", ""], ["azioni", "Azioni proposte, con chi le realizza", ""], ["mis", "Come misurerete i risultati", ""]],
          checks: [["Almeno tre azioni", (v) => v.azioni.split(/[\n;]/).filter((x) => x.trim()).length >= 3], ["Indicatore misurabile", (v) => /\d|%|kg|percentual/i.test(v.mis)]],
          out: (v) => `PIANO DI MOBILITÀ SOSTENIBILE\n\nDati: ${v.dati}\n\nAzioni:\n${v.azioni}\n\nMonitoraggio: ${v.mis}` } ],
      reflect: "Quale azione costa meno e rende di più? Quale coinvolge le famiglie?" }],
  bridge: "Progetta il piano di mobilità sostenibile della scuola: somministra un sondaggio ai compagni, analizza i dati, calcola le emissioni e proponi azioni concrete.",
});

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-COM-3-03","F":[["In che anno fu inaugurata la prima ferrovia pubblica a vapore al mondo?",["1825 (Stockton-Darlington, Inghilterra)","1885 (Germania, con Karl Benz)","1769 (con la macchina a vapore di Watt)","1964 (Giappone, con lo Shinkansen)"],0,"Nel 1825 George Stephenson inaugurò la prima ferrovia pubblica a vapore al mondo sulla tratta Stockton-Darlington in Inghilterra. I treni raggiungevano i 25 km/h — tre volte la velocità di un cavallo al trotto sostenuto.",["Esatto! Nel 1825 George Stephenson inaugurò la prima ferrovia pubblica a vapore, che raggiungeva i 25 km/h.","Non è corretto. Il 1885 è l'anno in cui Karl Benz inventò l'automobile. La prima ferrovia è del 1825.","Non è corretto. Nel 1769 Watt perfezionò la macchina a vapore, ma la prima ferrovia pubblica arrivò più tardi, nel 1825.","Non è corretto. Il 1964 è l'anno dello Shinkansen giapponese, il primo treno ad alta velocità. La prima ferrovia è del 1825."]],["Cosa produce il settore dei trasporti a livello di emissioni globali di gas serra?",["Il 16% delle emissioni globali, più dell'agricoltura","Il 2% delle emissioni globali","Il 50% delle emissioni globali","Il 5% delle emissioni globali, meno dell'industria"],0,"Il settore dei trasporti produce il 16% delle emissioni globali di gas serra — una quota superiore all'intera produzione agricola mondiale. Questa cifra motiva lo studio e la comparazione dei diversi mezzi di trasporto in termini di impatto ambientale.",["Esatto! Il testo indica che il settore dei trasporti produce il 16% delle emissioni globali di gas serra, una quota superiore all'intera agricoltura mondiale.","Non è corretto. Il settore dei trasporti ha un impatto molto maggiore: il 16% delle emissioni globali.","Non è corretto. Il settore dei trasporti produce circa il 16% delle emissioni, non il 50%.","Non è corretto. Il testo indica il 16%, una quota superiore all'agricoltura mondiale."]],["Quante automobili circolano nel mondo oggi?",["Circa 1,5 miliardi di veicoli a motore","Circa 50 milioni di veicoli a motore","Circa 100 milioni di veicoli a motore","Circa 10 miliardi di veicoli a motore"],0,"Il testo indica che oggi nel mondo circolano circa 1,5 miliardi di veicoli a motore. Nel 1950, solo negli USA ce n'erano 50 milioni. Questo aumento ha portato con sé enormi emissioni e problemi di mobilità urbana.",["Esatto! Il testo indica che oggi nel mondo circolano circa 1,5 miliardi di veicoli a motore.","Non è corretto. 50 milioni era la cifra negli USA nel 1950. Oggi sono circa 1,5 miliardi a livello mondiale.","Non è corretto. Il numero attuale è molto più alto: circa 1,5 miliardi a livello mondiale.","Non è corretto. Il numero reale è circa 1,5 miliardi di veicoli, non 10 miliardi."]],["Cosa si intende per 'domanda indotta' nel contesto del traffico urbano?",["Più corsie attirano più auto, e il traffico torna come prima","Le auto elettriche inducono un aumento della domanda di energia","Il trasporto pubblico induce le persone ad abbandonare l'auto","I nuovi quartieri residenziali inducono un aumento del traffico"],0,"La 'domanda indotta' è il fenomeno documentato per cui aggiungere corsie stradali aumenta il traffico anziché ridurlo: più strade rendono l'auto più conveniente, più persone la scelgono, generando più traffico. La soluzione non è 'più strade' ma rendere le alternative più attrattive.",["Esatto! La 'domanda indotta' è il fenomeno per cui più strade non riducono il traffico: incentivano più persone a usare l'auto, generando altro traffico.","Non è corretto. La 'domanda indotta' nel testo riguarda il traffico, non l'energia.","Non è corretto. L'effetto descritto è l'opposto: la domanda indotta è causata dall'ampliamento delle strade.","Non è corretto. La 'domanda indotta' nel testo si riferisce specificamente all'aggiunta di corsie stradali, non ai nuovi quartieri."]],["Quale mezzo di trasporto trasporta il 90% delle merci mondiali?",["Il trasporto marittimo","Il trasporto aereo","Il trasporto ferroviario","Il trasporto su strada"],0,"Il trasporto marittimo trasporta il 90% delle merci mondiali. Le grandi navi portacontainer sono il mezzo più efficiente per le lunghe distanze: possono trasportare migliaia di tonnellate usando pochi grammi di carburante per tonnellata-km.",["Esatto! Il 90% delle merci mondiali viaggia via mare. Il trasporto marittimo è il più efficiente per le grandi distanze grazie alla capacità enormedelle navi portacontainer.","Non è corretto. Il trasporto aereo è veloce ma costoso e limitato in capacità: copre solo una piccola frazione delle merci mondiali.","Non è corretto. Il treno è efficiente su scala continentale, ma non può attraversare gli oceani come le navi.","Non è corretto. Il camion è fondamentale per l'ultimo miglio, ma il 90% delle merci mondiali viaggia via mare."]],["Quante emissioni di CO₂ emette mediamente un'automobile privata con un solo occupante per km?",["120-150 g di CO₂ per km","10-20 g di CO₂ per km","500-600 g di CO₂ per km","60-80 g di CO₂ per km"],0,"Un'auto a benzina con un solo occupante emette mediamente 120-150 g di CO₂ per km. Per confronto, un treno regionale pieno emette solo 14-20 g/km per passeggero — circa 10 volte meno. Questa differenza giustifica le politiche di incentivazione al trasporto pubblico.",["Esatto! Un'auto a benzina con un solo passeggero emette mediamente 120-150 g di CO₂ per km — contro i 14-20 g di un treno regionale pieno.","Non è corretto. Queste emissioni sono quelle del treno regionale, non dell'auto privata.","Non è corretto. 500-600 g sono le emissioni di un volo transatlantico per km, non di un'auto.","Non è corretto. Quelle sono le emissioni di un autobus pieno. L'auto privata con un solo occupante emette 120-150 g/km."]]],"I":[["Perché il container, introdotto nel 1956, ha trasformato l'economia globale?",["Ha reso i carichi tutti uguali, abbattendo i costi di carico e scarico","Ha aumentato la velocità delle navi portacontainer da 10 a 30 nodi","Ha permesso di trasportare prodotti deperibili via mare per la prima volta","Ha ridotto i dazi doganali tra i paesi"],0,"Il container (introdotto da Malcolm McLean nel 1956) ha standardizzato le dimensioni dei carichi. Prima, caricare/scaricare una nave richiedeva settimane di lavoro manuale. Con il container, una gru lo fa in minuti. Il costo di spedizione Shanghai-Rotterdam è sceso del 90% in termini reali rispetto al 1960, rendendo economica la globalizzazione.",["Esatto! Il container ha eliminato il carico/scarico manuale (settimane di lavoro) e standardizzato le misure, rendendo economico produrre in Asia e vendere in Europa.","Non è corretto. La velocità delle navi non è il fattore principale: la rivoluzione è nella standardizzazione e nei costi di movimentazione.","Non è corretto. Il container non è specifico per i prodotti deperibili: la sua rivoluzione è la standardizzazione delle dimensioni.","Non è corretto. Il container non è uno strumento doganale: è un contenitore standardizzato che riduce i costi di movimentazione."]],["Perché il treno ad alta velocità Roma-Milano è spesso più rapido dell'aereo porta-a-porta?",["Perché all'aereo vanno aggiunti i tragitti da e per l'aeroporto e l'imbarco","Perché i treni AV in Italia viaggiano a 600 km/h","Perché gli aerei sulla tratta Roma-Milano volano a velocità ridotta","Perché c'è sempre vento contrario tra Roma e Milano"],0,"Porta-a-porta, il treno AV Roma-Milano (2h55m) è più veloce del volo (1h di volo + ~1,5h spostamenti aeroportuali + ~1h check-in/sbarco = 3,5-4h totali). Il volo è conveniente solo per distanze superiori a 700-900 km.",["Esatto! Il treno impiega 2h55m direttamente centro-centro. Il volo pesa ~1h volo + 1,5h aeroporto + 1h imbarco/sbarco = 3,5-4h totali.","Non è corretto. I treni AV italiani viaggiano fino a circa 300 km/h in servizio commerciale, non 600 km/h.","Non è corretto. Gli aerei non volano a velocità ridotta su questa tratta: il problema è il tempo perso negli aeroporti.","Non è corretto. Il vento non è un fattore significativo: il confronto è sul tempo totale porta-a-porta."]],["Perché gli aerei sono meno tassati del carburante per auto, creando una distorsione di mercato?",["Il cherosene degli aerei non è tassato a livello internazionale","Le compagnie aeree pagano tasse speciali che bilanciano il vantaggio","Il governo italiano sovvenziona i voli per favorire il turismo","L'aviazione è un settore strategico esente da imposte in tutti i paesi"],0,"Il cherosene per l'aviazione non è tassato a livello internazionale — al contrario del carburante per auto. Questo è uno dei più grandi sussidi impliciti ai combustibili fossili globali: abbassa artificialmente il prezzo dei biglietti aerei non includendo il costo ambientale reale.",["Esatto! Il cherosene per l'aviazione non è tassato internazionalmente: è uno dei più grandi sussidi impliciti ai combustibili fossili, che rende i voli artificialmente economici.","Non è corretto. Il testo indica che la mancata tassazione del cherosene è una distorsione non compensata da altre tasse.","Non è corretto. La distorsione è globale e riguarda la mancata tassazione internazionale del cherosene.","Non è corretto. Non è una scelta esplicita di esenzione: è l'assenza di accordi internazionali sulla tassazione del cherosene."]],["Calcola: quante emissioni produce un'auto a benzina con 1 occupante in un anno scolastico (200 giorni, 5 km al giorno andata e ritorno)?",["260 kg di CO₂ all'anno","30 kg di CO₂ all'anno","3.000 kg di CO₂ all'anno","130 kg di CO₂ all'anno"],0,"Calcolo: 5 km (andata) + 5 km (ritorno) = 10 km/giorno × 130 g CO₂/km = 1.300 g/giorno = 1,3 kg/giorno × 200 giorni = 260 kg CO₂/anno. Il testo usa 130 g/km come fattore medio per auto a benzina con 1 occupante.",["Esatto! 5 km × 2 (A/R) × 130 g/km = 1.300 g/giorno = 1,3 kg/giorno × 200 giorni = 260 kg/anno. Circa 300 kg considerando che 130 g è la media.","Non è corretto. Hai probabilmente dimenticato un fattore nel calcolo. 5 km × 2 × 130 g × 200 = 260.000 g = 260 kg, non 30.","Non è corretto. Il risultato è sovrastimato. 5 km × 2 × 130 g × 200 = 260.000 g = 260 kg, non 3.000.","Non è corretto. Hai dimenticato di moltiplicare per i 200 giorni scolastici. Il risultato corretto è circa 260 kg."]],["Per il trasporto di una gita scolastica con 27 persone su 200 km, perché il pullman pieno è probabilmente la scelta più sostenibile?",["Perché da pieno emette poco per passeggero ed è flessibile","Perché il pullman ha sempre meno emissioni di qualsiasi treno","Perché i pullman elettrici hanno zero emissioni","Perché il costo è il più basso tra tutte le opzioni"],0,"Un pullman con 27 persone emette 20-30 g CO₂/km per passeggero — paragonabile al treno regionale. In più offre flessibilità di orario e porta-a-porta. Il testo conclude che per questa specifica situazione il pullman è 'probabilmente la scelta più sostenibile e pratica'.",["Esatto! Un pullman con 27 persone emette 20-30 g CO₂/km per passeggero — simile al treno. In più offre flessibilità di orario e partenza porta a porta.","Non è corretto. Il testo precisa che il confronto dipende dall'occupazione: un treno a piena occupazione può essere migliore.","Non è corretto. Il testo analizza un pullman diesel convenzionale, non elettrico.","Non è corretto. Il testo indica un costo di 20-22 euro a persona — non necessariamente il più basso — e la scelta è motivata da sostenibilità e praticità."]],["Cosa dimostra il paradosso del trasporto pubblico descritto nel testo?",["Un circolo vizioso: meno passeggeri, servizio peggiore, ancora meno passeggeri","Il trasporto pubblico è sempre peggiore dell'auto privata per gli utenti","Il trasporto pubblico è solo per chi non può permettersi un'auto","La differenza tra Italia e Nord Europa è culturale, non economica"],0,"Il paradosso è un circolo vizioso: più utenti abbandonano il mezzo pubblico, meno risorse ha il sistema, peggio funziona, altri lo abbandonano. Il contrario è anche vero: investire nel trasporto pubblico aumenta gli utenti, che portano entrate, che permettono altri investimenti. La differenza tra le città italiane del Sud e quelle di Nord Europa non è culturale ma di investimento.",["Esatto! Il testo descrive il ciclo: meno utenti → meno risorse → servizio peggiore → altri abbandonano. Ma il contrario funziona: investire attira utenti, che portano risorse, che migliorano il servizio.","Non è corretto. Il testo mostra che nelle città con investimenti adeguati (Vienna, Amsterdam) il trasporto pubblico è eccellente.","Non è corretto. Il testo non associa il trasporto pubblico alla povertà: è una questione di scelte di investimento e pianificazione.","Non è corretto. Il testo dice esplicitamente il contrario: 'La differenza non è culturale — è di investimento e pianificazione.'"]]],"A":[["La fast fashion fa percorrere agli indumenti ~20.000 km prima di arrivare nei negozi. Qual è la conseguenza ambientale principale non visibile nel prezzo?",["I costi ambientali non sono compresi nel prezzo del prodotto","Le emissioni sono ridotte perché le navi usano carburante biocombustibile","L'impatto è trascurabile perché le navi sono molto efficienti","I costi sono compensati dai governi tramite sussidi ai produttori"],0,"I costi ambientali della fast fashion — emissioni di trasporto, consumo d'acqua nella produzione del cotone, inquinamento dei fiumi bangladeshi dai coloranti, smaltimento dei capi usati — non sono inclusi nel prezzo al consumo. Sono 'esternalizzati': pagati non da chi compra né da chi vende, ma dall'ambiente e dalle comunità.",["Esatto! Il testo spiega che i 'costi esternalizzati' — le emissioni dei trasporti, l'inquinamento dell'acqua, lo smaltimento — non sono inclusi nel prezzo. Se lo fossero, il capo costerebbe molto di più.","Non è corretto. Le navi portacontainer usano bunker fuel, uno dei combustibili più inquinanti, non biocombustibili.","Non è corretto. Il trasporto marittimo globale produce il 2,5% delle emissioni mondiali di CO₂ — più dell'aviazione.","Non è corretto. Il testo non menziona sussidi ai produttori: indica la mancata internalizzazione dei costi ambientali."]],["Un'auto elettrica in Italia emette circa 45-55 g CO₂/km. Perché non è zero se non emette durante la guida?",["Perché contano la produzione della batteria e l'origine della corrente","Perché le auto elettriche consumano olio motore che viene bruciato","Perché i freni generano CO₂ durante la frenata","Perché le auto elettriche hanno un motore a idrogeno che emette vapore"],0,"Le emissioni reali di un'auto elettrica includono tutto il 'ciclo di vita': la produzione della batteria (litio, cobalto, ecc.) e le emissioni dell'elettricità usata per ricaricarla. In Italia, dove il mix energetico include ancora gas e carbone, una Tesla Model 3 emette circa 45-55 g CO₂/km — molto meno dei 120-150 g di un'auto a benzina.",["Esatto! Il testo usa il concetto di 'emissioni dell'intero ciclo di vita': include la produzione della batteria e le emissioni legate all'elettricità usata per ricaricare.","Non è corretto. Le auto elettriche non hanno motori a combustione interna e non bruciano olio motore.","Non è corretto. I freni generano calore e particolato, non CO₂.","Non è corretto. Le auto elettriche usano batterie, non idrogeno. Solo le auto a cella a combustibile usano idrogeno."]],["Perché l'affermazione 'il treno è sempre la scelta più verde' è un'oversimplificazione?",["Perché un treno semivuoto emette più CO₂ per passeggero-km di un pullman pieno","Perché i treni italiani usano ancora carbone per produrre elettricità","Perché il treno è più caro dell'auto e quindi ha un impatto sociale negativo","Perché i treni ad alta velocità consumano più energia delle auto"],0,"Il testo chiarisce che la sostenibilità non si misura solo sul mezzo ma sull'occupazione. Il concetto chiave è 'passeggero-km': se un treno ha 20 passeggeri su 300 posti disponibili, le emissioni per passeggero-km possono essere superiori a quelle di un pullman pieno. La scelta più sostenibile dipende sempre dal contesto specifico.",["Esatto! Il concetto chiave è 'passeggero-km': le emissioni si dividono per il numero di passeggeri. Un treno semivuoto è meno efficiente di un pullman pieno.","Non è corretto. I treni italiani non bruciano carbone direttamente: l'elettricità viene dalla rete, che include un mix di fonti.","Non è corretto. Il testo discute la sostenibilità ambientale, non il costo come misura di sostenibilità.","Non è corretto. I treni ad alta velocità sono molto più efficienti per passeggero-km rispetto all'auto privata."]],["Il Mobility Planner analizza i flussi di spostamento di una città. Quale dato è fondamentale per proporre soluzioni efficaci?",["Passeggeri per ogni mezzo e zone non servite","Il numero di auto immatricolate ogni anno","Il prezzo della benzina nel mercato internazionale","La lunghezza totale delle strade in una città"],0,"Il Mobility Planner analizza i flussi di spostamento per identificare i nodi critici: dove le persone si spostano ma il trasporto è inadeguato. Il dato fondamentale è il 'passeggero-km' per mezzo, che permette di confrontare l'efficienza reale e proporre soluzioni integrate (bus + bici + car sharing).",["Esatto! Il testo indica che il Mobility Planner identifica 'i nodi critici dove la gente si sposta ma il trasporto è carente' usando dati di flusso per proporre soluzioni integrate.","Non è corretto. Le immatricolazioni sono un dato parziale: il Mobility Planner analizza i flussi reali di spostamento, non le auto vendute.","Non è corretto. Il prezzo della benzina influenza la mobilità ma non è il dato centrale per progettare sistemi di trasporto.","Non è corretto. La lunghezza delle strade non rivela dove la gente si sposta e quali sono i nodi critici non serviti."]],["Stai progettando un piano di mobilità scolastica. La proposta di ridurre le emissioni del 20% viene contestata: 'Troppo poco per fare la differenza'. Come rispondi?",["I dati raccolti, dati al Comune, possono orientare decisioni reali","Il 20% è sufficiente per risolvere il cambiamento climatico da solo","L'impatto non va calcolato in percentuale ma in numeri assoluti di CO₂","L'azione individuale non ha senso: bisogna aspettare le leggi nazionali"],0,"Il testo indica che 'i dati che raccogli, se condivisi con il Comune, possono contribuire a decisioni reali: una nuova linea di bus, una rastrelliera per bici, un percorso pedonale sicuro.' L'azione locale non cambia il clima da sola, ma può innescare decisioni a scala più grande.",["Esatto! Il testo indica che l'impatto non è solo diretto: i dati raccolti da un piano scolastico possono diventare input per decisioni pubbliche con scala ben maggiore.","Non è corretto. Nessuna singola azione locale risolve il cambiamento climatico da sola. L'argomento corretto è l'effetto moltiplicatore e la scala sistemica.","Non è corretto. Usare percentuali o valori assoluti non cambia l'argomento fondamentale: l'impatto a scala locale può influenzare decisioni a scala maggiore.","Non è corretto. Il testo promuove esattamente l'opposto: le azioni locali e i dati raccolti alimentano le decisioni nazionali."]],["L'auto elettrica raggiunge il 'break-even' delle emissioni rispetto all'auto a benzina dopo 20.000-40.000 km. Cosa significa per la valutazione della sostenibilità?",["Produrre la batteria inquina molto: l'impatto si recupera solo con l'uso","L'auto elettrica è sempre più sostenibile dell'auto a benzina fin dal primo km","L'auto a benzina è sempre meno sostenibile per qualsiasi distanza percorsa","Il break-even si calcola solo in termini economici, non ambientali"],0,"Il break-even a 20.000-40.000 km significa che la produzione della batteria crea un 'debito di carbonio' che l'auto elettrica recupera gradualmente con guida a energia più pulita. Solo dopo quel punto le emissioni cumulative dell'elettrica diventano inferiori a quelle dell'equivalente benzina. Chi percorre pochi km non raggiunge mai il vantaggio.",["Esatto! Il break-even indica che la produzione della batteria crea un 'debito di carbonio' che l'auto elettrica ripaga guidando con energia più pulita. Chi percorre pochi km non raggiunge mai il vantaggio.","Non è corretto. Il testo indica un break-even a 20.000-40.000 km: solo dopo quel punto le emissioni cumulative dell'elettrica superano quelle della benzina.","Non è corretto. Prima del break-even (20.000-40.000 km), le emissioni cumulative dell'auto elettrica (inclusa produzione batteria) possono essere superiori.","Non è corretto. Il testo usa il break-even in termini di emissioni cumulative di CO₂, non di costo."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
<style>
/* Modalità LIM · percorso a passi: una cosa per schermata, niente scorrimento lungo */
.lim-steps{display:none}
html.lim .lim-steps{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100vw - 24px)}
.lim-steps button{font:inherit;font-weight:800;font-size:20px;height:56px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 22px;white-space:nowrap}
.lim-steps button:disabled{opacity:.35;cursor:default}
.lim-steps .lim-next{background:var(--lab);border-color:var(--lab);color:var(--surface)}
.lim-steps button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.lim-dots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.lim-dots button{font-size:17px;font-weight:700;height:48px;padding:0 16px;border-width:2px;color:var(--muted)}
.lim-dots button .n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--lab-bg);color:var(--lab);font-size:14px;margin-right:8px}
.lim-dots button[aria-current="step"]{border-color:var(--lab);color:var(--fg)}
.lim-dots button[aria-current="step"] .n{background:var(--lab);color:var(--surface)}
html.lim .lim-steps[hidden]{display:none}
html.lim body{padding-bottom:110px}
html.lim .lim-off{display:none!important}
/* meno testo a video: niente chip, regole della verifica e didascalie ridondanti */
html.lim header.lab-head .chips{display:none}
html.lim header.lab-head{padding-right:300px}
html.lim .verif-head p{display:none}
html.lim .verif{margin-top:0}
/* verifica: una domanda per volta */
html.lim .verif .vq{display:none}
html.lim .verif .vq.lim-cur{display:flex;border-top:0;padding-top:0}
html.lim .verif .vq-q{font-size:22px}
html.lim .verif .vq-opts button{font-size:17px;padding:12px 14px}
.lim-qnav{display:none}
html.lim .lim-qnav{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--muted)}
html.lim .lim-qnav button{font:inherit;font-weight:800;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--lab);background:var(--surface);color:var(--lab);cursor:pointer}
html.lim .lim-qnav button:disabled{opacity:.35;cursor:default}
@media (max-width:1100px){.lim-dots .t{display:none}.lim-dots button .n{margin-right:0}}

<script>
// Modalità LIM · percorso a passi. In LIM ogni scheda livello diventa una sequenza di schermate:
// consegna + prima attività → attività successive → Rifletti → Verifica (una domanda per volta) → Compito.
// Si naviga con la barra in basso, con PagSu/PagGiù o con le frecce del telecomando/presenter.
// Fuori dalla modalità LIM la pagina resta identica (tutte le regole valgono solo sotto html.lim).
(function () {
  const root = document.documentElement;
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const bar = mk("nav", "lim-steps"); bar.setAttribute("aria-label", "Passi del laboratorio");
  const prev = mk("button", null, "◀ Indietro"); prev.type = "button";
  const dots = mk("div", "lim-dots");
  const next = mk("button", "lim-next", "Avanti ▶"); next.type = "button";
  bar.append(prev, dots, next);
  let steps = [], cur = 0, panel = null;
  const all = () => steps.flatMap((s) => s.els);

  function label(el) {
    if (el.classList.contains("meta")) return "Rifletti";
    if (el.classList.contains("verif")) return "Verifica";
    if (el.classList.contains("bridge")) return "Compito";
    const h = el.querySelector(".blk-h, h3, h2"); if (h) return h.textContent.trim();
    return el.classList.contains("brief") ? "Consegna" : "Attività";
  }
  function build() {
    all().forEach((e) => e.classList.remove("lim-off"));
    panel = document.querySelector(".wrap > .panel:not([hidden])"); steps = [];
    if (!panel) { bar.hidden = true; return; }
    const kids = [...panel.children];
    for (let i = 0; i < kids.length; i++) {
      const e = kids[i];
      // la consegna sta sopra la prima attività, nella stessa schermata
      if (e.classList.contains("brief") && kids[i + 1]) { steps.push({ els: [e, kids[i + 1]], t: label(kids[i + 1]) }); i++; continue; }
      steps.push({ els: [e], t: label(e) });
    }
    const br = document.querySelector(".wrap > .bridge"); if (br) steps.push({ els: [br], t: "Compito" });
    dots.innerHTML = "";
    steps.forEach((s, i) => {
      const t = s.t.length > 22 ? s.t.slice(0, 20).trim() + "…" : s.t;
      const b = mk("button", null, `<span class="n">${i + 1}</span><span class="t">${t.replace(/[&<>]/g, "")}</span>`);
      b.type = "button"; b.title = s.t; b.onclick = () => go(i); dots.appendChild(b);
    });
    bar.hidden = steps.length < 2;
    if (steps.length < 2) { clear(); return; }
    cur = Math.min(cur, steps.length - 1); go(cur, true);
  }
  function go(i, quiet) {
    if (!steps.length) return;
    cur = Math.max(0, Math.min(steps.length - 1, i));
    all().forEach((e) => e.classList.add("lim-off"));
    steps[cur].els.forEach((e) => e.classList.remove("lim-off"));
    [...dots.children].forEach((b, j) => { if (j === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
    dots.children[cur]?.scrollIntoView({ inline: "center", block: "nearest" });
    prev.disabled = cur === 0; next.disabled = cur === steps.length - 1;
    if (!quiet) window.scrollTo({ top: 0 });
    window.dispatchEvent(new Event("resize")); // grafici e 3D si ridisegnano quando diventano visibili
  }
  function clear() { all().forEach((e) => e.classList.remove("lim-off")); }
  prev.onclick = () => go(cur - 1); next.onclick = () => go(cur + 1);

  // Verifica: una domanda per volta, con «Domanda n di N»
  function pager(v) {
    if (v.dataset.limq) return; v.dataset.limq = "1";
    const body = v.querySelector(".verif-body"); if (!body) return;
    const nav = mk("div", "lim-qnav"); const pb = mk("button", null, "◀"); const txt = mk("span"); const nb = mk("button", null, "Domanda successiva ▶");
    pb.type = nb.type = "button"; nav.append(pb, txt, nb); body.after(nav);
    let q = 0;
    const show = () => { const qs = [...body.querySelectorAll(".vq")]; if (!qs.length) return; q = Math.max(0, Math.min(qs.length - 1, q));
      qs.forEach((x, j) => x.classList.toggle("lim-cur", j === q)); txt.textContent = `Domanda ${q + 1} di ${qs.length}`; pb.disabled = q === 0; nb.disabled = q === qs.length - 1; };
    pb.onclick = () => { q--; show(); }; nb.onclick = () => { q++; show(); };
    new MutationObserver(() => { if (!body.querySelector(".vq.lim-cur")) { q = 0; show(); } }).observe(body, { childList: true });
    show();
  }

  function sync() {
    const on = root.classList.contains("lim");
    if (on) { build(); } else clear();
  }
  function mount() {
    document.body.appendChild(bar);
    document.querySelectorAll(".verif").forEach(pager);
    // cambio di livello: ricostruisci i passi quando cambia la scheda visibile (in qualunque modo avvenga)
    let tmr = 0;
    const onPanel = () => { clearTimeout(tmr); tmr = setTimeout(() => { const p = document.querySelector(".wrap > .panel:not([hidden])"); if (p !== panel) cur = 0; if (root.classList.contains("lim")) build(); }, 0); };
    document.querySelectorAll(".wrap > .panel").forEach((p) => new MutationObserver(onPanel).observe(p, { attributes: true, attributeFilter: ["hidden"] }));
    document.addEventListener("keydown", (e) => {
      if (!root.classList.contains("lim")) return;
      const tag = (e.target.tagName || "").toLowerCase(); if (tag === "textarea" || tag === "input" || tag === "select") return;
      if (e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
      if (e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
    });
    new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["class"] });
    sync();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
