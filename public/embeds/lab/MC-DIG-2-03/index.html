<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Desktop in ordine</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-DIG-2-03","F":[["Qual è la regola principale per organizzare i file in cartelle, secondo il principio 'un posto per ogni cosa'?",["Mettere tutti i file sul desktop perché è il posto più accessibile","Ogni file deve avere un solo posto in cui trovarlo, prevedibile e sempre lo stesso","Creare una cartella separata per ogni singolo file con il nome del file stesso","Usare il motore di ricerca del sistema operativo ogni volta che non si trova un file"],1,"Il principio fondamentale è 'un posto per ogni cosa': ogni file ha un solo posto prevedibile in cui cercarlo. Se metti le cose sempre nello stesso posto, non devi pensarci. Il testo paragona l'organizzazione dei file a una biblioteca: con i libri ordinati trovi quello che cerchi in 30 secondi; ammucchiati a caso, non lo trovi mai.",["Non è corretto. Il testo avverte che il 'temporaneo' sul desktop diventa permanente in 24 ore e crea il problema di Marco con i file 'relazione DEFINITIVA vera2'.","Esatto! Il principio è semplice: se metti le cose sempre nello stesso posto, dopo un po' la mano va lì automaticamente. Non ci deve essere ambiguità su dove cercare un file.","Non è corretto. Creare una cartella per ogni file crea una struttura inutilmente profonda. Il testo suggerisce di non nidificare oltre il terzo livello.","Non è corretto. Usare la ricerca ogni volta è il sintomo del problema, non la soluzione. Il testo descrive proprio la situazione di Giulia che usa la ricerca e 'prega che funzioni'."]],["Come si chiama la convenzione di naming professionale per i file e qual è il formato raccomandato?",["Si usano nomi brevi come 'doc1', 'doc2', 'doc3' per velocizzare la ricerca","[ANNO-MESE-GIORNO]_[materia]_[argomento]_[versione opzionale] — es. 2026-03-15_tecnologia_relazione-energia_v01.docx","Il nome non importa purché il file sia nella cartella giusta","[materia]_[nome_studente]_[numero] — es. tecnologia_mario_001.docx"],1,"La convenzione professionale è [ANNO-MESE-GIORNO]_[materia]_[argomento]_[versione]. La data va per prima nel formato ANNO-MESE-GIORNO perché i file si ordinano automaticamente in ordine cronologico. Il trattino basso separa i blocchi di informazione; il trattino normale lega le parole dello stesso blocco.",["Non è corretto. Nomi come 'doc1' non contengono alcuna informazione utile sul contenuto o sulla data del file.","Esatto! Questo formato garantisce ordinamento cronologico automatico, identifica materia e argomento, e permette la gestione delle versioni senza la 'final syndrome'.","Non è corretto. Il nome del file è la prima informazione che hai su quel file. Un nome senza informazioni (come 'documento') è inutile anche nella cartella giusta.","Non è corretto. Questo formato non include la data, che è il campo più importante per l'ordinamento cronologico automatico. Senza data i file si accumulano senza ordine."]],["Qual è la 'regola 3-2-1' per i backup?",["Fare backup ogni 3 giorni, su 2 dispositivi, entro 1 ora","3 copie del file, su 2 supporti diversi, con 1 copia fuori sede (es. cloud)","Backup con 3 account cloud diversi, sincronizzati ogni 2 ore, con 1 copia su chiavetta","Salvare 3 versioni diverse dello stesso file, con 2 nomi diversi, 1 volta al giorno"],1,"La regola 3-2-1 è lo standard professionale: 3 copie del file (originale + 2 backup), 2 supporti fisicamente diversi (disco interno + disco esterno), 1 copia fuori sede (cloud). Per uno studente: file sul computer + chiavetta USB + Google Drive è una versione praticabile.",["Non è corretto. La regola 3-2-1 riguarda il numero di copie e i supporti, non la frequenza temporale.","Esatto! 3 copie (originale + 2 backup), 2 supporti diversi (es. disco interno + disco esterno), 1 copia fuori sede (cloud) per proteggersi anche da eventi fisici come incendi o furti.","Non è corretto. La regola 3-2-1 standard è: 3 copie totali, 2 supporti fisicamente diversi, 1 fuori sede. Non si riferisce al numero di account cloud.","Non è corretto. Il versioning dei file è separato dalla regola 3-2-1. Quest'ultima riguarda la protezione da perdita fisica dei dati, non la gestione delle versioni."]],["Perché i cookie di terze parti sono diversi dai cookie tecnici necessari?",["I cookie tecnici occupano più spazio sul disco; quelli di terze parti sono più piccoli","I cookie tecnici permettono al sito di funzionare (login, carrello); quelli di terze parti seguono la navigazione su più siti per costruire un profilo pubblicitario","I cookie tecnici funzionano solo su computer; quelli di terze parti funzionano anche sugli smartphone","I cookie di terze parti sono illegali in Italia; quelli tecnici sono legali"],1,"I cookie tecnici (necessari) permettono al sito di funzionare: ricordano che sei loggato, cosa hai nel carrello, le tue preferenze. I cookie di terze parti provengono da aziende pubblicitarie diverse dal sito che visiti e tracciano il comportamento su molti siti per costruire un profilo pubblicitario.",["Non è corretto. La differenza non riguarda le dimensioni dei file, ma la funzione: i cookie tecnici servono al funzionamento del sito, quelli di terze parti tracciano il comportamento per la pubblicità.","Esatto! I cookie tecnici (necessari) ricordano che sei loggato o cosa hai messo nel carrello. I cookie di terze parti provengono da aziende pubblicitarie e tracciano il comportamento su molti siti.","Non è corretto. Entrambi i tipi di cookie funzionano su tutti i dispositivi con browser.","Non è corretto. I cookie di terze parti non sono illegali ma richiedono consenso informato secondo il GDPR. La differenza è funzionale, non di legalità assoluta."]],["Perché è meglio fare il backup in modo automatico invece che manuale?",["Perché il backup automatico è sempre più veloce di quello manuale","Perché se devi ricordarti manualmente di farlo, lo dimenticherai esattamente la sera prima che il computer si rompa","Perché il backup manuale richiede che il computer sia spento","Perché il backup manuale consuma più batteria del backup automatico"],1,"Il backup deve essere automatico perché l'essere umano dimentica. Time Machine (Mac), Cronologia file (Windows) e la sincronizzazione automatica su Drive o OneDrive lavorano in background senza richiedere azioni. La configurazione richiede 20 minuti una volta sola. Poi funziona da sola.",["Non è corretto. La velocità del backup dipende dalla quantità di dati, non dal fatto che sia automatico o manuale.","Esatto! Il testo lo dice chiaramente: 'Il backup deve essere automatico o non viene fatto.' Gli strumenti come Time Machine (Mac) o Cronologia file (Windows) lavorano in background senza richiedere azioni.","Non è corretto. Il backup manuale non richiede che il computer sia spento. Il problema è la dimenticanza umana, non un requisito tecnico.","Non è corretto. Il consumo di batteria dipende dalla quantità di dati trasferiti, non dalla modalità (automatica o manuale)."]],["Perché non si dovrebbe usare 'definitivo', 'finale' o 'usare questo' nel nome di un file?",["Perché questi termini non sono accettati dal sistema operativo Windows","Perché tra sei mesi non ricorderai 'finale' rispetto a cosa, e accumulerai versioni come 'relazione DEFINITIVA vera2 usare questa'","Perché i motori di ricerca del sistema operativo non trovano file con queste parole nel nome","Perché queste parole occupano troppo spazio nel nome del file"],1,"La 'final syndrome' è talmente comune da avere un nome: si accumula una serie di file 'relazione DEFINITIVA vera2 usare questa'. La soluzione è usare sempre numeri di versione (_v01, _v02, _v03). Quando il file è davvero finito, si rimuove il numero di versione o si aggiunge _CONSEGNATO con la data.",["Non è corretto. Il sistema operativo accetta qualsiasi nome (eccetto certi caratteri speciali). Il problema è pratico, non tecnico.","Esatto! Il testo descrive la 'final syndrome': proliferazione di file con nomi come 'definitivo', 'finale', 'usare questo'. La soluzione è usare numeri di versione (_v01, _v02) e aggiungere _CONSEGNATO alla versione finale.","Non è corretto. I motori di ricerca trovano qualsiasi file. Il problema è che con molti file 'definitivi' la ricerca restituisce troppi risultati ambigui.","Non è corretto. I nomi dei file non hanno un limite di spazio rilevante. Il problema è la perdita di significato, non la lunghezza."]]],"I":[["Marco, nel caso studio, impiega 15-20 minuti per sessione a cercare file. Qual è l'impatto concreto di questo problema in un anno scolastico?",["Nessun impatto reale: 15 minuti persi ogni tanto non fanno differenza","In un anno scolastico con 200 giorni di studio, si perdono circa 50-66 ore solo cercando file — quasi 2 settimane di lavoro","L'impatto è solo emotivo: il fastidio di non trovare i file","L'impatto riguarda solo i file scolastici, non quelli personali"],1,"Il testo confronta Giulia (15-20 minuti per sessione a cercare file, nessun sistema, nessun backup) con Marco Ferretti (trova un file in 15 secondi, backup automatico). Le differenze concrete: tempo perso (ore in un anno), stress (ansia da consegna), sicurezza dei dati (rischio perdita totale). Un sistema organizzato è un investimento che si ripaga immediatamente.",["Non è corretto. Il testo calcola che 15-20 minuti per sessione, su 200 giorni scolastici, significano ore di lavoro perso.","Esatto! Il testo quantifica: 'Giulia perde in media 15-20 minuti a sessione cercando file. In un anno scolastico sono ore.' Un sistema organizzato è un investimento di tempo che si ripaga subito.","Non è corretto. Il testo elenca tre impatti concreti: il tempo perso, lo stress, e il rischio di perdere dati senza backup.","Non è corretto. Il problema di organizzazione dei file colpisce qualsiasi tipo di file: scolastici, personali, professionali."]],["Perché la struttura a cartelle del file system è matematicamente un 'albero'?",["Perché i file si ramificano come i rami di un albero quando si moltiplicano","Perché è una struttura gerarchica in cui ogni cartella ha un solo nodo padre e può avere zero o più figli (sottocartelle o file)","Perché i file crescono e si moltiplicano nel tempo come un albero in natura","Perché il file system usa colori come un albero: verde per file recenti, giallo per vecchi"],1,"Il file system è un albero matematico: ogni cartella (nodo) ha un solo nodo padre e può avere zero o più nodi figli (sottocartelle o file). La profondità si misura dal nodo radice: 'Documenti/Scuola/Tecnologia' ha profondità 2. Gli algoritmi di ricerca nel file system usano esplorazione DFS (depth-first) o BFS (breadth-first) — gli stessi algoritmi per esplorare grafi matematici.",["Non è corretto. L'analogia dell'albero matematico non riguarda la moltiplicazione dei file, ma la struttura gerarchica delle relazioni tra cartelle.","Esatto! Un albero matematico ha esattamente questa struttura: ogni nodo ha un solo padre (eccetto la radice) e può avere più figli. 'Documenti → Scuola → Tecnologia' ha profondità 2.","Non è corretto. L'albero matematico non è una metafora di crescita biologica, ma una struttura di dati con relazioni gerarchiche precise.","Non è corretto. Il file system non usa necessariamente colori. La struttura ad albero è matematica, non visiva."]],["La regola pratica suggerita dice di non creare cartelle nidificate oltre il terzo livello. Perché?",["Perché il sistema operativo non supporta cartelle oltre il terzo livello","Perché se devi cliccare più di tre volte per arrivare a un file, la struttura è troppo profonda e difficile da navigare","Perché i file nelle cartelle profonde vengono automaticamente cancellati dopo un mese","Perché i backup automatici non funzionano su cartelle oltre il terzo livello"],1,"Il limite del terzo livello (es. Documenti → Scuola → Tecnologia) è una regola pratica per la navigabilità: più di 3 click per arrivare a un file rende la struttura troppo profonda per essere usata intuitivamente. Aggiungere sottocartelle per ogni singolo compito dentro Tecnologia è eccessivo.",["Non è corretto. I sistemi operativi supportano cartelle a qualsiasi profondità (centinaia di livelli). Il limite del terzo livello è una regola pratica di usabilità.","Esatto! Il testo dice: 'Se devi cliccare più di tre volte per arrivare a un file, la struttura è troppo profonda.' Documenti → Scuola → Tecnologia è già tre livelli.","Non è corretto. Il sistema operativo non cancella file in base alla profondità della cartella. Il limite del terzo livello è una regola pratica, non tecnica.","Non è corretto. I backup automatici funzionano a qualsiasi profondità di cartelle. La regola del terzo livello è per la navigabilità umana."]],["Cosa dice il testo sulla modalità privata del browser riguardo a cosa salva e cosa non salva?",["Non salva nulla: né la cronologia, né i file scaricati, né le password, né i cookie","Non salva cronologia, cookie e password sul dispositivo; ma i file scaricati esistono sul disco e la navigazione è visibile al provider internet","Salva solo i cookie necessari per il funzionamento dei siti, ma elimina il resto","Salva tutto come in modalità normale, ma lo cifra automaticamente"],1,"La modalità privata (Ctrl+Shift+N in Chrome, Ctrl+Shift+P in Firefox) non salva cronologia, cookie e password sul dispositivo. I file scaricati però esistono sul disco. La navigazione NON è nascosta al provider internet (ISP), alla rete scolastica o ai siti visitati che vedono il tuo IP.",["Non è corretto. La modalità privata salva normalmente i file scaricati sul disco. Non li mostra nella cronologia download, ma i file esistono.","Esatto! La modalità privata (Ctrl+Shift+N in Chrome) non salva cronologia, cookie e password. Ma i file scaricati esistono sul disco e la navigazione è visibile al provider di rete.","Non è corretto. In modalità privata anche i cookie necessari vengono eliminati alla chiusura della finestra privata.","Non è corretto. La modalità privata non cifra i dati: semplicemente non li salva sul dispositivo. La cifratura è un meccanismo separato."]],["Perché scaricare software da siti di 'download gratuiti' che offrono versioni 'craccate' è rischioso?",["Perché viola la licenza del software e si può ricevere una multa","Perché nel 90% dei casi il software contiene malware che si installa silenziosamente insieme al programma voluto","Perché i siti di download gratuiti usano connessioni lente che rallentano il computer","Perché il software craccato non funziona sui sistemi operativi moderni"],1,"Il testo avverte: 'Non scaricare mai programmi da siti di download gratuiti che offrono versioni craccate di software a pagamento: nel 90% dei casi il programma contiene malware che si installa silenziosamente.' La fonte sicura è sempre il sito ufficiale del produttore o l'app store del sistema operativo.",["Non è solo una questione legale. Il testo evidenzia un rischio tecnico più immediato: il malware che si installa insieme al software.","Esatto! Il testo avverte: 'Non scaricare mai programmi da siti di download gratuiti che offrono versioni craccate: il 90% dei casi il programma contiene malware che si installa silenziosamente.'","Non è corretto. Il problema non è la velocità di download, ma il rischio di malware incorporato nel software scaricato.","Non è corretto. Il software craccato spesso funziona — il problema è che porta con sé malware che compromette la sicurezza del sistema."]],["Perché gli aggiornamenti del software sono importanti per la sicurezza, non solo per le nuove funzionalità?",["Perché gli aggiornamenti rendono il computer più veloce ogni volta","Perché la maggior parte degli aggiornamenti corregge vulnerabilità di sicurezza che i criminali informatici possono sfruttare","Perché senza aggiornamenti il software smette di funzionare dopo 30 giorni","Perché gli aggiornamenti aumentano la RAM disponibile per le applicazioni"],1,"La maggior parte degli aggiornamenti software corregge vulnerabilità di sicurezza: falle che i criminali informatici possono usare per entrare nel sistema. Il sistema operativo, il browser e l'antivirus sono i più critici. Il testo usa la metafora efficace: rimandare gli aggiornamenti è come lasciare una finestra rotta — prima o poi qualcuno ci entra.",["Non è corretto. Gli aggiornamenti non migliorano necessariamente la velocità. La priorità è la correzione delle vulnerabilità di sicurezza.","Esatto! Il testo dice: 'Rimandare gli aggiornamenti per settimane è come lasciare una finestra rotta nel tuo appartamento: prima o poi qualcuno ci entra.'","Non è corretto. Il software non smette di funzionare automaticamente senza aggiornamenti, ma diventa vulnerabile agli attacchi non corretti.","Non è corretto. Gli aggiornamenti software non modificano la quantità fisica di RAM. Correggono bug e vulnerabilità."]]],"A":[["Il testo descrive il 'controllo di versione' (Git) come la soluzione professionale alla gestione dei file. Quale problema specifico risolve rispetto ai nomi come 'relazione_finale'?",["Git rinomina automaticamente tutti i file seguendo la convenzione di naming professionale","Git registra ogni modifica a ogni file con chi l'ha fatta e quando, permettendo di tornare a qualsiasi versione precedente senza moltiplicare file con nomi diversi","Git comprime automaticamente i file per risparmiare spazio sul disco","Git carica automaticamente tutti i file su Google Drive in tempo reale"],1,"Git risolve la 'final syndrome' in modo elegante: invece di moltiplicare file con nomi diversi (relazione_v01, relazione_v02...), Git mantiene un database di tutte le modifiche. Si può tornare a qualsiasi versione precedente, confrontare versioni, capire chi ha cambiato cosa e quando. Google Docs ha una versione semplificata integrata (Cronologia versioni).",["Non è corretto. Git non rinomina i file automaticamente. Registra ogni modifica, chi l'ha fatta e quando, permettendo di tornare a qualsiasi versione precedente.","Esatto! Con Git non servono 'relazione_v01', 'relazione_v02'... Git mantiene un registro completo delle modifiche. Si torna indietro nel tempo invece di avere file duplicati.","Non è corretto. Git usa una forma di compressione interna per il suo database, ma non comprime i file di lavoro. Il suo scopo principale è il versioning.","Non è corretto. Git è un sistema di versioning locale (o con repository remoto come GitHub), non un sistema di sincronizzazione cloud automatica come Drive."]],["Un gruppo di quattro studenti lavora su un documento condiviso. Riccardo usa 'relazione.docx' sul suo computer, Sofia usa 'relazione_mia_versione.docx' sul suo. Qual è il problema fondamentale e come si risolve?",["Il problema è che i file hanno nomi diversi. La soluzione è rinominarli tutti allo stesso modo","Il problema è la mancanza di un sistema condiviso: lavorare su copie locali divergenti crea versioni incompatibili. La soluzione è un documento condiviso su cloud (Google Docs) con accesso simultaneo","Il problema è la velocità: inviare file via WhatsApp è troppo lento. La soluzione è usare email aziendali","Non c'è alcun problema: ognuno lavora sulla sua sezione e poi si uniscono i file alla fine"],1,"Il scenario del testo mostra il classico problema del lavoro asincrono su copie locali: Riccardo e Sofia lavorano su versioni separate, Marco aggiunge sezioni a una delle due, e alla fine esistono sei versioni incompatibili. La soluzione è un documento cloud condiviso (Google Docs) dove tutti lavorano sullo stesso file in tempo reale.",["Non è corretto. Anche con lo stesso nome, lavorare in modo asincrono su file locali separati crea versioni divergenti. Il problema è la mancanza di collaborazione in tempo reale.","Esatto! Il testo descrive questo scenario: versioni divergenti su dispositivi separati senza un punto centralizzato. La soluzione è lavorare sullo stesso documento cloud condiviso in tempo reale.","Non è corretto. La velocità di trasmissione non è il problema fondamentale. Il problema è la mancanza di un punto di verità unico per il documento condiviso.","Non è corretto. Il testo descrive questo scenario come problematico: 'A fine settimana esistono sei versioni diverse. Nessuno sa quale sia la più completa.'"]],["Gli SSD hanno una caratteristica fisica importante che li distingue dagli HDD, ma anche un limite. Qual è?",["Gli SSD sono più capienti degli HDD ma costano di più","Gli SSD non hanno parti meccaniche e sono più veloci, ma ogni cella può essere scritta e cancellata un numero limitato di volte (1.000-10.000 cicli)","Gli SSD funzionano solo a temperature molto basse, rendendo necessario il raffreddamento artificiale","Gli SSD perdono tutti i dati se non sono collegati all'alimentazione per più di un anno"],1,"Gli SSD (Solid State Drive) non hanno parti meccaniche mobili come gli HDD: memorizzano i dati come cariche elettriche in celle di silicio. Vantaggi: 5-10 volte più veloci, più silenziosi, resistono meglio alle cadute. Limite: ogni cella può essere scritta e cancellata un numero limitato di volte (1.000-10.000 cicli) prima di degradarsi.",["Non è corretto. Tipicamente è il contrario: gli HDD sono più capienti e costano meno per GB. Gli SSD costano di più ma sono molto più veloci.","Esatto! Il testo dice: 'Gli SSD memorizzano i dati come cariche elettriche in celle di silicio. Ogni cella può essere scritta e cancellata un numero limitato di volte (tipicamente 1.000-10.000 cicli).'","Non è corretto. Gli SSD funzionano a temperatura ambiente normale, senza raffreddamento speciale.","Non è corretto nel tempo indicato. Gli SSD possono effettivamente perdere dati se non alimentati per molto tempo (anni in certi modelli), ma il limite principale citato nel testo è il numero di cicli di scrittura."]],["Quando condividi un file su Google Drive con 'chiunque abbia il link', quali rischi concreti corri che non avresti condividendo con persone specifiche?",["Nessun rischio: il link è sempre privato e solo chi lo riceve da te può accedervi","Il file diventa accessibile a chiunque ottenga quel link, anche tramite forward accidentale o condivisione non autorizzata da parte di chi lo ha ricevuto","Il file viene automaticamente cancellato da Drive dopo 24 ore se non viene usato","Google usa il file per addestrare modelli di intelligenza artificiale"],1,"Un link 'chiunque abbia il link' può essere inoltrato involontariamente o deliberatamente a persone non previste. Il testo raccomanda: 'Per i compiti scolastici, preferisci sempre la condivisione con persone specifiche (tramite email) piuttosto che il link pubblico.' La condivisione specifica dà il controllo su chi accede al file.",["Non è corretto. Il link 'chiunque abbia il link' è accessibile a qualsiasi persona che ottenga quel link, indipendentemente da come ci è arrivata.","Esatto! Il testo avverte: 'quando condividi con chiunque abbia il link, quel file diventa accessibile a chiunque ottenga quel link — anche chi non conosci.' Il link può essere inoltrato.","Non è corretto. Drive non cancella automaticamente i file condivisi pubblicamente. Il rischio è la diffusione incontrollata del link.","Non è questo il rischio specifico citato nel testo per la condivisione con link pubblico. Il testo si concentra sull'accesso incontrollato di terze parti."]],["La struttura a cartelle suggerita include una cartella 'Download-da-ordinare' come punto di transito. Perché questa è una soluzione efficace per la gestione dei file scaricati?",["Perché i file nella cartella Download vengono automaticamente eliminati dopo una settimana dal sistema operativo","Perché separa il flusso di download (caotico per natura) dall'archivio organizzato, e una pulizia settimanale previene l'accumulo di centinaia di file non catalogati","Perché i file nella cartella 'Download-da-ordinare' vengono automaticamente ordinati per tipo dal sistema operativo","Perché riduce il numero massimo di file che si possono avere sul computer"],1,"La cartella 'Download-da-ordinare' è un punto di transito: i file scaricati ci vanno temporaneamente, poi ogni settimana si spostano nelle cartelle giuste o si cancellano. Senza questo filtro, il temporaneo diventa permanente: la cartella Download di Giulia aveva 847 file non ordinati, mai svuotata.",["Non è corretto. Il sistema operativo non elimina automaticamente i file dalla cartella Download. La pulizia deve essere fatta dall'utente.","Esatto! Il testo raccomanda 'Download-da-ordinare' come punto di transito che si svuota ogni settimana. Il temporaneo che diventa permanente nella cartella Download è uno dei problemi più comuni.","Non è corretto. Il sistema operativo non ordina automaticamente i file per tipo in cartelle separate. L'ordinamento manuale settimanale è compito dell'utente.","Non è corretto. La cartella non riduce il numero di file: fornisce un posto temporaneo da svuotare periodicamente per mantenere l'ordine."]],["Il concetto di 'costo totale di possesso' è implicito nel caso studio del professionista Marco Ferretti. Cosa include questo concetto oltre al prezzo di acquisto?",["Solo il costo della connessione internet necessaria per sincronizzare i backup","Il tempo perso cercando file (ore in un anno), il costo dello stress, il rischio di perdita di dati importanti, e il costo potenziale di recupero o ricostruzione del lavoro perso","Solo il prezzo dell'hardware e del software utilizzati","Il costo dell'abbonamento a servizi cloud come Google Drive o iCloud"],1,"Il testo quantifica le differenze concrete tra un sistema organizzato (Marco) e uno disorganizzato (Giulia): tempo perso (15-20 min per sessione × 200 giorni = ore), stress da consegna, rischio di perdita totale dei dati. Il professionista che investe 20 minuti per configurare un sistema recupera quel tempo già nella prima settimana.",["Non è corretto. Il costo totale di possesso è un concetto più ampio che include il tempo, la produttività, il rischio di perdita dati e altri fattori.","Esatto! Il testo quantifica le differenze tra Giulia e Marco: tempo perso (15-20 min per sessione = ore in un anno), stress da consegna, rischio totale di perdita dati senza backup.","Non è corretto. Il costo totale di possesso include anche i costi 'nascosti' come il tempo perso, la produttività ridotta e il rischio di perdita dati.","Non è corretto. Gli abbonamenti cloud sono un costo reale ma secondario. Il costo principale è il tempo perso e il rischio di perdita dei dati."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
