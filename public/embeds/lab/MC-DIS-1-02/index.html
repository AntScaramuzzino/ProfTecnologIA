<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Lo scalatore</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

        { type: "info", html: "<p class=\"src\">Lo spazio per vista è una stima: un foglio diviso in due zone, tolti margini e cartiglio. Le scale proposte sono quelle normalizzate del disegno tecnico.</p>" } ],

          ["Sul disegno una stanza misura 7 cm × 8 cm. Nella realtà è…", ["3,5 × 4 m", "7 × 8 m", "35 × 40 cm"], 0, "7 × 50 = 350 cm; 8 × 50 = 400 cm: è la camera grande."]] } ],
      reflect: "Perché gli architetti usano proprio la scala 1:50 per le piante degli appartamenti?" }],

(function(){

    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{

    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},

      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-DIS-1-02","F":[["Cosa significa la scala 1:50 in un disegno tecnico?",["L'oggetto disegnato è 50 volte più grande dell'originale","Ogni centimetro sul foglio corrisponde a 50 cm nella realtà","Il foglio usato è 50 volte più grande di un foglio A4 standard","Il disegno è stato eseguito 50 volte, una per ogni componente dell'oggetto"],1,"Scala 1:50 è una scala di riduzione: ogni 50 cm reali = 1 cm sul foglio. 'Il numero dopo i due punti dice quante volte l'oggetto è più grande di come lo vedi sul disegno.' Formula: misura sul disegno = misura reale ÷ 50. Usata tipicamente per stanze e piccoli edifici.",["Non è corretto. Scala 1:50 è una scala di riduzione: l'oggetto reale è 50 volte più grande del disegno, non il contrario.","Esatto! La formula è: misura sul disegno = misura reale ÷ n. Con scala 1:50, se la parete è lunga 600 cm, sul foglio misura 600 ÷ 50 = 12 cm.","Non è corretto. La scala non riguarda le dimensioni del foglio, ma il rapporto tra le misure sul disegno e le misure reali dell'oggetto.","Non è corretto. La scala non indica il numero di disegni. È un rapporto di riduzione (o ingrandimento) tra misure reali e misure sul foglio."]],["Una finestra misura 2,4 cm sul disegno a scala 1:50. Quanto misura nella realtà?",["2,4 cm","120 cm","24 cm","0,048 cm"],1,"Formula per trovare la misura reale: misura reale = misura sul disegno × n (dove n è il denominatore della scala). Con scala 1:50: 2,4 cm × 50 = 120 cm = 1,2 m. La misura reale è sempre più grande della misura sul disegno in una scala di riduzione.",["Non è corretto. 2,4 cm è la misura sul foglio. Per trovare la misura reale con scala 1:50, bisogna moltiplicare per 50: 2,4 × 50 = 120 cm.","Esatto! Con scala 1:50: misura reale = misura sul disegno × 50 = 2,4 × 50 = 120 cm = 1,2 m. Il testo usa questo esempio esatto.","Non è corretto. Il calcolo è: misura reale = misura sul disegno × n = 2,4 × 50 = 120 cm. Non 2,4 × 10 = 24 cm (che sarebbe scala 1:10).","Non è corretto. 0,048 cm si otterrebbe dividendo invece di moltiplicare. Con scala di riduzione 1:50, la misura reale è sempre più grande del disegno."]],["Cosa si intende per 'scala 1:1'?",["La scala più comune usata negli edifici residenziali di un piano","La dimensione sul disegno è uguale alla dimensione reale dell'oggetto","Una scala speciale che funziona sia come ingrandimento sia come riduzione","La scala usata quando non si conosce la dimensione reale dell'oggetto"],1,"Scala 1:1 (scala naturale): dimensione sul disegno = dimensione reale. L'oggetto è rappresentato con le sue dimensioni vere. Usata per oggetti di dimensione 'da foglio': un raccordo idraulico, una placca elettrica, un documento d'identità. È il punto di equilibrio tra scale di riduzione (1:2, 1:5...) e scale di ingrandimento (2:1, 5:1...).",["Non è corretto. La scala 1:100 è usata per edifici residenziali (1 m reale = 1 cm sul foglio). La scala 1:1 è per oggetti di dimensione simile al foglio.","Esatto! Scala 1:1 significa dimensione disegno = dimensione reale. Si chiama 'scala naturale'. Usata per oggetti di dimensione 'da foglio': raccordi idraulici, placche elettriche, documenti d'identità.","Non è corretto. La scala 1:1 non è una scala doppia: significa semplicemente che disegno e oggetto reale hanno le stesse dimensioni.","Non è corretto. La scala 1:1 richiede di conoscere la dimensione reale dell'oggetto — anzi, il disegno ha esattamente quelle dimensioni. Non è una scala 'di default'."]],["Perché il formato A4 è il risultato di dividere a metà il formato A3?",["Per ragioni di costo: i fogli più piccoli costano meno e quindi si risparmia carta","Perché ogni formato si ottiene dimezzando il precedente, con lo stesso rapporto tra i lati","Perché A3 e A4 hanno la stessa larghezza — cambiano solo in altezza","Per convenzione storica senza un motivo matematico preciso"],1,"La norma ISO 216 definisce i formati serie A con una proprietà matematica elegante: il rapporto lato lungo / lato corto = √2 ≈ 1,414. Dimezzando il lato lungo si ottiene il formato inferiore con lo stesso rapporto. Questa proprietà garantisce che i disegni si scalino proporzionalmente tra formati — fondamentale per il disegno tecnico.",["Non è corretto. La ragione non è economica. La ragione è matematica: il rapporto tra i lati rimane costante (√2) dopo ogni dimezzamento.","Esatto! Il rapporto √2 garantisce che A4 abbia la stessa proporzione di A3 (e di tutti i formati serie A). Questo permette di scalare i disegni da un formato all'altro mantenendo le proporzioni.","Non è corretto. A3 è 297×420 mm; A4 è 210×297 mm. La larghezza di A4 (210 mm) è la metà della lunghezza di A3 (420 mm). Non hanno la stessa larghezza.","Non è corretto. Il sistema ISO 216 ha una base matematica precisa: il rapporto √2 (lato lungo / lato corto) che si conserva dopo ogni dimezzamento. Non è una convenzione arbitraria."]],["Cosa si intende per scala di ingrandimento 5:1?",["L'oggetto reale è 5 volte più grande del disegno","Il disegno è 5 volte più grande dell'oggetto reale","Il foglio è 5 volte più grande di un foglio A4 standard","Il disegno è realizzato con 5 viste diverse dello stesso oggetto"],1,"Le scale di ingrandimento si usano quando l'oggetto è troppo piccolo. Scala 5:1: ogni cm reale = 5 cm sul disegno. Il disegno è 5 volte più grande dell'originale. Usata per componenti meccanici di piccole dimensioni (ingranaggi, viti, chip elettronici). 'Il numero prima dei due punti dice quante volte più grande è il disegno rispetto all'oggetto reale.'",["Non è corretto. Nelle scale di ingrandimento è il contrario: il disegno è più grande dell'oggetto. Scala 5:1 significa che il disegno è 5 volte più grande dell'originale.","Esatto! Nelle scale di ingrandimento il numeratore (5) indica quante volte il disegno è più grande dell'originale. Misura reale → × 5 = misura sul disegno.","Non è corretto. La scala non riguarda le dimensioni del foglio ma il rapporto tra oggetto e disegno.","Non è corretto. Il numero di viste non è correlato alla scala. La scala 5:1 indica un rapporto di ingrandimento tra oggetto e disegno."]],["Qual è la scala standard più adatta per disegnare un appartamento di 10 metri × 8 metri su un foglio A3 (297×420 mm)?",["Scala 1:10 (1 m reale = 10 cm sul foglio)","Scala 1:100 (1 m reale = 1 cm sul foglio)","Scala 1:5 (5 cm reali = 1 cm sul foglio)","Scala 1:1 (dimensioni reali sul foglio)"],1,"Con scala 1:100: 10 m = 10 cm e 8 m = 8 cm sul foglio. Il disegno occupa 10×8 cm su un foglio A3 (297×420 mm). È la scala standard per piante di appartamenti. Il testo spiega il ragionamento: 'calcola il rapporto tra la dimensione massima dell'oggetto e lo spazio disponibile sul foglio, poi scegli la scala standard più vicina.'",["Non è corretto. Con scala 1:10, i 10 m dell'appartamento diventerebbero 100 cm sul foglio — ben oltre i 42 cm del foglio A3.","Esatto! Con scala 1:100: 10 m → 10 cm; 8 m → 8 cm. Il disegno è 10×8 cm, molto più piccolo del foglio A3 (30×42 cm). Lascia abbondante spazio per le quote e il cartiglio.","Non è corretto. Con scala 1:5, i 10 m diventano 200 cm sul foglio — enormemente troppo grande per qualsiasi formato standard.","Non è corretto. Un appartamento di 10×8 m in scala 1:1 richiederebbe un foglio da 10×8 metri. Fisicamente impossibile per un foglio A3."]]],"I":[["Un bullone è lungo 18 mm nella realtà e deve essere disegnato a scala 5:1. Quanto misura sul disegno?",["3,6 mm","90 mm","18 mm","180 mm"],1,"Con le scale di ingrandimento (n:1), la misura sul disegno = misura reale × n. Con scala 5:1: 18 mm × 5 = 90 mm = 9 cm. Il disegno è 5 volte più grande dell'oggetto reale. Il testo usa questo esempio esatto nell'Esempio 3 della sezione 'Come si calcola la scala'.",["Non è corretto. Con scala 5:1 (ingrandimento), la misura sul disegno è più grande dell'originale. 3,6 mm sarebbe il risultato di una riduzione 1:5.","Esatto! Con scala di ingrandimento 5:1: misura sul disegno = misura reale × 5 = 18 mm × 5 = 90 mm = 9 cm. Il testo usa questo esempio preciso.","Non è corretto. 18 mm sarebbe la misura in scala 1:1. Con scala 5:1 il disegno è ingrandito 5 volte: 18 × 5 = 90 mm.","Non è corretto. 180 mm si otterrebbe con scala 10:1. Con scala 5:1: 18 mm × 5 = 90 mm."]],["Perché il formato A4 ha lato lungo/lato corto = 29,7/21,0 = √2 ≈ 1,414? Qual è la proprietà pratica di questo rapporto?",["Permette di stampare qualsiasi immagine senza distorsione su qualsiasi stampante del mondo","Dimezzando o raddoppiando il foglio, il rapporto tra i lati non cambia","Permette di piegare il foglio in 4 parti uguali senza sprechi di materiale","È il rapporto aureo della bellezza classica applicato ai fogli di carta"],1,"Il rapporto √2 ≈ 1,414 è l'unico rapporto per cui dimezzare un rettangolo conserva le proporzioni. Se lato lungo / lato corto = √2, allora dopo il dimezzamento il lato lungo diventa il vecchio lato corto, e il nuovo lato corto è il vecchio lato lungo / 2 = (lato corto × √2) / 2 = lato corto / √2. Il rapporto rimane √2. Utilità pratica: scala e riproduci i disegni tra formati senza distorsioni.",["Non è corretto. Il rapporto √2 non riguarda la compatibilità con le stampanti, ma la proprietà geometrica di conservare le proporzioni dopo il dimezzamento.","Esatto! Il rapporto √2 è l'unico per cui il dimezzamento conserva le proporzioni. Questo è fondamentale nel disegno tecnico: un disegno su A3 rimpicciolito al 70,7% (= 1/√2) si adatta perfettamente su A4.","Non è corretto. La piegatura in 4 (A4 → A6) è una conseguenza, non la ragione. La proprietà fondamentale del rapporto √2 è la conservazione delle proporzioni dopo il dimezzamento.","Non è corretto. Il rapporto aureo φ ≈ 1,618. Il rapporto dei fogli ISO è √2 ≈ 1,414 — sono due costanti matematiche diverse con proprietà diverse."]],["Il collegamento STEM con la matematica descrive la scala come 'proporzionalità diretta'. Cosa significa e come si traduce in un grafico?",["Le due quantità (misura reale e misura sul foglio) sono inversamente proporzionali: quando una aumenta, l'altra diminuisce","Il rapporto tra misura sul disegno e misura reale è costante: nel grafico è una retta per l'origine","Nel grafico è una parabola: la misura sul disegno cresce più lentamente della misura reale all'aumentare dei valori","Nel grafico è una funzione a gradini: la misura sul disegno cambia solo quando si cambiano le scale standard"],1,"La scala è proporzionalità diretta: il rapporto misura_disegno / misura_reale = 1/n è costante per qualsiasi misura. Nel grafico (asse x = misura reale, asse y = misura sul disegno) è una retta che passa per l'origine con inclinazione 1/n. Raddoppiando la misura reale, raddoppia anche quella sul disegno — il rapporto rimane 1/n.",["Non è corretto. La scala è proporzionalità DIRETTA, non inversa: quando la misura reale raddoppia, la misura sul foglio raddoppia anch'essa.","Esatto! Il testo dice: 'La scala è quel rapporto costante. Puoi disegnare il grafico: sull'asse x la misura reale, sull'asse y la misura sul disegno. Ottieni una retta che passa per l'origine — la sua inclinazione è 1/n.'","Non è corretto. La proporzionalità diretta produce una retta, non una parabola. La retta ha inclinazione costante pari a 1/n.","Non è corretto. La scala produce una relazione continua e lineare, non una funzione a gradini. Per una data scala, qualsiasi misura reale ha una corrispondente misura sul disegno."]],["Per il compito AGISCI si deve disegnare l'aula scolastica (dimensioni stimate 8×6 m) su un foglio A4. Come si sceglie la scala adatta?",["Si sceglie sempre la scala 1:100 per qualsiasi stanza","Si divide lo spazio utile per la misura maggiore: ne risulta la scala 1:50 (8 m → 16 cm)","Si misura l'aula con il metro e si disegna in scala 1:1 su un foglio molto grande","Si sceglie la scala più piccola possibile (1:1000) per lasciare più spazio per le note"],1,"Il procedimento per scegliere la scala: (1) misura massima = 800 cm; (2) spazio utile sul foglio A4 con margini ≈ 25 cm; (3) rapporto = 800 ÷ 25 = 32 → denominatore minimo; (4) scala standard più vicina con denominatore ≥ 32 = 1:50. Con 1:50: 8 m → 16 cm; 6 m → 12 cm — entra comodamente con spazio per quote e cartiglio.",["Non è corretto. La scala si sceglie in base alle dimensioni dell'oggetto e allo spazio disponibile. Non è fissa per le stanze.","Esatto! Il ragionamento del testo: dimensione massima ÷ spazio disponibile = denominatore minimo. 800 ÷ 25 = 32, quindi si scelglie la scala standard 1:50 che fa diventare 8 m → 16 cm e 6 m → 12 cm.","Non è corretto. Il compito richiede di usare un foglio A4, non un foglio grande. Per 8×6 m bisogna trovare una scala di riduzione adatta.","Non è corretto. Con scala 1:1000, l'aula di 8 m diventerebbe 0,8 cm sul foglio — troppo piccola per essere leggibile. La scala deve permettere un disegno leggibile con spazio sufficiente."]],["Il collegamento con MC-DIS-1-01 dice che la scala è 'la continuazione della proporzionalità imparata nelle costruzioni geometriche'. Come si collega il teorema di Talete con le scale?",["Non c'è collegamento: Talete riguarda la geometria, le scale riguardano le misure","Talete riguarda segmenti proporzionali: è la stessa proporzionalità che regola le scale","Talete ha inventato le scale di rappresentazione nell'antica Grecia e il collegamento è solo storico","Il teorema di Talete spiega perché i formati ISO 216 hanno il rapporto √2 tra i lati"],1,"La proporzionalità diretta è il filo matematico comune: il teorema di Talete (rette parallele dividono segmenti proporzionalmente) e le scale di rappresentazione (misura_disegno / misura_reale = costante 1/n) usano la stessa struttura. In entrambi i casi c'è un rapporto costante tra due quantità. Studiare il teorema di Talete in geometria prepara alla comprensione matematica delle scale.",["Non è corretto. Il teorema di Talete e le scale di rappresentazione si basano entrambi sulla proporzionalità diretta — la stessa struttura matematica.","Esatto! Nella costruzione della divisione di un segmento (Talete), le rette parallele dividono proporzionalmente. Nelle scale, il rapporto misura_disegno/misura_reale è costante. Stessa struttura matematica.","Non è corretto. Il collegamento è matematico: proporzionalità diretta. Talete formalizzò il concetto matematico, ma il collegamento con le scale è conceptuale, non solo storico.","Non è corretto. Il rapporto √2 dei formati ISO 216 è una proprietà diversa dalla proporzionalità di Talete. Sono due strutture matematiche distinte."]],["Per il compito AGISCI si deve stimare la scala dell'astuccio (22 cm) da inserire su metà foglio A4. Quale stima è corretta?",["Scala 1:1, perché l'astuccio di 22 cm entra nel foglio A4 da 29,7 cm","Scala 1:2, perché i 22 cm diventano 11 cm e resta spazio per più viste","Scala 1:10, perché è sempre meglio usare scale 'tonde' come potenze di 10","Scala 5:1, perché un oggetto piccolo come l'astuccio deve sempre essere ingrandito"],1,"Il testo usa l'esempio dell'astuccio: 22 cm in scala 1:1 occuperebbe quasi tutta la lunghezza di un A4 (29,7 cm), senza spazio per l'altezza e la larghezza. Con scala 1:2 l'astuccio diventa 11 cm — la metà — lasciando spazio per 2-3 viste che mostrano lunghezza, altezza e larghezza. La scelta della scala è sempre un equilibrio tra leggibilità e spazio disponibile.",["Non è corretto. L'astuccio ha anche larghezza e altezza. Il testo spiega che si usa 1:2 per avere spazio per più viste. Scala 1:1 non lascerebbe spazio per le altre viste dell'oggetto.","Esatto! Il testo usa questo esempio: 'meglio scegliere scala 1:2 (l'astuccio di 22 cm diventa 11 cm sul disegno) per avere spazio per due o tre viste.' Con 1:1 si potrebbe inserire solo una vista limitata.","Non è corretto. Con scala 1:10 l'astuccio diventerebbe 2,2 cm — troppo piccolo per essere leggibile. Le scale si scelgono in base allo spazio disponibile, non solo per 'tondezza'.","Non è corretto. L'astuccio di 22 cm è già abbastanza grande. Scala 5:1 lo farebbe diventare 110 cm — impossibile su un foglio A4. Le scale di ingrandimento sono per oggetti molto piccoli."]]],"A":[["Un ingegnere riceve un disegno con indicazione 'scala 1:200' ma sospetta che la scala sia sbagliata. Misura sul disegno una porta che conosce (è standard italiana, 210 cm). La porta misura 0,8 cm sul disegno. La scala è corretta?",["Sì, la scala 1:200 è corretta: 210 cm ÷ 200 = 1,05 cm ≈ 0,8 cm","No: a scala 1:200 la porta dovrebbe misurare 210 ÷ 200 = 1,05 cm, non 0,8 cm","Non si può verificare senza sapere il tipo di porta esatta: le porte italiane non hanno tutte la stessa misura","Sì, perché 0,8 cm è nell'errore di misura accettabile per il disegno tecnico"],1,"Metodo di verifica: scala reale = misura reale ÷ misura sul disegno = 210 cm ÷ 0,8 cm = 262,5. Quindi la scala reale è 1:262,5 — non una scala standard. Con scala 1:200, la porta dovrebbe misurare 210 ÷ 200 = 1,05 cm. La discrepanza (1,05 cm vs 0,8 cm) è del 24% — inaccettabile in disegno tecnico. Il disegno ha una scala errata o il foglio è stato ridotto in fotocopia.",["Non è corretto. Con scala 1:200 la porta dovrebbe misurare 210 ÷ 200 = 1,05 cm, non 0,8 cm. La differenza è significativa.","Esatto! Il calcolo di verifica: scala reale = misura reale ÷ misura sul disegno = 210 ÷ 0,8 = 262,5. Quindi la scala dichiarata (1:200) non corrisponde al disegno reale.","Non è corretto. Il testo dice che 210 cm è la porta standard italiana. Con questa misura nota, si può calcolare la scala reale e confrontarla con quella dichiarata.","Non è corretto. La differenza tra 1,05 cm (scala 1:200 corretta) e 0,8 cm è del 24% — ben oltre qualsiasi errore di misura accettabile. Il disegno tecnico richiede precisione millimetrica."]],["Il disegno tecnico ha 5.000 anni di storia (dai Sumeri a oggi). Quale continuità fondamentale mostra questa storia?",["Che gli strumenti sono rimasti gli stessi: riga, compasso, matita sono stati usati inalterati per 5.000 anni","Che il principio non cambia: rappresentare la realtà in modo preciso e misurabile; cambia lo strumento","Che le scale di riduzione non sono cambiate: 1:100 era la scala standard anche nell'antico Egitto","Che la geometria euclidea è stata l'unica matematica usata nel disegno tecnico in tutta la storia"],1,"Il testo dice: 'il principio del disegno tecnico — rappresentare la realtà in modo preciso, misurabile e non ambiguo — non è cambiato in 4.000 anni. È cambiato lo strumento.' Da Mesopotamia (stilo su argilla, 3000 a.C.) a Leonardo (penna, XV sec.) a Monge (geometria descrittiva, 1795) al CAD (1960) al LiDAR (XXI sec.) — il principio è lo stesso. La scala di rappresentazione è parte integrante di quel principio immutabile.",["Non è corretto. Gli strumenti sono cambiati radicalmente: stilo su argilla (Sumeri) → matita su carta (XIX sec.) → CAD (XX sec.) → BIM e droni LiDAR (XXI sec.). La continuità è nei principi, non negli strumenti.","Esatto! Il testo afferma: 'il principio del disegno tecnico non è cambiato in 4.000 anni. È cambiato lo strumento: dallo stilo su argilla, alla matita su carta, al CAD, ai droni LiDAR.' La scala è parte di questo principio immutabile.","Non è corretto. Le scale standardizzate (e la numerazione ISO 216) sono invenzioni relativamente recenti (XIX-XX sec.). I Sumeri e gli Egizi usavano scale proporzionali ma senza sistemi di denominazione numerica.","Non è corretto. Il BIM e il GIS usano anche geometria proiettiva, topologia, algebra lineare e molto altro. La continuità è nel principio di rappresentazione, non nella sola geometria euclidea."]],["Un tecnico medico deve disegnare un osso lungo 15 mm per un manuale clinico, in modo che siano visibili i dettagli strutturali. Quale scala e quale formato scegliere?",["Scala 1:100 su foglio A0, per avere il massimo spazio possibile","Scala 10:1 su foglio A4: i 15 mm diventano 15 cm","Scala 1:1 su foglio A5 per rispettare le dimensioni reali","Scala 1:5 su foglio A6 per farlo entrare nel manuale tascabile"],1,"Un osso di 15 mm (1,5 cm) è troppo piccolo per mostrare i dettagli strutturali. Si usa una scala di ingrandimento. Con scala 10:1: 15 mm × 10 = 150 mm = 15 cm — visibile su foglio A4 o A3. Il testo cita le scale di ingrandimento (10:1) come usate in 'orologeria, microelettronica, biologia (disegni di cellule, tessuti, strutture microscopiche)'.",["Non è corretto. Scala 1:100 ridurrebbe un osso di 15 mm a 0,15 mm — invisibile. Un osso piccolo deve essere ingrandito, non ridotto.","Esatto! Per oggetti piccoli (15 mm) si usano scale di ingrandimento. 10:1 trasforma 15 mm in 150 mm (15 cm) — visibile su A4 o A3. Usata in osteologia, microelettronica, biologia.","Non è corretto. Un osso di 15 mm in scala 1:1 sarebbe troppo piccolo per mostrare i dettagli strutturali. Per oggetti piccoli si usano scale di ingrandimento.","Non è corretto. Scala 1:5 è una riduzione: l'osso diventerebbe 3 mm — ancora più piccolo. Per oggetti già piccoli bisogna ingrandire, non ridurre."]],["La domanda di avvio dice di misurare il foglio A4 e trovare il rapporto lato lungo/lato corto. Perché quel numero (√2 ≈ 1,41) non è 'casuale'?",["Perché √2 è il numero più usato in matematica e si è scelto per convenienza","Perché solo con √2 il foglio dimezzato conserva lo stesso rapporto tra i lati","Perché corrisponde al rapporto aureo (φ ≈ 1,618) arrotondato per facilità di produzione industriale","Perché √2 è la diagonale di un quadrato di lato 1, e tutti i fogli sono in realtà quadrati piegati"],1,"La domanda di avvio della MC chiede di misurare il foglio A4 e calcolare 29,7 ÷ 21,0 = 1,414... ≈ √2. Questo numero non è casuale: √2 è l'unico rapporto per cui dimezzare il lato lungo produce un foglio con lo stesso rapporto. Quindi A4 dimezzato → A5 con rapporto √2; A4 × 2 → A3 con rapporto √2. La serie A è geometricamente coerente.",["Non è corretto. √2 è stato scelto per una precisa proprietà geometrica, non per convenienza. È l'unico rapporto che conserva le proporzioni dopo il dimezzamento.","Esatto! Questa è esattamente la proprietà matematica che la domanda di avvio vuole fare scoprire. Il numero che trovi (≈1,41) non è casuale: è √2, e ha questa proprietà geometrica speciale.","Non è corretto. Il rapporto aureo φ ≈ 1,618 e √2 ≈ 1,414 sono due costanti diverse. I formati ISO usano √2, non φ.","Non è corretto. I fogli ISO non sono quadrati piegati. Il collegamento con √2 è diverso: è il rapporto che conserva le proporzioni dopo il dimezzamento del lato lungo."]],["Nel disegno tecnico professionale, perché un file CAD di un componente meccanico include sempre l'indicazione della scala, anche se il file è digitale e si può zoomare?",["Perché i programmi CAD richiedono la scala come campo obbligatorio del database","Perché la scala permette di risalire dalle misure del disegno alle dimensioni reali","Perché senza scala il file non può essere aperto da altri programmi CAD diversi da quello originale","Perché la scala è necessaria per calcolare il peso del componente a partire dal disegno"],1,"Anche in un file CAD digitale, la scala è un'informazione semantica critica. Indica: (1) le dimensioni reali dell'oggetto, permettendo di capire 'quanto è grande' anche senza misurare; (2) la coerenza tra le viste — tutte le viste di uno stesso disegno devono usare la stessa scala; (3) la base per le quote — le misure annotate sono in unità reali (mm), non in unità dello schermo.",["Non è corretto. Non tutti i programmi CAD richiedono la scala come campo obbligatorio. La ragione è più fondamentale: comunicare le dimensioni reali a chi legge il disegno.","Esatto! Anche in un file CAD digitale, la scala è un'informazione semantica fondamentale: dice all'operatore che le quote indicate sono in mm reali, non in pixel. Permette la verifica di coerenza tra le viste.","Non è corretto. L'interoperabilità tra programmi CAD non dipende dall'indicazione della scala nel disegno.","Non è corretto. Il calcolo del peso richiede le dimensioni reali e la densità del materiale — ma questo è indipendente dalla scala dichiarata nel disegno."]],["Perché il tecnico medico che usa un GIS per mappare la distribuzione spaziale di una malattia e l'architetto che disegna un edificio usano entrambi la 'scala di rappresentazione', pur lavorando su oggetti di dimensioni radicalmente diverse?",["Perché entrambi seguono la stessa norma ISO 216 sui formati dei fogli","Perché la scala permette di rappresentare realtà di ogni dimensione mantenendo le proporzioni","Perché entrambi seguono le stesse regole della geometria euclidea nella costruzione dei disegni","Perché entrambi devono seguire le normative europee sull'accessibilità dei documenti tecnici"],1,"La scala è il principio universale della rappresentazione tecnica: permette di ridurre qualsiasi oggetto fisico — da un chip di 2 mm (scala 100:1) a un continente (scala 1:50.000.000) — su un supporto di dimensioni finite, mantenendo le proporzioni e permettendo di ricavare le misure reali per semplice moltiplicazione. È la stessa struttura matematica (proporzionalità diretta) in tutti i domini.",["Non è corretto. La norma ISO 216 riguarda i formati di carta. L'uso comune della scala è concettuale: è il modo universale di rappresentare la realtà in modo preciso su un supporto di dimensioni finite.","Esatto! Il principio del disegno tecnico è universale nelle sue applicazioni: dalla scala 10:1 per un chip di 2 mm alla scala 1:1.000.000 per una mappa geografica. La struttura matematica (proporzionalità diretta) è la stessa.","Non è corretto. I GIS usano anche geometria proiettiva e coordinate geodetiche. La ragione comune è il principio della scala come strumento di rappresentazione proporzionale.","Non è corretto. Le normative sull'accessibilità non sono la ragione dell'uso comune della scala. La ragione è matematica: la proporzionalità diretta come strumento universale di rappresentazione."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è

(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>

<script>
// Modalità LIM · percorso a passi. In LIM ogni scheda livello diventa una sequenza di schermate:
// consegna + prima attività → attività successive → Rifletti → Verifica (una domanda per volta) → Compito.
// Si naviga con la barra in basso, con PagSu/PagGiù o con le frecce del telecomando/presenter.
// Fuori dalla modalità LIM la pagina resta identica (tutte le regole valgono solo sotto html.lim).
(function () {
  const root = document.documentElement;
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const bar = mk("nav", "lim-steps"); bar.setAttribute("aria-label", "Passi del laboratorio");
  const prev = mk("button", null, "◀ Indietro"); prev.type = "button";
  const dots = mk("div", "lim-dots");
  const next = mk("button", "lim-next", "Avanti ▶"); next.type = "button";
  bar.append(prev, dots, next);
  let steps = [], cur = 0, panel = null;
  const all = () => steps.flatMap((s) => s.els);

  function label(el) {
    if (el.classList.contains("meta")) return "Rifletti";
    if (el.classList.contains("verif")) return "Verifica";
    if (el.classList.contains("bridge")) return "Compito";
    const h = el.querySelector(".blk-h, h3, h2"); if (h) return h.textContent.trim();
    return el.classList.contains("brief") ? "Consegna" : "Attività";
  }
  function build() {
    all().forEach((e) => e.classList.remove("lim-off"));
    panel = document.querySelector(".wrap > .panel:not([hidden])"); steps = [];
    if (!panel) { bar.hidden = true; return; }
    const kids = [...panel.children];
    for (let i = 0; i < kids.length; i++) {
      const e = kids[i];
      // la consegna sta sopra la prima attività, nella stessa schermata
      if (e.classList.contains("brief") && kids[i + 1]) { steps.push({ els: [e, kids[i + 1]], t: label(kids[i + 1]) }); i++; continue; }
      steps.push({ els: [e], t: label(e) });
    }
    const br = document.querySelector(".wrap > .bridge"); if (br) steps.push({ els: [br], t: "Compito" });
    dots.innerHTML = "";
    steps.forEach((s, i) => {
      const t = s.t.length > 22 ? s.t.slice(0, 20).trim() + "…" : s.t;
      const b = mk("button", null, `<span class="n">${i + 1}</span><span class="t">${t.replace(/[&<>]/g, "")}</span>`);
      b.type = "button"; b.title = s.t; b.onclick = () => go(i); dots.appendChild(b);
    });
    bar.hidden = steps.length < 2;
    if (steps.length < 2) { clear(); return; }
    cur = Math.min(cur, steps.length - 1); go(cur, true);
  }
  function go(i, quiet) {
    if (!steps.length) return;
    cur = Math.max(0, Math.min(steps.length - 1, i));
    all().forEach((e) => e.classList.add("lim-off"));
    steps[cur].els.forEach((e) => e.classList.remove("lim-off"));
    [...dots.children].forEach((b, j) => { if (j === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
    dots.children[cur]?.scrollIntoView({ inline: "center", block: "nearest" });
    prev.disabled = cur === 0; next.disabled = cur === steps.length - 1;
    if (!quiet) window.scrollTo({ top: 0 });
    window.dispatchEvent(new Event("resize")); // grafici e 3D si ridisegnano quando diventano visibili
  }
  function clear() { all().forEach((e) => e.classList.remove("lim-off")); }
  prev.onclick = () => go(cur - 1); next.onclick = () => go(cur + 1);

  // Verifica: una domanda per volta, con «Domanda n di N»
  function pager(v) {
    if (v.dataset.limq) return; v.dataset.limq = "1";
    const body = v.querySelector(".verif-body"); if (!body) return;
    const nav = mk("div", "lim-qnav"); const pb = mk("button", null, "◀"); const txt = mk("span"); const nb = mk("button", null, "Domanda successiva ▶");
    pb.type = nb.type = "button"; nav.append(pb, txt, nb); body.after(nav);
    let q = 0;
    const show = () => { const qs = [...body.querySelectorAll(".vq")]; if (!qs.length) return; q = Math.max(0, Math.min(qs.length - 1, q));
      qs.forEach((x, j) => x.classList.toggle("lim-cur", j === q)); txt.textContent = `Domanda ${q + 1} di ${qs.length}`; pb.disabled = q === 0; nb.disabled = q === qs.length - 1; };
    pb.onclick = () => { q--; show(); }; nb.onclick = () => { q++; show(); };
    new MutationObserver(() => { if (!body.querySelector(".vq.lim-cur")) { q = 0; show(); } }).observe(body, { childList: true });
    show();
  }

  function sync() {
    const on = root.classList.contains("lim");
    if (on) { build(); } else clear();
  }
  function mount() {
    document.body.appendChild(bar);
    document.querySelectorAll(".verif").forEach(pager);
    // cambio di livello: ricostruisci i passi quando cambia la scheda visibile (in qualunque modo avvenga)
    let tmr = 0;
    const onPanel = () => { clearTimeout(tmr); tmr = setTimeout(() => { const p = document.querySelector(".wrap > .panel:not([hidden])"); if (p !== panel) cur = 0; if (root.classList.contains("lim")) build(); }, 0); };
    document.querySelectorAll(".wrap > .panel").forEach((p) => new MutationObserver(onPanel).observe(p, { attributes: true, attributeFilter: ["hidden"] }));
    document.addEventListener("keydown", (e) => {
      if (!root.classList.contains("lim")) return;
      const tag = (e.target.tagName || "").toLowerCase(); if (tag === "textarea" || tag === "input" || tag === "select") return;
      if (e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
      if (e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
    });
    new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["class"] });
    sync();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
