<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Il viaggio del cibo</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});

      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });

  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},

    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-ALI-2-04","F":[["Cos'è la filiera alimentare?",["La lista degli ingredienti stampata sull'etichetta di un prodotto alimentare","La sequenza di tutte le fasi e attori che un alimento attraversa dal campo al consumatore","Il sistema di controllo sanitario degli alimenti nelle industrie di trasformazione","La rete di supermercati e negozi che distribuiscono i prodotti alimentari"],1,"La filiera alimentare è la sequenza di tutte le fasi e di tutti gli attori che un alimento attraversa dalla produzione al consumo. La parola 'filiera' viene da 'filo': un filo che tiene insieme tutti i nodi della catena.",["Non è corretto. La lista degli ingredienti è parte dell'etichetta. La filiera è un concetto molto più ampio che descrive l'intero percorso del cibo.","Esatto! La filiera alimentare è come un 'filo' che tiene insieme tutti i nodi della catena: dal campo alla tua forchetta, con tutti gli attori intermedi.","Non è corretto. Il controllo sanitario è solo una parte del processo. La filiera include tutti gli attori e tutte le fasi, dal campo alla tavola.","Non è corretto. I supermercati sono solo l'ultimo anello prima del consumatore. La filiera include anche produttori, trasformatori e distributori."]],["Quale percentuale del prezzo finale riceve generalmente l'agricoltore che ha coltivato una banana?",["Circa il 50%","Circa il 30%","Meno del 10%","Circa il 20%"],2,"L'agricoltore riceve spesso meno del 10% del prezzo finale che il consumatore paga al supermercato. Nel caso della banana ecuadoregna: circa 6-8 centesimi su 1,20 euro al chilo. Il resto è diviso tra spedizione, porto, importatore, maturazione, distribuzione e supermercato.",["Non è corretto. La quota dell'agricoltore è molto più bassa. Il valore si distribuisce tra molti intermediari lungo la filiera globale.","Non è corretto. La quota dell'agricoltore è ancora più bassa di questa.","Esatto! L'agricoltore riceve spesso meno del 10% del prezzo finale. Nel caso della banana ecuadoregna descritta nel testo, circa 6-8 centesimi su 1,20 euro al chilo.","Non è corretto. La quota dell'agricoltore è ancora più bassa del 20%. Il resto va a spedizione, porto, importatore, distribuzione, supermercato."]],["Cosa fa il 'trasformatore' nella filiera alimentare?",["Trasporta i prodotti dal campo ai punti di vendita con camion refrigerati","Converte la materia prima in prodotto finito attraverso processi industriali (molitura, pastorizzazione, conservazione)","Vende direttamente al consumatore finale nei mercati rionali","Certifica la qualità e la sicurezza dei prodotti per conto dello Stato"],1,"Il trasformatore (mulini, pastifici, caseifici, conservifici) converte la materia prima in prodotto finito, aggiungendo tre funzioni: conservazione, valore aggiunto e standardizzazione. Il grano diventa farina, poi pasta; il latte diventa yogurt, formaggio, burro.",["Non è corretto. Il trasporto è la funzione del distributore. Il trasformatore si occupa di trasformare la materia prima in prodotto finito.","Esatto! Il trasformatore (mulino, caseificio, conservificio, pastificio) converte la materia prima in prodotto pronto al consumo o alla distribuzione, aggiungendo valore e durata.","Non è corretto. La vendita diretta al consumatore è la funzione del dettagliante. Il trasformatore opera nell'industria, non nella vendita al dettaglio.","Non è corretto. La certificazione è una funzione delle autorità pubbliche (EFSA, Ministero della Salute). Il trasformatore è un attore privato industriale."]],["Cosa sono i 'food miles'?",["Il numero di calorie per chilogrammo di un alimento","La distanza percorsa da un alimento dalla produzione al consumo, come misura dell'impatto ambientale del trasporto","Il numero di passaggi di mano tra produttore e consumatore in una filiera","La quantità di CO₂ prodotta durante la produzione agricola per tonnellata di raccolto"],1,"I food miles (miglia del cibo) indicano la distanza percorsa da un alimento dalla produzione al consumo. È una misura dell'impatto ambientale del trasporto. Fagiolini dal Kenya = oltre 6.000 km in aereo; mele del Trentino a Roma = 600 km su camion.",["Non è corretto. Le calorie riguardano il valore nutritivo. I food miles misurano qualcosa di completamente diverso, legato al trasporto.","Esatto! I food miles (miglia del cibo) indicano la distanza che un alimento percorre dal luogo di produzione al consumatore. È una misura dell'impatto ambientale del trasporto alimentare.","Non è corretto. Il numero di intermediari è un aspetto della filiera, ma non è la definizione di food miles.","Non è corretto. Le emissioni di CO₂ della produzione agricola sono un dato importante, ma non coincidono con i food miles, che riguardano solo il trasporto."]],["Cosa garantisce il commercio equo e solidale (fair trade) ai produttori primari?",["La vendita dei loro prodotti senza nessun intermediario commerciale","Un prezzo minimo garantito, un premio sociale e standard di lavoro dignitosi","L'accesso gratuito alle tecnologie agricole più avanzate","La vendita esclusiva nei paesi europei con tariffe doganali agevolate"],1,"Il fair trade garantisce ai produttori: un prezzo minimo garantito (anche se il mercato crolla), un premio sociale per la comunità (scuole, pozzi, infrastrutture), standard di lavoro dignitosi (no lavoro minorile) e pratiche agricole sostenibili.",["Non è corretto. Il fair trade non elimina gli intermediari: li responsabilizza con standard etici. La filiera rimane globale ma con obblighi verso il produttore.","Esatto! Il fair trade garantisce: un prezzo minimo garantito (indipendente dalle fluttuazioni di mercato), un premio sociale (per infrastrutture nella comunità) e standard di lavoro dignitosi.","Non è corretto. Il fair trade non include il trasferimento tecnologico. Si concentra su prezzo, condizioni di lavoro e reinvestimento nella comunità.","Non è corretto. Il fair trade opera in tutto il mondo e riguarda le condizioni commerciali tra produttori e acquirenti, non le tariffe doganali."]],["Cosa si intende con 'filiera corta'?",["Una filiera che usa cammini di trasporto brevi, inferiori ai 100 km","Una filiera con pochissimi intermediari tra produttore e consumatore, idealmente zero o uno","Una filiera che dura meno tempo, con tempi di trasporto ridotti grazie all'aereo","Una filiera che usa solo prodotti biologici certificati a km zero"],1,"La filiera corta minimizza il numero di intermediari tra produttore e consumatore (idealmente zero o uno). Modelli: vendita diretta in azienda, mercati contadini, GAS, CSA, km0. Il produttore ottiene un prezzo più equo e il consumatore prodotti più freschi.",["Non è corretto. La filiera corta non è definita dalla distanza geografica, ma dal numero di intermediari tra produttore e consumatore.","Esatto! La filiera corta riduce al minimo il numero di intermediari. Esempi: vendita diretta in azienda, mercati contadini, GAS (Gruppi di Acquisto Solidale), CSA.","Non è corretto. Il trasporto aereo è uno dei più inquinanti e non definisce la filiera corta. Il concetto riguarda il numero di intermediari.","Non è corretto. La filiera corta non implica necessariamente il biologico. E il km zero è un concetto specifico (meno di 70 km) non sinonimo di filiera corta."]]],"I":[["Se i fagiolini freschi venduti in inverno provengono dal Kenya (6.000 km) e le fragole fuori stagione vengono dal Marocco (2.000 km), quale ha il maggiore impatto ambientale per km percorso?",["Le fragole dal Marocco, perché percorrono comunque più di 2.000 km","I fagiolini dal Kenya, perché 6.000 km in aereo hanno emissioni molto maggiori per kg trasportato","Sono equivalenti perché entrambi sono prodotti fuori stagione importati","Non si può confrontare senza conoscere il peso esatto della merce trasportata"],1,"Non basta guardare la distanza: conta il mezzo di trasporto. Il trasporto aereo è il più inquinante per tonnellata-km. I fagiolini kenioti viaggiano 6.000 km in aereo: impatto molto maggiore delle fragole marocchine che arrivano via camion su 2.000 km.",["Non è corretto. Non è solo la distanza che conta, ma anche il mezzo di trasporto. Un container navale ha un impatto molto diverso dall'aereo.","Esatto! Il trasporto aereo è il più inquinante per kg-km trasportato. I fagiolini dal Kenya in aereo (6.000 km) hanno un impatto molto maggiore delle fragole marocchine via camion (2.000 km).","Non è corretto. Il mezzo di trasporto fa una differenza enorme: un aereo emette decine di volte più CO₂ per tonnellata-km rispetto a un camion, che già emette più di una nave.","Parzialmente vero per un calcolo preciso, ma la differenza qualitativa è chiara: l'aereo ha un impatto per tonnellata-km enormemente superiore al camion, rendendo i fagiolini kenioti il caso più critico."]],["Perché la Grande Distribuzione Organizzata (GDO) ha un enorme potere negoziale sui produttori?",["Perché controlla le certificazioni di qualità obbligatorie per legge","Perché garantisce enormi volumi di vendita, consentendole di imporre prezzi bassi ai produttori","Perché ha il monopolio del trasporto refrigerato in Italia","Perché ha brevettato i principali marchi di prodotti alimentari italiani"],1,"La GDO controlla la maggior parte delle vendite alimentari al dettaglio in Italia. I volumi garantiti (decine di milioni di pezzi) le danno un potere negoziale enorme: possono imporre prezzi molto bassi ai produttori, che accettano pur di avere accesso a tanta distribuzione.",["Non è corretto. Le certificazioni sono controllate da enti pubblici e privati indipendenti, non dalla GDO. Il potere della GDO deriva dai volumi di acquisto.","Esatto! La GDO (Esselunga, Conad, Coop, Carrefour) controlla la maggior parte delle vendite alimentari al dettaglio. Garantire volumi enormi le dà il potere di imporre prezzi bassi ai produttori.","Non è corretto. Il trasporto refrigerato è gestito da logisti indipendenti, non dalla GDO. Il suo potere deriva dai volumi di acquisto.","Non è corretto. I marchi appartengono ai produttori. La GDO vende sia marche di produttori che propri marchi privati (private label), ma la sua forza è nei volumi."]],["Cosa succede alle banane ecuadoregne dopo lo scarico al porto di Genova?",["Vengono vendute immediatamente nei mercati locali perché sono già mature","Passano per camere di maturazione dove etilene e temperatura controllati le portano alla maturazione ottimale","Vengono congelate per preservarle durante la distribuzione in tutta Italia","Vengono irradiate con raggi UV per sterilizzarle dalle eventuali malattie tropicali"],1,"Le banane arrivano verdi al porto di Genova. Poi vanno in camere di maturazione: ambienti con temperatura e concentrazione di etilene (il gas naturale della maturazione) controllati per portarle alla maturazione ottimale nel momento preciso in cui devono essere vendute.",["Non è corretto. Le banane arrivano ancora verdi. Devono subire un processo di maturazione controllata prima di essere vendute.","Esatto! Le banane arrivano verdi. Le camere di maturazione usano etilene (un gas naturale che accelera la maturazione) e temperatura controllata per portarle a maturazione ottimale al momento giusto.","Non è corretto. Le banane non si congelano per la distribuzione: si rovinerebbero. Vengono tenute a temperatura controllata (circa 13°C) per la distribuzione.","Non è corretto. Non è descritto nel testo nessun trattamento con UV alle banane in arrivo. Il processo è la maturazione controllata con etilene."]],["La pasta italiana può contenere grano duro importato dal Canada pur avendo un marchio italiano. È consentito?",["No, il marchio Made in Italy garantisce che tutti gli ingredienti siano italiani","Sì, è legale ma deve essere indicato in etichetta; la maggior parte dei consumatori non legge quella riga","Solo se il grano straniero supera il 50% del totale, altrimenti non serve indicarlo","No, è vietato mescolarlo con grano italiano perché altera le caratteristiche nutrizionali"],1,"L'Italia non produce abbastanza grano duro per tutta la pasta e importa circa 2 milioni di tonnellate l'anno (da Canada, USA, Francia, Kazakistan). Usarlo nella pasta italiana è legale, deve essere indicato in etichetta, ma la maggior parte dei consumatori non legge quella riga.",["Non è corretto. Il Made in Italy indica dove avviene la lavorazione principale, non la provenienza di tutti gli ingredienti. L'Italia importa circa 2 milioni di tonnellate di grano duro all'anno.","Esatto! È perfettamente legale usare grano straniero nella pasta italiana. Deve essere indicato in etichetta (paese d'origine del grano), ma la maggior parte dei consumatori non legge quella informazione.","Non è corretto. L'obbligo di indicare il paese d'origine del grano in etichetta si applica indipendentemente dalla percentuale. Non esiste questa soglia del 50%.","Non è corretto. Non esiste nessun divieto di miscelazione. La questione è di trasparenza verso il consumatore, non di caratteristiche nutrizionali."]],["Cosa calcola la formula: food miles = distanza (km) × peso (kg)?",["Il costo di trasporto in euro per unità di prodotto","La misura dell'impatto ambientale relativo del trasporto di un alimento","La quantità di CO₂ effettivamente emessa durante il trasporto","Il prezzo al consumatore in funzione della distanza percorsa"],1,"I food miles (t·km) misurano l'impatto ambientale relativo del trasporto: peso × distanza. Ma non dicono tutto: il mezzo di trasporto cambia enormemente l'impatto reale. Un aereo emette molto più CO₂ per t·km di un camion, che emette più di una nave.",["Non è corretto. I food miles non misurano il costo economico ma l'impatto ambientale relativo del trasporto, in tonnellate-km.","Esatto! I food miles (distanza × peso) misurano l'impatto relativo del trasporto. 0,2 kg di fagiolini per 6.000 km = 1,2 t·km. Ma il mezzo conta: l'aereo è molto più inquinante del camion.","Non è corretto. I food miles sono una misura relativa (tonnellate-km), non la quantità precisa di CO₂ emessa. Per quella servirebbero i dati specifici del mezzo di trasporto.","Non è corretto. I food miles non correlano direttamente col prezzo al consumatore. Un prodotto proveniente da lontano può essere venduto a meno di uno locale, grazie a economie di scala."]],["Perché la prima Compagnia delle Indie Orientali (olandese, 1602) è descritta come una 'filiera alimentare'?",["Perché vendeva spezie, cioè alimenti, e controllava tutti i passaggi dalla produzione al mercato europeo","Perché finanziava le aziende agricole europee che producevano grano e vino","Perché era la prima azienda a usare il sistema di conservazione in barattolo per i lunghi viaggi marini","Perché era finanziata da governi che controllavano la produzione di cibo per i loro eserciti"],0,"La Compagnia delle Indie Orientali (1602) controllava l'intera filiera delle spezie: dalle piantagioni asiatiche ai mercati europei. Era di fatto una gestione commerciale di una filiera alimentare globale. Chi controlla la filiera ha sempre controllato potere e ricchezza.",["Esatto! La Compagnia delle Indie Orientali controllava l'intera filiera delle spezie: dalle piantagioni asiatiche ai mercati europei. Chi controlla la filiera controlla il valore.","Non è corretto. La Compagnia controllava le rotte commerciali delle spezie asiatiche verso l'Europa, non la produzione agricola europea.","Non è corretto. L'inscatolamento fu inventato nel 1810, molto dopo la Compagnia delle Indie. Il suo modello era commerciale-finanziario, non tecnologico.","Non è corretto. La Compagnia era una società privata (una delle prime al mondo) che gestiva il commercio delle spezie per profitto."]]],"A":[["Un consumatore sceglie prodotti fair trade pur avendo prodotti locali disponibili. Quali valori entrano in conflitto in questa scelta?",["Il risparmio economico contro la qualità nutrizionale del prodotto","La solidarietà con produttori vulnerabili del Sud del mondo (fair trade) contro la riduzione dei food miles (km0)","La qualità garantita del fair trade contro la convenienza economica del prodotto locale","L'interesse del consumatore contro l'interesse del produttore locale"],1,"Fair trade (equità per produttori del Sud del mondo) e km0 (riduzione dei food miles) sono due valori in tensione: scegliere il primo implica accettare filiere lunghe e food miles alti. Scegliere il secondo significa privilegiare l'economia locale e l'ambiente, non necessariamente l'equità globale.",["Non è corretto. Il conflitto non è economico-nutrizionale. Riguarda due approcci etici diversi alla sostenibilità del sistema alimentare.","Esatto! Il fair trade garantisce prezzi giusti ai produttori del Sud del mondo ma implica lunghi trasporti. Il km0 riduce i food miles ma non garantisce equità ai produttori lontani. Sono valori in tensione.","Non è corretto. Il fair trade non garantisce necessariamente qualità superiore. La tensione reale è tra equità verso produttori distanti e riduzione dell'impatto ambientale del trasporto.","Non è corretto. Il conflitto non è tra interessi del consumatore e del produttore locale, ma tra due valori etici: equità globale e sostenibilità ambientale locale."]],["L'Italia esporta 50 miliardi di euro di prodotti agroalimentari ma importa grano duro per la sua pasta. Cosa rivela questa apparente contraddizione?",["Che l'agroalimentare italiano è in crisi e non riesce a produrre abbastanza per il mercato interno","Che l'Italia eccelle nella trasformazione e nella qualità (vino, formaggi, salumi) ma ha limiti nella produzione di materie prime come il grano","Che i produttori italiani di grano sono inefficienti e preferiscono coltivare altre colture più redditizie","Che il Made in Italy è un'etichetta ingannevole che non corrisponde alla realtà produttiva"],1,"L'Italia eccelle nella trasformazione e nella qualità: è prima nell'export di pasta, seconda nel vino, produce formaggi e salumi di fama mondiale. Ma non ha abbastanza terra coltivabile per tutto il grano duro necessario. Importa grano (Canada, USA, Francia, Kazakistan) e lo trasforma in prodotti di alta qualità.",["Non è corretto. L'export di 50 miliardi di euro indica tutt'altro che una crisi. L'Italia è eccellente in prodotti trasformati di qualità, ma non ha abbastanza terreno per tutto il grano necessario.","Esatto! L'Italia ha un agroalimentare di qualità eccezionale (pasta, vino, olio, formaggi, salumi) ma non ha superficie agricola sufficiente per produrre tutto il grano duro necessario alla sua industria pastaia di scala mondiale.","Non è corretto. Il problema non è l'efficienza ma la disponibilità di superficie agricola. L'Italia ha già tutta la sua superficie coltivabile impiegata.","Non è corretto. Il Made in Italy indica il luogo di trasformazione principale, non la provenienza di tutti gli ingredienti. Non è ingannevole ma è una distinzione importante da conoscere."]],["Sei il responsabile acquisti di una mensa scolastica con budget fisso. Come usi le conoscenze sulla filiera per fare scelte migliori?",["Scegli sempre i prodotti con il prezzo più basso, perché minori costi nella filiera indicano maggiore efficienza","Cerchi fornitori locali o a filiera corta per frutta e verdura, accettando stagionalità e diversità limitata","Preferisci sempre prodotti con certificazione biologica indipendentemente dal paese di origine","Scegli esclusivamente prodotti fair trade per garantire equità a tutta la filiera globale"],1,"Usare le conoscenze sulla filiera per una mensa scolastica significa: scegliere filiera corta per frutta e verdura fresche (più fresco, meno trasporto, produttori locali), fair trade per prodotti tropicali (caffè, cacao), e leggere le etichette per capire la reale provenienza degli ingredienti.",["Non è corretto. Il prezzo più basso spesso indica che qualcuno nella filiera (il produttore primario) riceve compensi ingiusti, non che la filiera sia più efficiente.","Esatto! La filiera corta per frutta e verdura fresca permette di avere prodotti più freschi, supportare l'economia locale, ridurre i food miles. Il compromesso è accettare la stagionalità e la minore varietà.","Non è corretto. Il biologico e la filiera corta sono valori diversi. Un biologico proveniente dall'altra parte del mondo ha un impatto ambientale del trasporto che può annullare i benefici del metodo di produzione.","Non è corretto. Il fair trade è un valore importante per prodotti tropicali (caffè, cacao, banane), ma non è applicabile a tutti i prodotti. E una mensa scolastica deve bilanciare diversi valori con un budget fisso."]],["La catena del freddo si spezza durante il trasporto di uno yogurt da Milano a Roma a causa di un guasto al frigorifero del camion. Cosa succede biologicamente al prodotto?",["Il prodotto diventa immediatamente pericoloso e non si può più consumare","I microrganismi precedentemente rallentati si risvegliano e si moltiplicano; riportare il prodotto a temperatura non li elimina","Il prodotto si scongela e le sue proteine si denaturano irreversibilmente","Nulla di significativo se la temperatura non supera i 20°C"],1,"Il freddo non uccide i microrganismi: li sospende. Quando la temperatura risale, i batteri si risvegliano e si moltiplicano rapidamente. Riportare il prodotto in frigo non elimina quelli già moltiplicati. Questo è il motivo per cui la continuità della catena del freddo è critica.",["Parzialmente corretto, ma impreciso. Dipende da quanto tempo la temperatura è rimasta elevata. Il testo indica che i microrganismi si 'risvegliano' e iniziano a moltiplicarsi, ma la pericolosità dipende dalla durata dell'interruzione.","Esatto! I microrganismi non sono stati uccisi dal freddo, solo rallentati. Quando la temperatura sale, si risvegliano e si moltiplicano. Riportare il prodotto a 4°C non elimina quelli già moltiplicati.","Non è corretto. Uno yogurt non è surgelato: è refrigerato. Non si 'scongela'. Il problema è microbiologico, non di denaturazione proteica.","Non è corretto. I batteri si moltiplicano rapidamente anche a 10-15°C. Per prodotti come yogurt, anche poche ore fuori dalla catena del freddo possono compromettere la qualità microbiologica."]],["Il testo descrive il consumatore come 'l'unico anello che non negozia' nella filiera. Eppure afferma che il consumatore può influenzare l'intera catena. Come?",["Organizzando proteste pubbliche contro le politiche dei supermercati","Attraverso le scelte di acquisto aggregate: se molti consumatori scelgono prodotti locali o biologici, la filiera si adatta","Acquistando azioni delle aziende alimentari e votando nelle assemblee degli azionisti","Leggendo attentamente le etichette ma senza che questo cambi il comportamento della filiera"],1,"Il consumatore è l'unico attore che non negozia il prezzo, ma le sue scelte aggregate mandano segnali chiari a tutta la filiera: se molti comprano locale, la filiera si accorcia; se scelgono biologico, gli agricoltori hanno incentivo a ridurre i pesticidi; se ignorano le etichette, la pressione sui prezzi va sui produttori primari.",["Non è corretto. Il testo non indica le proteste come strumento di influenza del consumatore sulla filiera. Il meccanismo è diverso e più quotidiano.","Esatto! Il consumatore non negozia il prezzo, ma le sue scelte aggregate mandano segnali a tutta la filiera. Se i consumatori comprano biologico, gli agricoltori sono incentivati a ridurre i pesticidi.","Non è corretto. Anche questo è un meccanismo di influenza, ma il testo descrive qualcosa di più accessibile: le scelte quotidiane di acquisto aggregate.","Non è corretto. Leggere le etichette è il primo passo, ma il testo indica che le scelte aggregate dei consumatori influenzano concretamente la filiera."]],["Un Supply Chain Manager agroalimentare deve ridurre del 20% le emissioni del trasporto mantenendo la freschezza dei prodotti. Quale strategia è più efficace?",["Aumentare la frequenza delle consegne con veicoli più piccoli per ridurre il tempo di trasporto","Ottimizzare i percorsi di consegna con algoritmi, aggregare i carichi e privilegiare fornitori locali dove possibile","Eliminare la catena del freddo per ridurre il consumo di energia dei refrigerati","Sostituire tutti i prodotti freschi con equivalenti conservati che non richiedono refrigerazione"],1,"Il Supply Chain Manager agroalimentare usa algoritmi per ottimizzare i percorsi, aggrega i carichi per usare meno veicoli, e diversifica i fornitori privilegiando quelli locali dove possibile. Sistemi di tracciabilità digitale (blockchain, sensori GPS-temperatura) permettono di monitorare e migliorare ogni fase.",["Non è corretto. Aumentare la frequenza con veicoli più piccoli aumenta generalmente le emissioni totali, non le riduce. L'ottimizzazione dei percorsi è più efficace.","Esatto! Il Supply Chain Manager usa algoritmi per ottimizzare i percorsi (meno km a parità di consegne), aggrega i carichi (meno veicoli a pieno carico) e riduce le distanze con fornitori più vicini.","Non è corretto. Eliminare la catena del freddo comprometterebbe la sicurezza alimentare dei prodotti. Non è un'opzione percorribile.","Non è corretto. Questa soluzione cambierebbe completamente la natura dei prodotti venduti e non risponde alla sfida di mantenere la freschezza."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
</body>
</html>
