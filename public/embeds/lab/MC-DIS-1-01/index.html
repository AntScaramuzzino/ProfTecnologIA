<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Riga e compasso</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-DIS-1-01","F":[["Cosa rappresenta la 'linea continua grossa' (spessore 0,5-0,7 mm) in un disegno tecnico?",["I contorni visibili dell'oggetto — i bordi che si vedono guardando l'oggetto dalla direzione del disegno","I contorni nascosti dell'oggetto — i bordi che esistono ma non si vedono dalla direzione del disegno","Gli assi di simmetria dell'oggetto","Le linee di quota che indicano le misure dell'oggetto"],0,"Nel disegno tecnico ogni tipo di linea ha un significato preciso (norma UNI). La linea continua grossa (0,5-0,7 mm) indica i contorni visibili — i bordi che si vedono guardando l'oggetto dalla direzione del disegno. Usarla in modo sbagliato trasmette informazioni errate.",["Esatto! La linea continua grossa è la linea principale del disegno tecnico: rappresenta tutto ciò che è visibile dall'angolo di osservazione della vista.","Non è corretto. I contorni nascosti si rappresentano con la linea tratteggiata. La linea continua grossa indica i contorni visibili.","Non è corretto. Gli assi di simmetria si rappresentano con la linea mista (tratto-punto). La linea continua grossa indica i contorni visibili.","Non è corretto. Le linee di quota si rappresentano con la linea continua fine. La linea continua grossa indica i contorni visibili dell'oggetto."]],["Cosa è la 'matita HB' e quando si usa nel disegno tecnico?",["Una matita durissima (High Black) per tracciare linee molto sottili nelle costruzioni geometriche","La matita standard con equilibrio tra durezza e morbidezza, usata per le linee definitive nel disegno tecnico","Una matita per schizzi a mano libera, troppo morbida per il disegno tecnico preciso","Una matita speciale solo per disegnare testi e cartigli nel disegno tecnico"],1,"La durezza della matita è indicata da H (Hard = duro, tratto sottile e chiaro) e B (Black = morbido, tratto spesso e scuro). HB è l'equilibrio: né troppo dura né troppo morbida. Per il disegno tecnico si usa H o 2H per le linee di costruzione leggere (da cancellare) e HB per le linee definitive.",["Non è corretto. HB non significa High Black. HB è l'equilibrio tra durezza (H) e morbidezza (B). Le matite più dure per costruzioni geometriche sono H o 2H.","Esatto! HB è l'equilibrio tra H (Hard, duro) e B (Black, morbido). È la matita da scuola standard, adatta per le linee definitive. Per linee di costruzione leggere si usa H o 2H.","Non è corretto. HB va bene per il disegno tecnico (linee definitive). Le matite molto morbide (2B, 4B) sono per schizzi. HB è il giusto compromesso per iniziare.","Non è corretto. HB non è riservata ai testi. Si usa per le linee definitive di tutto il disegno tecnico."]],["Come si costruisce la bisettrice di un angolo con riga e compasso?",["Si misura l'angolo con il rapportatore e si traccia una retta a metà del valore misurato","Si traccia un arco dal vertice, poi due archi uguali dai punti trovati: il loro incrocio dà la bisettrice","Si uniscono con una riga i punti medi dei due lati dell'angolo","Si tracciano due rette parallele ai lati dell'angolo che si incontrano nel punto della bisettrice"],1,"La costruzione della bisettrice: (1) Dal vertice O, con apertura qualsiasi, tracciare un arco che interseca i lati dell'angolo nei punti A e B. (2) Da A e B, con la stessa apertura > AB/2, tracciare archi che si intersecano nel punto C. (3) La retta OC è la bisettrice. Perché funziona: i triangoli OAC e OBC sono congruenti (LLL), quindi gli angoli AOC e BOC sono uguali.",["Non è corretto. La bisettrice con riga e compasso non usa il rapportatore. Il metodo classico euclideo usa solo il compasso per trovare un punto equidistante dai lati dell'angolo.","Esatto! La costruzione euclidea della bisettrice: (1) arco dal vertice → punti A e B sui lati; (2) archi da A e B con stessa apertura → punto C; (3) la retta dal vertice a C è la bisettrice.","Non è corretto. Unire i punti medi dei lati non produce la bisettrice dell'angolo. La bisettrice è la retta che divide l'angolo in due parti uguali.","Non è corretto. Rette parallele ai lati non producono la bisettrice. La costruzione usa archi di cerchio con il compasso."]],["A cosa serve la 'linea mista' (tratto-punto) nel disegno tecnico?",["A indicare le quote (misure) dell'oggetto","A rappresentare gli assi di simmetria e i piani di sezione dell'oggetto","A indicare le parti dell'oggetto che devono essere verniciare con colori diversi","A rappresentare le linee di costruzione geometrica ausiliaria che rimangono nel disegno"],1,"La linea mista (linea-punto: — · — · —) ha due usi principali: (1) asse di simmetria — ogni oggetto simmetrico ha questa linea che passa per il centro; (2) piano di sezione — indica dove l'oggetto viene 'tagliato' per mostrare l'interno, con frecce che indicano la direzione di vista.",["Non è corretto. Le quote si indicano con la linea continua fine. La linea mista indica assi di simmetria e piani di sezione.","Esatto! La linea mista (tratto-punto) indica: (1) gli assi di simmetria degli oggetti simmetrici; (2) i piani di sezione (con frecce che indicano la direzione di vista). Formato: — · — · —","Non è corretto. I colori delle finiture non si indicano con tipi di linea, ma con note testuali o simboli specifici. La linea mista indica assi di simmetria e piani di sezione.","Non è corretto. Le linee di costruzione ausiliarie che rimangono nel disegno si usano con la linea continua fine. La linea mista è per assi e piani di sezione."]],["Perché nel disegno dell'esagono regolare inscritto in una circonferenza, si usa un'apertura del compasso pari al raggio della circonferenza?",["Perché è la misura standard per qualsiasi poligono regolare inscritto","Perché nell'esagono regolare inscritto il lato è uguale al raggio della circonferenza","Perché è la misura dell'apertura standard del compasso scolastico e non ha un motivo geometrico preciso","Perché il diametro della circonferenza è troppo grande per le aperture tipiche del compasso scolastico"],1,"Il teorema fondamentale degli esagoni regolari: il lato di un esagono regolare inscritto in una circonferenza è uguale al raggio. Ogni 'passo' del compasso (con apertura = raggio) divide la circonferenza in 1/6. I 6 triangoli formati dai raggi e dai lati dell'esagono sono equilateri — tre lati uguali al raggio.",["Non è corretto. Il raggio è specifico per l'esagono regolare, non per qualsiasi poligono. Il quadrato inscritto, per esempio, si costruisce con il diametro come diagonale.","Esatto! Questo è il teorema fondamentale: il lato dell'esagono regolare inscritto = raggio della circonferenza. I 6 triangoli isosceli formati dai raggi e dai lati sono equilateri (tre lati uguali).","Non è corretto. C'è un motivo geometrico preciso e dimostrabile: il lato dell'esagono regolare inscritto è uguale al raggio. Non è una convenzione arbitraria.","Non è corretto. La ragione è geometrica: il lato dell'esagono regolare inscritto è uguale al raggio, non al diametro. Questa è una proprietà matematica dell'esagono regolare."]],["Qual è il ruolo del rapportatore nel disegno tecnico?",["Tracciare linee parallele con precisione assoluta","Misurare e tracciare angoli con precisione, da 0° a 180°","Dividere un segmento in parti uguali","Tracciare cerchi e archi di diverse dimensioni"],1,"Il rapportatore è un semicerchio graduato da 0° a 180°. Per misurare un angolo: posiziona il centro sul vertice, allinea il lato di riferimento allo 0°, leggi il valore dove passa il secondo lato. Attenzione alle due scale (0-180 e 180-0): usa sempre quella che parte da 0° sul lato di riferimento.",["Non è corretto. Le linee parallele si tracciano con le due squadre in coppia. Il rapportatore serve per misurare e tracciare angoli.","Esatto! Il rapportatore è un semicerchio graduato da 0° a 180°. Serve per misurare angoli esistenti e per tracciare angoli specifici che le squadre non permettono di costruire.","Non è corretto. La divisione di un segmento in parti uguali si fa con il metodo delle parallele (righello + compasso). Il rapportatore serve per gli angoli.","Non è corretto. Cerchi e archi si tracciano con il compasso. Il rapportatore è specificatamente per la misura e la tracciatura degli angoli."]]],"I":[["La costruzione della perpendicolare da un punto P a una retta r usa il compasso per trovare due punti equidistanti. Quale teorema geometrico garantisce che la retta PQ sia perpendicolare a r?",["Il teorema di Talete sulle rette parallele tagliate da una trasversale","La congruenza dei triangoli: due triangoli con i tre lati uguali hanno angoli uguali","Il teorema di Pitagora: la somma dei quadrati dei cateti è uguale al quadrato dell'ipotenusa","Il teorema di Euclide sul triangolo equilatero"],1,"La costruzione della perpendicolare da P a r funziona perché i due triangoli creati (PAQ e PBQ) hanno tutti e tre i lati uguali (PA = PB per costruzione con arco da P; QA = QB per costruzione con stessa apertura da A e da B; PQ in comune). Per il caso LLL (tre lati eguali) i triangoli sono congruenti, quindi l'angolo APQ = angolo BPQ = 90°.",["Non è corretto. Il teorema di Talete riguarda le proporzioni tra segmenti su rette parallele. La perpendicolare usa la congruenza dei triangoli.","Esatto! Quando PA = PB (stesso arco dal punto P) e QA = QB (stessa apertura del compasso da A e da B), per il caso LLL i triangoli PAQ e PBQ sono congruenti, quindi l'angolo è 90°.","Non è corretto. Il teorema di Pitagora descrive una proprietà del triangolo rettangolo, ma non è il principio usato per costruire la perpendicolare geometricamente.","Non è corretto. La costruzione della perpendicolare non produce necessariamente un triangolo equilatero. Il principio è la congruenza dei triangoli (LLL)."]],["Perché il metodo delle parallele divide un segmento in parti uguali anche quando le misure non vengono 'tonde'?",["Perché si usa un righello speciale con scale frazionarie che permettono qualsiasi divisione","Perché si basa sul teorema di Talete: rette parallele tagliano segmenti proporzionali","Perché si usano squadre speciali graduate in frazioni che permettono di dividere senza calcoli","Perché il metodo è approssimato: non divide esattamente ma dà un'approssimazione accettabile"],1,"Il metodo delle parallele si basa sul teorema di Talete: quando rette parallele vengono tagliate da due trasversali, i segmenti corrispondenti sono proporzionali. Se sulla semiretta ausiliaria i n punti sono equidistanti (stessa apertura del compasso), le rette parallele tracciate dai punti dividono il segmento AB in n parti uguali. Funziona per qualsiasi n, anche quando 100 ÷ n non dà un numero intero.",["Non è corretto. Il metodo delle parallele non richiede un righello speciale. Funziona con qualsiasi righello e sfrutta la proporzionalità geometrica.","Esatto! Il testo lo spiega: 'È il teorema di Talete: se due rette trasversali tagliano un fascio di rette parallele, lo fanno in segmenti proporzionali.' I punti equidistanti sulla semiretta generano automaticamente punti equidistanti su AB.","Non è corretto. Il metodo delle parallele non richiede squadre speciali. Funziona con le normali squadre a 45° e 60° per tracciare le parallele.","Non è corretto. Il metodo delle parallele è matematicamente esatto (non approssimato) per qualsiasi numero di divisioni. Si basa sul teorema di Talete che garantisce la proporzionalità esatta."]],["Il disegno tecnico è definito un 'linguaggio universale'. Cosa rende possibile questa universalità?",["Il fatto che tutti i paesi del mondo usano gli stessi programmi CAD (AutoCAD, SolidWorks)","Norme internazionali (UNI/ISO) che fissano ovunque gli stessi tipi di linee, viste e scale","Il fatto che le forme geometriche (cerchi, quadrati, triangoli) sono comprensibili in qualsiasi cultura","Il fatto che tutti i tecnici del mondo parlano inglese come lingua comune"],1,"L'universalità del disegno tecnico si fonda sulla standardizzazione: le norme UNI (Italia), EN (Europa), ISO (internazionale) definiscono regole precise per ogni elemento grafico. Quando un ingegnere in Italia disegna un componente con linee tratteggiate per i bordi nascosti, un tecnico in Giappone legge lo stesso significato — senza parlare la stessa lingua verbale.",["Non è corretto. I programmi CAD sono strumenti, non il linguaggio. L'universalità deriva dalle norme di standardizzazione (UNI, ISO) che definiscono regole comuni indipendentemente dallo strumento usato.","Esatto! Il testo dice: 'un linguaggio grafico preciso, con regole uguali per tutti, capito allo stesso modo in Italia, in Giappone, in Brasile.' Le norme UNI (Ente Nazionale Italiano di Unificazione) adottano le norme europee EN e internazionali ISO.","Non è corretto. La comprensibilità delle forme geometriche non è sufficiente per trasmettere le informazioni precise di un progetto tecnico. L'universalità richiede convenzioni condivise su come interpretare ogni elemento grafico.","Non è corretto. Il disegno tecnico è un linguaggio grafico, non verbale. Non richiede una lingua comune: richiede convenzioni grafiche standardizzate."]],["Leonardo da Vinci ha introdotto un'innovazione fondamentale nel disegno tecnico del Rinascimento. Di cosa si trattava?",["Ha inventato il compasso con apertura regolabile","Le viste multiple: lo stesso oggetto di fronte, di lato, dall'alto e in sezione","Ha standardizzato le misure dei fogli da disegno nella serie A (A0, A1, A2, A3, A4)","Ha inventato il CAD (Computer-Aided Design) nella versione analogica manuale"],1,"Leonardo da Vinci (XV-XVI sec.) rivoluzionò il disegno tecnico introducendo le viste multiple: la stessa macchina disegnata di fronte, di lato, dall'alto, con il taglio interno in sezione. Prima si usava la prospettiva (come una fotografia). Con Leonardo l'oggetto viene 'spiegato' da angoli diversi, ciascuno con informazioni diverse. Questa intuizione è ancora la base del disegno meccanico industriale.",["Non è corretto. Il compasso con apertura regolabile era già noto nell'antichità. L'innovazione di Leonardo riguardava il modo di rappresentare gli oggetti, non gli strumenti.","Esatto! Prima di Leonardo, un disegno tecnico mostrava l'oggetto in prospettiva come una fotografia. Leonardo introdusse le viste multiple: ogni vista da una direzione diversa rivela informazioni diverse. Questa intuizione è ancora la base del disegno meccanico moderno.","Non è corretto. La standardizzazione dei formati di foglio in serie A è un prodotto del XX secolo (norma ISO 216). Leonardo viveva nel XV-XVI secolo.","Non è corretto. Il CAD è una tecnologia informatica del XX secolo. L'innovazione di Leonardo era di tipo concettuale: la rappresentazione a viste multiple."]],["Le due squadre (45° e 60°-30°) usate insieme permettono di tracciare rette parallele. Come funziona tecnicamente questo metodo?",["Si usano le due squadre come righelli affiancati, facendoli scorrere insieme lungo il foglio","Una squadra fa da guida ferma; l'altra scorre lungo il suo bordo e traccia linee parallele","Si misurano due punti equidistanti con il compasso e si uniscono con la riga","Si usano i due bordi verticali delle squadre che, per definizione geometrica, sono sempre paralleli tra loro"],1,"Il metodo delle squadre per le parallele: (1) appoggia una squadra al righello come guida fissa; (2) la seconda squadra scorre lungo il bordo della prima mantenendo lo stesso angolo; (3) ogni linea tracciata con la seconda squadra è parallela alla precedente. Funziona perché lo scorrimento preserva l'orientamento angolare della seconda squadra.",["Non è corretto. Il metodo corretto è: si appoggia una squadra all'altra (o al righello) e si fa scorrere la seconda lungo il bordo della prima, mantenendo l'angolo costante.","Esatto! Il testo spiega: 'Appoggia una squadra al righello. Fai scorrere la seconda squadra lungo il bordo della prima. La linea che tracci è sempre parallela alla precedente.'","Non è corretto. Misurare punti equidistanti con il compasso produce parallele solo in casi specifici. Il metodo delle squadre è più rapido e diretto.","Non è corretto. I bordi verticali delle squadre non sono necessariamente paralleli tra loro in posizione diversa sul foglio. Il metodo corretto usa una squadra come guida e la seconda che scorre lungo di essa."]],["Come si collega la costruzione del triangolo equilatero (dato il lato) con la costruzione dell'esagono regolare inscritto in una circonferenza?",["Non sono collegate: sono due costruzioni completamente separate che usano strumenti diversi","Sei triangoli equilateri, con angoli di 60°, riempiono i 360° attorno al centro: il lato vale il raggio","L'esagono si costruisce tracciando sei triangoli equilateri uno accanto all'altro e poi unendo i vertici","La connessione è puramente storica: Euclide usava il triangolo equilatero per derivare l'esagono nell'antichità"],1,"Il collegamento è diretto e pratico: nella costruzione del triangolo equilatero dato il lato AB, l'apertura del compasso = AB. Applicando la stessa costruzione 6 volte partendo da un punto A₁ sulla circonferenza (con apertura = raggio), si ottengono 6 punti equidistanti A₁...A₆ — i vertici dell'esagono. I 6 triangoli formati dai raggi e dai lati sono equilateri.",["Non è corretto. Il testo esplicitamente dice: 'Questa costruzione [del triangolo equilatero] è la base per dividere una circonferenza in 6 parti uguali e quindi per costruire l'esagono regolare inscritto.'","Esatto! Il lato del triangolo equilatero = raggio usato. Applicando la stessa costruzione 6 volte partendo da un punto della circonferenza, si ottengono 6 vertici equidistanti — l'esagono regolare.","Non è corretto. I sei triangoli equilateri formano l'esagono solo se condividono il vertice centrale (il centro della circonferenza). Il metodo del testo usa iterazione del compasso sulla circonferenza.","Non è corretto. La connessione è geometrica e pratica, non solo storica. Il testo lo spiega: la costruzione del triangolo equilatero è 'la base per dividere una circonferenza in 6 parti uguali.'"]]],"A":[["Nel collegamento STEM con l'informatica, il testo dice che ogni operazione del computer 'viene ridotta a sequenze di 0 e 1'. Come si collega questo con le costruzioni geometriche del disegno tecnico?",["Non c'è collegamento: il disegno tecnico usa la geometria e l'informatica usa i numeri binari — sono discipline separate","Chi conosce le costruzioni geometriche capisce che cosa fa il CAD, e non lo usa in modo passivo","I programmi CAD moderni non usano la geometria euclidea: usano algoritmi proprietari completamente diversi","Il collegamento è solo nella storia: entrambe le discipline sono state sviluppate nel XIX secolo"],1,"Il testo stabilisce che 'chi impara le costruzioni geometriche con gli strumenti fisici capisce cosa fa il computer'. I programmi CAD eseguono le stesse operazioni: tracciare una perpendicolare in AutoCAD usa gli stessi principi geometrici della costruzione con compasso. Conoscere la geometria euclidea rende migliori utenti del CAD — e potenziali progettisti di algoritmi geometrici.",["Non è corretto. Il testo stabilisce il collegamento: le costruzioni geometriche con riga e compasso implementano fisicamente teoremi matematici, che sono gli stessi principi alla base degli algoritmi informatici.","Esatto! Il testo dice: 'Chi impara le costruzioni geometriche con gli strumenti fisici capisce cosa fa il computer — non è solo un utilizzatore passivo di software.' I programmi CAD eseguono esattamente le stesse operazioni geometriche che fai con riga e compasso.","Non è corretto. I programmi CAD si basano sulla geometria computazionale, che formalizza matematicamente le stesse costruzioni euclidee. Tracciare una perpendicolare nel CAD usa gli stessi principi geometrici della costruzione con compasso.","Non è corretto. Il collegamento è concettuale e attuale, non solo storico. La geometria euclidea è alla base della geometria computazionale usata nei software CAD."]],["Il 'Right to Repair' citato nel collegamento con i dispositivi digitali è collegato a un principio del disegno tecnico. Qual è il collegamento?",["Non c'è collegamento: il Right to Repair riguarda la politica, non il disegno tecnico","Per riparare serve la documentazione tecnica, e il disegno tecnico è il modo in cui la si comunica","Il Right to Repair obbliga i produttori a disegnare i propri prodotti usando solo geometrie elementari facilmente riproducibili","Il disegno tecnico è diventato obsoleto con il Right to Repair: ora i manuali usano solo fotografie"],1,"Il testo nella sezione OSSERVA collega il Right to Repair con il disegno tecnico: per riparare un dispositivo si devono avere disegni tecnici dei componenti (esplosi, sezioni, specifiche dei pezzi di ricambio). Dal 2021 l'UE obbliga i produttori di certi elettrodomestici a garantire pezzi di ricambio per 10 anni — e con essi la documentazione tecnica (disegni) necessaria per la riparazione.",["Non è corretto. Il testo stabilisce il collegamento attraverso la documentazione tecnica: per riparare un dispositivo si devono avere i disegni tecnici dei componenti.","Esatto! Il testo della sezione OSSERVA nota che 'le aziende sono sempre più obbligate per legge a fornire pezzi di ricambio e istruzioni di riparazione.' Quelle istruzioni sono disegni tecnici che comunicano come smontare e rimontare i componenti.","Non è corretto. Il Right to Repair non impone requisiti di design geometrico. Riguarda l'accesso alla documentazione e ai pezzi di ricambio, non la semplicità del design.","Non è corretto. I disegni tecnici (esplosi, viste, sezioni) rimangono fondamentali per la documentazione di riparazione. Le fotografie non possono comunicare le dimensioni precise o i componenti nascosti."]],["Nel compito AGISCI, devi valutare se 10 computer donati sono 'ancora utilizzabili per le attività didattiche'. Quale criterio del disegno tecnico si applica alla raccolta delle specifiche hardware?",["Nessuno: la valutazione dei computer è un'attività informatica, non di disegno tecnico","Raccogliere con metodo le specifiche è come leggere un disegno tecnico: trovare e interpretare dati precisi","Il compito usa la scala di rappresentazione del disegno tecnico per ridurre le dimensioni fisiche dei computer e disegnarli su foglio A4","Si usa la costruzione geometrica della bisettrice per dividere equamente il budget per i computer tra le classi"],1,"La competenza trasversale è la raccolta sistematica e l'interpretazione di dati tecnici precisi. Leggere le specifiche hardware di un computer (processore, RAM, storage, OS) richiede le stesse competenze di lettura di un disegno tecnico: sapere dove trovare le informazioni, capire le unità di misura (GHz, GB, TB), interpretare i valori nel contesto. La rubrica valuta 'completezza e precisione del linguaggio' — lo stesso criterio del disegno tecnico.",["Non è corretto. Il compito AGISCI applica la competenza di 'raccolta dati sistematica' dal testo: leggere le specifiche hardware è come leggere le quote di un disegno tecnico — richiede precisione e metodo.","Esatto! La rubrica dice: 'Trova e registra: processore, RAM, storage, sistema operativo.' Questa raccolta sistematica di specifiche tecniche usa le stesse competenze del disegno tecnico: precisione, metodo, comprensione dei significati tecnici.","Non è corretto. Il compito AGISCI non richiede di disegnare i computer. Richiede di raccogliere e interpretare specifiche tecniche hardware.","Non è corretto. La bisettrice è una costruzione geometrica, non un metodo per dividere budget. Il compito AGISCI riguarda la valutazione tecnica dell'hardware."]],["La storia del disegno tecnico mostra che i Sumeri del 3000 a.C. e Leonardo da Vinci del 1500 d.C. usavano entrambi principi geometrici simili. Cosa dice questo sulla matematica come fondamento del disegno?",["Che i Sumeri avevano già i programmi CAD equivalenti ai moderni","Che i principi geometrici restano gli stessi: cambiano solo gli strumenti","Che il disegno tecnico è troppo antico per essere rilevante nell'era digitale","Che la creatività umana nel disegno è diminuita con l'introduzione del CAD"],1,"Il testo afferma: 'il principio del disegno tecnico — rappresentare la realtà in modo preciso, misurabile e non ambiguo — non è cambiato in 4.000 anni. È cambiato lo strumento: dallo stilo su argilla, alla matita su carta, al CAD, ai droni LiDAR.' La geometria euclidea di Euclide (IV sec. a.C.) è ancora alla base del CAD e del rendering 3D del XXI secolo.",["Non è corretto. I Sumeri usavano stilo e argilla, non computer. Il punto è la continuità dei principi geometrici fondamentali, non degli strumenti.","Esatto! Il testo dice: 'il principio del disegno tecnico — rappresentare la realtà in modo preciso, misurabile e non ambiguo — non è cambiato in 4.000 anni. È cambiato lo strumento.' La matematica è la continuità.","Non è corretto. Il testo mostra esattamente l'opposto: 'il principio non è cambiato in 4.000 anni.' L'era digitale ha cambiato gli strumenti, non i principi matematici sottostanti.","Non è corretto. Il testo non fa valutazioni sulla creatività. Afferma la continuità dei principi matematici del disegno tecnico attraverso strumenti diversi."]],["Il 'GIS' (Geographic Information System) è citato come evoluzione del disegno tecnico. Quale principio fondamentale del disegno tecnico tradizionale applica?",["Il principio della linea tratteggiata per indicare elementi nascosti sotto la superficie del terreno","La scala, la proiezione dal 3D al 2D e le coordinate precise di ogni punto","Il principio della linea continua grossa per i confini nazionali e della linea fine per i confini regionali","Il principio della costruzione geometrica euclidea con riga e compasso, applicato digitalmente"],1,"Il GIS applica i principi fondamentali del disegno tecnico a scala geografica: (1) scala di rappresentazione — il territorio reale ridotto a una mappa; (2) proiezione — dalla superficie sferica della Terra a un piano 2D; (3) quotatura — ogni punto ha coordinate precise (longitudine, latitudine, altitudine). Il GIS è, in sostanza, un disegno tecnico digitale e interattivo del territorio.",["Non è corretto. Il GIS non usa principalmente linee tratteggiate nel senso del disegno tecnico. Applica principi più profondi di rappresentazione spaziale e scala.","Esatto! Un GIS è un disegno tecnico digitale e interattivo del territorio: usa scale di rappresentazione, proiezioni cartografiche (la stessa logica delle proiezioni ortogonali), e ogni punto ha coordinate precise (equivalente alle quote).","Non è corretto. I GIS usano convenzioni proprie per i diversi tipi di confini. Il principio fondamentale applicato è la rappresentazione spaziale in scala con coordinate precise.","Non è corretto. Il GIS non usa costruzioni euclidee con riga e compasso. Applica principi di proiezione geografica e sistemi di coordinate, che sono evoluzione dei principi del disegno tecnico."]],["La costruzione geometrica della perpendicolare a una retta nel punto P dimostra che 'ogni volta che usi il compasso stai dimostrando qualcosa'. Cosa dimostra esattamente questa costruzione?",["Dimostra che il compasso funziona correttamente e mantiene l'apertura costante durante la rotazione","Dimostra con triangoli congruenti che i due angoli sono uguali, quindi di 90° ciascuno","Dimostra empiricamente che le rette perpendicolari esistono, senza bisogno di una prova formale","Dimostra che il teorema di Pitagora si applica a tutti i triangoli, non solo a quelli rettangoli"],1,"Il testo spiega: la costruzione della perpendicolare dimostra fisicamente il teorema della congruenza dei triangoli (caso LLL). I triangoli APC e BPC hanno: PA = PB (stesso raggio dal punto P), AC = BC (stesso raggio da A e da B), PC in comune. LLL → congruenza → angoli APC = BPC. Insieme formano 180°, quindi ciascuno è 90°. Ogni costruzione geometrica è una dimostrazione del teorema sottostante.",["Non è corretto. Questa è una verifica strumentale, non una dimostrazione geometrica. La costruzione dimostra un teorema sulla congruenza dei triangoli.","Esatto! Il testo spiega: 'I triangoli APC e BPC hanno tutti e tre i lati uguali (PA = PB = d; AC = BC per costruzione; PC in comune). Sono triangoli congruenti (caso LLL). Quindi gli angoli APC e BPC sono uguali. Siccome insieme formano 180°, ciascuno è 90°.'","Non è corretto. Il testo dice esplicitamente 'perché funziona?' e fornisce la dimostrazione geometrica formale basata sulla congruenza dei triangoli LLL.","Non è corretto. Il teorema di Pitagora si applica solo ai triangoli rettangoli (non a tutti i triangoli). La costruzione della perpendicolare dimostra la congruenza dei triangoli (LLL), non il Pitagora."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>

<script>
// Modalità LIM · percorso a passi. In LIM ogni scheda livello diventa una sequenza di schermate:
// consegna + prima attività → attività successive → Rifletti → Verifica (una domanda per volta) → Compito.
// Si naviga con la barra in basso, con PagSu/PagGiù o con le frecce del telecomando/presenter.
// Fuori dalla modalità LIM la pagina resta identica (tutte le regole valgono solo sotto html.lim).
(function () {
  const root = document.documentElement;
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const bar = mk("nav", "lim-steps"); bar.setAttribute("aria-label", "Passi del laboratorio");
  const prev = mk("button", null, "◀ Indietro"); prev.type = "button";
  const dots = mk("div", "lim-dots");
  const next = mk("button", "lim-next", "Avanti ▶"); next.type = "button";
  bar.append(prev, dots, next);
  let steps = [], cur = 0, panel = null;
  const all = () => steps.flatMap((s) => s.els);

  function label(el) {
    if (el.classList.contains("meta")) return "Rifletti";
    if (el.classList.contains("verif")) return "Verifica";
    if (el.classList.contains("bridge")) return "Compito";
    const h = el.querySelector(".blk-h, h3, h2"); if (h) return h.textContent.trim();
    return el.classList.contains("brief") ? "Consegna" : "Attività";
  }
  function build() {
    all().forEach((e) => e.classList.remove("lim-off"));
    panel = document.querySelector(".wrap > .panel:not([hidden])"); steps = [];
    if (!panel) { bar.hidden = true; return; }
    const kids = [...panel.children];
    for (let i = 0; i < kids.length; i++) {
      const e = kids[i];
      // la consegna sta sopra la prima attività, nella stessa schermata
      if (e.classList.contains("brief") && kids[i + 1]) { steps.push({ els: [e, kids[i + 1]], t: label(kids[i + 1]) }); i++; continue; }
      steps.push({ els: [e], t: label(e) });
    }
    const br = document.querySelector(".wrap > .bridge"); if (br) steps.push({ els: [br], t: "Compito" });
    dots.innerHTML = "";
    steps.forEach((s, i) => {
      const t = s.t.length > 22 ? s.t.slice(0, 20).trim() + "…" : s.t;
      const b = mk("button", null, `<span class="n">${i + 1}</span><span class="t">${t.replace(/[&<>]/g, "")}</span>`);
      b.type = "button"; b.title = s.t; b.onclick = () => go(i); dots.appendChild(b);
    });
    bar.hidden = steps.length < 2;
    if (steps.length < 2) { clear(); return; }
    cur = Math.min(cur, steps.length - 1); go(cur, true);
  }
  function go(i, quiet) {
    if (!steps.length) return;
    cur = Math.max(0, Math.min(steps.length - 1, i));
    all().forEach((e) => e.classList.add("lim-off"));
    steps[cur].els.forEach((e) => e.classList.remove("lim-off"));
    [...dots.children].forEach((b, j) => { if (j === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
    dots.children[cur]?.scrollIntoView({ inline: "center", block: "nearest" });
    prev.disabled = cur === 0; next.disabled = cur === steps.length - 1;
    if (!quiet) window.scrollTo({ top: 0 });
    window.dispatchEvent(new Event("resize")); // grafici e 3D si ridisegnano quando diventano visibili
  }
  function clear() { all().forEach((e) => e.classList.remove("lim-off")); }
  prev.onclick = () => go(cur - 1); next.onclick = () => go(cur + 1);

  // Verifica: una domanda per volta, con «Domanda n di N»
  function pager(v) {
    if (v.dataset.limq) return; v.dataset.limq = "1";
    const body = v.querySelector(".verif-body"); if (!body) return;
    const nav = mk("div", "lim-qnav"); const pb = mk("button", null, "◀"); const txt = mk("span"); const nb = mk("button", null, "Domanda successiva ▶");
    pb.type = nb.type = "button"; nav.append(pb, txt, nb); body.after(nav);
    let q = 0;
    const show = () => { const qs = [...body.querySelectorAll(".vq")]; if (!qs.length) return; q = Math.max(0, Math.min(qs.length - 1, q));
      qs.forEach((x, j) => x.classList.toggle("lim-cur", j === q)); txt.textContent = `Domanda ${q + 1} di ${qs.length}`; pb.disabled = q === 0; nb.disabled = q === qs.length - 1; };
    pb.onclick = () => { q--; show(); }; nb.onclick = () => { q++; show(); };
    new MutationObserver(() => { if (!body.querySelector(".vq.lim-cur")) { q = 0; show(); } }).observe(body, { childList: true });
    show();
  }

  function sync() {
    const on = root.classList.contains("lim");
    if (on) { build(); } else clear();
  }
  function mount() {
    document.body.appendChild(bar);
    document.querySelectorAll(".verif").forEach(pager);
    // cambio di livello: ricostruisci i passi quando cambia la scheda visibile (in qualunque modo avvenga)
    let tmr = 0;
    const onPanel = () => { clearTimeout(tmr); tmr = setTimeout(() => { const p = document.querySelector(".wrap > .panel:not([hidden])"); if (p !== panel) cur = 0; if (root.classList.contains("lim")) build(); }, 0); };
    document.querySelectorAll(".wrap > .panel").forEach((p) => new MutationObserver(onPanel).observe(p, { attributes: true, attributeFilter: ["hidden"] }));
    document.addEventListener("keydown", (e) => {
      if (!root.classList.contains("lim")) return;
      const tag = (e.target.tagName || "").toLowerCase(); if (tag === "textarea" || tag === "input" || tag === "select") return;
      if (e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
      if (e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
    });
    new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["class"] });
    sync();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
