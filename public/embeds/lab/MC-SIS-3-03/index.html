<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Business Model Canvas</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-SIS-3-03","F":[["Quale strumento viene usato nel metodo Lean Startup per testare le ipotesi più rischiose nel minor tempo possibile?",["MVP (Minimum Viable Product): la versione più semplice del prodotto che permette di testare l'ipotesi chiave","Un prototipo fisico completamente funzionante del prodotto finale","Un sondaggio online da 100 domande sulle preferenze dei clienti","Un piano di business dettagliato di 50 pagine per gli investitori"],0,"Il MVP (Minimum Viable Product) è il cuore del Lean Startup: la versione più semplice possibile del prodotto che permette di testare le ipotesi più rischiose. Airbnb MVP = pagina web con 3 foto e modulo di contatto (nessun pagamento, nessuna mappa). Obiettivo: scoprire se qualcuno pagherebbe per dormire in casa di uno sconosciuto, senza costruire tutto il sistema.",["Esatto! Il MVP (Minimum Viable Product) è la versione più semplice possibile del prodotto che permette di raccogliere il massimo di apprendimento con il minimo di sforzo. Il primo sito di Airbnb era solo una pagina web con foto e un modulo di contatto.","Non corretto. Un prototipo completo e funzionante è l'opposto dell'MVP. L'MVP è intenzionalmente minimale: solo ciò che serve per testare l'ipotesi più rischiosa, non il prodotto completo.","Non corretto. I sondaggi (specialmente quelli lunghi) non sono MVP. Il MVP è una versione reale (anche se minima) del prodotto che si può usare, non un questionario su preferenze ipotetiche.","Non corretto. Il piano di business è uno strumento di pianificazione, non un MVP. Il Lean Startup si basa precisamente sul NON pianificare troppo a priori ma testare le ipotesi con il prodotto reale."]],["In che modo il Business Model Canvas divide la descrizione di un'impresa?",["In 9 blocchi: clienti, proposta di valore, canali, relazioni con i clienti, fonti di ricavo, risorse chiave, attività chiave, partner chiave, struttura dei costi","In 3 sezioni: cosa si produce, come si vende, quanto si guadagna","In 12 capitoli come un piano aziendale tradizionale","In 2 parti: entrate e uscite finanziarie"],0,"Il Business Model Canvas (Osterwalder, 2010): 9 blocchi in una pagina. Lato VALORE: clienti target + proposta di valore + canali + relazioni + fonti di ricavo. Lato EFFICIENZA: risorse chiave + attività chiave + partner chiave + struttura dei costi. Si compila nell'ordine: prima i clienti, poi il valore, poi come lo si consegna, poi come lo si costruisce.",["Esatto! Il Business Model Canvas (Osterwalder, 2010) è diviso in 9 blocchi che descrivono come funziona un'impresa su una singola pagina.","Non corretto. La suddivisione semplificata in 3 sezioni non è il Business Model Canvas. Il BMC ha 9 blocchi specifici che coprono tutti gli aspetti del modello di business.","Non corretto. Il BMC è nato come alternativa al piano aziendale tradizionale (lungo e rigido): è uno strumento visivo di una pagina con 9 blocchi, non un documento di 12 capitoli.","Non corretto. Il BMC non è un bilancio. Descrive il modello di business su 9 blocchi che vanno molto oltre le semplici entrate e uscite."]],["Cosa si intende per 'pivot' nel metodo Lean Startup?",["Un cambiamento strategico basato sui dati raccolti durante i test, quando si scopre che un'ipotesi chiave era sbagliata","Il momento in cui si smette di sviluppare il prodotto e si inizia a venderlo","Il punto massimo di crescita di un'impresa prima della stagnazione","Il processo di ottenere il primo finanziamento da un venture capital"],0,"Il pivot è un cambiamento strategico deliberato basato sui dati: quando le misurazioni mostrano che un'ipotesi era sbagliata, si cambia direzione invece di perseverare. Esempi famosi: YouTube era un sito di dating (pivot → sharing di video), Twitter era una piattaforma di podcast (pivot → microblogging), Slack era un tool interno di un'azienda di videogiochi fallita (pivot → messaging per team).",["Esatto! Il pivot è un cambiamento strategico deliberato, non un fallimento. Flickr era un videogioco (pivot → sito di foto). Slack era uno strumento interno per un'azienda di videogiochi (pivot → sistema di messaggistica per team). Il pivot è basato su dati reali, non su intuizioni.","Non corretto. Quello è il lancio del prodotto. Il pivot è un cambiamento di direzione strategica basato sui dati dei test, che avviene prima o durante lo sviluppo.","Non corretto. Quello sarebbe il 'picco' nel ciclo economico. Il pivot è un cambiamento strategico deliberato basato su dati dei test che mostrano che un'ipotesi era sbagliata.","Non corretto. Il finanziamento da VC è una fase della crescita aziendale. Il pivot è un cambiamento strategico basato sui dati di test: si cambia direzione quando i dati mostrano che la strada attuale non funziona."]],["Qual è la forma giuridica più semplice per avviare un'impresa individuale in Italia?",["Ditta individuale: registrazione all'Agenzia delle Entrate, apertura della partita IVA, inizio dell'attività","Società a responsabilità limitata (SRL): la forma più diffusa per le imprese singole in Italia","Cooperativa: la forma giuridica accessibile a chiunque voglia lavorare in autonomia","B Corp: la forma giuridica per chi vuole fare un'impresa con impatto sociale"],0,"Forme giuridiche in ordine crescente di complessità: 1) Ditta individuale = semplicissima (partita IVA), responsabilità illimitata personale. 2) SRL/SRL Semplificata = persona giuridica separata, responsabilità limitata al capitale, richiede atto notarile. 3) Cooperativa = di proprietà dei soci, governance democratica. 4) Impresa benefit = qualsiasi forma + impegno formale per il beneficio comune.",["Esatto! La ditta individuale è la forma più semplice: ci si registra all'Agenzia delle Entrate, si apre la partita IVA e si può iniziare. Non richiede atto notarile né capitale minimo.","Non corretto. La SRL è più complessa della ditta individuale: richiede atto notarile, statuto, registro delle imprese, capitale minimo (anche 1 euro per la SRL semplificata). La ditta individuale è più semplice.","Non corretto. La cooperativa richiede almeno 3 soci (in alcuni casi) e specifici atti costitutivi. Non è la forma più semplice per un'impresa individuale.","Non corretto. La B Corp non è una forma giuridica ma una certificazione (rilasciata dall'ente B Lab) che si ottiene indipendentemente dalla forma giuridica dell'impresa."]],["Quale caratteristica distingue l'imprenditorialità sociale dall'imprenditorialità tradizionale, secondo la definizione nel testo?",["L'imprenditoria sociale usa i meccanismi di mercato (non la carità) per creare valore principalmente per la comunità o categorie svantaggiate, in modo economicamente sostenibile","L'imprenditoria sociale non genera mai profitti: funziona solo con donazioni e sussidi","L'imprenditoria sociale è riservata alle organizzazioni non profit come le associazioni di volontariato","L'imprenditoria sociale richiede sempre finanziamenti pubblici per sopravvivere"],0,"Imprenditoria sociale = uso di meccanismi di mercato per creare valore sociale, in modo economicamente sostenibile (non carità). Esempi italiani: cooperative sociali che impiegano ex-detenuti, imprese benefit con doppio obiettivo profitto+impatto, Treedom (B Corp) che pianta alberi vendendo compensazione carbonica. Il profitto è uno strumento, non il fine.",["Esatto! L'imprenditoria sociale non è carità: usa meccanismi di mercato (vendita di prodotti/servizi) per generare valore sociale. Il profitto non è l'obiettivo principale ma uno strumento per la sostenibilità dell'impresa.","Non corretto. L'imprenditoria sociale usa i meccanismi di mercato ed è economicamente sostenibile: genera ricavi dalla vendita di prodotti/servizi, non solo da donazioni.","Non corretto. Cooperative sociali, imprese benefit, B Corp sono imprese (con forma giuridica di impresa), non solo organizzazioni non profit. L'imprenditoria sociale usa la forma imprenditoriale per fini sociali.","Non corretto. L'imprenditoria sociale è progettata per essere economicamente sostenibile attraverso i propri ricavi (prodotti/servizi). Non dipende necessariamente dai finanziamenti pubblici."]],["Qual è la principale fonte di finanziamento per il 95% delle piccole imprese italiane nelle fasi iniziali?",["Bootstrap (autofinanziamento): si usa il proprio risparmio personale","Venture Capital: fondi professionali che investono in startup","Obbligazioni emesse in borsa: gli imprenditori raccolgono capitale dal mercato finanziario","Sussidi statali obbligatori per tutti i nuovi imprenditori"],0,"Fonti di finanziamento per fasi: Inizio = bootstrap (risparmio personale, 95% delle PMI). Fase seed = FFF (Friends, Family, Fools) + crowdfunding. Fase early = business angel (ex imprenditori che investono e portano mentoring). Fase growth = venture capital (per startup ad alto potenziale). Fase matura = debito bancario, obbligazioni, IPO (borsa).",["Esatto! Il 95% delle piccole imprese italiane nasce in bootstrap: il fondatore usa i propri risparmi. Vantaggi: massima autonomia, nessun debito, nessuna diluizione della proprietà. Limite: risorse limitate.","Non corretto. Il VC finanzia una percentuale molto piccola di startup (meno dell'1%), tipicamente quelle con potenziale di crescita enorme. Il 95% delle piccole imprese nasce in bootstrap.","Non corretto. Emettere obbligazioni in borsa richiede dimensioni significative e costi di quotazione elevati: non è accessibile alle piccole imprese nascenti.","Non corretto. Non esistono sussidi statali obbligatori per tutti i nuovi imprenditori. Esistono bandi pubblici e incentivi, ma non è la fonte principale di startup per il 95% delle imprese."]]],"I":[["Il testo descrive Airbnb che parte da un MVP minimale (una pagina web, nessun sistema di pagamento) per testare una sola ipotesi. Quale era esattamente l'ipotesi più rischiosa che il MVP doveva testare?",["Se qualcuno avrebbe davvero pagato per dormire in casa di uno sconosciuto: la disponibilità delle persone a una nuova forma di ospitalità commerciale non era scontata","Se la tecnologia di pagamento online era abbastanza sicura per le transazioni tra privati","Se i comuni dove si testava avevano normative che permettevano l'affitto a breve termine","Se il sito web era abbastanza bello da convincere i potenziali ospiti a prenotare"],0,"Il MVP di Airbnb (pagina web con 3 foto, modulo di contatto, nessun pagamento integrato) testava l'ipotesi più rischiosa: esiste domanda per dormire in casa di uno sconosciuto a pagamento? Non testava la tecnologia (pagamenti, recensioni) o il design (abbastanza bella la pagina). Testava se il comportamento umano di ospitalità commerciale tra privati esisteva come mercato.",["Esatto! L'ipotesi più rischiosa non era 'funziona il sistema di prenotazione?' o 'si possono fare pagamenti online?' — era una questione di comportamento umano: esiste domanda per questo servizio? Qualcuno pagherebbe per dormire da uno sconosciuto? Il MVP ha risposto: sì.","Non corretto. L'ipotesi tecnologica (sicurezza dei pagamenti) non era la più rischiosa: esistevano già sistemi di pagamento online. L'ipotesi più rischiosa era comportamentale: le persone pagherebbero per stare in casa di uno sconosciuto?","Non corretto. Le normative sugli affitti a breve termine non erano la principale ipotesi da testare (sarebbe venuto dopo). L'ipotesi principale era la disponibilità delle persone a usare questo tipo di servizio.","Non corretto. L'estetica del sito non era l'ipotesi principale. Un MVP volutamente minimale testa se il servizio ha senso, non se il design è bello. L'ipotesi era la domanda di mercato per una nuova forma di ospitalità."]],["Il Business Model Canvas (BMC) ha 9 blocchi. Il testo dice di compilarli 'nell'ordine: prima i clienti, poi il valore, poi come lo consegni, poi come lo costruisci'. Perché questo ordine è importante?",["Perché partire dal cliente (non dal prodotto) evita di costruire qualcosa che nessuno vuole: la proposta di valore deve rispondere a un bisogno reale dei clienti identificati, non al contrario","Perché i blocchi dei costi devono essere compilati per ultimi per non influenzare le decisioni creative sui clienti","Perché l'ordine è puramente estetico: il BMC funziona ugualmente indipendentemente dall'ordine di compilazione","Perché le fonti di ricavo (entrate) vanno compilate prima dei costi per verificare la redditività preventiva"],0,"L'ordine di compilazione del BMC riflette un principio fondamentale: partire dal cliente, non dal prodotto. Molte startup falliscono costruendo prodotti tecnici brillanti senza mercato ('soluzione in cerca di un problema'). Partire dai clienti (chi ha il problema?) garantisce che la proposta di valore risponda a un bisogno reale e verificabile. È l'applicazione del principio 'customer discovery' del Lean Startup.",["Esatto! Il principio centrale del design thinking e del Lean Startup: partire dal problema dell'utente, non dall'idea del prodotto. Se si parte da 'ho questa bella tecnologia' si rischia di costruire qualcosa che non ha mercato. Partire dai clienti garantisce che la proposta di valore risponda a bisogni reali.","Non corretto (parzialmente rilevante). Sì, i costi vengono per ultimi, ma la ragione principale dell'ordine è più profonda: partire dai clienti per garantire che tutto il modello risponda a bisogni reali.","Non corretto. L'ordine ha una logica progettuale precisa: partire da chi ha il problema (clienti), poi definire la soluzione (valore), poi la consegna, poi la costruzione. Invertire l'ordine porta spesso a modelli di business 'technology-first' senza mercato.","Non corretto. Le fonti di ricavo si compilano nella fase 'come consegni il valore', non per prime. L'ordine corretto inizia dai clienti, non dalla redditività."]],["Il testo afferma che 'in Italia il fallimento porta spesso un forte stigma sociale' mentre in Silicon Valley esiste la cultura del 'fail fast, fail forward'. Quale implicazione ha questa differenza culturale per l'ecosistema imprenditoriale?",["Lo stigma del fallimento riduce la propensione al rischio: gli imprenditori italiani tendono a evitare rischi elevati per paura delle conseguenze sociali e legali, riducendo l'innovazione ad alto potenziale","Lo stigma del fallimento non ha effetti sull'innovazione: quello che conta è la tecnologia disponibile, non la cultura","Lo stigma italiano è positivo perché induce gli imprenditori a pianificare meglio ed evitare errori costosi","La differenza culturale non esiste: il fallimento è ugualmente stigmatizzato in tutti i paesi del mondo"],0,"Lo stigma del fallimento ha effetti sistemici sull'ecosistema innovativo: 1) riduce la propensione al rischio → meno startup ambiziose; 2) rende più difficile raccogliere finanziamenti dopo un fallimento; 3) riduce l'apprendimento collettivo (chi ha fallito non condivide le lezioni). In ecosistemi come Silicon Valley, l'investitore che ha già finanziato imprese fallite è considerato più esperto perché ha imparato lezioni preziose.",["Esatto! Se fallire = vergogna permanente, gli imprenditori evitano scommesse rischiose ma ad alto potenziale. Gli ecosistemi dove il fallimento è visto come apprendimento (Silicon Valley) producono più innovazione radicale perché gli imprenditori sperimentano più liberamente.","Non corretto. La cultura del rischio influenza direttamente il comportamento imprenditoriale. Paesi con alta tolleranza al fallimento (USA, Svezia) tendono a produrre più startup innovative di paesi con stigma alto (Italia, Giappone).","Non corretto (parzialmente rilevante). Una certa cautela è sana, ma lo stigma eccessivo porta a evitare qualsiasi rischio imprenditoriale, inclusi rischi calcolati su innovazioni ad alto valore potenziale.","Non corretto. La tolleranza al fallimento varia significativamente tra culture: USA, Israele e Svezia hanno culture imprenditoriali più tolleranti al fallimento rispetto a Giappone, Francia e Italia (dati GEM Global Entrepreneurship Monitor)."]],["Il testo descrive il caso 'Warda' (startup agroalimentare di Bologna): la fase 2 era un MVP WhatsApp (non un'app) per connettere ristoratori e agricoltori. Quale principio Lean Startup questo dimostra?",["L'MVP più efficace testa l'ipotesi principale con il minimo sforzo e costo possibile: un gruppo WhatsApp può testare se ristoratori e agricoltori si connettono e ordinano, senza sviluppare un'app complessa","Le app sono sempre soluzioni peggiori dei messaggi WhatsApp per le startup agroalimentari","Le startup non dovrebbero mai sviluppare app perché i social media sono sufficienti per qualsiasi business","Il MVP di WhatsApp è stato scelto per risparmiare sull'affitto degli uffici"],0,"Il principio dimostrato: l'MVP più efficace testa l'ipotesi principale con il minimo sforzo. Warda MVP WhatsApp = 0 euro, 10 minuti di setup, 6 settimane di test. Risultato: il sistema funziona (ordini, consegne, pagamenti avvengono). Ha anche rivelato il vero problema (logistica, non la comunicazione) → pivot. Solo dopo aver validato con il MVP WhatsApp ha senso investire in sviluppo software.",["Esatto! Un gruppo WhatsApp è gratuito e si crea in 5 minuti. Permette di testare l'ipotesi principale (ristoratori e agricoltori si organizzano per ordinare e consegnare) senza investire mesi e migliaia di euro in sviluppo software. Se funziona su WhatsApp, vale la pena sviluppare un'app.","Non corretto. L'MVP con WhatsApp non dimostra che le app siano sempre peggiori. Dimostra il principio Lean: testare con il minimo possibile prima di investire nel prodotto completo.","Non corretto. Il caso non dimostra che le app non siano necessarie. Dimostra che PRIMA di sviluppare un'app si dovrebbe testare il concetto con strumenti semplici e verificare che esista una domanda reale.","Non corretto. La scelta del MVP WhatsApp non è motivata dal risparmio sull'affitto. È motivata dal principio Lean: test rapido e a basso costo per validare l'ipotesi prima di investire in sviluppo software."]],["Il testo menziona Treedom come esempio di startup B Corp italiana. Quale meccanismo specifico ha usato per creare sia valore economico sia impatto ambientale?",["Ha connesso chi vuole compensare le proprie emissioni di CO₂ (aziende, privati) con comunità agricole locali nei paesi in via di sviluppo che piantano alberi, creando valore per entrambi tramite una piattaforma digitale","Produce energia solare riforestando le zone depresse delle città italiane con pannelli solari camuffati da alberi","Vende legname pregiato ricavato da foreste certificate, redistribuendo i profitti alle comunità locali","Produce fertilizzanti biologici da scarti alimentari, riducendo i rifiuti organici nelle città"],0,"Treedom (B Corp): modello di business che crea valore economico E ambientale e sociale simultaneamente. Funziona così: 1) Azienda/privato paga per far piantare un albero; 2) Treedom connette con un coltivatore locale in Africa, America Latina o Asia; 3) Il coltivatore pianta l'albero su terreni agricoli e ne raccoglie i frutti (reddito locale); 4) L'albero assorbe CO₂ (compensazione carbonica); 5) L'acquirente può seguire 'il suo' albero su una piattaforma digitale. 4+ milioni di alberi in 17 paesi.",["Esatto! Treedom usa una piattaforma digitale per connettere domanda (aziende e privati europei che vogliono compensare emissioni) con offerta (coltivatori in Africa, America Latina, Asia che piantano alberi). Il modello crea reddito per le comunità locali e permette a Treedom di essere economicamente sostenibile.","Non corretto. Treedom non produce energia solare e non installa pannelli. Pianta alberi reali connettendo chi vuole compensare le emissioni di CO₂ con contadini locali.","Non corretto. Treedom non vende legname: pianta alberi (non li abbatte). Il modello è la vendita di compensazione carbonica: chi paga per far piantare un albero ottiene un certificato di compensazione delle proprie emissioni.","Non corretto. Treedom non si occupa di fertilizzanti. Pianta alberi connettendo chi compensa le emissioni con comunità agricole locali attraverso una piattaforma digitale."]],["Il testo descrive il crowdfunding come strumento sia di raccolta fondi sia di 'validazione della domanda'. Come funziona questo doppio ruolo?",["Se non riesci a raccogliere capitali da 1.000 persone, probabilmente non riuscirai a vendere a molte di più: il numero di sostenitori del crowdfunding misura l'interesse reale nel prodotto","Il crowdfunding valida solo il prezzo del prodotto: se le persone pagano, il prezzo è giusto","Il crowdfunding è valido solo per prodotti artistici e culturali: per i prodotti industriali non funziona come test di mercato","Il crowdfunding valida solo la capacità di comunicazione del fondatore, non la domanda di mercato"],0,"Doppio ruolo del crowdfunding: 1) Raccolta fondi = ottieni il capitale necessario per produrre. 2) Validazione della domanda = misuri l'interesse reale prima di produrre. Il testo lo dice esplicitamente: 'Se non riesci a raccogliere capitali da 1.000 persone, probabilmente non riuscirai a vendere a molte di più.' Il crowdfunding converte l'intenzione di acquisto in pagamento reale: segnale più forte di un sondaggio.",["Esatto! Il crowdfunding non è solo raccolta di denaro: è un test di mercato. Se 1.000 persone pagano anticipatamente per un prodotto, dimostra che esiste una domanda reale. Se non riesci a convincere neanche 100 persone a pre-ordinare, è un segnale forte che il prodotto non ha mercato sufficiente.","Non corretto. Il crowdfunding valida la domanda complessiva (qualcuno vuole questo prodotto?) non solo il prezzo. Il prezzo è una variabile ma il segnale principale è il numero di sostenitori.","Non corretto. Il crowdfunding ha validato prodotti in tutti i settori: Pebble (smartwatch), Oculus Rift (VR), Coolest Cooler, giochi da tavola, dispositivi medici. Non è limitato ai prodotti artistici.","Non corretto. Sebbene le capacità di comunicazione influenzino il successo di una campagna, il numero di persone che pagano anticipatamente per un prodotto è un indicatore reale di domanda di mercato."]]],"A":[["Il testo cita il box EntreComp: 'l'imprenditorialità è la capacità di identificare opportunità, sviluppare idee, gestire l'incertezza, collaborare, apprendere dagli errori e creare valore — in qualsiasi contesto'. Come questo definisce l'imprenditorialità in modo più ampio della sola impresa commerciale?",["Le stesse competenze (problem solving, tolleranza dell'incertezza, pensiero sistemico) servono anche a un insegnante che innova la didattica, a un tecnico che propone miglioramenti ai processi aziendali, o a un volontario che organizza un'iniziativa comunitaria","Significa che chiunque può creare un'azienda di successo se studia il Business Model Canvas e il Lean Startup","Significa che le competenze imprenditoriali possono essere applicate ai prodotti digitali ma non ai servizi o all'artigianato","Significa che le scuole dovrebbero smettere di insegnare materie tradizionali e concentrarsi solo sull'imprenditorialità"],0,"Il framework EntreComp (UE) definisce l'imprenditorialità come competenza trasversale: capacità di creare valore in qualsiasi contesto professionale, non solo commerciale. Un medico che identifica un'inefficienza nel percorso del paziente e propone una soluzione, un insegnante che sperimenta un nuovo metodo didattico, un ingegnere che ottimizza un processo produttivo: tutti esercitano competenze imprenditoriali. L'imprenditorialità è un modo di affrontare i problemi, non solo un percorso di carriera.",["Esatto! L'imprenditorialità come life skill non si limita a chi apre un'azienda: è un modo di affrontare i problemi. Identificare un'opportunità (non prevista), costruire risorse per coglierla, tollerare l'incertezza, imparare dai fallimenti: queste capacità servono in qualsiasi ruolo professionale e personale.","Non corretto. Il framework EntreComp non promette il successo imprenditoriale a chiunque. Definisce competenze trasversali utili in qualsiasi contesto, non solo per chi apre un'azienda.","Non corretto. Il framework EntreComp si applica esplicitamente 'in qualsiasi contesto': insegnamento, pubblica amministrazione, artigianato, volontariato, non solo ai prodotti digitali.","Non corretto. Il framework EntreComp non propone la sostituzione delle materie tradizionali. Propone di sviluppare competenze imprenditoriali trasversali all'interno dell'educazione esistente."]],["Il testo descrive il Business Model Canvas come uno strumento che 'mostra come funziona un'impresa in una singola pagina'. Quale vantaggio metodologico ha questa sintesi rispetto a un piano aziendale tradizionale di 50 pagine?",["Il BMC forza a identificare le connessioni e le dipendenze tra i blocchi in modo immediato e visuale, rendendo evidenti le incoerenze interne (es. proposta di valore incompatibile con la struttura dei costi) che in 50 pagine si perderebbero","Il BMC è più veloce da compilare e quindi più utile in tutti i contesti rispetto al piano aziendale","Il BMC è uno strumento legale riconosciuto mentre il piano aziendale è solo una raccomandazione informale","Il BMC è più adatto per le grandi aziende mentre il piano aziendale è pensato per le startup"],0,"Il vantaggio del BMC su una pagina: rende visibili le CONNESSIONI tra i 9 blocchi. Se la proposta di valore è 'consegna in 30 minuti' ma i canali di distribuzione sono poste standard, l'incoerenza è immediatamente visibile. In 50 pagine, la sezione 'proposta di valore' e la sezione 'canali' sono separate da 20 pagine: l'incoerenza si perde. Il BMC forza la coerenza interna del modello.",["Esatto! Un piano aziendale lineare di 50 pagine nasconde le incoerenze tra sezioni lontane. Il BMC in una pagina rende immediatamente visibile se la proposta di valore è coerente con le risorse disponibili, se le fonti di ricavo sono compatibili con la struttura dei costi, se i canali raggiungono effettivamente i clienti target.","Non corretto. Il BMC non è 'sempre migliore' del piano aziendale: per ottenere un prestito bancario o presentarsi a certi investitori, un piano aziendale dettagliato è necessario. Il vantaggio del BMC è la sintesi visuale che rivela le incoerenze interne.","Non corretto. Il BMC non è uno strumento legale. È uno strumento di management. Entrambi sono raccomandazioni informali, non obblighi legali.","Non corretto. È l'inverso: il BMC nasce per startup e innovazione (iterativo, flessibile). Il piano aziendale è usato dalle grandi aziende per richiedere finanziamenti e presentarsi ai board."]],["Il testo descrive il ciclo Build-Measure-Learn del Lean Startup come non lineare: si può tornare indietro e ridefinire il problema dopo aver testato. Come mai questa non-linearità è un vantaggio, non un difetto?",["Perché le informazioni scoperte nelle fasi avanzate (test con utenti reali) rivelano problemi e opportunità che nessuna analisi preliminare avrebbe potuto identificare: il processo incorpora l'apprendimento empirico","Perché permette agli imprenditori di cambiare idea liberamente senza conseguenze per gli investitori","Perché i mercati cambiano così rapidamente che qualsiasi strategia deve essere modificata ogni settimana","Perché le aziende con cicli non lineari hanno statisticamente più probabilità di sopravvivere rispetto a quelle con cicli lineari"],0,"La non-linearità del Lean Startup è vantaggiosa perché il problema reale spesso emerge solo dopo il primo contatto con gli utenti. Warda ha scoperto che il problema vero era la LOGISTICA (non la comunicazione) solo dopo 6 settimane di MVP WhatsApp. Questa informazione era impossibile da ottenere a priori. Tornare indietro a ridefinire il problema non è un fallimento: è come il processo funziona quando guida l'apprendimento.",["Esatto! La non-linearità è vantaggiosa perché le fasi di test rivelano informazioni che non esistevano prima: comportamenti degli utenti, problemi che non avevi previsto, usi del prodotto diversi da quelli progettati. Tornare indietro a ridefinire il problema dopo aver testato non è un fallimento: è il meccanismo che produce soluzioni migliori.","Non corretto. Il pivot non è 'cambiare idea liberamente senza conseguenze': deve essere basato su dati empirici e comunicato agli investitori con spiegazione razionale. La non-linearità è vantaggiosa per le ragioni empiriche, non per la libertà senza conseguenze.","Non corretto. Il pivot non è una risposta alla volatilità del mercato a breve termine. È basato su apprendimento empirico da test con utenti: avviene quando i dati mostrano che un'ipotesi chiave era sbagliata.","Non corretto. Sebbene ci siano dati sul tasso di sopravvivenza delle startup Lean, la ragione metodologica della non-linearità è l'incorporazione dell'apprendimento empirico, non una correlazione statistica."]],["Il testo cita l'esempio del Chapter 11 americano (riorganizzazione aziendale senza liquidazione) e il Codice della Crisi d'Impresa italiano. Quale problema sistemico queste normative cercano di risolvere?",["La perdita di valore economico e sociale quando imprese temporaneamente in difficoltà vengono liquidate invece di riorganizzarsi: una liquidazione distrugge posti di lavoro, know-how, reti di fornitori anche quando l'impresa potrebbe sopravvivere con un piano di risanamento","La frode fiscale da parte degli imprenditori che dichiarano fallimento per non pagare le tasse","La lentezza dei tribunali italiani nel gestire i fallimenti: le normative accelerano le procedure","La mancanza di capitali per le startup italiane: le normative obbligano le banche a finanziare le imprese in crisi"],0,"Il problema sistemico: una liquidazione (fallimento tradizionale) distrugge valore che la semplice difficoltà finanziaria non avrebbe distrutto. Un'impresa con un buon prodotto ma un'errata struttura finanziaria può essere salvata riorganizzando il debito (capitali), il management o le attività. Chapter 11 (USA) e Codice della Crisi (Italia) permettono questa riorganizzazione, preservando posti di lavoro, know-how e reti economiche che la liquidazione distruggerebbe.",["Esatto! La liquidazione (fallimento tradizionale) distrugge il valore economico dell'impresa: i lavoratori perdono i posti, il know-how si disperde, la rete di fornitori e clienti si rompe. Il Chapter 11 e il Codice della Crisi permettono di salvare questo valore riorganizzando l'impresa invece di liquidarla.","Non corretto. Il Chapter 11 e il Codice della Crisi non riguardano principalmente la frode fiscale ma la conservazione del valore economico delle imprese in difficoltà attraverso la riorganizzazione invece della liquidazione.","Non corretto (parzialmente rilevante). La velocità delle procedure è un aspetto, ma il problema sistemico principale che queste normative affrontano è preservare il valore economico delle imprese in difficoltà attraverso la riorganizzazione.","Non corretto. Il Chapter 11 e il Codice della Crisi non obbligano le banche a finanziare le imprese. Permettono la riorganizzazione (ristrutturazione del debito, cambio di management) senza liquidare l'impresa."]],["Il testo afferma che 'un'idea senza esecuzione vale zero. Un'esecuzione mediocre con un'idea mediocre può comunque costruire un'impresa solida'. Quale lezione pratica contiene questa affermazione per chi vuole avviare un'impresa?",["Il vantaggio competitivo non viene dall'idea (facilmente copiabile) ma dall'esecuzione: costruire il team, trovare i clienti giusti, iterare rapidamente, gestire le risorse con parsimonia — queste sono competenze rare e difficili da replicare","Non vale la pena avere buone idee: l'importante è eseguire qualsiasi progetto velocemente","Le persone con buone idee non hanno bisogno di lavorare sodo: l'idea si vende da sola","Le idee non servono: ciò che conta è avere molto denaro per finanziare il progetto"],0,"Il paradosso della 'bella idea': molte persone aspettano di avere l'idea perfetta prima di iniziare. I dati mostrano che le idee di successo erano spesso rifiutate da tutti inizialmente (Airbnb, Uber, WhatsApp). Il vantaggio competitivo emerge dall'esecuzione: la capacità di costruire il team giusto, trovare i primi clienti, iterare rapidamente sul prodotto, gestire le risorse con parsimonia. Queste sono competenze rare e difficilmente replicabili.",["Esatto! 7 VC avevano rifiutato l'idea di Airbnb (dormire da uno sconosciuto) prima che diventasse una delle aziende più valutate al mondo. Il vantaggio non era nell'idea ma nell'esecuzione: il team di Airbnb ha costruito la fiducia tra sconosciuti, ha iterato il prodotto, ha scalato in centinaia di città. L'idea era copiabile; l'esecuzione no.","Non corretto. Le buone idee hanno valore, ma non sono sufficienti da sole. L'affermazione non dice che le idee siano irrilevanti ma che senza esecuzione eccellente nemmeno le migliori idee producono risultati.","Non corretto. L'affermazione del testo dice l'opposto: l'idea vale zero senza esecuzione. Il 'lavoro sodo' dell'esecuzione è precisamente ciò che trasforma un'idea in un'impresa.","Non corretto. Il testo non dice che il denaro sia il fattore principale. Dice che l'esecuzione (team, iterazione, gestione delle risorse) è più importante dell'idea in sé — ma il denaro non viene menzionato come sostituto dell'esecuzione."]],["Il testo presenta l'Innovation Manager come profilo professionale che usa Lean Startup e Design Thinking non solo nelle startup ma nelle 'grandi aziende manifatturiere che devono reinventarsi'. Perché i metodi dell'imprenditorialità sono rilevanti per chi lavora in una grande organizzazione?",["Perché le grandi organizzazioni affrontano gli stessi problemi delle startup (incertezza, risorse limitate per l'innovazione, resistenza al cambiamento) ma con vincoli aggiuntivi (struttura esistente, stakeholder multipli): i metodi Lean aiutano a navigare questa complessità","Perché le grandi aziende vogliono diventare startup e quindi assumono Innovation Manager per trasformarsi completamente","Perché le grandi aziende hanno bisogno di Innovation Manager solo per rispettare requisiti normativi di innovazione","Perché il Lean Startup funziona meglio nelle grandi aziende che nelle startup: ha più risorse per testare"],0,"L'intrapreneurship (imprenditorialità interna): le grandi aziende affrontano sfide di innovazione simili alle startup. Un colosso automobilistico che deve sviluppare una nuova piattaforma elettrica, un ospedale che vuole digitalizzare i percorsi clinici, un ministero che vuole migliorare i servizi digitali: tutti affrontano incertezza, risorse limitate per l'innovazione, e necessità di testare prima di investire massicciamente. Il Lean Startup e il Design Thinking si applicano questi contesti, con gli adattamenti necessari alla struttura organizzativa.",["Esatto! Un'azienda manifatturiera che deve innovare per la transizione digitale ed ecologica affronta incertezza su quale tecnologia adottare, risorse limitate per la R&D, resistenza interna al cambiamento. Il Lean Startup e il Design Thinking forniscono metodologie per identificare le ipotesi più rischiose e testarle prima di investire massicciamente.","Non corretto. Non si tratta di 'diventare startup'. Si tratta di applicare metodi di innovazione (Lean, Design Thinking) all'interno di una struttura aziendale esistente per sviluppare nuovi prodotti/servizi/processi più efficacemente.","Non corretto. Non esistono generalmente requisiti normativi di avere un Innovation Manager. Il ruolo è guidato da necessità competitive e di adattamento al cambiamento, non da compliance normativa.","Non corretto. Il Lean Startup non funziona 'meglio' nelle grandi aziende: deve essere adattato al contesto (processi di approvazione interni, stakeholder multipli). L'adattamento metodologico è parte del ruolo dell'Innovation Manager."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
