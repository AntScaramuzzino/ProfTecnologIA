<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Virale o vero?</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>

<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-COM-3-06","F":[["Nelle piattaforme digitali gratuite come TikTok, chi è il vero 'prodotto' venduto agli inserzionisti?",["L'attenzione degli utenti, venduta agli inserzionisti sotto forma di spazio pubblicitario","I contenuti prodotti dagli utenti (video, foto, testi)","I dati personali degli utenti, venduti direttamente ad aziende terze","La tecnologia della piattaforma, offerta in licenza ad altri sviluppatori"],0,"L'economia dell'attenzione (Tim Wu, 2006) descrive un sistema in cui la risorsa scarsa venduta è la capacità di concentrazione umana. Le piattaforme digitali gratuite guadagnano vendendo agli inserzionisti l'accesso all'attenzione degli utenti. Per questo gli algoritmi sono progettati per massimizzare il tempo di permanenza, non la qualità dell'informazione: un utente che resta più a lungo genera più valore pubblicitario.",["Esatto. Tim Wu (2006) ha descritto questo meccanismo: le piattaforme sono gratuite perché il loro prodotto non sono i contenuti — è il tempo di attenzione degli utenti, rivenduto agli inserzionisti. Ogni secondo su TikTok ha valore economico per TikTok, non per te.","Non è corretto. I contenuti sono il mezzo per attirare l'attenzione, non il prodotto venduto. Il prodotto vero è l'attenzione degli utenti: le piattaforme la raccolgono e la rivendono agli inserzionisti sotto forma di visualizzazioni pubblicitarie.","Non è corretto. Il GDPR vieta la vendita diretta di dati personali a terzi. Le piattaforme vendono l'accesso all'attenzione degli utenti (spazio pubblicitario targetizzato), non i dati grezzi degli utenti ad aziende esterne.","Non è corretto. TikTok, Instagram e simili non sono piattaforme 'software as a service': il loro modello di business principale è la pubblicità, non la licenza tecnologica. Il nucleo del business è catturare e rivendere l'attenzione umana."]],["Cosa distingue un feed curato dall'algoritmo da un feed cronologico?",["Nel feed curato l'algoritmo pre-seleziona i contenuti per massimizzare l'engagement, non per informarti meglio","Il feed curato mostra solo i contenuti pubblicati nelle ultime 24 ore","Il feed curato è selezionato manualmente dai redattori della piattaforma","Il feed cronologico mostra solo i post degli account che seguiamo, il feed curato include anche account sconosciuti"],0,"La distinzione è cruciale: nel feed cronologico l'utente vede tutti i contenuti nell'ordine di pubblicazione — il controllo è dell'utente. Nel feed curato l'algoritmo ha già pre-selezionato i contenuti ottimizzando per l'engagement della piattaforma. Non stai scegliendo cosa vedere: stai rispondendo a stimoli selezionati per massimizzare la tua reazione emotiva e il tuo tempo di permanenza.",["Esatto. Nel feed curato il sistema ha già fatto una selezione prima che tu arrivi: l'algoritmo sceglie cosa mostrarti ottimizzando per l'engagement (il suo obiettivo economico), non per la completezza o la qualità informativa (il tuo interesse).","Non è corretto. Il feed curato non ha un limite temporale fisso: l'algoritmo può far riemergere contenuti più vecchi se prevede che genereranno engagement. Il limite temporale rigido è caratteristica del feed cronologico, non di quello curato.","Non è corretto. Il feed curato è automatico, non manuale: algoritmi di machine learning analizzano i tuoi comportamenti passati (time di visione, like, commenti, skip) per prevedere quali contenuti ti tengono più a lungo sulla piattaforma.","Non è corretto. Entrambi i feed possono includere account non seguiti. La differenza fondamentale è il criterio di selezione e ordinamento: tempo di pubblicazione (cronologico) vs. previsione di engagement (curato)."]],["Qual è la differenza fondamentale tra misinformazione e disinformazione?",["L'intenzione: chi diffonde misinformazione ci crede (buona fede); chi diffonde disinformazione sa deliberatamente di ingannare","La velocità di diffusione: la disinformazione si diffonde più rapidamente della misinformazione","Il canale: la misinformazione circola sui social media, la disinformazione sui media tradizionali","Il contenuto: la misinformazione riguarda opinioni politiche, la disinformazione riguarda fatti scientifici"],0,"La distinzione tra misinformazione e disinformazione è fondamentale perché determina la risposta appropriata. La misinformazione (falsa, senza intento) richiede educazione e correzione gentile. La disinformazione (falsa, con intento deliberato) richiede risposta più robusta: rimozione, attribuzione di responsabilità, misure sistemiche. Esiste anche una terza categoria: la malinformazione, ovvero informazioni VERE usate per causare danno (es. diffusione di foto private senza consenso).",["Esatto. È la distinzione chiave: la misinformazione è informazione falsa diffusa senza intenzione di ingannare. La disinformazione è informazione falsa diffusa con deliberata intenzione di ingannare. Questa differenza determina la risposta appropriata: educazione per la prima, misure più robuste per la seconda.","Non è corretto. La velocità di diffusione non è il criterio di distinzione — entrambe possono diffondersi rapidamente. La differenza è l'intenzione di chi produce e diffonde il contenuto, non la velocità con cui si propaga.","Non è corretto. Entrambi i fenomeni esistono su tutti i canali — social media, televisione, giornali, chat private. La distinzione riguarda esclusivamente l'intenzione di chi produce e diffonde il contenuto.","Non è corretto. Sia la misinformazione sia la disinformazione possono riguardare qualsiasi argomento (politica, scienza, cronaca, salute). Il criterio di distinzione è l'intenzione: sapere o meno di stare diffondendo qualcosa di falso."]],["Chi ha coniato il termine 'filter bubble' e quando?",["Eli Pariser, nel 2011, nel libro 'The Filter Bubble'","Tim Wu, nel 2006, nel libro 'The Attention Merchants'","Vosoughi, Roy e Aral, nel 2018, nella rivista Science","Shoshana Zuboff, nel 2019, nel libro 'Il capitalismo della sorveglianza'"],0,"Il termine 'filter bubble' fu coniato da Eli Pariser nel 2011 nel libro 'The Filter Bubble: What the Internet Is Hiding from You'. Pariser aveva osservato che gli algoritmi di Facebook e Google stavano creando ambienti informativi sempre più personalizzati e ristretti, mostrando contenuti coerenti con le preferenze dell'utente e nascondendo progressivamente le voci diverse. L'esperimento del 2010 con due amici che cercavano la stessa parola su Google e ottenevano risultati diversi è diventato iconico.",["Esatto. Eli Pariser ha coniato il termine nel 2011. Aveva notato che il suo feed di Facebook mostrava sempre meno i post degli amici con posizioni diverse dalle sue. Aveva anche documentato nel 2010 un esperimento con Google: due amici che cercavano la stessa parola ottenevano risultati diversi — già personalizzati dall'algoritmo.","Non è corretto. Tim Wu ha sviluppato il concetto di 'economia dell'attenzione' nel 2006, non il 'filter bubble'. Sono concetti correlati ma distinti: l'economia dell'attenzione descrive il modello di business delle piattaforme; il filter bubble descrive l'effetto degli algoritmi sulla dieta informativa.","Non è corretto. Vosoughi, Roy e Aral hanno pubblicato nel 2018 lo studio sulla velocità di diffusione della disinformazione su Twitter — un tema correlato ma diverso. Il filter bubble riguarda la personalizzazione algoritmica, non la velocità di diffusione.","Non è corretto. Shoshana Zuboff ha elaborato il concetto di 'capitalismo della sorveglianza' nel 2019, che descrive la raccolta massiva di dati comportamentali. È un tema correlato al filter bubble ma concettualmente distinto."]],["Cosa è tecnicamente un deepfake?",["Un contenuto (video, audio o immagine) generato o modificato da AI per far sembrare che una persona abbia detto o fatto qualcosa che non ha mai detto o fatto","Una notizia falsa pubblicata con la firma di un giornalista reale senza il suo consenso","Un montaggio video realizzato con software di editing tradizionale come Adobe Premiere","Un video accelerato o rallentato per cambiare il significato di una dichiarazione"],0,"I deepfake sono contenuti (video, audio, immagini) generati o modificati da sistemi di intelligenza artificiale — in particolare le GAN (Generative Adversarial Networks) — per far sembrare che una persona abbia detto o fatto qualcosa che non ha mai fatto. I segnali visivi per riconoscerli includono: bordi del viso incoerenti (capelli e orecchie in luce laterale), occhi che non battono le palpebre naturalmente, denti sfumati, riflessi negli occhi incoerenti con l'illuminazione della scena.",["Esatto. I deepfake usano reti neurali generative (GAN — Generative Adversarial Networks) per produrre contenuti falsi ma convincentemente realistici. La tecnologia è diventata accessibile a chiunque grazie a strumenti online gratuiti nel 2023-2024.","Non è corretto. Attribuire una notizia falsa a un giornalista reale è un tipo di disinformazione, ma non è un deepfake. I deepfake riguardano la manipolazione di contenuti multimediali (video, audio, immagini), non testi scritti.","Non è corretto. I deepfake usano reti neurali generative, non software di editing tradizionale. La differenza è sostanziale: le GAN imparano da migliaia di immagini reali del soggetto e generano nuovi contenuti completamente sintetici — non modificano semplicemente materiale esistente.","Non è corretto. I video manipolati con velocità alterata si chiamano 'cheapfake' o 'shallow fake' e non richiedono AI. I deepfake sono tecnologicamente più sofisticati: usano intelligenza artificiale per generare volti, voci e movimenti mai realmente avvenuti."]],["Nel metodo Think-before-you-share, cosa verifica specificamente la terza domanda prima di condividere un contenuto?",["'Ho letto l'articolo completo, non solo il titolo?'","'La fonte ha più di 1.000 follower sui social media?'","'Questa notizia è stata ripresa da almeno tre testate diverse?'","'Sono passate meno di 48 ore dalla pubblicazione originale?'"],0,"Il metodo Think-before-you-share prevede 5 domande: 1) Conosco la fonte originale? 2) Ho controllato la data? 3) Ho letto l'articolo completo (non solo il titolo)? 4) Sto condividendo perché è vero o perché conferma ciò in cui credo? 5) Se mi sbaglio, mi correggerei? La terza domanda affronta il comportamento più diffuso: molte persone condividono basandosi solo sul titolo, contribuendo inconsapevolmente alla diffusione di disinformazione.",["Esatto. Gli studi mostrano che la maggior parte delle persone condivide contenuti senza averli letti per intero — spesso basandosi solo sul titolo. La terza domanda del metodo affronta direttamente questa abitudine che trasforma chi condivide in amplificatore involontario di disinformazione.","Non è corretto. Il numero di follower non è un indicatore di affidabilità: account con milioni di follower hanno diffuso disinformazione. Il metodo Think-before-you-share si concentra sulla verifica del contenuto e della fonte originale, non sulla popolarità di chi pubblica.","Non è corretto. Il numero di testate che riprendono una notizia non ne garantisce la veridicità: la stessa disinformazione può essere ripresa da molte fonti contemporaneamente, amplificandosi. La terza domanda riguarda se hai letto personalmente l'articolo completo.","Non è corretto. Il limite temporale delle 48 ore non è tra le 5 domande del metodo. La freschezza di una notizia non ne garantisce la veridicità: la disinformazione spesso sfrutta proprio la velocità di diffusione come vantaggio strategico."]]],"I":[["In quanti millisecondi avviene un'asta di pubblicità programmatica (Real-Time Bidding) mentre una pagina web si carica?",["100-200 millisecondi — molto prima che la pagina abbia finito di caricarsi","1-2 secondi — il tempo necessario per consultare il database degli inserzionisti","10-20 secondi — il tempo per autenticare le piattaforme tra loro","3-5 minuti — il tempo per elaborare i dati di profilo dell'utente in tempo reale"],0,"La pubblicità programmatica (Real-Time Bidding) è un meccanismo d'asta automatica che avviene in 100-200 millisecondi. Mentre la pagina si carica: 1) il browser invia una richiesta all'ad server con informazioni sull'utente e sul contesto; 2) l'ad server consulta i profili pre-elaborati dai data broker; 3) lancia un'asta a cui partecipano centinaia di inserzionisti; 4) l'inserzionista che offre di più vince; 5) l'annuncio viene servito. Acxiom dichiara di avere profili su circa 2,5 miliardi di persone nel mondo.",["Esatto. In 100-200 millisecondi (meno del tempo di un battito di ciglia) avviene l'intera catena: il browser invia i dati dell'utente all'ad server, vengono confrontati con i profili dei data broker, viene lanciata l'asta, il vincitore viene selezionato e l'annuncio viene servito — tutto invisibile all'utente.","Non è corretto. 1-2 secondi sarebbero percepibili come rallentamento della pagina. L'asta RTB è progettata per essere completamente invisibile all'utente: avviene in 100-200 millisecondi, un tempo così breve che l'utente non se ne accorge mai.","Non è corretto. Un'attesa di 10-20 secondi per ogni pagina renderebbe la navigazione impossibile. L'asta RTB usa connessioni pre-stabilite tra piattaforme e i profili utente sono già elaborati in anticipo dai data broker.","Non è corretto. I profili utente non vengono calcolati in tempo reale durante ogni caricamento di pagina: i data broker (Oracle, Acxiom, Experian) li elaborano in anticipo. L'asta usa questi profili già pronti e si conclude in 100-200 millisecondi."]],["Nel caso #MacronLeaks (2017), perché la campagna di disinformazione fu lanciata da account americani durante la notte del silenzio elettorale francese?",["Il silenzio elettorale si applicava solo ai media francesi: gli account americani potevano continuare a diffondere contenuti senza restrizioni legali francesi","Gli hacker americani operavano nel loro fuso orario e non sapevano del silenzio elettorale francese","Di notte ci sono meno moderatori attivi sulle piattaforme e i contenuti restano online più a lungo","La notte era l'orario di picco di attività dei bot utilizzati nella campagna"],0,"Il caso #MacronLeaks (2017) illustra una tattica sofisticata: 9 GB di documenti trafugati con phishing furono lanciati come hashtag da account dell'estrema destra americana nella notte tra venerdì e sabato, quando scattava il silenzio elettorale francese. I media francesi non potevano coprire la storia — ma gli account americani erano fuori dalla giurisdizione. I documenti circolarono senza il filtro del giornalismo verificato. I metadati di alcuni file mostravano come ultimo autore un nome russo associato all'intelligence militare (GRU).",["Esatto. Il silenzio elettorale francese (che scattava il venerdì sera prima del voto) impediva ai media francesi di coprire la storia. Ma non si applicava agli account americani: i social media non hanno confini geografici per le norme elettorali. La disinformazione circolò nei social mentre il giornalismo francese taceva.","Non è corretto. Il timing era deliberatamente strategico: il lancio durante il silenzio elettorale non fu un caso ma una scelta calcolata. I documenti mostrano pianificazione sofisticata: il tempismo sfruttava intenzionalmente il vuoto normativo tra il sistema giuridico francese e la portata globale dei social media.","Non è corretto. Sebbene la moderazione notturna sia ridotta, la ragione principale era il silenzio elettorale: i media francesi non potevano rispondere o contestualizzare, mentre i contenuti circolavano liberamente sui social in un vuoto informativo.","Non è corretto. I bot non hanno orari di picco predefiniti. Il timing era strategico rispetto al silenzio elettorale francese: creare una finestra di circolazione della disinformazione durante la quale i meccanismi di risposta istituzionali erano bloccati."]],["Quali sono i 5 principi che l'IFCN (International Fact-Checking Network) richiede per certificare un'organizzazione di fact-checking?",["Non-partigianeria, trasparenza delle fonti, trasparenza del finanziamento, trasparenza della metodologia, politica di correzione","Velocità di pubblicazione, numero di articoli annui, partnership con università, budget annuo superiore a 100.000 euro, team internazionale","Iscrizione all'ordine dei giornalisti, sede in Europa, revisione peer degli articoli, nessun conflitto di interessi dichiarato, almeno 10 anni di attività","Approvazione governativa, accreditamento ONU, focalizzazione esclusiva sul fact-checking politico, nessun account social media, revisione annuale del governo"],0,"L'IFCN (International Fact-Checking Network) certifica le organizzazioni di fact-checking su 5 principi: 1) Non-partigianeria e imparzialità; 2) Trasparenza delle fonti; 3) Trasparenza del finanziamento e dell'organizzazione; 4) Trasparenza della metodologia; 5) Politica di correzione aperta e onesta. Il metodo di fact-checking prevede: identificare l'affermazione verificabile, cercare fonti primarie (ISTAT, Eurostat, studi peer-reviewed), verificare il contesto, cercare il contraddittorio, valutare la fonte originale.",["Esatto. L'IFCN certifica i fact-checker professionali su questi 5 principi. In Italia sono certificati: Pagella Politica/FactaNews, Open (Mentana), AFP Fact Check Italia. Il codice di principi garantisce che il fact-checker sia indipendente, verificabile e disposto a correggersi pubblicamente.","Non è corretto. L'IFCN non valuta dimensioni economiche o quantità di output: si concentra sui principi editoriali e di trasparenza. Un piccolo team con poche risorse può essere certificato se rispetta i 5 principi; una grande organizzazione ben finanziata può non esserlo.","Non è corretto. L'IFCN non richiede iscrizione a ordini professionali né anzianità minima. I 5 principi riguardano non-partigianeria, trasparenza (fonti, finanziamento, metodologia) e politica di correzione — requisiti editoriali, non burocratici.","Non è corretto. L'IFCN è un'organizzazione privata indipendente: l'approvazione governativa sarebbe in contrasto con il primo principio (non-partigianeria). I fact-checker certificati possono avere social media e coprire tutti i temi, non solo la politica."]],["Cosa distingue la 'malinformazione' dalla 'disinformazione'?",["La malinformazione usa informazioni VERE per causare danno; la disinformazione usa informazioni FALSE con intento di ingannare","La malinformazione è prodotta da governi; la disinformazione è prodotta da attori privati","La malinformazione è più grave perché è impossibile da smentire con i fatti","Non c'è differenza pratica: entrambe causano danno intenzionale con informazioni non verificabili"],0,"La malinformazione è informazione VERA diffusa con l'intenzione di causare danno. Esempi tipici: diffusione di fotografie private senza consenso (i fatti — le foto — sono reali; il danno è nella diffusione non autorizzata); pubblicazione selettiva di dati statistici veri per creare l'impressione di un quadro diverso dalla realtà. Si distingue dalla disinformazione (FALSA con intento) e dalla misinformazione (FALSA senza intento). La risposta appropriata è diversa per ciascuna categoria.",["Esatto. La malinformazione è la categoria più sottile: usa fatti reali ma li diffonde in modo da causare danno. Esempi: diffusione di foto private senza consenso; pubblicazione selettiva di dati statistici veri per creare un'impressione falsa del quadro complessivo. Alla malinformazione non si risponde con una smentita fattuale.","Non è corretto. Sia la malinformazione sia la disinformazione possono essere prodotte da chiunque — governi, aziende, individui, gruppi organizzati. La distinzione riguarda la natura dell'informazione (vera vs. falsa con intento di danno), non l'identità di chi la produce.","Non è corretto. Non si misura la gravità su una scala semplice: le risposte appropriate sono diverse. Alla disinformazione si risponde correggendo i fatti; alla malinformazione si risponde bilanciando libertà di informazione con tutela della privacy — il problema non è la falsità dell'informazione ma il suo uso dannoso.","Non è corretto. La distinzione è importante e pratica: la malinformazione usa fatti VERI e verificabili. Proprio per questo non si può rispondere con una smentita: l'informazione è accurata. La risposta deve riguardare il contesto, i diritti violati (privacy), la proporzionalità della diffusione."]],["Quali azioni concrete permettono di rompere consapevolmente una filter bubble?",["Seguire fonti con cui non si è d'accordo, usare il feed cronologico, fare ricerche attive invece di aspettare l'algoritmo, chiedersi 'chi non vedo nel mio feed?'","Disattivare i cookie del browser per impedire il tracciamento dei propri dati","Usare una VPN per cambiare la propria localizzazione geografica e ingannare l'algoritmo","Abbandonare i social media e tornare esclusivamente ai telegiornali tradizionali"],0,"Rompere consapevolmente la filter bubble richiede azioni deliberate che contrastano la logica dell'algoritmo. Le strategie efficaci sono: 1) Diversificazione attiva delle fonti (seguire chi non si è d'accordo); 2) Uso del feed cronologico quando disponibile; 3) Ricerca deliberata invece di aspettare i suggerimenti algoritmici; 4) Metaconsapevolezza dei propri pattern ('chi non vedo nel mio feed?'). Nota: la filter bubble (algoritmica) si distingue dall'echo chamber (creata dalla scelta umana di stare con persone simili), ma i due fenomeni si amplificano a vicenda.",["Esatto. Queste strategie richiedono uno sforzo consapevole contro la logica dell'algoritmo: la bolla si forma passivamente, a mano a mano che l'algoritmo impara cosa ti piace. Romperla richiede azione deliberata nella direzione opposta — introdurre attivamente la diversità che l'algoritmo tende a escludere.","Non è corretto. Disattivare i cookie di terze parti limita il tracciamento pubblicitario ma non elimina la filter bubble: le piattaforme usano i dati di comportamento interni all'app (login, interazioni, tempo di visione), che non dipendono dai cookie del browser. La bolla si forma dentro la piattaforma stessa.","Non è corretto. La VPN cambia l'indirizzo IP ma non elimina la filter bubble: gli algoritmi usano la storia di interazioni (like, tempo di visione, commenti, skip) legata all'account, indipendentemente dalla localizzazione geografica.","Non è corretto. I telegiornali e i giornali tradizionali hanno bias editoriali propri. Il testo suggerisce la diversificazione attiva e consapevole delle fonti — non il ritorno ai media tradizionali come soluzione universale. Anche i media tradizionali possono creare echo chamber."]],["Cosa significa 'dividendo del bugiardo' (liar's dividend) nel contesto dei deepfake?",["Quando i deepfake diventano comuni, qualsiasi video REALE può essere dichiarato falso come strategia difensiva — 'quella registrazione è un deepfake' diventa un modo per negare prove autentiche","Il guadagno economico ottenuto da chi vende servizi di creazione di deepfake su commissione","Il vantaggio reputazionale di chi denuncia per primo la presenza di un deepfake su una piattaforma","Il fatto che chi produce deepfake non ha conseguenze legali perché la legislazione non li regola ancora"],0,"Il 'dividendo del bugiardo' (liar's dividend) è il paradosso più preoccupante dei deepfake: man mano che questa tecnologia diventa comune, chiunque può dichiarare 'quella registrazione è un deepfake' come strategia difensiva contro prove autentiche. Il rischio non è solo che le persone credano a contenuti falsi: è che smettano di credere a contenuti reali. Questo erode le fondamenta epistemologiche del dibattito democratico: senza la possibilità di concordare su prove condivise, diventa impossibile distinguere la verità dalla finzione.",["Esatto. Il 'liar's dividend' è il rischio più insidioso dei deepfake: non solo che le persone credano a contenuti falsi, ma che chiunque possa usare l'esistenza dei deepfake per negare prove reali. L'abitudine alla falsificazione erode la fiducia in qualsiasi contenuto — anche quello autentico.","Non è corretto. Il 'dividendo del bugiardo' è un concetto epistemologico — riguarda la conoscenza e la fiducia collettiva — non un concetto economico. Non descrive il mercato dei deepfake ma l'effetto sistemico sulla credibilità delle prove reali nel dibattito pubblico.","Non è corretto. Il 'dividendo del bugiardo' riguarda l'effetto dei deepfake sulla fiducia nelle prove reali, non il vantaggio di chi segnala disinformazione. Il 'dividendo' va a vantaggio di chi mente, non di chi denuncia.","Non è corretto. Il 'dividendo del bugiardo' non riguarda la regolamentazione legale. Descrive un effetto epistemologico: la diffusione dei deepfake rende possibile delegittimare qualsiasi prova reale con la semplice accusa 'è un deepfake' — e chi mente ne beneficia."]]],"A":[["Il DM 183/2024 (Linee guida Educazione Civica) identifica la disinformazione come minaccia alle istituzioni democratiche (Traguardo D1). Perché lo SDG 16.10 — 'garantire l'accesso pubblico all'informazione' — è direttamente minacciato dalla disinformazione?",["La disinformazione non censura l'informazione ma la inquina: erode la fiducia nelle istituzioni, polarizza il dibattito, rende impossibile accordarsi su fatti condivisi — e senza fatti condivisi la partecipazione democratica non è genuinamente informata","Perché i governi usano la disinformazione per censurare Internet e bloccare fisicamente l'accesso alle informazioni","Perché le fake news costano denaro alle istituzioni che devono smentirle con costose campagne di comunicazione ufficiale","Perché la disinformazione riduce il numero di lettori dei giornali tradizionali, indebolendo economicamente il giornalismo di qualità"],0,"Il DM 183/2024 (Linee guida Educazione Civica, Traguardo D1) collega la capacità di riconoscere strategie di disinformazione alla tutela delle istituzioni democratiche e all'SDG 16 (Pace, Giustizia, Istituzioni Solide). Lo SDG 16.10 garantisce l'accesso pubblico all'informazione come fondamento della partecipazione civica. La disinformazione lo minaccia non rimuovendo l'informazione (come fa la censura) ma inquinando l'ecosistema informativo: quando non si riesce a distinguere il vero dal falso, il dibattito democratico perde la sua base fattuale. Questo trasforma il pensiero critico sui media da abilità individuale a competenza di cittadinanza.",["Esatto. Il DM 183/2024 Traguardo D1 collega esplicitamente la capacità di riconoscere strategie di disinformazione alla tutela della democrazia e all'SDG 16 (Pace, Giustizia e Istituzioni Solide). La disinformazione sabota l'accesso all'informazione non rimuovendola ma rendendola indistinguibile dalla falsità.","Non è corretto. La censura governativa (blocco fisico dei siti) è un fenomeno reale ma distinto. La disinformazione opera diversamente: non rimuove l'accesso all'informazione (come fa la censura) ma la inquina — produce sovrabbondanza di contenuti falsi che rendono impossibile orientarsi nel flusso informativo.","Non è corretto. Il costo economico delle smentite istituzionali è reale ma secondario. Il danno principale della disinformazione è democratico: erode la fiducia, polarizza, e rende impossibile il dibattito basato su fatti condivisi — senza i quali il processo democratico perde la sua base.","Non è corretto. La crisi economica del giornalismo tradizionale è un problema reale, ma il collegamento con lo SDG 16.10 è più profondo: l'accesso all'informazione affidabile è un diritto fondamentale della cittadinanza democratica, non solo una questione di mercato editoriale."]],["Lo studio MIT 2018 (Vosoughi et al., Science) dimostra che le notizie false si diffondono 6 volte più velocemente di quelle vere e che sono le PERSONE (non i bot) a diffonderle principalmente. Cosa implica questo per la responsabilità individuale di chi condivide?",["Chi condivide senza verificare è parte attiva della catena di amplificazione: il think-before-you-share è un atto civico, non solo una buona abitudine individuale","Dimostra che le piattaforme devono filtrare automaticamente tutti i contenuti prima che possano essere condivisi","Significa che la responsabilità è solo delle piattaforme che hanno progettato algoritmi che premiano i contenuti virali emotivamente intensi","Suggerisce che l'educazione mediale non è efficace perché le persone condividono per impulso emotivo, non per ragionamento"],0,"Lo studio Vosoughi, Roy e Aral (MIT, 2018, Science) ha analizzato 126.000 storie condivise su Twitter tra il 2006 e il 2017: le notizie false si diffondono in media 6 volte più velocemente di quelle vere, raggiungono più persone e penetrano più in profondità nelle reti sociali. Crucialmente, il fenomeno è guidato dagli umani, non dai bot. Le notizie false sono più 'nuove', emotivamente intense e sorprendenti — esattamente i fattori che gli algoritmi premiano. Ogni persona che condivide senza verificare è parte della catena di amplificazione: milioni di scelte individuali quotidiane determinano la diffusione della disinformazione.",["Esatto. Lo studio Vosoughi et al. (2018, Science, su 126.000 storie Twitter 2006-2017) ha dimostrato che gli umani — non i bot — sono i principali responsabili della diffusione della disinformazione. Questo trasforma la responsabilità individuale del condividere in una questione di cittadinanza digitale, non solo di buon senso personale.","Non è corretto. La soluzione della moderazione automatica totale pone problemi gravi di libertà di espressione e creerebbe nuovi rischi di censura algoritmica. Lo studio suggerisce la responsabilità distribuita — delle piattaforme nel design degli incentivi e degli individui nelle scelte di condivisione — non la delega totale alla macchina.","Non è corretto. La responsabilità è distribuita: le piattaforme hanno creato incentivi strutturali che favoriscono la viralità emotiva, MA lo studio dimostra che sono le PERSONE a fare le scelte di condivisione. La responsabilità individuale e quella delle piattaforme coesistono e non si elidono a vicenda.","Non è corretto. Il fatto che le persone condividano per impulso emotivo è esattamente la ragione per cui l'educazione mediale è necessaria: il metodo Think-before-you-share è progettato per introdurre un momento di riflessione deliberata nell'impulso. L'educazione non elimina l'emozione ma la integra con la verifica."]],["Il DSA (Digital Services Act, 2022) vieta la pubblicità micro-targetizzata per i minori, integrando il GDPR. Perché questa norma specifica è importante per la tutela dei minori online?",["La pubblicità micro-targetizzata usa dati comportamentali per costruire messaggi altamente personalizzati: per un minore in sviluppo questa forma di manipolazione è particolarmente problematica, e il DSA gli riconosce una protezione specifica che il GDPR non prevedeva","Perché i minori non possono effettuare acquisti online autonomamente, quindi la pubblicità targetizzata per loro sarebbe economicamente inutile","Perché il GDPR già vietava completamente qualsiasi raccolta di dati sui minori sotto i 18 anni","Perché i minori generano meno dati comportamentali degli adulti, rendendo il targeting meno accurato e quindi meno utile agli inserzionisti"],0,"Il GDPR (2018) protegge i dati personali e richiede consenso esplicito (dei genitori per i minori sotto i 14 anni in Italia). Il DSA (Digital Services Act, 2022) aggiunge una protezione specifica: vieta la pubblicità micro-targetizzata basata su profili comportamentali per i minori. La pubblicità micro-targetizzata usa dati raccolti su comportamenti online (cosa guardi, quanto a lungo, cosa clicchi) per costruire messaggi personalizzati ad alto impatto persuasivo. Per un adolescente le cui capacità critiche e di autoregolazione sono ancora in sviluppo, questa manipolazione è particolarmente problematica — il DSA lo riconosce esplicitamente.",["Esatto. Il GDPR garantisce il diritto alla privacy e al consenso; il DSA aggiunge il divieto di sfruttare profili comportamentali per targetizzare i minori con pubblicità personalizzata. I minori sono particolarmente vulnerabili: le loro capacità critiche e di autoregolazione sono ancora in sviluppo.","Non è corretto. I minori influenzano gli acquisti familiari e sviluppano preferenze di marca sin dall'infanzia: per gli inserzionisti sono un target economicamente rilevante. Il DSA vieta il micro-targeting non perché sia inutile ma perché è una forma di manipolazione particolarmente problematica per chi non ha ancora completato lo sviluppo cognitivo ed emotivo.","Non è corretto. Il GDPR richiede il consenso dei genitori per i minori sotto i 16 anni (14 anni in Italia), ma non vieta completamente la raccolta dei dati. Il DSA aggiunge specificamente il divieto di pubblicità micro-targetizzata basata su profili comportamentali per i minori — una protezione supplementare che il GDPR non prevedeva.","Non è corretto. I minori sono utenti intensi dei social media e generano enormi quantità di dati comportamentali. Il DSA vieta il micro-targeting non per ragioni di efficacia economica ma per ragioni di protezione dei diritti: la vulnerabilità evolutiva dei minori richiede protezione specifica oltre a quella generale."]],["Nel 2022, su TikTok in Russia prevalevano video che presentavano l'invasione dell'Ucraina come operazione difensiva; in Europa prevalevano le immagini di distruzione urbana. TikTok aveva politiche editoriali diverse per i due contesti?",["No: l'algoritmo di engagement amplificava semplicemente i contenuti che generavano più interazione nel contesto locale, producendo frammentazione informativa senza alcuna scelta editoriale deliberata di TikTok","Sì: TikTok ha due divisioni operative separate (globale e per mercati a censura governativa) con politiche editoriali diverse","Sì: la censura governativa russa ha imposto a TikTok di mostrare contenuti specifici ai propri cittadini, creando di fatto una versione russa della piattaforma","Sì: ByteDance (proprietaria di TikTok) ha deliberatamente applicato politiche diverse in mercati con sistemi politici diversi per motivi commerciali e di accesso ai mercati"],0,"Il caso ucraino del 2022 illustra un fenomeno preoccupante della frammentazione algoritmica: TikTok non aveva politiche editoriali diverse per Russia ed Europa. L'algoritmo di engagement amplificava semplicemente i contenuti che generavano più interazione nel contesto locale — e le emozioni dominanti erano diverse nei due contesti culturali. Il risultato è una realtà informativa radicalmente diversa a seconda della localizzazione geografica, prodotta senza alcuna scelta intenzionale. Questo rende il fenomeno strutturalmente difficile da regolare: non c'è nessuno che ha 'deciso' di mostrare narrazioni diverse.",["Esatto. TikTok non aveva 'politiche esplicite diverse per i due paesi': l'algoritmo ottimizzava per l'engagement in ciascun contesto culturale e produceva naturalmente narrazioni radicalmente diverse. Nessuna scelta editoriale intenzionale: solo l'algoritmo che massimizza le interazioni nel contesto locale.","Non è corretto. Douyin è la versione cinese di TikTok con restrizioni diverse per il mercato interno cinese, ma TikTok globale è un'unica piattaforma. La frammentazione descritta nel caso ucraino non era causata da divisioni aziendali separate ma dall'effetto dell'algoritmo di engagement su diversi contesti culturali.","Non è corretto. Sebbene la Russia abbia bloccato molte piattaforme occidentali durante la guerra, il fenomeno descritto nel caso è un effetto algoritmico, non di censura governativa imposta a TikTok. L'algoritmo di engagement produce naturalmente bolle informative localizzate senza bisogno di imposizioni esterne.","Non è corretto. Il testo descrive un fenomeno algoritmico strutturale, non una scelta deliberata di ByteDance. L'algoritmo ottimizza per l'engagement in ciascun contesto — il risultato è la frammentazione informativa, ma non c'è stata una decisione intenzionale di mostrare narrazioni diverse."]],["Nel caso #MacronLeaks, il team di Macron dichiarò i documenti come 'combinazione di materiale autentico e falsificato' senza specificare quali fossero i falsi. Perché questa fu una tattica deliberata e non un'ammissione di ignoranza?",["Specificare i falsi avrebbe implicitamente autenticato il materiale restante: il dubbio totale sull'intera raccolta rendeva impossibile la verifica selettiva e obbligava a trattare ogni documento come potenzialmente inaffidabile","Il team legale aveva vietato qualsiasi dichiarazione specifica per evitare violazioni del silenzio elettorale francese","Il team non aveva ancora analizzato tutti i 9 GB di file e non sapeva con certezza cosa fosse autentico e cosa falsificato","Era obbligato dal silenzio elettorale a non fare dichiarazioni specifiche sulle elezioni o sui propri documenti interni"],0,"La risposta del team Macron fu una tattica di comunicazione sofisticata: dichiarare 'combinazione di autentico e falsificato' senza specificare cosa era cosa creava un dubbio totale sull'intera raccolta. Se avessero specificato 'questi 3 documenti sono falsi', avrebbero logicamente autenticato i restanti. Con la dichiarazione ambigua, ogni documento diventava sospetto — nessuno poteva essere usato come prova senza rischio. Il caso illustra anche il principio generale: la velocità di diffusione della disinformazione supera sempre la velocità di verifica; il silenzio elettorale è uno strumento progettato per un'era pre-digitale.",["Esatto. Era una risposta strategica a una situazione comunicativa impossibile: elencare i documenti falsi avrebbe logicamente autenticato quelli non elencati. Con la dichiarazione di 'mix di autentico e falsificato', ogni documento diventava sospetto — e questo rendeva inutilizzabile l'intera raccolta come fonte di prove.","Non è corretto. Il testo descrive la risposta come una 'tattica deliberata' di comunicazione strategica, non come un vincolo legale imposto dagli avvocati. Il silenzio elettorale limitava i media giornalistici, non le dichiarazioni del team della campagna.","Non è corretto. Il testo descrive esplicitamente la risposta come 'tattica deliberata'. L'eventuale incertezza sull'analisi dei file non esclude la natura strategica della comunicazione: la dichiarazione ambigua serviva a creare dubbio totale, indipendentemente da quanto era stato analizzato.","Non è corretto. Il silenzio elettorale limitava i media giornalistici dal commentare notizie elettorali, non il team della campagna dal rispondere alla diffusione di documenti trafugati. La dichiarazione fu fatta proprio come risposta comunicativa strategica alla disinformazione."]],["Perché la propaganda digitale di oggi è più potente di quella novecentesca — non per meccanismi psicologici diversi, ma per un fattore specifico?",["La scala: i meccanismi psicologici (appello emotivo, ripetizione, in-group vs out-group) sono gli stessi del XX secolo, ma la tecnologia digitale ha moltiplicato la portata di miliardi di volte in tempi enormemente più brevi","Perché oggi esistono le immagini, i video e l'audio, mentre la propaganda novecentesca usava esclusivamente le parole","Perché l'intelligenza artificiale ha scoperto nuovi meccanismi psicologici di persuasione sconosciuti ai propagandisti del XX secolo","Perché le democrazie moderne sono strutturalmente più vulnerabili alla propaganda rispetto alle democrazie degli anni '30"],0,"I meccanismi psicologici della propaganda sono antichi e stabili: appello alle emozioni forti (paura, rabbia, orgoglio), ripetizione martellante del messaggio, costruzione del nemico esterno (in-group vs out-group). Goebbels usava gli stessi strumenti delle campagne di disinformazione digitale odierne. La differenza è la scala: la radio nazista con enorme sforzo produttivo raggiungeva milioni di persone in settimane; un singolo post virale può raggiungere miliardi in ore, a costo quasi zero. La tecnologia ha moltiplicato per miliardi di volte la portata degli stessi meccanismi — senza inventarne di nuovi.",["Esatto. I meccanismi psicologici della propaganda sono antichi e stabili. Goebbels usava gli stessi strumenti che vediamo nelle campagne di disinformazione digitale: appello alle emozioni forti, ripetizione, costruzione del nemico esterno. La differenza è la scala: la radio nazista raggiungeva milioni in settimane; un singolo post virale raggiunge miliardi in ore.","Non è corretto. La propaganda novecentesca usava cinema, fotografia, radio, poster e immagini in modo massiccio. Il cinema di propaganda nazista e sovietico, i poster di guerra e le fotografie di Goebbels erano strumenti visivi potentissimi. La differenza non è nei tipi di media disponibili ma nella scala di diffusione.","Non è corretto. L'AI può personalizzare i messaggi e ottimizzarne la distribuzione, ma non ha scoperto meccanismi psicologici nuovi: usa gli stessi appelli emotivi, la stessa ripetizione, le stesse dinamiche tribali in-group/out-group già documentate da Goebbels e Bernays. La differenza è la scala, non la sofisticazione psicologica.","Non è corretto. La propaganda fu devastante nelle democrazie degli anni '30, portando al crollo di molte di esse in Europa. Non c'è evidenza che le democrazie contemporanee siano strutturalmente più fragili: il problema è la scala tecnologica di diffusione, non una fragilità istituzionale nuova."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>

/* bersagli più grandi per il tocco (prima dell'ingrandimento) */

html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
