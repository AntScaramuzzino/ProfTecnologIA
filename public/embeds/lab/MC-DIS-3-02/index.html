<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Dal CAD alla stampa 3D</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

  bridge: "Progetta in Tinkercad un oggetto utile per la scuola (porta-penne, segnalibro, supporto per tablet) con almeno 3 operazioni booleane ed esporta il file STL documentato.",

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-DIS-3-02","F":[["Cosa significa l'acronimo CAD?",["Computer-Aided Design","Computer-Assisted Drawing","Creative Automated Design","Cubic Area Diagram"],0,"CAD (Computer-Aided Design) nasce negli anni Cinquanta nei laboratori del MIT. Il salto commerciale avvenne nel 1982 con AutoCAD per personal computer, che rese il CAD accessibile agli studi di progettazione.",["Esatto! CAD sta per Computer-Aided Design: progettazione assistita da computer.","Non corretto. La parola D sta per Design (progettazione), non Drawing (disegno).","Non corretto. CAD significa Computer-Aided Design, non Creative Automated Design.","Non corretto. CAD è Computer-Aided Design, la tecnologia per la progettazione assistita da computer."]],["In Tinkercad, cosa succede quando si applica l'operazione di 'sottrazione' (Hole) a un solido?",["Il solido marcato come 'Hole' viene sottratto da un altro solido, creando una cavità","Il solido viene rimpicciolito della metà","Il solido viene colorato di rosso per indicare che è difettoso","Il solido viene spostato fuori dal piano di lavoro"],0,"Nella geometria solida costruttiva (CSG) di Tinkercad, ci sono tre operazioni: unione (due solidi diventano uno), sottrazione (un solido Hole viene sottratto da un solido pieno, scavandoci dentro), raggruppamento. La sottrazione corrisponde matematicamente alla differenza insiemistica A \\ B.",["Esatto! Nella geometria solida costruttiva (CSG) di Tinkercad, un solido marcato come Hole viene sottratto da un altro solido al momento del raggruppamento, lasciando una cavità.","Non corretto. L'operazione Hole non riduce il solido a metà: lo trasforma in uno 'strumento di sottrazione' che scava una cavità in un altro solido.","Non corretto. Il colore rosso semitrasparente indica che il solido è marcato come Hole (foro), non che è difettoso. Serve per sottrarlo da un altro solido.","Non corretto. L'operazione Hole non sposta nulla: converte il solido in uno strumento di sottrazione da applicare ad altri solidi al raggruppamento."]],["Qual è il materiale più usato nelle stampanti 3D FDM in ambito educativo, secondo il testo?",["PLA (acido polilattico)","ABS (acrilonitrile butadiene stirene)","PETG (polietilene tereftalato glicole)","Nylon"],0,"Il PLA (acido polilattico) è il filamento più usato nell'educazione: economico, si stampa a basse temperature (190-220°C), non richiede piano riscaldato, e si considera biodegradabile in condizioni di compostaggio industriale a 70°C. Rispetto ad ABS o PETG, è molto più facile da gestire.",["Esatto! Il PLA è il filamento più usato nell'educazione: economico, si stampa a basse temperature (190-220°C) e si considera biodegradabile in condizioni di compostaggio industriale.","Non corretto. L'ABS si usa per applicazioni più resistenti al calore ma è più difficile da gestire. Il testo indica il PLA come materiale principale nell'educazione.","Non corretto. Il PETG è più resistente del PLA ma il testo indica il PLA come il filamento più usato nell'educazione.","Non corretto. Il nylon è un filamento tecnico più difficile da stampare. Il testo indica il PLA come il filamento standard nell'educazione."]],["In un modello CAD parametrico, cosa succede quando si modifica il valore di un parametro (ad esempio 'diametro_pin')?",["Il software aggiorna automaticamente tutti gli elementi che dipendono da quel parametro","Solo la dimensione di quell'elemento specifico cambia, gli altri rimangono invariati","Il modello viene eliminato e deve essere ridisegnato da zero","Il software chiede conferma per ogni elemento che verrebbe modificato"],0,"Nel design parametrico ogni misura è un parametro con un nome e relazioni esplicite con altri parametri. Cambiare 'diametro_pin' aggiorna automaticamente tutte le dimensioni che dipendono da esso: sedi dei pin, tolleranze, viti di fissaggio. Questo accelera enormemente le varianti di prodotto.",["Esatto! Nel design parametrico ogni dimensione è un parametro e le relazioni tra parametri sono definite esplicitamente. Cambiare un parametro aggiorna automaticamente tutto ciò che dipende da esso.","Non corretto. Nel design parametrico le relazioni tra parametri sono definite esplicitamente: cambiare un parametro aggiorna automaticamente tutti gli elementi dipendenti.","Non corretto. Il vantaggio principale del design parametrico è esattamente questo: non occorre ridisegnare da zero, basta cambiare il valore del parametro.","Non corretto. Il software aggiorna automaticamente senza chiedere conferma per ogni elemento. È questo il vantaggio del design parametrico."]],["Cosa fa un software 'slicer' (come Ultimaker Cura) con un file STL prima della stampa 3D?",["Divide il modello 3D in strati orizzontali e genera le istruzioni di movimento della testina (G-code)","Converte il file STL in formato PDF stampabile su carta","Verifica automaticamente se il modello ha errori geometrici e li corregge","Calcola il peso finale dell'oggetto stampato"],0,"Lo slicer (letteralmente 'affettatore') legge il modello 3D solido e lo 'affetta' orizzontalmente in centinaia o migliaia di strati sottili (layer). Per ogni strato genera le istruzioni di movimento della testina di stampa: il file G-code che viene caricato nella stampante.",["Esatto! Lo slicer 'affetta' orizzontalmente il modello 3D in centinaia o migliaia di strati e genera per ogni strato le istruzioni di movimento della testina (file G-code).","Non corretto. Lo slicer non converte in PDF: 'affetta' il modello 3D in strati e genera le istruzioni di movimento per la stampante 3D.","Non corretto. Alcune funzionalità di controllo esistono, ma la funzione principale dello slicer è dividere il modello in strati e generare il G-code.","Non corretto. Il peso può essere stimato, ma la funzione principale dello slicer è dividere in strati e generare le istruzioni di stampa (G-code)."]],["Cosa si intende per 'infill' nei parametri di stampa 3D?",["La percentuale del volume interno dell'oggetto riempita di materiale","Il numero di strati che formano la superficie esterna dell'oggetto","La velocità di movimento della testina durante la stampa","La temperatura del materiale estruso durante la stampa"],0,"L'infill (riempimento interno) è la percentuale del volume interno dell'oggetto riempita di materiale. Un infill del 100% è solido ma pesante. Un infill del 20% è più leggero con struttura interna a nido d'ape. Per oggetti funzionali non critici, 15-20% è spesso sufficiente.",["Esatto! L'infill indica quanto dell'interno dell'oggetto è riempito: 100% è completamente solido, 20% ha una struttura interna a nido d'ape o griglia con molto vuoto.","Non corretto. Gli strati della superficie esterna si chiamano 'walls' o 'perimetri'. L'infill riguarda la struttura interna dell'oggetto.","Non corretto. La velocità di stampa è un parametro separato. L'infill è la percentuale di riempimento del volume interno.","Non corretto. La temperatura è un parametro separato. L'infill è la percentuale di riempimento del volume interno dell'oggetto."]]],"I":[["Il testo descrive il rover NASA Perseverance con oltre 50 componenti in stampa 3D. Una delle tre ragioni è 'geometrie impossibili'. Perché la stampa 3D può produrre geometrie impossibili per la fresatura?",["Perché la stampa 3D costruisce dall'interno verso l'esterno, potendo creare canali interni che le macchine utensili non possono raggiungere","Perché la stampa 3D usa materiali più duri che la fresatura non riesce a lavorare","Perché la stampa 3D è più precisa della fresatura nella produzione di superfici curve","Perché la fresatura non funziona nello spazio mentre la stampa 3D sì"],0,"Alcuni componenti di Perseverance hanno canali di raffreddamento interni così complessi che non potrebbero essere prodotti per fresatura o fusione. La stampa 3D costruisce strato per strato dall'interno verso l'esterno, creando strutture interne inaccessibili a qualsiasi utensile tradizionale.",["Esatto! La fresatura rimuove materiale dall'esterno. La stampa 3D deposita materiale strato per strato, potendo creare strutture interne (canali di raffreddamento, cavità) inaccessibili a qualsiasi utensile che lavora dall'esterno.","Non corretto. La difficoltà non riguarda la durezza del materiale ma la geometria: la stampa 3D può creare strutture interne che la fresatura (che lavora dall'esterno) non può raggiungere.","Non corretto. La precisione non è il punto: il vantaggio è la possibilità di creare strutture interne inaccessibili agli utensili tradizionali.","Non corretto. Il testo parla di componenti progettati in stampa 3D sulla Terra per poi essere inviati su Marte. Il vantaggio è la geometria impossibile, non il contesto spaziale."]],["Nel caso studio del porta-telefono in Tinkercad, il testo dice di 'verificare la stabilità geometrica: il baricentro del telefono + supporto deve cadere dentro la base'. Perché questa verifica è fondamentale?",["Se il baricentro cade fuori dalla base, l'oggetto tenderà a ribaltarsi anche senza forze esterne","Se il baricentro cade fuori dalla base, il software Tinkercad segnala un errore","Se il baricentro cade fuori dalla base, il file STL non può essere esportato","Il baricentro deve cadere dentro la base solo se l'oggetto verrà usato in ambienti con vibrazioni"],0,"È un principio di fisica applicata al design: la stabilità di un oggetto dipende dalla posizione del baricentro rispetto alla base di appoggio. Se il baricentro cade all'interno della base, l'oggetto è stabile. Se cade fuori, si rovescia. Questa verifica deve avvenire in fase di progettazione CAD prima di stampare.",["Esatto! È un principio fisico fondamentale: un oggetto è stabile solo se il suo baricentro cade all'interno del poligono di supporto (la base). Se cade fuori, il momento torcente generato dal peso stesso farà ribaltare l'oggetto.","Non corretto. Tinkercad non calcola la stabilità fisica. La verifica è fisica, non informatica: un oggetto con baricentro fuori dalla base si rovescia.","Non corretto. L'esportazione STL non dipende dalla stabilità fisica. La verifica è necessaria per garantire che il prototipo fisico funzioni correttamente.","Non corretto. La regola del baricentro vale sempre: un oggetto con baricentro fuori dalla base è instabile indipendentemente dall'ambiente."]],["Il testo descrive come il CAD parametrico ha reso costruibili gli edifici di Zaha Hadid (es. il MAXXI di Roma). Quale problema specifico il CAD parametrico ha risolto che prima era impossibile?",["La definizione matematica precisa di superfici curve complesse e la loro traduzione in istruzioni per le macchine CNC","Il problema del costo elevato del calcestruzzo armato per le grandi strutture","Il problema della lentezza dei cantieri italiani rispetto a quelli nord-europei","Il problema della scarsa resistenza dei materiali disponibili prima degli anni '90"],0,"Prima del CAD parametrico, le forme architettoniche erano limitate da ciò che poteva essere calcolato manualmente. Zaha Hadid progettava edifici con superfici che si torcono continuamente: forme impossibili da definire con geometrie standard. Il CAD parametrico permette di definire queste forme come superfici matematiche e trasmetterle con precisione alle macchine CNC.",["Esatto! Prima del CAD parametrico, le superfici che si torcono e si inclinano continuamente non potevano essere definite con precisione. Il CAD parametrico permette di gestire queste forme come superfici matematiche e tradurle in istruzioni per le macchine che tagliano l'acciaio.","Non corretto. Il CAD parametrico non risolve il costo dei materiali. Risolve il problema della definizione matematica precisa di forme complesse e della loro realizzazione.","Non corretto. Il testo non parla di velocità dei cantieri. Il problema risolto era la possibilità di definire e costruire forme architettoniche impossibili con il calcolo manuale.","Non corretto. I materiali erano già disponibili. Il problema era la possibilità di progettare con precisione forme complesse e comunicarle alle macchine di produzione."]],["Il testo paragona le operazioni di Tinkercad (aggiunta, sottrazione, intersezione) all'algebra degli insiemi. Quale operazione corrisponde matematicamente alla sottrazione di un 'Hole' da un solido pieno?",["La differenza insiemistica A \\ B (A meno B)","L'unione degli insiemi A ∪ B","L'intersezione degli insiemi A ∩ B","Il complementare dell'insieme A rispetto a B"],0,"La geometria solida costruttiva (CSG) è la formalizzazione matematica delle operazioni di Tinkercad. Sottrarre un solido B (Hole) da un solido A corrisponde alla differenza insiemistica A \\ B: si ottiene il volume di A privato della parte che aveva in comune con B. È algebra degli insiemi applicata a oggetti fisici tridimensionali.",["Esatto! Sottrarre un solido Hole (B) da un solido pieno (A) corrisponde alla differenza insiemistica: si ottiene A privato di ciò che aveva in comune con B. È esattamente l'operazione A \\ B.","Non corretto. L'unione A ∪ B corrisponde all'addizione di due solidi (l'unione in Tinkercad). La sottrazione corrisponde alla differenza A \\ B.","Non corretto. L'intersezione A ∩ B produce solo la parte comune dei due solidi. La sottrazione (Hole) corrisponde alla differenza A \\ B.","Non corretto. Il complementare di A rispetto a B sarebbe tutto quello che è in B ma non in A. La sottrazione in Tinkercad corrisponde alla differenza A \\ B."]],["Il testo avverte che 'la stampa 3D con filamento plastico (FDM) produce prototipi e oggetti funzionali in bassa resistenza, non oggetti strutturali definitivi'. Quale implicazione progettuale ha questa limitazione?",["Il progettista deve tenere distinto l'uso del prototipo stampato (test di forma e fit) dall'uso del prodotto finale (uso strutturale), che richiederà materiali diversi","Il progettista non dovrebbe mai usare la stampa 3D FDM perché produce solo prototipi inutilizzabili","Il progettista dovrebbe sempre preferire la fresatura CNC alla stampa 3D per tutti gli oggetti","Il progettista non può usare la stampa 3D per oggetti che toccano l'acqua perché il PLA si dissolve"],0,"La limitazione della stampa FDM in PLA (bassa resistenza strutturale, deformazione sopra 60°C) implica una distinzione fondamentale: il prototipo serve a testare forma, ingombro, fit e interfacce — non a sostenere carichi strutturali. Per applicazioni strutturali definitive servono materiali diversi: metallo, compositi, o processi di stampa 3D industriale.",["Esatto! Il prototipo FDM in PLA permette di testare forma, ingombro, accessibilità, interfacce. Ma per applicazioni strutturali (un telaio di bici, una staffa portante) serviranno materiali diversi: metallo, compositi, o stampa 3D industriale.","Non corretto. Il testo non dice che i prototipi FDM sono inutilizzabili. Sono molto utili per testare forma, fit e interfacce. Il limite è l'uso strutturale definitivo.","Non corretto. Il testo non suggerisce di preferire sempre la fresatura. La stampa 3D e la fresatura hanno scopi diversi e si usano in contesti diversi.","Non corretto. Il testo non menziona la dissoluzione in acqua. Il limite del PLA è la bassa resistenza strutturale e la deformazione a temperature superiori ai 60°C."]],["Nel workflow base di Tinkercad per costruire un porta-matite cilindrico, il passo 4 usa lo strumento 'Allinea' per centrare i due cilindri. Perché questo passo è necessario prima del raggruppamento?",["Se i cilindri non sono centrati sull'asse X e Y, il foro risultante sarà asimmetrico e non al centro dell'oggetto","L'allineamento è necessario per evitare che il software Tinkercad vada in crash","L'allineamento è necessario solo se si vuole esportare in formato OBJ invece che STL","L'allineamento è un passo opzionale che si può saltare se si è esperti di CAD"],0,"Prima di raggruppare il cilindro esterno con il cilindro-foro interno, è essenziale allinearli sull'asse X e Y. Se il cilindro interno non è centrato rispetto a quello esterno, la sottrazione produrrà una cavità asimmetrica, non al centro del porta-matite. L'allineamento garantisce la correttezza geometrica dell'oggetto finale.",["Esatto! Se il cilindro interno (Hole) non è centrato rispetto a quello esterno, la cavità risultante non sarà al centro del porta-matite. Il passo di allineamento garantisce la correttezza geometrica prima di raggruppare.","Non corretto. L'allineamento non è una necessità tecnica del software ma una necessità geometrica: garantisce che il foro sia correttamente posizionato al centro dell'oggetto.","Non corretto. L'allineamento è necessario per la correttezza geometrica dell'oggetto, indipendentemente dal formato di esportazione.","Non corretto. L'allineamento non è opzionale: senza di esso la sottrazione produce un foro non centrato, rendendo l'oggetto geometricamente scorretto."]]],"A":[["Il testo spiega che la prototipazione rapida ha cambiato il ciclo di sviluppo prodotto permettendo '10-15 iterazioni invece di 2-3'. Quale effetto sistemico produce questo cambiamento sulla qualità del prodotto finale?",["Con più iterazioni si possono scoprire e correggere più problemi prima di produrre in metallo, riducendo errori costosi nelle fasi finali e permettendo team più piccoli","Con più iterazioni il prodotto finale è sempre più pesante perché si aggiungono materiali a ogni ciclo","Con più iterazioni aumenta solo il costo del prodotto finale senza migliorare la qualità","Il numero di iterazioni non influenza la qualità del prodotto finale, solo la velocità di sviluppo"],0,"La prototipazione rapida ha cambiato il ciclo di sviluppo riducendo il costo per iterazione. Più iterazioni = più opportunità di scoprire e correggere problemi prima della fase costosa di produzione finale. Il risultato sistemico: prodotti migliori, meno errori nelle fasi avanzate, e team di progettazione più piccoli che producono risultati di qualità comparabile a team più grandi.",["Esatto! Prima della prototipazione rapida, la limitazione delle iterazioni (2-3 per costo e tempo) significava che molti problemi venivano scoperti tardi, in fasi costose. Più iterazioni in meno tempo = prodotti migliori, meno errori costosi, team più efficienti.","Non corretto. Le iterazioni non aggiungono materiale al prodotto finale. Ogni iterazione è una versione migliorata del prototipo, non un'addizione cumulativa.","Non corretto. L'obiettivo delle iterazioni è precisamente migliorare la qualità riducendo i costi degli errori nelle fasi avanzate. Più iterazioni precoci = meno errori costosi tardi.","Non corretto. Le iterazioni influenzano profondamente la qualità: ogni ciclo test-modifica permette di scoprire e correggere problemi che altrimenti arriverebbero al prodotto finale."]],["Il testo descrive come il design parametrico permette a un'azienda di mobili di 'offrire 20 misure diverse dello stesso divano senza ridisegnare nulla'. Quale implicazione ha questa capacità per il rapporto tra design e produzione di massa?",["Il design parametrico permette di separare il lavoro creativo (definire le relazioni tra parametri) dalla personalizzazione (cambiare i valori), rendendo possibile la personalizzazione di massa","Il design parametrico è utile solo per i mobili, non per altri settori manifatturieri","Il design parametrico rende i designer sostituibili perché il computer fa tutto il lavoro creativo","Il design parametrico riduce la qualità del prodotto finale perché le varianti sono generate automaticamente senza controllo"],0,"Il design parametrico ha trasformato il rapporto tra design e produzione: il designer definisce una volta sola le relazioni tra parametri (la struttura del modello), poi le varianti si generano automaticamente. Questo rende possibile la personalizzazione di massa: un divano in 20 misure senza ridisegnare nulla, un paio di occhiali con pupillare personalizzata, un impianto strutturale adattato a ogni edificio.",["Esatto! Il design parametrico rivoluziona il rapporto tra design e produzione: il designer definisce le relazioni una volta sola, e le varianti (20 misure diverse) si generano automaticamente cambiando i valori dei parametri. È personalizzazione di massa senza costo di ridisegno.","Non corretto. Il testo usa i mobili come esempio ma il design parametrico si applica a qualsiasi settore: automotive, aerospaziale, dispositivi medici, architettura.","Non corretto. Il design parametrico richiede lavoro creativo per definire le relazioni tra parametri (la struttura del modello). Il computer automatizza la generazione delle varianti, non la creatività della struttura.","Non corretto. Le varianti generate automaticamente rispettano le relazioni definite dal designer. La qualità dipende dalla correttezza del modello parametrico, non dall'automazione."]],["Il rover Ingenuity ha le pale del rotore progettate per girare a 2.537 rpm nell'atmosfera rada di Marte (densità ~1% di quella terrestre). Quale proprietà fondamentale del design 3D ha permesso di verificare la resistenza delle pale prima di costruirle?",["La possibilità di applicare software di simulazione strutturale al modello CAD per testare virtualmente le forze in condizioni marziane","La possibilità di stampare le pale in titanio con la stampante 3D del laboratorio NASA","La possibilità di testare le pale in camera a vuoto senza software di simulazione","La possibilità di modificare le pale durante il volo tramite aggiornamenti software"],0,"Il modello CAD 3D permette di applicare software di simulazione strutturale (analisi agli elementi finiti) per testare virtualmente le proprietà meccaniche del componente in condizioni specifiche (pressione, temperatura, forze centrifughe a 2.537 rpm nell'atmosfera marziana) prima di costruire fisicamente. È questo che rende il ciclo modello CAD → simulazione → prototipo → test fisico così efficiente.",["Esatto! Il modello CAD 3D permette di applicare simulazioni strutturali (analisi agli elementi finiti) per testare la resistenza delle pale nelle condizioni esatte di Marte prima di costruire fisicamente. Senza questa capacità, testare a 2.537 rpm nell'atmosfera marziana sarebbe stato impossibile sulla Terra.","Non corretto. Le pale di Ingenuity sono in fibra di carbonio, non titanio. E la verifica strutturale avviene con simulazione software prima della costruzione fisica.","Non corretto. Sebbene i test in camera a vuoto esistano, il testo evidenzia il ruolo del software di simulazione strutturale applicato al modello CAD per verificare la resistenza prima della costruzione.","Non corretto. Le pale del rotore sono componenti fisici che non si modificano via software durante il volo. La verifica avviene tramite simulazione strutturale sul modello CAD prima della costruzione."]],["Il testo descrive il ciclo di vita di un oggetto stampato in 3D in PLA: il materiale è biodegradabile ma solo 'in condizioni di compostaggio industriale a 70°C'. Quale problema sistemico questo rivela riguardo all'uso del PLA come alternativa 'eco' alla plastica convenzionale?",["Che la biodegradabilità del PLA dipende da infrastrutture di smaltimento specifiche che nella maggior parte dei comuni italiani non esistono, rendendo il PLA di fatto non degradabile in condizioni normali","Che il PLA è pericoloso per la salute umana se a contatto con il cibo","Che il PLA non può essere riciclato in nessuna condizione e deve sempre essere incenerito","Che il mais usato per produrre il PLA compete con la produzione alimentare globale"],0,"Il PLA è considerato 'ecologico' perché biodegradabile. Ma la biodegradazione richiede condizioni molto specifiche: impianti di compostaggio industriale a 70°C, umidità controllata, microorganismi specifici. In assenza di queste infrastrutture (rare nella maggior parte dei comuni), il PLA in discarica normale si comporta esattamente come la plastica convenzionale. La sostenibilità di un materiale non dipende solo dalla sua chimica ma anche dalle infrastrutture disponibili per il suo smaltimento.",["Esatto! Il PLA è biodegradabile solo in impianti di compostaggio industriale a 70°C. Se smaltito in discarica normale, nella natura o nel bidone della plastica, non si degrada in tempi utili — proprio come le plastiche convenzionali. La sostenibilità dipende dall'infrastruttura di smaltimento, non solo dal materiale.","Non corretto. Il PLA è generalmente considerato sicuro per il contatto alimentare. Il problema evidenziato riguarda le condizioni di compostaggio, non la sicurezza alimentare.","Non corretto. Il PLA può essere compostato in condizioni industriali specifiche. Il problema non è che non possa mai essere degradato, ma che le infrastrutture necessarie sono rare.","Non corretto. Sebbene esista questa questione, il testo evidenzia specificamente il problema dell'infrastruttura di compostaggio, non la competizione con la produzione alimentare."]],["Il testo descrive come Tinkercad usa la geometria solida costruttiva (CSG) con le operazioni di unione, sottrazione e raggruppamento. Perché questo approccio alla modellazione 3D è pedagogicamente efficace per apprendere i principi del CAD professionale?",["Perché le operazioni booleane sugli insiemi sono i principi fondamentali della modellazione solida, presenti in tutti i CAD professionali come Fusion 360, SolidWorks e CATIA","Perché Tinkercad è il software più usato nelle aziende industriali italiane","Perché Tinkercad permette di esportare file in tutti i formati CAD professionali direttamente","Perché Tinkercad è gratuito e accessibile da browser, rendendolo più conveniente dei software professionali"],0,"Tinkercad usa la geometria solida costruttiva (CSG) con unione, sottrazione e raggruppamento. Questi non sono approcci semplifici di Tinkercad ma i principi fondamentali della modellazione solida professionali: gli stessi che si trovano in Fusion 360, SolidWorks, CATIA. Imparare in Tinkercad significa imparare i concetti che si applicheranno in qualsiasi CAD professionale.",["Esatto! La CSG non è solo un semplice approccio di Tinkercad: è il fondamento matematico della modellazione solida usata in tutti i CAD professionali. Chi impara in Tinkercad sta imparando i principi che si ritrovano in Fusion 360, SolidWorks, CATIA.","Non corretto. Tinkercad è uno strumento educativo, non quello più usato nell'industria. La sua utilità pedagogica deriva dai principi che insegna (CSG), non dalla sua diffusione industriale.","Non corretto. L'efficacia pedagogica di Tinkercad non dipende dalle sue capacità di esportazione ma dai principi fondamentali (CSG) che insegna.","Non corretto. L'accessibilità è un vantaggio pratico, non la ragione dell'efficacia pedagogica. La ragione è che insegna i principi fondamentali (CSG) della modellazione solida professionale."]],["Il testo afferma che nel design parametrico 'cambiare il parametro lunghezza_piano aggiorna automaticamente tutto: le proporzioni, le posizioni dei fori, la distanza tra i supporti.' Quale concetto matematico formalizza questa rete di dipendenze?",["Le equazioni che definiscono le relazioni tra parametri formano un sistema di vincoli che garantisce la coerenza geometrica del modello dopo ogni modifica","La randomizzazione controllata dei parametri per generare varianti esteticamente diverse dello stesso oggetto","L'intelligenza artificiale che predice le modifiche necessarie quando si cambia una dimensione","La memoria del software che registra tutte le modifiche precedenti e le applica automaticamente"],0,"Il design parametrico formalizza matematicamente le relazioni tra dimensioni come equazioni esplicite: 'raggio_foro_parete = lunghezza_piano/30'. Queste equazioni formano un sistema di vincoli. Quando un parametro cambia, il software risolve automaticamente il sistema di equazioni aggiornando tutti i parametri dipendenti. È algebra applicata alla geometria degli oggetti.",["Esatto! Nel design parametrico, le relazioni tra dimensioni sono equazioni esplicite (es. raggio_foro_parete = lunghezza_piano / 30). Queste equazioni formano un sistema di vincoli: quando un parametro cambia, il risolutore aggiorna tutti i parametri dipendenti mantenendo la coerenza geometrica del modello.","Non corretto. Il design parametrico non è randomizzazione: è la definizione esplicita di relazioni matematiche tra parametri. Ogni modifica è controllata e deterministica.","Non corretto. Il design parametrico non usa intelligenza artificiale ma equazioni esplicite definite dal progettista. Le relazioni sono deterministiche, non predittive.","Non corretto. Il design parametrico non è una funzione di memoria delle modifiche ma un sistema di vincoli matematici (equazioni tra parametri) che garantisce la coerenza geometrica."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
