<style>

@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>

<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-DIG-2-01","F":[["Cos'è la 'decomposizione del problema' nel pensiero computazionale?",["Dividere un problema grande in sottoproblemi più piccoli","Trovare l'errore (bug) in un programma e correggerlo","Tradurre un algoritmo nel linguaggio di programmazione Scratch","Rimuovere le parti inutili di un programma per renderlo più veloce"],0,"La decomposizione è dividere un problema complesso in sottoproblemi più piccoli e gestibili. 'Costruire un quiz interattivo' è troppo grande per essere risolto in un colpo solo. Ma 'mostrare la domanda', 'controllare la risposta', 'aggiornare il punteggio' sono problemi piccoli, ognuno risolvibile in pochi blocchi.",["Esatto! La decomposizione è la prima strategia del pensiero computazionale: si scompone 'costruire un quiz interattivo' in 'mostrare la domanda', 'controllare la risposta', 'aggiornare il punteggio'.","Non è corretto. Trovare e correggere gli errori si chiama debugging. La decomposizione riguarda come si affronta un problema complesso dividendolo in parti.","Non è corretto. Tradurre un algoritmo in codice è la fase di implementazione. La decomposizione è una strategia di analisi del problema che viene prima.","Non è corretto. Rimuovere le parti inutili si chiama ottimizzazione. La decomposizione è una strategia per affrontare problemi complessi."]],["Cosa fa la struttura 'if/else' (selezione) in un programma?",["Ripete un blocco di istruzioni per un numero prefissato di volte","Controlla una condizione e sceglie quale ramo di codice eseguire","Esegue le istruzioni una dopo l'altra in ordine fisso","Crea una variabile e le assegna un valore"],1,"La selezione (if/else) è una delle tre strutture fondamentali: controlla una condizione e sceglie quale ramo del programma eseguire. Rende il programma 'intelligente' perché può reagire a situazioni diverse in modo diverso. Esempio: se risposta corretta → aggiungi punto; altrimenti → mostra feedback.",["Non è corretto. Ripetere le istruzioni è compito dell'iterazione (ciclo/loop), non della selezione.","Esatto! La selezione (if/else) è una biforcazione: se la risposta è corretta → aggiungi un punto; altrimenti → mostra il feedback e riprova.","Non è corretto. Eseguire le istruzioni in ordine fisso è la sequenza, non la selezione.","Non è corretto. Creare e assegnare variabili è un'operazione separata. La selezione (if/else) controlla condizioni e sceglie tra rami alternativi."]],["Cosa è una 'variabile' in programmazione?",["Un tipo di errore che cambia il comportamento del programma","Un contenitore con un nome, il cui valore può cambiare","Una struttura che ripete le istruzioni finché una condizione è vera","Il tipo di blocco in Scratch che rappresenta il personaggio sullo schermo"],1,"Una variabile è un contenitore con un nome che conserva un valore. Nel quiz: 'punteggio' parte da 0 e aumenta a ogni risposta corretta; 'domanda_corrente' tiene traccia di quale domanda siamo; 'risposta_utente' contiene quello che l'utente ha digitato. Le variabili sono fondamentali per la selezione (if).",["Non è corretto. Un errore nel programma si chiama bug. Una variabile è un contenitore per i dati.","Esatto! La variabile 'punteggio' parte da 0 e aumenta di 1 a ogni risposta corretta. Il valore cambia, ma il nome rimane lo stesso.","Non è corretto. Ripetere le istruzioni finché una condizione è vera è un ciclo (iterazione), non una variabile.","Non è corretto. Il personaggio sullo schermo in Scratch si chiama sprite. Una variabile è un contenitore per i dati del programma."]],["Cos'è lo 'stage' (palcoscenico) in Scratch?",["La finestra dove si scrivono le istruzioni del programma","L'area dove si vede il programma in esecuzione","Il pannello con tutti i blocchi di codice disponibili","Il sistema di punteggio automatico del gioco"],1,"Lo stage (palcoscenico) è l'area di Scratch dove si vede l'esecuzione del programma: i personaggi (sprite) si muovono, le immagini appaiono, i testi vengono visualizzati. Il programmatore assembla i blocchi nella zona script; il risultato si vede nello stage.",["Non è corretto. Le istruzioni si assemblano nella zona degli script. Lo stage è dove si vede l'esecuzione del programma.","Esatto! Lo stage è il 'palcoscenico' di Scratch: l'area a destra dove si vede il programma in funzione, con gli sprite che si muovono e le immagini che appaiono.","Non è corretto. Il pannello con i blocchi si chiama 'palette dei blocchi'. Lo stage è l'area di esecuzione visiva.","Non è corretto. Il punteggio è gestito da variabili nel codice. Lo stage è l'area visiva di esecuzione del programma."]],["Quali sono le tre strutture fondamentali con cui si costruisce qualsiasi programma?",["Sprite, costumi e suoni","Sequenza, selezione e iterazione","Variabili, liste e operatori","Input, elaborazione e output"],1,"Le tre strutture fondamentali della programmazione sono: sequenza (istruzioni eseguite una dopo l'altra), selezione (if/else: scelta tra rami alternativi basata su una condizione), iterazione (ciclo/loop: un blocco che si ripete). Qualsiasi programma al mondo è costruito combinando queste tre strutture.",["Non è corretto. Sprite, costumi e suoni sono elementi dell'ambiente Scratch, non le strutture logiche fondamentali della programmazione.","Esatto! Qualsiasi programma — dal sistema operativo a un videogioco — è costruito combinando solo queste tre strutture: sequenza (istruzioni in ordine), selezione (if/else), iterazione (ciclo).","Non è corretto. Variabili, liste e operatori sono componenti importanti, ma non le strutture di controllo fondamentali.","Non è corretto. Input, elaborazione e output descrivono il flusso di dati in un sistema, non le strutture logiche della programmazione."]],["Cosa fa il 'broadcast' (trasmissione) in Scratch?",["Trasmette il programma su internet per condividerlo con altri","Fa inviare a uno sprite un messaggio a tutti gli altri","Riproduce un suono ad alto volume per tutti gli utenti","Mostra il punteggio finale a fine quiz"],1,"Il broadcast (trasmissione) in Scratch permette a uno sprite di inviare un messaggio a tutti gli altri sprite. È il meccanismo di coordinazione: quando lo sprite della domanda risponde correttamente, manda un broadcast 'prossima_domanda', e lo sprite del punteggio aggiunge 1 al punteggio quando riceve quel messaggio.",["Non è corretto. Il broadcast in Scratch è un meccanismo di comunicazione interna tra sprite, non una pubblicazione su internet.","Esatto! Il broadcast permette a sprite diversi di comunicare: quando una domanda viene risposta, lo sprite della domanda manda un broadcast 'prossima_domanda' e lo sprite del punteggio risponde.","Non è corretto. Per riprodurre suoni in Scratch si usano i blocchi della categoria 'Suono'. Il broadcast è un meccanismo di comunicazione tra sprite.","Non è corretto. Mostrare il punteggio si fa con i blocchi di aspetto. Il broadcast è usato per coordinare l'esecuzione di script tra sprite diversi."]]],"I":[["Un quiz in Scratch gestisce le domande con tre liste separate: 'domande', 'risposte_corrette' e 'feedback_sbagliato'. Qual è il vantaggio di questa struttura rispetto a gestire ogni domanda con blocchi separati?",["Le liste sono più veloci da eseguire rispetto ai blocchi singoli","Lo stesso codice vale per tutte le domande: basta cambiare le liste","Le liste permettono di mostrare le domande in colori diversi automaticamente","Le liste sono l'unico modo per fare un quiz in Scratch con più di 3 domande"],1,"Le liste permettono di usare lo stesso codice per tutte le domande. La variabile 'domanda_corrente' funziona come indice: 'mostra elemento domanda_corrente di domande'. Per aggiungere una quinta domanda basta aggiungere un elemento alle tre liste — il codice non cambia. È il principio del 'riconoscimento di schemi' nel pensiero computazionale.",["Non è corretto. Il vantaggio delle liste non è la velocità di esecuzione, ma la scalabilità e la gestione uniforme dei dati.","Esatto! Con le liste, lo script è sempre lo stesso: 'mostra elemento n di domande', 'confronta risposta con elemento n di risposte_corrette'. Aggiungere una domanda significa solo aggiungere un elemento alle liste.","Non è corretto. I colori degli elementi si gestiscono con i blocchi dell'aspetto. Le liste gestiscono i dati, non l'aspetto visivo.","Non è corretto. Si può fare un quiz con più domande anche senza liste (con blocchi separati), ma diventa molto ripetitivo e difficile da modificare."]],["Cosa significa 'debugging' nel contesto della programmazione?",["Aggiungere nuove funzionalità a un programma già funzionante","Il processo di identificazione e correzione degli errori (bug) nel codice","La compilazione del codice in un linguaggio comprensibile dal computer","Rimuovere gli insetti fisici dai vecchi computer a valvole"],1,"Il debugging è il processo di trovare e correggere gli errori (bug) nel codice. Esistono errori di sintassi (in Scratch quasi impossibili perché i blocchi si incastrano solo se compatibili) ed errori logici (il programma gira ma fa qualcosa di sbagliato). I programmatori trascorrono circa il 50% del tempo a fare debugging.",["Non è corretto. Aggiungere funzionalità si chiama development o feature implementation. Il debugging riguarda trovare e correggere errori.","Esatto! Il debugging occupa il 50% del tempo dei programmatori professionisti. Non è un segno di fallimento: è la parte normale del processo di sviluppo.","Non è corretto. La compilazione è la traduzione del codice sorgente in linguaggio macchina. Il debugging è la ricerca e correzione degli errori.","Non è corretto (anche se la storia della falena di Grace Hopper è reale!). Il debugging oggi si riferisce a trovare e correggere errori logici nel software."]],["Qual è la differenza tra un errore di sintassi e un errore logico (bug) in un programma?",["L'errore di sintassi è più grave perché distrugge il programma; l'errore logico è minore","L'errore di sintassi blocca il programma; l'errore logico lo lascia girare ma dà risultati sbagliati","L'errore di sintassi dipende dal sistema operativo; l'errore logico dipende dall'hardware","Sono la stessa cosa, chiamata in modo diverso a seconda del linguaggio di programmazione"],1,"Errore di sintassi: il codice non segue le regole del linguaggio — in Scratch quasi impossibile perché i blocchi si incastrano solo se compatibili; nei linguaggi testuali blocca l'esecuzione. Errore logico (bug): il codice è sintatticamente corretto ma fa qualcosa di diverso dall'intenzione del programmatore. Questi sono i più difficili da trovare.",["Non è corretto. Gli errori logici sono spesso più difficili da trovare perché il programma gira normalmente ma dà risultati sbagliati.","Esatto! In Scratch gli errori di sintassi sono quasi impossibili (i blocchi si incastrano solo se compatibili). Gli errori logici sono quelli difficili: il programma gira ma fa la cosa sbagliata.","Non è corretto. Entrambi i tipi di errore sono nel codice, non dipendono dall'hardware o dal sistema operativo.","Non è corretto. Sono due categorie distinte di errori con caratteristiche molto diverse."]],["Un algoritmo di raccomandazione come quello di YouTube usa una struttura 'per ogni video guardato dall'utente: trova altri utenti simili...'. Quale struttura fondamentale è questa?",["Selezione (if/else)","Iterazione (ciclo)","Sequenza","Broadcast"],1,"L'algoritmo di YouTube è costruito con le stesse strutture fondamentali: 'per ogni video guardato dall'utente' è un ciclo (iterazione) su una lista; 'se il video è già stato guardato → salta' è una selezione; 'calcola un punteggio' è un'operazione su variabili. Il testo mostra che anche algoritmi complessi usano solo le tre strutture di base.",["Non è corretto. 'Per ogni video' è una ripetizione su una lista di elementi, non una biforcazione condizionale.","Esatto! 'Per ogni video guardato dall'utente' è un ciclo che itera su una lista. Il testo mostra come l'algoritmo di YouTube sia costruito con cicli, selezioni e operazioni su variabili.","Non è corretto. La sequenza esegue istruzioni in ordine fisso una sola volta. 'Per ogni elemento' è una ripetizione su tutti gli elementi di una collezione.","Non è corretto. Il broadcast è un meccanismo di Scratch per la comunicazione tra sprite, non una struttura di controllo fondamentale degli algoritmi."]],["Nel quiz in Scratch, la variabile 'domanda_corrente' viene usata per accedere agli elementi delle liste. Come funziona questo meccanismo?",["La variabile sceglie casualmente quale domanda mostrare ogni volta","La variabile fa da indice: indica quale posizione della lista leggere","La variabile conta quante domande errate ha fatto l'utente","La variabile contiene il testo della domanda corrente"],1,"La variabile 'domanda_corrente' funziona come indice: inizia a 1 e aumenta di 1 dopo ogni risposta. 'Mostra elemento domanda_corrente della lista domande' accede all'elemento nella posizione corrispondente. Questo meccanismo è detto 'accesso indicizzato' ed è fondamentale per gestire liste in modo dinamico.",["Non è corretto. La variabile 'domanda_corrente' tiene traccia della posizione sequenziale (1, 2, 3...), non di una scelta casuale.","Esatto! 'domanda_corrente' parte da 1 e aumenta di 1 dopo ogni domanda. 'Mostra elemento 3 della lista domande' mostra la terza domanda. È un accesso per indice.","Non è corretto. Le domande errate sarebbero conteggiate in una variabile separata (es. 'errori'). 'domanda_corrente' tiene la posizione nella sequenza delle domande.","Non è corretto. Il testo della domanda è negli elementi della lista 'domande'. La variabile 'domanda_corrente' contiene solo il numero (la posizione) della domanda attuale."]],["Il quiz adattivo avanzato usa due blocchi di domande: uno standard e uno avanzato. Quale struttura permette di scegliere il blocco giusto dopo le prime 3 domande?",["Un ciclo che ripete le domande finché l'utente non le risponde tutte correttamente","Una selezione (if/else) che controlla il punteggio e sceglie la lista","Una sequenza di istruzioni che mostra tutte le domande avanzate a tutti gli utenti","Un broadcast che invia il punteggio allo sprite della schermata finale"],1,"Il quiz adattivo usa una selezione (if/else): 'Se risposte_corrette_blocco1 >= 2, allora usa la lista domande_avanzate per le ultime 2 domande; altrimenti usa domande_base.' È esattamente la logica di Duolingo e Khan Academy: reagire al livello dimostrato con domande appropriate.",["Non è corretto. Un ciclo ripete le istruzioni, ma non sceglie tra blocchi diversi in base al punteggio parziale.","Esatto! Il quiz adattivo usa una selezione: 'se risposte_corrette_blocco1 >= 2 allora usa domande_avanzate, altrimenti usa domande_base'. È logica if/else applicata all'adattività.","Non è corretto. Una sequenza fissa non permette adattività. Per scegliere tra percorsi diversi serve una selezione (if/else).","Non è corretto. Il broadcast coordina la comunicazione tra sprite, ma la scelta del blocco di domande richiede una selezione (if/else) che valuta il punteggio."]]],"A":[["L'algoritmo di raccomandazione di YouTube non è neutrale. Quale problema etico fondamentale crea quando è ottimizzato per massimizzare il tempo di visualizzazione?",["Rallenta il caricamento dei video perché calcola troppe raccomandazioni contemporaneamente","Mostra ciò che trattiene di più l'utente, anche se sensazionalistico, e ne orienta le idee","Funziona solo per gli utenti abbonati a YouTube Premium, escludendo gli altri","Non ha problemi etici: è solo un programma informatico senza implicazioni sociali"],1,"L'algoritmo di YouTube ottimizzato per il tempo di visualizzazione può favorire contenuti che tengono l'utente incollato allo schermo — non necessariamente contenuti che gli fanno bene. Chi progetta l'algoritmo decide cosa viene mostrato e cosa non viene mostrato, influenzando indirettamente ciò che le persone imparano e pensano. 'Un algoritmo di raccomandazione non è neutrale.'",["Non è corretto. Il problema etico non riguarda le prestazioni tecniche, ma le conseguenze sulle scelte e i comportamenti degli utenti.","Esatto! Il testo dice: 'chi decide cosa finisce nella lista dei candidati... sono decisioni che determinano cosa ti viene mostrato, cosa non ti viene mostrato, e indirettamente cosa impari e cosa pensi.'","Non è corretto. L'algoritmo di raccomandazione funziona per tutti gli utenti, non solo per i Premium.","Non è corretto. Il testo afferma esplicitamente che l'algoritmo 'riflette le scelte di chi lo ha costruito' e determina 'cosa impari e cosa pensi'. Gli algoritmi non sono neutri."]],["Il tuo quiz in Scratch non mostra il feedback per le risposte sbagliate. Come potresti trovare il bug usando la strategia di debugging del testo?",["Cancella tutto il codice e ricominciare da zero","Mostrare la variabile 'risposta_utente' sullo stage e controllare che valore contiene","Aggiungere più costumi allo sprite per cambiare l'aspetto quando la risposta è sbagliata","Pubblicare il progetto su internet e chiedere ad altri utenti di testarlo"],1,"La strategia di debugging del testo include: '3. Verifica i valori delle variabili: attiva la visualizzazione delle variabili sullo stage.' Vedere il valore di 'risposta_utente' durante l'esecuzione rivela se il blocco 'Chiedi e aspetta' funziona, e se il confronto con 'risposte_corrette' nella selezione if è corretto. Spesso il bug è in una condizione scritta al contrario.",["Non è corretto. Ricominciare da zero non è una strategia di debugging. Si isola il problema e si corregge solo la parte difettosa.","Esatto! Il testo suggerisce: 'verifica i valori delle variabili: attiva la visualizzazione delle variabili sullo stage.' Vedere il valore di 'risposta_utente' rivela se il confronto with risposta_corretta funziona.","Non è corretto. I costumi riguardano l'aspetto visivo. Il problema è logico (il feedback non viene mostrato), non estetico.","Non è corretto. Prima di pubblicare bisogna fare debugging. Chiedere aiuto a un compagno per rileggere il codice può aiutare, ma è diverso dal pubblicarlo online."]],["Perché la parola 'algoritmo' viene dal nome del matematico al-Khwarizmi? Cosa ci dice questo della storia della matematica?",["Al-Khwarizmi ha inventato i computer nel IX secolo","Il pensiero algoritmico ha radici antiche, nella matematica del mondo islamico","Gli algoritmi possono essere usati solo in matematica, non in altre discipline","La parola algoritmo è moderna, inventata nei laboratori del MIT negli anni '60"],1,"La parola 'algoritmo' deriva dal nome del matematico persiano Muhammad ibn Musa al-Khwarizmi (IX secolo). Le sue opere, tradotte in latino nel Medioevo, introdussero in Europa sia il concetto di algoritmo (procedura risolutiva) sia il sistema di numerazione decimale. Questo mostra come la matematica moderna sia costruita su contributi di culture diverse.",["Non è corretto. Al-Khwarizmi era un matematico del IX secolo; i computer moderni sono stati inventati nel XX secolo.","Esatto! Il testo dice: 'La parola algoritmo viene dal matematico persiano al-Khwarizmi. Le sue opere hanno introdotto in Europa il concetto di algoritmo e il sistema di numerazione decimale.'","Non è corretto. Gli algoritmi si applicano a qualsiasi dominio: cucinare una ricetta, seguire istruzioni di montaggio, risolvere un problema di matematica — tutti sono algoritmi.","Non è corretto. La parola 'algoritmo' deriva dal nome al-Khwarizmi, matematico persiano del IX secolo. Il MIT ha contribuito allo sviluppo del CAD e dell'informatica moderna, ma non all'invenzione del termine."]],["Il testo dice che il quiz ha bisogno di un 'feedback per risposta sbagliata che spieghi perché quella risposta è sbagliata'. Perché questo è pedagogicamente importante rispetto a scrivere solo 'sbagliato'?",["Perché il testo del feedback più lungo fa sembrare il quiz più professionale","Perché capire dove si è sbagliato trasforma il quiz in uno strumento per imparare","Perché il sistema di punteggio di Scratch richiede un testo di feedback per funzionare correttamente","Perché le risposte sbagliate senza feedback non vengono registrate nella variabile punteggio"],1,"Un feedback che spiega 'perché la risposta è sbagliata' è pedagogicamente superiore al semplice 'sbagliato' perché: (1) corregge l'errore di comprensione specifico; (2) spiega il concetto corretto nel contesto dell'errore commesso; (3) trasforma il quiz da strumento di valutazione a strumento di apprendimento. La rubrica della MC richiede feedback esplicativi per il livello ottimo.",["Non è corretto. La lunghezza non è il valore pedagogico. Il valore è nella spiegazione del concetto errato che aiuta la comprensione.","Esatto! Il testo dello scenario dice: 'il professore vuole qualcosa che aiuti chi sbaglia a capire perché la risposta era sbagliata.' Un quiz senza feedback è solo valutazione, non apprendimento.","Non è corretto. Scratch non richiede testo di feedback per gestire il punteggio. Il feedback è una scelta pedagogica, non tecnica.","Non è corretto. La variabile punteggio si aggiorna indipendentemente dalla presenza del feedback. Il feedback è separato dalla logica del punteggio."]],["Perché la storia della falena di Grace Hopper nel 1947 è importante per la storia dell'informatica?",["Perché dimostra che i computer del passato erano molto più affidabili di quelli attuali","Perché da quella falena, trovata dentro un computer, nasce l'uso del termine 'bug'","Perché Grace Hopper ha inventato il linguaggio di programmazione Scratch","Perché dimostra che i computer devono essere tenuti lontani dagli insetti per funzionare correttamente"],1,"Nel settembre 1947, Grace Hopper trovò una falena nel relè 70 del computer Mark II che causava un malfunzionamento. Incollò l'insetto al registro di bordo scrivendo 'First actual case of bug being found.' Da quel giorno, un errore in un programma si chiama 'bug' e trovarlo si chiama 'debugging'. La falena originale è conservata al Museo Nazionale della Storia Americana a Washington.",["Non è corretto. La storia mostra il contrario: i computer a valvole erano fisicamente vulnerabili a guasti causati anche da insetti.","Esatto! Grace Hopper incollò la falena al registro di bordo scrivendo 'First actual case of bug being found.' Da quel giorno un errore in un programma si chiama bug.","Non è corretto. Scratch è stato sviluppato dal MIT Media Lab nel 2003. Grace Hopper ha contribuito a sviluppare i linguaggi FLOW-MATIC e COBOL negli anni '50.","Non è corretto. La storia è aneddotica nella sua origine fisica, ma il significato è linguistico e culturale: da quel momento 'bug' indica qualsiasi errore nel software."]],["Un quiz in Scratch viene testato solo con risposte corrette. Perché questo approccio di test è insufficiente e cosa manca?",["Perché Scratch richiede almeno 10 test per ogni progetto prima di pubblicarlo","Perché non prova le risposte sbagliate o vuote e i casi limite, dove si nascondono i bug","Perché i test con risposte corrette non permettono di vedere i colori del programma","Perché con solo risposte corrette non si può pubblicare il progetto su scratch.mit.edu"],1,"Il test deve coprire tutti i casi rilevanti: (1) caso normale — risposte corrette e sbagliate; (2) casi limite — punteggio 0 (tutte sbagliate) e punteggio massimo (tutte corrette); (3) casi anomali — cosa succede se l'utente non scrive nulla. Un programma che 'gira' in un caso normale può bloccarsi o dare risultati sbagliati in casi limite.",["Non è corretto. Non esiste un requisito numerico minimo di test in Scratch. Il problema è qualitativo: bisogna testare i casi limite e gli scenari negativi.","Esatto! Il testo dice: 'testa sempre il tuo programma con casi diversi: il caso normale, il caso limite, e i casi sbagliati (es. cosa succede se l'utente non scrive nulla e preme invio).'","Non è corretto. I colori del programma si vedono in qualsiasi test. Il problema dei test parziali riguarda la copertura dei casi logici, non l'aspetto visivo.","Non è corretto. La pubblicazione su Scratch non richiede un numero minimo di test. Il test sistematico è una buona pratica di programmazione, non un requisito della piattaforma."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>

html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
</body>
</html>
