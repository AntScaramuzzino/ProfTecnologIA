<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Breadboard virtuale</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

          outputs: [{ key: "v", label: "Tensione su A0", f: (p) => (5 * p.ldr) / (10 + p.ldr), unit: "V", d: 2 }, { key: "a", label: "Valore letto da analogRead()", f: (p, o) => Math.round((o.v / 5) * 1023) }, { key: "led", label: "LED", f: (p, o) => o.a > p.s ? "ACCESO" : "spento" }],

        { type: "quiz", questions: [["Al tramonto il LED si accende e si spegne di continuo. Come si risolve?", ["Con due soglie diverse per accendere e spegnere (isteresi)", "Cambiando colore al LED", "Togliendo il resistore"], 0, "Una soglia di accensione e una un po' più bassa di spegnimento evitano lo sfarfallio vicino al valore limite."]] } ],
      reflect: "Come sceglieresti la soglia nella tua stanza? Quali misure faresti prima?" }],

})();

<script>
window.LABVERIFICA={"id":"MC-ENE-3-04","F":[["Cosa produce il movimento collettivo degli elettroni liberi in un conduttore?",["Corrente elettrica","Un campo magnetico permanente","Calore per attrito tra gli elettroni","Una differenza di potenziale spontanea"],0,"La corrente elettrica è il flusso ordinato di elettroni liberi in un conduttore. Nei conduttori (come il rame), gli elettroni degli strati esterni sono 'liberi' e si spostano facilmente. Senza una tensione che li spinga in una direzione precisa, si muovono in modo casuale. La tensione organizza questo movimento in un flusso unidirezionale.",["Esatto! La corrente elettrica è il flusso ordinato di elettroni liberi in un conduttore. Nei metalli come il rame, gli elettroni degli strati esterni si spostano facilmente da un atomo all'altro.","Non corretto. Il campo magnetico è generato da correnti in movimento (legge di Ampère), non dagli elettroni fermi nel conduttore. La corrente è il movimento collettivo degli elettroni.","Non corretto. Il calore nei conduttori (effetto Joule) è causato dalla resistenza al flusso degli elettroni, non dal movimento degli elettroni in sé. Il movimento ordinato è la corrente elettrica.","Non corretto. La differenza di potenziale (tensione) è la causa del flusso degli elettroni, non il risultato. Il movimento ordinato degli elettroni è la corrente elettrica."]],["In quale unità di misura si misura la tensione elettrica, e in onore di quale scienziato?",["Volt (V), in onore del fisico italiano Alessandro Volta","Ampere (A), in onore del fisico francese André-Marie Ampère","Ohm (Ω), in onore del fisico tedesco Georg Simon Ohm","Watt (W), in onore del inventore della macchina a vapore James Watt"],0,"La tensione (o differenza di potenziale) si misura in volt (V), in onore del fisico italiano Alessandro Volta che costruì la prima pila elettrica nel 1800. La tensione è la 'spinta' che mette in movimento gli elettroni nel conduttore: senza tensione, gli elettroni non scorrono in modo ordinato.",["Esatto! La tensione si misura in volt (V), in onore di Alessandro Volta che costruì la prima pila elettrica nel 1800. La tensione è la 'spinta' che mette in movimento gli elettroni.","Non corretto. L'ampere misura la corrente (quantità di elettroni al secondo), non la tensione. La tensione si misura in volt.","Non corretto. L'ohm misura la resistenza, non la tensione. La tensione si misura in volt (V).","Non corretto. Il watt misura la potenza, non la tensione. La tensione si misura in volt (V), in onore di Alessandro Volta."]],["Qual è la legge di Ohm?",["V = R × I (la tensione è uguale alla resistenza moltiplicata per la corrente)","P = V × t (la potenza è uguale alla tensione moltiplicata per il tempo)","W = F × s (il lavoro è uguale alla forza per lo spostamento)","E = m × c² (l'energia è uguale alla massa per il quadrato della velocità della luce)"],0,"La legge di Ohm (1827): V = R × I. Le tre forme: V = R × I (se conosci R e I calcoli la tensione), I = V/R (se conosci V e R calcoli la corrente), R = V/I (se conosci V e I calcoli la resistenza). È la legge fondamentale dell'elettronica: permette di calcolare qualsiasi grandezza in un circuito conoscendone due.",["Esatto! La legge di Ohm: V = R × I. Si può riscrivere in tre forme: V = R × I, I = V/R, R = V/I. È la legge più usata in tutta l'elettronica.","Non corretto. Quella è una formula dimensionalmente sbagliata. La legge di Ohm è V = R × I. La potenza si calcola con P = V × I.","Non corretto. Quella è la formula del lavoro meccanico. La legge di Ohm riguarda i circuiti elettrici: V = R × I.","Non corretto. Quella è la formula di equivalenza massa-energia di Einstein. La legge di Ohm è V = R × I."]],["Cosa succede in un circuito in serie quando si brucia una lampadina?",["Il circuito si interrompe e tutte le lampadine si spengono","Solo la lampadina bruciata si spegne, le altre rimangono accese","La corrente aumenta nelle lampadine rimanenti compensando la perdita","La tensione aumenta e le lampadine rimanenti diventano più luminose"],0,"In un circuito in serie c'è un unico percorso per la corrente. La corrente è la stessa in ogni punto: I_tot = I_1 = I_2 = I_3. Se una componente si brucia (interruzione), il percorso si spezza e la corrente si azzera ovunque. Esempio storico: le luci di Natale vecchie in serie — una bruciata spegneva tutte.",["Esatto! In un circuito in serie c'è un solo percorso per la corrente. Se una componente si brucia (si interrompe), il circuito diventa aperto e la corrente non scorre: tutte le lampadine si spengono.","Non corretto. Quello è il comportamento di un circuito in PARALLELO. In serie, c'è un unico percorso: se si interrompe, tutta la corrente si ferma.","Non corretto. In un circuito in serie interrotto, non scorre corrente in nessun punto. Non c'è compensazione.","Non corretto. In un circuito in serie interrotto, non scorre corrente: nessuna lampadina si accende. Non c'è aumento di tensione sulle rimanenti."]],["In quale tensione opera la rete elettrica domestica italiana, e perché è pericolosa?",["230 V: già 100 mA possono essere letali se attraversano il cuore","12 V come la batteria di un'auto: sicura per il corpo","400 V come la rete trifase industriale","5 V come il caricatore del telefono: bassa tensione sicura"],0,"La rete elettrica domestica italiana è a 230 V (corrente alternata, 50 Hz). Il testo avverte: 10 mA causano contrazioni muscolari involontarie, 100 mA possono essere letali se attraversano il cuore. Non aprire mai prese o apparecchi, non inserire oggetti metallici nelle prese, non usare apparecchi elettrici vicino all'acqua.",["Esatto! La rete domestica italiana è a 230 V. Il testo avverte che 100 mA (0,1 A) possono essere letali se attraversano il cuore. Con una resistenza corporea di 1000-2000 Ω, 230 V produce correnti ben superiori a questa soglia.","Non corretto. La rete domestica italiana è a 230 V, non 12 V. I 12 V della batteria auto non sono pericolosi per il corpo, ma la rete domestica a 230 V lo è.","Non corretto. La rete domestica italiana è a 230 V (monofase). La rete trifase industriale è a 400 V, ma quella non arriva nelle prese domestiche.","Non corretto. Il caricatore del telefono eroga 5 V in uscita, ma preleva dalla rete domestica a 230 V. La rete domestica italiana è a 230 V."]],["Quale componente elettronico si usa per proteggere un LED dal rischio di bruciarsi quando lo si collega a una batteria?",["Un resistore in serie","Un condensatore in parallelo","Un interruttore in serie","Un diodo in antiparallelo"],0,"Un LED ha tensione di lavoro fissa (1,8-3,3V) e corrente massima (10-30 mA). Collegandolo direttamente a una batteria da 9V, la corrente sarebbe enorme e lo brucerebbe in pochi secondi. Il resistore in serie 'assorbe' la tensione in eccesso (9V - 2V_LED = 7V) e limita la corrente a un valore sicuro: R = V/I = 7/0,02 = 350Ω.",["Esatto! Un LED ha una tensione di lavoro fissa (1,8-3,3V) e massima corrente (10-30 mA). Senza resistore in serie, la corrente sarebbe determinata solo dalla differenza di tensione tra batteria e LED divisa per la (bassissima) resistenza interna del LED: brucerebbe istantaneamente.","Non corretto. Il condensatore non limita la corrente in modo stabile in un circuito DC. Il componente da usare per proteggere un LED è un resistore in serie.","Non corretto. L'interruttore apre o chiude il circuito (tutto o niente) ma non limita la corrente quando il circuito è chiuso. Per proteggere il LED serve un resistore che dissipa la tensione in eccesso.","Non corretto. Un diodo in antiparallelo proteggerebbe da tensioni inverse, non dalla corrente eccessiva. Per limitare la corrente e proteggere il LED si usa un resistore in serie."]]],"I":[["In un circuito con tre resistenze in parallelo (60Ω, 30Ω, 20Ω) alimentato a 12V, la corrente si divide nei tre rami. Qual è la corrente nel ramo da 30Ω?",["0,4 A: I = V/R = 12/30 = 0,4 A","0,2 A: la corrente si divide equamente tra i tre rami","1,2 A: la corrente totale scorre tutta nel ramo con meno resistenza","0,6 A: è il ramo con la resistenza maggiore e porta più corrente"],0,"In un circuito in parallelo, la tensione è uguale su tutti i rami (V_tot = V_1 = V_2 = V_3). La corrente in ogni ramo si calcola con la legge di Ohm: I_ramo = V/R_ramo. Per il ramo da 30Ω: I = 12V/30Ω = 0,4A. La corrente è maggiore nei rami con meno resistenza.",["Esatto! In un circuito in parallelo, la tensione è uguale su tutti i rami. La corrente in ogni ramo si calcola con la legge di Ohm: I = V/R = 12V/30Ω = 0,4 A.","Non corretto. In parallelo la corrente non si divide equamente: si divide in modo inversamente proporzionale alla resistenza. Il ramo da 30Ω porta più corrente del ramo da 60Ω.","Non corretto. In parallelo, tutta la corrente non scorre nel solo ramo a minor resistenza. Ogni ramo porta I = V/R: il ramo da 20Ω porta 0,6A, quello da 30Ω porta 0,4A, quello da 60Ω porta 0,2A.","Non corretto. Il ramo da 30Ω non è quello con resistenza maggiore (60Ω lo è). E in ogni caso, in parallelo la corrente è maggiore nel ramo con meno resistenza, non di più."]],["Il testo spiega che la rete elettrica domestica usa corrente alternata (AC) a 50 Hz mentre i dispositivi digitali usano corrente continua (DC). Come viene gestita questa incompatibilità dai caricatori?",["Il caricatore converte la AC della presa (230V) in DC a bassa tensione (es. 5V) usando un trasformatore e un raddrizzatore","I dispositivi digitali moderni sono progettati per funzionare direttamente con la corrente alternata dalla rete","La rete fornisce sia AC che DC su prese diverse: le prese tonde sono AC e quelle piatte sono DC","La corrente alternata e continua sono equivalenti: i dispositivi funzionano ugualmente con entrambe"],0,"Il caricatore è un convertitore AC→DC: preleva l'AC a 230V dalla rete domestica, usa un trasformatore per abbassarla, un raddrizzatore (diodi) per convertirla in DC pulsante, e un filtro (condensatore) per stabilizzarla. Il risultato è DC a bassa tensione (5V per telefoni, 19V per laptop) usabile dai dispositivi digitali che richiedono tensione continua stabile.",["Esatto! Il caricatore contiene: un trasformatore (abbassa la tensione da 230V a una tensione intermedia), un raddrizzatore (diodi che convertono AC in DC pulsante), e spesso un filtro (condensatore che 'liscia' la DC). Il risultato: 5V DC per il telefono.","Non corretto. I processori e le batterie richiedono corrente continua (DC) a bassa tensione. La conversione AC→DC è essenziale.","Non corretto. Le prese domestiche italiane forniscono solo AC a 230V. Non esiste una distribuzione domestica standard di DC.","Non corretto. AC e DC non sono equivalenti per i dispositivi elettronici. I processori, le batterie e i circuiti integrati richiedono DC stabile a bassa tensione."]],["Perché l'impianto elettrico domestico è collegato in parallelo (invece che in serie)?",["Perché ogni utenza riceve la tensione piena (230V) e funziona indipendentemente dalle altre: spegnere una luce non spegne le altre","Perché il parallelo usa meno rame dei fili, riducendo i costi di installazione","Perché la corrente alternata funziona solo con circuiti in parallelo, non in serie","Perché la legge italiana obbliga a usare circuiti in parallelo per le abitazioni"],0,"L'impianto domestico in parallelo garantisce che: 1) ogni utenza riceve sempre la tensione piena (230V), 2) l'accensione/spegnimento di un'utenza non influenza le altre, 3) un guasto o un fusibile saltato in un circuito non spegne l'intera abitazione. In serie, ogni aggiunta di utenze ridurrebbe la tensione disponibile per le altre.",["Esatto! In parallelo ogni ramo è connesso direttamente ai due poli dell'alimentazione: riceve sempre 230V indipendentemente dagli altri. Se un fusibile salta in un circuito, gli altri continuano a funzionare. In serie sarebbe impossibile.","Non corretto. Il parallelo non necessariamente usa meno rame. La ragione principale è funzionale: ogni utenza deve funzionare indipendentemente dalle altre con la tensione piena.","Non corretto. La corrente alternata può scorrere sia in serie sia in parallelo. La scelta del parallelo per l'impianto domestico è funzionale, non una limitazione della AC.","Non corretto. Non esiste una legge che imponga il parallelo per ragioni formali. È una necessità tecnica: le utenze devono funzionare indipendentemente con tensione piena."]],["La struttura del programma Arduino (sketch) ha due funzioni: setup() e loop(). Qual è la differenza fondamentale tra loro?",["setup() si esegue una sola volta all'avvio, loop() si ripete continuamente all'infinito","setup() gestisce i segnali analogici, loop() gestisce i segnali digitali","setup() è eseguita ogni secondo, loop() è eseguita ogni millisecondo","setup() gestisce gli input, loop() gestisce gli output"],0,"Lo sketch Arduino ha sempre due funzioni: void setup() esegue il codice di configurazione una sola volta all'avvio (es. pinMode per dichiarare i pin come input/output), void loop() esegue il codice principale in ciclo continuo per sempre (es. leggere sensori, accendere LED, inviare dati). È la struttura fondamentale di qualsiasi programma per microcontrollore.",["Esatto! setup() viene eseguita una sola volta quando l'Arduino si avvia (o resetta): si usa per configurare i pin, inizializzare la comunicazione seriale. loop() si esegue in ciclo continuo per sempre: contiene il comportamento principale del programma.","Non corretto. La distinzione non riguarda analogico vs digitale. setup() si esegue una volta (configurazione), loop() si ripete continuamente (comportamento principale).","Non corretto. setup() si esegue una sola volta all'avvio, non ogni secondo. loop() si ripete continuamente il più velocemente possibile, non ad intervalli fissi di 1 ms.","Non corretto. Sia setup() sia loop() possono gestire sia input sia output. La differenza è temporale: setup() una volta sola, loop() in continuazione."]],["Nel caso studio del LED su breadboard, si calcola che serve un resistore da 350Ω per collegare un LED rosso (2V, 20mA) a una batteria da 9V. Come si ottiene questo valore?",["R = (V_batteria - V_LED) / I = (9V - 2V) / 0,02A = 7V / 0,02A = 350Ω","R = V_batteria / I = 9V / 0,02A = 450Ω","R = V_LED / I = 2V / 0,02A = 100Ω","R si sceglie a caso tra i valori standard: 330Ω o 470Ω vanno bene entrambi"],0,"Calcolo del resistore di protezione per LED: V_R = V_batteria - V_LED = 9V - 2V = 7V (la tensione che deve 'cadere' sul resistore). I_desiderata = 20 mA = 0,02 A. Per la legge di Ohm: R = V_R / I = 7V / 0,02A = 350Ω. In commercio si usa il valore standard più vicino: 330Ω o 390Ω.",["Esatto! La tensione che 'cade' sulla resistenza è: V_R = V_batteria - V_LED = 9V - 2V = 7V. La corrente desiderata è I = 20 mA = 0,02A. Per la legge di Ohm: R = V_R / I = 7/0,02 = 350Ω.","Non corretto. Non si usa la tensione totale della batteria: si usa la tensione che rimane dopo la caduta sul LED (9V - 2V = 7V). R = 7/0,02 = 350Ω, non 450Ω.","Non corretto. Non si usa solo la tensione del LED. Il resistore deve 'smaltire' la differenza tra la tensione della batteria (9V) e quella del LED (2V): R = (9-2)/0,02 = 350Ω.","Non corretto. Il calcolo ha un valore preciso (350Ω). Se si sceglie un valore standard diverso (330Ω o 390Ω) la corrente sarà leggermente diversa ma accettabile. Non è però un'operazione casuale."]],["Il differenziale (salvavita) si scatta in meno di 30 millisecondi quando rileva una differenza di corrente tra fase e neutro. Perché questa velocità è fondamentale?",["Perché la fibrillazione ventricolare (aritmia mortale) causata dalla corrente elettrica può iniziare entro 50-100 ms dall'esposizione, quindi il salvavita deve interrompere il circuito prima di quel limite","Perché i trasformatori del quartiere richiedono un ripristino di 30 ms prima di riattivare la fornitura","Perché la normativa europea fissa arbitrariamente 30 ms come standard di sicurezza","Perché a 30 ms la corrente di dispersione ha già sciolto i fili e l'interruzione è comunque tardiva"],0,"Il differenziale rileva la differenza di corrente tra fase e neutro: se una persona tocca la fase, parte della corrente 'scappa' attraverso il suo corpo verso terra → la differenza supera la soglia (30 mA) → il differenziale si scatta in \u003c30 ms. Questa velocità è fondamentale perché la fibrillazione cardiaca (mortale) può iniziare in 50-100 ms dall'esposizione a correnti di 50-100 mA.",["Esatto! Il cuore è molto sensibile alle correnti elettriche: la fibrillazione ventricolare può iniziare in decine di millisecondi. Il differenziale a 30 ms garantisce l'interruzione prima che si manifesti l'aritmia mortale.","Non corretto. Il tempo di 30 ms non riguarda i trasformatori. È il tempo necessario per proteggere il cuore umano dall'aritmia causata dalla corrente elettrica.","Non corretto. Il valore di 30 ms non è arbitrario: è basato sui tempi di risposta fisiologica del cuore umano alla corrente elettrica. La normativa recepisce questo requisito fisiologico.","Non corretto. I fili non si sciolgono in 30 ms in condizioni normali (richiederebbe sovracorrenti molto maggiori per molto più tempo). Il 30 ms è il tempo per proteggere il cuore dall'aritmia."]]],"A":[["Il testo descrive un problema di design del sistema di segnalazione scolastica: un LED verde (porta aperta) e un LED rosso (porta chiusa) da 9V con autonomia di 30 giorni. Come si calcola la capacità minima della batteria necessaria?",["Capacità = I × t = 15 mA × (8 ore/giorno × 30 giorni) = 15 mA × 240 ore = 3.600 mAh = 3,6 Ah","Capacità = P / V = (15mA × 9V) / 9V = 15 mAh per giornata","Non è possibile calcolare la capacità senza conoscere la resistenza interna della batteria","Capacità = V × t = 9V × 30 giorni = 270 Vd (volt-giorni)"],0,"Calcolo autonomia batteria: consumo = 15 mA, tempo di utilizzo = 8 ore/giorno × 30 giorni = 240 ore. Capacità necessaria = I × t = 15 mA × 240 h = 3.600 mAh = 3,6 Ah. Una batteria 9V standard ha ~500 mAh: durebbe solo 500/15 = 33 ore. Per 30 giorni a 8 h/giorno serve una batteria ~7 volte più grande, o una fonte di alimentazione continua.",["Esatto! La capacità della batteria si misura in mAh (milliampere-ora). Con 15 mA di consumo continuo per 8 ore al giorno per 30 giorni: 15 mA × (8 × 30) h = 15 mA × 240 h = 3.600 mAh = 3,6 Ah. Una batteria da 9V standard ha circa 500-600 mAh: servono batterie molto più grandi o una fonte esterna.","Non corretto. La formula dimensionale non è corretta. La capacità in mAh = corrente (mA) × tempo (h). Con 15 mA per 8 ore/giorno per 30 giorni = 3.600 mAh, non 15 mAh.","Non corretto. Per stimare la capacità necessaria non serve la resistenza interna. Si usa: capacità (mAh) = corrente (mA) × tempo (h).","Non corretto. 'Volt-giorni' non è un'unità di capacità della batteria. La capacità si misura in mAh (milliampere-ora): corrente × tempo."]],["Il testo afferma che '10 mA possono causare contrazioni muscolari involontarie' e '100 mA possono essere letali'. Una persona ha resistenza corporea di 1.500Ω. Quale tensione produce esattamente 100 mA attraverso il corpo?",["V = R × I = 1.500Ω × 0,1A = 150V: una tensione inferiore ai 230V domestici ma già potenzialmente letale","V = I / R = 0,1A / 1.500Ω = 0,00007V: una tensione trascurabile","V = R / I = 1.500Ω / 0,1A = 15.000V: solo le alte tensioni industriali sono pericolose","La tensione letale dipende solo dall'intensità della corrente, non dalla resistenza corporea"],0,"Per la legge di Ohm: V = R × I = 1.500Ω × 0,1A = 150V. Questo significa che già a 150V si raggiunge la soglia letale (100 mA). La rete domestica a 230V produce: I = 230V/1.500Ω = 153 mA, ben oltre 100 mA. Nota: la resistenza corporea varia molto (1.000-100.000Ω) e si riduce con la pelle bagnata, aumentando ulteriormente il pericolo.",["Esatto! Per la legge di Ohm: V = R × I = 1.500Ω × 0,1A = 150V. Quindi anche una tensione di 150V (inferiore ai 230V domestici) può essere letale con questa resistenza corporea. I 230V domestici producono 230/1.500 = 153 mA, ben oltre la soglia letale di 100 mA.","Non corretto. La formula è invertita. Per calcolare la tensione: V = R × I = 1.500Ω × 0,1A = 150V. I/R non dà volt ma A²/Ω.","Non corretto. La formula è sbagliata. Per calcolare la tensione dalla resistenza e dalla corrente: V = R × I = 1.500 × 0,1 = 150V. Anche 150V è già potenzialmente letale.","Non corretto. La corrente attraverso il corpo dipende da tensione E resistenza (I = V/R). La stessa tensione produce corrente diversa in persone con resistenza corporea diversa (pelle asciutta vs bagnata)."]],["L'invenzione del circuito integrato (Kilby, 1958) ha permesso di miniaturizzare l'elettronica 'da una stanza intera a un'unghia'. Quale implicazione tecnologica fondamentale ha avuto questa miniaturizzazione?",["Ha permesso di integrare miliardi di funzioni logiche in dispositivi tascabili, abilitando l'informatica personale, i telefoni cellulari e ogni dispositivo digitale moderno","Ha permesso di aumentare la velocità della corrente elettrica nei conduttori","Ha eliminato la necessità della legge di Ohm nei circuiti digitali moderni","Ha reso possibile la corrente alternata nei dispositivi portatili"],0,"Il circuito integrato (Kilby, Texas Instruments, 1958) ha integrato in un singolo chip di silicio componenti che prima richiedevano volumi enormi. Il processore del tuo telefono contiene miliardi di transistor in un chip delle dimensioni di un'unghia. Questo ha abilitato tutta l'elettronica moderna: personal computer, telefoni cellulari, IoT, AI accelerata.",["Esatto! Prima del CI, un computer occupava una stanza. Con i CI, tutta la logica computazionale di una stanza può stare in un chip di pochi mm². Questo ha reso possibile: personal computer, telefoni cellulari, sensori, controller industriali — ogni dispositivo digitale moderno.","Non corretto. La velocità della corrente nei conduttori (vicina alla velocità della luce) non dipende dalla miniaturizzazione dei circuiti. Il vantaggio del CI è l'integrazione di miliardi di funzioni logiche in poco spazio.","Non corretto. La legge di Ohm vale in tutti i circuiti elettrici, inclusi quelli integrati. La miniaturizzazione non ha cambiato le leggi fisiche fondamentali.","Non corretto. I dispositivi portatili usano corrente continua (DC) da batteria. L'AC non è diventata disponibile portatile grazie ai CI. Il CI ha miniaturizzato la logica computazionale."]],["Il testo descrive un sistema LDR (fotoresistore) con un resistore fisso da 10kΩ che forma un 'divisore di tensione'. Come funziona questo sistema per rilevare la luce?",["Al buio il LDR ha alta resistenza → la tensione nel punto di mezzo è alta. Con luce il LDR ha bassa resistenza → tensione nel punto di mezzo bassa. Arduino legge questa variazione di tensione come informazione sulla luce","Il LDR produce corrente quando colpito dalla luce, come una cella fotovoltaica miniaturizzata","Il resistore da 10kΩ amplifica il segnale del LDR, rendendo le variazioni di luce più grandi e quindi più facili da leggere","Il LDR e il resistore creano una corrente che aumenta linearmente con la luminosità, leggibile direttamente in lux"],0,"Il divisore di tensione LDR + 10kΩ: V_medio = 5V × 10kΩ/(R_LDR + 10kΩ). Al buio: R_LDR è grande (100kΩ) → V_medio = 5V × 10k/110k ≈ 0,45V. Con luce: R_LDR piccolo (1kΩ) → V_medio = 5V × 10k/11k ≈ 4,5V. Arduino A0 legge questa tensione (0-1023) e decide quando accendere il LED comparandola con la soglia.",["Esatto! Il divisore di tensione con LDR: nel punto di mezzo V_medio = V_alim × R_fissa / (R_LDR + R_fissa). Al buio R_LDR è grande → V_medio alto. Con luce R_LDR è piccolo → V_medio basso. Arduino legge V_medio tramite il pin analogico A0 e lo converte in un valore 0-1023.","Non corretto. Il LDR non produce corrente: varia la sua resistenza in base alla luce. La corrente proviene dall'alimentazione di Arduino. Il LDR è un componente passivo, non attivo.","Non corretto. Il resistore da 10kΩ non amplifica: crea un partitore di tensione. Il pin analogico di Arduino legge direttamente la tensione nel punto di mezzo senza amplificazione.","Non corretto. Il pin analogico di Arduino legge una tensione (0-5V → 0-1023) non direttamente in lux. La conversione in lux richiederebbe una calibrazione separata."]],["Il testo spiega che le luci di Natale vecchie erano in serie (se una si bruciava, si spegnevano tutte), mentre quelle moderne LED sono in parallelo. Quale scelta progettuale sottostante ha cambiato la configurazione del circuito?",["Le lampadine tradizionali incandescenti richiedevano alta tensione (serie di 20 lampadine × 12V = 240V) perché a bassa tensione il filamento non raggiungeva la temperatura di incandescenza; i LED funzionano efficientemente a 2-3V permettendo il parallelo","I LED sono in parallelo solo per ragioni estetiche: è più facile cambiarli quando si rompono","La normativa di sicurezza elettrica europea ha vietato i circuiti in serie per le decorazioni domestiche","I LED in parallelo consumano meno energia delle lampadine in serie, per questo si è cambiata la configurazione"],0,"Le vecchie lucine a incandescenza erano in serie perché ogni lampadina richiedeva circa 12V e 20 in serie sommavano a 240V dalla rete. I LED funzionano efficientemente a 2-3V: messi in parallelo su un'alimentazione a 3-4V, ognuno riceve la sua tensione di lavoro ottimale, funziona indipendentemente dagli altri, e non crea problemi se uno si brucia.",["Esatto! Le vecchie lucine erano in serie perché ogni lampadina richiedeva una certa tensione (es. 12V × 20 = 240V dalla rete). I LED funzionano a 2-3V: se messi in parallelo ciascuno riceve 2-3V dall'alimentatore, senza il problema di dividere la tensione totale in serie.","Non corretto. La ragione è tecnica: i LED funzionano efficientemente a basse tensioni (2-3V) che si possono applicare in parallelo. Non è solo facilità di manutenzione.","Non corretto. Non esiste tale divieto specifico. Il cambiamento è tecnologico: i LED funzionano a bassa tensione permettendo il parallelo.","Non corretto. I LED consumano meno delle lampadine a incandescenza, ma questa differenza non è la ragione del cambio di configurazione. La ragione è la tensione di lavoro dei LED (2-3V invece dei 12V delle lampadine)."]],["Il testo descrive il 'stand-by' come un costo reale: '50-100 euro annui per famiglia'. Calcolando con la legge di Ohm e la formula della potenza, se un televisore in stand-by consuma 0,5W a 230V, quanta corrente assorbe e quanto pesa sulla bolletta in un anno?",["I = P/V = 0,5W/230V ≈ 2,2 mA; in un anno: 0,5W × 8.760 h = 4,38 kWh ≈ 1,10 € (a 0,25 €/kWh)","I = P × V = 0,5W × 230V = 115A: la corrente è enorme e il televisore si brucerebbe","La corrente di stand-by non si può calcolare dalla potenza senza conoscere la resistenza interna del televisore","In stand-by la corrente è zero perché il dispositivo non consuma energia"],0,"Stand-by TV da 0,5W: Corrente I = P/V = 0,5W/230V ≈ 0,0022A = 2,2 mA. Energia annua = 0,0005 kW × 8.760 h = 4,38 kWh ≈ 1,10 €/anno. Con 15-20 dispositivi in stand-by (TV, decoder, microwaves, caricatori, router...) si raggiungono facilmente 50-100 €/anno. La soluzione: spegnere dalla presa, non dal telecomando.",["Esatto! Corrente: I = P/V = 0,5/230 ≈ 0,0022A = 2,2 mA. Energia annua: P × t = 0,0005 kW × 8.760 h = 4,38 kWh. Costo: 4,38 × 0,25 = 1,10 €/anno per questo solo dispositivo. Con 10-20 dispositivi in stand-by, si arriva facilmente ai 50-100 €/anno citati nel testo.","Non corretto. La formula è sbagliata: I = P/V (non P × V). 0,5W/230V = 0,0022A = 2,2 mA. La formula corretta divide la potenza per la tensione.","Non corretto. Con potenza e tensione note, la corrente si calcola direttamente: I = P/V. La resistenza del televisore in stand-by si ricava poi da R = V²/P = 230²/0,5 = 105.800Ω (circa 106 kΩ).","Non corretto. Il stand-by consuma energia: circuiti di controllo remoto, display, sensori rimangono attivi. Il consumo è piccolo (0,5-5W) ma non zero, e moltiplicato per 8.760 ore/anno diventa significativo."]]]};

(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
</body>
</html>
