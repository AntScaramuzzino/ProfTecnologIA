<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Banco dei metalli</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
window.LABVERIFICA={"id":"MC-MAT-1-05","F":[["Quale minerale è la fonte principale del ferro usato nell'industria siderurgica?",["Ematite (Fe₂O₃)","Bauxite","Calcopirite","Ilmenite"],0,"I principali minerali metallici: ematite (Fe₂O₃) per il ferro, bauxite per l'alluminio, calcopirite (CuFeS₂) per il rame, ilmenite (FeTiO₃) per il titanio. Le miniere di ematite più grandi si trovano in Australia, Brasile e Cina. Da una tonnellata di ematite si ricavano circa 700 kg di ferro.",["Esatto! L'ematite è il minerale di ferro più importante. Da una tonnellata di ematite si ricavano circa 700 kg di ferro.","Non corretto. La bauxite è il minerale da cui si ricava l'alluminio, non il ferro.","Non corretto. La calcopirite è il minerale principale del rame, non del ferro.","Non corretto. L'ilmenite è il minerale principale del titanio. Il minerale del ferro è l'ematite (Fe₂O₃)."]],["Qual è la differenza tra ghisa e acciaio in termini di percentuale di carbonio?",["Ghisa: 2-4,5% carbonio; acciaio: 0,02-2% carbonio","Ghisa: 0-1% carbonio; acciaio: 5-10% carbonio","Ghisa: 0% carbonio (ferro puro); acciaio: 1-3% carbonio","Non c'è differenza: ghisa e acciaio contengono la stessa quantità di carbonio"],0,"Ghisa: ferro + 2-4,5% carbonio. Acciaio: ferro + 0,02-2% carbonio. Questa differenza apparentemente piccola produce proprietà radicalmente diverse: la ghisa è dura ma fragile (si spezza senza deformarsi), l'acciaio è più tenace e si deforma prima di rompersi (duttile).",["Esatto! La ghisa contiene il 2-4,5% di carbonio. L'acciaio ha una percentuale molto inferiore: 0,02-2%. Questa piccola differenza cambia completamente le proprietà meccaniche.","Non corretto. È l'inverso: la ghisa ha più carbonio (2-4,5%) dell'acciaio (0,02-2%).","Non corretto. La ghisa non è ferro puro: contiene il 2-4,5% di carbonio. L'acciaio ha meno carbonio (0,02-2%).","Non corretto. La differenza nella percentuale di carbonio (ghisa: 2-4,5%; acciaio: 0,02-2%) è esattamente ciò che distingue i due materiali e ne determina le diverse proprietà."]],["L'acciaio inossidabile non arrugginisce grazie alla presenza di cromo. Come funziona questa protezione?",["Il cromo forma uno strato sottilissimo di ossido di cromo (circa 2 nanometri) che sigilla la superficie impedendo all'ossigeno di raggiungere il ferro sottostante","Il cromo assorbe l'ossigeno dell'aria rendendolo inerte e incapace di ossidare il ferro","Il cromo è idrorepellente e impedisce all'acqua di raggiungere il ferro, evitando la ruggine","Il cromo aumenta la densità dell'acciaio rendendo impossibile la penetrazione dell'ossigeno"],0,"L'acciaio inossidabile contiene almeno 10,5% di cromo. Il cromo forma spontaneamente uno strato di ossido di cromo (Cr₂O₃) sulla superficie, trasparente (~2 nanometri) e aderente. Questo strato protegge il ferro sottostante dall'ossidazione. Se graffiato, si auto-ripara esponendo la superficie all'aria.",["Esatto! Il cromo a contatto con l'ossigeno forma Cr₂O₃, uno strato protettivo trasparente (~2 nm) e aderente. Questo strato si auto-ripara se graffiato: basta esporre la superficie all'aria e lo strato si ricostituisce.","Non corretto. Il cromo non 'assorbe' l'ossigeno dell'aria in senso generale. Forma un ossido di cromo specifico sulla superficie che protegge il ferro sottostante.","Non corretto. Il cromo non è idrorepellente. Il meccanismo protettivo è la formazione di uno strato di ossido di cromo che si forma spontaneamente a contatto con l'aria.","Non corretto. La densità aumentata non protegge dalla corrosione. La protezione è chimica: lo strato di ossido di cromo sulla superficie."]],["Quanto pesa un litro di acqua da uno strumento di cucina in acciaio rispetto allo stesso volume in alluminio?",["L'acciaio pesa circa 3 volte l'alluminio (densità: acciaio 7,8 g/cm³, alluminio 2,7 g/cm³)","L'acciaio pesa il doppio dell'alluminio","Acciaio e alluminio hanno la stessa densità, ma l'alluminio è più caro","L'alluminio è più pesante dell'acciaio per la stessa resistenza meccanica"],0,"Densità dei principali metalli: acciaio 7,8 g/cm³, alluminio 2,7 g/cm³, rame 8,9 g/cm³, titanio 4,5 g/cm³, ghisa 7,2 g/cm³. L'alluminio è circa 3 volte più leggero dell'acciaio: un telaio di bici in alluminio pesa 1,0-1,4 kg contro i 2,2-2,8 kg di uno in acciaio delle stesse dimensioni.",["Esatto! La densità dell'acciaio è 7,8 g/cm³, dell'alluminio 2,7 g/cm³: rapporto 7,8/2,7 ≈ 2,9 ≈ 3. A parità di volume, l'acciaio pesa quasi 3 volte di più. È per questo che l'alluminio è usato dove il peso è critico.","Non corretto. Il rapporto delle densità è 7,8/2,7 ≈ 2,9 ≈ 3, non 2. L'acciaio pesa quasi 3 volte l'alluminio a parità di volume.","Non corretto. Le densità sono molto diverse: acciaio 7,8 g/cm³, alluminio 2,7 g/cm³. L'alluminio è circa 3 volte più leggero dell'acciaio.","Non corretto. L'alluminio è più leggero dell'acciaio (densità 2,7 vs 7,8 g/cm³). Inoltre, la resistenza specifica (resistenza per unità di peso) dell'alluminio è comparabile all'acciaio dolce."]],["Il rame è il secondo metallo migliore conduttore elettrico dopo l'argento. Perché non si usa l'argento per i fili elettrici?",["Perché l'argento costa circa 100 volte più del rame e la differenza di conduttività non giustifica il costo aggiuntivo","Perché l'argento è troppo duro per essere trafilato in fili sottili","Perché l'argento si ossida rapidamente nell'aria formando uno strato isolante","Perché l'argento non esiste in quantità sufficiente sulla Terra per costruire impianti elettrici"],0,"Conduttività elettrica: argento 62 MS/m, rame 58 MS/m, alluminio 37 MS/m, ferro 10 MS/m. L'argento conduce il 7% meglio del rame, ma costa ~100 volte di più. Per le applicazioni pratiche (fili elettrici, motori, trasformatori) il rame offre il miglior rapporto conduttività/costo.",["Esatto! L'argento conduce leggermente meglio del rame (62 vs 58 MS/m) ma costa circa 100 volte di più. Per le applicazioni elettriche comuni, la differenza di conduttività non giustifica il costo enorme dell'argento.","Non corretto. L'argento è molto duttile (anche più del rame) e può essere trafilato in fili sottilissimi. Il motivo per cui non si usa è il costo: circa 100 volte più caro del rame.","Non corretto. L'argento si ossida lentamente in alcune condizioni (soprattutto in presenza di zolfo), ma non forma uno strato isolante come la ruggine del ferro. Il motivo per preferire il rame è il costo.","Non corretto. L'argento non è rarissimo, ma anche se fosse abbondante, il suo costo (100 volte il rame) lo renderebbe economicamente impraticabile per i cavi elettrici ordinari."]],["Qual è il processo termico che si applica a una lama d'acciaio per renderla dura e poi si aggiunge il 'rinvenimento' per ridurne la fragilità?",["Tempra: riscaldamento a 800-900°C seguito da raffreddamento rapido in acqua o olio","Ricottura: riscaldamento lento e raffreddamento molto lento per ammorbidire l'acciaio","Cementazione: esposizione dell'acciaio al carbonio ad alta temperatura per aumentarne la durezza","Forgiatura: martellamento dell'acciaio caldo per comprimere il reticolo cristallino"],0,"Trattamenti termici dell'acciaio: Tempra = riscaldamento a 800-900°C + raffreddamento rapido → durezza alta, fragilità alta. Rinvenimento = dopo la tempra, riscaldamento a 150-650°C + raffreddamento lento → riduce fragilità mantenendo durezza. Ricottura = riscaldamento + raffreddamento lento → ammorbidisce, aumenta duttilità. Cementazione = aggiunge carbonio agli strati superficiali.",["Esatto! La tempra riscalda l'acciaio a 800-900°C poi lo raffredda rapidamente: produce acciaio molto duro ma anche molto fragile. Il rinvenimento successivo (riscaldamento a temperatura più bassa) riduce la fragilità mantenendo parte della durezza.","Non corretto. La ricottura produce l'effetto opposto: ammorbidisce l'acciaio. Per indurirlo si usa la tempra (riscaldamento + raffreddamento rapido).","Non corretto. La cementazione è un trattamento superficiale che aggiunge carbonio agli strati esterni dell'acciaio. La tempra è il processo che indurisce l'acciaio raffreddandolo rapidamente.","Non corretto. La forgiatura è una lavorazione meccanica (deformazione plastica), non un trattamento termico. La tempra è il processo chimico-termico che indurisce l'acciaio."]]],"I":[["Il testo spiega che la ghisa è 'dura ma fragile' mentre l'acciaio è 'duttile'. Perché questa differenza rende pericolosa la ghisa nelle applicazioni strutturali?",["Perché la ghisa si rompe all'improvviso senza dare segnali visibili di cedimento, mentre l'acciaio si deforma prima di rompersi avvisando del pericolo","Perché la ghisa è più pesante dell'acciaio e quindi le strutture sarebbero troppo pesanti per reggersi","Perché la ghisa non si può saldare e quindi le strutture sarebbero tenute insieme solo da bulloni","Perché la ghisa arrugginisce molto più velocemente dell'acciaio nelle strutture all'esterno"],0,"La fragilità è il problema strutturale della ghisa: non si deforma plasticamente prima della rottura (basso allungamento prima della rottura). L'acciaio invece è duttile: prima di rompersi si deforma visibilmente, avvisando del pericolo imminente. Nei ponti in ghisa del XIX secolo, il cedimento era improvviso e senza preavviso — per questo l'acciaio li ha sostituiti.",["Esatto! La duttilità dell'acciaio è una caratteristica di sicurezza strutturale: prima di rompersi l'acciaio si piega visibilmente (deformazione plastica), segnalando il pericolo. La ghisa si rompe di colpo senza preavviso visivo: questo ha causato i cedimenti improvvisi dei ponti in ghisa nel XIX secolo.","Non corretto. La ghisa ha densità simile all'acciaio (7,2 vs 7,8 g/cm³). Il problema della ghisa nelle strutture non è il peso ma la fragilità (rottura improvvisa senza deformazione preventiva).","Non corretto (parzialmente vero). La ghisa è difficile da saldare, ma il problema principale nelle applicazioni strutturali è la fragilità: si rompe senza preavviso, a differenza dell'acciaio che si deforma prima.","Non corretto. Il tasso di corrosione della ghisa non è significativamente diverso da quello dell'acciaio non trattato. Il problema strutturale è la fragilità, non la corrosione."]],["L'altoforno usa coke (carbone trasformato) per ridurre il minerale di ferro. Qual è il ruolo chimico preciso del coke in questo processo?",["Il carbonio del coke produce monossido di carbonio (CO) che 'ruba' l'ossigeno dall'ossido di ferro (Fe₂O₃), liberando ferro metallico","Il coke brucia producendo il calore necessario per sciogliere il minerale di ferro","Il coke agisce come catalizzatore che accelera la separazione del ferro dall'ossigeno senza reagire direttamente","Il coke separa fisicamente le impurità della roccia dal ferro grazie alla sua struttura porosa"],0,"Chimica dell'altoforno: 1) C + O₂ → CO₂ (coke brucia). 2) CO₂ + C → 2CO (monossido si forma). 3) Fe₂O₃ + 3CO → 2Fe + 3CO₂ (CO riduce il ferro). Il CO è il vero agente riducente: 'ruba' l'ossigeno dall'ossido di ferro, liberando ferro metallico. Il calcare (CaCO₃) serve a rimuovere le impurità silicee formando la scoria.",["Esatto! Il coke brucia producendo CO₂, che a sua volta reagisce con altro coke formando CO (monossido). Il CO è l'agente riducente vero: reagisce con Fe₂O₃ cedendogli carbonio e 'rubandogli' l'ossigeno → Fe₂O₃ + 3CO → 2Fe + 3CO₂.","Non corretto (parzialmente vero). Il coke produce calore, ma non solo. Il suo ruolo chimico principale è fornire il monossido di carbonio (CO) che riduce chimicamente il Fe₂O₃ in ferro metallico.","Non corretto. Il coke non è un catalizzatore (che resta invariato): viene consumato nel processo, prima convertendosi in CO₂ e poi in CO. È un reagente attivo, non un catalizzatore.","Non corretto. La separazione delle impurità è il ruolo del calcare (che forma la scoria). Il coke è un agente riducente chimico che fornisce il CO necessario per estrarre il ferro dall'ossido."]],["Il testo descrive le 'leghe di alluminio serie 7000' (alluminio-zinco-magnesio) come aventi 'resistenza comparabile a certi acciai da costruzione, con un terzo del peso'. Come si spiega questa affermazione paradossale?",["La 'resistenza specifica' (resistenza meccanica divisa per la densità) delle leghe 7000 è paragonabile o superiore all'acciaio: stessa forza per meno peso, non stessa forza per stesso peso","Le leghe 7000 sono più dense dell'alluminio puro e quasi ugualmente dense all'acciaio","'Comparabile' significa che si può usare la lega 7000 al posto dell'acciaio in qualsiasi applicazione senza modifiche","L'affermazione è un errore: nessuna lega di alluminio può avere resistenza paragonabile all'acciaio"],0,"La 'resistenza specifica' = resistenza a trazione / densità. Confronto dalla tabella: lega Al 7075-T6 ha 572/2,81 = 203 MPa·cm³/g; acciaio dolce: 400/7,8 = 51. La lega 7075 è 4 volte 'più resistente per unità di peso' dell'acciaio dolce. Per costruire una struttura della stessa resistenza, l'alluminio 7075 pesa circa 3-4 volte meno dell'acciaio.",["Esatto! Il confronto è sulla 'resistenza specifica' = resistenza a trazione / densità. Lega Al 7075-T6: 572 MPa / 2,81 g/cm³ = 203 MPa·dm³/g. Acciaio dolce: 400 MPa / 7,8 g/cm³ = 51 MPa·dm³/g. La lega 7075 ha resistenza specifica 4 volte l'acciaio dolce.","Non corretto. Le leghe 7000 hanno densità simile all'alluminio puro (~2,81 g/cm³), molto inferiore all'acciaio (7,8 g/cm³). Il vantaggio è proprio la minor densità combinata con alta resistenza.","Non corretto. 'Comparabile' sulla resistenza specifica non significa intercambiabilità totale. Ci sono differenze in modulo elastico, resistenza alla fatica, saldabilità, costo che rendono la sostituzione non sempre diretta.","Non corretto. La tabella nel testo mostra chiaramente che la lega Al 7075-T6 ha resistenza a trazione di 572 MPa, paragonabile a certi acciai da costruzione (es. acciaio dolce: 400 MPa), con densità 2,81 g/cm³ contro 7,8 g/cm³ dell'acciaio."]],["Il testo spiega che l'acciaio zincato protegge il ferro in due modi. Quale secondo meccanismo opera anche quando la superficie è graffiata e il ferro è esposto?",["Il meccanismo dell'anodo sacrificale: lo zinco si corrode al posto del ferro perché ha potenziale elettrochimico più basso, proteggendo il ferro esposto anche senza barriera fisica","Il secondo meccanismo è la sigillatura automatica dei graffi grazie all'ossido di zinco che si espande riempiendo le fessure","Il secondo meccanismo è l'emissione di ioni di zinco che neutralizzano l'acido nell'acqua evitando la corrosione del ferro","Il secondo meccanismo non esiste: se la zincatura è graffiata, il ferro si corrode esattamente come se non fosse zincato"],0,"L'acciaio zincato protegge in due modi: 1) meccanismo fisico: lo strato di zinco forma una barriera tra ferro e ambiente. 2) meccanismo galvanico (anodo sacrificale): lo zinco ha potenziale elettrochimico più basso del ferro → in presenza di umidità, lo zinco si corrode preferenzialmente. Anche dove il ferro è esposto (graffio), il zinco circostante 'si sacrifica' proteggendo il ferro.",["Esatto! Lo zinco ha potenziale elettrochimico più basso del ferro: in presenza di umidità, lo zinco si ossida preferenzialmente al posto del ferro ('si sacrifica'). Anche dove la superficie è graffiata e il ferro è esposto, il zinco circostante continua a proteggere il ferro dal corrode.","Non corretto. L'ossido di zinco non 'riempie' le fessure fisicamente. Il meccanismo protettivo è elettrochimico: lo zinco si corrode preferenzialmente al ferro (anodo sacrificale) proteggendo chimicamente il ferro esposto.","Non corretto. Il meccanismo non è la neutralizzazione dell'acido ma la protezione elettrochimica: lo zinco ha potenziale più negativo del ferro e si ossida preferenzialmente, proteggendo il ferro anche dove è esposto.","Non corretto. La protezione galvanica (anodo sacrificale) è il secondo meccanismo reale: lo zinco si corrode preferenzialmente al ferro anche in assenza di barriera fisica continua."]],["Il testo descrive come il rame si copre di verderame (patina verde) nel tempo. Perché questa patina protegge il rame, mentre la ruggine del ferro non protegge l'acciaio?",["La patina del rame (idrossicarbonato di rame) è densa e aderente, sigillando la superficie; la ruggine del ferro è porosa e lascia filtrare aria e acqua verso il metallo sottostante","Il verderame è un colore decorativo, non protettivo; il rame si protegge da un altro meccanismo","Il rame non si corrode perché è nobile come l'oro e non reagisce con nessun agente atmosferico","La ruggine del ferro è protettiva quanto il verderame del rame, ma il ferro si corrode ugualmente perché reagisce con l'acqua"],0,"Differenza critica tra patine: Verderame del rame (Cu₂(OH)₂CO₃) = denso, aderente, impermeabile → sigilla la superficie → protezione. Ruggine del ferro (Fe₂O₃·nH₂O) = porosa, voluminosa (occupa più spazio del ferro originale) → lascia filtrare O₂ e H₂O → corrosione progressiva verso l'interno. Per questo il ferro senza protezione continua a corrodersi mentre il rame si auto-protegge.",["Esatto! La differenza critica è la struttura dello strato di ossidazione: la patina del rame (Cu₂(OH)₂CO₃) è compatta e aderisce al metallo sottostante, bloccando l'accesso di ulteriore ossigeno. La ruggine (Fe₂O₃·nH₂O) è porosa: lascia filtrare ossigeno e acqua verso il ferro, continuando la corrosione verso l'interno.","Non corretto. Il verderame (patina) è un meccanismo protettivo reale, non solo decorativo. La Statua della Libertà è in rame e la sua patina verde la protegge dalla corrosione ulteriore.","Non corretto. Il rame reagisce con l'aria umida e la CO₂ formando l'idrossicarbonato di rame (verderame). Non è inerte come l'oro. La differenza è che la patina formata è protettiva.","Non corretto. La ruggine non è protettiva come il verderame: è porosa e permette la corrosione progressiva verso l'interno. Il verderame è protettivo perché è denso e aderente."]],["La bicicletta da corsa professionale in fibra di carbonio pesa meno di 700g di telaio e ha resistenza a trazione fino a 1.500 MPa. Perché il testo la include nella sezione 'I metalli in una bicicletta' pur non essendo un metallo?",["Perché la fibra di carbonio è il termine di confronto obbligato per valutare la resistenza specifica dei metalli: capire perché i professionisti la usano aiuta a capire i limiti di ciascun metallo","Perché la fibra di carbonio contiene particelle di metallo che la rendono classificabile come lega metallica","Perché la fibra di carbonio è prodotta dall'industria siderurgica usando altiforni simili a quelli dell'acciaio","Perché la bici da corsa professionale usa componenti in fibra di carbonio insieme a componenti in metallo, quindi è un caso misto"],0,"La fibra di carbonio è inclusa come termine di confronto estremo: telaio in carbonio 0,6-0,9 kg, acciaio 2,2-2,8 kg, alluminio 1,0-1,4 kg, titanio 1,1-1,3 kg. Questo confronto rende comprensibile perché i professionisti usano il carbonio nonostante il costo elevatissimo (1.500-5.000€ solo per il telaio) e la minore riparabilità. Il confronto chiarisce i trade-off di ciascun materiale metallico.",["Esatto! Includere il carbonio permette di contestualizzare le prestazioni dei metalli: l'acciaio da 2,2 kg di telaio vs il carbonio da 0,7 kg. Questo confronto rende comprensibili i trade-off di peso, costo, riparabilità e sostenibilità di ciascun materiale.","Non corretto. La fibra di carbonio è un composito (fibre di carbonio + resina epossidica), non una lega metallica. Viene inclusa nel confronto come benchmark delle prestazioni, non per la sua composizione.","Non corretto. La fibra di carbonio è prodotta da poliacrilonitrile (PAN) o da pece attraverso processi completamente diversi dall'altoforno. È inclusa come termine di confronto per le prestazioni.","Non corretto (parzialmente vero). Sebbene una bici da corsa mescoli materiali, la ragione principale è che il carbonio è il benchmark di prestazione rispetto al quale si valutano i metalli."]]],"A":[["Il testo afferma che la corrosione costa globalmente circa il 3,4% del PIL mondiale (~2.500 miliardi di dollari). Quale implicazione ha questo dato per le scelte progettuali dei materiali?",["Il costo della corrosione deve essere incluso nel costo totale di vita del prodotto (LCA): un materiale più costoso ma anticorrosivo può avere un costo di ciclo di vita inferiore a uno economico ma soggetto a corrosione","Significa che si dovrebbe sempre usare oro o platino per qualsiasi applicazione esterna perché non arrugginiscono","Significa che la corrosione è inevitabile e non vale la pena investire in protezioni anticorrosive","Il dato è irrilevante per un progettista individuale perché riguarda scala globale, non prodotti specifici"],0,"Il costo della corrosione (~3,4% PIL mondiale) emerge dall'analisi del ciclo di vita: sostituire strutture corrose, manutenere ponti, riparare tubazioni, fare ispezioni. Implicazione progettuale: scegliere il materiale non solo per il costo iniziale ma per il costo totale di vita. Acciaio inox più costoso ma con vita utile 3-5 volte superiore può costare meno dell'acciaio comune su 30 anni.",["Esatto! Il costo iniziale di un materiale è solo una parte del costo totale. Acciaio inossidabile per una grondaia costa 3 volte l'acciaio zincato, ma dura 50+ anni contro 20-30 anni. Sul ciclo di vita, il costo può essere equivalente o inferiore se si incluono manutenzione, sostituzione, interruzione del servizio.","Non corretto. L'oro e il platino non arrugginiscono ma il loro costo è proibitivo per applicazioni strutturali. Il punto è ottimizzare il rapporto costo/durata in base all'applicazione specifica.","Non corretto. Al contrario: l'enorme costo della corrosione giustifica gli investimenti in protezioni anticorrosive (zincatura, verniciatura, acciai speciali, anodi sacrificali) che riducono significativamente i costi nel lungo periodo.","Non corretto. Anche per prodotti specifici, il costo della corrosione è rilevante: una struttura corrosa richiede manutenzione, sostituzione, ispezioni. Questi costi vanno inclusi nel progetto fin dalla fase di scelta del materiale."]],["Il titanio ha il rapporto resistenza/peso più alto tra tutti i metalli strutturali. Eppure non ha sostituito l'alluminio e l'acciaio nella maggior parte delle applicazioni. Quale analisi economica spiega questa persistenza?",["Il costo di estrazione (processo Kroll) e lavorazione del titanio è 10-20 volte superiore a quello dell'acciaio: il vantaggio prestazionale non giustifica il costo aggiuntivo per la maggior parte delle applicazioni","Il titanio non viene usato perché è troppo pesante per le applicazioni moderne","Il titanio non viene usato perché le sue leghe non sono mai state studiate abbastanza per le applicazioni industriali","Il titanio è pericoloso per la salute umana e non può essere usato in applicazioni a contatto con persone"],0,"Il titanio ha il miglior rapporto resistenza/peso ma il processo Kroll (riduzione di TiCl₄) è costoso: il titanio costa 5-20 volte l'acciaio a parità di peso. Per applicazioni dove il peso non è critico (costruzioni, automobili economiche, mobili), il costo aggiuntivo non è giustificato. Il titanio domina dove il peso è critico e il costo non è il vincolo principale: aerospaziale, medicina, sport d'élite.",["Esatto! Il titanio eccelle sulla resistenza specifica ma il processo Kroll (riduzione di TiCl₄ con magnesio o sodio) è lungo, energivoro e costoso. Una bici in titanio costa 5-10 volte una in acciaio equivalente. Per la maggior parte delle applicazioni (dove il peso non è critico), l'acciaio o l'alluminio offrono il miglior rapporto prestazioni/costo.","Non corretto. Il titanio (densità 4,5 g/cm³) è più leggero dell'acciaio (7,8 g/cm³). Il problema non è il peso ma il costo di produzione.","Non corretto. Le leghe di titanio (Ti-6Al-4V, Ti-3Al-2.5V) sono ampiamente studiate e usate in aeronautica, protesi mediche, sport di alta gamma. Il limite è il costo, non la conoscenza tecnica.","Non corretto. Il titanio ha eccellente biocompatibilità: è usato in impianti dentali, protesi ortopediche (ginocchia artificiali, anche artificiali), e viti per fratture ossee. Il limite è il costo, non la sicurezza."]],["Il testo afferma che 'ogni robot che vedi in una fabbrica è una combinazione di macchine semplici' — analogia applicata ai metalli: 'ogni allega è ferro/alluminio/rame con impurità controllate'. Quale principio metodologico comune rivela questa analogia?",["La comprensione dei fondamentali (macchine semplici, metalli puri) fornisce gli strumenti per analizzare qualsiasi sistema complesso come combinazione di principi elementari comprensibili","Significa che le leghe e i robot sono equivalenti e possono essere usati in modo intercambiabile nelle industrie","Significa che i robot usano leghe metalliche per i loro componenti e quindi vanno studiati insieme alla metallurgia","Significa che le proprietà delle leghe sono completamente prevedibili dai componenti, senza bisogno di sperimentazione"],0,"Il principio metodologico comune: i fondamentali (metalli puri, macchine semplici) forniscono gli strumenti concettuali per analizzare sistemi complessi (leghe, robot). Un metallurgista esperto capisce le leghe di nickel per jet engine analizzandole come nickel con impurità controllate di cromo, cobalto, molibdeno — ciascuna con effetto preciso sul reticolo cristallino. I fondamentali rendono comprensibile la complessità.",["Esatto! Le leghe non sono 'materiali misteriosi': sono combinazioni di metalli puri con impurità controllate le cui proprietà emergono dai principi fisici elementari (reticolo cristallino, legami metallici, difetti di reticolo). Capire i fondamentali (metalli puri, cristallografia) permette di progettare leghe con proprietà specifiche.","Non corretto. L'analogia non implica intercambiabilità ma un principio metodologico: la comprensione dei fondamentali (materiali puri per le leghe, macchine semplici per i robot) permette di analizzare e progettare sistemi complessi.","Non corretto. L'analogia è metodologica (capire i fondamentali), non pratica (i robot usano leghe). Il punto è l'approccio riduzionista: i sistemi complessi si capiscono analizzandoli come combinazioni di elementi semplici.","Non corretto. Sebbene i principi fondamentali guidino la progettazione delle leghe, la sperimentazione rimane essenziale: le interazioni tra gli atomi in una lega complessa producono comportamenti che non si predicono semplicemente dalle proprietà dei metalli puri."]],["Il testo presenta la matrice di valutazione per scegliere il materiale delle paline stradali. La soluzione 'acciaio dolce verniciato' ha costo basso (80€) ma scarsa resistenza alla corrosione. Come un progettista dovrebbe confrontare il costo iniziale con il costo di vita del prodotto?",["Calcolare il costo per anno di servizio (costo totale incluse manutenzione e sostituzione diviso anni di vita utile) e confrontarlo tra le opzioni: il materiale più economico all'acquisto può costare di più nel lungo periodo","Il costo iniziale è sempre il criterio decisivo: scegliere sempre il materiale più economico","Il costo del materiale è irrilevante: la scelta si basa solo sulla resistenza meccanica e alla corrosione","Non si può fare questa analisi senza sapere il futuro prezzo dell'acciaio nei prossimi 20 anni"],0,"Analisi del costo di vita: non confrontare solo il prezzo di acquisto ma il costo per anno di servizio = (prezzo iniziale + costi di manutenzione + costi di sostituzione) / anni di vita utile. Acciaio verniciato: economico inizialmente ma richiede verniciatura periodica (5-7 anni) e sostituzione prima degli altri. Acciaio Corten o inox: più costoso inizialmente ma nessuna manutenzione per 20+ anni → costo annuale potenzialmente inferiore.",["Esatto! Costo di vita per anno: acciaio verniciato (80€ + 20€ manutenzione verniciatura ogni 3 anni) × 20 anni ≈ (80 + 133) = 213€ / 20 = 10,65€/anno. Acciaio inox (280€ senza manutenzione) / 20+ anni ≈ 14€/anno. Il confronto dipende dalla vita utile e dalla frequenza di manutenzione.","Non corretto. Il costo iniziale non include manutenzione, sostituzione, interruzione del servizio. Per applicazioni con lunga vita utile richiesta (20 anni), il costo totale di proprietà può invertire la classifica economica.","Non corretto. Il costo è esplicitamente uno dei criteri del capitolato tecnico (350€ massimo per palina). La scelta ottimale bilancia resistenza meccanica, anticorrosione, E costo.","Non corretto. L'analisi del costo di vita si basa su dati storici e stime ragionevoli. L'incertezza sul prezzo futuro è un fattore di rischio da includere nell'analisi, non un motivo per non farla."]],["Il testo descrive la 'saldabilità' come proprietà tecnologica che varia molto tra i metalli. Perché la ghisa è 'difficilissima da saldare' mentre l'acciaio al carbonio medio è 'il più saldabile in assoluto'?",["La ghisa ha alto contenuto di carbonio (2-4,5%) che durante la saldatura si ossida producendo CO₂ che crea porosità nella saldatura e rende il raffreddamento non uniforme, causando cricche","La ghisa non si può saldare perché fonde a temperatura troppo alta per le saldatrici normali","La ghisa non si può saldare perché contiene zolfo che inquina la saldatura","La ghisa è difficile da saldare perché è troppo porosa e l'elettrodo non riesce a fondere con il materiale base"],0,"La saldabilità dipende principalmente dal contenuto di carbonio: più carbonio = più difficile da saldare. Acciaio dolce (0,1-0,3% C) è il più saldabile: basso carbonio, struttura uniforme, raffreddamento uniforme. Ghisa (2-4,5% C): durante il raffreddamento rapido della zona di saldatura il carbonio forma martensite fragile e la struttura non si unisce uniformemente, causando cricche.",["Esatto! La ghisa è difficile da saldare per l'alto contenuto di carbonio: durante il raffreddamento rapido localizzato della saldatura, il carbonio forma martenssite fragile; la grafite già presente nella ghisa interferisce con la fusione dei bordi; il raffreddamento non uniforme crea tensioni che causano cricche.","Non corretto. La ghisa fonde a temperature comparabili o inferiori all'acciaio (1.150-1.200°C vs 1.370-1.540°C). Il problema non è la temperatura di fusione ma l'alto contenuto di carbonio che causa fragilità durante il raffreddamento.","Non corretto. La ghisa non contiene necessariamente molto zolfo. Il problema è l'alto contenuto di carbonio (2-4,5%) che causa fragilità durante il raffreddamento rapido della zona di saldatura.","Non corretto. La ghisa non è porosa nel senso usuale. Il problema è metallurgico: l'alto carbonio forma strutture fragili durante il raffreddamento rapido della saldatura."]],["Il testo afferma che 'ogni auto moderna è già progettata per essere smontata' con il 95% del peso recuperabile a fine vita (normativa UE). Quale implicazione ha questa affermazione per il rapporto tra design dei prodotti e economia circolare?",["La normativa UE ha forzato i produttori a integrare il riciclo nel processo di design (design for disassembly): la fine vita del prodotto è ora parte del vincolo di progettazione dall'inizio, non un problema gestito dopo","Significa che le auto non producono rifiuti perché tutto viene riciclato al 100%","Significa che è obbligatorio per i consumatori portare la loro auto in un centro di riciclo autorizzato a fine vita","La normativa UE si applica solo alle auto prodotte dopo il 2025: le vecchie auto non devono rispettare questi standard"],0,"La normativa UE sui veicoli a fine vita (95% recuperabilità) ha trasformato il processo di design: i progettisti devono considerare la disassemblabilità e la riciclabilità dei materiali già nelle fasi iniziali. Questo è il design for disassembly applicato su scala industriale: separare acciaio (magneti), alluminio (eddy currents), rame (separazione manuale) richiede che i componenti siano fisicamente separabili nel design originale.",["Esatto! La normativa EU sulla fine vita dei veicoli ha trasformato il design delle auto: i progettisti devono ora considerare la separabilità dei materiali (acciaio, alluminio, rame, plastica) fin dalla fase di design. Non è gestione post-hoc dei rifiuti: è integrazione della circolarità nel processo produttivo.","Non corretto. Il 95% recuperabile non significa zero rifiuti: il 5% rimanente (fluidi, materiali compositi difficili da separare, vetri trattati) non è recuperabile. Il 95% è un obiettivo ampio che include recupero energetico oltre al riciclo materiale.","Non corretto (parzialmente rilevante). Esiste l'obbligo di consegna a centri autorizzati, ma l'implicazione principale del testo riguarda il design for disassembly: la normativa ha cambiato come le auto vengono progettate, non solo come vengono smaltite.","Non corretto. La Direttiva End-of-Life Vehicles (2000/53/CE) si applica a tutti i veicoli, non solo quelli nuovi. Il 95% di recuperabilità riguarda tutti i veicoli smaltiti dal 2015."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
</body>
</html>
