<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Punto di fuga</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
function prosp(p) {
  const W = 600, H = 340, oy = H - p.oriz * H / 100, vx = p.pf * W / 100;
  const x0 = 120, y0 = H - 40, w = p.w * 24, h = p.h * 24, t = p.prof / 100;
  const F = [[x0, y0], [x0 + w, y0], [x0 + w, y0 - h], [x0, y0 - h]];
  const B = F.map(([x, y]) => [x + (vx - x) * t, y + (oy - y) * t]);
  const L = (a, b, st) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="stroke:var(--fg)" ${st || 'stroke-width="2.2"'}/>`;
  const G = (a) => `<line x1="${a[0]}" y1="${a[1]}" x2="${vx}" y2="${oy}" style="stroke:var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>`;
  const vis = (i) => !((i === 0 && vx > x0 && oy < y0) || (i === 1 && vx < x0 + w && oy < y0) || (i === 3 && vx > x0 && oy > y0 - h) || (i === 2 && vx < x0 + w && oy > y0 - h));
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px;display:block" role="img" aria-label="Scatola in prospettiva centrale">`;
  s += `<line x1="0" y1="${oy}" x2="${W}" y2="${oy}" style="stroke:var(--area)" stroke-width="1.5"/><text x="6" y="${oy - 6}" font-size="12" style="fill:var(--area)" font-family="Inter,sans-serif">linea d'orizzonte</text><circle cx="${vx}" cy="${oy}" r="5" style="fill:var(--energy)"/><text x="${vx + 8}" y="${oy - 8}" font-size="12" style="fill:var(--energy)" font-family="Inter,sans-serif">PF</text>`;
  F.forEach((a) => (s += G(a)));
  for (let i = 0; i < 4; i++) { s += L(B[i], B[(i + 1) % 4], 'stroke-width="1.4" stroke-dasharray="6 4" opacity=".7"'); s += vis(i) ? L(F[i], B[i]) : L(F[i], B[i], 'stroke-width="1.4" stroke-dasharray="6 4" opacity=".7"'); }
  for (let i = 0; i < 4; i++) s += L(F[i], F[(i + 1) % 4]);
  return s + "</svg>";
}

  id: "MC-DIS-3-01", area: "DIS", classe: 3, titolo: "Punto di fuga", archetipo: "Tavolo grafico",
  hook: "Dal segno al volume: la prospettiva rappresenta le cose come le vede l'occhio, con le linee che si incontrano all'orizzonte. Il design parte da qui, ma poi passa per un metodo: capire chi userà l'oggetto.",
  levels: [
    { brief: "Costruisci una scatola in prospettiva centrale: la faccia frontale resta un rettangolo, le linee di profondità vanno tutte al punto di fuga (PF). Sposta orizzonte e PF.",
      blocks: [
        { type: "sim", params: [{ id: "oriz", label: "Altezza della linea d'orizzonte", min: 10, max: 95, step: 1, value: 67, unit: "%" }, { id: "pf", label: "Posizione del punto di fuga", min: 0, max: 100, step: 1, value: 60, unit: "%" }, { id: "w", label: "Larghezza della faccia frontale", min: 2, max: 18, step: 0.5, value: 4, unit: "cm" }, { id: "h", label: "Altezza della faccia frontale", min: 2, max: 11, step: 0.5, value: 3, unit: "cm" }, { id: "prof", label: "Profondità (verso il PF)", min: 5, max: 80, step: 1, value: 35, unit: "%" }],
          draw: prosp, outputs: [{ key: "vista", label: "Che cosa vedi della scatola", f: (p) => (p.oriz > 12 ? "la faccia superiore" : "la faccia inferiore") + (p.pf > 45 ? " e il lato destro" : p.pf < 25 ? " e il lato sinistro" : "") }],
          note: (p) => p.oriz < 12 ? ["warn", "Orizzonte sotto la scatola: la guardi dal basso, come un grattacielo visto dalla strada."] : null },
        { type: "order", title: "La costruzione sul foglio", items: [["Traccia la linea d'orizzonte a circa 2/3 dell'altezza del foglio", ""], ["Segna il punto di fuga sull'orizzonte", ""], ["Disegna la faccia frontale: un rettangolo 4 × 3 cm", "In prospettiva centrale la faccia frontale non si deforma."], ["Dai quattro angoli traccia linee leggere verso il PF", ""], ["Scegli la profondità e chiudi la faccia posteriore con linee parallele a quelle frontali", ""], ["Ripassa i contorni visibili e cancella le linee di costruzione", ""]] } ],
      reflect: "Prova a mettere il punto di fuga dietro la scatola: che cosa succede alla faccia superiore? E al lato?" },
    { brief: "Assonometria e prospettiva hanno usi diversi. Poi riordina le fasi del design thinking, il metodo che userai nel progetto.",

          ["Quale delle due è più vicina a come vede l'occhio?", ["L'assonometria", "La prospettiva"], 1, "Per questo si usa nei render e nelle presentazioni ai clienti."],
          ["La prospettiva accidentale ha…", ["un punto di fuga", "due punti di fuga sull'orizzonte", "nessun punto di fuga"], 1, "L'oggetto è ruotato rispetto a chi guarda: le due direzioni orizzontali fuggono verso due punti diversi."]] },
        { type: "order", title: "Design thinking in cinque mosse", items: [["Empatizza: osserva e intervista chi userà l'oggetto", ""], ["Definisci il problema in una frase", ""], ["Genera idee, tante, senza giudicarle subito", ""], ["Costruisci un prototipo veloce", "Cartone, nastro adesivo, un modello 3D grezzo."], ["Testa con gli utenti e torna indietro se serve", "Il processo è un ciclo, non una linea retta."]] } ],
      reflect: "Hai disegnato la scatola da scarpe nei due modi. Quale mostreresti a un cliente? Quale a chi la deve produrre?" },
    { label: "Scenario · il porta-matite", brief: "Un'azienda di cancelleria chiede un porta-matite che risolva problemi veri: matite che rotolano, pennarelli che restano aperti, forbici senza posto sicuro. Vincoli: altezza massima 15 cm, ingombro massimo 12 × 12 cm, realizzabile in stampa 3D o compensato.",
      blocks: [
        { type: "canvas", fields: [["ric", "Ricerca: 3 problemi osservati su scrivanie reali", ""], ["def", "Il problema in una frase", "Come potremmo…"], ["idee", "Tre idee diverse", ""], ["scelta", "Idea scelta: misure e materiale", "es. 11 × 11 × 14 cm, compensato da 4 mm"], ["erg", "Ergonomia: come si prende una matita con una mano sola?", ""]],
          checks: [["Tre problemi osservati", (v) => v.ric.split(/[\n;]/).filter((x) => x.trim()).length >= 3], ["Misure dichiarate", (v) => /\d+\s*[×x]\s*\d+/.test(v.scelta)], ["Rispetta 15 cm di altezza e 12 × 12 di ingombro", (v) => { const n = (v.scelta.match(/\d+(?:[.,]\d+)?/g) || []).map((x) => +x.replace(",", ".")); return n.length >= 3 && n[0] <= 12 && n[1] <= 12 && n[2] <= 15; }], ["Hai pensato all'uso con una mano sola", (v) => v.erg.length > 20]],
          out: (v) => `BRIEF DI PROGETTO: PORTA-MATITE\n\nRicerca:\n${v.ric}\n\nProblema: ${v.def}\n\nIdee:\n${v.idee}\n\nSoluzione scelta: ${v.scelta}\n\nErgonomia: ${v.erg}` } ],
      reflect: "Che cosa hai cambiato dopo aver fatto provare il prototipo a un compagno?" }],
  bridge: "Progetta e disegna un oggetto utile per la tua camera: prima le 3 viste ortogonali quotate, poi l'assonometria isometrica e infine uno schizzo in prospettiva.",
});

(function(){

    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }

    t.addEventListener('click',()=>select(t));

      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}

  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},

    copy(btn,text){

    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-DIS-3-01","F":[["Nella prospettiva centrale, tutte le rette parallele alla direzione di vista convergono verso un unico punto sulla linea d'orizzonte. Come si chiama questo punto?",["Punto di fuga","Fulcro visivo","Centro ottico","Punto di convergenza zenitale"],0,"Nella prospettiva centrale (a un punto di fuga), le rette parallele alla direzione di vista convergono verso il punto di fuga sulla linea d'orizzonte. Le rette parallele al piano del quadro rimangono orizzontali o verticali.",["Esatto! Il punto di fuga è il punto sulla linea d'orizzonte verso cui convergono le rette nella prospettiva centrale.","Non corretto. Il fulcro è un termine della meccanica. Il punto corretto si chiama punto di fuga.","Non corretto. Il centro ottico è un termine dell'ottica. In prospettiva si parla di punto di fuga.","Non corretto. Non esiste questo termine nella prospettiva tecnica. Il termine corretto è punto di fuga."]],["In quale anno Walter Gropius fondò il Bauhaus, la scuola che unì arte e tecnica nella progettazione industriale?",["1919","1870","1945","1982"],0,"Il Bauhaus fu fondato da Walter Gropius nel 1919 a Weimar con una tesi radicale: arte e tecnica non sono opposti. Un oggetto bello e un oggetto funzionale possono e devono essere la stessa cosa.",["Esatto! Gropius fondò il Bauhaus a Weimar nel 1919, segnando la nascita formale del design industriale moderno.","Non corretto. Nel 1870 non fu fondato il Bauhaus. La data corretta è il 1919.","Non corretto. Il 1945 è successivo alla chiusura del Bauhaus. La fondazione avvenne nel 1919.","Non corretto. Il 1982 è l'anno del lancio di AutoCAD, non della fondazione del Bauhaus."]],["Nell'assonometria le misure reali vengono conservate. Nella prospettiva invece cosa succede alle misure?",["Vengono deformate intenzionalmente per simulare la percezione visiva","Vengono conservate esattamente come nell'assonometria","Vengono raddoppiate per renderle più visibili","Vengono eliminate dal disegno"],0,"Differenza chiave: nell'assonometria le misure sono conservate (o ridotte con fattore costante), nella prospettiva vengono deformate intenzionalmente per simulare la percezione visiva. Per questo l'assonometria è lo strumento del tecnico, la prospettiva del designer.",["Esatto! La prospettiva non conserva le misure ma le deforma per riprodurre come gli oggetti appaiono all'occhio umano.","Non corretto. A differenza dell'assonometria, nella prospettiva le misure vengono deformate, non conservate.","Non corretto. Le misure non vengono raddoppiate ma deformate in modo prospettico.","Non corretto. Le misure non vengono eliminate ma deformate per simulare la percezione umana."]],["La disciplina che studia come adattare oggetti e ambienti alle caratteristiche fisiche e cognitive degli esseri umani si chiama:",["Ergonomia","Biomeccanica","Cenestesia","Morfologia del prodotto"],0,"L'ergonomia nasce come disciplina durante la Seconda guerra mondiale per migliorare le interfacce di cockpit. Il suo principio fondamentale è il design centrato sull'utente (UCD): l'oggetto si adatta alle persone, non le persone all'oggetto.",["Esatto! L'ergonomia è la disciplina che adatta oggetti, strumenti e ambienti alle caratteristiche fisiche e cognitive umane.","Non corretto. La biomeccanica studia il movimento del corpo, non l'adattamento degli oggetti alle persone.","Non corretto. La cenestesia riguarda la percezione corporea interna. La disciplina descritta è l'ergonomia.","Non corretto. La morfologia studia la forma degli oggetti, non il loro adattamento alle persone. Il termine corretto è ergonomia."]],["Nella prospettiva accidentale (a due punti di fuga), quali elementi dell'oggetto rimangono verticali nel disegno?",["Solo le rette verticali dell'oggetto","Tutte le rette parallele alla linea d'orizzonte","Le rette che formano angoli di 45° rispetto al piano","Nessuna retta rimane verticale"],0,"In prospettiva accidentale (2 punti di fuga): le rette orizzontali verso destra convergono verso PF1, quelle verso sinistra verso PF2. Solo le rette verticali degli oggetti rimangono verticali nel disegno.",["Esatto! In prospettiva accidentale le rette orizzontali convergono verso PF1 o PF2, ma le rette verticali degli oggetti rimangono verticali.","Non corretto. Le rette orizzontali convergono verso i punti di fuga. Solo le verticali rimangono verticali.","Non corretto. Non sono le rette a 45° a rimanere verticali. In prospettiva accidentale rimangono verticali solo le rette verticali dell'oggetto.","Non corretto. Gli spigoli verticali degli oggetti rimangono verticali anche in prospettiva accidentale."]],["Nel processo progettuale del designer, qual è il primo passo dopo aver ricevuto il brief?",["La ricerca: osservare chi userà l'oggetto e in quale contesto","Il render: produrre subito una rappresentazione visiva del prodotto finale","La prototipazione: costruire un modello fisico dell'oggetto","Lo sketching: disegnare subito più idee possibili"],0,"Il processo progettuale segue: Brief → Ricerca → Concept → Sketch definito → Render → Prototipo → Test → Iterazione. La ricerca viene prima del disegno: si capisce chi userà l'oggetto, in quale contesto, e quali problemi ha l'utente.",["Esatto! Prima di disegnare, il designer osserva, intervista, studia l'utente. La ricerca include osservazione, interviste, analisi dei prodotti esistenti.","Non corretto. Il render arriva dopo il concept, non subito dopo il brief. Il primo passo è la ricerca sull'utente.","Non corretto. Il prototipo si costruisce dopo il concept e il render, non subito dopo il brief.","Non corretto. Lo sketching (concept) viene dopo la ricerca. Prima si capisce il problema, poi si generano le idee."]]],"I":[["La sedia Serie 7 di Jacobsen (1955) ha una scocca a doppia curvatura nel compensato. Perché questa forma è stata scelta invece di una scocca piatta?",["La doppia curvatura distribuisce il carico su tutta la superficie, è più resistente e si adatta alla curva della schiena","Perché la doppia curvatura è più economica da produrre rispetto alla forma piatta","Perché le norme di sicurezza degli anni '50 richiedevano superfici curve nelle sedie","Perché il compensato piatto non esisteva come materiale all'epoca"],0,"Jacobsen partì da un vincolo materiale: il compensato può essere curvato in doppia curvatura con pressione e calore. Questa forma distribuisce il carico su tutta la superficie (più resistente del piano), si adatta alla curva della schiena, ed è prodotta da una tecnologia specifica. Ogni curva ha una ragione tecnica.",["Esatto! La doppia curvatura non è decorativa: distribuisce il carico strutturalmente, è più resistente di una scocca piatta, e segue le curve naturali del corpo.","Non corretto. La curvatura doppia richiede tecniche specifiche di pressione e calore. L'obiettivo era la funzione strutturale ed ergonomica, non il risparmio.","Non corretto. Non esistono tali norme. La scelta era funzionale: resistenza strutturale e adattamento al corpo.","Non corretto. Il compensato piatto esisteva già. La scelta della doppia curvatura fu deliberata per ragioni strutturali ed ergonomiche."]],["Nel design thinking, la fase di 'empatia' precede tutte le altre. Il testo dice che il modo più comune per sbagliare è 'progettare qualcosa che tu trovi utile senza verificare se lo trovano utile anche gli altri'. Cosa questo implica sul processo di design?",["Che senza comprendere l'utente reale si rischia di creare soluzioni che non risolvono problemi veri","Che senza empatia non si possono costruire prototipi fisici","Che l'empatia garantisce automaticamente che il prodotto sia esteticamente bello","Che ogni designer deve intervistare almeno 100 utenti prima di iniziare a disegnare"],0,"L'empatia è il punto di partenza del design thinking perché permette di capire chi ha il problema prima di tentare di risolverlo. Senza empatia, il designer rischia di progettare qualcosa che ritiene utile per sé stesso, ma che non risponde ai bisogni reali degli utenti.",["Esatto! L'empatia previene il rischio principale del design: proiettare i propri bisogni sugli utenti invece di comprendere i bisogni reali di chi userà il prodotto.","Non corretto. I prototipi si costruiscono nella fase di prototipazione. L'empatia serve a capire il problema reale, non a costruire prototipi.","Non corretto. L'empatia non riguarda l'estetica ma la comprensione dei bisogni reali dell'utente.","Non corretto. Non esiste una soglia numerica prescritta. L'importante è capire il problema reale prima di progettare soluzioni."]],["Massimo Vignelli ha distorto deliberatamente le distanze geografiche nella mappa della metro di New York. Quale obiettivo progettuale giustificava questa scelta?",["Rendere leggibili le connessioni tra le linee, prioritariamente rispetto alla precisione geografica","Ridurre i costi di stampa semplificando il tracciato","Rispettare un obbligo legale di non mostrare distanze reali nelle mappe pubbliche","Nascondere la posizione delle stazioni sotterranee per ragioni di sicurezza"],0,"Vignelli ha distorto le distanze geografiche perché in quel contesto la priorità comunicativa era capire come le linee si connettono, non conoscere le distanze precise. È un esempio emblematico di come il design privilegia l'efficacia della comunicazione rispetto alla fedeltà letterale.",["Esatto! In una mappa del metro, capire come si collegano le linee è più utile che conoscere le distanze esatte tra le stazioni. La distorsione era una scelta comunicativa deliberata.","Non corretto. La scelta era comunicativa, non economica: privilegiare la leggibilità delle connessioni rispetto alla fedeltà geografica.","Non corretto. Non esiste tale obbligo. La distorsione era una scelta progettuale deliberata per migliorare la leggibilità.","Non corretto. Le mappe del metro sono pubbliche. La distorsione serviva a rendere più chiare le connessioni, non a nascondere informazioni."]],["Il 'design for disassembly' progetta giunzioni smontabili e materiali compatibili. Quale problema specifico del riciclo tradizionale intende risolvere?",["La difficoltà di separare materiali diversi (plastica + metallo + vetro) per riciclarli correttamente","Il costo elevato della produzione industriale degli oggetti complessi","La scarsa resistenza meccanica degli oggetti progettati per essere smontati","Il problema della corrosione dei materiali metallici negli ambienti umidi"],0,"Il design for disassembly risponde al problema della mescolanza di materiali diversi negli oggetti complessi: plastica + metallo + vetro incollati insieme non si possono riciclare separatamente. Progettando deliberatamente giunzioni smontabili e materiali compatibili, ogni componente può essere separato e riciclato correttamente.",["Esatto! Un oggetto con materiali diversi incollati o saldati è difficile da riciclare perché non si può separare. Il design for disassembly elimina questo problema progettando la separabilità fin dall'inizio.","Non corretto. Il design for disassembly mira al riciclo a fine vita, non alla riduzione dei costi di produzione.","Non corretto. Le giunzioni smontabili possono essere anche molto resistenti. L'obiettivo è facilitare la separazione a fine vita per il riciclo.","Non corretto. La corrosione è un problema di protezione dei materiali. Il design for disassembly riguarda la separabilità dei materiali a fine vita per il riciclo."]],["Nel caso studio dell'iPhone 1, Apple eliminò quasi tutti i pulsanti fisici mantenendone solo tre. Quale vantaggio strategico specifico cita il testo per questa scelta?",["Permettere di cambiare l'interfaccia utente con aggiornamenti software senza toccare l'hardware","Rendere il telefono più leggero riducendo il numero di componenti","Ridurre il costo di produzione eliminando componenti meccanici costosi","Rendere il telefono impermeabile all'acqua eliminando i fori dei pulsanti"],0,"Eliminare i pulsanti fisici aveva un vantaggio strategico preciso: ogni pulsante fisico è un punto di fragilità e un limite alla modifica software. Senza pulsanti, Apple poteva cambiare completamente l'interfaccia utente con un aggiornamento software, senza toccare l'hardware fisico del telefono.",["Esatto! Ogni pulsante fisico è un punto di fragilità meccanica e un limite alla modifica software. Eliminandoli, Apple poteva aggiornare l'esperienza utente via software senza cambiare il telefono.","Non corretto. Il motivo non era principalmente il peso. Il vantaggio strategico era la possibilità di aggiornare l'interfaccia via software senza modificare l'hardware.","Non corretto. Il costo non era il motivo principale. La motivazione strategica era la flessibilità: cambiare l'interfaccia via software senza toccare l'hardware.","Non corretto. Il testo non menziona l'impermeabilità come motivazione. Il motivo era la flessibilità software: poter modificare l'interfaccia senza toccare l'hardware."]],["Il testo afferma che nella prospettiva centrale il punto di fuga si posiziona 'all'altezza degli occhi dell'osservatore ideale'. Quale effetto visivo produce la posizione del punto di fuga rispetto all'oggetto disegnato?",["Determina il punto di vista dell'osservatore: alto, basso o frontale rispetto all'oggetto","Determina solo le dimensioni dell'oggetto nel disegno, non il punto di vista","Determina lo stile estetico del disegno: moderno o tradizionale","Non ha effetti visivi: la posizione del punto di fuga è solo una convenzione geometrica"],0,"La linea d'orizzonte corrisponde all'altezza degli occhi dell'osservatore ideale. Posizionare il punto di fuga in alto produce una vista dall'alto (bird's eye view), in basso produce una vista dal basso (worm's eye view), al centro produce una vista frontale. La posizione del PF determina il punto di vista dell'intera rappresentazione.",["Esatto! La linea d'orizzonte (dove si trova il punto di fuga) corrisponde all'altezza degli occhi dell'osservatore. Alzarla o abbassarla cambia radicalmente il punto di vista dal quale si vede l'oggetto.","Non corretto. Il punto di fuga determina il punto di vista (alto, basso, frontale), non le dimensioni dell'oggetto.","Non corretto. La posizione del punto di fuga determina il punto di vista geometrico dell'osservatore, non lo stile estetico.","Non corretto. La posizione del punto di fuga ha effetti visivi molto concreti: cambia il punto di vista e la percezione delle proporzioni dell'oggetto."]]],"A":[["Il testo presenta il caso iPhone 1 come dimostrazione che 'forma e funzione erano inseparabili — non decorazione aggiunta alla tecnica, ma tecnica espressa attraverso la forma.' Questo principio contraddice quale idea comune sul design?",["L'idea che il design sia solo decorazione aggiunta a un prodotto già funzionante","L'idea che i prodotti Apple costino troppo rispetto ai concorrenti","L'idea che il vetro sia un materiale inadatto per i telefoni cellulari","L'idea che Steve Jobs fosse principalmente un ingegnere e non un designer"],0,"Il caso iPhone 1 dimostra che il design non è decorazione aggiunta a un prodotto già funzionante. Il vetro Gorilla Glass, il bordo in alluminio, le proporzioni dello schermo, il rientro del connettore — ogni scelta formale risponde a una funzione tecnica precisa. Forma e funzione sono inseparabili.",["Esatto! Il caso iPhone mostra che ogni scelta formale aveva una giustificazione funzionale e ogni scelta funzionale aveva implicazioni formali. Il design non è decorazione post-funzionale ma parte integrante della soluzione tecnica.","Non corretto. Il testo non tratta la questione del prezzo. Il punto è che nel design dell'iPhone forma e funzione erano inseparabili.","Non corretto. La questione del materiale è uno degli esempi, non il principio generale. Il punto è che forma e funzione sono inseparabili nel design.","Non corretto. Il testo non valuta il profilo professionale di Jobs. Il punto è il principio generale dell'inseparabilità di forma e funzione."]],["Il testo descrive l'iterazione (prototipo → test → modifica) come 'la parte più importante del design'. Perché questa affermazione è controintuitiva rispetto alla visione romantica della creatività?",["Perché nella visione romantica l'idea geniale iniziale è la parte più importante, mentre l'iterazione valorizza invece l'errore e la revisione come fonti di miglioramento","Perché i prototipi fisici costano molto di più dei disegni digitali e quindi rallentano il processo","Perché normalmente si pensa che i clienti non capiscano abbastanza per testare prototipi","Perché l'iterazione richiede teamwork mentre la progettazione è tradizionalmente individuale"],0,"L'iterazione è controintuitiva perché sfida la visione romantica della creatività come ispirazione geniale. Nel design reale, l'errore è prezioso: un prototipo che rivela un problema che non avevi previsto vale più di qualsiasi disegno perfetto. Modificare il progetto dopo un test non è un fallimento, è il processo che produce soluzioni davvero funzionali.",["Esatto! L'iterazione è controintuitiva perché sfida il mito dell'ispirazione geniale. Un prototipo che fallisce nel test è più prezioso di un disegno perfetto non testato: rivela problemi reali che nessuna intuizione avrebbe mostrato.","Non corretto. Il punto non è il costo, ma il valore epistemologico: il prototipo rivela problemi reali che i disegni non mostrano. Il costo è secondario.","Non corretto. Il testo non esprime questa posizione. Al contrario: quello che fanno e dicono gli utenti durante il test è 'la tua informazione più preziosa'.","Non corretto. Il punto non riguarda il lavoro di team vs individuale, ma il valore dell'errore come fonte di apprendimento nel processo di design."]],["La regola pratica nel testo: 'se devi comunicare misure esatte a chi costruisce, usa l'assonometria; se devi comunicare l'aspetto a chi decide, usa la prospettiva'. Questo rivela che la scelta del sistema di rappresentazione dipende fondamentalmente da quale fattore?",["Dal destinatario della comunicazione e dallo scopo del disegno, non dall'estetica del risultato","Dal software CAD disponibile: alcuni programmi generano assonometria, altri prospettiva","Dal livello di esperienza del disegnatore: principianti usano assonometria, professionisti prospettiva","Dalla dimensione dell'oggetto: grandi oggetti richiedono prospettiva, piccoli oggetti assonometria"],0,"Il disegno tecnico è sempre un atto comunicativo. La scelta del sistema di rappresentazione dipende da chi leggerà il disegno e per quale scopo: assonometria per il tecnico che deve costruire (misure esatte), prospettiva per il cliente che deve decidere (aspetto percepito). Un buon progetto usa spesso entrambi.",["Esatto! La scelta non è estetica ma comunicativa: dipende da chi leggerà il disegno (tecnico vs cliente) e dallo scopo (precisione vs percezione). Un buon progetto usa spesso entrambi.","Non corretto. La scelta non dipende dal software ma dal contesto comunicativo. Un buon professionista usa entrambi i sistemi in base al destinatario.","Non corretto. Non si tratta di un percorso di apprendimento. Entrambi i sistemi hanno scopi diversi e vengono usati da qualsiasi professionista in contesti diversi.","Non corretto. La dimensione non determina la scelta. La scelta dipende dallo scopo comunicativo e dal destinatario del disegno."]],["Il concetto 'cradle to cradle' propone due categorie di materiali: ciclo biologico e ciclo tecnico. Quale problema strutturale del design tradizionale questo approccio vuole risolvere?",["Il fatto che nel modello lineare i materiali a fine vita finiscono in discarica, perdendo il loro valore invece di rientrare in un ciclo produttivo","Il fatto che i produttori non dichiarano la composizione chimica dei materiali usati","Il fatto che il design tradizionale produce oggetti esteticamente brutti","Il fatto che i designer non considerano l'ergonomia nella fase di progettazione"],0,"Il cradle to cradle (dalla culla alla culla) si oppone al modello lineare cradle-to-grave (dalla culla alla tomba). Il problema che vuole risolvere: ogni materiale che finisce in discarica è una perdita di valore. La soluzione è progettare i prodotti fin dall'inizio per rientrare nel ciclo biologico (biodegradano) o tecnico (vengono riciclati e reimmessi nella produzione).",["Esatto! Il cradle to cradle affronta il modello lineare (estrai → produci → consuma → butta): ogni materiale in discarica è una perdita di valore. La soluzione è progettare i prodotti per rientrare in cicli continui fin dall'inizio.","Non corretto. Il problema identificato è lo smaltimento in discarica a fine vita, non la mancanza di trasparenza sulla composizione.","Non corretto. Il cradle to cradle non riguarda l'estetica ma il ciclo di vita dei materiali e il loro destino a fine vita.","Non corretto. L'ergonomia è un tema separato. Il cradle to cradle affronta il ciclo di vita dei materiali e il problema dello smaltimento in discarica."]],["Giugiaro progettò la Fiat Panda con pannelli piatti invece di curve per ridurre i costi di produzione. Il testo dice che 'l'estetica era una conseguenza dell'efficienza'. Quale principio di design questo incarna?",["I vincoli produttivi e di costo, quando accettati come parte del problema di design, possono generare forme originali e riconoscibili","Il design minimalista produce sempre oggetti esteticamente superiori perché elimina il superfluo","La produzione industriale richiede sempre forme geometriche semplici per ragioni tecnologiche universali","Le auto economiche devono avere forme diverse da quelle di lusso per segnalare il loro mercato di riferimento"],0,"Il caso Fiat Panda dimostra che i vincoli di produzione e costo non sono il contrario del design: sono parte del problema da risolvere. Giugiaro ha incorporato il vincolo economico (pannelli piatti meno costosi da produrre) come vincolo progettuale, generando una forma originale. L'estetica è emersa come conseguenza delle scelte funzionali.",["Esatto! Giugiaro non ha subito i vincoli economici ma li ha incorporati come vincoli di design. I pannelli piatti, più economici, hanno generato la forma riconoscibile della Panda. I vincoli non limitano il design: lo definiscono.","Non corretto. Non si tratta di una teoria estetica del minimalismo. I pannelli piatti erano una scelta economica che ha generato un'estetica, non il contrario.","Non corretto. Non è una necessità tecnologica universale. È una scelta deliberata di Giugiaro per ridurre i costi di produzione della Panda.","Non corretto. Il punto non è il segnalamento di mercato ma il principio per cui i vincoli produttivi, se integrati nel processo di design, generano forma."]],["Il testo afferma che il design thinking 'non è lineare' e che 'si torna indietro, si riscoprono problemi, si ridefinisce il brief'. Come mai questa caratteristica è considerata un vantaggio e non una debolezza?",["Perché le fasi successive (test, prototipo) rivelano informazioni che non erano disponibili all'inizio, permettendo di produrre soluzioni migliori di quelle previste","Perché la non-linearità riduce i tempi totali del processo rispetto a un approccio sequenziale rigido","Perché senza linearità ogni membro del team può lavorare su una fase diversa contemporaneamente","Perché i processi non lineari sono più creativi per definizione rispetto ai processi lineari"],0,"La non-linearità del design thinking è un vantaggio perché ogni fase rivela informazioni che non erano disponibili nella fase precedente. Tornare a ridefinire il problema dopo aver testato un prototipo non è un fallimento: è la prova che il processo sta incorporando nuove informazioni reali, producendo soluzioni migliori di quelle previste all'inizio.",["Esatto! La non-linearità è un vantaggio epistemologico: il processo di design rivela informazioni che nessuna analisi preliminare avrebbe potuto fornire. Tornare a ridefinire il problema dopo aver testato è il meccanismo che produce soluzioni davvero funzionali.","Non corretto. Tornare indietro non riduce i tempi. Il vantaggio è la qualità della soluzione finale, non la velocità.","Non corretto. La non-linearità non riguarda il lavoro parallelo del team ma la capacità del processo di adattarsi alle informazioni scoperte durante il percorso.","Non corretto. Non è una questione di creatività come proprietà intrinseca. La non-linearità del design thinking è un vantaggio perché incorpora l'apprendimento durante il processo, non per una qualità astratta della creatività."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
