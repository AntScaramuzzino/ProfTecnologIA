<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */

@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>

<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;

<script>
const F = { gas: 0.202, el: 0.233, benz: 0.21, dies: 0.17, bus: 0.089, treno: 0.041 };
const base = (p) => ({ risc: p.gas * F.gas, el: p.el * F.el, tr: p.km * (p.al === "dies" ? F.dies : F.benz) + p.bus * F.bus });
LABENGINE.run({
  id: "MC-ENE-3-02", area: "ENE", classe: 3, titolo: "L'impronta di carbonio di casa", archetipo: "Calcolatore",
  hook: "Nei combustibili fossili c'è energia accumulata in milioni di anni, che noi liberiamo in un attimo. Insieme all'energia esce CO₂. Quanta ne produce ogni mese una famiglia, e dove si può tagliare?",
  footer: "Fattori di emissione e dati medi dalle tabelle del testo della MC (elettricità: rete italiana 2023).",
  levels: [
    { brief: "Confronta le fonti non rinnovabili con la tabella del libro: CO₂ prodotta per ogni gigajoule (GJ) di energia, valori centrali degli intervalli.",
      blocks: [
        { type: "chart", kind: "bar", toggles: false, d: 1, xlabel: "fonte", ylabel: "kg CO₂ per GJ", series: [{ name: "CO₂ per GJ", data: [["Carbone", 92.5], ["Petrolio", 72.5], ["Gas naturale", 52.5], ["Uranio (in funzione)", 0]] }] },
        { type: "quiz", questions: [
          ["Quale fonte fossile produce più CO₂ a parità di energia?", ["Gas naturale", "Petrolio", "Carbone"], 2, "Circa 90-95 kg per GJ: quasi il doppio del gas."],
          ["Per questo il gas è chiamato il fossile «più pulito». Vuol dire che non inquina?", ["Sì", "No: produce comunque CO₂, solo meno degli altri fossili"], 1, "Le perdite di metano lungo i gasdotti, poi, sono un problema climatico serio."],
          ["Il nucleare non produce CO₂ durante il funzionamento. Vuol dire che non ha impatti?", ["Sì, nessuno", "No: estrazione dell'uranio, costruzione delle centrali e scorie radioattive sono impatti da considerare"], 1, "«Zero CO₂ in funzione» non è uguale a «zero impatto»."]] } ],
      reflect: "Il libro dice che petrolio e gas durerebbero circa 50 anni ai ritmi attuali. Che cosa cambia se i consumi crescono? E se calano?" },
    { brief: "Calcola le emissioni mensili di una famiglia. Se non hai le bollette usa i dati medi del libro: 100 kWh di gas al mese in mezza stagione (1 m³ ≈ 10 kWh) e 250 kWh di elettricità.",
      blocks: [
        { type: "sim", params: [{ id: "gas", label: "Gas per riscaldamento e cucina", min: 0, max: 2000, step: 10, value: 100, unit: "kWh/mese" }, { id: "el", label: "Elettricità", min: 50, max: 800, step: 10, value: 250, unit: "kWh/mese" }, { id: "km", label: "Km in auto", min: 0, max: 3000, step: 50, value: 800, unit: "km/mese" }, { id: "al", label: "Alimentazione dell'auto", options: [["benz", "Benzina"], ["dies", "Diesel"]], value: "benz" }, { id: "bus", label: "Km in autobus (tutta la famiglia)", min: 0, max: 1000, step: 10, value: 100, unit: "km/mese" }],
          outputs: [{ key: "r", label: "Riscaldamento e cucina", f: (p) => base(p).risc, unit: "kg CO₂", d: 1 }, { key: "e", label: "Elettricità", f: (p) => base(p).el, unit: "kg CO₂", d: 1 }, { key: "t", label: "Trasporti", f: (p) => base(p).tr, unit: "kg CO₂", d: 1 }, { key: "tot", label: "Totale al mese", f: (p) => { const b = base(p); return b.risc + b.el + b.tr; }, unit: "kg CO₂", d: 1 }],
          bars: (p) => { const b = base(p); return [["Riscaldamento", b.risc], ["Elettricità", b.el], ["Trasporti", b.tr]]; }, barsUnit: "kg CO₂", barsD: 1 } ],
      reflect: "Quale settore pesa di più nella tua famiglia? Ti aspettavi questo risultato?" },
    { label: "Scenario · tre strade per ridurre", brief: "Parti dai valori della tua famiglia e attiva gli scenari del libro: A auto elettrica (0,047 kg CO₂/km), B fotovoltaico da 3 kWp (circa 300 kWh/mese), C isolamento (−30% di gas). Confronta CO₂ risparmiata e costo.",
      blocks: [
        { type: "sim", params: [{ id: "gas", label: "Gas", min: 0, max: 2000, step: 10, value: 600, unit: "kWh/mese" }, { id: "el", label: "Elettricità", min: 50, max: 800, step: 10, value: 250, unit: "kWh/mese" }, { id: "km", label: "Km in auto a benzina", min: 0, max: 3000, step: 50, value: 800, unit: "km/mese" }, { id: "A", label: "A · Auto elettrica (circa 30.000 €)", options: [[0, "No"], [1, "Sì"]], value: 0 }, { id: "B", label: "B · Fotovoltaico 3 kWp (circa 6.000 €)", options: [[0, "No"], [1, "Sì"]], value: 0 }, { id: "C", label: "C · Isolamento termico (circa 20.000 €)", options: [[0, "No"], [1, "Sì"]], value: 0 }],
          outputs: [{ key: "pr", label: "Oggi", f: (p) => p.gas * F.gas + p.el * F.el + p.km * F.benz, unit: "kg CO₂/mese", d: 1 },
            { key: "do", label: "Con gli scenari", f: (p) => p.gas * (p.C ? 0.7 : 1) * F.gas + Math.max(0, p.el + (p.A ? p.km * 0.2 : 0) - (p.B ? 300 : 0)) * F.el + (p.A ? 0 : p.km * F.benz), unit: "kg CO₂/mese", d: 1 },
            { key: "ris", label: "Risparmio in 10 anni", f: (p, o) => (o.pr - o.do) * 120, unit: "kg CO₂" },
            { key: "eur", label: "Euro spesi per kg di CO₂ evitato", f: (p, o) => { const c = p.A * 30000 + p.B * 6000 + p.C * 20000; const r = (o.pr - o.do) * 120; return c && r > 0 ? +(c / r).toFixed(2) : "—"; }, d: 2 }],
          bars: (p, o) => [["Oggi", o.pr], ["Con gli scenari", o.do]], barsUnit: "kg/mese", barsD: 1,
          note: (p) => p.A && !p.B ? ["warn", "Con l'auto elettrica i chilometri si pagano in elettricità (0,2 kWh/km): l'auto emette meno, ma tramite la rete. Con il fotovoltaico, una parte di quell'energia diventa a emissioni zero."] : null } ],
      reflect: "Quale scenario ha il miglior rapporto fra euro spesi e CO₂ evitata? Come cambierebbe se la rete elettrica fosse tutta rinnovabile?" }],
  bridge: "Calcola l'impronta di carbonio della tua famiglia per un mese: somma le emissioni di riscaldamento, trasporti ed elettricità con i fattori di emissione del libro.",
});

<script>

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-ENE-3-02","F":[["Quante tonnellate di materia organica fossile sono necessarie per produrre un litro di benzina, secondo il calcolo citato nel testo?",["Circa 23,5 tonnellate","Circa 5 tonnellate","Circa 1 tonnellata","Circa 100 tonnellate"],0,"Secondo il geologo Jeffrey Dukes (Climatic Change, 2003), un litro di benzina richiede circa 23,5 tonnellate di materia organica fossile originale — equivalente all'intera produzione biologica di una foresta tropicale per quasi un anno. Questa cifra illustra l'enorme concentrazione di tempo geologico in ogni litro di carburante.",["Esatto! Secondo i calcoli del geologo Jeffrey Dukes, un singolo litro di benzina richiede circa 23,5 tonnellate di materia organica fossile originale, formatasi in decine di milioni di anni.","Non corretto. Il dato corretto è circa 23,5 tonnellate di materia organica fossile per ogni litro di benzina.","Non corretto. La quantità è molto maggiore: circa 23,5 tonnellate di materia organica per ogni litro di benzina.","Non corretto. Il dato corretto è circa 23,5 tonnellate, non 100. Questo dato mostra quanto 'tempo geologico' è concentrato in un litro di benzina."]],["Il gas naturale è considerato il combustibile fossile con l'impatto ambientale più basso tra i tre (carbone, petrolio, gas). Quale caratteristica chimica spiega questa differenza?",["È soprattutto metano, che bruciando produce meno CO₂ per unità di energia","Perché non contiene carbonio, quindi non produce CO₂ durante la combustione","Perché si trova in profondità e la sua estrazione non disturba la superficie","Perché brucia senza produrre calore, quindi non aumenta la temperatura dell'atmosfera"],0,"Il gas naturale è principalmente metano (CH₄) al 70-90%. Brucia più completamente del carbone (meno particolato) e produce circa 50 kg CO₂/GJ contro i 90 kg del carbone. Tuttavia, il metano stesso ha potere climalterante 86 volte superiore alla CO₂ a 20 anni: le perdite nelle reti di distribuzione annullano parte del vantaggio.",["Esatto! Il gas naturale è formato principalmente da metano (CH₄, 70-90%). Brucia più completamente del carbone (meno particolato) e produce meno CO₂ per unità di energia: circa 50 kg CO₂/GJ contro 90 kg del carbone.","Non corretto. Il gas naturale contiene carbonio (è metano CH₄) e produce CO₂ durante la combustione, ma in quantità inferiori al carbone per unità di energia.","Non corretto. L'impatto ambientale del gas si valuta principalmente sulle emissioni di CO₂ e metano durante uso e distribuzione, non solo sull'estrazione.","Non corretto. Il gas naturale produce calore quando brucia (è la sua funzione!). La differenza è che produce meno CO₂ per unità di energia rispetto al carbone."]],["In una centrale elettrica a gas a ciclo combinato, qual è il rendimento tipico (cioè quanta energia del gas si trasforma in elettricità)?",["50-60%: il calore dei gas viene sfruttato due volte, in due turbine","100%: tutta l'energia del gas si trasforma in elettricità","10-15%: gran parte dell'energia si disperde durante il trasporto in rete","25-30%: uguale al motore a benzina di un'automobile"],0,"Il ciclo combinato usa i gas di combustione per due turbine in sequenza: una turbina a gas (simile a un motore aeronautico stazionario) e poi il calore residuo per produrre vapore che aziona una turbina a vapore. Il rendimento risultante è 50-60%, contro il 30-40% di una centrale tradizionale a singolo ciclo.",["Esatto! Il ciclo combinato usa i gas di combustione per una turbina a gas (come un motore aeronautico stazionario) e poi il calore residuo per produrre vapore che aziona una seconda turbina. Rendimento risultante: 50-60%.","Non corretto. Nessuna macchina termica può avere rendimento 100% per il secondo principio della termodinamica. Il ciclo combinato raggiunge 50-60%.","Non corretto. Il 10-15% è approssimativamente il rendimento di alcuni processi meno efficienti. Il ciclo combinato raggiunge 50-60% solo nella centrale.","Non corretto. Il 25-30% è il rendimento del motore a benzina. Il ciclo combinato a gas è molto più efficiente: 50-60%."]],["Come funziona la fissione nucleare che alimenta una centrale nucleare?",["Un neutrone spezza un atomo di uranio, liberando calore e altri neutroni: reazione a catena","L'uranio brucia lentamente come il carbone, producendo calore senza emissioni di CO₂","Due atomi di idrogeno si fondono insieme liberando una quantità enorme di energia","L'uranio viene raffreddato a temperature molto basse, producendo energia per superconduttività"],0,"Fissione nucleare: 1) un neutrone lento colpisce U-235; 2) il nucleo si divide in frammenti più leggeri + 2-3 neutroni + enorme calore; 3) i nuovi neutroni colpiscono altri atomi → reazione a catena controllata. Il calore scalda acqua → vapore → turbina → generatore elettrico. 1 grammo di U-235 produce l'equivalente di 3 tonnellate di carbone.",["Esatto! Un neutrone colpisce un nucleo di U-235 che si divide in frammenti più leggeri (bario e kripton), liberando enormi quantità di calore e 2-3 nuovi neutroni. Questi innescano altri atomi → reazione a catena controllata.","Non corretto. L'uranio non 'brucia': non c'è combustione chimica. Il processo è la fissione nucleare: rottura dei nuclei atomici, completamente diversa dalla combustione.","Non corretto. Quella descritta è la fusione nucleare (non ancora tecnologicamente matura per uso commerciale). Nelle centrali esistenti si usa la FISSIONE: rottura di atomi pesanti di uranio.","Non corretto. Non è la superconduttività a produrre energia nelle centrali nucleari. Il processo è la fissione: un neutrone colpisce un nucleo di U-235 che si divide liberando calore."]],["Come si forma il petrolio nel sottosuolo, a partire da organismi marini?",["Resti di plancton e alghe, sepolti sui fondali, si trasformano in milioni di anni per pressione e calore","Resti di dinosauri si accumulano in grotte sotterranee e si liquefano nel tempo","Il magma vulcanico sottrae carbonio dalla roccia e forma idrocarburi a 3000°C","L'acqua marina reagisce con le rocce basaltiche del fondale producendo idrocarburi in poche decine di anni"],0,"Formazione del petrolio: 1) resti organici (plancton, alghe) si depositano in ambienti anossici; 2) vengono sepolti da strati di sedimenti; 3) pressione (centinaia di atmosfere) e temperatura (60-150°C) aumentano; 4) in 10-100 milioni di anni la materia organica si trasforma in idrocarburi. Il petrolio si raccoglie in giacimenti di roccia porosa intrappolati sotto rocce impermeabili.",["Esatto! Il petrolio si forma dalla decomposizione di organismi marini microscopici (plancton, alghe, batteri) depositati in ambienti anossici, poi sepolti da sedimenti. In 10-100 milioni di anni, pressione e calore trasformano la materia organica in idrocarburi.","Non corretto. Il petrolio non deriva dai dinosauri ma da organismi marini microscopici (plancton, alghe). I dinosauri erano vertebrati terrestri, non la fonte del petrolio.","Non corretto. Il petrolio si forma da materia organica biologica a temperature relativamente moderate (60-150°C), non dal magma. Il processo è biologico-geologico, non vulcanico.","Non corretto. Il processo di formazione del petrolio richiede 10-100 milioni di anni e parte da materia organica biologica, non da reazioni acqua-basalto."]],["Come funziona l'effetto serra naturale che mantiene la Terra abitabile?",["Alcuni gas assorbono il calore emesso dalla Terra e lo rimandano verso il basso","L'ozono stratosferico riflette la luce solare, riscaldando l'aria per attrito","Il suolo terrestre assorbe direttamente la radiazione solare e la immagazzina come calore permanente","Le nuvole funzionano come una coperta che impedisce al calore di disperdersi nello spazio"],0,"Effetto serra naturale: la Terra riceve luce solare (onde corte) e riemette calore (infrarossi, onde lunghe). Gas come CO₂, vapor d'acqua e metano assorbono questi infrarossi e li riemettono in tutte le direzioni, incluso verso la Terra. Questo 'intrappola' parte del calore. Senza di esso, la temperatura media sarebbe -18°C. È necessario per la vita.",["Esatto! La Terra assorbe luce solare (onde corte) e riemette calore (onde lunghe/infrarosse). I gas serra assorbono questo infrarosso e lo riemettono in tutte le direzioni, incluso verso la Terra. Senza effetto serra naturale, la temperatura media sarebbe -18°C invece di +15°C.","Non corretto. L'ozono assorbe i raggi UV, non riscalda per riflessione. L'effetto serra è causato da CO₂, vapor d'acqua, metano che assorbono infrarossi emessi dalla superficie terrestre.","Non corretto. Il suolo assorbe e riemette calore, ma l'effetto serra è il meccanismo per cui i gas atmosferici trattengono il calore riemesso dalla superficie, non il semplice assorbimento dal suolo.","Non corretto. Le nuvole hanno effetti sia di riscaldamento (gas serra) sia di raffreddamento (riflettono la luce solare). Il principale meccanismo dell'effetto serra è l'assorbimento di infrarossi da parte dei gas serra (CO₂, vapore d'acqua, metano)."]]],"I":[["Il testo afferma che il metano ha un potere climalterante '86 volte superiore alla CO₂ su un orizzonte di 20 anni'. Perché questa informazione è importante per valutare il gas naturale come fonte 'più pulita' dei fossili?",["Perché anche piccole perdite di metano dalle reti annullano gran parte del vantaggio sul carbone","Perché significa che il gas naturale è più pericoloso del carbone per il cambiamento climatico in tutti i casi","Perché il metano emesso dai laghi e dalle paludi naturali è più pericoloso di quello dei pozzi di gas","Perché significa che bisogna eliminare subito tutto il gas naturale dalle abitazioni italiane"],0,"Il metano ha potere climalterante 86 volte superiore alla CO₂ a 20 anni. Anche se bruciato produce meno CO₂ del carbone, il metano non bruciato che fuoriesce durante l'estrazione e il trasporto è estremamente potente come gas serra. Piccole percentuali di perdita nelle reti possono annullare completamente il vantaggio climatico del gas rispetto al carbone.",["Esatto! Il gas naturale brucia producendo meno CO₂ del carbone, ma il metano stesso (quando fuoriesce non bruciato durante estrazione e trasporto) è 86 volte più potente della CO₂ come gas serra. Piccole perdite percentuali cancellano l'intero vantaggio climatico.","Non corretto. Non è vero 'in tutti i casi'. Il gas è meno climalterante del carbone se le perdite di metano sono contenute. Il problema emerge solo con perdite significative nelle reti.","Non corretto. Il confronto tra fonti naturali e antropiche di metano esiste, ma non è il punto del testo. La questione è che le perdite dalle reti di gas annullano il vantaggio climatico del gas sul carbone.","Non corretto. Il testo non suggerisce questa azione immediata. Il punto è che il vantaggio climatico del gas dipende dal contenimento delle perdite di metano durante l'intera filiera."]],["Il percorso dell'elettricità dalla centrale a gas alla presa di casa perde complessivamente il 55-65% dell'energia iniziale. Quale passo del percorso contribuisce più alle perdite?",["La centrale stessa, dove quasi metà dell'energia del gas si disperde in calore","Il trasporto via gasdotto, dove il gas perde pressione su distanze lunghe","Il trasformatore sotto casa, che converte la tensione da 20.000 V a 220 V","Le linee ad alta tensione, dove le perdite per effetto Joule sono enormi su lunghe distanze"],0,"Il percorso dell'elettricità perde principalmente nella centrale termoelettrica: il ciclo combinato ha rendimento 50-60%, quindi il 40-50% dell'energia del gas si disperde come calore. Le perdite nelle linee di trasporto (alte tensioni) e nei trasformatori sono piccole (2-5% complessivamente). Il rendimento complessivo dalla centrale alla presa è 35-45%.",["Esatto! La centrale a ciclo combinato ha rendimento 50-60%, quindi il 40-50% viene perso come calore. Le perdite di trasmissione in rete sono dell'1-3%, molto minori. La maggior parte delle perdite avviene nella conversione termica.","Non corretto. Le perdite nei gasdotti esistono ma sono relativamente piccole rispetto alle perdite nella conversione termica della centrale (40-50% dell'energia).","Non corretto. I trasformatori moderni hanno rendimento del 98-99%. Le perdite maggiori sono nella centrale termoelettrica (40-50% dell'energia del gas).","Non corretto. Le linee ad alta tensione sono progettate proprio per minimizzare le perdite Joule (alta tensione = bassa corrente = meno calore disperso). Le perdite maggiori sono nella centrale termoelettrica."]],["La concentrazione di CO₂ atmosferica è passata da 280 ppm (1750) a oltre 420 ppm (2023). Qual è la principale causa di questo aumento del 50% in meno di tre secoli?",["La combustione di carbone, petrolio e gas, insieme alla deforestazione","L'aumento della popolazione mondiale che respira più CO₂","I gas vulcanici che aumentano le emissioni di CO₂ in modo naturale","La decomposizione accelerata dei rifiuti urbani nelle discariche moderne"],0,"La CO₂ è passata da 280 ppm (livelli pre-industriali, 1750) a oltre 420 ppm (2023): un aumento del 50% in meno di 300 anni. La causa principale è la combustione di combustibili fossili, che rilascia in pochi secoli carbonio accumulato in centinaia di milioni di anni. La deforestazione riduce anche la capacità di riassorbimento.",["Esatto! Bruciare combustibili fossili significa rilasciare in pochi secoli CO₂ che la biosfera aveva impiegato centinaia di milioni di anni ad accumulare. La deforestazione riduce anche la capacità dei boschi di riassorbire CO₂.","Non corretto. La respirazione umana è parte del ciclo naturale del carbonio: il CO₂ emesso respirando era stato precedentemente assorbito dalla vegetazione. La causa dell'aumento sono i combustibili fossili.","Non corretto. I vulcani emettono CO₂ ma in quantità molto inferiori alle emissioni umane annuali (circa 50 volte meno). Il cambiamento da 280 a 420 ppm è causato principalmente dai combustibili fossili.","Non corretto. Le discariche producono principalmente metano (non CO₂). L'aumento della CO₂ da 280 a 420 ppm è causato dalla combustione di combustibili fossili."]],["Il testo presenta un 'errore comune': 'il nucleare è sempre pericoloso — meglio il carbone'. Quale dato specifico confuta questa affermazione?",["Per unità di energia prodotta, il carbone causa molte più morti del nucleare","Il nucleare non ha mai causato incidenti gravi nella storia","Il carbone non produce emissioni di CO₂ quando viene usato nelle centrali moderne ad alta efficienza","Il nucleare è rinnovabile perché l'uranio si rigenera naturalmente in pochi decenni"],0,"Confronto statistico per unità di energia: carbone ~24 morti/TWh (incidenti minerari + malattie respiratorie da PM2.5/SO₂), gas ~2,8 morti/TWh, nucleare ~0,07 morti/TWh. Il nucleare, nonostante incidenti come Chernobyl e Fukushima, causa statisticamente molte meno morti del carbone per unità di energia prodotta. Valutare i rischi richiede dati, non solo intuizioni.",["Esatto! Contando sia gli incidenti diretti sia le morti per inquinamento atmosferico cronico da PM2.5 e SO₂, il carbone causa circa 24 morti/TWh contro 0,07 del nucleare. Il nucleare è statisticamente molto più sicuro del carbone per unità di energia prodotta.","Non corretto. Chernobyl (1986) e Fukushima (2011) sono stati incidenti gravi con conseguenze reali. Il punto del testo è il confronto statistico per unità di energia prodotta, non l'assenza di incidenti.","Non corretto. Il carbone produce sempre CO₂ quando brucia: è la combustione del carbonio (C + O₂ → CO₂). Non esistono centrali a carbone 'a zero emissioni' di CO₂ senza cattura e stoccaggio.","Non corretto. L'uranio non è rinnovabile: le riserve sono limitate (circa 130 anni ai ritmi attuali). Il punto del testo è la sicurezza relativa per unità di energia prodotta, non la rinnovabilità."]],["La reazione di combustione del metano è: CH₄ + 2O₂ → CO₂ + 2H₂O + calore. Perché ogni kg di carbone bruciato produce circa 3,67 kg di CO₂, molto più del suo peso originale?",["Perché a ogni atomo di carbonio si legano due atomi di ossigeno presi dall'aria, e la massa aumenta","Perché il carbone contiene idrogeno che durante la combustione produce vapore acqueo più pesante della CO₂","Perché il calore prodotto dalla combustione aumenta la massa della CO₂ secondo E=mc²","Perché durante la combustione il carbone assorbe azoto dall'aria che si aggiunge alla massa finale"],0,"Combustione del carbonio: C + O₂ → CO₂. Massa atomica del C = 12, del O = 16 × 2 = 32. Massa della CO₂ = 12 + 32 = 44. Rapporto CO₂/C = 44/12 ≈ 3,67. Il carbonio del carbone 'cattura' due atomi di ossigeno dall'aria: la CO₂ prodotta pesa 3,67 volte più del carbonio bruciato. L'ossigeno atmosferico si aggiunge alla massa.",["Esatto! La combustione del carbone è: C + O₂ → CO₂. Il carbonio (massa atomica 12) si combina con due ossigeni dall'aria (massa atomica 16 × 2 = 32), producendo CO₂ (massa 44). Rapporto: 44/12 ≈ 3,67. La massa degli ossigeni atmosferici si aggiunge alla massa del carbonio.","Non corretto. Sebbene il carbone contenga idrogeno, il calcolo del 3,67 riguarda solo il carbonio (C + O₂ → CO₂). Il rapporto di massa è 44/12 ≈ 3,67 per il solo carbonio.","Non corretto. L'effetto massa-energia E=mc² è completamente trascurabile in reazioni chimiche ordinarie. La massa maggiore della CO₂ rispetto al carbonio deriva dall'aggiunta degli atomi di ossigeno.","Non corretto. Il carbone non reagisce con l'azoto durante la normale combustione. La massa maggiore della CO₂ deriva dall'ossigeno (O₂) che si combina con il carbonio (C) del carbone."]],["Il volo Roma-New York emette circa 550-600 kg di CO₂ per passeggero, mentre il treno Roma-Milano emette 6-8 kg. Il testo dice che il volo produce '70-100 volte più emissioni'. Come si calcola questo fattore?",["Il confronto è sulla CO₂ totale del viaggio, non per km: le distanze sono molto diverse","Il 550/7 = 79 è il fattore per km percorso: ogni km in aereo emette 79 volte più del treno","Il fattore 70-100 include solo la CO₂ diretta, senza i contrails di vapore ad alta quota","Il fattore è calcolato dividendo il numero di passeggeri del volo per quelli del treno"],0,"Il volo Roma-New York (7.200 km) emette ~550 kg CO₂/passeggero. Il treno Roma-Milano (600 km) emette ~7 kg CO₂/passeggero. Rapporto: 550/7 ≈ 79 volte. Le distanze sono diverse (12× più lungo il volo), ma anche per km l'aereo emette molto di più perché la combustione a quota elevata ha effetti climalteranti amplificati (contrails).",["Esatto! Il confronto non è per km ma in emissioni totali del singolo viaggio. Il volo (7.200 km) emette ~550 kg, il treno Roma-Milano (600 km) emette ~7 kg: rapporto = 550/7 ≈ 79 volte. Le distanze sono molto diverse, ma anche normalizzando per km il volo rimane molto più emissivo.","Non corretto. Il 550/7 ≈ 79 è il rapporto dei totali del viaggio, non per km. L'aereo percorre 7.200 km e il treno 600 km: le distanze sono diverse.","Non corretto. Il dato di 550-600 kg già include l'effetto dei contrails (indicati nel testo come 'CO₂ equivalente'). Il fattore 70-100 confronta il totale del viaggio aereo con il totale del viaggio in treno.","Non corretto. Il fattore confronta le emissioni per passeggero, non il numero totale di passeggeri sui due mezzi."]]],"A":[["Il testo descrive i 'feedback loops' del riscaldamento globale (es. scioglimento del ghiaccio artico). Perché questi meccanismi rendono le proiezioni climatiche più difficili e più preoccupanti rispetto a un semplice modello lineare?",["Perché ogni aumento di temperatura innesca meccanismi che producono altro riscaldamento","Perché i feedback loops riducono le emissioni di CO₂ nel tempo, rendendo il problema meno grave di quanto previsto","Perché i feedback loops sono fenomeni locali che non influenzano il clima globale","Perché i feedback loops si annullano a vicenda producendo un effetto netto pari a zero"],0,"I feedback positivi (amplificanti) rendono il sistema climatico non-lineare: ghiaccio artico fuso → superficie più scura → più calore assorbito → più scioglimento. Permafrost sciolto → metano rilasciato → più effetto serra → più riscaldamento. Questi meccanismi significano che gli effetti del riscaldamento si autoamplificano nel tempo, rendendo le proiezioni a lungo termine più incerte e potenzialmente più gravi di quelle lineari.",["Esatto! I feedback positivi (amplificanti) trasformano il riscaldamento da lineare ad autocatalizzante: ghiaccio sciolto → superficie più scura → più calore assorbito → più scioglimento. In un sistema con feedback positivi, piccoli cambiamenti iniziali possono produrre effetti molto più grandi delle semplici proiezioni lineari.","Non corretto. I feedback loops descritti nel testo sono amplificatori (positivi): aumentano il riscaldamento invece di ridurlo. Non riducono le emissioni.","Non corretto. I feedback loops descritti (scioglimento del permafrost, albedo del ghiaccio artico) hanno effetti globali sul sistema climatico mondiale.","Non corretto. I feedback loops descritti nel testo si rinforzano a vicenda (tutti amplificano il riscaldamento). Non si annullano."]],["Il testo riporta che al 2023 il mondo è a +1,2°C rispetto ai livelli preindustriali e il target di Parigi è +1,5°C. Con le politiche attualmente in atto si prevede +2,5-3°C entro fine secolo. Quale implicazione ha questo 'gap' per la valutazione delle politiche climatiche?",["Che c'è un divario tra gli obiettivi dichiarati e ciò che i Paesi stanno davvero facendo","Che il cambiamento climatico è un fenomeno naturale che le politiche umane non possono influenzare","Che il target di 1,5°C è già stato superato e non è più rilevante come riferimento politico","Che i modelli climatici sovrastimano sistematicamente il riscaldamento futuro"],0,"Il gap tra target Parigi (+1,5°C) e traiettoria con politiche attuali (+2,5-3°C) rivela un 'implementation gap': i paesi hanno dichiarato obiettivi ambiziosigli accordi ma le misure concretamente implementate non sono allineate con quegli obiettivi. Questa discrepanza è lo strumento principale per valutare l'efficacia reale delle politiche climatiche globali.",["Esatto! Il gap tra target (1,5°C) e traiettoria con le politiche attuali (2,5-3°C) indica che le misure implementate sono insufficienti rispetto agli obiettivi dichiarati. Questa discrepanza è un indicatore critico per valutare l'efficacia reale delle politiche climatiche.","Non corretto. Il testo non afferma che le politiche siano inutili. Il gap indica che le politiche attuali sono insufficienti, non che le politiche siano irrilevanti.","Non corretto. Al 2023 si è a +1,2°C, non ancora a 1,5°C. Il target è ancora rilevante come obiettivo, anche se la traiettoria attuale non sembra raggiungerlo.","Non corretto. Il testo non dice che i modelli sovrastimano. Le proiezioni di +2,5-3°C sono basate sui modelli più aggiornati applicati alle politiche attualmente in vigore."]],["Il testo dice che la produzione di petrolio dalle riserve esistenti recupera al massimo il 50% del petrolio originale, 'il resto rimane intrappolato nella roccia'. Quale implicazione ha questo per le stime delle riserve mondiali?",["Le riserve 'provate' contano solo il petrolio che conviene estrarre oggi, non tutto quello esistente","Significa che le riserve mondiali di petrolio sono già esaurite al 50% e tra 25 anni finiranno definitivamente","Significa che tutta la stima di '50 anni di riserve' deve essere divisa per due, quindi il petrolio finirà in 25 anni","Significa che la perforazione tradizionale è inutile e si dovrebbero usare solo tecniche di fratturazione idraulica"],0,"Le '1.700 miliardi di barili' di riserve provate rappresentano solo il petrolio estraibile economicamente con tecnologie attuali. La stima di '50 anni ai ritmi attuali' dipende da: tasso di consumo, tecnologie di estrazione (che possono migliorare), prezzi del petrolio (che determinano cosa è economicamente conveniente estrarre), e nuove scoperte di giacimenti.",["Esatto! Le '1.700 miliardi di barili' di riserve provate includono solo il petrolio estraibile con tecnologie attuali a costi ragionevoli. Il petrolio fisicamente presente è molto maggiore, ma il 50% rimane intrappolato nella roccia anche con le migliori tecnologie. Le stime di '50 anni' dipendono dalle tecnologie e dai prezzi.","Non corretto. La stima di '50 anni' si riferisce alle riserve provate ai ritmi di consumo attuali. Non significa che il 50% è già esaurito: significa che la tecnologia recupera solo il 50% del petrolio presente in ogni giacimento.","Non corretto. La stima di 50 anni si basa sulle riserve già calcolate tenendo conto del tasso di recupero. Non occorre dividerla ulteriormente.","Non corretto. Il testo non suggerisce la fratturazione idraulica come soluzione universale. Il punto è che le riserve 'provate' sono quelle economicamente estraibili con tecnologie attuali."]],["La distillazione frazionata del petrolio separa diversi prodotti (benzina, cherosene, gasolio, ecc.) a temperature diverse. Il testo include anche 'materie prime petrolchimiche' per plastiche e fibre sintetiche. Quale implicazione ha questo per la transizione energetica?",["Anche senza carburanti resterà una domanda di petrolio per plastiche, fibre e farmaci","La transizione energetica è impossibile perché le energie rinnovabili non producono petrolio per le plastiche","La benzina è l'unico prodotto utile della raffinazione del petrolio; tutto il resto è uno spreco da eliminare","Se si smette di usare petrolio come carburante, il prezzo di tutte le plastiche aumenterà automaticamente del 1000%"],0,"Il petrolio è sia carburante sia materia prima dell'industria chimica: le plastiche, le fibre tessili sintetiche (poliestere, nylon), i farmaci, i cosmetici, i detersivi derivano tutti dal petrolio. La transizione energetica può sostituire il petrolio come combustibile (con rinnovabili), ma la domanda di petrolio come materia prima chimica è molto più difficile da eliminare e richiede soluzioni separate (chimica verde, bioplastiche).",["Esatto! Il petrolio non è solo un carburante: è la materia prima dell'industria chimica (plastiche, fibre tessili sintetiche, farmaci, cosmetici). La transizione energetica può sostituire il petrolio come combustibile, ma la domanda di petrolio come materia prima chimica è più difficile da eliminare.","Non corretto. Le energie rinnovabili non devono produrre petrolio: producono elettricità. La questione delle plastiche è separata dalla transizione energetica.","Non corretto. Il testo elenca molti prodotti della raffinazione (kerosene, gasolio, lubrificanti, bitume, petrolchimici) tutti con usi importanti. La benzina è solo una delle frazioni.","Non corretto. Il testo non fa questa affermazione. L'implicazione è che la domanda di petrolio come materia prima chimica persisterà oltre la transizione energetica, ma non necessariamente con aumenti di prezzo così drastici."]],["Il testo presenta l'impronta carbonica media italiana di 7-8 tonnellate CO₂/anno e precisa: 'questo dato è utile per contestualizzare le scelte, non per produrre senso di colpa individuale'. Perché questa distinzione è metodologicamente importante?",["Perché la crisi dipende da sistemi collettivi, come energia e trasporti, che i singoli da soli non cambiano","Perché il senso di colpa aumenta la probabilità di prendere decisioni irrazionali e peggiorare le emissioni","Perché i dati sull'impronta carbonica sono statisticamente inaffidabili e non dovrebbero guidare le scelte","Perché il cambiamento climatico è un problema dei paesi ricchi che i paesi poveri non hanno causato e non devono risolvere"],0,"La distinzione tra contestualizzazione e senso di colpa è metodologicamente importante perché: 1) i dati aiutano a identificare dove le riduzioni sono più efficaci (trasporti, riscaldamento); 2) la crisi climatica ha cause sistemiche (infrastrutture energetiche, sistemi di trasporto, industria) che non si risolvono solo con scelte individuali; 3) individualizzare eccessivamente il problema può distogliere l'attenzione dalle responsabilità collettive e istituzionali.",["Esatto! La distinzione è importante: i dati sull'impronta carbonica permettono di capire dove si concentrano le emissioni (trasporti, riscaldamento, elettricità) per prendere decisioni informate. Ma la crisi climatica richiede cambiamenti sistemici (infrastrutture, politiche energetiche) oltre alle scelte individuali.","Non corretto. Il testo non argomenta che il senso di colpa causi decisioni irrazionali. Il punto è che la crisi richiede risposte sia individuali sia sistemiche, e individualizzare eccessivamente il problema distoglie l'attenzione dalle responsabilità collettive.","Non corretto. Il testo usa i dati come strumento utile per 'contestualizzare le scelte'. Non mette in dubbio la loro affidabilità statistica.","Non corretto. Sebbene esista il tema della giustizia climatica (chi ha emesso di più storicamente), il testo non usa questa distinzione per separare responsabilità tra paesi ricchi e poveri."]],["Il testo riporta che la CO₂ è 'il principale responsabile dell'aumento dell'effetto serra' e che 'non è un inquinante nel senso tradizionale — non odora, non si vede'. Perché questa caratteristica rende il cambiamento climatico particolarmente difficile da percepire e gestire politicamente?",["Perché causa ed effetti sono lontani nel tempo e nello spazio, e il legame è difficile da percepire","Perché la CO₂ invisibile è più facile da eliminare con filtri chimici rispetto all'inquinamento tradizionale","Perché i governi non sanno che la CO₂ esiste come problema, in quanto non la vedono né la sentono","Perché la CO₂ invisibile può essere aumentata segretamente dai paesi senza che nessuno se ne accorga"],0,"L'invisibilità e inodorità della CO₂ creano una disconnessione causale: non c'è un segnale sensoriale diretto che colleghi 'sto bruciando benzina' a 'il pianeta si scalda'. Gli effetti del cambiamento climatico emergono in decenni (non secondi) e su scala globale (non locale). Questa separazione spazio-temporale tra causa ed effetto è una delle principali ragioni della lentezza della risposta politica al cambiamento climatico.",["Esatto! L'inquinamento tradizionale (smog, odori) produce impatti visibili e immediati che motivano azioni rapide. La CO₂ è invisibile, inodore, e i suoi effetti emergono in decenni e sono globali, non locali. Questa disconnessione spazio-temporale rende difficile la risposta politica immediata.","Non corretto. La CO₂ è molto più difficile da filtrare e stoccare rispetto a molti inquinanti tradizionali. Il problema non è tecnologico ma politico e percettivo.","Non corretto. I governi conoscono il problema della CO₂ da decenni. La difficoltà non è di conoscenza ma di risposta politica a un fenomeno con causa invisibile ed effetti lontani nel tempo e nello spazio.","Non corretto. Le emissioni di CO₂ vengono monitorate satellitarmente e con reti di misura. Il problema non è la segretezza ma la difficoltà cognitiva di percepire un rischio invisibile con effetti differiti."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>

<script>
// Modalità LIM · percorso a passi. In LIM ogni scheda livello diventa una sequenza di schermate:
// consegna + prima attività → attività successive → Rifletti → Verifica (una domanda per volta) → Compito.
// Si naviga con la barra in basso, con PagSu/PagGiù o con le frecce del telecomando/presenter.
// Fuori dalla modalità LIM la pagina resta identica (tutte le regole valgono solo sotto html.lim).
(function () {
  const root = document.documentElement;
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const bar = mk("nav", "lim-steps"); bar.setAttribute("aria-label", "Passi del laboratorio");
  const prev = mk("button", null, "◀ Indietro"); prev.type = "button";
  const dots = mk("div", "lim-dots");
  const next = mk("button", "lim-next", "Avanti ▶"); next.type = "button";
  bar.append(prev, dots, next);
  let steps = [], cur = 0, panel = null;
  const all = () => steps.flatMap((s) => s.els);

  function label(el) {
    if (el.classList.contains("meta")) return "Rifletti";
    if (el.classList.contains("verif")) return "Verifica";
    if (el.classList.contains("bridge")) return "Compito";
    const h = el.querySelector(".blk-h, h3, h2"); if (h) return h.textContent.trim();
    return el.classList.contains("brief") ? "Consegna" : "Attività";
  }
  function build() {
    all().forEach((e) => e.classList.remove("lim-off"));
    panel = document.querySelector(".wrap > .panel:not([hidden])"); steps = [];
    if (!panel) { bar.hidden = true; return; }
    const kids = [...panel.children];
    for (let i = 0; i < kids.length; i++) {
      const e = kids[i];
      // la consegna sta sopra la prima attività, nella stessa schermata
      if (e.classList.contains("brief") && kids[i + 1]) { steps.push({ els: [e, kids[i + 1]], t: label(kids[i + 1]) }); i++; continue; }
      steps.push({ els: [e], t: label(e) });
    }
    const br = document.querySelector(".wrap > .bridge"); if (br) steps.push({ els: [br], t: "Compito" });
    dots.innerHTML = "";
    steps.forEach((s, i) => {
      const t = s.t.length > 22 ? s.t.slice(0, 20).trim() + "…" : s.t;
      const b = mk("button", null, `<span class="n">${i + 1}</span><span class="t">${t.replace(/[&<>]/g, "")}</span>`);
      b.type = "button"; b.title = s.t; b.onclick = () => go(i); dots.appendChild(b);
    });
    bar.hidden = steps.length < 2;
    if (steps.length < 2) { clear(); return; }
    cur = Math.min(cur, steps.length - 1); go(cur, true);
  }
  function go(i, quiet) {
    if (!steps.length) return;
    cur = Math.max(0, Math.min(steps.length - 1, i));
    all().forEach((e) => e.classList.add("lim-off"));
    steps[cur].els.forEach((e) => e.classList.remove("lim-off"));
    [...dots.children].forEach((b, j) => { if (j === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
    dots.children[cur]?.scrollIntoView({ inline: "center", block: "nearest" });
    prev.disabled = cur === 0; next.disabled = cur === steps.length - 1;
    if (!quiet) window.scrollTo({ top: 0 });
    window.dispatchEvent(new Event("resize")); // grafici e 3D si ridisegnano quando diventano visibili
  }
  function clear() { all().forEach((e) => e.classList.remove("lim-off")); }
  prev.onclick = () => go(cur - 1); next.onclick = () => go(cur + 1);

  // Verifica: una domanda per volta, con «Domanda n di N»
  function pager(v) {
    if (v.dataset.limq) return; v.dataset.limq = "1";
    const body = v.querySelector(".verif-body"); if (!body) return;
    const nav = mk("div", "lim-qnav"); const pb = mk("button", null, "◀"); const txt = mk("span"); const nb = mk("button", null, "Domanda successiva ▶");
    pb.type = nb.type = "button"; nav.append(pb, txt, nb); body.after(nav);
    let q = 0;
    const show = () => { const qs = [...body.querySelectorAll(".vq")]; if (!qs.length) return; q = Math.max(0, Math.min(qs.length - 1, q));
      qs.forEach((x, j) => x.classList.toggle("lim-cur", j === q)); txt.textContent = `Domanda ${q + 1} di ${qs.length}`; pb.disabled = q === 0; nb.disabled = q === qs.length - 1; };
    pb.onclick = () => { q--; show(); }; nb.onclick = () => { q++; show(); };
    new MutationObserver(() => { if (!body.querySelector(".vq.lim-cur")) { q = 0; show(); } }).observe(body, { childList: true });
    show();
  }

  function sync() {
    const on = root.classList.contains("lim");
    if (on) { build(); } else clear();
  }
  function mount() {
    document.body.appendChild(bar);
    document.querySelectorAll(".verif").forEach(pager);
    // cambio di livello: ricostruisci i passi quando cambia la scheda visibile (in qualunque modo avvenga)
    let tmr = 0;
    const onPanel = () => { clearTimeout(tmr); tmr = setTimeout(() => { const p = document.querySelector(".wrap > .panel:not([hidden])"); if (p !== panel) cur = 0; if (root.classList.contains("lim")) build(); }, 0); };
    document.querySelectorAll(".wrap > .panel").forEach((p) => new MutationObserver(onPanel).observe(p, { attributes: true, attributeFilter: ["hidden"] }));
    document.addEventListener("keydown", (e) => {
      if (!root.classList.contains("lim")) return;
      const tag = (e.target.tagName || "").toLowerCase(); if (tag === "textarea" || tag === "input" || tag === "select") return;
      if (e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
      if (e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
    });
    new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["class"] });
    sync();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
