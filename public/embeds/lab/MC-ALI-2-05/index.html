<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Packaging sotto la lente</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-ALI-2-05","F":[["Quante funzioni principali svolge il packaging alimentare?",["Due: protezione e informazione","Cinque, dalla protezione alla distribuzione","Tre: contenere, etichettare e trasportare","Sette, inclusi riciclo e compostabilità"],1,"Il packaging alimentare svolge cinque funzioni: 1) protezione meccanica (dagli urti); 2) conservazione e barriera (blocca ossigeno, umidità, contaminanti); 3) informazione obbligatoria per legge; 4) marketing (immagini, claim); 5) facilitazione della distribuzione logistica.",["Non è corretto. Le funzioni del packaging sono più numerose e diverse. La protezione e l'informazione sono solo due di esse.","Esatto! Le cinque funzioni del packaging sono: 1) protezione meccanica, 2) conservazione e barriera, 3) informazione e identificazione, 4) marketing e comunicazione, 5) facilitazione della distribuzione.","Non è corretto. Queste sono descrizioni generiche. Il testo identifica cinque funzioni specifiche con ruoli tecnici precisi.","Non è corretto. Il riciclo e la compostabilità sono caratteristiche del materiale, non funzioni primarie del packaging definite nel testo."]],["Quale tipo di plastica è indicata dal simbolo ♳ con il numero 1 ed è comunemente riciclabile?",["PP (polipropilene)","PET (polietilene tereftalato)","PVC (polivinilcloruro)","PS (polistirolo)"],1,"Il PET (polietilene tereftalato, numero 1) è la plastica delle bottiglie dell'acqua, succhi e molti altri liquidi. È trasparente, leggera e riciclabile. Il HDPE (2) è per flaconi rigidi; PVC (3) per tubi; PP (5) per contenitori alimentari.",["Non è corretto. Il PP ha il numero 5. Il numero 1 indica un tipo di plastica diverso usato principalmente per bottiglie trasparenti.","Esatto! Il PET (numero 1) è la plastica delle bottiglie dell'acqua e dei succhi. È trasparente, leggera e riciclabile.","Non è corretto. Il PVC ha il numero 3. È usato per tubi e profili di finestre, non per bottiglie trasparenti.","Non è corretto. Il PS ha il numero 6. È usato per bicchieri da caffè e vassoi. Raramente riciclato."]],["Cos'è l'over-packaging?",["L'uso di materiali di imballaggio di qualità superiore al necessario per prodotti di lusso","Imballaggi sproporzionati rispetto alle reali necessità di protezione, conservazione o trasporto","Il peso totale dell'imballaggio che supera il peso del prodotto contenuto","La tendenza a usare troppi tipi diversi di materiale nello stesso imballaggio"],1,"L'over-packaging è l'uso di imballaggi sproporzionati rispetto alle reali necessità tecniche. Esempi: biscotti singolarmente avvolti dentro una confezione già di plastica, fragole in vassoio rigido + carta + sacchetto + borsa. Genera rifiuti evitabili e può ingannare sulla quantità reale del prodotto.",["Non è corretto. L'over-packaging non riguarda la qualità ma la quantità di imballaggio, che è sproporzionata rispetto alle reali necessità tecniche.","Esatto! L'over-packaging descrive imballaggi eccessivi rispetto alle reali necessità tecniche: biscotti singolarmente avvolti dentro una confezione già di plastica, fragole in più strati di materiale, ecc.","Non è corretto. Il peso relativo può essere un indicatore, ma l'over-packaging è definito dalla sproporzione tra imballaggio e necessità tecnica reale, non da un rapporto di peso.","Non è corretto. L'uso di materiali multipli in uno stesso imballaggio (es. tetrapak) può essere tecnicamente giustificato. L'over-packaging riguarda la quantità totale di imballaggio."]],["Il latte UHT ha una durata di 3-6 mesi a temperatura ambiente. Quale caratteristica del suo packaging lo rende possibile?",["È confezionato in vetro che blocca completamente la luce e l'ossigeno","È in tetrapak, che blocca luce, ossigeno e umidità dopo il trattamento UHT","Contiene conservanti chimici approvati dalla normativa UE","Viene conservato sotto vuoto per eliminare tutti i microorganismi"],1,"Il tetrapak è un materiale composito a 6 strati (cartone + polietilene + alluminio) che blocca luce, ossigeno e umidità. Combinato con la sterilizzazione UHT (135-150°C per 2-4 secondi) e il confezionamento asettico, permette 3-6 mesi a temperatura ambiente senza conservanti.",["Non è corretto. Il latte UHT è confezionato in tetrapak (materiale composito multistrato), non in vetro.","Esatto! Il tetrapak (6 strati: 75% cartone, 20% polietilene, 5% alluminio) crea una barriera completa a luce, ossigeno e umidità. Combinato con il trattamento UHT, permette 3-6 mesi a temperatura ambiente.","Non è corretto. Il latte UHT non contiene conservanti chimici. La lunga durata dipende dalla sterilizzazione termica (UHT) e dal confezionamento asettico.","Non è corretto. Il tetrapak non è confezionato sottovuoto. La durata dipende dall'assenza di ossigeno (barriera dell'alluminio) e dalla sterilizzazione UHT."]],["Cosa indica il simbolo 'Mobius Loop' (tre frecce che formano un triangolo) sul packaging?",["Che il materiale è già fatto di plastica riciclata al 100%","Che il materiale è riciclabile, non che verrà davvero riciclato","Che il produttore ha pagato una tassa ambientale per il suo imballaggio","Che l'imballaggio è biodegradabile in qualsiasi condizione ambientale"],1,"Il Mobius Loop (tre frecce) indica che il materiale è tecnicamente riciclabile. NON garantisce che venga effettivamente riciclato: dipende dalla disponibilità di impianti nel tuo comune. La riciclabilità teorica e quella pratica sono due cose diverse.",["Non è corretto. Il Mobius Loop indica che il materiale è tecnicamente riciclabile, non che sia già fatto di materiale riciclato.","Esatto! Il Mobius Loop indica la riciclabilità tecnica del materiale. Non significa che il tuo comune sia attrezzato per riciclarlo: dipende dal sistema locale di raccolta e trattamento.","Non è corretto. La tassa ambientale è indicata da altri simboli (es. il Punto Verde/Der Grüne Punkt). Il Mobius Loop indica la riciclabilità tecnica del materiale.","Non è corretto. La biodegradabilità è indicata da altri simboli specifici. Il Mobius Loop riguarda la riciclabilità meccanica, non la biodegradazione."]],["Perché il sacchetto delle patatine non è trasparente ma metallizzato?",["Perché la plastica colorata è più economica da produrre rispetto a quella trasparente","Perché l'alluminio blocca luce UV e ossigeno che ossiderebbero i grassi delle patatine rendendole rancide","Perché nascondere le patatine al consumatore aumenta la percezione del prodotto come 'premium'","Perché la normativa europea vieta la trasparenza per gli alimenti confezionati con atmosfera modificata"],1,"Il film metallizzato (plastica + strato sottilissimo di alluminio) riflette la luce UV e blocca l'ossigeno, impedendo l'ossidazione dei grassi delle patatine (irrancidimento). Durata: 6-12 mesi invece di pochi giorni. Il costo: quasi impossibile da riciclare perché i due materiali sono inscindibili.",["Non è corretto. Il film metallizzato è in realtà più costoso della plastica trasparente. Il motivo è tecnico-funzionale, non economico.","Esatto! Il film metallizzato (alluminio su plastica) riflette la luce UV e blocca l'ossigeno. Senza di esso, i grassi delle patatine si ossiderebbero in pochi giorni. Con il sacchetto metallizzato durano 6-12 mesi.","Non è corretto. La scelta del materiale è tecnico-funzionale: il film metallizzato protegge i grassi dall'ossidazione. Non è una strategia di marketing.","Non è corretto. Non esiste questa normativa. Molti prodotti in atmosfera modificata sono confezionati in materiali trasparenti o semi-trasparenti."]]],"I":[["Perché il tetrapak è difficile da riciclare nonostante abbia una componente di cartone?",["Perché il cartone del tetrapak è di qualità troppo bassa per essere riciclato","Perché i suoi strati di cartone, plastica e alluminio sono difficili da separare","Perché il tetrapak contiene additivi chimici che contaminano il processo di riciclo della carta","Perché il tetrapak è classificato come rifiuto pericoloso in molte regioni italiane"],1,"Il tetrapak è composto da 6 strati di 3 materiali diversi (cartone 75%, polietilene 20%, alluminio 5%) incollati insieme. Separarli richiede impianti specializzati (che esistono ma non sono ovunque). Per questo non tutti i comuni raccolgono il tetrapak nella raccolta differenziata standard.",["Non è corretto. Il problema non è la qualità del cartone. Il problema è che i tre materiali (cartone, polietilene, alluminio) sono incollati insieme e difficili da separare.","Esatto! Il tetrapak ha 6 strati di 3 materiali diversi (75% cartone, 20% polietilene, 5% alluminio) incollati insieme. Separarli richiede impianti specializzati non presenti in tutti i comuni.","Non è corretto. Il problema non è la contaminazione chimica ma la struttura fisica multistrato che richiede processi specializzati per separare i materiali.","Non è corretto. Il tetrapak non è un rifiuto pericoloso. È un materiale composito non pericoloso ma complesso da riciclare per via della struttura multistrato."]],["Quale differenza pratica esiste tra una bioplastica 'biodegradabile e compostabile' e una 'bio-based ma non biodegradabile'?",["La prima si decompone in qualsiasi ambiente; la seconda si decompone solo in impianti industriali","La prima si decompone in impianti di compostaggio; la seconda è rinnovabile ma non si decompone","Sono equivalenti in termini di impatto ambientale perché entrambe vengono da fonti rinnovabili","La prima è approvata per uso alimentare; la seconda non può essere a contatto con il cibo"],1,"Bioplastica biodegradabile e compostabile (es. PLA): si decompone in impianti industriali a 55-60°C (non in natura o compostaggio domestico). Bio-based ma non biodegradabile: prodotta da fonti rinnovabili (mais, canna da zucchero) ma non si decompone, comportandosi come la plastica da petrolio a fine vita.",["Non è corretto. La prima si decompone in impianti industriali di compostaggio (non in qualsiasi ambiente naturale). La seconda non si decompone in nessun modo simile alla plastica convenzionale.","Esatto! La bioplastica compostabile (es. PLA) si decompone in impianti specifici (55-60°C, condizioni controllate). Quella bio-based (es. alcune plastiche da canna da zucchero) è rinnovabile ma non biodegradabile: persiste come la plastica da petrolio.","Non è corretto. Sono molto diverse: una ha una fine-vita più sostenibile (compostaggio), l'altra no. L'impatto ambientale dipende sia dalla fonte che dalla fine-vita.","Non è corretto. Entrambe possono essere usate per imballaggi alimentari se approvate dai regolatori. La differenza è nella biodegradabilità, non nell'uso alimentare."]],["Il Regolamento UE 1169/2011 impone l'etichettatura degli allergeni in modo specifico. Come devono essere indicati?",["In una sezione separata dell'etichetta preceduta dalla scritta 'AVVERTENZA ALLERGENI'","Evidenziati in grassetto o con colore diverso nell'elenco degli ingredienti","Su un'etichetta supplementare separata dal prodotto","Solo nel foglietto illustrativo scaricabile online tramite QR code"],1,"Il Regolamento UE 1169/2011 impone che i 14 allergeni principali siano evidenziati in grassetto, corsivo o colore diverso nell'elenco degli ingredienti. Devono essere fisicamente visibili sulla confezione. I 14 allergeni includono: glutine, crostacei, uova, pesce, arachidi, soia, latte, frutta a guscio, sedano, senape, sesamo, solfiti, lupino, molluschi.",["Non è corretto. Il Regolamento UE non richiede una sezione separata. Gli allergeni devono essere evidenziati nell'elenco degli ingredienti dove appaiono naturalmente.","Esatto! I 14 allergeni principali riconosciuti dall'UE devono essere evidenziati (grassetto, corsivo o colore diverso) nell'elenco degli ingredienti, dove appaiono naturalmente nella lista.","Non è corretto. Non è richiesta un'etichetta separata. Gli allergeni vanno evidenziati nell'elenco degli ingredienti sulla confezione principale.","Non è corretto. L'etichettatura degli allergeni deve essere fisicamente presente sulla confezione, non solo online."]],["Cosa significa che il vetro si ricicla 'all'infinito senza perdita di qualità', a differenza della plastica?",["Che il vetro può essere riciclato in qualsiasi impianto senza separazione per colore","Che una bottiglia rifusa diventa una bottiglia nuova con le stesse proprietà","Che il vetro può essere riciclato senza consumo di energia","Che il vetro, una volta lanciato in mare, si dissolve senza creare microplastiche"],1,"Il vetro rifuso mantiene le stesse proprietà chimico-fisiche: una bottiglia di vetro riciclata diventa una bottiglia identica. La plastica invece degrada a ogni ciclo (catene polimeriche più corte) e dopo 2-3 cicli di riciclo non è più adatta per certi usi. Per questo il vetro è riciclabile 'all'infinito'.",["Non è corretto. Il vetro deve essere separato per colore (bianco, verde, marrone) perché le diverse composizioni chimiche interferiscono tra loro nel rifuso.","Esatto! Il vetro, rifuso, mantiene esattamente le stesse proprietà chimico-fisiche. La plastica invece degrada a ogni ciclo di riciclo (le catene polimeriche si accorciano) e dopo pochi cicli non è più utilizzabile.","Non è corretto. Riciclare il vetro richiede energia per la fusione a circa 1.200°C, ma ne consuma meno rispetto alla produzione da sabbia vergine.","Non è corretto. Il vetro in mare non si dissolve rapidamente: si sminuzza in frammenti pericolosi. Il vantaggio del vetro è nel ciclo di riciclo industriale, non nell'ambiente naturale."]],["Il packaging 'intelligente' con indicatori di freschezza risolve quale limite dei packaging tradizionali?",["Riduce il costo di produzione dell'imballaggio usando meno materiale","Mostra lo stato reale del prodotto, non una data fissa uguale per tutti","Elimina la necessità dell'etichettatura obbligatoria per legge riducendo i costi","Permette al prodotto di autoconservarsi senza catena del freddo"],1,"La data di scadenza stampata è fissa e non considera le variazioni reali nelle condizioni di conservazione. Un indicatore di freschezza (che cambia colore in base allo stato chimico-biologico del prodotto) fornisce un'informazione più accurata: può segnalare deterioramento prima della scadenza teorica o confermare la freschezza dopo di essa.",["Non è corretto. Il packaging intelligente è più costoso da produrre, non più economico. Risolve un problema di informazione, non di costo.","Esatto! La data di scadenza è fissa e non considera variazioni nelle condizioni di conservazione. Un indicatore di freschezza risponde allo stato reale del prodotto: se è rimasto fuori dal frigo, lo segnala prima della scadenza teorica.","Non è corretto. Il packaging intelligente non sostituisce l'etichettatura obbligatoria. Le informazioni legali rimangono necessarie indipendentemente dagli indicatori smart.","Non è corretto. Gli indicatori di freschezza segnalano lo stato del prodotto ma non modificano le sue proprietà di conservazione. La catena del freddo rimane necessaria."]],["La normativa europea PPWR (2024) sui rifiuti di imballaggio fissa quali obiettivi per il 2030?",["Vietare completamente l'uso di plastica negli imballaggi alimentari entro il 2030","Rendere tutti gli imballaggi riciclabili e aumentare la quota di plastica riciclata negli imballaggi","Rendere obbligatorio il packaging biodegradabile per tutti i prodotti alimentari freschi","Eliminare il packaging monouso per tutti i prodotti venduti nei supermercati"],1,"Il Regolamento UE sull'imballaggio PPWR (2024) stabilisce: entro 2030, tutti gli imballaggi UE devono essere riciclabili; entro 2040, almeno il 50% della plastica negli imballaggi deve essere riciclata. Prevede anche la riduzione del packaging superfluo.",["Non è corretto. Non esiste un divieto totale della plastica negli imballaggi. La normativa fissa obiettivi di riciclabilità e contenuto di materiale riciclato.","Esatto! La PPWR (2024) stabilisce che entro il 2030 tutti gli imballaggi UE devono essere riciclabili; entro il 2040, la quota di plastica riciclata negli imballaggi deve essere almeno del 50%.","Non è corretto. La PPWR non impone il packaging biodegradabile come standard generale. Fissa obiettivi di riciclabilità e riduzione del packaging superfluo.","Non è corretto. Non esiste questo divieto universale del monouso. Alcune categorie specifiche sono regolate (come le stoviglie in plastica monouso), ma non tutti gli imballaggi."]]],"A":[["Un'azienda deve scegliere il packaging per yogurt da vendere in un comune dove non si raccoglie il tetrapak. Quale materiale è la scelta più sostenibile nella sua interezza?",["Tetrapak, perché è il più leggero e riduce le emissioni di trasporto","Vasetto di vetro con sistema di deposito-restituzione, per garantire fine-vita certa","Film di bioplastica PLA compostabile, che si decompone rapidamente in qualsiasi ambiente","La scelta non importa perché tutti i packaging hanno lo stesso impatto ambientale nel lungo periodo"],1,"La scelta di packaging non può prescindere dal sistema di raccolta locale. Se il tetrapak e il PLA non vengono raccolti differenziatamente nel comune, finiscono in discarica. Il vetro con sistema deposito-restituzione garantisce una fine-vita certa indipendentemente dalla raccolta municipale.",["Non è corretto. Se il tetrapak non viene riciclato nel comune (finisce in indifferenziata), i vantaggi del materiale composito sono annullati dalla mancanza di fine-vita sostenibile.","Esatto! Se il tetrapak finisce in indifferenziata, il vetro con deposito-restituzione è più sostenibile: si ricicla all'infinito senza perdita di qualità, anche se è più pesante e costoso da trasportare.","Non è corretto. Il PLA è compostabile SOLO in impianti industriali a 55-60°C. Se non c'è raccolta dell'organico dedicata, finisce in discarica come la plastica convenzionale.","Non è corretto. I packaging hanno impatti ambientali molto diversi in funzione del materiale, del peso, della fine-vita e del sistema di raccolta locale."]],["Un prodotto di pasta ha in etichetta: 'Grano coltivato al sole italiano, pasta trafilata al bronzo'. Quale di questi claim è obbligatorio per legge e quale è marketing?",["Entrambi sono obbligatori per legge secondo il Regolamento UE 1169/2011","Il primo può essere solo marketing; «trafilata al bronzo» è un dato tecnico verificabile","Entrambi sono claim di marketing senza valore informativo per il consumatore","Il paese d'origine 'italiano' è sempre obbligatorio in etichetta per tutti i prodotti alimentari"],1,"Le etichette combinano informazioni obbligatorie (ingredienti, allergeni, valori nutrizionali, condizioni di conservazione) con messaggi di marketing. 'Naturale', 'al sole', 'artigianale' non hanno definizioni legali precise. 'Trafilata al bronzo' è una caratteristica tecnica verificabile. Saper distinguere i due livelli è competenza del consumatore informato.",["Non è corretto. Il Regolamento UE non impone di dichiarare la trafilatura al bronzo. Le informazioni obbligatorie sono diverse da quelle di marketing.","Esatto! 'Grano coltivato al sole italiano' è un claim di marketing (vago, non definito legalmente). 'Trafilata al bronzo' descrive una tecnica produttiva verificabile. Il paese d'origine del grano è invece obbligatorio in una specifica sezione.","Non è corretto. 'Trafilata al bronzo' ha un significato tecnico preciso (la trafila in bronzo crea una superficie più ruvida che trattiene meglio il sugo). Non è solo marketing.","Non è corretto. Il paese d'origine è obbligatorio solo per alcune categorie (carne, pesce, miele, olio, frutta, verdura, uova). Per la pasta trasformata, l'obbligo riguarda il paese d'origine del grano, non del prodotto finito."]],["In Germania esiste il sistema Pfand (deposito) per bottiglie: si paga un deposito e lo si recupera restituendo la bottiglia. Quale problema risolve rispetto al sistema italiano?",["Riduce il prezzo dei prodotti per i consumatori grazie ai minori costi di packaging","Dà un incentivo economico diretto: quasi tutte le bottiglie tornano indietro","Elimina la necessità di impianti di riciclo perché le bottiglie vengono riutilizzate senza trasformazione","Riduce i rifiuti di imballaggio perché i produttori sono obbligati a usare meno packaging"],1,"Il sistema di deposito (Pfand in Germania) usa un incentivo economico diretto: paghi una cauzione sulla bottiglia e la recuperi restituendola. Il tasso di ritorno supera il 98% in Germania vs. percentuali molto più basse nella raccolta differenziata volontaria. La motivazione non deve essere ambientale: il portafoglio basta.",["Non è corretto. Il Pfand non riduce il prezzo del prodotto: aggiunge un deposito che poi viene restituito. L'obiettivo non è economico per il consumatore ma ambientale.","Esatto! Il Pfand usa un incentivo economico (recuperi soldi restituendo la bottiglia) che porta il tasso di ritorno sopra il 98% in Germania, molto più efficace della raccolta differenziata volontaria italiana.","Parzialmente vero per le bottiglie di vetro (riutilizzo diretto), ma le bottiglie di plastica del Pfand vengono riciclate, non riutilizzate. Il vantaggio è l'altissimo tasso di raccolta.","Non è corretto. Il Pfand non riduce il packaging: garantisce che il packaging usato venga raccolto e gestito correttamente, invece di finire nell'ambiente."]],["Il sacchetto delle patatine metallizzato protegge benissimo il prodotto ma è quasi impossibile da riciclare. Come si chiama questo tipo di compromesso tecnologico?",["Obsolescenza programmata: il packaging è progettato per durare poco e dover essere sostituito","Compromesso tecnologico: ottimo per proteggere, problematico a fine vita","Greenwashing: l'azienda finge di avere packaging sostenibile mentre non lo è","Efficienza paretiana: si massimizza una prestazione senza peggiorarne nessun'altra"],1,"Il film metallizzato delle patatine è un trade-off tecnologico: eccellente per proteggere i grassi dall'ossidazione (durata 6-12 mesi invece di giorni), ma quasi impossibile da riciclare perché separarla plastica dall'alluminio richiede processi costosi non disponibili ovunque. Non esiste packaging perfetto su tutti i fronti.",["Non è corretto. L'obsolescenza programmata riguarda la durata del prodotto, non il bilanciamento tra prestazioni e riciclabilità di un materiale.","Esatto! Il film metallizzato è ottimale per proteggere i grassi dall'ossidazione, ma il materiale composito (plastica + alluminio) è quasi impossibile da riciclare. È il classico trade-off tecnologico: non esiste una soluzione perfetta su tutti i fronti.","Non è corretto. Greenwashing è la comunicazione ingannevole sulla sostenibilità. Un'azienda che usa il film metallizzato non sta necessariamente facendo greenwashing: sta usando il materiale tecnicamente più adatto, con i suoi compromessi.","Non è corretto. L'efficienza paretiana implica che nessun aspetto peggiora. Qui c'è un peggioramento esplicito (riciclabilità) a favore di un miglioramento (protezione). È un trade-off, non Pareto-ottimo."]],["Un'azienda dichiara in etichetta che le sue posate monouso sono 'completamente biodegradabili'. Quali informazioni mancanti rendono questo claim potenzialmente fuorviante?",["Non specifica il colore e il design delle posate, necessari per identificarle correttamente","Non dice in quali condizioni avviene la biodegradazione: impianto, casa o natura","Non specifica il prezzo di ogni posata singola, necessario per valutare il rapporto qualità-prezzo","Non dichiara il peso esatto delle posate in grammi, obbligatorio per legge"],1,"'Biodegradabile' senza specificare le condizioni è un claim potenzialmente fuorviante. Il PLA (la bioplastica più comune) si decompone efficacemente SOLO in impianti di compostaggio industriale (55-60°C, umidità controllata, microbioma specifico). In compostaggio domestico o in natura si decompone molto lentamente, come la plastica convenzionale.",["Non è corretto. Il colore e il design non sono rilevanti per valutare il claim di biodegradabilità.","Esatto! 'Biodegradabile' senza specificare le condizioni è potenzialmente fuorviante. Il PLA (bioplastica comune) si biodegrada solo in impianti di compostaggio industriale a 55-60°C, non in natura o in compostaggio domestico.","Non è corretto. Il prezzo non è rilevante per valutare l'accuratezza del claim di biodegradabilità.","Non è corretto. Il peso delle posate non è un dato obbligatorio per legge per questo tipo di prodotto. Il problema è la mancanza di precisione sul tipo di biodegradazione."]],["Un ingegnere di packaging deve progettare un imballaggio per fragole fresche che massimizzi la shelf life minimizzando l'impatto ambientale. Quali principi deve bilanciare?",["Usare il packaging più spesso possibile per proteggere meglio il prodotto fragile","Bilanciare protezione e durata del prodotto con riciclabilità e meno materiale","Scegliere il packaging di plastica più economico per minimizzare i costi di produzione","Eliminare completamente il packaging per ridurre a zero l'impatto ambientale"],1,"La progettazione del packaging è un esercizio di trade-off: protezione meccanica (le fragole si schiacciano) + barriera chimica (ossigeno accelera il deterioramento) + peso minimo (meno materiale, meno trasporto) + riciclabilità nel sistema locale + costo accettabile. Non esiste una soluzione perfetta: ogni scelta ha compromessi.",["Non è corretto. Un packaging più spesso non aumenta necessariamente la shelf life delle fragole. L'atmosfera modificata e la barriera all'ossigeno sono più efficaci della spessore.","Esatto! Il progettista deve bilanciare: 1) protezione meccanica (le fragole sono fragili); 2) barriera all'ossigeno (rallenta deterioramento); 3) peso minimo del packaging; 4) riciclabilità del materiale nel sistema locale.","Non è corretto. Il costo di produzione è un parametro, ma non è l'unico criterio di progettazione. Shelf life, impatto ambientale e requisiti normativi hanno pari importanza.","Non è corretto. Senza packaging, le fragole si deteriorerebbero rapidamente in distribuzione, generando sprechi alimentari che hanno un impatto ambientale maggiore dell'imballaggio risparmiato."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>

<script>
// Modalità LIM · percorso a passi. In LIM ogni scheda livello diventa una sequenza di schermate:
// consegna + prima attività → attività successive → Rifletti → Verifica (una domanda per volta) → Compito.
// Si naviga con la barra in basso, con PagSu/PagGiù o con le frecce del telecomando/presenter.
// Fuori dalla modalità LIM la pagina resta identica (tutte le regole valgono solo sotto html.lim).
(function () {
  const root = document.documentElement;
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const bar = mk("nav", "lim-steps"); bar.setAttribute("aria-label", "Passi del laboratorio");
  const prev = mk("button", null, "◀ Indietro"); prev.type = "button";
  const dots = mk("div", "lim-dots");
  const next = mk("button", "lim-next", "Avanti ▶"); next.type = "button";
  bar.append(prev, dots, next);
  let steps = [], cur = 0, panel = null;
  const all = () => steps.flatMap((s) => s.els);

  function label(el) {
    if (el.classList.contains("meta")) return "Rifletti";
    if (el.classList.contains("verif")) return "Verifica";
    if (el.classList.contains("bridge")) return "Compito";
    const h = el.querySelector(".blk-h, h3, h2"); if (h) return h.textContent.trim();
    return el.classList.contains("brief") ? "Consegna" : "Attività";
  }
  function build() {
    all().forEach((e) => e.classList.remove("lim-off"));
    panel = document.querySelector(".wrap > .panel:not([hidden])"); steps = [];
    if (!panel) { bar.hidden = true; return; }
    const kids = [...panel.children];
    for (let i = 0; i < kids.length; i++) {
      const e = kids[i];
      // la consegna sta sopra la prima attività, nella stessa schermata
      if (e.classList.contains("brief") && kids[i + 1]) { steps.push({ els: [e, kids[i + 1]], t: label(kids[i + 1]) }); i++; continue; }
      steps.push({ els: [e], t: label(e) });
    }
    const br = document.querySelector(".wrap > .bridge"); if (br) steps.push({ els: [br], t: "Compito" });
    dots.innerHTML = "";
    steps.forEach((s, i) => {
      const t = s.t.length > 22 ? s.t.slice(0, 20).trim() + "…" : s.t;
      const b = mk("button", null, `<span class="n">${i + 1}</span><span class="t">${t.replace(/[&<>]/g, "")}</span>`);
      b.type = "button"; b.title = s.t; b.onclick = () => go(i); dots.appendChild(b);
    });
    bar.hidden = steps.length < 2;
    if (steps.length < 2) { clear(); return; }
    cur = Math.min(cur, steps.length - 1); go(cur, true);
  }
  function go(i, quiet) {
    if (!steps.length) return;
    cur = Math.max(0, Math.min(steps.length - 1, i));
    all().forEach((e) => e.classList.add("lim-off"));
    steps[cur].els.forEach((e) => e.classList.remove("lim-off"));
    [...dots.children].forEach((b, j) => { if (j === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
    dots.children[cur]?.scrollIntoView({ inline: "center", block: "nearest" });
    prev.disabled = cur === 0; next.disabled = cur === steps.length - 1;
    if (!quiet) window.scrollTo({ top: 0 });
    window.dispatchEvent(new Event("resize")); // grafici e 3D si ridisegnano quando diventano visibili
  }
  function clear() { all().forEach((e) => e.classList.remove("lim-off")); }
  prev.onclick = () => go(cur - 1); next.onclick = () => go(cur + 1);

  // Verifica: una domanda per volta, con «Domanda n di N»
  function pager(v) {
    if (v.dataset.limq) return; v.dataset.limq = "1";
    const body = v.querySelector(".verif-body"); if (!body) return;
    const nav = mk("div", "lim-qnav"); const pb = mk("button", null, "◀"); const txt = mk("span"); const nb = mk("button", null, "Domanda successiva ▶");
    pb.type = nb.type = "button"; nav.append(pb, txt, nb); body.after(nav);
    let q = 0;
    const show = () => { const qs = [...body.querySelectorAll(".vq")]; if (!qs.length) return; q = Math.max(0, Math.min(qs.length - 1, q));
      qs.forEach((x, j) => x.classList.toggle("lim-cur", j === q)); txt.textContent = `Domanda ${q + 1} di ${qs.length}`; pb.disabled = q === 0; nb.disabled = q === qs.length - 1; };
    pb.onclick = () => { q--; show(); }; nb.onclick = () => { q++; show(); };
    new MutationObserver(() => { if (!body.querySelector(".vq.lim-cur")) { q = 0; show(); } }).observe(body, { childList: true });
    show();
  }

  function sync() {
    const on = root.classList.contains("lim");
    if (on) { build(); } else clear();
  }
  function mount() {
    document.body.appendChild(bar);
    document.querySelectorAll(".verif").forEach(pager);
    // cambio di livello: ricostruisci i passi quando cambia la scheda visibile (in qualunque modo avvenga)
    let tmr = 0;
    const onPanel = () => { clearTimeout(tmr); tmr = setTimeout(() => { const p = document.querySelector(".wrap > .panel:not([hidden])"); if (p !== panel) cur = 0; if (root.classList.contains("lim")) build(); }, 0); };
    document.querySelectorAll(".wrap > .panel").forEach((p) => new MutationObserver(onPanel).observe(p, { attributes: true, attributeFilter: ["hidden"] }));
    document.addEventListener("keydown", (e) => {
      if (!root.classList.contains("lim")) return;
      const tag = (e.target.tagName || "").toLowerCase(); if (tag === "textarea" || tag === "input" || tag === "select") return;
      if (e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
      if (e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
    });
    new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["class"] });
    sync();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
