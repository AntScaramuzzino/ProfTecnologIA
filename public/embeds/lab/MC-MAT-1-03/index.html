<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Materiali del futuro</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-MAT-1-03","F":[["Cosa sono le bioplastiche 'bio-based'?",["Plastiche che si decompongono in qualsiasi ambiente naturale in meno di 6 mesi","Plastiche prodotte da materie prime biologiche rinnovabili (mais, canna da zucchero, amido) invece che dal petrolio","Plastiche prodotte da microorganismi e batteri in fermentatori industriali","Plastiche che contengono almeno il 30% di materiale riciclato nella loro composizione"],1,"Bio-based indica che la plastica è prodotta da fonti biologiche rinnovabili invece che dal petrolio. Non implica biodegradabilità: esistono plastiche bio-based non biodegradabili (es. PEF da zuccheri vegetali, simile al PET). E viceversa: esistono plastiche biodegradabili da petrolio. Le due caratteristiche sono indipendenti.",["Non è corretto. Bio-based indica l'origine della materia prima (vegetale), non la biodegradabilità. Una plastica può essere bio-based ma non biodegradabile.","Esatto! Bio-based indica che il materiale è prodotto da fonti biologiche rinnovabili (mais, canna da zucchero, amido di patate, cellulosa) invece che da combustibili fossili (petrolio). Non dice nulla sulla biodegradabilità.","Non è corretto. Le plastiche prodotte da batteri (come PHA) sono un caso specifico. Bio-based include anche plastiche da amido, cellulosa e zuccheri vegetali con processi chimici.","Non è corretto. Il contenuto riciclato descrive plastiche da riciclo, non bio-based. Bio-based indica l'origine vegetale della materia prima vergine."]],["Il PLA (acido polilattico) è biodegradabile solo in quali condizioni?",["In qualsiasi ambiente naturale (suolo, acqua dolce, mare) in 2-4 settimane","In impianti di compostaggio industriale a 55-60°C con umidità controllata e microbioma specifico","In qualsiasi terreno umido entro 1-2 anni, come la maggior parte dei materiali organici","Solo nei mari tropicali con temperature superiori a 25°C e forte radiazione UV"],1,"Il PLA si biodegrada efficacemente SOLO in impianti di compostaggio industriale: temperatura 55-60°C, umidità controllata, microorganismi specifici. In compostaggio domestico si degrada molto lentamente (mesi o anni). In natura (suolo, mare) si comporta simile alla plastica convenzionale. La scritta 'biodegradabile' senza specificare le condizioni è fuorviante.",["Non è corretto. Questa è un'idea diffusa ma sbagliata. Il PLA non si degrada rapidamente in ambienti naturali.","Esatto! Il PLA si degrada efficacemente solo in compostaggio industriale (temperatura 55-60°C, umidità controllata, microorganismi specifici). In compostaggio domestico o in natura si degrada molto lentamente.","Non è corretto. Il PLA non si degrada come un materiale organico comune in terreno umido. Richiede le condizioni controllate del compostaggio industriale.","Non è corretto. Le condizioni marine (temperatura, UV) non sono quelle che degradano il PLA. Il PLA richiede compostaggio industriale specifico, non ambienti marini."]],["Chi ha scoperto il grafene e in che anno ha vinto il Premio Nobel?",["Albert Einstein nel 1921, per aver predetto teoricamente la struttura del grafene","Andre Geim e Konstantin Novoselov nel 2010, con un metodo semplice usando uno scotch","Un team di ricercatori cinesi nel 2018, sviluppando un processo industriale scalabile","Thomas Edison nel 1879, come sottoprodotto della ricerca sulla lampadina al carbonio"],1,"Andre Geim e Konstantin Novoselov dell'Università di Manchester hanno isolato il grafene nel 2004 con un metodo sorprendentemente semplice: staccare ripetutamente strati sottili di grafite con uno scotch (esfoliazione meccanica). Hanno vinto il Premio Nobel per la Fisica nel 2010.",["Non è corretto. Einstein non ha scoperto il grafene. Ha vinto il Nobel nel 1921 per la spiegazione dell'effetto fotoelettrico.","Esatto! Geim e Novoselov hanno isolato il grafene nel 2004 con un metodo sorprendentemente semplice: staccare strati di grafite con uno scotch. Hanno vinto il Nobel per la Fisica nel 2010.","Non è corretto. Il grafene è stato isolato per la prima volta da Geim e Novoselov nel 2004 all'Università di Manchester. Il Nobel è stato assegnato nel 2010.","Non è corretto. Edison ha lavorato con il carbone per le lampadine, ma il grafene (strato singolo di atomi di carbonio) non fu isolato fino al 2004."]],["Cos'è una 'materia prima critica' secondo l'Unione Europea?",["Una materia prima pericolosa per la salute che richiede trattamento speciale e certificazione","Una materia prima la cui fornitura è a rischio perché viene da pochi paesi e non ha sostituti immediati","Una materia prima esaurita nei giacimenti europei che deve essere completamente importata da paesi terzi","Una materia prima il cui prezzo supera 1.000 euro al kg sul mercato internazionale"],1,"L'UE ha definito 34 materie prime critiche: materiali la cui fornitura è a rischio perché: 1) sono concentrate in pochi paesi (spesso politicamente instabili); 2) non hanno sostituti immediati per le applicazioni strategiche. Litio, cobalto, terre rare, grafite naturale: tutte usate nella transizione energetica.",["Non è corretto. Le materie prime pericolose sono una categoria diversa (REACH, CLP). Le materie prime critiche sono quelle strategicamente vulnerabili.","Esatto! Le 34 materie prime critiche dell'UE sono materiali strategici la cui fornitura è vulnerabile: provengono da pochi paesi (spesso politicamente instabili) e non hanno sostituti immediati per le applicazioni industriali critiche.","Non è corretto. Non tutte le materie prime critiche sono esaurite in Europa (il cobalto, per esempio, ha depositi europei). Il criterio è la vulnerabilità della catena di fornitura, non l'esaurimento.","Non è corretto. Il prezzo è un parametro di mercato, non il criterio per la classificazione come critica. Alcune materie prime critiche (es. magnesite) non sono particolarmente costose."]],["Il grafene è considerato 'bidimensionale'. Cosa significa in fisica dei materiali?",["Che il grafene esiste solo come immagine digitale e non può essere prodotto in forma fisica","Che il grafene ha spessore di un solo atomo: larghezza e lunghezza esistono ma l'altezza è pari al diametro di un atomo di carbonio","Che il grafene può essere usato solo in applicazioni piatte (circuiti, schermi) e non in strutture tridimensionali","Che il grafene ha due dimensioni di resistenza meccanica ma è debole nella terza dimensione (spessore)"],1,"Il grafene è uno strato singolo di atomi di carbonio disposti in griglia esagonale. Ha larghezza e lunghezza (infinita in teoria), ma in altezza ha le dimensioni di un singolo atomo: ~0,34 nm (un nanometro è un milionesimo di mm). È il primo materiale veramente bidimensionale isolato. La sua natura 2D gli conferisce proprietà eccezionali.",["Non è corretto. Il grafene è fisicamente reale: è stato isolato, manipolato e usato in laboratorio. Bidimensionale descrive la sua struttura fisica, non uno stato virtuale.","Esatto! Il grafene è uno strato singolo di atomi di carbonio: ha larghezza e lunghezza ma lo spessore è di un solo atomo (~0,34 nanometri). È il primo materiale veramente bidimensionale isolato in laboratorio.","Non è corretto. Il grafene può essere incorporato in strutture tridimensionali (compositi, rivestimenti). Bidimensionale si riferisce alla struttura cristallografica del materiale, non al suo uso.","Non è corretto. Il grafene ha resistenza straordinaria nella direzione planare. Bidimensionale non è un giudizio sulla resistenza nella terza dimensione ma sulla struttura fisica del materiale."]],["Perché la cellulosa batterica è considerata promettente come materiale innovativo?",["Perché i batteri possono produrla ad altissima velocità a temperatura ambiente senza energia","Perché ha struttura nanometrica ultra-pura con alta resistenza meccanica e biodegradabilità, adatta per medicazioni avanzate e packaging","Perché può essere prodotta in modo completamente gratuito usando scarti alimentari come unico substrato","Perché è il materiale più abbondante sulla Terra, disponibile senza limitazioni di approvvigionamento"],1,"La cellulosa batterica (prodotta da batteri Acetobacter e altri) ha struttura nanometrica ultra-pura: senza lignina, emicellulosa o impurità. Alta resistenza meccanica, ottima biocompatibilità, biodegradabilità. Si usa in medicazioni avanzate per ferite croniche, membrane per dialisi, packaging biotecnologico.",["Non è corretto. La produzione è lenta e richiede bioreattori controllati. Il vantaggio della cellulosa batterica non è la velocità di produzione.","Esatto! La cellulosa batterica ha struttura nanometrica molto pura (senza lignina o emicellulosa), alta resistenza meccanica, ottima biocompatibilità e biodegradabilità. È usata in medicazioni avanzate per ferite e si studia per packaging e biomedicina.","Non è corretto. La produzione di cellulosa batterica richiede substrati controllati e bioreattori. Non è 'gratuita'.","Non è corretto. La cellulosa vegetale è abbondante, ma la cellulosa batterica è prodotta da batteri specifici in condizioni controllate: non è illimitatamente disponibile."]]],"I":[["Perché una posata compostabile in PLA non va buttata nell'umido domestico in molti comuni italiani?",["Perché il PLA contamina il compost organico con sostanze chimiche tossiche derivate dal mais","Perché il PLA si degrada solo in impianti industriali a 55-60°C: nel compostaggio domestico rimane quasi intatto e poi finisce in discarica come i rifiuti normali","Perché le posate in PLA sono troppo leggere e galleggiano sui rifiuti umidi ostacolando il processo di raccolta automatizzata","Perché la normativa italiana vieta di mescolare bioplastiche e materiali organici nella stessa raccolta"],1,"Il PLA si degrada efficacemente SOLO in compostaggio industriale (55-60°C). In compostaggio domestico (temperatura ambiente, 20-30°C) si degrada molto lentamente. Se un comune non ha un impianto di compostaggio industriale certificato che accetta bioplastiche, le posate in PLA finiscono in discarica. Il corretto smaltimento delle bioplastiche richiede l'infrastruttura giusta.",["Non è corretto. Il PLA non è tossico e non contamina il compost con sostanze pericolose. Il problema è che non si degrada nelle condizioni del compostaggio domestico.","Esatto! Se una posata in PLA finisce nell'umido domestico e viene compostata in casa o in piccoli impianti a bassa temperatura, non si degrada: rimane quasi intatta e il compost finale non è di qualità. Molti comuni la mandano in discarica o inceneritore.","Non è corretto. La leggerezza non è il problema. Il problema è la mancata degradazione nelle condizioni di compostaggio domestico.","Non è corretto. La normativa italiana (dal 2021) ha aggiornato le regole per le bioplastiche certificate, ma il problema rimane la mancanza di impianti adeguati in molte aree e la confusione dei consumatori."]],["Perché il grafene è 200 volte più resistente dell'acciaio a parità di peso ma non è ancora usato nelle costruzioni?",["Perché i governi ne vietano l'uso per ragioni di sicurezza non ancora definite","Perché produrlo di alta qualità in grandi quantità rimane costoso e tecnicamente molto difficile con i metodi attuali","Perché è troppo flessibile per le strutture rigide delle costruzioni","Perché si degrada rapidamente a contatto con l'aria umida perdendo le sue proprietà meccaniche"],1,"Il grafene ha proprietà eccezionali, ma la produzione di grafene ad alta qualità (grande area superficiale, pochi difetti) a costi industriali competitivi rimane la sfida principale. Il metodo CVD (Chemical Vapour Deposition) su substrati metallici è scalabile ma ancora costoso. Attualmente il grafene è economicamente conveniente solo per applicazioni ad alto valore aggiunto.",["Non è corretto. Non ci sono divieti governativi sull'uso del grafene. Il problema è tecnico-economico, non normativo.","Esatto! Il grafene di alta qualità (grande area, pochi difetti) è ancora costoso e difficile da produrre su scala industriale. Il metodo originale (scotch) è impossibile da industrializzare. I metodi CVD e altri sono ancora costosi per applicazioni di massa.","Non è corretto. La flessibilità non è il limite del grafene per le costruzioni. Il grafene può essere incorporato in materiali compositi rigidi.","Non è corretto. Il grafene è chimicamente stabile. Non si degrada all'aria umida. Il problema è la scalabilità della produzione ad alta qualità."]],["Il Mater-Bi della Novamont è un biopolimero da amido di mais usato nei sacchetti compostabili. Qual è il suo vantaggio principale rispetto al sacchetto di plastica convenzionale?",["Costa meno da produrre perché il mais è più economico del petrolio","Se smaltito correttamente in un impianto di compostaggio industriale, si degrada in compost invece di persistere come plastica per centinaia di anni","Assorbe i rifiuti organici mantenendoli freschi più a lungo grazie alle proprietà della cellulosa del mais","Può essere riciclato insieme alla plastica PET nella raccolta differenziata della plastica"],1,"Il Mater-Bi compostabile (da amido di mais, Novamont) si degrada in impianti di compostaggio industriale certificati in poche settimane, producendo compost. La plastica convenzionale persiste per centinaia di anni. Il vantaggio è nella fine vita. Ma la condizione è avere l'impianto giusto: senza di esso, anche il Mater-Bi finisce in discarica.",["Non è corretto. Il Mater-Bi e i biopolimeri da amido costano generalmente di più, non meno, rispetto alle plastiche da petrolio. Il vantaggio è la fine vita sostenibile, non il costo.","Esatto! Il Mater-Bi compostabile, portato a un impianto certificato, si degrada in pochi settimane in compost. Il sacchetto di plastica convenzionale persiste nell'ambiente per 100-1.000 anni. Il vantaggio è nella fine vita sostenibile.","Non è corretto. Il Mater-Bi non ha proprietà di conservazione speciale. È un sacchetto come gli altri, ma con fine vita sostenibile se smaltito correttamente.","Non è corretto. Il Mater-Bi non va nella raccolta della plastica: contaminerebbe il flusso di riciclo convenzionale. Va nell'umido organico (dove è accettato dagli impianti certificati) o nella raccolta dedicata alle bioplastiche."]],["Come si valuta la sostenibilità complessiva di un materiale innovativo?",["Solo guardando se è biodegradabile o riciclabile alla fine della sua vita","Valutando l'intero ciclo di vita: materie prime, processo produttivo, energia usata, durata, fine vita e impatto su ecosistemi","Verificando solo se è certificato da un ente internazionale come ISO o ASTM","Calcolando solo le emissioni di CO₂ durante la produzione come indicatore principale di impatto"],1,"La sostenibilità di un materiale si valuta con l'LCA (Life Cycle Assessment): 1) materie prime (rinnovabili? critiche?); 2) processo produttivo (energia, emissioni, acqua); 3) uso (durata, manutenzione, prestazioni); 4) fine vita (riciclabile, compostabile, discarica). Un materiale 'ecologico' in una fase può avere grandi impatti in un'altra.",["Non è corretto. La biodegradabilità e la riciclabilità sono importanti ma non esaurienti. La sostenibilità deve considerare l'intero ciclo di vita.","Esatto! La sostenibilità di un materiale si valuta con un LCA (Life Cycle Assessment): dall'estrazione delle materie prime, al processo di produzione (energia, emissioni, scarti), all'uso (durata, manutenzione), alla fine vita (riciclo, compostaggio, discarica).","Non è corretto. Le certificazioni garantiscono il rispetto di certi standard, ma non valutano automaticamente la sostenibilità complessiva. Un materiale certificato può avere un impatto complessivo molto diverso da un altro certificato allo stesso modo.","Non è corretto. Le emissioni di CO₂ sono un indicatore importante ma non l'unico. La sostenibilità include anche consumo di acqua, uso del suolo, biodiversità, tossicità, disponibilità delle materie prime."]],["Perché i materiali compositi come la fibra di carbonio hanno proprietà superiori ai singoli componenti (fibra + resina)?",["Perché la reazione chimica tra fibra e resina crea un nuovo materiale con proprietà diverse dai componenti iniziali","Perché i due materiali vengono uniti in modo da combinare le proprietà eccellenti di ciascuno: la fibra dà resistenza, la matrice dà coesione e forma","Perché la miscelazione a temperature molto alte crea una struttura cristallina unica non ottenibile da nessun materiale puro","Perché i due materiali si deformano in modo complementare annullando le rispettive debolezze per effetto piezoelettrico"],1,"Il composito sfrutta le proprietà migliori di ciascun componente: la fibra (carbonio, vetro, aramide) fornisce altissima resistenza meccanica; la matrice (resina epossidica, polimerica) tiene le fibre insieme, distribuisce i carichi, dà forma e regge la compressione. Il risultato: resistenza specifica (per unità di peso) superiore ai singoli componenti. '1+1=3' nel composito.",["Non è corretto. Non avviene una reazione chimica che trasforma i componenti. La fibra di carbonio e la resina rimangono chimicamente distinte nella composizione.","Esatto! Il principio del composito: ciascun componente contribuisce la sua proprietà migliore. La fibra di carbonio (altissima resistenza a trazione ma fragile e senza forma) + la resina (tiene insieme le fibre, dà forma, regge la compressione) = un materiale con resistenza straordinaria e forma qualsiasi.","Non è corretto. I compositi non vengono miscelati ad alte temperature creando una nuova struttura cristallina. I componenti rimangono distinti nella struttura composita.","Non è corretto. Il piezoelettrico è la conversione di deformazione in elettricità (o viceversa). Non è il meccanismo del composito."]],["Perché i materiali innovativi non sostituiranno immediatamente i materiali tradizionali anche quando sono tecnicamente superiori?",["Perché i governi proteggono le industrie dei materiali tradizionali con normative che limitano l'adozione delle innovazioni","Perché il costo di produzione dei materiali innovativi è spesso ancora molto alto e la scalabilità della produzione richiede tempo e investimenti enormi","Perché i consumatori sono irrazionalmente fedeli ai materiali tradizionali e rifiutano le innovazioni per abitudine","Perché i materiali innovativi sono brevettati da poche grandi aziende che limitano volutamente la produzione per mantenere prezzi alti"],1,"I materiali innovativi (grafene, PHA, compositi avanzati) hanno proprietà superiori, ma la transizione richiede: 1) riduzione dei costi di produzione (scala industriale); 2) sviluppo di processi produttivi affidabili; 3) standard normativi; 4) catene di fornitura; 5) fiducia degli utilizzatori industriali. Tutti questi richiedono tempo e investimenti enormi.",["Non è corretto. Le normative possono rallentare l'adozione ma non sono il principale ostacolo. Gli ostacoli principali sono economici e tecnico-produttivi.","Esatto! Il grafene è superiore in proprietà ma la produzione scalabile ad alta qualità non è ancora economicamente competitiva. Il PHA è più versatile del PLA ma costa 3-5 volte di più. La transizione dai materiali tradizionali richiede tempo per la maturazione tecnologica e degli investimenti.","Non è corretto. I consumatori adottano nuovi materiali quando offrono vantaggi chiari (smartphone in alluminio e vetro hanno sostituito quelli in plastica). Il problema principale è il costo e la disponibilità.","Non è corretto. Il brevetto protegge temporaneamente l'innovazione, ma dopo la scadenza (20 anni) i processi diventano pubblici. Il problema principale è la complessità del processo produttivo, non i brevetti."]]],"A":[["Un'azienda di packaging alimentare deve scegliere tra plastica PET e PLA compostabile per i vasetti dello yogurt. Quali sono i fattori determinanti?",["La scelta dipende solo dal costo: il materiale più economico è sempre quello corretto per applicazioni di massa","La disponibilità di impianti di compostaggio industriale nel mercato target, le proprietà barriera richieste, il costo, e le aspettative del consumatore sul packaging sostenibile","Solo le proprietà meccaniche: quale materiale regge meglio gli urti durante la distribuzione","Solo la certificazione: se il PLA ha la certificazione EN 13432 è automaticamente la scelta migliore"],1,"La scelta PET vs. PLA per packaging yogurt dipende da: 1) Infrastrutture locali: esiste raccolta e compostaggio industriale? Senza di esse il PLA finisce in discarica. 2) Proprietà barriera: il PLA ha barriera a O₂ e CO₂ inferiore al PET (problema per prodotti deperibili). 3) Costo: PLA costa 2-3x più del PET. 4) Comunicazione: il consumatore sa cosa fare del vasetto?",["Non è corretto. Il costo è un fattore ma non l'unico. La fine vita, la disponibilità di infrastrutture di smaltimento, le proprietà barriera e la normativa alimentare sono tutti fattori rilevanti.","Esatto! Il PLA è sostenibile solo se nel mercato target esiste un sistema di raccolta e compostaggio industriale. Se non esiste, finisce in discarica come il PET. Le proprietà barriera del PLA sono inferiori al PET. Il costo è 2-3x superiore. E il consumatore deve capire come smaltirlo.","Non è corretto. La resistenza meccanica è un fattore, ma in questo specifico confronto ci sono aspetti più critici: la sostenibilità della fine vita e la disponibilità delle infrastrutture di smaltimento.","Non è corretto. La certificazione EN 13432 garantisce la compostabilità nelle condizioni specificate, ma non dice nulla sulla disponibilità degli impianti nel territorio o sulla logistica del recupero."]],["Il grafene conduce l'elettricità meglio del rame ma non lo sostituirà nell'immediato nei cavi elettrici. Perché?",["Perché il grafene è un semiconduttore e non conduce l'elettricità a basse tensioni come quelle dei cavi domestici","Perché produrre chilometri di filo di grafene di alta qualità e a costi competitivi con il rame è tecnicamente molto difficile con i processi attuali","Perché il grafene perde le sue proprietà conduttive ad alte temperature e non è adatto per cavi che trasportano grandi correnti","Perché l'industria del rame ha lobby potenti che impediscono l'adozione del grafene nei sistemi di cablaggio"],1,"Il grafene conduce l'elettricità a velocità paragonabili alla luce e senza quasi resistenza. Ma produrre 'filo di grafene' lungo, continuo, senza difetti su scala industriale è tecnicamente molto difficile con i metodi attuali. Il rame ha processi produttivi maturi, costi bassi, infrastrutture esistenti. Il grafene sostituirà il rame solo quando la produzione sarà scalabile e competitiva.",["Non è corretto. Il grafene è un conduttore eccellente, non un semiconduttore nella sua forma naturale. Conduce l'elettricità meglio del rame a temperatura ambiente.","Esatto! Il grafene eccelle in proprietà, ma produrre un filo lungo e uniforme di grafene di alta qualità su scala industriale a costi competitivi con il rame (abbondante e con processi produttivi maturi da decenni) è ancora molto difficile.","Non è corretto. Il grafene è più stabile termicamente del rame e mantiene le sue proprietà conduttive ad alte temperature. Il problema è la scalabilità della produzione, non le proprietà termiche.","Non è corretto. Le lobby industriali non sono il motivo principale. Il vero ostacolo è tecnico-economico: produrre grafene di alta qualità in grande quantità rimane difficile e costoso."]],["Perché avere prodotti da fonti rinnovabili (bio-based) non garantisce automaticamente un impatto ambientale inferiore ai prodotti da petrolio?",["Perché le colture bio-based (mais, canna da zucchero) richiedono terreno agricolo, acqua e pesticidi che hanno il loro impatto ambientale","Perché i governi non hanno ancora definito le norme per certificare i prodotti bio-based, creando incertezza normativa","Perché i consumatori non distinguono tra bio-based e biodegradabile, creando confusione che riduce l'efficacia della raccolta differenziata","Perché i prodotti bio-based non sono riciclabili nella raccolta differenziata convenzionale e finiscono tutti in discarica"],0,"Bio-based non garantisce automaticamente minore impatto ambientale. Coltivare le colture bio-based richiede: suolo (possibilmente deforestato), acqua (spesso scarsa), pesticidi e fertilizzanti (emissioni N₂O), macchinari agricoli (CO₂). La raffinazione chimica richiede energia. Un LCA completo può mostrare che in certi contesti il PET da petrolio ha impatto inferiore al PLA da mais.",["Esatto! Coltivare mais per il PLA richiede suolo (sottratto a foreste o coltivazioni alimentari), acqua, fertilizzanti, pesticidi. La produzione chimica del PLA richiede energia. Se questi impatti superano quelli del PET da petrolio, il bilancio ambientale non è automaticamente positivo.","Non è corretto. La normativa sui prodotti bio-based esiste (EN 16640, ISO 16620). Il problema non è normativo ma di LCA: il bilancio ambientale complessivo non è automaticamente positivo solo perché il materiale è bio-based.","Parzialmente vero come problema comunicativo, ma non risponde alla domanda sull'impatto ambientale del materiale in sé.","Non è corretto. Alcuni prodotti bio-based (come PEF bio-based non biodegradabile) possono essere riciclati in sistemi convenzionali. Il problema dell'impatto non è solo nella fine vita ma nel ciclo produttivo."]],["Il packaging di un caffè in capsula è in alluminio. Un produttore vuole passare a capsule compostabili. Quali sfide specifiche deve affrontare?",["Solo convincere i consumatori che la capsula compostabile è di qualità equivalente all'alluminio","Trovare un materiale compostabile con barriera a ossigeno, umidità e aromi equivalente all'alluminio (che protegge il caffè per 12-18 mesi), e garantire l'accesso degli utenti al compostaggio industriale","Ottenere l'approvazione del Ministero della Salute per un nuovo materiale a contatto con gli alimenti","Nessuna sfida tecnica: le capsule compostabili sono già disponibili con le stesse prestazioni dell'alluminio e a costo inferiore"],1,"Sostituire l'alluminio nelle capsule caffè con materiali compostabili richiede: 1) proprietà barriera a O₂, umidità e aromi equivalenti (il caffè ossidato non sa di caffè); 2) tenuta alla pressione dell'espresso; 3) disponibilità di impianti di compostaggio industriale per gli utenti; 4) costo accettabile. È un problema tecnico-infrastrutturale, non solo di marketing.",["Non è corretto. Il cambiamento di percezione del consumatore è una sfida, ma non la principale. Ci sono sfide tecniche fondamentali legate alle proprietà barriera.","Esatto! L'alluminio è una barriera perfetta a ossigeno, luce e umidità: mantiene il caffè aromatico per 12-18 mesi. I materiali compostabili attuali hanno barriere inferiori. Inoltre: la capsula compostabile funziona solo se l'utente ha accesso al compostaggio industriale, non in tutte le città.","L'approvazione normativa è necessaria (Regolamento UE 10/2011 sui materiali a contatto con alimenti), ma non è la sfida tecnica principale. La sfida è trovare un materiale con le proprietà barriera adeguate.","Non è corretto. Le capsule compostabili esistono già (Nespresso, Lavazza e altri le producono), ma hanno proprietà barriera inferiori all'alluminio e costi superiori. Le sfide esistono."]],["Il PHA (poleidrossialcanoato) prodotto da batteri è 'biodegradabile anche in acqua di mare'. Qual è l'implicazione pratica più importante?",["Che può essere usato liberamente in ambienti marini senza preoccupazioni per l'inquinamento","Che a differenza del PLA (che richiede impianti industriali), il PHA limita i danni di dispersioni accidentali nell'ambiente, degradandosi anche fuori da impianti controllati","Che il PHA è il materiale ideale per costruire reti da pesca biodegradabili sostituendo il nylon","Che il PHA può essere prodotto direttamente nell'oceano da batteri marini, eliminando i costi di impianti produttivi a terra"],1,"La biodegradabilità del PHA in acqua di mare e in suolo (non solo in compostaggio industriale come il PLA) è cruciale per materiali che possono dispersi accidentalmente nell'ambiente. Le reti da pesca abbandonate in nylon persistono secoli. Un'equivalente in PHA si degraderebbe in mesi. È la differenza critica tra un 'safety net' per dispersioni accidentali e un persistente inquinante.",["Non è corretto. Anche se il PHA si degrada in mare, questo non significa che sia incoraggiato buttarlo in mare. La biodegradabilità marina è un 'safety net' per dispersioni accidentali, non un invito.","Esatto! Il PHA si degrada in acqua di mare, suolo e compostaggio domestico in condizioni più varie del PLA. Questo è critico per packaging monouso che può finire accidentalmente nell'ambiente, dove il PLA persiste come plastica convenzionale.","Non è corretto. L'uso nelle reti da pesca è una possibile applicazione ma non è 'l'implicazione pratica più importante'. La caratteristica chiave è la biodegradabilità in condizioni ambientali più varie del PLA.","Non è corretto. Il PHA viene prodotto in bioreattori industriali a terra, non nell'oceano. La sua biodegradabilità marina riguarda la fine vita del prodotto, non la produzione."]],["Un laboratorio di ricerca ha sviluppato un nuovo materiale con resistenza pari all'acciaio ma peso pari all'alluminio, prodotto da biomassa. È pronto per il mercato?",["Sì: se le proprietà meccaniche sono verificate, il mercato adotterà automaticamente il materiale superiore","Non necessariamente: servono ancora scalabilità della produzione, valutazione del costo, test di durata, standard normativi, catene di fornitura e fiducia degli utilizzatori","No: senza brevetti internazionali registrati, il materiale non può essere commercializzato","Dipende solo dal prezzo: se costa meno dell'acciaio verrà adottato immediatamente"],1,"Dal risultato di laboratorio al prodotto di mercato il percorso tipico dura 10-20 anni e include: 1) Scalabilità della produzione (da grammi a tonnellate); 2) Costo competitivo a scala; 3) Test di durabilità in condizioni reali (vibrazioni, temperature, corrosione su anni); 4) Standard normativi (ingegneri strutturali non usano materiali senza norme); 5) Supply chain; 6) Certificazioni settoriali. Le scoperte di laboratorio richiedono decenni per arrivare al mercato.",["Non è corretto. Le proprietà meccaniche superiori sono necessarie ma non sufficienti. Il percorso dal laboratorio al mercato richiede molto di più.","Esatto! Dal laboratorio al mercato il percorso è lungo: 1) scalabilità (produrre tonnellate, non grammi); 2) costo competitivo; 3) test di durabilità in condizioni reali (anni, non mesi di laboratorio); 4) standard normativi; 5) catene di fornitura; 6) certificazioni; 7) accettazione industriale.","Non è corretto. I brevetti proteggono l'innovazione ma non sono l'ostacolo principale. Il percorso al mercato richiede soprattutto la maturazione tecnologica e la scalabilità.","Non è corretto. Il prezzo è un fattore critico, ma anche se il costo fosse già competitivo, servirebbero test di durabilità, standard normativi, certifications e costruzione della supply chain."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
