<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Bit-lab</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

  hook: "Tutto quello che il computer «vede» è un numero, e ogni numero è fatto di 0 e 1. Una lettera, un colore, una foto: accendi e spegni otto interruttori e scopri come.",
  levels: [
    { brief: "Ogni interruttore è un bit e vale una potenza di 2. Accendi quelli giusti per scrivere le lettere del tuo nome in codice ASCII (le maiuscole vanno da 65 = A a 90 = Z).",
      blocks: [
        { type: "sim", title: "Un byte: 8 interruttori", params: BIT.map((v, i) => ({ id: "b" + i, label: `Bit da ${v}`, options: [[0, "0 · spento"], [1, "1 · acceso"]], value: [0, 1, 0, 0, 0, 0, 0, 1][i] })),
          outputs: [{ key: "bin", label: "Codice binario", f: (p) => BIT.map((v, i) => p["b" + i]).join("") }, { key: "dec", label: "Numero decimale", f: (p) => BIT.reduce((s, v, i) => s + v * p["b" + i], 0) }, { key: "ch", label: "Lettera ASCII", f: (p, o) => o.dec >= 65 && o.dec <= 90 ? String.fromCharCode(o.dec) : (o.dec >= 97 && o.dec <= 122 ? String.fromCharCode(o.dec) + " (minuscola)" : "—") }],
          challenges: [["Scrivi la lettera M (77)", (p, o) => o.dec === 77, "77 = 64 + 8 + 4 + 1.", "01001101."], ["Scrivi la lettera Z (90)", (p, o) => o.dec === 90, "90 = 64 + 16 + 8 + 2.", "01011010."], ["Scrivi il numero più grande possibile con un byte", (p, o) => o.dec === 255, "Accendi tutti gli interruttori.", "11111111 = 255: per questo un byte rappresenta 256 valori, da 0 a 255."]] },
        { type: "quiz", questions: [["Perché i computer usano proprio due cifre?", ["Perché è più facile da insegnare", "Perché un circuito distingue con sicurezza due stati: corrente sì o no", "Perché 2 è un numero primo"], 1, "Due stati ben separati (acceso/spento) sono difficili da confondere, anche con disturbi elettrici."]] } ],
      reflect: "Quanti byte servono per scrivere il tuo nome in ASCII?" },
    { brief: "Dalle cifre alle dimensioni dei file. Imposta il tipo di file e guarda quanto spazio occupa senza compressione.",
      blocks: [
        { type: "quiz", title: "Conversioni del libro", questions: [
          ["13 in binario è…", ["1101", "1011", "1110"], 0, "8 + 4 + 1 = 13."],
          ["42 in binario è…", ["101010", "110010", "100110"], 0, "32 + 8 + 2 = 42."],
          ["10110 in decimale è…", ["22", "26", "12"], 0, "16 + 4 + 2 = 22."],
          ["11111111 in decimale è…", ["128", "255", "256"], 1, "128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = 255."]] },
        { type: "sim", title: "Quanto pesa un file", params: [{ id: "t", label: "Tipo di file", options: [["txt", "Testo ASCII"], ["img", "Foto non compressa (RGB)"], ["vid", "Video non compresso"]], value: "img" }, { id: "n", label: "Caratteri (testo) o megapixel (foto)", min: 1, max: 1000, step: 1, value: 8 }, { id: "s", label: "Secondi di video (Full HD, 30 fotogrammi/s)", min: 1, max: 120, step: 1, value: 60, unit: "s" }],
          outputs: [{ key: "B", label: "Byte", f: (p) => p.t === "txt" ? p.n : p.t === "img" ? p.n * 1e6 * 3 : 1920 * 1080 * 3 * 30 * p.s, hidden: true }, { key: "kb", label: "Kilobyte", f: (p, o) => o.B / 1000, d: 1 }, { key: "mb", label: "Megabyte", f: (p, o) => o.B / 1e6, d: 1 }, { key: "gb", label: "Gigabyte", f: (p, o) => o.B / 1e9, d: 2 }],
          note: (p, o) => p.t === "vid" ? ["warn", `Un video Full HD non compresso occupa circa ${LABENGINE.fmt(1920 * 1080 * 3 * 30 / 1e6, 0)} MB al secondo. Per questo i video si comprimono sempre.`] : p.t === "img" ? ["ok", "Ogni pixel ha 3 byte: uno per il rosso, uno per il verde, uno per il blu."] : ["ok", "Un carattere ASCII occupa 1 byte."] } ],
      reflect: "Perché un file di testo di una pagina pesa così poco rispetto a una foto?" },
    { label: "Scenario · il sensore di temperatura", brief: "Un sensore misura la temperatura tra −40 °C e +60 °C con precisione 0,5 °C e la invia 100 volte al secondo su una connessione lenta. Quanti bit servono per ogni misura? Quanto traffico produce?",
      blocks: [

          outputs: [{ key: "val", label: "Valori distinti", f: (p) => Math.round((p.hi - p.lo) / p.pr) + 1 }, { key: "min", label: "Bit minimi necessari", f: (p, o) => Math.ceil(Math.log2(o.val)) }, { key: "bs", label: "Bit al secondo", f: (p) => p.bit * p.hz }, { key: "day", label: "MB al giorno", f: (p) => p.bit * p.hz * 86400 / 8 / 1e6, d: 1 }],
          note: (p, o) => p.bit < o.min ? ["ko", `Con ${p.bit} bit rappresenti solo ${2 ** p.bit} valori, ma te ne servono ${o.val}: alcune temperature non si possono scrivere.`] : p.bit > o.min ? ["warn", `Funziona, ma sprechi ${p.bit - o.min} bit per misura: ${LABENGINE.fmt((p.bit - o.min) * p.hz * 86400 / 8 / 1e6, 1)} MB in più al giorno.`] : ["ok", `Scelta ottimale: ${p.bit} bit bastano per ${o.val} valori (2^${p.bit} = ${2 ** p.bit}).`] } ],
      reflect: "Perché non si usano sempre 32 bit, «per stare tranquilli»? Quando invece conviene?" }],
  bridge: "Calcola lo spazio per archiviare l'archivio fotografico della scuola: scegli una risoluzione di scansione, calcola il peso di una foto e poi dell'intero archivio.",
});

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-INF-1-01","F":[["Cos'è un bit?",["La più piccola unità di informazione digitale, che può valere solo 0 oppure 1","Un gruppo di 8 byte usato per misurare la memoria","Il nome del processore centrale di un computer","Un tipo di file usato per le immagini digitali"],0,"Il bit (binary digit) è la più piccola unità di informazione digitale. Può assumere solo due valori: 0 oppure 1. Corrisponde allo stato di un transistor: corrente che non passa (0) o corrente che passa (1).",["Esatto! Il bit (binary digit) è la cifra binaria: la più piccola informazione possibile, e può valere solo 0 o 1.","Non è corretto. Sono i byte a raggruppare i bit: 1 byte = 8 bit, non il contrario. Il bit è l'unità minima, non un raggruppamento.","Non è corretto. Il processore centrale si chiama CPU (Central Processing Unit). Il bit è un'unità di informazione, non un componente fisico.","Non è corretto. I formati file immagine si chiamano JPEG, PNG, WebP ecc. Il bit è la cifra binaria di base del sistema informatico."]],["Quanti bit compongono un byte?",["4 bit","8 bit","16 bit","1024 bit"],1,"Un byte è composto esattamente da 8 bit. Con 8 bit si possono rappresentare 2⁸ = 256 valori diversi (da 0 a 255). Il byte è l'unità fondamentale con cui si misura la memoria: un carattere di testo ASCII occupa tipicamente 1 byte.",["Non è corretto. 4 bit formano un nibble, non un byte. Il byte è il doppio: 8 bit.","Esatto! Un byte è composto da 8 bit e può rappresentare 256 valori distinti (da 0 a 255). È l'unità di base con cui il computer misura le informazioni.","Non è corretto. 16 bit equivalgono a 2 byte. Un singolo byte contiene 8 bit.","Non è corretto. 1024 byte formano un kilobyte (KB). Un byte contiene solo 8 bit."]],["Come funziona un transistor all'interno di un computer?",["È una batteria che immagazzina energia per il processore","È un minuscolo interruttore elettronico che può essere acceso (1) o spento (0)","È il componente che visualizza le immagini sullo schermo","È un tipo di connettore USB che trasferisce dati"],1,"Il transistor è un minuscolo interruttore elettronico che può trovarsi in due stati: corrente che passa (1) o corrente che non passa (0). Un processore moderno contiene miliardi di transistor e li accende e spegne miliardi di volte al secondo. Questo è il motivo per cui il computer usa solo 0 e 1.",["Non è corretto. Le batterie immagazzinano energia elettrica, ma i transistor sono interruttori elettronici che controllano il flusso di corrente in un circuito.","Esatto! Il transistor funziona come un interruttore: può essere in due stati — corrente che passa (1) o corrente che non passa (0). Miliardi di transistor, accesi e spenti miliardi di volte al secondo, realizzano tutta l'informatica moderna.","Non è corretto. Le immagini sono visualizzate dai pixel dello schermo. I transistor sono dentro il processore e controllano i segnali elettrici dei circuiti logici.","Non è corretto. USB è uno standard di connessione fisica. I transistor sono componenti elettronici microscopici dentro i chip."]],["Quale numero decimale corrisponde al numero binario '10'?",["10","2","1","4"],1,"In binario ogni posizione vale una potenza di 2, partendo da destra: posizione 0 = 2⁰ = 1, posizione 1 = 2¹ = 2, posizione 2 = 2² = 4 ecc. Il numero '10' in binario vale quindi 1×2¹ + 0×2⁰ = 2+0 = 2 in decimale.",["Non è corretto. In binario, '10' non vale dieci. Il sistema binario usa base 2, non base 10: '10' in binario significa 1×2¹ + 0×2⁰ = 2.","Esatto! In binario '10' vale 1×2¹ + 0×2⁰ = 2. Quando in binario si finiscono le cifre (si arriva a 1), si va a capo mettendo uno 0 e aggiungendo 1 a sinistra — esattamente come nel sistema decimale si va da 9 a 10.","Non è corretto. In binario '1' vale uno, ma '10' è diverso: vale 1×2 + 0 = 2, perché la seconda cifra da destra rappresenta la potenza 2¹.","Non è corretto. Il numero binario '100' vale 4 (1×2² = 4), non '10'. Il valore '10' in binario è 1×2¹ + 0×2⁰ = 2."]],["Quante componenti di colore usa il sistema RGB per descrivere un pixel?",["2 (rosso e blu)","4 (rosso, verde, blu e trasparenza)","3 (rosso, verde e blu)","8 (tanti quanti i bit di un byte)"],2,"Il sistema RGB usa tre componenti: Rosso, Verde e Blu. Ogni componente ha un valore da 0 a 255 (8 bit = 1 byte). Combinando i tre valori si ottengono 256×256×256 ≈ 16 milioni di colori diversi. Ogni pixel di un'immagine digitale occupa quindi 3 byte.",["Non è corretto. Il sistema RGB usa tre componenti, non due: Rosso (Red), Verde (Green) e Blu (Blue). Omettere il verde impedirebbe di rappresentare gran parte dei colori.","Non è corretto. Il sistema RGB standard usa 3 componenti. La trasparenza (canale alpha) è un'aggiunta del formato RGBA, non del sistema RGB base.","Esatto! Il sistema RGB usa tre componenti: Rosso (Red), Verde (Green) e Blu (Blue). Ognuna ha un valore da 0 a 255 (1 byte), quindi ogni pixel occupa 3 byte in totale.","Non è corretto. I bit del byte sono l'unità di misura usata per ogni componente, non il numero di componenti colore. RGB usa 3 componenti, ognuna rappresentata da 8 bit."]],["Quale delle seguenti rappresenta la progressione corretta delle unità di misura dell'informazione, dalla più piccola alla più grande?",["byte → bit → KB → MB → GB","bit → byte → KB → MB → GB","KB → MB → GB → byte → bit","bit → byte → MB → KB → GB"],1,"Le unità di misura dell'informazione, dalla più piccola alla più grande, sono: bit → byte (8 bit) → kilobyte (KB, ~1000 byte) → megabyte (MB, ~1 milione di byte) → gigabyte (GB, ~1 miliardo di byte) → terabyte (TB, ~1000 GB).",["Non è corretto. Il bit è più piccolo del byte, non il contrario. L'ordine corretto parte da bit, poi byte, poi KB, MB, GB.","Esatto! La progressione corretta è: bit (cifra binaria) → byte (8 bit) → kilobyte (circa 1000 byte) → megabyte (circa 1 milione di byte) → gigabyte (circa 1 miliardo di byte).","Non è corretto. Questa sequenza è capovolta: KB, MB e GB sono molto più grandi di byte e bit. La sequenza parte sempre dalle unità più piccole verso quelle più grandi.","Non è corretto. KB (kilobyte) viene prima di MB (megabyte): 1 MB = 1000 KB, quindi MB è più grande di KB, non il contrario."]]],"I":[["Quanti valori distinti possono essere rappresentati con 8 bit?",["8","128","256","1024"],2,"Con N bit si possono rappresentare 2^N valori distinti. Con 8 bit: 2⁸ = 256 valori (da 0 a 255). Questa formula è fondamentale: 1 bit → 2 valori, 2 bit → 4, 4 bit → 16, 8 bit → 256, 16 bit → 65.536, 24 bit → oltre 16 milioni (i colori RGB a piena profondità).",["Non è corretto. Con 8 bit non si rappresentano 8 valori, ma 2⁸ valori. Ogni bit raddoppia le possibilità: 2×2×2×2×2×2×2×2 = 256.","Non è corretto. 128 = 2⁷, cioè le possibilità con 7 bit. Con 8 bit si arriva al doppio: 2⁸ = 256.","Esatto! Con N bit si rappresentano 2^N valori distinti. Con 8 bit: 2⁸ = 256 valori, che vanno da 0 a 255. Questa è la ragione per cui ogni componente RGB ha valori da 0 a 255.","Non è corretto. 1024 = 2¹⁰ richiede 10 bit, non 8. Con 8 bit si ottengono 2⁸ = 256 valori."]],["A quale numero decimale corrisponde la lettera maiuscola 'A' nella tabella ASCII?",["1","41","65","97"],2,"Nel codice ASCII (American Standard Code for Information Interchange), ogni carattere ha un numero univoco. La 'A' maiuscola = 65 (binario: 01000001), la 'a' minuscola = 97. Le lettere maiuscole vanno da 65 (A) a 90 (Z), le minuscole da 97 (a) a 122 (z). La differenza di 32 tra maiuscola e minuscola è una scelta di progettazione originale del 1963.",["Non è corretto. Il numero 1 nella tabella ASCII è un carattere di controllo non stampabile. La lettera 'A' maiuscola ha il codice 65.","Non è corretto. Il numero 41 in ASCII corrisponde alla parentesi chiusa ')'. La lettera 'A' maiuscola ha il codice 65.","Esatto! Nella tabella ASCII la lettera 'A' maiuscola ha il codice 65, che in binario è 01000001. Le lettere maiuscole vanno da A=65 (A) a Z=90, quelle minuscole da a=97 a z=122.","Non è corretto. Il codice 97 corrisponde alla 'a' minuscola, non alla 'A' maiuscola. ASCII distingue tra lettere maiuscole e minuscole: le maiuscole iniziano da 65, le minuscole da 97."]],["Quanto spazio occupa una foto da 6 megapixel in formato RGB non compresso?",["Circa 6 MB","Circa 18 MB","Circa 48 MB","Circa 1 MB"],1,"Calcolo: 6.000.000 pixel × 3 byte/pixel (RGB) = 18.000.000 byte ≈ 18 MB. Questo è il peso non compresso. I formati JPEG, PNG e WebP applicano algoritmi di compressione per ridurre le dimensioni mantenendo una qualità accettabile.",["Non è corretto. 6 MB sarebbe il peso solo se ogni pixel usasse 1 byte, ma in RGB ogni pixel occupa 3 byte (uno per rosso, uno per verde, uno per blu). Il calcolo corretto è: 6.000.000 × 3 = 18.000.000 byte ≈ 18 MB.","Esatto! Ogni pixel in RGB occupa 3 byte (1 per rosso, 1 per verde, 1 per blu). Con 6 milioni di pixel: 6.000.000 × 3 = 18.000.000 byte ≈ 18 MB. Le foto che vedi sul telefono pesano molto meno grazie alla compressione.","Non è corretto. 48 MB corrisponderebbe a 8 byte per pixel, non a 3. In RGB standard si usano 3 byte per pixel (24 bit di profondità colore).","Non è corretto. 1 MB equivale a circa 333.000 pixel in RGB, non a 6 milioni. Una foto da 6 megapixel non compressa occupa circa 18 MB."]],["Qual è la differenza principale tra compressione lossy e compressione lossless?",["La lossy comprime solo i testi, la lossless comprime solo le immagini","La lossy elimina alcuni dati in modo permanente, la lossless riduce lo spazio senza perdere informazioni","La lossless è più veloce ma produce file più grandi, la lossy è più lenta ma produce file più piccoli","La lossy funziona solo su computer Windows, la lossless solo su Mac"],1,"La compressione lossy (come JPEG) elimina alcune informazioni in modo permanente ottenendo file molto più piccoli, ma con una certa perdita di qualità. La compressione lossless (come PNG) riduce le dimensioni trovando pattern ripetuti ma conserva tutti i dati originali: il file decompresso è identico all'originale.",["Non è corretto. Entrambe le tipologie di compressione si applicano a qualsiasi tipo di file (immagini, audio, video, testi). La differenza riguarda se vengono perse informazioni, non il tipo di file.","Esatto! Nella compressione lossy alcune informazioni vengono eliminate in modo permanente (non recuperabili), riducendo di più la dimensione ma a scapito della qualità. Nella lossless l'informazione originale è completamente recuperabile: il file decompresso è identico all'originale.","Non è corretto. La velocità di compressione dipende dall'algoritmo specifico, non dal tipo (lossy/lossless). La distinzione fondamentale riguarda la perdita di dati, non la velocità.","Non è corretto. La compressione lossy e lossless sono tecniche matematiche indipendenti dal sistema operativo. JPEG (lossy) e PNG (lossless) funzionano su qualsiasi piattaforma."]],["Perché è stato necessario creare Unicode per sostituire ASCII?",["Perché ASCII era troppo lento per i computer moderni","Perché ASCII copriva solo 128 caratteri, insufficienti per le lingue non latine e gli emoji","Perché ASCII usava troppa memoria rispetto a Unicode","Perché ASCII non funzionava su internet"],1,"ASCII usa 7 bit (128 caratteri) e copre solo l'alfabeto latino di base con punteggiatura. Non può rappresentare lettere accentate, alfabeti non latini (cinese, arabo, hindi...) o emoji. Unicode assegna un codice univoco a oltre 140.000 caratteri in più di 150 sistemi di scrittura. UTF-8 è l'implementazione più diffusa di Unicode.",["Non è corretto. La velocità non è il problema di ASCII. ASCII è un sistema di codifica, non un protocollo di trasmissione. Il problema era la limitata copertura dei caratteri: solo 128 simboli, insufficienti per le lingue non latine.","Esatto! ASCII con 7 bit copre solo 128 caratteri: lettere latine, numeri e punteggiatura di base. Non aveva à, è, ü, caratteri cinesi, arabi, hindi o emoji. Unicode risolve questo assegnando un codice univoco a oltre 140.000 caratteri in più di 150 sistemi di scrittura.","Non è corretto. È il contrario: ASCII usa solo 1 byte per carattere (efficiente), mentre Unicode in formato UTF-8 può usare fino a 4 byte per i caratteri più rari. Unicode è stato creato per coprire più caratteri, non per risparmiare memoria.","Non è corretto. ASCII funzionava perfettamente su internet per testi in inglese. Il problema era rappresentare testi in altre lingue del mondo. Unicode è stato creato per l'inclusività linguistica, non per motivi di compatibilità internet."]],["Quale matematico e in quale anno ha descritto per primo il sistema binario?",["Alan Turing nel 1936","Gottfried Wilhelm Leibniz nel 1703","Charles Babbage nel 1837","George Boole nel 1854"],1,"Gottfried Wilhelm Leibniz descrisse il sistema binario nel 1703, tre secoli prima dell'invenzione del computer. Il suo articolo 'Explication de l'Arithmétique Binaire' mostrava come due soli simboli (0 e 1) potessero rappresentare qualsiasi numero. Leibniz era affascinato dall'idea filosofica che tutto potesse essere rappresentato con il duale 0/1.",["Non è corretto. Alan Turing è celebre per altri contributi fondamentali all'informatica teorica (macchina di Turing, crittografia Enigma), ma la descrizione del sistema binario è precedente: fu Gottfried Wilhelm Leibniz nel 1703.","Esatto! Leibniz descrisse il sistema binario nel 1703 in un articolo chiamato 'Explication de l'Arithmétique Binaire'. All'epoca non esisteva nessun computer: Leibniz aveva capito che due soli simboli bastano per rappresentare qualsiasi numero.","Non è corretto. Charles Babbage ha progettato la macchina analitica (un primo prototipo di computer meccanico), ma il sistema binario era già stato descritto da Leibniz più di un secolo prima, nel 1703.","Non è corretto. George Boole ha sviluppato l'algebra booleana (operazioni logiche AND, OR, NOT), fondamentale per i circuiti digitali. Ma il sistema binario era già stato descritto da Leibniz nel 1703."]]],"A":[["Un ingegnere deve trasmettere dati di temperatura da un sensore IoT (-20°C a +60°C, con precisione di 0,5°C) su una connessione a bassa banda. Quanti bit sono necessari per ogni campione?",["4 bit (16 valori possibili)","8 bit (256 valori possibili)","16 bit (65.536 valori possibili)","32 bit (float IEEE 754)"],1,"Il numero di valori distinti nel range: (60 - (-20)) / 0,5 + 1 = 161. Serve il minimo N tale che 2^N ≥ 161. 2⁷ = 128 (insufficiente), 2⁸ = 256 (sufficiente). Quindi 8 bit. In applicazioni IoT reali questa ottimizzazione riduce il consumo energetico e il costo della banda.",["Non è corretto. Il range -20,0 a +60,0 con precisione 0,5°C produce 161 valori distinti (-20,0 / -19,5 / ... / +59,5 / +60,0). Con 4 bit si rappresentano solo 2⁴ = 16 valori: insufficiente.","Esatto! Il range -20,0 a +60,0 con step 0,5°C produce (60-(-20))/0,5 + 1 = 161 valori distinti. Con 7 bit si hanno solo 128 valori (insufficiente). Con 8 bit si hanno 256 valori (sufficiente). 8 bit è il numero minimo che copre i 161 valori necessari.","Non è corretto. 16 bit coprono 65.536 valori, ben più dei 161 necessari. Se l'obiettivo è minimizzare il traffico dati su una connessione a bassa banda, usare 16 bit quando ne bastano 8 spreca esattamente il doppio della banda.","Non è corretto. Un float a 32 bit è la scelta peggiore per minimizzare il traffico: usa 4 volte più bit degli 8 necessari. Inoltre il float IEEE 754 è pensato per calcoli in virgola mobile generali, non per una codifica compatta di valori discreti."]],["Un archivio storico deve scegliere tra scansionare 200 foto a 1200 dpi RGB (formato JPEG compresso 10:1) o a 2400 dpi RGB (formato TIFF non compresso). Se 1 pollice = 2,54 cm e le foto sono 10×15 cm, quale affermazione è corretta?",["Il formato JPEG 1200 dpi occupa più spazio del TIFF 2400 dpi perché la compressione JPEG è lossy","Il TIFF 2400 dpi non compresso occupa circa 64 volte più spazio del JPEG 1200 dpi compresso 10:1","I due formati occupano lo stesso spazio perché la compressione JPEG compensa la risoluzione maggiore","La scelta tra i due formati non influisce sulla qualità dell'immagine recuperabile"],1,"Confronto calcolo: 1200 dpi su 10×15 cm = (10/2,54×1200) × (15/2,54×1200) ≈ 4724×7087 ≈ 33,5 MP. JPEG 10:1: ÷10. A 2400 dpi ≈ 134 MP, TIFF non compresso. Rapporto: (134/33,5) × 10 = 40×. Il TIFF 2400 dpi pesa circa 40 volte il JPEG 1200 dpi compresso. Per archiviazione storica il trade-off qualità vs spazio è una scelta progettuale reale.",["Non è corretto. La compressione JPEG 10:1 riduce drasticamente le dimensioni. Il TIFF 2400 dpi (4 volte la risoluzione lineare → 16 volte più pixel) non compresso occupa enormemente più spazio del JPEG 1200 dpi compresso 10 volte.","Esatto! 2400 dpi ha 4× più pixel per lato → 16× più pixel totali rispetto a 1200 dpi. Poi il TIFF non è compresso mentre il JPEG è compresso 10:1. Fattore totale: 16 × 10 = 160× (?). Più precisamente: 2400² / 1200² × 10 = 4 × 10 = 40×. Il TIFF 2400 dpi pesa circa 40 volte il JPEG 1200 dpi — un fattore molto alto.","Non è corretto. La compressione JPEG 10:1 riduce le dimensioni di 10 volte, ma il passaggio da 1200 a 2400 dpi quadruplica il numero di pixel (risoluzione doppia su entrambe le dimensioni). Il risultato netto è che il TIFF 2400 dpi occupa molto più spazio.","Non è corretto. JPEG lossy perde alcune informazioni in modo permanente, mentre TIFF non compresso conserva tutti i dati originali. Per un archivio storico la differenza di qualità è significativa, soprattutto se le immagini devono essere ingrandite o ritoccate in futuro."]],["Qual è il vantaggio principale dell'utilizzo di UTF-8 rispetto ad ASCII puro in un sistema che deve gestire contenuti internazionali?",["UTF-8 usa sempre meno memoria di ASCII per qualsiasi testo","UTF-8 è compatibile con ASCII per i primi 128 caratteri e usa bytes aggiuntivi solo per i caratteri non ASCII","UTF-8 elimina la necessità di compressione perché i caratteri non ASCII occupano meno spazio","UTF-8 è compatibile solo con i sistemi operativi moderni e non funziona su sistemi legacy"],1,"UTF-8 usa la seguente strategia: 1 byte per i caratteri ASCII standard (retro-compatibile con ASCII), 2 byte per caratteri latini estesi e greco, 3 byte per CJK (cinese, giapponese, coreano), 4 byte per caratteri rari e emoji. Questo design permette di supportare oltre 140.000 caratteri mantenendo efficienza per i testi in lingue occidentali.",["Non è corretto. Per i caratteri ASCII standard (lettere latine, numeri, punteggiatura), UTF-8 usa esattamente 1 byte — uguale ad ASCII. UTF-8 usa più bytes (fino a 4) per i caratteri non ASCII. Non è sempre più efficiente in termini di memoria.","Esatto! UTF-8 è un sistema intelligente: usa 1 byte per i caratteri ASCII (0–127), garantendo piena compatibilità con i vecchi sistemi ASCII. Usa 2–4 byte solo per i caratteri non ASCII. Questo permette di supportare tutte le lingue del mondo senza sprecare spazio nei testi principalmente in inglese.","Non è corretto. I caratteri non ASCII in UTF-8 occupano più spazio (2-4 byte), non meno. UTF-8 risolve il problema della copertura linguistica, non il problema dello spazio. La compressione è un'ottimizzazione separata e indipendente dalla codifica dei caratteri.","Non è corretto. Uno dei punti di forza di UTF-8 è la compatibilità con i sistemi legacy: i primi 128 codici sono identici ad ASCII, quindi un testo ASCII letto come UTF-8 risulta identico. Questa retro-compatibilità è stata una scelta progettuale deliberata."]],["Un video Full HD (1920×1080 pixel) non compresso a 24 bit/pixel e 30 fotogrammi/secondo: quanto occupa 1 minuto di video?",["Circa 11 GB","Circa 200 MB","Circa 1 TB","Circa 500 MB"],0,"Calcolo passo per passo: pixel per fotogramma = 1920 × 1080 = 2.073.600. Byte per fotogramma = 2.073.600 × 3 = 6.220.800. Byte per secondo = 6.220.800 × 30 = 186.624.000. Byte per minuto = 186.624.000 × 60 = 11.197.440.000 ≈ 11 GB. I codec video moderni comprimono questo fino a 50-100 MB per lo streaming, con un fattore di compressione di 100:1 o più.",["Esatto! Calcolo: 1920 × 1080 pixel/fotogramma × 3 byte/pixel (24 bit) × 30 fotogrammi/sec × 60 sec = 11.197.440.000 byte ≈ 11 GB. I video che guardi su YouTube usano codec efficienti (H.264, H.265) che comprimono questo dato a pochi centinaia di MB.","Non è corretto. 200 MB è la dimensione tipica di un video 1080p compresso con H.264, non non compresso. Il calcolo corretto per il non compresso: 1920×1080×3 byte×30fps×60s ≈ 11 GB.","Non è corretto. 1 TB è circa 90 volte troppo grande. Il calcolo esatto dà ≈ 11 GB per un minuto di video Full HD non compresso a 30fps.","Non è corretto. 500 MB è circa 22 volte troppo piccolo per un video non compresso. I 500 MB tipici di un video su disco si ottengono con compressione lossy (H.264, H.265), non con dati grezzi non compressi."]],["Perché i formati JPEG e PNG producono file di dimensioni molto diverse per lo stesso tipo di immagine?",["JPEG supporta più colori di PNG, quindi i file sono sempre più grandi","JPEG usa compressione lossy (perde dati) e ottiene file molto più piccoli; PNG usa compressione lossless (conserva tutti i dati) e produce file più grandi ma senza perdita di qualità","PNG è più lento da caricare e per questo occupa meno spazio su disco","La differenza dipende solo dalla risoluzione dell'immagine, non dall'algoritmo di compressione"],1,"JPEG (Joint Photographic Experts Group) usa compressione lossy basata sulla trasformata coseno discreta: scarta informazioni visive non percepibili dall'occhio, raggiungendo compressioni di 10:1 o più. PNG usa compressione lossless (algoritmo DEFLATE): tutte le informazioni originali sono preservate ma il risparmio è minore. Per fotografie si usa JPEG; per screenshot, loghi e immagini con testo si usa PNG.",["Non è corretto. Sia JPEG che PNG possono gestire immagini a 24 bit (16 milioni di colori). La differenza di dimensione dipende dal tipo di compressione usata, non dalla profondità di colore.","Esatto! JPEG scarta informazioni visive considerate impercettibili all'occhio umano (ad es. variazioni fini di colore) ottenendo compressioni 10:1 o più. PNG conserva tutti i dati originali ma ottiene compressioni più modeste. Per fotografie si usa JPEG; per immagini con testo o aree di colore uniforme si usa PNG.","Non è corretto. Il tempo di caricamento non influisce sulle dimensioni del file su disco. PNG tende a produrre file più grandi di JPEG per le fotografie perché usa compressione lossless, non lossy.","Non è corretto. A parità di risoluzione, JPEG e PNG possono differire enormemente in dimensioni a causa dei loro algoritmi di compressione diversi: lossy per JPEG, lossless per PNG. La risoluzione è solo uno dei fattori."]],["Un'azienda vuole scegliere la profondità di colore per un sistema di telecamere industriali di controllo qualità. Quali considerazioni guidano la scelta tra 8 bit/canale e 16 bit/canale per ogni componente RGB?",["Si deve sempre scegliere 16 bit/canale perché è più moderno e occupa meno spazio","8 bit/canale va scelto se la gamma dinamica di 256 livelli è sufficiente e il volume di dati è un vincolo; 16 bit/canale quando servono gradazioni fini o post-elaborazione intensiva","La profondità di colore non influisce sulla dimensione dei file, quindi si può scegliere liberamente","16 bit/canale è inutile perché l'occhio umano non distingue più di 256 livelli di colore"],1,"8 bit/canale (24 bit totali per pixel RGB) → 3 byte/pixel → ~16 milioni di colori. Adeguato per visualizzazione e la maggior parte delle analisi. 16 bit/canale (48 bit totali per pixel RGB) → 6 byte/pixel → ~281 trilioni di colori. Usato in fotografia professionale, imaging scientifico, machine vision industriale dove i 256 livelli non bastano per rilevare variazioni sottili. Il trade-off è sempre: qualità vs costo storage/banda.",["Non è corretto. 16 bit/canale occupa il doppio dello spazio di 8 bit/canale (6 byte vs 3 byte per pixel). Non è 'più moderno' nel senso di più efficiente: va scelto solo quando la maggiore gamma dinamica è effettivamente necessaria per l'applicazione.","Esatto! 8 bit/canale = 256 livelli per componente colore, sufficiente per la maggior parte delle applicazioni visive. 16 bit/canale = 65.536 livelli: utile per rilevare difetti sottili, analisi scientifiche o quando si prevede post-elaborazione con molte trasformazioni (che con 8 bit degraderebbero l'immagine). Il costo: doppio spazio e doppia banda.","Non è corretto. La profondità di colore influisce direttamente sulla dimensione dei file: 16 bit/canale = 6 byte/pixel, 8 bit/canale = 3 byte/pixel. Per un sistema industriale con telecamere ad alto frame rate, il doppio della dimensione dati significa il doppio della banda e dello storage.","Non è corretto. L'occhio umano effettivamente distingue circa 8-10 milioni di colori, ma i sistemi a 16 bit/canale sono usati per analisi automatizzate (algoritmi di computer vision) che riescono a sfruttare la maggiore precisione. Il criterio non è la percezione umana ma il requisito del sistema automatico."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
