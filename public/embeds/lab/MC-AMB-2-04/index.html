<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Sole e casa</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

window.LABVERIFICA={"id":"MC-AMB-2-04","F":[["Perché le finestre a sud in un edificio dell'emisfero nord non sono posizionate casualmente?",["Perché il vento freddo soffia prevalentemente da nord, e le finestre a sud le proteggono","Perché in Italia il sole sta a sud, e d'inverno le finestre a sud ricevono luce diretta","Perché a sud la luce è più uniforme e crea meno abbagliamento rispetto alle finestre a nord","Perché le norme antisismiche italiane impongono che le finestre principali guardino a sud"],1,"In Italia (emisfero nord, latitudine 37-47°N) il sole si muove sempre nel lato sud del cielo. Una finestra a sud riceve sole diretto in inverno (quando il sole è basso e profondamente entra) e può essere schermata in estate con un aggetto (il sole estivo è alto). Riduce il fabbisogno di riscaldamento del 30-40%.",["Non è corretto. La posizione delle finestre è legata all'irraggiamento solare, non alla direzione del vento. Il vento è gestito con altri sistemi.","Esatto! In Italia il sole descrive un arco sempre nel lato sud del cielo. Le finestre a sud ricevono sole diretto soprattutto in inverno (quando il sole è basso) riducendo il bisogno di riscaldamento del 30-40%.","Non è corretto. Le finestre a nord ricevono luce diffusa uniforme senza abbagliamento (per questo gli artisti le preferiscono). Le finestre a sud ricevono sole diretto e hanno un vantaggio termico.","Non è corretto. Le norme antisismiche riguardano la struttura dell'edificio, non l'orientamento delle finestre. L'orientamento a sud è una scelta bioclimatica, non normativa."]],["Qual è l'altezza del sole a mezzogiorno nel solstizio d'estate a Roma (latitudine 42°N)?",["Circa 24,5° — molto basso sull'orizzonte","Circa 71,5° — quasi verticale","Circa 48° — intermedio tra estate e inverno","Circa 90° — perfettamente verticale al solstizio d'estate"],1,"A Roma (42°N) il sole a mezzogiorno raggiunge: solstizio d'estate 71,5° (quasi verticale), equinozio 48° (intermedio), solstizio d'inverno 24,5° (molto basso). Differenza totale: 47°. Un aggetto progettato correttamente usa questa geometria per bloccare il sole estivo e lasciare entrare quello invernale.",["Non è corretto. Hai indicato l'altezza invernale. In estate il sole è molto più alto sull'orizzonte.","Esatto! A Roma (42°N), il solstizio d'estate porta il sole a circa 71,5° — quasi verticale. In inverno scende a 24,5°. Questa differenza di 47° è la base del controllo solare passivo.","Non è corretto. 48° è l'altezza equinoziale (21 marzo/settembre). In estate il sole sale molto più in alto, quasi verticale.","Non è corretto. Il sole è perfettamente verticale (90°) solo al Tropico del Cancro (23,5°N) al solstizio d'estate. A Roma (42°N) il sole non raggiunge mai la verticale."]],["Cos'è la massa termica di un materiale e qual è il suo effetto negli edifici?",["La resistenza del materiale alla penetrazione del calore, misurata come inverso della conduttività termica","La capacità di accumulare calore e rilasciarlo lentamente, smorzando gli sbalzi di temperatura","Il peso specifico del materiale che determina il carico strutturale sulle fondazioni","La quantità di materiale necessaria per costruire un metro cubo di struttura"],1,"La massa termica (capacità termica volumetrica, kJ/m³·K) misura quant'energia termica un materiale immagazzina per grado di variazione di temperatura. Un muro di mattoni (1.360 kJ/m³·K) accumula calore solare di giorno e lo rilascia di notte: lo sfasamento termico ritarda il picco di calore di 8-12 ore.",["Non è corretto. Hai descritto l'isolamento termico (R = 1/λ). La massa termica è diversa: è la capacità di accumulare calore.","Esatto! La massa termica (kJ/m³·K) misura quanto calore un materiale accumula per variazione di temperatura. Un muro di mattoni assorbe calore di giorno e lo rilascia di notte: effetto 'serbatoio termico' con sfasamento di 8-12 ore.","Non è corretto. Il peso specifico è rilevante per il calcolo strutturale. La massa termica misura la capacità di accumulo e rilascio di calore nel tempo.","Non è corretto. La quantità di materiale è un dato di progettazione. La massa termica è una proprietà termica del materiale."]],["Cos'è un 'ponte termico' in un edificio?",["Un elemento strutturale che collega due edifici diversi tramite un balcone o una passerella esterna","Un punto debole dell'isolamento (giunzione, angolo, struttura metallica) dove il calore disperde più facilmente","Il sistema che trasferisce il calore dal pavimento radiante alle pareti per distribuirlo uniformemente","Il materiale conduttore usato nelle fondazioni per trasmettere il calore geotermico all'edificio"],1,"I ponti termici sono i punti deboli dell'isolamento dell'involucro edilizio: giunzioni tra parete e solaio, angoli, balconi in cemento che 'tagliano' lo strato isolante. Il calore si disperde preferenzialmente attraverso questi punti. Possono rappresentare il 30-40% delle dispersioni totali anche in edifici con pareti ben isolate.",["Non è corretto. Hai descritto una struttura di collegamento fisico tra edifici. Il ponte termico è un fenomeno fisico di dispersione del calore, non una struttura architettonica.","Esatto! I ponti termici sono i punti dell'involucro edilizio dove lo strato isolante è interrotto o ridotto: giunzioni tra parete e solaio, angoli, balconi, pilastri. Il calore 'fugge' preferenzialmente attraverso questi punti.","Non è corretto. Il riscaldamento a pavimento funziona per irraggiamento e convezione, non attraverso 'ponti termici'. I ponti termici sono dispersioni indesiderate.","Non è corretto. Le fondazioni geotermiche sono sistemi di scambio termico attivi con il terreno. I ponti termici sono dispersioni passive indesiderate nell'involucro edilizio."]],["Come funziona l'effetto camino per la ventilazione naturale estiva?",["Il vento estivo entra dalle finestre e crea una depressione che aspira l'aria calda verso l'esterno","L'aria calda sale ed esce dall'alto; quella fresca entra dal basso e crea una corrente","Il calore del sole riscalda le pareti che irradiano calore verso il basso ventilando l'ambiente","La differenza di pressione tra piano terra e piano superiore crea un vuoto che aspira l'aria dall'esterno"],1,"L'effetto camino sfrutta la fisica dell'aria: l'aria calda è meno densa e sale. Con aperture basse (ingresso aria fresca) e alte (uscita aria calda), si crea un flusso ascendente continuo. Le case sahariane con alti cortili coperti e il Reichstag di Berlino usano questo principio.",["Non è corretto. Hai descritto parzialmente la cross-ventilation. L'effetto camino funziona per la differenza di densità tra aria calda e fredda, non solo per la pressione del vento.","Esatto! L'aria calda è più leggera e sale. Se ci sono aperture in basso (aria fresca entra) e in alto (aria calda esce), si crea un flusso ascendente naturale continuo senza ventilatori.","Non è corretto. L'irraggiamento delle pareti contribuisce alla trasmissione del calore ma non è il meccanismo dell'effetto camino. L'effetto camino è legato alla differenza di densità dell'aria.","Non è corretto. Non è un vuoto che aspira, ma la differenza di densità (aria calda leggera vs. aria fresca pesante) che genera il flusso. La fisica è diversa."]],["Il settore edilizio produce quale percentuale delle emissioni globali di CO₂?",["Circa il 5%","Circa il 39%","Circa il 15%","Circa il 70%"],1,"Il settore edilizio produce circa il 39% delle emissioni globali di CO₂: più di tutti i trasporti messi insieme. Questo include le emissioni per costruire (materiali, cantiere) e quelle per riscaldare, raffrescare e illuminare gli edifici in uso. È la ragione principale dell'architettura bioclimatica e degli standard energetici severi.",["Non è corretto. L'impatto del settore edilizio è molto maggiore. È uno dei settori più emissivi in assoluto.","Esatto! Il settore edilizio produce circa il 39% delle emissioni globali di CO₂, più di tutti i trasporti messi insieme. Ecco perché l'efficienza energetica degli edifici è prioritaria per la lotta al cambiamento climatico.","Non è corretto. Il 15% sarebbe simile al settore dei trasporti. Il settore edilizio emette molto di più: circa il 39% del totale globale.","Non è corretto. Il 70% sarebbe la quasi totalità delle emissioni antropiche. L'edilizia contribuisce per circa il 39%, un valore enorme ma non il 70%."]]],"I":[["Un aggetto (sporgenza del tetto o balcone) progettato correttamente a Roma deve bloccare il sole estivo ma lasciare entrare quello invernale. Come calcolare la profondità giusta?",["La profondità dell'aggetto deve essere uguale all'altezza della finestra per bloccare completamente il sole in tutte le stagioni","La profondità dipende dall'altezza della finestra e dalla differenza di angolo solare tra estate (71,5°) e inverno (24,5°) alla latitudine del sito","Non si può calcolare con precisione perché la posizione del sole varia ogni giorno durante l'anno","L'aggetto deve essere pari alla larghezza della finestra, non all'altezza, per schermare le ore del mattino e del pomeriggio"],1,"L'aggetto si progetta sfruttando la differenza di angolo solare tra estate (71,5° a Roma) e inverno (24,5°). La profondità giusta blocca la luce quando il sole è alto (estate) ma la lascia entrare quando è basso (inverno). Si calcola trigonometricamente: tan(angolo_estivo) × altezza_finestra = profondità_aggetto.",["Non è corretto. Se l'aggetto bloccasse il sole in tutte le stagioni, nemmeno il sole invernale (vantaggioso) entrerebbe. Il calcolo deve usare la geometria solare stagionale.","Esatto! La geometria solare è prevedibile. L'aggetto corretto blocca il sole estivo (alto 71,5°) ma lascia passare quello invernale (basso 24,5°). La profondità si calcola trigonometricamente dall'altezza della finestra e dalla latitudine.","Non è corretto. La posizione del sole è perfettamente prevedibile: segue equazioni astronomiche note. L'architettura bioclimatica si basa esattamente su questa prevedibilità.","Non è corretto. L'aggetto orizzontale controlla l'altezza solare (latitudine), non l'azimut (ore del giorno). I frangisole laterali controllano le ore del mattino/pomeriggio."]],["Un muro di mattoni pieno spesso 30 cm ha massa termica di 1.360 kJ/m³·K. Che effetto ha nelle ore notturne dopo un pomeriggio soleggiato?",["Si raffredda rapidamente perdendo tutta l'energia accumulata prima di mezzanotte","Rilascia poco alla volta il calore accumulato di giorno, scaldando la casa di notte","Riflette il calore verso l'esterno di notte, raffrescando l'ambiente interno nelle ore buie","Mantiene la stessa temperatura del pomeriggio all'infinito grazie alla sua capacità termica elevata"],1,"Un muro di mattoni pieno (30 cm) ha uno sfasamento termico di 8-12 ore: assorbe il calore solare durante il pomeriggio e lo rilascia gradualmente di notte. Il picco di calore interno arriva nelle ore più fredde, riducendo il fabbisogno di riscaldamento. In estate il processo si inverte: si raffredda di notte e 'assorbe' calore di giorno.",["Non è corretto. La massa termica è esattamente la proprietà che impedisce il raffreddamento rapido. Il muro rilascia il calore accumulato gradualmente nel corso di ore.","Esatto! Un muro di mattoni spesso 30 cm assorbe il calore solare del pomeriggio e lo rilascia di notte con uno sfasamento di 8-12 ore: il picco di calore interno arriva quando fuori fa più freddo, riducendo il fabbisogno di riscaldamento notturno.","Non è corretto. Il rilascio notturno del calore accumulato va verso l'interno (riscalda l'ambiente), non verso l'esterno. Il raffreddamento notturno delle masse pesanti è invece sfruttato in estate.","Non è corretto. La massa termica non mantiene la temperatura all'infinito: il calore si disperde progressivamente verso l'ambiente interno e verso l'esterno. Lo sfasamento è di 8-12 ore, non infinito."]],["La trasmittanza U di una parete di mattoni (U=2,5 W/m²·K) vs. mattoni + 8 cm di polistirolo (U=0,40). Quanto migliora l'isolamento?",["Migliora del 10%: una differenza marginale","Migliora di circa 6 volte (da U=2,5 a U=0,40): le dispersioni si riducono dell'84%","Migliora esattamente del 30%: il polistirolo è solo marginalmente più isolante del mattone","Dipende dalla stagione: d'estate migliora del 50%, d'inverno del 100%"],1,"Da U=2,5 (mattoni soli) a U=0,40 (mattoni + 8 cm polistirolo) è una riduzione di 6,25 volte (riduzione delle dispersioni dell'84%). 8 cm di polistirolo cambiano radicalmente la performance termica. E siamo ancora lontani dallo standard CasaClima A4 (U\u003c0,10): servirebbero strati molto più spessi o materiali più performanti.",["Non è corretto. Il miglioramento è molto più grande. Confronta i valori: da 2,5 a 0,40 è una riduzione di oltre il 80%.","Esatto! Da U=2,5 a U=0,40 è una riduzione di 6,25 volte. Le dispersioni termiche attraverso la parete si riducono dell'84%. Con 8 cm di polistirolo si risparmia molto più che 8 volte l'isolamento.","Non è corretto. Il polistirolo ha conduttività termica λ ≈ 0,030-0,040 W/m·K, molto più bassa del mattone (λ ≈ 0,5 W/m·K). Il miglioramento è molto superiore al 30%.","Non è corretto. La trasmittanza U è una proprietà fisica del materiale, non varia con la stagione. La dispersione termica dipende dalla differenza di temperatura, non dal valore U."]],["Cos'è la 'cross-ventilation' e come si realizza?",["Un sistema meccanico di ventilazione con recupero di calore per gli edifici a basso consumo","La ventilazione naturale che nasce aprendo finestre su lati opposti dell'edificio","Un sistema di apertura incrociata delle finestre a livelli diversi che crea zone di pressione alternata","Il sistema di ventilazione dei garage sotterranei che usa l'aria dal lato nord dell'edificio"],1,"La cross-ventilation (ventilazione trasversale) si crea con aperture su lati opposti dell'edificio: l'aria entra dal lato sopravvento ed esce da quello sottovento. Anche con vento leggero, il flusso trasversale raffresxa per evaporazione. Regola: le aperture di ingresso più piccole di quelle di uscita aumentano la velocità del flusso.",["Non è corretto. Il recupero di calore è un sistema meccanico attivo. La cross-ventilation è ventilazione naturale passiva, senza macchine.","Esatto! Con aperture su lati opposti (sopravvento e sottovento), anche il vento minimo crea un flusso trasversale che raffresça per evaporazione. Le aperture in ingresso piccole aumentano la velocità del flusso.","Non è corretto. La cross-ventilation si realizza con aperture su lati opposti allo stesso livello, non su livelli diversi. La differenza di livello è il principio dell'effetto camino.","Non è corretto. La ventilazione dei garage è un sistema specifico. La cross-ventilation è un principio generale di progettazione bioclimatica applicato agli spazi abitativi."]],["Perché i tetti verdi aiutano a gestire le acque piovane nelle città?",["Perché la vegetazione assorbe l'acqua e la evapora completamente senza scaricarla nelle fognature","Perché trattengono gran parte della pioggia nel terreno e la rilasciano lentamente","Perché aumentano la superficie impermeabile della città riducendo la velocità di scorrimento dell'acqua","Perché il sistema radicale delle piante perfora le membrane impermeabili drenando l'acqua nel solaio"],1,"I tetti verdi trattengono fino all'80% dell'acqua piovana nel substrato e nella vegetazione. Invece di scaricare immediatamente nelle fognature, l'acqua viene rilasciata lentamente per evapotraspirazione nelle ore successive. Questo riduce il picco di carico sulle fognature durante i temporali intensi, riducendo il rischio di allagamenti.",["Non è corretto. I tetti verdi non evaporano completamente l'acqua: trattengono una parte e rilasciano lentamente il resto. Non sono un sistema di eliminazione totale dell'acqua piovana.","Esatto! I tetti verdi trattengono fino all'80% dell'acqua piovana nella terra e nella vegetazione, rilasciandola lentamente per evapotraspirazione. Questo riduce il picco di scarico nelle fognature durante i temporali intensi.","Non è corretto. I tetti verdi riducono la superficie impermeabile (rispetto ai tetti tradizionali impermeabilizzati). Non aumentano la superficie impermeabile.","Non è corretto. I tetti verdi sono progettati con membrane antiradice per evitare esattamente questo. Le piante non perforano le membrane: crescono nel substrato sopra di esse."]],["La certificazione LEED differisce dalla CasaClima. Quale differenza principale le distingue?",["LEED è europea e CasaClima è americana: usano sistemi di misurazione diversi","LEED valuta a punti molti aspetti dell'edificio; CasaClima soprattutto l'energia","LEED si applica solo agli edifici commerciali; CasaClima si applica solo al residenziale","LEED certifica solo edifici nuovi; CasaClima anche ristrutturazioni"],1,"LEED (americano) è un sistema a punti che valuta molti aspetti: energia, acqua, materiali sostenibili, qualità dell'aria interna, trasporti, innovazione. CasaClima (Alto Adige) è focalizzata sulla prestazione energetica termica: misura il fabbisogno di energia per riscaldamento (kWh/m²/anno) e assegna classi da G ad A4.",["Non è corretto. È il contrario: LEED è americana (Leadership in Energy and Environmental Design), CasaClima è italiana/tirolese.","Esatto! LEED è un sistema olistico a punti: valuta energia, acqua, materiali, qualità dell'aria interna, innovazione. CasaClima è focalizzata sulla prestazione energetica termica (kWh/m²/anno) con classi dalla G all'A4.","Non è corretto. Entrambe le certificazioni si applicano a edifici residenziali e commerciali. La distinzione è metodologica, non per tipologia di edificio.","Non è corretto. Sia LEED che CasaClima hanno percorsi di certificazione per edifici nuovi e per ristrutturazioni."]]],"A":[["Perché la scuola Copernico di Torino (CasaClima A4, 2018) è considerata un caso studio?",["Perché è il primo edificio scolastico costruito interamente in legno in Italia","Perché ha raggiunto la classe energetica A4 (quasi a zero energia) in un edificio pubblico con vincoli di budget pubblico","Perché è l'unica scuola italiana con pannelli fotovoltaici installati sulla facciata verticale","Perché è il primo edificio in Italia progettato usando la realtà virtuale e i droni per la cantierizzazione"],1,"La scuola Copernico di Torino (2018, CasaClima A4) è un caso studio perché dimostra che anche un edificio pubblico con budget limitato può raggiungere la massima efficienza energetica. È di interesse nazionale per la PA che deve ristrutturare o costruire migliaia di edifici scolastici nei prossimi anni.",["Non è corretto. La caratteristica rilevante della scuola Copernico non è il materiale costruttivo ma la prestazione energetica raggiunta (CasaClima A4).","Esatto! La scuola Copernico dimostra che anche con i vincoli di budget di un edificio pubblico è possibile raggiungere la classe energetica più alta (A4). È un caso di studio per la PA italiana.","Non è corretto. Il fotovoltaico in facciata è una tecnologia esistente in molti edifici. La peculiarità della Copernico è la prestazione energetica complessiva (A4), non solo i pannelli solari.","Non è corretto. Il caso studio riguarda la prestazione energetica e bioclimatica, non le tecnologie di progettazione digitale."]],["Un progettista valuta un sito in Sardegna (clima mediterraneo, estati calde e secche) per un edificio bioclimatico. Quale strategia è più rilevante rispetto a un edificio a Milano?",["Massimizzare l'isolamento termico per ridurre i consumi di riscaldamento invernale","Puntare su ventilazione naturale, massa termica e schermature dal sole estivo","Costruire con il tetto verde per catturare le piogge estive che sono abbondanti in Sardegna","Usare solo materiali bianchi per riflettere la luce solare su tutti i prospetti"],1,"Le strategie bioclimatiche dipendono dal clima. In Sardegna (estate calda e secca) le priorità sono: 1) schermatura solare degli infissi (aggetti); 2) ventilazione naturale (effetto camino e cross-ventilation); 3) massa termica (muri spessi che si raffrescano di notte); 4) orientamento per minimizzare l'esposizione ovest (pomeriggio). A Milano la priorità è il riscaldamento invernale.",["Non è corretto. A Milano il riscaldamento invernale è la priorità. In Sardegna le estati calde rendono il raffrescamento estivo la sfida principale. Le strategie bioclimatiche cambiano con il clima.","Esatto! In clima mediterraneo (estate calda e secca), il raffrescamento estivo passivo è la priorità: effetto camino, cross-ventilation, masse termiche che si raffrescano di notte, aggetti per schermatura solare. Diverso da Milano dove il riscaldamento invernale domina.","Non è corretto. La Sardegna ha estati secche (clima mediterraneo): le piogge estive sono scarse. I tetti verdi gestiscono le piogge intense, non le distribuiscono nell'arco dell'anno.","Parzialmente corretto: le superfici bianche riducono il riscaldamento delle pareti (albedo). Ma la strategia bioclimatica completa include molti altri elementi: ventilazione, massa termica, schermature, orientamento."]],["Un edificio esistente ha U=1,2 W/m²·K sulle pareti. Il proprietario vuole ristrutturarlo per raggiungere lo standard CasaClima A (U\u003c0,10). Quante volte deve migliorare la trasmittanza?",["Deve migliorare di 3 volte: da 1,2 a 0,40","Deve migliorare di 12 volte: da U=1,2 a U\u003c0,10","Deve migliorare di 1,1 unità: da 1,2 a 0,10 (differenza aritmetica)","Non è possibile migliorare la trasmittanza di più di 5 volte mantenendo la struttura originale"],1,"Da U=1,2 a U\u003c0,10 è un miglioramento di oltre 12 volte (1,2/0,10 = 12). In pratica richiede un cappotto termico esterno di 20-30 cm di isolante ad alta prestazione (lana di roccia λ=0,035, polyisocianurato λ=0,022). Non è sufficiente il cappotto standard da 8-10 cm per raggiungere lo standard CasaClima A.",["Non è corretto. 0,40 è un miglioramento di 3 volte, ma non raggiunge lo standard A (U\u003c0,10). Il calcolo corretto: 1,2/0,10 = 12 volte.","Esatto! Per passare da U=1,2 a U\u003c0,10 occorre migliorare di 12 volte la trasmittanza. In pratica significa cappotti termici di 20-30 cm di isolante ad alta efficienza (es. lana di roccia o fibra di legno).","Non è corretto. La differenza aritmetica (1,1 unità) non misura il miglioramento percentuale. Il rapporto (1,2/0,10 = 12) misura quante volte è meglio il valore target.","Non è corretto. Con cappotti termici di spessore adeguato (anche 25-30 cm) si raggiunge facilmente U\u003c0,10 su pareti esistenti, senza modificare la struttura portante."]],["Una start-up propone di costruire 'vertical forest' (foreste verticali) in tutta Italia come soluzione al surriscaldamento urbano. Quali limiti concreti questa proposta deve affrontare?",["Le normative italiane vietano l'uso di piante negli edifici per ragioni igieniche e anti-parassitarie","Costi altissimi di costruzione e manutenzione, peso, e benefici minori di un parco a terra","Mancanza di luce solare sufficiente per le piante negli ambienti urbani densamente edificati","L'impatto visivo negativo che riduce il valore commerciale degli immobili nei quartieri finanziari"],1,"Le foreste verticali (es. Bosco Verticale di Milano) hanno costi enormi di costruzione (le piante richiedono substrati pesanti e supporti strutturali), manutenzione continua costosa (irrigazione, sostituzione), peso strutturale aggiuntivo, e i benefici ambientali sono molto inferiori a un parco equivalente a terra. Sono più una scelta estetica e di marketing che una soluzione scalabile al surriscaldamento urbano.",["Non è corretto. Non esistono normative che vietano le piante negli edifici. Il problema delle foreste verticali è economico, tecnico e di manutenzione.","Esatto! Le foreste verticali hanno costi di costruzione molto alti, manutenzione continua (irrigazione, sostituzione piante), carico strutturale elevato, e i benefici ambientali (umidità, CO₂) sono molto minori di un equivalente parco urbano a terra dello stesso costo.","Non è corretto. La luce solare può essere sufficiente sulle facciate esposte a sud. Il problema principale è economico e strutturale, non luminoso.","Non è corretto. Le foreste verticali sono spesso associate a edifici di lusso e aumentano il valore immobiliare. Il problema non è estetico-commerciale."]],["L'architettura bioclimatica è definita come 'fisica applicata'. Quali conoscenze scientifiche deve integrare un progettista bioclimatico?",["Solo fisica e chimica dei materiali: l'estetica non è rilevante nell'architettura bioclimatica","Geometria solare, termodinamica dei materiali, fisica dei fluidi (ventilazione), biologia vegetale e idrologia","Principalmente ingegneria strutturale e normativa antisismica: la bioclimatica si aggiunge solo nella fase decorativa","Solo le norme tecniche europee (Eurocodici) e le linee guida CasaClima: le conoscenze scientifiche si trovano nei manuali"],1,"Il progettista bioclimatico integra: 1) geometria solare (angoli stagionali, latitudine); 2) termodinamica (massa termica, conduttività, sfasamento); 3) fisica dei fluidi (effetto camino, cross-ventilation, pressioni); 4) biologia vegetale (tetti verdi, evapotraspirazione); 5) idrologia (invarianza idraulica). Non è decorazione: è fisica applicata fin dalla prima scelta progettuale.",["Non è corretto. L'architettura bioclimatica integra fisica, geometria, biologia (vegetazione), idrologia e anche estetica (un edificio bioclimatico deve anche essere bello per essere adottato).","Esatto! Un progettista bioclimatico integra: 1) geometria solare (angoli, orientamento); 2) termodinamica (massa termica, trasmittanza); 3) fisica dei fluidi (effetto camino, cross-ventilation); 4) biologia (tetti verdi); 5) idrologia (gestione acque piovane).","Non è corretto. La bioclimatica non è decorativa: è integrata fin dalla concezione del progetto (orientamento, forma, materiali). Non si aggiunge alla fine.","Non è corretto. Le norme tecniche applicano principi scientifici. Un progettista bioclimatico deve capire i principi fisici per applicarli creativamente a ogni sito specifico."]],["Le Olimpiadi di Cortina 2026 usano strutture bioclimatiche. Perché un evento sportivo invernale dovrebbe preoccuparsi dell'efficienza energetica estiva?",["Perché le strutture olimpiche vengono usate solo d'estate dopo i Giochi invernali","Perché gli impianti durano decenni e, con il clima che cambia, saranno usati sempre più anche d'estate","Perché il CIO (Comitato Olimpico Internazionale) impone standard bioclimatici per ridurre i costi di gestione durante i Giochi","Perché la neve e il freddo delle Alpi rendono inutile il riscaldamento: l'efficienza riguarda solo il raffrescamento estivo"],1,"Le strutture di Cortina 2026 dureranno 30-50 anni. Il cambiamento climatico accorcia la stagione sciistica e aumenta il turismo estivo in montagna. Progettare bioclimatico significa pensare all'intera vita dell'edificio: efficiente in inverno (riscaldamento) ed estate (raffrescamento). Non solo per due settimane di gare olimpiche.",["Non è corretto. Le strutture olimpiche vengono usate tutto l'anno (sport, eventi, turismo estivo). Ma la ragione della bioclimatica non è solo l'uso estivo.","Esatto! Le strutture costruite per i Giochi durano 30-50 anni. Il cambiamento climatico riduce la stagione della neve e aumenta l'uso estivo. Progettare bioclimatico significa essere efficienti per tutta la vita dell'edificio, non solo per due settimane di gare.","Non è corretto. I costi durante i Giochi sono solo una parte. La ragione principale è la vita utile dell'edificio (decenni) durante la quale l'efficienza energetica fa la differenza economica e ambientale reale.","Non è corretto. Gli edifici alpine hanno bisogno di riscaldamento in inverno e raffrescamento in estate. L'architettura bioclimatica ottimizza entrambe le stagioni."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>

<script>
// Modalità LIM · percorso a passi. In LIM ogni scheda livello diventa una sequenza di schermate:
// consegna + prima attività → attività successive → Rifletti → Verifica (una domanda per volta) → Compito.
// Si naviga con la barra in basso, con PagSu/PagGiù o con le frecce del telecomando/presenter.
// Fuori dalla modalità LIM la pagina resta identica (tutte le regole valgono solo sotto html.lim).
(function () {
  const root = document.documentElement;
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const bar = mk("nav", "lim-steps"); bar.setAttribute("aria-label", "Passi del laboratorio");
  const prev = mk("button", null, "◀ Indietro"); prev.type = "button";
  const dots = mk("div", "lim-dots");
  const next = mk("button", "lim-next", "Avanti ▶"); next.type = "button";
  bar.append(prev, dots, next);
  let steps = [], cur = 0, panel = null;
  const all = () => steps.flatMap((s) => s.els);

  function label(el) {
    if (el.classList.contains("meta")) return "Rifletti";
    if (el.classList.contains("verif")) return "Verifica";
    if (el.classList.contains("bridge")) return "Compito";
    const h = el.querySelector(".blk-h, h3, h2"); if (h) return h.textContent.trim();
    return el.classList.contains("brief") ? "Consegna" : "Attività";
  }
  function build() {
    all().forEach((e) => e.classList.remove("lim-off"));
    panel = document.querySelector(".wrap > .panel:not([hidden])"); steps = [];
    if (!panel) { bar.hidden = true; return; }
    const kids = [...panel.children];
    for (let i = 0; i < kids.length; i++) {
      const e = kids[i];
      // la consegna sta sopra la prima attività, nella stessa schermata
      if (e.classList.contains("brief") && kids[i + 1]) { steps.push({ els: [e, kids[i + 1]], t: label(kids[i + 1]) }); i++; continue; }
      steps.push({ els: [e], t: label(e) });
    }
    const br = document.querySelector(".wrap > .bridge"); if (br) steps.push({ els: [br], t: "Compito" });
    dots.innerHTML = "";
    steps.forEach((s, i) => {
      const t = s.t.length > 22 ? s.t.slice(0, 20).trim() + "…" : s.t;
      const b = mk("button", null, `<span class="n">${i + 1}</span><span class="t">${t.replace(/[&<>]/g, "")}</span>`);
      b.type = "button"; b.title = s.t; b.onclick = () => go(i); dots.appendChild(b);
    });
    bar.hidden = steps.length < 2;
    if (steps.length < 2) { clear(); return; }
    cur = Math.min(cur, steps.length - 1); go(cur, true);
  }
  function go(i, quiet) {
    if (!steps.length) return;
    cur = Math.max(0, Math.min(steps.length - 1, i));
    all().forEach((e) => e.classList.add("lim-off"));
    steps[cur].els.forEach((e) => e.classList.remove("lim-off"));
    [...dots.children].forEach((b, j) => { if (j === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
    dots.children[cur]?.scrollIntoView({ inline: "center", block: "nearest" });
    prev.disabled = cur === 0; next.disabled = cur === steps.length - 1;
    if (!quiet) window.scrollTo({ top: 0 });
    window.dispatchEvent(new Event("resize")); // grafici e 3D si ridisegnano quando diventano visibili
  }
  function clear() { all().forEach((e) => e.classList.remove("lim-off")); }
  prev.onclick = () => go(cur - 1); next.onclick = () => go(cur + 1);

  // Verifica: una domanda per volta, con «Domanda n di N»
  function pager(v) {
    if (v.dataset.limq) return; v.dataset.limq = "1";
    const body = v.querySelector(".verif-body"); if (!body) return;
    const nav = mk("div", "lim-qnav"); const pb = mk("button", null, "◀"); const txt = mk("span"); const nb = mk("button", null, "Domanda successiva ▶");
    pb.type = nb.type = "button"; nav.append(pb, txt, nb); body.after(nav);
    let q = 0;
    const show = () => { const qs = [...body.querySelectorAll(".vq")]; if (!qs.length) return; q = Math.max(0, Math.min(qs.length - 1, q));
      qs.forEach((x, j) => x.classList.toggle("lim-cur", j === q)); txt.textContent = `Domanda ${q + 1} di ${qs.length}`; pb.disabled = q === 0; nb.disabled = q === qs.length - 1; };
    pb.onclick = () => { q--; show(); }; nb.onclick = () => { q++; show(); };
    new MutationObserver(() => { if (!body.querySelector(".vq.lim-cur")) { q = 0; show(); } }).observe(body, { childList: true });
    show();
  }

  function sync() {
    const on = root.classList.contains("lim");
    if (on) { build(); } else clear();
  }
  function mount() {
    document.body.appendChild(bar);
    document.querySelectorAll(".verif").forEach(pager);
    // cambio di livello: ricostruisci i passi quando cambia la scheda visibile (in qualunque modo avvenga)
    let tmr = 0;
    const onPanel = () => { clearTimeout(tmr); tmr = setTimeout(() => { const p = document.querySelector(".wrap > .panel:not([hidden])"); if (p !== panel) cur = 0; if (root.classList.contains("lim")) build(); }, 0); };
    document.querySelectorAll(".wrap > .panel").forEach((p) => new MutationObserver(onPanel).observe(p, { attributes: true, attributeFilter: ["hidden"] }));
    document.addEventListener("keydown", (e) => {
      if (!root.classList.contains("lim")) return;
      const tag = (e.target.tagName || "").toLowerCase(); if (tag === "textarea" || tag === "input" || tag === "select") return;
      if (e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
      if (e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
    });
    new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["class"] });
    sync();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>

</body>
