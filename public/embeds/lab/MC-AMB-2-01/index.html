<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Forze in gioco</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-AMB-2-01","F":[["Cosa si intende per 'compressione' in una struttura edilizia?",["La forza che tira un elemento strutturale da due parti opposte verso l'esterno","La forza che spinge un elemento strutturale da due parti opposte verso il suo centro","La forza che fa piegare una trave orizzontale verso il basso","La forza che fa scorrere una parte della struttura rispetto all'altra"],1,"La compressione si genera quando un elemento strutturale viene spinto da due parti opposte verso il suo centro. I pilastri, le colonne e i mattoni lavorano principalmente in compressione. Materiali come pietra, mattoni e calcestruzzo resistono bene alla compressione ma male alla trazione.",["Non è corretto. Hai descritto la trazione. La compressione è la forza opposta.","Esatto! La compressione schiaccia l'elemento verso il centro. Pilastri, colonne e mattoni dei muri portanti lavorano principalmente in compressione: il peso preme dall'alto, il suolo risponde dal basso.","Non è corretto. Hai descritto la flessione. La compressione non produce piegamento ma schiacciamento.","Non è corretto. Hai descritto il taglio. La compressione schiaccia l'elemento verso il centro."]],["Perché un arco in pietra o mattoni riesce a resistere a carichi elevati?",["Perché la forma curva distribuisce il peso in forze di compressione lungo tutta la curva","Perché la forma curva crea trazione uniforme che il mattone regge facilmente","Perché l'arco bilancia compressione e trazione in modo equilibrato","Perché i mattoni sono incollati con cemento che assorbe le forze di taglio"],0,"Un arco distribuisce il peso in forze di compressione lungo la curva. Ogni mattone spinge quello accanto verso il basso e verso l'esterno. Nessun elemento è in trazione, solo in compressione. Per questo gli archi romani durano: usano materiali (pietra, mattone) che resistono perfettamente alla compressione.",["Esatto! Un arco trasforma il carico verticale in forze di compressione lungo la curva. Ogni mattone spinge il vicino verso il basso e verso l'esterno: tutto è in compressione, e la pietra la sopporta perfettamente.","Non è corretto. I mattoni reggono male la trazione. L'arco funziona proprio perché converte tutto in compressione, eliminando la trazione.","Non è corretto. L'arco non bilancia i due tipi di forza: elimina quasi completamente la trazione, lavorando solo in compressione. È questo il suo segreto.","Non è corretto. Gli archi romani erano costruiti senza cemento! La forza che li tiene insieme è la compressione geometrica, non il legante."]],["Cosa è il cemento armato e perché combina cemento e acciaio?",["È cemento con fibre di vetro per aumentarne la trasparenza","È cemento con barre di acciaio: il cemento gestisce la compressione, l'acciaio gestisce la trazione","È una miscela di cemento e acciaio in polvere per aumentarne la resistenza chimica","È cemento riscaldato con acciaio liquido per creare un materiale omogeneo più resistente"],1,"Il cemento armato (inventato nell'Ottocento) combina calcestruzzo (che regge bene la compressione) con barre di acciaio all'interno (che reggono bene la trazione). Insieme realizzano ciò che nessuno dei due potrebbe fare da solo: una struttura che regge sia compressione che trazione.",["Non è corretto. Il cemento armato usa barre di acciaio, non fibre di vetro. Il principio è il complemento di proprietà meccaniche.","Esatto! Il cemento regge bene la compressione ma quasi niente la trazione. L'acciaio regge bene la trazione. Insieme fanno ciò che nessuno dei due potrebbe fare da solo.","Non è corretto. L'acciaio nel cemento armato è sotto forma di barre (o reti), non di polvere. La funzione è meccanica, non chimica.","Non è corretto. Il cemento armato si produce colando calcestruzzo liquido attorno a barre di acciaio solide. I due materiali rimangono distinti nella struttura."]],["Qual è la differenza principale tra un muro portante e un muro tramezza?",["Il muro portante è sempre in mattoni, il muro tramezza sempre in cartongesso","Il muro portante regge i carichi dell'edificio; il muro tramezza divide solo gli spazi senza portare carichi","Il muro portante è sempre all'esterno; il muro tramezza è sempre all'interno","Il muro portante è più spesso e più alto del muro tramezza"],1,"Un muro portante è un elemento strutturale: trasmette i carichi dal solaio alle fondazioni. Non si può abbattere senza rischi. Un muro tramezza divide solo gli spazi interni e non porta carichi strutturali: può essere abbattuto senza problemi strutturali. Nei telai in c.a. quasi tutte le pareti interne sono tramezze.",["Non è corretto. Il materiale non definisce la funzione. Esistono muri portanti in calcestruzzo e tramezze in mattoni.","Esatto! Un muro portante è parte strutturale dell'edificio: abbatterlo mette a rischio la stabilità. Un muro tramezza divide spazi ma non porta carichi: può essere abbattuto senza rischio strutturale.","Non è corretto. I muri portanti possono essere sia esterni che interni (es. muri di spina centrali). La posizione non definisce la funzione strutturale.","Non è corretto. Lo spessore può essere un indizio ma non è la definizione. La funzione strutturale si determina dall'analisi dell'edificio, non solo dallo spessore."]],["Perché i pali di fondazione vengono usati quando il suolo superficiale non è resistente?",["Per isolare l'edificio dalle vibrazioni del terreno causate dal traffico","Per trasferire i carichi dell'edificio fino a uno strato di suolo resistente in profondità","Per drenare l'acqua in eccesso sotto l'edificio e stabilizzare il terreno argilloso","Per collegare l'edificio alla roccia madre e impedire i movimenti sismici laterali"],1,"I pali di fondazione sono elementi profondi (5-60 m) che vengono conficcati nel suolo fino a raggiungere uno strato resistente. È il sistema usato a Venezia, costruita su milioni di pali di legno di rovere e larice nell'argilla. Il campanile di San Marco poggiava su oltre 1.000 pali.",["Non è corretto. I pali di fondazione trasferiscono i carichi in profondità, non isolano dalle vibrazioni. L'isolamento sismico è una tecnologia diversa.","Esatto! I pali di fondazione (5-60 m di lunghezza) vengono conficcati nel suolo fino a raggiungere uno strato resistente. È il sistema usato a Venezia, costruita su milioni di pali di legno.","Non è corretto. Il drenaggio è gestito con altri sistemi (dreni, pompe). I pali di fondazione servono a trasferire i carichi in profondità, non a drenare l'acqua.","Non è corretto. I pali trasmettono carichi verticali in profondità. La resistenza sismica si ottiene con altri sistemi strutturali (controventi, isolatori)."]],["Perché le strutture in acciaio vengono rivestite con materiali ignifughi?",["Perché l'acciaio arrugginisce rapidamente a contatto con il fumo dell'incendio","Perché l'acciaio perde il 50% della resistenza sopra i 500-600°C, rischiando il collasso strutturale","Perché la normativa europea impone il rivestimento di tutte le strutture metalliche per motivi estetici","Perché l'acciaio a contatto con il fumo diventa fragile e perde la duttilità permanentemente"],1,"L'acciaio strutturale è resistente ma ha un punto debole: perde rapidamente resistenza ad alte temperature. Sopra i 500-600°C perde il 50% della resistenza e rischia il collasso. I rivestimenti ignifughi (ceramici, proiettati) rallentano il riscaldamento, dando tempo per l'evacuazione.",["Non è corretto. L'arrugginimento è un processo lento che non avviene nell'incendio. Il problema dell'acciaio nel fuoco è la perdita di resistenza meccanica per riscaldamento.","Esatto! L'acciaio perde rapidamente resistenza ad alte temperature. Sopra i 500-600°C perde il 50% della resistenza e può collassare. Il rivestimento ignifugo rallenta il riscaldamento per consentire l'evacuazione.","Non è corretto. I rivestimenti ignifughi esistono per ragioni di sicurezza strutturale in caso di incendio, non estetiche.","Non è corretto. L'acciaio non diventa fragile permanentemente per il fumo. Il problema è la perdita temporanea di resistenza meccanica per l'alta temperatura durante l'incendio."]]],"I":[["Perché la flessione è più complessa della semplice compressione o trazione?",["Perché la flessione è causata da forze orizzontali invece che verticali","Perché genera contemporaneamente compressione (parte superiore della trave) e trazione (parte inferiore) nello stesso elemento","Perché si verifica solo in strutture in legno e non nei materiali più rigidi come il cemento","Perché dipende dalla temperatura e dall'umidità dell'ambiente in modo imprevedibile"],1,"Una trave in flessione non è solo compressa né solo in trazione: nella zona superiore si genera compressione; in quella inferiore si genera trazione. Per gestire entrambe, le travi in acciaio hanno la sezione a H (HEA, HEB, IPE): le ali orizzontali portano i carichi di flessione, l'anima verticale resiste al taglio.",["Non è corretto. La flessione può essere causata sia da forze verticali (peso di un solaio) che orizzontali (vento). La complessità è dovuta alla coesistenza di due tipi di forza nella stessa trave.","Esatto! Una trave in flessione ha compressione nella zona superiore e trazione nella zona inferiore (o viceversa, a seconda del tipo di carico). Per questo le travi in acciaio hanno sezione a H: le ali portano i carichi di flessione.","Non è corretto. La flessione si verifica in qualsiasi elemento strutturale orizzontale: travi di legno, acciaio, cemento armato. È una delle forze fondamentali delle strutture.","Non è corretto. La flessione è deterministica: dipende dai carichi e dalla geometria. La temperatura influenza la dilatazione termica, non la flessione."]],["Perché il legno lamellare (CLT) si comporta meglio del legno massiccio nelle grandi strutture?",["Perché viene impregnato con resine sintetiche che lo rendono impermeabile e ignifugo","Perché gli strati di legno incollati con fibre alternate annullano i difetti del legno massiccio (nodi, deformazioni) aumentando la resistenza","Perché viene prodotto con specie di alberi crescita rapida che hanno legno più denso","Perché i giunti adesivi tra gli strati assorbono le energie sismiche come ammortizzatori"],1,"Il legno lamellare incolla strati di legno essiccato alternando le direzioni della fibra. Questo annulla i difetti del legno massiccio (nodi, deformazioni irregolari) e crea un materiale con resistenza uniforme superiore. L'arena del Forum di Assago ha una copertura in CLT con luci di 75 metri.",["Non è corretto. Il CLT non è impregnato con resine. Il vantaggio strutturale deriva dall'incollaggio di strati alternati che annulla nodi e deformazioni irregolari.","Esatto! Il legno lamellare incolla strati con direzioni della fibra alternate. Questo annulla i punti deboli del legno massiccio (nodi, deformazioni) ottenendo resistenza uniforme e superiore.","Non è corretto. Il CLT può essere fatto con legno di abete o larice (conifere a crescita relativamente rapida). Il vantaggio non è la specie ma la struttura lamellare incrociata.","Non è corretto. Gli adesivi non funzionano come ammortizzatori. Il comportamento sismico eccellente del legno lamellare dipende dalla sua leggerezza e duttilità intrinseca."]],["La Torre di Pisa si inclina perché il suolo ha ceduto di più su un lato. Quale tipo di fondazione avrebbe potuto prevenire questo problema?",["Una platea di fondazione continua su tutto il perimetro dell'edificio","Pali profondi che raggiungessero uno strato di suolo uniforme e resistente più in profondità","Muri perimetrali più spessi che distribuissero meglio il peso sulla superficie","Un'indagine geologica preliminare e la scelta di un sito con suolo più omogeneo"],1,"La Torre di Pisa si inclina perché fu costruita su argilla morbida non uniforme: il lato sud cedette di più. Pali di fondazione profondi avrebbero trasferito i carichi a uno strato di suolo più profondo, resistente e uniforme, prevenendo il cedimento differenziale. L'intervento degli anni '90 ha rimosso terra dal lato nord per raddrizzarla parzialmente.",["Parzialmente corretto: una platea distribuisce meglio i carichi. Ma il problema della Pisa era il suolo di argilla morbida non uniforme. Anche una platea avrebbe potuto cedere se il suolo non era adeguatamente studiato.","Esatto! Il problema era l'argilla morbida non uniforme in superficie. Pali profondi avrebbero trasmesso i carichi a uno strato più profondo e uniforme, evitando il cedimento differenziale che causa l'inclinazione.","Non è corretto. Muri più spessi non risolvono il problema: il cedimento dipende dalla resistenza del suolo, non dallo spessore dei muri.","Vero ma non risponde alla domanda sul tipo di fondazione. La domanda chiede quale fondazione avrebbe potuto prevenire il problema con quel suolo."]],["Perché il sughero è un buon materiale isolante termico e ha anche vantaggi ambientali?",["Perché viene prodotto con processi industriali a basso consumo energetico","Perché è estratto dalla corteccia della quercia da sughero senza abbatterla, è biodegradabile e la corteccia ricresce in 9-12 anni","Perché è un sottoprodotto del riciclo della plastica, riducendo i rifiuti industriali","Perché viene prodotto in Italia con materie prime locali riducendo i food miles del settore edilizio"],1,"Il sughero è estratto dalla corteccia della quercia da sughero (Quercus suber) senza abbatterla: la corteccia ricresce in 9-12 anni. È biodegradabile, naturalmente ignifugo, ottimo isolante termico (lambda 0,037-0,042) e acustico. Principalmente prodotto in Portogallo e in Sardegna.",["Non è corretto. I materiali isolanti non si distinguono principalmente per il processo di produzione. Il sughero ha vantaggi specifici legati alla sua natura biologica.","Esatto! Il sughero è estratto dalla corteccia della quercia senza abbatterla. La corteccia ricresce in 9-12 anni. È biodegradabile, naturalmente ignifugo e ottimo isolante termico e acustico.","Non è corretto. Il sughero è un materiale naturale biologico, non un derivato del riciclo della plastica. Viene dalla corteccia della quercia da sughero.","Non è corretto. Il sughero è prodotto principalmente in Portogallo e in Sardegna. E il concetto di 'food miles' si applica al cibo, non ai materiali edilizi."]],["Un edificio in zona sismica 1 deve resistere a forze di taglio orizzontali. Perché i terremoti generano forze laterali invece che verticali?",["Perché le onde sismiche si propagano orizzontalmente attraverso il suolo e spostano le fondazioni lateralmente","Perché i terremoti fanno sprofondare il suolo verso il basso creando una trazione verticale nelle pareti","Perché la pressione tettonica comprime le pareti degli edifici dall'esterno verso l'interno","Perché le vibrazioni verticali vengono assorbite dalle fondazioni e solo quelle orizzontali raggiungono la struttura"],0,"Le onde sismiche si propagano orizzontalmente nel suolo (onde S e onde di Love). Spostano rapidamente le fondazioni di lato, generando enormi forze di taglio orizzontali nella struttura. Gli edifici tradizionali sono progettati per i carichi verticali: il taglio sismico li coglie di sorpresa.",["Esatto! Le onde sismiche si propagano orizzontalmente nel suolo (onde S e onde di superficie). Spostano le fondazioni lateralmente, creando forze di taglio orizzontali nelle pareti e nei nodi strutturali.","Non è corretto. Il cedimento del suolo è un fenomeno secondario. Le forze principali dei terremoti sono laterali (onde sismiche orizzontali).","Non è corretto. La pressione tettonica agisce sulle rocce nel sottosuolo. La forza trasmessa agli edifici è laterale, non una compressione esterna.","Non è corretto. Le fondazioni trasmettono tutte le vibrazioni (verticali e orizzontali) alla struttura. Le forze laterali sono dominanti perché gli edifici sono progettati per resistere al peso verticale, non ai movimenti laterali."]],["La trasmittanza termica U=0,24 W/m²·K è il limite per le pareti esterne in zona E. Una parete di mattoni da 30 cm ha U≈1,5. Cosa significa questo confronto?",["La parete di mattoni da 30 cm supera il limite di 6 volte: non è ammessa nelle nuove costruzioni senza isolamento aggiuntivo","La parete di mattoni è accettabile perché la sua massa termica compensa il valore U elevato","Il valore U della parete di mattoni rientra nel limite se l'edificio è ben orientato a sud","La normativa U≤0,24 si applica solo agli edifici pubblici; per le case private il limite è U≤2,0"],0,"La trasmittanza U misura la dispersione termica. Una parete di mattoni da 30 cm (U≈1,5) disperde calore quasi 6 volte più del limite normativo italiano (U≤0,24 in zona E). Nelle nuove costruzioni è obbligatorio aggiungere isolamento per portare U sotto il limite.",["Esatto! 1,5 è circa 6 volte il limite di 0,24. Una parete di soli mattoni da 30 cm perde 6 volte più calore del consentito. Nelle nuove costruzioni deve essere abbinata a isolamento (cappotto o intercapedine).","Non è corretto. La massa termica e la trasmittanza U sono parametri distinti. Un U elevato indica dispersione termica elevata indipendentemente dalla massa. La normativa si basa su U.","Non è corretto. L'orientamento favorevole non compensa matematicamente un valore U sei volte superiore al limite normativo. Sono due concetti distinti.","Non è corretto. La normativa (D.Lgs. 192/2005 e aggiornamenti) si applica a tutti i nuovi edifici residenziali e non residenziali, non solo a quelli pubblici."]]],"A":[["In un appartamento con struttura a telaio in c.a. si vuole abbattere una parete per creare un open space. Come si determina se è portante?",["È sempre portante se è più spessa di 15 cm","In un telaio in c.a. quasi tutte le pareti interne sono tramezze: solo i pilastri e le travi sono strutturali","Basta picchiare sulla parete: se suona vuota è tramezza, se suona piena è portante","Solo i muri perimetrali sono portanti in qualsiasi tipo di edificio"],1,"In un edificio con telaio in c.a., i carichi vengono trasmessi da pilastri e travi, non dalle pareti. Le pareti interne sono quasi sempre tramezze non strutturali: si possono abbattere. Ma prima di qualsiasi intervento è fondamentale verificare con un tecnico strutturista o consultare il progetto originale.",["Non è corretto. Lo spessore è un indizio ma non è sufficiente per determinare se una parete è portante. In un telaio in c.a. le pareti interne sono quasi sempre tramezze indipendentemente dallo spessore.","Esatto! In un edificio con telaio in c.a., i carichi sono portati da pilastri e travi. Le pareti interne sono tramezze non strutturali: si possono abbattere. Ma verificare sempre con un tecnico strutturista.","Non è corretto. Questo è un metodo empirico per capire se c'è armatura dentro o il tipo di materiale, non per determinare la funzione strutturale. Una parete di mattoni 'pieni' può essere tramezza.","Non è corretto. In un edificio con muri portanti tradizionali, anche i muri centrali (di spina) possono essere portanti. In un telaio in c.a. i muri perimetrali sono spesso tramezze."]],["Il cemento è il materiale da costruzione più usato al mondo (4 miliardi di tonnellate/anno). Qual è il suo principale impatto ambientale?",["L'estrazione della sabbia dai fiumi che causa erosione e perdita di biodiversità","La produzione di circa l'8% delle emissioni globali di CO₂, principalmente nella produzione del clinker","Il consumo eccessivo di acqua nel processo di idratazione durante la presa","La difficoltà di riciclo che porta quasi tutto il cemento demolito in discarica"],1,"L'industria del cemento produce circa l'8% delle emissioni globali di CO₂. La fonte principale: la calcinazione del calcare (CaCO₃ → CaO + CO₂) nella produzione del clinker. Non è solo l'energia usata: la reazione chimica stessa rilascia CO₂ inevitabilmente con i processi tradizionali.",["Non è corretto. L'estrazione di sabbia è un problema reale ma non è il principale impatto del cemento. La questione dominante è nelle emissioni di CO₂.","Esatto! L'industria del cemento produce circa l'8% delle emissioni globali di CO₂. La principale fonte è la calcinazione del calcare (CaCO₃ → CaO + CO₂) nella produzione del clinker.","Non è corretto. Il consumo d'acqua del processo cementizio è rilevante ma non è l'impatto principale. Le emissioni di CO₂ nella produzione sono l'impatto dominante.","Non è corretto. Il calcestruzzo demolito (macerie) può essere riciclato come riempimento o inerti. Il problema principale è nella produzione di nuovo cemento."]],["Un ingegnere deve scegliere tra acciaio e legno lamellare per la copertura di un palazzetto sportivo con luce di 40 m. Quali fattori favoriscono il legno?",["Il legno è molto più economico dell'acciaio per grandi strutture","Il legno lamellare è più leggero (500-600 kg/m³ vs 7.800 kg/m³ dell'acciaio), ha comportamento sismico eccellente e sequestra carbonio","Il legno lamellare non richiede nessun trattamento ignifugo mentre l'acciaio sì","Il legno è il materiale con la maggiore resistenza meccanica assoluta per grandi luci"],1,"Il legno lamellare (CLT/Glulam) pesa ~500-600 kg/m³, quasi 13 volte meno dell'acciaio (7.800 kg/m³). A parità di peso, la resistenza specifica è comparabile. In zone sismiche il legno è eccellente: si piega senza collassare. E gli alberi abbattuti hanno già sequestrato CO₂: l'edificio è un serbatoio di carbonio.",["Non è corretto. Il legno lamellare non è necessariamente più economico dell'acciaio. I vantaggi sono ambientali e strutturali, non di costo.","Esatto! Il legno lamellare pesa quasi 13 volte meno dell'acciaio a parità di volume, si piega senza collassare (ottimo in zona sismica), e gli alberi abbattuti hanno già immagazzinato CO₂. L'arena di Assago ha una copertura CLT con luci di 75 m.","Non è corretto. Il legno lamellare ha un comportamento al fuoco migliore dell'acciaio (carbonizza lentamente mantenendo la resistenza più a lungo), ma in grandi strutture richiede comunque trattamenti antincendio.","Non è corretto. Per resistenza assoluta, l'acciaio supera il legno. Il vantaggio del legno è la resistenza specifica (per unità di peso) e il comportamento sismico."]],["Dopo il terremoto di Amatrice (2016, Mw 6.2), molti edifici crollarono mentre costruzioni simili del XX secolo in altri paesi resistettero. Qual è la ragione strutturale principale?",["L'intensità del terremoto di Amatrice era eccezionalmente superiore a qualsiasi evento registrato in precedenza","Molti edifici erano stati costruiti prima delle norme antisismiche adeguate, senza le armature necessarie per resistere alle forze di taglio sismico","L'uso di materiali locali di qualità inferiore rispetto agli standard nazionali","La posizione geografica in una zona con suolo particolarmente amplificante rispetto ad altre zone italiane"],1,"In Italia il 44% del territorio è in zona sismica 1 o 2, ma molti edifici sono stati costruiti prima che esistessero norme antisismiche adeguate. Mancavano armature trasversali (staffe nei pilastri), giunti duttili, controventi: elementi indispensabili per resistere alle forze di taglio sismico orizzontale.",["Non è corretto. Un terremoto di Mw 6.2 non è eccezionalmente raro. Il problema non era l'intensità inusuale ma la vulnerabilità degli edifici esistenti.","Esatto! La maggior parte degli edifici di Amatrice erano stati costruiti prima che esistessero norme antisismiche adeguate: mancavano le armature trasversali (staffe) nei pilastri necessarie per resistere alle forze di taglio sismico.","Non è corretto. Il problema non era la qualità locale dei materiali ma la mancanza di criteri strutturali antisismici nel progetto originale.","Non del tutto corretto. L'effetto sito (amplificazione del suolo) contribuisce, ma il problema principale era la vulnerabilità strutturale degli edifici costruiti senza norme antisismiche."]],["La flessione di una trave cresce con il quadrato della lunghezza. Cosa significa praticamente per la progettazione di un grande auditorium?",["Una trave lunga il doppio richiede il doppio del materiale per avere la stessa rigidità","Raddoppiando la luce, la flessione quadruplica: le travi di grandi spazi richiedono sezioni molto più grandi o sistemi strutturali alternativi","Le travi degli auditorium devono essere progettate solo per la compressione, non per la flessione","Gli auditorium richiedono sempre strutture in acciaio perché il cemento armato non regge le grandi luci"],1,"La freccia di flessione cresce con il quadrato della lunghezza (L²). Raddoppiare la luce quadruplica la flessione. Per un auditorium con luci di 20-30 m, questo significa usare travi molto profonde, capriate (reticoli triangolari), archi o shell strutturali per distribuire i carichi in modo più efficiente.",["Non è corretto. Se la flessione cresce con il quadrato della lunghezza, raddoppiare la lunghezza quadruplica la freccia, richiedendo molto più del doppio del materiale per compensare.","Esatto! Se la freccia di flessione cresce con il quadrato della lunghezza, raddoppiare la luce la quadruplica. Per grandi auditorium o palazzetti servono travi molto più profonde o sistemi alternativi (capriate, archi, gusci).","Non è corretto. Le travi orizzontali di copertura lavorano principalmente in flessione. Non si possono trasformare in elementi solo compressi senza cambiare completamente il sistema strutturale.","Non è corretto. Il cemento armato precompresso regge grandi luci. E il legno lamellare ha coperture fino a 75 m. L'acciaio non è l'unica opzione."]],["Un costruttore propone fondazioni superficiali (platea) per un edificio di 5 piani su terreno argilloso con falda superficiale. Quale rischio principale devi segnalare?",["L'argilla umida potrebbe ridurre la resistenza termica delle fondazioni aumentando le dispersioni di calore","Il terreno argilloso saturo ha bassa capacità portante e può cedere differenzialmente sotto i carichi, causando lesioni o collasso","La presenza di falda idrica rende impossibile costruire fondazioni di qualsiasi tipo","La platea superficiale potrebbe interferire con il sistema fognario comunale"],1,"Il terreno argilloso saturo ha bassa capacità portante e alta compressibilità. Fondazioni superficiali su argilla rischiano cedimenti differenziali (più su un lato che sull'altro), che causano lesioni diagonali nelle pareti e nei casi peggiori il collasso. Come la Torre di Pisa. Pali profondi fino a uno strato competente sono la soluzione corretta.",["Non è corretto. Le fondazioni non hanno funzione di isolamento termico. Il rischio principale dell'argilla umida è strutturale.","Esatto! L'argilla satura è compressibile e ha bassa capacità portante. Sotto carichi concentrati può cedere in modo differenziale (più su un lato che sull'altro), come alla Torre di Pisa. Servono pali profondi per raggiungere uno strato resistente.","Non è corretto. Edifici con fondazioni in presenza di falda si costruiscono regolarmente, con impermeabilizzazioni e, se necessario, abbassamento temporaneo della falda durante i lavori.","Non è corretto. Le fondazioni profonde (non la platea superficiale) potrebbero interferire con le reti interrate. Ma il rischio principale dell'argilla è la bassa capacità portante."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
