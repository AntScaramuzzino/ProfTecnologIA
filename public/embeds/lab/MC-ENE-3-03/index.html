<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Fotovoltaico per la scuola</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-ENE-3-03","F":[["Tra il 2010 e il 2023, il costo dell'energia solare è diminuito del 90%. Cosa ha reso possibile questa riduzione di costo così rapida?",["Economie di scala, miglioramenti tecnologici nella produzione di celle fotovoltaiche e aumento della produzione mondiale","La scoperta di nuovi giacimenti di silicio molto più economici da estrarre","La caduta del prezzo dei combustibili fossili che ha ridotto i costi di produzione dei pannelli","Un accordo internazionale che ha sussidiato la produzione di pannelli in tutti i paesi del mondo"],0,"Tra il 2010 e il 2023 il costo del solare è sceso del 90% (da >300 $/MWh a \u003c30 $/MWh). La ragione: economie di scala (la Cina ha industrializzato massicciamente la produzione), miglioramenti tecnologici (celle più efficienti), e la curva di apprendimento (ogni raddoppio della capacità installata riduce i costi del 20-25%). È la più rapida riduzione di costo nella storia delle fonti energetiche.",["Esatto! La drastica riduzione del costo solare è il risultato combinato di economie di scala (produzione di massa), miglioramenti tecnologici nell'efficienza delle celle, e la 'curva di apprendimento' industriale.","Non corretto. Il silicio è già abbondante (secondo elemento della crosta terrestre). La riduzione di costo non è dovuta alla materia prima ma alla produzione industriale su larga scala.","Non corretto. Il costo solare è sceso indipendentemente e in modo molto più rapido del prezzo dei fossili. La riduzione è dovuta all'industrializzazione massiccia della filiera fotovoltaica.","Non corretto. Non esiste un tale accordo universale. La riduzione di costo è il risultato di forze di mercato (economie di scala, innovazione tecnologica) non di un singolo accordo."]],["Qual è il principio fisico alla base del fotovoltaico (effetto fotoelettrico)?",["Fotoni di luce cedono energia agli elettroni in materiali semiconduttori, mettendoli in movimento e generando corrente elettrica","Il calore del sole scalda un fluido che produce vapore che aziona una turbina","La differenza di temperatura tra il pannello e l'aria genera una differenza di potenziale elettrico","Il silicio riflette la luce solare verso un sistema di specchi che concentra il calore in un punto"],0,"Il fotovoltaico sfrutta l'effetto fotoelettrico: fotoni di luce colpiscono il silicio (semiconduttore drogato con strati N e P), cedono energia agli elettroni che si mettono in movimento. Il campo elettrico interno alla cella spinge gli elettroni in una direzione, producendo corrente continua (DC). L'inverter la converte in corrente alternata (AC) per l'uso domestico.",["Esatto! L'effetto fotoelettrico: fotoni di luce colpiscono il silicio semiconduttore, cedono energia agli elettroni degli strati superficiali, che si mettono in movimento. Questo flusso ordinato di elettroni è la corrente elettrica.","Non corretto. Quello descritto è il solare termico a concentrazione (CSP), non il fotovoltaico. Il fotovoltaico converte direttamente la luce in elettricità tramite l'effetto fotoelettrico.","Non corretto. La differenza di temperatura tra pannello e aria non è il principio del fotovoltaico. Il principio è l'effetto fotoelettrico: fotoni → elettroni in movimento.","Non corretto. Il silicio assorbe la luce (non la riflette) e converte direttamente i fotoni in corrente tramite l'effetto fotoelettrico, senza specchi o calore concentrato."]],["Qual è il principale vantaggio dell'energia idroelettrica rispetto all'eolico e al solare, in termini di gestione della rete elettrica?",["È dispacciabile: si può regolare a piacimento aprendo o chiudendo le paratoie, a differenza di solare ed eolico che dipendono dalle condizioni meteorologiche","Ha un costo di produzione dell'energia molto inferiore al solare e all'eolico","Non richiede manutenzione perché l'acqua fa tutto il lavoro automaticamente","Non produce emissioni di CO₂ durante il funzionamento, a differenza di solare ed eolico"],0,"L'idroelettrico è 'dispacciabile': si può regolare aprendo o chiudendo le paratoie in base alla domanda. Quando serve più elettricità si aumenta il flusso, quando ce n'è troppa si riduce. Solare ed eolico sono intermittenti: producono solo quando c'è sole o vento, indipendentemente dalla domanda. Questa caratteristica rende l'idroelettrico prezioso per bilanciare la rete.",["Esatto! L'idroelettrico è 'dispacciabile': quando serve più elettricità si aumenta il flusso d'acqua, quando ce n'è troppa si riduce. Solare ed eolico sono intermittenti: producono solo quando c'è sole o vento.","Non corretto. Il costo dell'energia solare ed eolica è sceso sotto quello di nuovi impianti idroelettrici in molte aree. Il principale vantaggio dell'idroelettrico è la dispacciabilità, non il costo.","Non corretto. Le centrali idroelettriche richiedono manutenzione regolare di turbine, generatori, serbatoi e infrastrutture. Il vantaggio principale è la dispacciabilità, non l'assenza di manutenzione.","Non corretto. Anche solare ed eolico non producono CO₂ durante il funzionamento. Il vantaggio dell'idroelettrico è la dispacciabilità, non l'assenza di emissioni in funzionamento."]],["Dove si trova la prima centrale geotermica al mondo, ancora attiva, menzionata nel testo?",["Larderello, Toscana, inaugurata nel 1904","Geisir, Islanda, inaugurata nel 1920","Wairakei, Nuova Zelanda, inaugurata nel 1958","Reykjavik, Islanda, inaugurata nel 1930"],0,"La prima centrale geotermica commerciale del mondo fu inaugurata a Larderello (Toscana) nel 1904. L'ingegnere Piero Ginori Conti usò il vapore naturale dei 'soffioni boraciferi' per azionare una turbina. Oggi il campo geotermico di Larderello produce circa 800 MW, quasi il 2% della produzione elettrica italiana, con disponibilità continua 24/7.",["Esatto! La prima centrale geotermica commerciale fu inaugurata a Larderello (Toscana) nel 1904 dall'ingegnere Piero Ginori Conti, usando il vapore naturale dei 'soffioni boraciferi'. Produce ancora oggi circa 800 MW.","Non corretto. Larderello (Toscana, 1904) è la prima centrale geotermica commerciale del mondo. L'Islanda ha impianti geotermici importanti ma non i primi.","Non corretto. Wairakei è una centrale geotermica importante ma non la prima. La prima fu Larderello (Toscana) nel 1904.","Non corretto. La prima centrale geotermica commerciale del mondo è a Larderello (Toscana, Italia) inaugurata nel 1904."]],["Cosa si intende per 'potenza di picco' (kWp) di un impianto fotovoltaico?",["La potenza prodotta nelle condizioni standard di test: 1.000 W/m² di irraggiamento e temperatura di 25°C","La massima potenza mai prodotta dall'impianto in un giorno di estate con sole pieno","Il picco di consumo familiare che l'impianto è dimensionato per soddisfare","Il punto di massima efficienza dell'inverter nella conversione DC/AC"],0,"La potenza di picco (kWp) è la potenza prodotta dall'impianto fotovoltaico nelle condizioni standard di test: irraggiamento 1.000 W/m² e temperatura 25°C. Non è la potenza media: il fattore di carico in Italia è 13-15%, quindi un impianto da 3 kWp produce in media 390-450 W mediato su tutto l'anno (giorno e notte, estate e inverno).",["Esatto! La potenza di picco (kWp) è la potenza nominale dell'impianto nelle condizioni standard di test (1.000 W/m² di irraggiamento, 25°C). Nella realtà si produce molto meno: il fattore di carico in Italia è 13-15%.","Non corretto. Il kWp è la potenza in condizioni standard di test standardizzate (1.000 W/m², 25°C), non il massimo storico. Serve come riferimento confrontabile tra impianti diversi.","Non corretto. Il kWp misura la capacità di produzione dell'impianto, non i consumi famigliari. La produzione non è sempre uguale al consumo e l'impianto va dimensionato considerando il fattore di carico.","Non corretto. Il kWp riguarda la potenza dei pannelli, non l'efficienza dell'inverter. È la potenza nelle condizioni standard di test."]],["L'idrogeno verde si produce tramite elettrolisi dell'acqua. Cosa rende 'verde' questo idrogeno?",["L'elettricità usata per l'elettrolisi proviene da fonti rinnovabili, quindi non ci sono emissioni di CO₂ nella produzione","L'idrogeno verde è di colore verde a causa dei catalizzatori usati durante l'elettrolisi","L'idrogeno verde si estrae da piante di colore verde (alghe) tramite fermentazione","L'idrogeno verde è biodegradabile, a differenza dell'idrogeno convenzionale"],0,"L'idrogeno è classificato per colore in base alla sua produzione: 'verde' = elettrolisi con energia rinnovabile (zero emissioni), 'grigio' = elettrolisi o riforma a vapore con gas naturale (emissioni di CO₂), 'blu' = riforma a vapore con cattura della CO₂. L'idrogeno verde è a emissioni quasi zero lungo tutta la filiera.",["Esatto! L'idrogeno è 'verde' se l'elettricità usata per l'elettrolisi (separazione di H₂O in H₂ e O₂) viene da fonti rinnovabili. Se invece si usa elettricità da gas o carbone, si chiama idrogeno 'grigio' o 'blu'.","Non corretto. L'idrogeno non è letteralmente verde: è un gas incolore. Il termine 'verde' indica che la sua produzione usa energia da fonti rinnovabili, senza emissioni di CO₂.","Non corretto. L'idrogeno verde si produce tramite elettrolisi dell'acqua con energia rinnovabile, non dalla fermentazione di alghe.","Non corretto. L'idrogeno è H₂, un elemento chimico: non è 'biodegradabile' nel senso usuale. 'Verde' indica solo che la sua produzione è a basse emissioni perché usa energia rinnovabile."]]],"I":[["Il testo descrive il caso di Samsø (Danimarca): le turbine eoliche erano di proprietà di cooperative di cittadini. Quale effetto specifico ha avuto questo modello di proprietà sulla realizzazione del progetto?",["Ha eliminato la resistenza locale alle turbine: chi possiede le turbine e ne riceve i profitti non si lamenta del rumore o dell'impatto visivo","Ha ridotto i costi di installazione del 50% grazie al lavoro volontario dei cittadini","Ha permesso di installare turbine più grandi rispetto al limite consentito per le imprese private","Ha garantito che tutta l'elettricità prodotta restasse all'interno dell'isola senza essere esportata"],0,"Il modello cooperativo di Samsø ha eliminato la principale barriera alla transizione: la resistenza locale alle turbine. Chi possiede le turbine e ne riceve i dividendi non si lamenta del rumore o dell'impatto paesaggistico. Questo ha permesso di installare le turbine senza le lunghe contestazioni che rallentano i progetti eolici in molti altri luoghi.",["Esatto! La proprietà cooperativa ha trasformato i residenti da 'soggetti passivi' dell'impatto a 'beneficiari attivi' dei profitti. Chi ha investito nella cooperativa non si lamenta del rumore o dell'impatto visivo delle sue turbine.","Non corretto. Il testo non menziona una riduzione del 50% dei costi. Il vantaggio principale del modello cooperativo era l'eliminazione della resistenza locale, non il risparmio economico sull'installazione.","Non corretto. Il testo non menziona differenze normative tra cooperative e imprese private per la dimensione delle turbine. Il vantaggio era l'accettazione locale, non la dimensione.","Non corretto. Il testo dice che l'isola esportava il surplus alla rete nazionale. Il vantaggio della proprietà cooperativa era l'accettazione sociale, non l'auto-consumo forzato."]],["Il biogas prodotto dalla digestione anaerobica degli scarti organici può essere purificato in biometano (>95% CH₄) e immesso nella rete del gas. Quale vantaggio specifico ha questo rispetto alla combustione diretta del biogas?",["Il biometano può sostituire il gas fossile nelle reti esistenti senza modificare le infrastrutture, sostituendo gas fossile in modo quasi neutro per il clima","Il biometano ha un contenuto energetico 10 volte superiore al biogas grezzo","Il biometano è completamente biodegradabile, a differenza del biogas che inquina l'aria","Il biometano elimina completamente le emissioni di CO₂ della combustione"],0,"Il biometano (biogas purificato >95% CH₄) può essere immesso direttamente nelle reti del gas naturale esistenti e usato da qualsiasi utente collegato senza modifiche. È un vantaggio enorme rispetto alla combustione diretta del biogas grezzo (che richiede cogeneratori locali). In Italia, il biometano immesso in rete rappresenta circa il 10% del gas distribuito.",["Esatto! Il biometano si immette nella rete del gas naturale esistente e può essere usato da qualsiasi utente collegato alla rete senza modifiche. La combustione diretta del biogas in loco richiede invece impianti cogenerativi locali.","Non corretto. Il biometano è biogas purificato: ha un contenuto energetico per m³ maggiore del biogas grezzo (che contiene anche CO₂), ma non è 10 volte maggiore.","Non corretto. Il biogas (principalmente metano) è un combustibile gassoso, non un inquinante dell'aria nel senso usuale. Il vantaggio del biometano è la compatibilità con le reti gas esistenti.","Non corretto. Bruciare biometano produce CO₂ come qualsiasi combustione di metano. La differenza è che quella CO₂ era stata recentemente fissata dalla biomassa (ciclo del carbonio breve), non estratta da riserve fossili millenarie."]],["Il testo dice che il costo del solare è già più basso del fossile in molte zone, ma il costo di 'integrazione nel sistema' è separato e molto rilevante. Cosa comprende questo costo di integrazione?",["I costi di accumulo energetico, smart grid, rinforzo delle reti di distribuzione e gestione dell'intermittenza quando la quota di rinnovabili è alta","Il costo delle campagne di marketing per convincere i consumatori a comprare pannelli solari","Il costo dell'energia elettrica per i consumatori finali, che è diverso dal costo di produzione","Il costo delle normative ambientali che impongono standard elevati ai produttori di pannelli"],0,"L'errore comune è confrontare solo il costo di produzione (solare/eolico) con quello fossile. Il costo reale della transizione include anche: accumulo energetico (batterie, pompato), smart grid per gestione in tempo reale, rinforzo delle reti di distribuzione, e gestione dell'intermittenza. Un sistema al 100% rinnovabili richiede molto più accumulo e flessibilità di uno al 30%, aggiungendo costi che non compaiono nel prezzo del singolo pannello.",["Esatto! Il costo di produzione del solare è basso, ma quando la quota di rinnovabili supera il 30-40%, emergono costi aggiuntivi: accumulo (batterie), rinforzo delle reti, gestione in tempo reale dell'intermittenza tramite smart grid. Un sistema al 100% rinnovabili è più costoso da gestire di uno al 30%.","Non corretto. I costi di marketing non sono i 'costi di integrazione' nel sistema energetico. Il problema tecnico è gestire l'intermittenza quando la quota di rinnovabili è alta.","Non corretto. Il prezzo al consumatore include molti componenti (tasse, trasporto, oneri di sistema) ma non è quello che il testo chiama 'costo di integrazione'. Il problema specifico è l'intermittenza e la necessità di accumulo.","Non corretto. I costi normativi esistono ma non sono il 'costo di integrazione' descritto nel testo. Il costo di integrazione riguarda la gestione dell'intermittenza nella rete elettrica."]],["Un impianto fotovoltaico da 3 kWp in Italia centrale produce circa 3.600-4.000 kWh/anno. Ma la potenza di picco è 3 kW. Perché la produzione annua è così diversa da quello che si otterrebbe se l'impianto funzionasse a piena potenza tutto l'anno?",["Perché il 'fattore di carico' del solare in Italia è 13-15%: l'impianto non produce sempre a piena potenza ma varia con ore del giorno, stagione e condizioni meteorologiche","Perché l'inverter converte solo il 13-15% dell'energia prodotta dai pannelli, perdendo il resto","Perché i pannelli si degradano rapidamente e dopo 3 anni producono solo il 13-15% della potenza originale","Perché la legge italiana impone un limite di produzione del 15% della potenza nominale per i privati"],0,"Il fattore di carico del fotovoltaico in Italia è 13-15%: significa che di media, considerando notti, nuvole, inverno, l'impianto produce il 13-15% della sua potenza nominale ogni ora dell'anno. Un impianto da 3 kWp produce: 3 kW × 8.760 h/anno × 0,14 ≈ 3.679 kWh/anno. Questo è il motivo per cui il kWp è solo un parametro di targa, non la produzione reale.",["Esatto! Un impianto da 3 kWp a piena potenza per 8.760 ore/anno produrrebbe 26.280 kWh. Ma il fattore di carico è 13-15%: la produzione reale è 3.600-4.000 kWh/anno perché il sole non splende sempre e le nuvole riducono l'irraggiamento.","Non corretto. L'inverter moderno ha rendimento del 96-98%, non del 13-15%. Il fattore di carico del 13-15% riguarda la variabilità dell'irraggiamento solare (ore di buio, nuvole, stagioni), non le perdite dell'inverter.","Non corretto. I pannelli si degradano molto lentamente (0,5-1%/anno). La differenza tra kWp installati e kWh prodotti non dipende dal degrado ma dalla variabilità dell'irraggiamento solare.","Non corretto. Non esiste tale limitazione normativa. Il fattore di carico del 13-15% è una proprietà fisica dell'irraggiamento solare in Italia, non una limitazione normativa."]],["Il testo afferma che la transizione energetica non è 'solo sostituire i fossili con le rinnovabili' ma 'riprogettare l'intero sistema energetico'. Quali tre componenti del sistema devono essere riprogettati?",["Produzione (rinnovabili), distribuzione (smart grid), accumulo (batterie, pompato, idrogeno) e consumo (demand response, veicoli V2G)","Solo la produzione: sostituendo le centrali fossili con rinnovabili il sistema si adatta automaticamente","Solo i trasporti: elettrificando le auto il sistema energetico si trasforma automaticamente","Solo l'accumulo: con abbastanza batterie qualsiasi sistema energetico funziona"],0,"La transizione energetica richiede la riprogettazione dell'intero sistema: produzione (dalle centrali fossili alle rinnovabili), distribuzione (dalle reti tradizionali alle smart grid bidirezionali), accumulo (per compensare l'intermittenza), e consumo (demand response, V2G per flessibilizzare la domanda). Cambiare solo la produzione senza il resto crea problemi di stabilità e costi aggiuntivi.",["Esatto! La transizione richiede: produzione (fonti rinnovabili), distribuzione (smart grid con gestione intelligente), accumulo (per compensare l'intermittenza), e consumo (flessibilità della domanda, V2G). Non basta sostituire le centrali.","Non corretto. Sostituire solo la produzione senza modificare la rete (smart grid), l'accumulo e la gestione della domanda creerebbe problemi di stabilità con alte quote di rinnovabili intermittenti.","Non corretto. L'elettrificazione dei trasporti è una parte della transizione ma non la totalità. Servono anche produzione rinnovabile, smart grid e sistemi di accumulo.","Non corretto. L'accumulo da solo non è sufficiente. Occorre riprogettare anche la produzione (rinnovabili), la distribuzione (smart grid) e la gestione della domanda."]],["Il testo cita il caso dell'idroelettrico di pompaggio come la forma di accumulo energetico 'più diffusa al mondo'. Perché questa tecnologia non si può costruire ovunque?",["Perché richiede un sito geografico con due bacini a quote diverse collegabili: non tutti i territori hanno questa conformazione","Perché è protetto da brevetti internazionali che ne limitano l'uso ai soli paesi membri dell'IEA","Perché l'acqua usata non può essere restituita all'ambiente dopo il pompaggio","Perché consuma più acqua di quanta ne restituisce, rendendo insostenibile l'uso in zone aride"],0,"L'idroelettrico di pompaggio richiede una conformazione geografica specifica: due bacini a quote diverse (uno alto, uno basso) abbastanza vicini da poter essere collegati con condotte forzate. Non si può costruire in zone pianeggianti o dove manca l'acqua. Per questo è efficace in paesi montagnosi (Alpi, Scandinavia, Svizzera) ma non ovunque.",["Esatto! L'idroelettrico di pompaggio richiede due bacini a quote diverse (uno in alto, uno in basso) abbastanza vicini da poter essere collegati con condotte. Non tutti i territori hanno questa configurazione geografica, limitando l'applicabilità globale.","Non corretto. L'idroelettrico di pompaggio non è brevettato. Il limite è geografico: serve una conformazione territoriale con due bacini a quote diverse.","Non corretto. L'acqua viene pompata da un bacino inferiore a uno superiore e poi rilasciata di nuovo: è un ciclo chiuso. Non c'è perdita d'acqua nel processo.","Non corretto. Il pompaggio è un ciclo: la stessa acqua viene pompata su e rilasciata giù. Non 'consuma' acqua. Il limite è la conformazione geografica del territorio."]]],"A":[["Il caso Samsø ha dimostrato che la transizione energetica è tecnicamente possibile 'senza tecnologie fantascientifiche'. Tuttavia il testo nota che 'scala è importante'. Quale problema specifico emerge quando si scala da 4.000 a 60 milioni di persone?",["La complessità della governance, del bilanciamento della rete, delle interconnessioni regionali e della gestione dell'intermittenza aumenta in modo non-lineare con la scala","La tecnologia fotovoltaica diventa meno efficiente quando viene installata su scala nazionale","I materiali per costruire turbine eoliche e pannelli solari si esauriscono rapidamente con la scala","I costi di produzione dell'energia rinnovabile aumentano linearmente con il numero di abitanti"],0,"La transizione di Samsø (4.000 abitanti, un'isola) era possibile con coordinamento comunitario diretto e rete semplice. A scala nazionale (60 milioni, territorio complesso) emergono: bilanciamento in tempo reale della rete con milioni di produttori distribuiti, interconnessioni internazionali, mercati elettrici sofisticati, smart grid con centinaia di milioni di sensori, e governance di sistemi complessi. La tecnologia è la stessa; la complessità sistemica non è lineare.",["Esatto! In un'isola da 4.000 persone, la comunità può coordinarsi direttamente e l'energia fluisce su breve distanza. Con 60 milioni di persone distribuite su un continente, occorrono: reti di trasmissione nazionali, mercati elettrici in tempo reale, interconnessioni con altri paesi, sistemi di accumulo distribuiti, smart grid con milioni di nodi.","Non corretto. Le celle fotovoltaiche non diventano meno efficienti su scala nazionale. Il problema di scala riguarda la governance e la gestione della rete, non l'efficienza tecnologica.","Non corretto. Il silicio (solare) e l'acciaio/fibra di vetro (eolico) sono abbondanti. Il collo di bottiglia non sono i materiali ma la complessità di gestione del sistema energetico su scala continentale.","Non corretto. I costi tendono a diminuire con la scala (economie di scala). Il problema è la complessità di gestione del sistema, non l'aumento proporzionale dei costi."]],["Il testo spiega che il ciclo dell'idrogeno verde (elettrolisi → stoccaggio → fuel cell) ha un'efficienza complessiva del 30-40%, contro l'85-90% delle batterie. Eppure l'idrogeno è considerato complementare, non alternativo, alle batterie. Perché?",["Perché l'idrogeno può essere stoccato in grandi quantità e per lunghi periodi (stagionale), mentre le batterie sono economiche solo per accumulo di breve durata (giornaliero o settimanale)","Perché l'idrogeno è già molto più economico delle batterie e le sostituirà completamente nei prossimi anni","Perché l'idrogeno è più sicuro delle batterie al litio in caso di incendio o esplosione","Perché l'idrogeno non richiede litio, evitando la dipendenza da paesi produttori instabili"],0,"Batterie e idrogeno coprono scale temporali diverse: batterie per accumulo giornaliero/settimanale (ore-giorni, alta efficienza 85-90%, costi bassi per capacità moderata), idrogeno per accumulo stagionale (mesi, bassa efficienza 30-40% ma costo di stoccaggio basso per grandi volumi). Un sistema energetico 100% rinnovabile ha bisogno di entrambi: le batterie non sono economiche in GWh, l'idrogeno non è efficiente per lo stoccaggio di breve durata.",["Esatto! Le batterie sono ottime per accumulo giornaliero o settimanale (casa, auto) ma costano molto per grandi capacità (GWh). L'idrogeno può essere stoccato in quantità enormi (gasdotti, caverne saline) per mesi, coprendo il fabbisogno stagionale che le batterie non possono economicamente coprire.","Non corretto. L'idrogeno verde è attualmente 4-5 volte più costoso dell'idrogeno da gas naturale, e il ciclo ha efficienza del 30-40%. Non è destinato a sostituire completamente le batterie ma a complementarle per certi usi.","Non corretto. L'idrogeno è infiammabile e ha specifici rischi di sicurezza. La ragione della complementarità è funzionale: accumulo stagionale vs. giornaliero.","Non corretto. Sebbene la dipendenza dal litio sia una questione reale, la ragione della complementarità è funzionale: idrogeno per accumulo stagionale (mesi), batterie per accumulo giornaliero (ore-giorni)."]],["Il testo descrive l'ingegnere della transizione energetica come una 'figura in espansione' perché il piano PNIEC richiede di triplicare la capacità fotovoltaica italiana entro il 2030. Quale competenza metodologica è più critica per raggiungere questo obiettivo?",["La capacità di ottenere autorizzazioni, gestire l'opposizione locale (NIMBYsmo) e integrare gli impianti nelle reti di distribuzione — non solo la competenza tecnica di progettare impianti","La capacità di inventare nuovi tipi di celle fotovoltaiche più efficienti di quelle attuali","La capacità di costruire fisicamente gli impianti fotovoltaici più velocemente dei concorrenti stranieri","La capacità di produrre pannelli fotovoltaici in Italia per ridurre la dipendenza dalla Cina"],0,"Il piano PNIEC richiede di installare oltre 70 GW fotovoltaici aggiuntivi entro il 2030 (triplicando i 22 GW del 2023). La tecnologia esiste e costa poco. Il collo di bottiglia reale è burocratico e sociale: iter autorizzativi lunghi (spesso 5-7 anni per grandi impianti), opposizione locale (NIMBYsmo), e la necessità di integrare migliaia di impianti distribuiti nelle reti di distribuzione esistenti.",["Esatto! Triplicare il fotovoltaico in 7 anni non è un problema solo tecnico: la tecnologia esiste. Il collo di bottiglia è burocratico e sociale: ottenere autorizzazioni (iter lunghi), gestire l'opposizione locale, e integrare migliaia di impianti nella rete di distribuzione esistente.","Non corretto. L'obiettivo di triplicare la capacità usa tecnologie già commerciali, non invenzioni future. Il collo di bottiglia è autorizzativo, logistico e di integrazione nella rete.","Non corretto. Il collo di bottiglia non è la velocità di costruzione fisica. Le principali sfide sono le autorizzazioni, l'integrazione nella rete e la gestione del consenso locale.","Non corretto. Sebbene la dipendenza dalla Cina per i pannelli sia una questione di politica industriale, il piano PNIEC riguarda l'installazione, non la produzione. Il collo di bottiglia è autorizzativo e di rete."]],["Il testo descrive il 'fattore di carico' dell'eolico offshore come 35-45% contro il 20-25% onshore. Considerando anche i costi, perché l'offshore è preferibile per certi obiettivi e l'onshore per altri?",["Offshore: produce più e in modo più costante (meno intermittente) ma è molto più costoso e complesso; onshore: più economico e rapido da installare ma produzione più variabile e impatto paesaggistico","Offshore è preferibile in tutti i casi perché il vento in mare è sempre più forte e costante del vento a terra","Onshore è sempre preferibile perché i costi di manutenzione offshore sono proibitivi a lungo termine","La differenza di fattore di carico tra offshore e onshore è trascurabile perché entrambi sono intermittenti"],0,"Tradeoff offshore vs. onshore: Offshore: fattore di carico 35-45% (più costante, meno accumulo necessario), nessun impatto visivo sulle popolazioni, turbine più grandi. Ma costi di installazione e manutenzione 3-5 volte maggiori, tempi di costruzione più lunghi. Onshore: fattore di carico 20-25%, più economico e rapido, ma più intermittente, necessita di più territorio e causa maggiore opposizione locale. La scelta dipende dagli obiettivi specifici.",["Esatto! Offshore ha fattore di carico 35-45% (molto più costante, quindi più facile da integrare nella rete) ma costi elevatissimi di installazione e manutenzione in mare. Onshore è 5-10 volte più economico ma più intermittente e causa più opposizione locale per impatto visivo.","Non corretto. Non è vero che l'offshore è preferibile 'in tutti i casi'. Per obiettivi di costo minimo con materia prima disponibile, l'onshore rimane competitivo. La scelta dipende dal bilanciamento costo/fattore di carico/contesto geografico.","Non corretto. I costi offshore sono alti ma non necessariamente proibitivi. Il confronto non è sempre a favore dell'onshore: dipende dalle disponibilità del territorio, dalla distanza dalla costa e dagli obiettivi specifici.","Non corretto. La differenza tra 20-25% (onshore) e 35-45% (offshore) è significativa: il fattore di carico più alto dell'offshore significa produzione più costante e prevedibile, con meno necessità di backup."]],["Il testo presenta le biomasse come 'neutre dal punto di vista climatico' se la foresta viene rigenerata alla stessa velocità con cui viene tagliata. Quale condizione pratica deve essere verificata perché questa neutralità sia reale?",["Il ciclo di rigenerazione deve avvenire nella stessa regione e sullo stesso arco temporale dell'emissione, altrimenti si emette CO₂ ora e si riassorbe in decenni o altrove","Le biomasse sono neutrali per il clima solo se vengono bruciate con sistemi di cattura del CO₂","Le biomasse sono neutrali per il clima solo se vengono coltivate in serre con CO₂ controllata","Le biomasse sono sempre neutrali per il clima perché il carbonio che emettono era già nell'atmosfera prima"],0,"La neutralità climatica delle biomasse è condizionale alla chiusura locale e temporale del ciclo del carbonio: la CO₂ emessa bruciando biomassa deve essere riassorbita dalla rigenerazione della stessa biomassa nello stesso arco temporale. Bruciare foreste primarie che impiegano secoli a rigenerarsi non è neutrale. Le biomasse sostenibili sono residui organici locali, non coltivazioni dedicate che sottraggono terreni agricoli.",["Esatto! La neutralità climatica delle biomasse è condizionale: se si taglia una foresta a crescita lenta in Amazzonia e si brucia in Europa, l'emissione è immediata (oggi) ma il riassorbimento richiede decenni o secoli. La neutralità vale solo se la rigenerazione è locale e tempestivamente comparabile all'emissione.","Non corretto. Il concetto di neutralità delle biomasse non richiede cattura del CO₂: si basa sulla chiusura del ciclo del carbonio. La condizione è che la rigenerazione della biomassa assorbano la stessa CO₂ emessa nella combustione.","Non corretto. Le biomasse non richiedono serre. La neutralità dipende dalla chiusura del ciclo del carbonio: la rigenerazione della vegetazione deve riassorbire la CO₂ emessa nella combustione.","Non corretto. Non è vero che è sempre neutrale. Se si brucia foresta primaria (che ha accumulato carbonio per secoli), si emette CO₂ che richiede secoli per essere riassorbita: è un impatto climatico reale."]],["Il testo cita il calo del 90% del costo solare tra il 2010 e il 2023. Se questa tendenza (curva di apprendimento) continua, quali implicazioni sistemiche ha per le decisioni di investimento nel settore energetico?",["Gli investimenti in impianti fossili rischiano di diventare 'stranded assets' (attivi bloccati) prima del termine della loro vita utile, perché le rinnovabili continuano a diventare più competitive","Le aziende del solare diventeranno monopolisti globali e potranno aumentare i prezzi a piacimento","I governi non dovranno più investire in infrastrutture di rete perché i pannelli solari individuale sostituiscono la rete","Le rinnovabili raggiungeranno costo zero tra il 2030 e il 2035, risolvendo automaticamente il problema energetico globale"],0,"La curva di apprendimento del solare (costo dimezzato ogni raddoppio della capacità installata) ha implicazioni per le decisioni di investimento: una centrale fossile costruita oggi con vita utile di 30-40 anni rischia di diventare non competitiva economicamente in 10-15 anni, prima di aver ripagato l'investimento. Questi 'stranded assets' sono un rischio finanziario reale per utilities e investitori che puntano ancora sui fossili.",["Esatto! Una centrale a carbone costruita oggi ha vita utile di 30-40 anni. Se il solare continua a calare di prezzo, quella centrale potrebbe diventare economicamente non competitiva dopo 10-15 anni (prima del rimborso dell'investimento): uno 'stranded asset'. Questo rende rischiosi gli investimenti in fossili.","Non corretto. La curva di apprendimento non porta necessariamente al monopolio. La produzione di pannelli è distribuita globalmente (principalmente in Cina, con capacità crescente in altri paesi). Il calo di costi beneficia i consumatori.","Non corretto. L'automazione individuale con pannelli solari non elimina la necessità di reti: gli edifici senza sole di notte, in inverno, nelle giornate nuvolose hanno ancora bisogno della rete. L'investimento in smart grid è anzi più necessario con alta penetrazione solare.","Non corretto. I costi scendono ma non raggiungono zero (ci sono costi di materiali, installazione, manutenzione). E anche con costi di produzione minimi, i costi di integrazione nella rete rimangono significativi."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
