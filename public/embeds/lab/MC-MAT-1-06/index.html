<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Fibre, plastiche e compositi</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>

<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;

    }

})();

<script>
window.LABVERIFICA={"id":"MC-MAT-1-06","F":[["Quale fibra naturale ha il più basso impatto ambientale tra le principali fibre tessili, richiedendo quasi nessun pesticida e nessuna irrigazione aggiuntiva?",["Il lino","Il cotone","La lana","Il poliestere"],0,"Il lino (Linum usitatissimum) ha il più basso impatto ambientale: richiede zero irrigazione aggiuntiva (piogge europee sufficienti), quasi nessun pesticida, e l'intera pianta viene usata (semi → olio, stelo → fibra tessile, residui → mangime). Produce una fibra forte, fresca, antibatterica e completamente biodegradabile.",["Esatto! Il lino richiede pochissima acqua (la pioggia naturale in Europa è sufficiente), quasi nessun pesticida (la pianta è naturalmente resistente), e l'intera pianta viene utilizzata (semi, stelo, residui). È la fibra naturale con il minore impatto ambientale.","Non corretto. Il cotone è la coltura più idrovora al mondo (8.000-10.000 litri/kg) e consuma il 16% degli insetticidi mondiali pur occupando solo il 2,5% della superficie agricola.","Non corretto. La lana richiede l'allevamento ovino con emissioni di metano e uso del suolo significativi. Il lino ha un impatto ambientale complessivo più basso.","Non corretto. Il poliestere è una fibra sintetica derivata dal petrolio. Non biodegradabile, produce microplastiche nelle lavatrici. Impatto ambientale molto più alto del lino."]],["Quante microfibre sintetiche può rilasciare un carico di lavatrice di tessuti sintetici in un singolo lavaggio?",["100.000-700.000 microfibre","100-500 microfibre","Circa 10 microfibre","Nessuna microfibra: le fibre sintetiche sono troppo resistenti per rompersi in lavatrice"],0,"Ogni lavaggio di tessuti sintetici rilascia 100.000-700.000 microfibre sintetiche. I depuratori ne trattengono il 72-99% ma non il 100%: le microfibre che sfuggono finiscono nei fiumi, nei mari, nell'intestino dei pesci, poi nel nostro piatto. Le microfibre tessili sintetiche rappresentano il 35% di tutte le microplastiche primarie rilasciate nell'oceano.",["Esatto! Un singolo lavaggio a pieno carico di tessuti sintetici (poliestere, nylon, acrilico) rilascia tra 100.000 e 700.000 microfibre. Queste microplastiche passano parzialmente attraverso i depuratori e raggiungono i fiumi, i mari e la catena alimentare.","Non corretto. Il numero reale è enormemente maggiore: tra 100.000 e 700.000 microfibre per lavaggio. Non alcune centinaia ma centinaia di migliaia.","Non corretto. Il numero di microfibre rilasciate è nell'ordine delle centinaia di migliaia (100.000-700.000) per lavaggio, non 10.","Non corretto. Il movimento meccanico della lavatrice rompe microscopiche fibre dai tessuti sintetici. Ogni lavaggio rilascia centinaia di migliaia di microfibre."]],["Il cemento armato combina cemento e acciaio. Quale proprietà meccanica ha ciascun materiale che rende efficace questa combinazione?",["Cemento: forte in compressione ma fragile in trazione; acciaio: forte in trazione. Insieme resistono a entrambi i tipi di forza","Cemento: forte in trazione; acciaio: forte in compressione. Si complementano perfettamente","Cemento: leggero; acciaio: pesante. Il composito bilancia il peso in modo ottimale","Cemento: economico; acciaio: resistente. Il composito riduce i costi usando meno acciaio"],0,"Il cemento armato è il composito più usato al mondo: il cemento regge bene la compressione (pilone che sostiene il peso) ma è fragile in trazione (si spezza se piegato). L'acciaio è eccellente in trazione. Le barre di acciaio vengono inserite nelle zone dove si prevede la trazione: il composito cemento+acciaio regge sia compressione che trazione.",["Esatto! Il cemento regge enormi carichi verticali (compressione) ma si spezza se piegato o tirato (trazione). L'acciaio è eccellente in trazione. Le barre di acciaio vengono inserite nelle zone dove si prevede la trazione: il composito resiste a entrambi.","Non corretto. È l'inverso: il cemento è forte in COMPRESSIONE, l'acciaio in TRAZIONE. Il cemento armato sfrutta precisamente questa complementarità.","Non corretto. Il bilanciamento del peso non è la ragione principale del cemento armato. La ragione è la complementarità delle proprietà meccaniche: cemento forte in compressione, acciaio forte in trazione.","Non corretto. La riduzione del costo non è la logica principale del cemento armato. La logica è meccanica: cemento per la compressione, acciaio per la trazione."]],["Qual è il codice numerico della plastica PET (polietilene tereftalato) usata per le bottiglie d'acqua?",["♳ 1","♴ 2 (HDPE)","♸ 6 (PS)","♷ 5 (PP)"],0,"Il sistema di codifica delle plastiche (1-7) con il simbolo del triangolo con frecce: ♳1 PET (bottiglie acqua), ♴2 HDPE (flaconi shampoo), ♵3 PVC (tubi), ♶4 LDPE (sacchetti), ♷5 PP (tappi), ♸6 PS (bicchieri usa-e-getta), ♹7 ALTRI. Il PET (codice 1) è tra le plastiche più riciclate in Italia.",["Esatto! Il PET ha il codice ♳ 1. È la plastica più riciclata per gli imballaggi: bottiglie d'acqua, succhi, contenitori alimentari. Viene riciclato in fibre polar fleece o nuove bottiglie.","Non corretto. Il codice ♴ 2 è il polietilene alta densità (HDPE), usato per flaconi di shampoo, taniche, sacchetti resistenti.","Non corretto. Il codice ♸ 6 è il polistirolo (PS), usato per bicchieri, vassoi, imballaggi espansi. Quasi mai riciclato.","Non corretto. Il codice ♷ 5 è il polipropilene (PP), usato per contenitori cibo, tappi, parti auto. Il PET è il codice ♳ 1."]],["La fibra di carbonio è un composito formato da due componenti. Quali?",["Fibre di carbonio (filamenti sottilissimi) e resina epossidica (matrice che le incolla insieme)","Fibra di vetro e resina polimerica (uguale alla vetroresina)","Grafite compressa e binder acrilico","Alluminio e nanoparticelle di carbonio"],0,"CFRP (Carbon Fiber Reinforced Polymer): 1) Fibre di carbonio: filamenti di 5-10 micrometri di diametro (10-20 volte più sottili di un capello), 95-99% carbonio puro in struttura grafitica orientata. 2) Resina epossidica (termoindurente): incolla e distribuisce il carico tra le fibre. La combinazione produce la più alta resistenza specifica tra tutti i materiali strutturali.",["Esatto! La fibra di carbonio (CFRP) è un composito a due componenti: 1) fibre di carbonio quasi puro (95-99% C), filamenti sottilissimi da 5-10 micrometri; 2) resina termoindurente (tipicamente epossidica) che tiene insieme le fibre e distribuisce il carico tra esse.","Non corretto. La fibra di vetro + resina è la vetroresina (GFRP). La fibra di carbonio usa fibre di carbonio (non vetro) e tipicamente resina epossidica.","Non corretto. La fibra di carbonio non è grafite compressa. È un composito di filamenti sottilissimi di carbonio quasi puro (~5-10 micrometri) impregnati in resina termoindurente.","Non corretto. La fibra di carbonio non contiene alluminio. È un composito di fibre di carbonio quasi puro e resina epossidica (matrice polimerica)."]],["Cosa si intende per 'greenwashing'?",["La pratica di descrivere un prodotto come 'verde' o 'sostenibile' per scopi di marketing senza che le caratteristiche ambientali siano realmente sostanziali","La pratica di colorare di verde i prodotti per renderli più attraenti ai consumatori","La pratica di lavare i vestiti verdi in modo da non sbiadirli","La pratica di produrre energia dall'erba verde e dalle piante in modo sostenibile"],0,"Il greenwashing: usare termini come 'bio', 'eco', 'compostabile', 'plastic-free', 'sostenibile' su prodotti senza che queste caratteristiche siano sostanziali o verificabili. Per valutare una claim ambientale: è specifica? È misurabile? È verificata da un ente terzo certificatore? In assenza di risposta affermativa a queste domande, è possibile greenwashing.",["Esatto! Il greenwashing è l'uso di claim ambientali ('bio', 'eco', 'sostenibile', 'compostabile') a fini di marketing quando le caratteristiche ambientali non sono verificabili, sostanziali o significativamente diverse dai prodotti convenzionali.","Non corretto. Il greenwashing non riguarda il colore fisico dei prodotti. È l'uso di claim ambientali non verificabili o esagerati per fini di marketing.","Non corretto. Il greenwashing è un termine di marketing, non un processo di lavanderia. Indica l'uso non veritiero di claim ambientali.","Non corretto. Il greenwashing non riguarda la produzione di energia. Indica l'uso di affermazioni ambientali non verificabili per fini di marketing."]]],"I":[["Il cotone richiede 8.000-10.000 litri d'acqua per kg. Il testo dice che la stessa t-shirt tenuta per 10 anni ha un'impronta idrica di 1.000 litri/anno, mentre tenuta per 2 anni 5.000 litri/anno. Quale messaggio comunicano questi dati sulla sostenibilità del cotone?",["La durata di vita del capo è la variabile più importante: usare a lungo qualsiasi prodotto (anche ad alta impronta ambientale per la produzione) ne distribuisce il costo ambientale nel tempo","Usare il cotone per pochi anni è sempre preferibile al poliestere perché il cotone è biodegradabile","Il cotone non dovrebbe mai essere usato perché il suo consumo d'acqua è sempre troppo elevato","L'acqua usata per produrre un capo di cotone non ha importanza perché ritorna all'ambiente come vapore acqueo"],0,"Il dato 1.000 litri/anno (t-shirt usata 10 anni) vs 5.000 litri/anno (2 anni) rivela un principio importante: l'impatto ambientale per anno d'uso si riduce drasticamente allungando la vita del prodotto. Riparare, usare a lungo, comprare di seconda mano, vendere invece di buttare: queste azioni riducono l'impatto più del tipo di fibra scelto.",["Esatto! L'impronta ambientale non dipende solo dalla produzione ma dall'uso: 10 anni vs 2 anni divide per 5 il costo ambientale annuo. Comprare meno ma più durevole, usare a lungo, riparare invece di buttare — queste azioni riducono l'impatto più del tipo di fibra scelta.","Non corretto. Il calcolo dell'impronta temporale mostra che usare il cotone per soli 2 anni (5.000 litri/anno) è molto peggio che usarlo per 10 anni (1.000 litri/anno). La breve durata non è compensata dalla biodegradabilità.","Non corretto. Il testo non sostiene l'eliminazione del cotone ma una valutazione contestuale. Con una lunga vita utile (10 anni), l'impronta idrica annua del cotone diventa molto più accettabile.","Non corretto. L'acqua usata per irrigare il cotone in zone aride (come il Kazakhstan, causa del prosciugamento del Mar d'Aral) non 'ritorna all'ambiente' come vapore localmente: si evapora, si trasporta altrove, impoverendo le falde locali."]],["Il PLA (acido polilattico) viene spesso presentato come una bioplastica biodegradabile. Il testo evidenzia una condizione fondamentale che rende questa affermazione fuorviante. Quale?",["Il PLA si biodegrada solo in impianti di compostaggio industriale a 58°C con umidità controllata: in una compostiera domestica a 25°C o in discarica normale, impiega decenni o secoli come qualsiasi altra plastica","Il PLA non è mai biodegradabile: è solo una plastica colorata di verde per sembrare eco-friendly","Il PLA viene prodotto dal mais, quindi compete con la produzione alimentare e non è sostenibile","Il PLA contiene additivi plastificanti che impediscono la biodegradazione in qualsiasi condizione"],0,"Il PLA è biodegradabile CONDIZIONALMENTE: richiede impianti di compostaggio industriale a ≥58°C, umidità controllata, microorganismi specifici. In casa (compostiera a 25°C), in mare, in discarica normale: decenni o secoli. Poiché la maggior parte dei consumatori non ha accesso agli impianti industriali, il PLA nel flusso reale di rifiuti si comporta come plastica convenzionale.",["Esatto! Il PLA è biodegradabile SOLO in condizioni di compostaggio industriale specifiche (≥58°C, umidità controllata, microorganismi specifici). In compostiera domestica a 25°C: decine di anni. In mare: decenni o secoli. La maggior parte dei consumatori non ha accesso a impianti industriali, quindi il PLA si comporta come plastica convenzionale.","Non corretto. Il PLA È biodegradabile, ma SOLO in condizioni specifiche di compostaggio industriale (≥58°C). Il problema non è che non si biodegradi mai, ma che le condizioni necessarie sono rare nella pratica.","Non corretto (rilevante ma non è il punto principale del testo). La questione della competizione con la produzione alimentare esiste, ma il testo evidenzia principalmente il problema della biodegradabilità condizionale.","Non corretto. Il PLA senza plastificanti è tecnicamente biodegradabile in condizioni industriali specifiche. Il problema non sono gli additivi ma le condizioni necessarie per la biodegradazione (58°C industriali)."]],["Il testo descrive una giacca tecnica da montagna con membrana PTFE espanso (Gore-Tex). Quale proprietà fisica paradossale ha questa membrana?",["È impermeabile all'acqua liquida ma traspirante al vapore acqueo: i micropori sono troppo piccoli per le gocce d'acqua (liquida) ma abbastanza grandi per le molecole di vapore acqueo (gas)","È impermeabile all'acqua calda ma lascia passare l'acqua fredda: protegge dalla pioggia ma non dalla neve","È impermeabile a 30°C ma diventa permeabile a temperature inferiori a 0°C per una proprietà termica del PTFE","È traspirante solo dall'esterno verso l'interno: lascia entrare l'aria fresca ma non lascia uscire il calore corporeo"],0,"Il PTFE espanso ha miliardi di micropori per cm². Dimensioni critiche: goccia d'acqua liquida ≈ 100 micrometri → troppo grande per passare. Molecola di vapore acqueo (H₂O gas) ≈ 0,0004 micrometri → passa facilmente. Risultato: impermeabile all'acqua della pioggia, traspirante per il sudore corporeo. È il principio di funzionamento delle membrane Gore-Tex e simili.",["Esatto! Il PTFE espanso ha miliardi di micropori per cm². Le gocce d'acqua liquida (diametro ~100 micrometri) sono troppo grandi per passare. Le molecole di vapore acqueo (diametro ~0,0004 micrometri) passano facilmente. Risultato: l'acqua non entra, il sudore esce.","Non corretto. Il PTFE espanso non distingue tra acqua calda e fredda. La distinzione è tra acqua in fase LIQUIDA (non passa) e acqua in fase GASSOSA/vapore (passa).","Non corretto. Il PTFE espanso mantiene le sue proprietà impermeabili e traspiranti in un ampio intervallo di temperature. La proprietà non dipende dalla temperatura ma dalla differenza di dimensioni tra gocce d'acqua e molecole di vapore.","Non corretto. Il PTFE espanso lascia passare il vapore acqueo (sudore) dall'interno all'esterno ma non l'acqua liquida dall'esterno all'interno. Non è una membrana direzionale per il calore."]],["Il testo presenta un confronto tra giacca in lana merino e giacca tecnica sintetica. Per un trekking intenso in pioggia, quale è superiore e perché?",["La giacca tecnica sintetica è superiore perché è impermeabile con la membrana, pesa meno (280-450g vs 600-900g) e asciuga più velocemente","La lana merino è superiore perché è biodegradabile e più sostenibile della sintetica","Sono equivalenti: la lana merino e le giacche tecniche proteggono allo stesso modo dalla pioggia","Non è possibile confrontarle: dipende dall'intensità della pioggia e dalla temperatura"],0,"Confronto per trekking intenso in pioggia: Giacca tecnica sintetica = impermeabile (membrana PTFE), più leggera (280-450g), asciuga rapidamente. Lana merino = resistente all'acqua ma non impermeabile, più pesante (600-900g), asciuga lentamente. La giacca tecnica è superiore per questa specifica condizione. Per uso quotidiano in clima temperato con lunga durata, la lana merino può avere impatto ambientale globale minore.",["Esatto! Per trekking intenso in pioggia: la giacca tecnica ha membrana impermeabile (la lana è solo idrorepellente), pesa meno della metà, e asciuga rapidamente (sintetico). La lana è superiore per confort quotidiano in clima temperato e per la biodegradabilità, ma non per trekking in pioggia intensa.","Non corretto. La biodegradabilità è un vantaggio ambientale, non di prestazione in pioggia intensa. Per trekking in pioggia, la giacca tecnica con membrana impermeabile è superiore nelle prestazioni.","Non corretto. La lana è 'resistente all'acqua' ma non impermeabile: si inzuppa in pioggia intensa. Le giacche tecniche con membrana PTFE sono impermeabili. Non sono equivalenti in condizioni di pioggia intensa.","Non corretto (parzialmente vero). Il testo fa esplicitamente il confronto e conclude che per trekking intenso in pioggia la sintetica è superiore, mentre per uso quotidiano in clima temperato la lana merino può avere un impatto ambientale globale più basso."]],["La fibra di carbonio non può essere riciclata facilmente perché la resina epossidica è 'termoindurente'. Cosa significa questa caratteristica e perché impedisce il riciclo?",["Una resina termoindurente forma legami chimici irreversibili durante l'indurimento: non si può sciogliere di nuovo con il calore, impedendo la separazione delle fibre dalla matrice per rifusione","Una resina termoindurente diventa più dura con il freddo, quindi il riciclo funziona solo a temperature elevate","Una resina termoindurente è tossica quando riscaldata, quindi il riciclo sarebbe pericoloso per i lavoratori","Una resina termoindurente si scioglie solo a temperature superiori a 3.000°C, incompatibili con qualsiasi processo industriale"],0,"Plastiche termoindurenti (epossidi, poliuretani, fenolici): durante la polimerizzazione formano una struttura tridimensionale reticolata con legami covalenti irreversibili. Non si possono rifondere: non c'è una 'temperatura di fusione'. Per recuperare le fibre si usa la pirolisi (brucia la resina in assenza di ossigeno) ma le fibre perdono proprietà meccaniche. Quasi tutti i rifiuti di fibra di carbonio finiscono in discarica.",["Esatto! Le plastiche si dividono in termoplastiche (si fondono di nuovo se riscaldate) e termoindurenti (reazione chimica irreversibile durante la polimerizzazione). La resina epossidica termoindurente non si può rifondere: le fibre di carbonio possono essere recuperate solo per pirolisi (bruciare la resina), con perdita di proprietà meccaniche.","Non corretto. La caratteristica 'termoindurente' riguarda la irreversibilità della polimerizzazione, non il comportamento con il freddo. La resina non si può rifondere con il calore (come invece farebbe una termoplastica).","Non corretto. La tossicità non è la ragione dell'impossibilità di riciclo. La ragione è chimica: la resina termoindurente ha una struttura reticolata irreversibile che non si può sciogliere per rifusione.","Non corretto. Il PTFE espanso (e altre plastiche termoindurenti) si decompongono/carbonizzano a temperature molto inferiori a 3.000°C. Il problema non è la temperatura ma l'irreversibilità della struttura polimerica reticolata."]],["Il testo descrive il cemento armato come con un 'problema': l'umidità porta ossigeno alle barre di acciaio interno che arrugginiscono, espandendosi e spacando il cemento. Quale soluzione menziona il testo per questo problema?",["Usare barre in fibra di vetro (GFRP) invece di acciaio: più leggere, non arrugginiscono, ma più costose e meno duttili","Aggiungere pigmenti resistenti all'acqua nel mix di calcestruzzo per impermeabilizzarlo completamente","Sostituire il cemento armato con plastica rinforzata in tutte le nuove costruzioni","Rimuovere completamente l'armatura metallica e usare cemento pre-tensionato per resistere alla trazione"],0,"Problema del cemento armato: l'umidità porta ossigeno e sali alle barre di acciaio → ruggine → espansione → fratture nel cemento (visibili nei ponti e viadotti vecchi). Soluzioni menzionate nel testo: 1) acciaio inossidabile nelle strutture critiche; 2) acciaio con rivestimento epossidico; 3) barre in fibra di vetro (GFRP) — più leggere, non arrugginiscono, ma più costose e meno duttili.",["Esatto! Le barre in fibra di vetro (GFRP - Glass Fiber Reinforced Polymer) non arrugginiscono eliminando il problema della corrosione dell'armatura. Sono più leggere dell'acciaio ma meno duttili e più costose.","Non corretto. L'impermeabilizzazione totale del calcestruzzo è difficile su scala strutturale. Il testo menziona specificamente l'acciaio inossidabile, la protezione epossidica e le barre in GFRP come soluzioni al problema della corrosione dell'armatura.","Non corretto. Il testo non suggerisce di eliminare il cemento armato. Le soluzioni menzionate riguardano l'armatura interna (acciaio inossidabile, epossidico, GFRP), non la sostituzione totale del composito.","Non corretto (il pre-tensionato esiste ma non elimina il problema). Il testo menziona acciaio inossidabile, rivestimento epossidico, e barre GFRP come soluzioni al problema della corrosione dell'armatura interna."]]],"A":[["Il testo distingue tra 'plastiche bio-based non biodegradabili' (es. bio-PET) e 'plastiche biodegradabili' (es. PLA). Quale errore comune commettono molti consumatori nel valutare queste categorie?",["Confondere l'origine (bio-based = da piante) con il destino (biodegradabile = si decompone): un bio-PET da mais non si biodegrada ma si ricicla come PET normale; un PLA si biodegrada solo in condizioni industriali, non in natura","Pensare che tutte le bioplastiche costino meno delle plastiche convenzionali per ragioni di produzione agricola","Credere che le bioplastiche siano sempre più resistenti delle plastiche convenzionali perché derivano da materie prime naturali","Pensare che le bioplastiche non possano essere riciclate perché sono organiche"],0,"Due attributi distinti da non confondere: 1) ORIGINE (da dove viene la materia prima): bio-based = da piante/organismi biologici; petro-based = dal petrolio. 2) DESTINO A FINE VITA: biodegradabile = si decompone (in certe condizioni); non biodegradabile = persiste. Un bio-PET è bio-based ma NON biodegradabile (stessa struttura chimica del PET da petrolio). Un PLA è bio-based E biodegradabile (ma SOLO in impianti industriali a 58°C).",["Esatto! L'errore è confondere due attributi distinti: ORIGINE (da dove viene la materia prima: petrolio vs piante) e DESTINO (cosa succede a fine vita: si biodegrada, si ricicla, va in discarica). Bio-based non implica biodegradabile; biodegradabile non implica bio-based.","Non corretto. L'errore del consumatore non riguarda il prezzo ma la confusione tra origine (bio-based) e destino a fine vita (biodegradabile). Le bioplastiche spesso costano di più delle convenzionali.","Non corretto. Le bioplastiche non sono generalmente più resistenti delle convenzionali. L'errore è la confusione tra bio-based (origine) e biodegradabile (destino a fine vita).","Non corretto. Alcune bioplastiche (come bio-PET) si riciclano normalmente con il PET convenzionale. L'errore principale è confondere bio-based con biodegradabile, non il riciclo."]],["Il testo afferma che la giacca tecnica sintetica 'è uno dei prodotti tessili più funzionali mai creati' ma allo stesso tempo 'a fine vita è quasi impossibile da riciclare'. Come si valuta questo trade-off nell'ottica del ciclo di vita?",["Occorre includere tutte le fasi nel calcolo: produzione (petrolio, energia), uso (funzionalità elevata per anni), e fine vita (non riciclabile) — la scelta dipende da quanti anni dura e da quale alternativa si confronta","La giacca tecnica sintetica è sempre preferibile alla lana perché la sua funzionalità superiore compensa qualsiasi problema ambientale","La giacca tecnica sintetica non dovrebbe mai essere acquistata perché il problema del fine vita supera qualsiasi vantaggio prestazionale","Il problema del fine vita non è rilevante finché le aziende come Gore-Tex non lanciano una linea di riciclo"],0,"La valutazione del ciclo di vita (LCA) di una giacca tecnica include: 1) PRODUZIONE: petrolio come materia prima, energia per la laminazione, PFAS per il trattamento DWR. 2) USO: funzionalità eccellente (impermeabilità, leggerezza, durata anni). 3) FINE VITA: strati laminati non separabili → quasi impossibile da riciclare. Qual è il 'meglio'? Dipende dalla durata d'uso, dall'alternativa disponibile, e dall'uso specifico.",["Esatto! L'analisi del ciclo di vita (LCA) include tutte le fasi: produzione (impatto delle materie prime e dei processi), fase d'uso (durata, prestazioni, manutenzione), fine vita (riciclabilità, smaltimento). Una giacca tecnica che dura 15 anni e protegge efficacemente dal freddo e dalla pioggia ha un impatto diverso da una che dura 3 anni e viene sostituita frequentemente.","Non corretto. Il trade-off non ha una risposta universale. Dipende dall'uso specifico, dalla durata, dall'alternativa considerata. Una valutazione onesta include tutte le fasi del ciclo di vita, non solo le prestazioni d'uso.","Non corretto. Il testo non sostiene questo. Il trade-off è contestuale e la scelta dipende dall'uso, dalla durata, dall'alternativa disponibile. Per alpinismo in pioggia intensa, la giacca tecnica può essere la scelta con minor impatto se dura a lungo.","Non corretto. Il problema del fine vita è rilevante ora, non solo nel futuro. Alcune aziende (Patagonia, Arc'teryx) già affrontano il problema con programmi di riparazione e materiali mono-componente."]],["Il testo descrive il cotone come 'biodegradabile in condizioni naturali' ma il cotone tinto con coloranti sintetici o misto con poliestere si degrada 'molto più lentamente'. Quale implicazione ha questa informazione per l'etichetta 'fibra naturale'?",["L'etichetta 'fibra naturale' descrive l'origine della fibra grezza ma non le caratteristiche del prodotto finito, che spesso contiene additivi chimici o fibre sintetiche che ne cambiano radicalmente le proprietà di fine vita","L'etichetta 'fibra naturale' garantisce la completa biodegradabilità in qualsiasi condizione","I coloranti sintetici devono essere rimossi dai capi di cotone prima di indossarli per evitare problemi di salute","È sempre meglio scegliere cotone non tinto (grezzo) per garantire biodegradabilità completa"],0,"'Fibra naturale' descrive l'origine della fibra grezza, non le caratteristiche del prodotto tessile finito. Una t-shirt '100% cotone' quasi certamente contiene: coloranti sintetici, agenti di finishing (anti-restringimento, ammorbidenti), eventualmente miscele con elastan. Questi additivi cambiano le proprietà di biodegradabilità. L'etichetta è parzialmente informativa: descrive il componente principale ma non il prodotto completo.",["Esatto! 'Fibra naturale' = origine della fibra grezza. Ma il prodotto finito è quasi mai 'solo fibra naturale': contiene coloranti sintetici, finishing chimici (ammorbidenti, anti-restringimento), miscele con fibre sintetiche. Questi additivi cambiano le proprietà di biodegradabilità del prodotto finito.","Non corretto. Il testo dice esplicitamente che il cotone tinto con coloranti sintetici o misto con poliestere si degrada molto più lentamente. 'Fibra naturale' non garantisce biodegradabilità del prodotto finito.","Non corretto. I coloranti sono fissati al tessuto attraverso processi chimici specifici e non rappresentano un problema di salute nell'uso normale. Il punto del testo è la biodegradabilità del prodotto finito, non la sicurezza d'uso.","Non corretto (parzialmente rilevante). Sebbene il cotone grezzo sia più biodegradabile del tinto, il testo non dà questa raccomandazione pratica. Il punto è la distinzione tra caratteristiche della fibra e caratteristiche del prodotto finito."]],["Il testo afferma che 'non esiste la plastica' ma settantamila materiali diversi. Come questa affermazione dovrebbe cambiare le politiche di riduzione dell'inquinamento da plastica?",["Le politiche devono distinguere tra plastiche ad alto impatto e difficile riciclo (PVC, PS, multistrato) e plastiche con filiere di riciclo funzionanti (PET, HDPE), puntando a eliminare le prime e migliorare le seconde","Non ci sono implicazioni per le politiche: se la plastica è settantamila materiali, è impossibile regolamentarla","Ogni tipo di plastica è ugualmente inquinante: non ha senso distinguere tra PET, PVC o PS per le politiche","Le politiche dovrebbero vietare tutta la plastica uniformemente, senza distinzioni tra i tipi"],0,"La distinzione tra i 7+ tipi di plastica ha implicazioni politiche reali: tasso di riciclo PET ≈50%, HDPE ≈80%, PVC ≈0%, PS ≈0%. Politiche efficaci: 1) vietare usi monouso di PS e PVC (difficili da riciclare, alta dispersione), 2) migliorare le infrastrutture per PET e HDPE (già riciclabili), 3) richiedere mono-materiale per imballaggi complessi, 4) etichettatura precisa con il codice numerico specifico.",["Esatto! Se 'la plastica' fossero un materiale omogeneo, si potrebbe regolamentare uniformemente. Ma PET riciclato al 50%, HDPE all'80%, PVC quasi mai, PS quasi mai: politiche uniformi su 'tutta la plastica' sono inefficienti. Occorre differenziare per tipo: incentivare PET e HDPE, eliminare PVC e PS negli usi monouso.","Non corretto. La complessità non implica impossibilità di regolamentazione. Anzi: conoscere le differenze tra polimeri permette politiche più precise ed efficaci di un divieto generico.","Non corretto. I diversi polimeri hanno impatti molto diversi: PVC bruciato emette diossine (pericoloso); PET riciclato al 50% (filiera funzionante); PS quasi mai riciclato. Le politiche che non distinguono sono meno efficaci.","Non corretto. Un divieto uniforme di tutta la plastica non sarebbe né pratico né ottimale: il PET riciclato ha un impatto molto inferiore al PVC, e vietarli entrambi allo stesso modo sarebbe ingiustificato."]],["Il testo afferma che la lana merino può 'mantenere il calore anche bagnata' mentre 'il cotone bagnato porta via calore dal corpo molto rapidamente'. Quale meccanismo fisico-chimico spiega questa differenza?",["La lana ha struttura igroscopica: assorbe il vapore acqueo nello strato corticale della fibra (esotermicamente) senza far sembrare bagnato l'esterno; il cotone si satura d'acqua liquida diventando un conduttore termico freddo","La lana è più spessa del cotone e quindi isola di più anche quando bagnata","La lana ripelle l'acqua grazie al grasso naturale (lanolina) che la impermeabilizza completamente","La lana contiene più air pockets del cotone e l'aria intrappolata isola anche in presenza di umidità"],0,"Differenza chiave lana vs cotone bagnato: La lana ha struttura igroscopica: assorbe vapore acqueo fino al 35% del suo peso nel cortex della fibra (con reazione esotermica), senza sembrare bagnata al tatto. Il cotone assorbe acqua LIQUIDA: 65% del suo peso. Acqua liquida = buon conduttore termico → porta via il calore del corpo. Lana bagnata → caldo. Cotone bagnato → freddo (rischio ipotermia per alpinisti/marinai).",["Esatto! La lana assorbe fino al 35% del suo peso come vapore (non acqua liquida) nello strato corticale: l'interno della fibra è 'umido' ma l'esterno rimane asciutto al tatto. Assorbendo umidità rilascia calore (reazione esotermica). Il cotone si satura di acqua liquida: l'acqua è un buon conduttore termico e porta via il calore corporeo.","Non corretto. Lo spessore non è la spiegazione. La differenza è nella struttura della fibra: la lana assorbe l'umidità internamente senza saturarsi di acqua liquida, mentre il cotone si satura di acqua liquida.","Non corretto (parzialmente vero). La lanolina naturale nella lana grezza ha proprietà idrorepellenti, ma la lana lavorata perde gran parte della lanolina. Il meccanismo principale è l'assorbimento igroscopico del vapore, non l'impermeabilità.","Non corretto (parzialmente vero). L'aria intrappolata contribuisce all'isolamento ma si comprime con l'acqua. Il meccanismo principale che distingue lana e cotone bagnati è la struttura igroscopica della fibra laniera che assorbe vapore senza saturarsi di acqua liquida."]],["Il testo descrive il Wallace Carothers di DuPont che nel 1935 scoprì che due molecole derivate dal petrolio 'si concatenavano in catene lunghissime — un polimero'. Quale implicazione sistemica ha avuto questa scoperta per l'industria tessile e l'ambiente?",["Ha creato un'industria tessile basata su materie prime fossili non rinnovabili che oggi produce 55 milioni di tonnellate di poliestere l'anno, con microplastiche come effetto collaterale non previsto al momento della scoperta","Ha migliorato uniformemente la qualità di vita globale senza effetti negativi documentati","Ha immediatamente sostituito tutte le fibre naturali rendendo l'agricoltura tessile obsoleta","Ha creato fibre migliori delle naturali in tutti gli aspetti, senza nessuna differenza ambientale rilevante"],0,"La scoperta del nylon nel 1935 ha aperto l'era dei tessili sintetici. Implicazioni sistemiche non previste: 1) dipendenza dal petrolio come materia prima; 2) produzione mondiale di 55 Mt/anno di poliestere (il doppio del cotone); 3) microplastiche come effetto collaterale del lavaggio (scoperto decenni dopo); 4) persistenza per secoli nell'ambiente (biodegradabilità quasi zero). È un esempio di come innovazioni tecnologiche hanno conseguenze sistemiche di lungo periodo non prevedibili al momento della scoperta.",["Esatto! Nel 1935 nessuno prevedeva: 1) che la produzione sarebbe arrivata a 55 Mt/anno di poliestere; 2) che ogni lavaggio avrebbe rilasciato centinaia di migliaia di microfibre nei mari; 3) che quelle fibre avrebbero perseverato per secoli nell'ambiente. Le conseguenze sistemiche di lungo periodo non erano prevedibili nel 1935.","Non corretto. Il testo documenta esplicitamente gli effetti negativi: microplastiche (35% delle microplastiche primarie oceaniche), produzione da petrolio (non rinnovabile), non biodegradabilità. Non ci sono stati solo effetti positivi.","Non corretto. Il cotone è ancora la fibra più prodotta al mondo (25-26 Mt/anno), il poliestere ha superato il cotone solo negli anni 2000-2010. La sostituzione non è stata immediata né totale.","Non corretto. Il testo mostra che le fibre sintetiche non sono 'migliori in tutti gli aspetti': producono microplastiche, derivano dal petrolio (non rinnovabile), non si biodegradano. Ci sono trade-off significativi."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
