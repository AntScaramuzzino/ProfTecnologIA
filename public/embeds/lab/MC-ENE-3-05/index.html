<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Dove va l'energia</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>

<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

          note: (p) => p.f === "sole" ? ["warn", "Rendimento basso perché il pannello converte solo il 20% della luce. Ma la luce del sole è gratuita e non emette CO₂: il rendimento da solo non dice quale filiera inquina meno."] : null },

      blocks: [

          note: (p, o) => ["ok", `Lavorando solo fra il 20% e l'80% si usa il 60% della batteria: la vita della batteria si allunga, ma serve una capacità di ${LABENGINE.fmt(o.cap)} Wh, e di ${LABENGINE.fmt(o.inv)} Wh per non restare a piedi d'inverno.`] } ],
      reflect: "Lo scooter a benzina equivalente consuma 2 litri ogni 100 km. Che dati ti servono per confrontare davvero i due mezzi?" }],

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-ENE-3-05","F":[["Qual è il rendimento tipico di un motore a benzina di un'automobile comune?",["25-35%","75-85%","50-60%","5-10%"],0,"I motori a benzina delle auto comuni hanno un rendimento del 25-35%: solo quella percentuale dell'energia chimica della benzina si converte in lavoro meccanico utile. Il resto (65-75%) si disperde come calore attraverso il sistema di raffreddamento (radiatore), i gas di scarico, e l'attrito meccanico.",["Esatto! I motori a benzina delle auto comuni hanno un rendimento del 25-35%. Il resto dell'energia della benzina (65-75%) si disperde come calore dal radiatore, dallo scarico e per attrito.","Non corretto. Il rendimento del 75-85% è tipico dei motori elettrici, non dei motori a benzina. Il motore a benzina ha un rendimento del 25-35%.","Non corretto. Il 50-60% è il rendimento di una centrale termoelettrica a ciclo combinato (gas). Un motore a benzina raggiunge solo il 25-35%.","Non corretto. Anche i motori meno efficienti superano il 20%. Il rendimento tipico di un motore a benzina è 25-35%."]],["In quale anno James Watt brevettò la macchina a vapore migliorata che rese possibile la Rivoluzione Industriale?",["1769","1885","1824","1876"],0,"Nel 1769, James Watt brevettò una macchina a vapore radicalmente più efficiente. La sua innovazione principale: separare il condensatore (dove il vapore si raffredda) dal cilindro (dove spinge il pistone). Prima, ogni ciclo richiedeva di raffreddare e riscaldare l'intero cilindro: uno spreco enorme. Questo miglioramento rese possibile la Rivoluzione Industriale.",["Esatto! Nel 1769, James Watt brevettò la sua macchina a vapore radicalmente più efficiente grazie alla separazione del condensatore dal cilindro: un miglioramento che ridusse enormemente gli sprechi di energia.","Non corretto. Il 1885 è l'anno in cui Karl Benz costruì il primo veicolo a motore. Watt brevettò la macchina a vapore nel 1769.","Non corretto. Il 1824 è l'anno in cui Sadi Carnot pubblicò la sua teoria sul rendimento massimo dei motori termici. La macchina a vapore di Watt fu brevettata nel 1769.","Non corretto. Il 1876 è l'anno del primo motore a 4 tempi di Nikolaus Otto. Watt brevettò la macchina a vapore nel 1769."]],["In quale tempo del ciclo a 4 tempi si produce effettivamente lavoro utile nel motore a scoppio?",["Terzo tempo — Scoppio: la miscela esplode e la pressione spinge il pistone verso il basso","Secondo tempo — Compressione: la miscela viene compressa aumentando la sua energia","Primo tempo — Aspirazione: l'aria fresca entra nel cilindro con forza","Quarto tempo — Scarico: i gas combusti vengono espulsi con alta pressione"],0,"I 4 tempi: 1° Aspirazione (pistone scende, entra miscela), 2° Compressione (pistone sale, miscela compressa), 3° Scoppio/Potenza (scintilla, esplosione, pistone spinto giù → unico tempo produttivo), 4° Scarico (pistone sale, espelle gas combusti). Per avere moto rotatorio continuo, i motori multi-cilindro sfasano i cicli: mentre un cilindro è in scoppio, gli altri sono negli altri tempi.",["Esatto! Solo il terzo tempo (scoppio/potenza) produce lavoro utile: la scintilla fa esplodere la miscela aria-benzina, la pressione spinge il pistone verso il basso. Gli altri tre tempi (aspirazione, compressione, scarico) sono necessari ma non producono lavoro utile.","Non corretto. Il secondo tempo comprime la miscela (aumenta la pressione e la temperatura) ma richiede lavoro, non lo produce. È preparatorio al terzo tempo.","Non corretto. Nel primo tempo il pistone scende aspirando la miscela, che entra grazie alla depressione creata. Non si produce lavoro utile: si prepara il combustibile.","Non corretto. Nel quarto tempo il pistone sale espellendo i gas combusti. Non si produce lavoro utile: si 'pulisce' il cilindro per il ciclo successivo."]],["Qual è il rendimento tipico di un motore elettrico moderno (brushless)?",["90-95%","50-60%","25-35%","100%: non c'è combustione quindi non si disperde energia"],0,"I motori elettrici brushless hanno rendimento del 90-95% perché non si basa su combustione (nessun limite di Carnot). L'energia elettrica si converte quasi direttamente in energia meccanica. Le perdite sono solo per attrito nei cuscinetti e per il calore generato dalla resistenza dei fili di rame — entrambi minimizzabili.",["Esatto! I motori elettrici brushless (come quelli delle auto elettriche) hanno un rendimento del 90-95%. Non avendo combustione, non sono soggetti al limite di Carnot che vincola i motori termici al 25-35%.","Non corretto. Il 50-60% è il rendimento delle centrali termoelettriche a ciclo combinato. Il motore elettrico raggiunge il 90-95%.","Non corretto. Il 25-35% è il rendimento del motore a benzina. Il motore elettrico è molto più efficiente: 90-95%.","Non corretto. Anche i motori elettrici hanno perdite (attrito nei cuscinetti, calore nei fili di rame per resistenza). Ma il rendimento del 90-95% è molto più vicino al 100% rispetto ai motori termici."]],["Il secondo principio della termodinamica afferma che il calore è una forma di energia 'di seconda qualità'. Cosa significa questa affermazione?",["Si può convertire lavoro meccanico in calore al 100%, ma non si può convertire calore in lavoro meccanico al 100%: c'è sempre una perdita irrecuperabile","Il calore ha meno energia del lavoro meccanico perché le molecole si muovono più lentamente","Il calore è utile solo per il riscaldamento degli edifici, non per muovere macchine","Il calore è meno utile del lavoro meccanico solo alle alte temperature; a basse temperature sono equivalenti"],0,"Il secondo principio della termodinamica: il calore è energia ma ha una proprietà asimmetrica. Puoi convertire lavoro meccanico in calore al 100% (attrito). Ma non puoi fare il contrario: convertire calore in lavoro richiede una sorgente fredda dove il calore residuo si disperde. Nessuna macchina termica reale può superare il limite di Carnot.",["Esatto! Strofina le mani: hai convertito tutto il lavoro in calore. Ma non si può fare il contrario: nessuna macchina termica converte tutto il calore in lavoro. Una parte si disperde irrecuperabilmente verso la sorgente fredda.","Non corretto. Il calore è energia cinetica delle molecole e non è 'inferiore' in termini di quantità di energia. Il problema è la convertibilità: il calore non si converte completamente in lavoro meccanico.","Non corretto. Il calore è usatissimo per muovere macchine (turbine a vapore, motori termici). Il secondo principio dice che questa conversione non è mai completa al 100%.","Non corretto. Il secondo principio vale a qualsiasi temperatura: non si può mai convertire tutto il calore in lavoro, indipendentemente dalla temperatura."]],["Qual è la principale differenza tra un'auto ibrida HEV (es. Toyota Prius) e un'auto ibrida plug-in PHEV?",["Il PHEV ha una batteria più grande ricaricabile dalla rete elettrica, permettendo 50-80 km solo in elettrico; l'HEV si ricarica solo durante la frenata rigenerativa","L'HEV non ha motore termico, il PHEV ha sia motore termico che elettrico","Il PHEV usa solo energia elettrica da pannelli solari, l'HEV usa benzina e energia recuperata dalla frenata","Non c'è differenza: HEV e PHEV sono due nomi diversi per lo stesso tipo di veicolo"],0,"HEV (Hybrid Electric Vehicle): piccola batteria, nessuna presa di rete, energia recuperata solo da frenata rigenerativa e motore termico. PHEV (Plug-in HEV): batteria più grande ricaricabile dalla rete, percorre 50-80 km solo in elettrico prima di passare al termico. BEV (Battery EV): solo elettrico, nessun motore termico.",["Esatto! HEV: batteria piccola ricaricata solo dalla frenata rigenerativa e dal motore termico, non si collega alla rete. PHEV: batteria più grande ricaricabile dalla rete, percorre 50-80 km solo in elettrico poi usa il motore termico.","Non corretto. Entrambi HEV e PHEV hanno sia motore termico sia motore elettrico. La differenza è la ricaricabilità dalla rete e la dimensione della batteria.","Non corretto. Il PHEV non usa pannelli solari: si ricarica dalla rete elettrica. L'HEV recupera energia dalla frenata rigenerativa ma non si collega alla rete.","Non corretto. HEV e PHEV sono configurazioni diverse: l'HEV non si collega alla rete, il PHEV sì e ha una batteria più grande per percorrere 50-80 km solo in elettrico."]]],"I":[["Il testo calcola che un'auto benzina percorre 100 km con 7 litri (62,3 kWh nell'energia della benzina) ma alle ruote arrivano solo 18,7 kWh (rendimento 30%). Un'auto elettrica percorre gli stessi 100 km con 16 kWh dalla rete. Qual è il rendimento effettivo dell'auto elettrica considerando solo il motore?",["Circa 94%: 16 kWh × 0,94 ≈ 15 kWh alle ruote (le perdite nel motore elettrico e nell'inverter sono del 5-6%)","50%: metà dell'energia elettrica si disperde come calore per il limite di Carnot","Il rendimento del motore elettrico non può essere calcolato senza conoscere la tensione della batteria","100%: il motore elettrico è un motore 'perpetuo' che non disperde mai energia"],0,"Il motore elettrico brushless ha rendimento del 90-95%: non usa combustione (nessun limite di Carnot), converte energia elettrica quasi direttamente in meccanica. Perdite: attrito nei cuscinetti (~2%), calore nei fili di rame (~4-8%). Confronto: motore benzina 25-35% vs motore elettrico 90-95%. La differenza spiega il vantaggio energetico dell'auto elettrica.",["Esatto! Un motore elettrico brushless ha rendimento del 90-95%. Se 16 kWh entrano nel motore, circa 15 kWh arrivano alle ruote come lavoro meccanico. Le perdite (5-10%) sono per attrito nei cuscinetti e calore nei fili di rame.","Non corretto. Il limite di Carnot si applica ai motori termici, non ai motori elettrici. Il motore elettrico non converte calore in lavoro: converte energia elettrica direttamente in energia meccanica, con rendimento del 90-95%.","Non corretto. Il rendimento è il rapporto W_utile/W_speso, indipendente dalla tensione specifica. Per il motore elettrico: rendimento ≈ 90-95%.","Non corretto. Anche il motore elettrico ha perdite (attrito, calore nei fili). Il rendimento è del 90-95%, non del 100%."]],["Il testo usa la formula del limite di Carnot: η_max = 1 − (T_C/T_H). Per un motore a benzina con T_H = 2.273K e T_C = 973K, il limite teorico è 57%. Perché i motori reali raggiungono solo il 25-35%?",["Perché attrito, perdite di calore attraverso le pareti del cilindro e combustione imperfetta dissipano energia oltre il minimo termodinamico previsto da Carnot","Perché il motore a benzina non usa le temperature corrette: userebbe temperature più alte per avvicinarsi al 57%","Perché il ciclo di Carnot si applica solo ai motori a vapore, non ai motori a benzina","Perché le case automobilistiche limitano artificialmente il rendimento per aumentare i consumi e i profitti"],0,"Il ciclo di Carnot è il massimo teorico per un ciclo ideale (nessuna perdita reale). Nei motori a benzina reali, le perdite aggiuntive includono: calore disperso attraverso le pareti metalliche del cilindro (non si può isolare perfettamente), attrito meccanico (pistoni, valvole, ingranaggi), combustione imperfetta (parte del carburante non brucia completamente). Il risultato è che i motori reali raggiungono 25-35% contro il 57% teorico.",["Esatto! Il ciclo di Carnot è ideale: nessuna perdita oltre il limite termodinamico. Nei motori reali ci sono perdite aggiuntive: calore disperso attraverso le pareti del cilindro, attrito nei cuscinetti e nelle valvole, combustione imperfetta (non tutto il carburante brucia completamente).","Non corretto. Le temperature nei motori reali sono già al limite dei materiali disponibili. Il gap tra 57% teorico e 25-35% reale è dovuto alle perdite reali (attrito, calore attraverso pareti, combustione imperfetta).","Non corretto. Il ciclo di Carnot è il limite termodinamico universale per qualsiasi macchina termica che converte calore in lavoro, inclusi i motori a benzina.","Non corretto. Le case automobilistiche investono enormemente per aumentare il rendimento e ridurre i consumi (anche per le normative sulle emissioni). Il gap tra Carnot e realtà è fisico, non deliberato."]],["Il testo afferma che 'le emissioni dell'auto elettrica dipendono dal mix elettrico della rete'. Perché questo dato è fondamentale per valutare correttamente l'impatto ambientale delle auto elettriche?",["Perché un'auto elettrica ricaricata con elettricità da carbone può emettere più CO₂ che un'auto a benzina efficiente, mentre ricaricata con rinnovabili è quasi a zero emissioni","Perché il mix elettrico determina la velocità di ricarica della batteria, non solo le emissioni","Perché i motori elettrici funzionano meglio con elettricità prodotta da fonti rinnovabili rispetto a quella da fossili","Perché le auto elettriche costano meno da ricaricare nei paesi con più energie rinnovabili"],0,"L'auto elettrica non produce emissioni dirette dal tubo di scappamento. Ma le emissioni 'indirette' dipendono da come viene prodotta l'elettricità per ricaricarla. In Italia (mix 2024: ~40% rinnovabili, ~250 g CO₂/kWh): auto elettrica ≈ 4,45 kg CO₂/100 km. In Francia (\u003c50 g CO₂/kWh nucleare): ≈ 0,8 kg. In Polonia (~850 g CO₂/kWh carbone): ≈ 15 kg — più dell'auto a benzina! L'analisi corretta è 'well-to-wheel' (dal pozzo alla ruota).",["Esatto! L'auto elettrica è 'zero emissioni dirette' ma le emissioni indirette dipendono da come viene prodotta l'elettricità. In Polonia (rete con 70% carbone) le emissioni per 100 km sono maggiori che in Francia (nucleare + rinnovabili).","Non corretto. Il mix elettrico non influenza la velocità di ricarica (che dipende dalla potenza del caricatore). Influenza le emissioni di CO₂ associate all'energia consumata per ricaricare.","Non corretto. Il motore elettrico funziona allo stesso modo indipendentemente dalla fonte di produzione dell'elettricità. La differenza è nelle emissioni di CO₂ associate all'energia, non nelle prestazioni del motore.","Non corretto. Il prezzo dell'elettricità non è direttamente determinato dalla quota di rinnovabili (dipende da molti altri fattori: tasse, struttura del mercato). Il punto è le emissioni di CO₂, non il prezzo."]],["Il testo descrive il 'diagramma di Sankey' come strumento per visualizzare la distribuzione dell'energia. In un motore a benzina che parte da 100 unità di energia, quante arrivano alle ruote?",["Circa 25 unità: dispersione dal motore (35), sistema di raffreddamento (30), scarico (5), attrito meccanico (5)","Circa 60 unità: le perdite principali sono solo nello scarico","Circa 50 unità: metà dell'energia si converte in lavoro utile","Zero unità: tutta l'energia si disperde come calore"],0,"Distribuzione dell'energia in un motore a benzina (schema Sankey dal testo): dispersione calore dal motore = 35 unità, dal sistema di raffreddamento = 30 unità, dallo scarico = 5 unità, attrito meccanico = 5 unità. Totale disperso = 75 unità. Alle ruote = 100 - 75 = 25 unità → rendimento = 25%. Il motore elettrico (5 + 3 + 2 = 10 unità disperse) porta 90 unità alle ruote.",["Esatto! Su 100 unità di benzina: calore dal motore 35, calore dal sistema di raffreddamento (radiatore) 30, calore dallo scarico 5, attrito meccanico 5. Totale disperso: 75. Alle ruote arrivano: 100 - 75 = 25 unità (rendimento ≈ 25%).","Non corretto. Con le perdite descritte nel testo (35 + 30 + 5 + 5 = 75), alle ruote arrivano solo 25 unità, non 60.","Non corretto. Il rendimento del 50% è quello di una centrale a ciclo combinato. Un motore a benzina raggiunge circa il 25-35%, non il 50%.","Non corretto. Se arrivassero zero unità alle ruote, l'auto non si muoverebbe. Il rendimento è 25-35%, quindi arrivano 25-35 unità alle ruote."]],["Il testo confronta il numero di componenti in movimento: motore a benzina ne ha oltre 200, motore elettrico ne ha 3 (rotore, statore, asse). Quale vantaggio pratico produce questa differenza?",["Il motore elettrico richiede manutenzione molto meno frequente (ogni 100.000+ km contro ogni 15-20.000 km del benzina) perché ha quasi nessun componente soggetto a usura meccanica","Il motore elettrico è più potente perché ha meno attrito interno","Il motore elettrico è più silenzioso perché ha meno superfici che vibrano","Il motore elettrico è più sicuro perché non ci sono parti che possono volare via in caso di guasto"],0,"Componenti in movimento: motore a benzina >200 (pistoni, valvole, candele, cinghia di distribuzione, frizione, cambio, pompa olio, pompa acqua...) → manutenzione ogni 15-20.000 km. Motore elettrico: 3 (rotore, statore, asse) → manutenzione ogni 100.000+ km. Meno componenti = meno punti di usura = meno manutenzione = costi operativi inferiori nel lungo periodo.",["Esatto! Ogni componente meccanico si usura nel tempo: pistoni, valvole, candele, cinghia di distribuzione, frizione, cambio. Con soli 3 componenti in movimento, il motore elettrico ha molti meno punti di usura, riducendo drasticamente la frequenza di manutenzione.","Non corretto. La potenza del motore non dipende solo dal numero di componenti. I motori a benzina ad alta potenza esistono nonostante i molti componenti. Il vantaggio principale dei pochi componenti è la ridotta manutenzione.","Non corretto. Sebbene il motore elettrico sia più silenzioso, il testo non lo collega al numero di componenti. Il vantaggio principale menzionato è la ridotta manutenzione.","Non corretto. Sebbene la semplicità riduca alcune modalità di guasto, il testo non fa questo collegamento. Il vantaggio menzionato è la ridotta manutenzione."]],["Il testo spiega che il motore elettrico ha 'coppia motrice immediata dal punto 0'. Quale vantaggio concreto di guida produce questa caratteristica?",["L'auto elettrica accelera da 0 km/h con la massima forza disponibile subito, senza dover aspettare che il motore termico raggiunga i giri di regime","L'auto elettrica non ha bisogno del cambio di velocità perché la coppia è costante a qualsiasi velocità","L'auto elettrica non ha bisogno della frizione perché il motore non si spegne mai sotto i regimi minimi","L'auto elettrica può spingere il veicolo in salita senza scivolare indietro grazie alla coppia immediata"],0,"Il motore termico produce coppia massima solo a un certo numero di giri (es. 2.500-4.000 rpm): da fermo si deve accelerare gradualmente (frizione, cambio) per portare il motore ai giri ottimali. Il motore elettrico produce coppia massima da 0 giri: la forza massima è disponibile istantaneamente. Questo spiega le accelerazioni 0-100 km/h straordinarie di Tesla Model S, Ferrari Rimac e altre elettriche di alta prestazione.",["Esatto! Il motore termico produce coppia massima solo a un certo numero di giri (curva di coppia). Il motore elettrico produce la coppia massima istantaneamente da 0 giri. Questo spiega perché le auto elettriche accelerano più velocemente delle termiche equivalenti da fermo.","Non corretto (parzialmente). La coppia immediata da 0 riduce la necessità del cambio, ma il punto specifico è che la coppia massima è disponibile immediatamente da 0 km/h, senza aspettare i giri motore.","Non corretto. La ragione per cui le auto elettriche non hanno frizione non è esattamente questa. Il punto è la coppia immediata da 0 giri, che dà accelerazione massima fin da fermo.","Non corretto. Sebbene la coppia immediata aiuti nelle partenze in salita, il principale vantaggio di guida citato nel testo è l'accelerazione massima disponibile istantaneamente da 0 km/h."]]],"A":[["Il testo dice: 'non esiste il moto perpetuo... chiunque affermi di aver inventato una macchina a energia libera sta violando una legge fisica fondamentale o sta mentendo'. Come si applica questa affermazione per valutare criticamente le notizie tecnologiche?",["È uno strumento di verifica: qualsiasi tecnologia che promette di produrre più energia di quanta ne consuma viola il secondo principio della termodinamica ed è fisicamente impossibile","Non si applica alla tecnologia moderna perché il secondo principio è stato dimostrato valido solo per le macchine a vapore del XIX secolo","Significa che le auto elettriche sono impossibili perché violano il secondo principio producendo coppia da 0 giri","Si applica solo ai motori meccanici, non ai dispositivi elettronici che funzionano con principi diversi"],0,"Il secondo principio della termodinamica è una delle leggi fisiche meglio verificate della scienza. Qualsiasi tecnologia che promette di produrre più energia di quanta ne consuma ('over-unity', 'energia libera') viola questa legge. Non è necessario analizzare i dettagli tecnici: se viola il secondo principio, è impossibile. Questo è un criterio di verifica immediato per valutare criticamente le affermazioni tecnologiche.",["Esatto! Il secondo principio della termodinamica è una legge fisica verificata sperimentalmente migliaia di volte. Qualsiasi dispositivo che promette 'energia gratuita', 'motore over-unity' o 'rendimento maggiore del 100%' viola questa legge. È un criterio di falsificabilità immediato.","Non corretto. Il secondo principio della termodinamica è stato verificato in migliaia di contesti moderni: motori, elettronica, processi chimici, fisica quantistica. Non è limitato alle macchine a vapore.","Non corretto. Le auto elettriche non violano il secondo principio: consumano energia elettrica per produrre lavoro meccanico, con rendimento \u003c 100%. Non creano energia dal nulla.","Non corretto. Il secondo principio è universale: vale per macchine meccaniche, dispositivi elettronici, processi chimici, sistemi biologici. Non ci sono eccezioni nei sistemi fisici reali."]],["Il testo calcola la filiera 'well-to-wheel' (dal pozzo alla ruota) per auto elettrica da solare: FV (20%) × inverter solare (97%) × rete (94%) × batteria (90%) × motore (92%). Questo rendimento è molto basso. Perché l'auto elettrica con solare è comunque preferibile in termini di emissioni?",["Perché anche se il rendimento complessivo è basso (~16%), le emissioni di CO₂ sono quasi zero: il sole non emette CO₂, il fotovoltaico non brucia carburante","Perché l'auto elettrica da solare ha un rendimento complessivo del 100% considerando che il sole è infinito","Perché il fotovoltaico non usa acqua, riducendo l'impatto idrico rispetto ai combustibili fossili","Perché nei paesi con molto sole il costo dell'elettricità solare è inferiore alla benzina, riducendo anche il costo operativo"],0,"Paradosso: auto elettrica da solare ha rendimento well-to-wheel ~16% (molto basso). Auto a benzina: ~28%. Ma la benzina parte da combustibili fossili: CO₂ ≈ 16 kg/100 km. L'auto da solare parte dall'energia solare (zero CO₂): anche se 'spreca' l'84% dell'energia solare, quella energia era gratuita e a zero emissioni. Il rendimento conta per il costo; le emissioni dipendono dalla fonte.",["Esatto! Il rendimento complessivo FV → auto ≈ 20% × 0,97 × 0,94 × 0,90 × 0,92 ≈ 16%. Ma l'energia di partenza è solare (gratuita e a zero emissioni). Anche se 'si spreca' l'84%, il CO₂ emesso è quasi zero. Il carburante fossile ha un rendimento maggiore ma costa emissioni di CO₂.","Non corretto. Il rendimento non diventa 100% perché l'input è gratuito. Il rendimento complessivo rimane ~16%. La differenza è nelle emissioni, non nel rendimento.","Non corretto. L'impatto idrico è un vantaggio reale, ma non è la ragione principale per cui l'auto elettrica da solare è preferibile per le emissioni. La ragione è che CO₂ ≈ 0 lungo tutta la filiera.","Non corretto. Il costo operativo è un vantaggio reale, ma non risponde alla domanda sulle emissioni. La ragione per cui è preferibile in termini di CO₂ è che la fonte (sole) non emette CO₂."]],["Il testo descrive che Nikolaus Otto brevettò il primo motore a 4 tempi nel 1876, poi Karl Benz lo montò su un veicolo nel 1885. Mettendo in prospettiva: questo motore ha dominato il mercato per 140 anni. Quale caratteristica lo ha reso così difficile da sostituire?",["L'altissima densità energetica dei carburanti liquidi (benzina, gasolio) che in pochi litri contengono decine di kWh, rendendo possibile un'autonomia di 600-800 km con rifornimento in 3-5 minuti","Il motore a 4 tempi è silenzioso e non produce vibrazioni, rendendolo confortevole rispetto alle alternative","Il motore a 4 tempi ha rendimento del 100%, rendendo inutile qualsiasi alternativa","Il motore a 4 tempi non produce emissioni di CO₂, rendendolo compatibile con qualsiasi normativa ambientale"],0,"Il motore a benzina ha dominato per 140 anni non per il rendimento (25-35% contro il 90-95% dell'elettrico) ma per la densità energetica dei carburanti liquidi: benzina ≈ 8,9 kWh/litro, 50 L = 445 kWh in 30 kg, ricaricabili in 5 minuti. Una batteria equivalente pesa oggi >1 tonnellata e si ricarica in 20-45 min. Solo quando le batterie hanno superato una soglia critica di costo/densità energetica, la transizione all'elettrico è diventata pratica.",["Esatto! La benzina contiene circa 8,9 kWh/litro. 50 litri = 445 kWh in un serbatoio leggero, rifornito in 5 minuti. Una batteria con 445 kWh peserebbe oltre 2 tonnellate ai costi di oggi. Questa densità energetica dei liquidi è il motivo per cui il motore termico ha dominato per 140 anni.","Non corretto. Il motore a benzina è tutt'altro che silenzioso o privo di vibrazioni. Il suo vantaggio principale è la densità energetica dei carburanti liquidi, non il comfort acustico.","Non corretto. Il motore a benzina ha rendimento del 25-35%, ben lontano dal 100%. Il suo dominio è dovuto alla densità energetica dei carburanti, non all'efficienza.","Non corretto. Il motore a benzina produce CO₂ ed è proprio questa la ragione per cui si vuole sostituirlo con soluzioni alternative. Il suo dominio storico è dovuto all'energia compatta dei carburanti liquidi."]],["Il testo descrive il limite di Carnot con la formula η_max = 1 − (T_C/T_H). Un ricercatore propone di aumentare il rendimento portando T_H a 3.000K (2.727°C). Quale ostacolo fisico-materiale impedisce questa soluzione?",["I materiali disponibili (acciai speciali, ceramiche) hanno temperatura di fusione o di cedimento meccanico inferiori a 2.727°C, quindi il cilindro si scioglierebbe o si deformerebbe","La legge di Carnot non permette di aumentare T_H oltre il limite di 2.273K previsto dalla termodinamica","La benzina non brucia a temperature superiori a 2.000°C perché la reazione chimica si inverte","La legge di sicurezza europea vieta temperature superiori a 2.000°C nei motori automobilistici"],0,"Aumentare T_H aumenta il rendimento teorico di Carnot. Ma T_H è limitata dalla resistenza termica dei materiali: anche le superleghe di nichel usate nelle turbine aeronautiche (le più resistenti disponibili) cedono a ~1.100-1.200°C in condizioni di carico meccanico continuativo. A 2.727°C non esistono materiali strutturali commerciali. Questo è il confine pratico che separa il limite teorico di Carnot dal rendimento reale.",["Esatto! Anche gli acciai speciali per alta temperatura (superleghe di nichel) cedono attorno a 1.000-1.200°C in condizioni di carico. Le ceramiche resistono di più ma sono fragili. Non esistono materiali strutturali commerciali che resistano a 2.727°C con carichi meccanici significativi.","Non corretto. La formula di Carnot non fissa un limite a T_H. Il limite è fisico-materiale: i materiali disponibili non resistono a temperature di 2.727°C con carichi meccanici.","Non corretto. La dissociazione termica dei prodotti di combustione avviene a temperature molto elevate, ma non è l'ostacolo principale. Il limite è la resistenza dei materiali del motore.","Non corretto. Non esiste tale normativa specifica. Il limite è fisico-materiale: i materiali del motore non resistono a quelle temperature in condizioni di uso continuativo."]],["Il testo riporta che 'entro il 2035 tutti i nuovi veicoli in Europa saranno a zero emissioni dirette'. Questa normativa avrà effetti a catena su interi settori industriali. Quale catena di effetti produrrà?",["Creerà domanda massiccia di ingegneri di propulsione elettrica, ridurrà i meccanici di motori a combustione, aumenterà la domanda di litio/cobalto, trasformerà i distributori di carburante, cambierà le competenze richieste nella formazione tecnica","La normativa non avrà effetti sull'occupazione perché i meccanici attuali possono facilmente riqualificarsi per le auto elettriche","La normativa riguarda solo la produzione di nuove auto: non cambierà nulla per chi usa auto a benzina già in circolazione","La normativa europea si applica solo ai paesi con PIL superiore alla media europea, non all'Italia"],0,"Il Regolamento UE 2023/851 (zero emissioni per le nuove auto entro il 2035) produce effetti sistemici: nuove professioni richieste (ingegneri propulsione elettrica, esperti di batterie, installatori di colonnine), professioni in declino (meccanici ICE, addetti raffinerie di carburante), nuove catene di fornitura (litio, cobalto, semiconduttori), trasformazione delle infrastrutture (colonnine vs distributori), cambiamento profondo nella formazione tecnica.",["Esatto! Una normativa sull'auto elettrica produce effetti sistemici a catena: nuove professioni (ingegneri propulsione elettrica), declino di altre (meccanici ICE), nuove catene di fornitura (batterie), trasformazione delle infrastrutture (colonnine vs distributori), cambiamento nella formazione tecnica. È un esempio di come le politiche energetiche producono trasformazioni occupazionali profonde.","Non corretto. La riqualificazione è necessaria ma non è automatica né semplice. La transizione richiede cambiamenti profondi nella formazione tecnica, nelle competenze degli officinisti, nelle infrastrutture di rifornimento.","Non corretto. Anche chi usa auto a benzina sarà influenzato: diminuiranno i distributori di carburante, aumenteranno le colonnine, cambierà il valore residuo delle auto a benzina usate, cambieranno le norme di accesso alle ZTL urbane.","Non corretto. Il Regolamento UE 2023/851 si applica a tutti i paesi dell'Unione Europea, inclusa l'Italia, senza distinzione di PIL."]],["Il testo descrive il 'frenata rigenerativa' nelle auto ibride come recupero di energia. Come funziona fisicamente questo meccanismo e quale principio fisico sfrutta?",["Il motore elettrico viene usato come generatore: la forza frenante meccanica fa girare il rotore, che genera corrente elettrica che ricarica la batteria, convertendo energia cinetica in energia elettrica","L'auto frena producendo calore che viene convertito in elettricità tramite celle termoelettriche","Le ruote frenano e comprimono molle che accumulano energia meccanica, poi rilasciata per azionare il generatore","Il calore dei freni viene raccolto da dissipatori termici e convertito in elettricità tramite effetto Seebeck"],0,"Frenata rigenerativa: il motore elettrico funziona come generatore (legge di Faraday-Lenz). Quando il guidatore frena, il rotore continua a girare per inerzia del veicolo. Questa rotazione nel campo magnetico genera corrente che carica la batteria. L'opposizione del generatore alla rotazione produce la forza frenante. Efficienza di recupero: 60-70% dell'energia cinetica. Negli ibridi, questo riduce i consumi del 20-30% nel traffico urbano (molte frenate).",["Esatto! Nella frenata rigenerativa, il motore elettrico funziona al contrario: invece di consumare elettricità per girare il rotore (motore), usa la forza del rotore che gira (per inerzia del veicolo) per generare corrente (generatore). È la legge di Faraday-Lenz applicata: un conduttore in moto in un campo magnetico genera corrente.","Non corretto. Le celle termoelettriche convertono differenze di temperatura in elettricità, ma con bassa efficienza e non sono il meccanismo principale della frenata rigenerativa. Il meccanismo è il motore usato come generatore.","Non corretto. Le molle di accumulazione energetica esistono in alcuni sistemi (KERS meccanico nella F1 anni 2000) ma non sono il meccanismo della frenata rigenerativa dei veicoli ibridi/elettrici moderni.","Non corretto. L'effetto Seebeck (termoelettrico) esiste ma ha bassissima efficienza. La frenata rigenerativa usa il motore elettrico come generatore: meccanismo molto più efficiente (60-70% di recupero dell'energia cinetica)."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
