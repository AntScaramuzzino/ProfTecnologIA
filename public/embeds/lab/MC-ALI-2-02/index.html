<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Laboratorio della conservazione</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-ALI-2-02","F":[["Quali sono le tre cause principali del deterioramento degli alimenti?",["Microrganismi, reazioni enzimatiche e ossidazione chimica","Luce, suono e pressione atmosferica","Freddo, umidità e contaminazione da metalli","Peso, volume e superficie di contatto dell'alimento"],0,"Il cibo si deteriora per tre cause: 1) microrganismi (batteri, muffe, lieviti) che si moltiplicano e producono tossine; 2) enzimi che continuano a lavorare dopo la raccolta; 3) ossidazione chimica che irrancidisce i grassi e degrada le vitamine.",["Esatto! Gli alimenti si deteriorano per microrganismi (batteri, muffe, lieviti), reazioni enzimatiche (gli enzimi continuano a lavorare dopo la raccolta) e ossidazione chimica (irrancidimento dei grassi).","Non è corretto. Luce e ossigeno accelerano l'ossidazione, ma il suono e la pressione non sono cause dirette del deterioramento alimentare.","Non è corretto. Il freddo e l'umidità sono fattori che influenzano la velocità del deterioramento, ma non sono le cause primarie. I metalli non sono tra le cause principali indicate nel testo.","Non è corretto. Queste sono caratteristiche fisiche degli alimenti, non cause di deterioramento."]],["Qual è la differenza tra refrigerazione e surgelazione?",["La refrigerazione usa gas refrigeranti, la surgelazione usa ghiaccio secco","La refrigerazione (0-4°C) rallenta i microrganismi; la surgelazione (-18°C o meno) li blocca quasi completamente","Sono la stessa cosa, solo con nomi diversi usati in contesti diversi","La refrigerazione conserva solo liquidi, la surgelazione conserva solo solidi"],1,"La refrigerazione (0-4°C) rallenta i microrganismi ma non li blocca: l'alimento continua a deteriorarsi lentamente. La surgelazione (-18°C o meno) congela l'acqua, privando i microrganismi del mezzo necessario per vivere.",["Non è corretto. La differenza fondamentale non è il tipo di refrigerante, ma la temperatura raggiunta e l'effetto sui microrganismi.","Esatto! La refrigerazione rallenta ma non blocca i microrganismi (il cibo continua a deteriorarsi, solo più lentamente). La surgelazione a -18°C congela l'acqua e blocca quasi completamente l'attività microbica.","Non è corretto. Le differenze sono sostanziali: temperatura, durata di conservazione e effetto sui microrganismi sono completamente diversi.","Non è corretto. Entrambe si applicano a qualsiasi tipo di alimento. La distinzione è la temperatura, non il tipo di alimento."]],["Cosa significa UHT nel trattamento del latte?",["Ultra High Time — sterilizzato per tempi molto lunghi a temperatura moderata","Ultra High Temperature — trattamento a 135-150°C per 2-4 secondi","Uniform Heating Treatment — riscaldamento uniforme a 72°C","United Hygienic Treatment — standard europeo di igienizzazione"],1,"UHT (Ultra High Temperature) porta il latte a 135-150°C per 2-4 secondi, distruggendo tutti i microrganismi incluse le spore batteriche. Il latte UHT dura 3-6 mesi a temperatura ambiente senza refrigerazione.",["Non è corretto. UHT indica la temperatura, non il tempo. La sterilizzazione UHT usa temperature elevatissime per tempi brevissimi.","Esatto! UHT significa Ultra High Temperature. Il latte viene portato a 135-150°C per 2-4 secondi, poi confezionato asetticamente. Si conserva 3-6 mesi a temperatura ambiente.","Non è corretto. Il trattamento a 72°C per 15 secondi è la pastorizzazione HTST (High Temperature Short Time), non l'UHT.","Non è corretto. UHT è un acronimo tecnico preciso che indica la temperatura elevata del processo, non uno standard di igienizzazione generico."]],["Qual è la differenza tra 'data di scadenza' e 'termine minimo di conservazione' su un'etichetta?",["Sono sinonimi e indicano entrambi il limite di sicurezza del prodotto","La data di scadenza riguarda la sicurezza microbiologica; il termine minimo riguarda le qualità organolettiche","Il termine minimo si usa solo per alimenti freschi, la data di scadenza per quelli in scatola","Il termine minimo è obbligatorio per legge; la data di scadenza è facoltativa"],1,"La 'data di scadenza' (da consumarsi entro) è un limite di sicurezza microbiologica per prodotti deperibili. Il 'termine minimo di conservazione' (da consumarsi preferibilmente entro) indica che il prodotto potrebbe essere meno gustoso ma non pericoloso dopo quella data.",["Non è corretto. Sono due indicazioni diverse con significati e conseguenze completamente diversi per la sicurezza del consumatore.","Esatto! La 'data di scadenza' (da consumarsi entro) indica il limite di sicurezza. Il 'termine minimo' (da consumarsi preferibilmente entro) indica solo che dopo quella data le qualità potrebbero essere ridotte, non che sia pericoloso.","Non è corretto. La data di scadenza si usa per prodotti deperibili (carne, pesce, latticini freschi). Il termine minimo si usa per prodotti stabili come biscotti, pasta, conserve.","Non è corretto. Entrambe sono obbligatorie per legge (Regolamento UE 1169/2011) e si usano su prodotti diversi in base alle caratteristiche di conservabilità."]],["Cosa si intende per 'catena del freddo' nella distribuzione degli alimenti surgelati?",["La rete di negozi che vendono prodotti surgelati","Il mantenimento continuo della temperatura a -18°C o meno dal produttore al consumatore","Il sistema di raffreddamento rapido usato nelle industrie alimentari durante la produzione","Il calendario stagionale delle temperature ottimali per la conservazione"],1,"La catena del freddo è la continuità del mantenimento a -18°C dal produttore al consumatore. Include trasporto refrigerato, magazzini, banchi frigo e freezer domestico. Se si interrompe anche solo per ore, i microrganismi si risvegliano e proliferano.",["Non è corretto. La catena del freddo non è una rete di negozi ma un sistema di controllo della temperatura che deve rimanere continuo.","Esatto! La catena del freddo è la continuità del mantenimento a -18°C dal momento della produzione fino al freezer di casa. Se si interrompe, i microrganismi si risvegliano.","Non è corretto. Il raffreddamento in produzione è solo la prima fase. La catena del freddo include tutto il percorso fino a casa del consumatore.","Non è corretto. La catena del freddo è un sistema logistico attivo, non un calendario stagionale."]],["Il processo di liofilizzazione degli alimenti è basato su quale principio fisico?",["Ebollizione ad alta pressione che rimuove l'acqua velocemente","Sublimazione del ghiaccio in vapore acqueo sotto vuoto, senza passare allo stato liquido","Evaporazione lenta dell'acqua al sole, come nell'essiccazione tradizionale","Centrifugazione che separa meccanicamente l'acqua dagli altri componenti"],1,"Nella liofilizzazione, l'alimento viene congelato rapidamente poi messo sotto vuoto. In queste condizioni il ghiaccio sublima direttamente in vapore senza passare allo stato liquido, preservando struttura, colore, aroma e valori nutrizionali quasi intatti.",["Non è corretto. La liofilizzazione usa il principio opposto: bassa pressione per far sublimare il ghiaccio direttamente in vapore.","Esatto! L'alimento viene prima congelato, poi messo sotto vuoto: il ghiaccio sublima direttamente in vapore. Risultato: massima conservazione di struttura, aroma e valori nutritivi.","Non è corretto. L'essiccazione al sole è la tecnica più antica e semplice. La liofilizzazione è molto più sofisticata e costosa.","Non è corretto. La centrifugazione separa fasi diverse ma non è il principio della liofilizzazione."]]],"I":[["Perché il surgelamento industriale rapido è migliore del congelamento lento in un freezer domestico?",["Perché raggiunge temperature più basse, uccidendo più batteri","Perché forma cristalli di ghiaccio microscopici che non danneggiano le pareti cellulari dell'alimento","Perché usa gas speciali invece dell'aria per congelare gli alimenti","Perché sterilizza anche i batteri resistenti al freddo"],1,"La velocità di congelamento determina la dimensione dei cristalli di ghiaccio. Il surgelamento industriale rapido (a -40°C o meno) forma cristalli microscopici che non danneggiano le cellule. Il congelamento lento forma cristalli grandi che rompono le pareti cellulari, alterando consistenza e sapore dopo lo scongelamento.",["Non è corretto. La differenza non è la temperatura finale ma la velocità: entrambi raggiungono -18°C, ma i cristalli di ghiaccio che si formano sono completamente diversi.","Esatto! Il surgelamento rapido industriale (a -40°C) forma cristalli di ghiaccio microscopici. Il congelamento lento forma cristalli grandi che rompono le pareti cellulari, peggiorando la texture dopo lo scongelamento.","Non è corretto. Alcuni sistemi industriali usano azoto liquido o CO₂, ma il vantaggio principale è la velocità di congelamento e la dimensione dei cristalli di ghiaccio.","Non è corretto. Il congelamento non uccide i batteri: li sospende. Sia il surgelamento industriale che domestico non sterilizzano l'alimento."]],["Perché non bisogna ricongelare un alimento già scongelato?",["Perché la normativa europea lo vieta esplicitamente per tutti i prodotti","Perché ogni ciclo congela-scongela aumenta il numero di microrganismi e peggiora la qualità microbiologica","Perché l'alimento ricongelato perde completamente il suo valore nutrizionale","Perché il freddo del secondo congelamento non riesce a raggiungere il centro dell'alimento"],1,"Quando un alimento scongelato si riporta a temperatura ambiente, i microrganismi (che il freddo non aveva ucciso, solo sospeso) si risvegliano e si moltiplicano. Ricongelarlo non li elimina: li intrappola nell'alimento, aumentando il rischio microbiologico ad ogni ciclo.",["Non è corretto. Il divieto è legato a ragioni biologiche, non solo normative. I microrganismi che si risvegliano durante lo scongelamento rimangono nell'alimento.","Esatto! Quando un alimento si scongela, i microrganismi si risvegliano e si moltiplicano. Se viene ricongelato, i microrganismi restano nell'alimento. Ogni ciclo accumula più rischio microbiologico.","Non è corretto. Il problema principale è microbiologico (sicurezza), non la perdita dei valori nutritivi, che è un effetto secondario.","Non è corretto. Un freezer domestico riesce a riportare l'alimento a -18°C in tutto il suo volume. Il problema non è fisico ma microbiologico."]],["Come funziona la salatura come metodo di conservazione?",["Il sale uccide i microrganismi con un'azione antibiotica simile a quella dei farmaci","Il sale estrae l'acqua dalle cellule dei microrganismi per osmosi, disidratandoli e uccidendoli","Il sale abbassa la temperatura dell'alimento per effetto chimico","Il sale crea uno strato impermeabile sulla superficie che blocca l'ingresso dei batteri"],1,"La salatura funziona per osmosi: il sale estrae l'acqua dall'interno delle cellule dei microrganismi, disidratandoli e uccidendoli. Riduce anche l'attività dell'acqua nell'alimento sotto la soglia necessaria alla crescita microbica.",["Non è corretto. Il sale non ha azione antibiotica nel senso farmacologico. Agisce per osmosi, disidratando le cellule dei microrganismi.","Esatto! Il sale agisce per osmosi: estrae l'acqua dalle cellule microbiche e riduce l'attività dell'acqua nell'alimento, impedendo la crescita microbica.","Non è corretto. Il sale non abbassa la temperatura degli alimenti. Quando disciolto in acqua abbassa il punto di congelamento, ma questo non è il meccanismo di conservazione degli alimenti salati.","Non è corretto. Il sale non crea una barriera fisica ma agisce chimicamente (osmotica) sull'acqua disponibile per i microrganismi."]],["Il confezionamento in atmosfera modificata (MAP) sostituisce l'aria con quali gas?",["Ozono e vapore d'acqua per disinfezione e protezione dall'essiccamento","Azoto per eliminare l'ossigeno e CO₂ per inibire la crescita batterica e fungina","Idrogeno e metano per creare un ambiente anaerobico","Azoto e argon per creare un'atmosfera neutra senza effetti chimici"],1,"Il MAP (Modified Atmosphere Packaging) sostituisce l'aria con azoto (N₂ per eliminare l'ossigeno) e CO₂ (che inibisce batteri e funghi). Permette di raddoppiare o triplicare la shelf life rispetto al normale imballaggio in aria.",["Non è corretto. L'ozono è usato in alcuni sistemi di disinfezione industriale, ma non è il gas usato nel MAP per la conservazione degli alimenti in confezione.","Esatto! Il MAP sostituisce l'aria con azoto (N₂, che elimina l'ossigeno) e CO₂ (che inibisce batteri e funghi). A volte piccole quantità di ossigeno mantengono il colore rosso della carne.","Non è corretto. Idrogeno e metano non si usano nel MAP. Sarebbero anche infiammabili e pericolosi.","Non è corretto. L'azoto viene usato, ma l'argon non è citato nel testo come gas principale del MAP. La CO₂ ha un ruolo attivo nell'inibire microrganismi."]],["Lo yogurt 'con fermenti lattici vivi' differisce dallo yogurt pastorizzato perché...",["Contiene più lattosio e ha un sapore meno acido","Non è stato pastorizzato dopo la fermentazione, quindi i batteri rimangono vivi e attivi","È prodotto con latte crudo invece che pastorizzato","Ha una durata più lunga perché i batteri vivi proteggono il prodotto"],1,"Lo yogurt con fermenti vivi non viene pastorizzato dopo la fermentazione. I batteri lattici rimangono attivi (100-200 milioni per ml), hanno shelf life più breve ma potenziali benefici intestinali. Per legge deve contenere almeno 10 milioni di batteri vivi per grammo al momento della vendita.",["Non è corretto. Lo yogurt con fermenti vivi ha solitamente più acido lattico (è più acido) perché i batteri continuano a produrre acido anche in frigo.","Esatto! Lo yogurt con fermenti vivi non subisce pastorizzazione dopo la fermentazione. I batteri lattici rimangono vivi (100-200 milioni per ml) e possono avere effetti benefici sull'intestino.","Non è corretto. Tutta la produzione industriale di yogurt inizia da latte pastorizzato. La differenza è cosa succede dopo la fermentazione.","Non è corretto. È il contrario: lo yogurt con fermenti vivi ha una shelf life più breve perché i batteri continuano a produrre acido lattico, rendendolo progressivamente più acido."]],["Perché il botulismo è particolarmente pericoloso nelle conserve alimentari non correttamente sterilizzate?",["Perché il batterio Clostridium botulinum cresce meglio in presenza di ossigeno","Perché il Clostridium botulinum è anaerobico e le sue spore sopravvivono alla normale pastorizzazione","Perché la tossina botulinica è instabile e si diffonde rapidamente nell'aria","Perché altera visibilmente l'aspetto e il sapore del cibo, rendendo la contaminazione facile da riconoscere"],1,"Il Clostridium botulinum è anaerobico (prospera senza ossigeno) e le sue spore resistono alla pastorizzazione. Solo la sterilizzazione in autoclave a 121°C per 15 minuti le distrugge. La tossina botulinica è una delle sostanze naturali più letali note.",["Non è corretto. Il Clostridium botulinum è un batterio anaerobico: cresce proprio in assenza di ossigeno. Le conserve sigillate sono il suo ambiente ideale.","Esatto! Il Clostridium botulinum cresce in assenza di ossigeno (condizione ideale nelle conserve) e le sue spore sopravvivono alla pastorizzazione. Solo la sterilizzazione in autoclave a 121°C le distrugge.","Non è corretto. La tossina botulinica è stabile nell'alimento conservato. Non si diffonde nell'aria in condizioni normali.","Non è corretto. Il botulismo è pericoloso anche perché non altera necessariamente l'aspetto o il sapore dell'alimento. Una lattina gonfia è un segnale d'allarme, ma non sempre presente."]]],"A":[["Se il primo ingrediente di un succo 'alla pesca' è 'acqua', il secondo è 'zucchero' e il terzo è 'concentrato di frutta 10%', cosa si può concludere?",["Che il succo è di ottima qualità perché contiene acqua, zucchero e frutta","Che il prodotto è essenzialmente acqua zuccherata con solo il 10% di componente di frutta","Che il succo rispetta i requisiti di legge minimi per essere chiamato succo di frutta","Che i valori nutrizionali del prodotto sono equivalenti a quelli di una pesca fresca"],1,"La lista degli ingredienti è in ordine decrescente di peso. Se l'acqua è prima e il concentrato di frutta è terzo al 10%, il prodotto è sostanzialmente acqua zuccherata con poco frutto. Leggere questa lista è lo strumento più potente per valutare realmente un prodotto alimentare.",["Non è corretto. L'ordine degli ingredienti è decrescente per peso. Se l'acqua è prima e la frutta solo il 10%, il prodotto è essenzialmente acqua zuccherata con poco frutto.","Esatto! Gli ingredienti sono elencati in ordine decrescente di peso. Se l'acqua è prima e il concentrato di frutta terzo al 10%, stai comprando principalmente acqua zuccherata.","Parzialmente vero, ma non è la conclusione più rilevante ai fini della consapevolezza del consumatore. La domanda chiede cosa si può concludere sulla composizione.","Non è corretto. Con solo il 10% di concentrato di frutta, il profilo vitaminico e minerale è molto inferiore a quello di una pesca fresca."]],["Un alimento sottovuoto può comunque essere pericoloso per il botulismo. Perché?",["Perché il sottovuoto deteriora le proteine creando tossine chimiche","Perché il Clostridium botulinum è anaerobico e cresce meglio in assenza di ossigeno, come nel sottovuoto","Perché la plastica del sottovuoto rilascia sostanze tossiche in assenza di aria","Perché senza aria il prodotto non può essere refrigerato efficacemente"],1,"Il Clostridium botulinum è anaerobico: vive e si moltiplica in assenza di ossigeno. Il sottovuoto crea esattamente le condizioni che esso preferisce. Per questo i prodotti sottovuoto devono essere refrigerati e non si basano solo sul confezionamento per garantire la sicurezza microbiologica.",["Non è corretto. Il sottovuoto non crea tossine chimiche. Il pericolo è biologico, non chimico.","Esatto! Il sottovuoto rimuove l'ossigeno che protegge dagli aerobi, ma il Clostridium botulinum è anaerobico: cresce proprio in assenza di ossigeno. Il sottovuoto da solo non protegge dal botulismo.","Non è corretto. Le plastiche per alimenti approvate dall'UE sono sicure per il contatto alimentare. Il pericolo del botulismo è batterico, non chimico.","Non è corretto. Il sottovuoto non influenza l'efficacia della refrigerazione. Il problema è esclusivamente biologico: il Clostridium botulinum è anaerobico."]],["Un tecnologo alimentare deve prolungare la shelf life di un petto di pollo fresco senza usare conservanti. Qual è la strategia più efficace tra quelle descritte nel testo?",["Pastorizzare il pollo a 72°C per 15 secondi e venderlo come 'fresco pastorizzato'","Confezionarlo in atmosfera modificata con azoto e CO₂, passando da 3-4 giorni a 8-12 giorni di conservazione","Aggiungere sale fino a una concentrazione del 5% per effetto osmotico","Abbassare il pH a 4,5 aggiungendo aceto di vino"],1,"Il MAP (Modified Atmosphere Packaging) con azoto e CO₂ porta la shelf life del petto di pollo da 3-4 giorni a 8-12 giorni senza conservanti. La CO₂ inibisce batteri e funghi; il N₂ elimina l'ossigeno che ossida i grassi. Il testo lo cita esplicitamente come esempio.",["Parzialmente corretto, ma la pastorizzazione da sola senza confezionamento adeguato non è la strategia ottimale. La combinazione con l'atmosfera modificata è più efficace.","Esatto! Il MAP (atmosfera modificata) senza conservanti è la soluzione che il testo indica esplicitamente per la carne: da 3-4 giorni di shelf life in imballaggio normale a 8-12 giorni in MAP.","Non è corretto. La salatura al 5% cambierebbe il sapore del prodotto in modo significativo. Non è un metodo per 'fresco non conservato'.","Non è corretto. L'acidificazione con aceto cambierebbe completamente le caratteristiche organolettiche del pollo e non è indicata nel testo per la conservazione di carni fresche."]],["Una famiglia butta mediamente 500 euro di cibo all'anno. Usando le conoscenze di questa MC, quale comportamento avrebbe il maggiore impatto per ridurre questo spreco?",["Comprare solo prodotti con data di scadenza lontana, indipendentemente da altri criteri","Saper distinguere scadenza da termine minimo, conservare ogni prodotto nel modo corretto e pianificare gli acquisti","Comprare solo prodotti surgelati per azzerare le scadenze ravvicinate","Eliminare il frigo e usare solo metodi di conservazione come salatura e affumicatura"],1,"Il comportamento più efficace contro lo spreco alimentare domestico combina: 1) capire la differenza tra scadenza e termine minimo; 2) conservare ogni prodotto nelle condizioni corrette; 3) pianificare gli acquisti in base ai consumi reali. Sono le competenze pratiche che questa MC ha sviluppato.",["Non è corretto. La data di scadenza lontana non è il criterio giusto: un prodotto con scadenza lontana ma mal conservato peggiora prima. Il problema è la gestione corretta.","Esatto! La combinazione di: capire scadenza vs. termine minimo, conservare i prodotti nelle condizioni giuste (frigo, dispensa, freezer) e pianificare gli acquisti è la strategia più efficace contro lo spreco.","Non è corretto. I surgelati hanno durata lunga ma non azzerano lo spreco: anche i surgelati scadono e vanno gestiti correttamente. E non si possono surgelare tutti gli alimenti.","Non è corretto. Il frigo è essenziale per la conservazione di molti alimenti moderni. Sostituirlo con salatura e affumicatura cambierebbe completamente le abitudini alimentari e non ridurrebbe necessariamente gli sprechi."]],["Perché la Listeria monocytogenes è considerata particolarmente pericolosa nonostante le buone pratiche di conservazione domestica?",["Perché produce spore resistenti alla pastorizzazione come il Clostridium botulinum","Perché cresce anche a temperature di frigorifero (fino a 0°C) senza alterare visibilmente l'alimento","Perché è resistente a tutti i metodi di conservazione inclusa la surgelazione","Perché produce tossine che non vengono distrutte neanche dalla cottura ad alta temperatura"],1,"La Listeria monocytogenes è pericolosa perché cresce anche a temperature di frigorifero (fino a 0°C) e senza alterare visibilmente l'aspetto o il profumo dell'alimento. Un prodotto contaminato da Listeria può sembrare e profumare perfettamente fresco.",["Non è corretto. La Listeria non produce spore resistenti. La sua pericolosità deriva da una caratteristica diversa e specifica.","Esatto! La Listeria è pericolosa perché cresce anche a 0-4°C (temperature di frigorifero) e non altera aspetto né profumo dell'alimento. Un cibo contaminato da Listeria può sembrare perfettamente fresco.","Non è corretto. La Listeria viene inattivata dalla surgelazione e uccisa dalla cottura a temperature adeguate. Il suo vantaggio è che cresce in frigo.","Non è corretto. La Listeria viene uccisa dalla cottura a temperature adeguate. Il suo pericolo è a temperature di refrigerazione, non alle temperature di cottura."]],["Un produttore di mozzarella deve consegnare 50 kg a Milano in 48 ore mantenendo la shelf life di 5-7 giorni a 4°C. Quale punto della catena del freddo è più critico?",["La produzione della mozzarella nel caseificio, dove si sceglie il latte","Il momento di scarico e stazionamento al magazzino di distribuzione, dove il controllo della temperatura può essere discontinuo","Il confezionamento finale al ristorante di Milano prima del servizio","La fase di produzione nel caseificio dove si pastorizza il latte"],1,"I punti critici della catena del freddo sono i momenti di trasferimento: carico/scarico al magazzino, deposito temporaneo, consegna. In questi momenti la merce è temporaneamente fuori dalle celle refrigerate e la temperatura può salire, specialmente in condizioni estive o con attrezzature non perfette.",["Non è corretto. La qualità del latte è importante, ma il rischio durante il trasporto riguarda la catena del freddo logistica, non la fase di produzione.","Esatto! I passaggi di carico/scarico sono i punti critici più frequenti nella catena del freddo: la merce resta temporaneamente fuori dalle celle, la temperatura può salire, specialmente in estate.","Non è corretto. Il confezionamento al ristorante avviene dopo la consegna: non è parte della catena del freddo del produttore.","Non è corretto. La pastorizzazione è una fase di produzione controllata. I rischi maggiori della catena del freddo sono nei trasferimenti logistici."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
