<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Il quartiere sotto la lente</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-AMB-2-03","F":[["Cos'è il Piano Regolatore Generale (PRG)?",["Un documento che regola il traffico urbano nelle ore di punta","Il documento tecnico-giuridico che stabilisce come può essere usato ogni metro quadro del territorio di un Comune","Il programma annuale delle opere pubbliche approvato dal Consiglio Comunale","Il regolamento che disciplina le distanze tra edifici nelle nuove costruzioni"],1,"Il Piano Regolatore Generale (PRG) — oggi denominato PGT o PS a seconda della regione — è il documento tecnico-giuridico che stabilisce come può essere usato ogni metro quadro del territorio comunale: dove costruire, dove lasciare il verde, indici di edificabilità, altezze massime, destinazioni d'uso.",["Non è corretto. Il piano del traffico è uno strumento diverso. Il PRG riguarda l'uso del suolo e la trasformazione urbana nel lungo periodo.","Esatto! Il PRG (oggi spesso PGT o PS) stabilisce dove si può costruire, dove lasciare il verde, dove collocare i servizi, le altezze massime, gli indici di edificabilità. È il documento fondamentale del governo del territorio.","Non è corretto. Il programma delle opere pubbliche è uno strumento diverso (Piano triennale delle OO.PP.). Il PRG è un documento di pianificazione strategica, non un programma annuale.","Non è corretto. Le distanze tra edifici sono una delle norme contenute nel PRG, ma il PRG è molto più ampio: definisce l'intera organizzazione dello spazio urbano."]],["Cosa indica la 'zonizzazione' (zoning) nel piano urbanistico?",["La divisione del territorio in quartieri con nomi storici per scopi turistici","L'assegnazione di una destinazione d'uso a ogni area del territorio (residenziale, produttiva, agricola, verde, servizi)","La divisione del territorio in settori elettorali per le elezioni comunali","La delimitazione delle aree protette da vincoli ambientali regionali"],1,"La zonizzazione assegna a ogni area del territorio comunale una destinazione d'uso. Zone A (centro storico), B (residenziale consolidata), C (nuovi insediamenti), D (produttiva/industriale), E (agricola, non edificabile), F (verde pubblico e servizi). Ogni zona ha norme specifiche su cosa si può costruire e come.",["Non è corretto. La zonizzazione è una classificazione funzionale del territorio, non storica o turistica.","Esatto! La zonizzazione assegna a ogni porzione di territorio una destinazione d'uso: zone A (centro storico), B (residenziale consolidata), C (nuovo insediamento), D (produttiva), E (agricola), F (verde e servizi).","Non è corretto. I settori elettorali (circoscrizioni) sono un concetto politico-amministrativo diverso dalla zonizzazione urbanistica.","Non è corretto. I vincoli ambientali esistono (aree protette, SIC, ZPS) ma sono stabiliti da strumenti normativi diversi dal PRG comunale."]],["Cos'era il 'cardo' e il 'decumano' nelle città romane?",["Le due porte principali di ingresso della città, una a nord e una a est","Le due strade principali perpendicolari (nord-sud e est-ovest) che si incrociavano al centro della città nel foro","I due acquedotti principali che rifornivano d'acqua la città romana","I due magistrati responsabili della pianificazione urbana nel diritto romano"],1,"Il cardo (nord-sud) e il decumano (est-ovest) erano le due strade principali perpendicolari delle città romane. Si incrociavano nel foro (piazza centrale con i principali edifici pubblici). Da questi assi si sviluppava la griglia ortogonale degli isolati (insulae). Questa struttura è ancora leggibile a Torino, Bologna, Rimini.",["Non è corretto. Cardo e decumano erano strade, non porte. Le porte erano ai quattro punti cardinali.","Esatto! Il cardo era la strada nord-sud, il decumano quella est-ovest. Si incrociavano nel foro (la piazza centrale). Da questi due assi si sviluppava la griglia ortogonale degli isolati (insulae).","Non è corretto. Il cardo e il decumano erano strade principali, non acquedotti. Gli acquedotti romani erano strutture esterne alla città.","Non è corretto. Cardo e decumano sono termini di urbanistica, non di diritto pubblico romano. Erano le due assi stradali della pianificazione urbana."]],["Qual è lo standard urbanistico minimo italiano di verde pubblico per abitante?",["3 m² per abitante","9 m² per abitante","50 m² per abitante","25 m² per abitante"],1,"Gli standard urbanistici italiani (DM 1444/1968) prevedono almeno 9 m² di verde pubblico per abitante nelle zone residenziali. Questo standard è uno dei minimi europei; molte città del Nord Europa garantiscono 15-30 m²/abitante.",["Non è corretto. Lo standard italiano di verde pubblico è superiore a 3 m²/abitante. Il valore corretto è il doppio.","Esatto! Gli standard urbanistici minimi italiani (D.M. 1444/1968) prevedono almeno 9 m² di verde pubblico per abitante. Molte città moderne cercano di superare questo minimo.","Non è corretto. 50 m²/abitante è un valore molto elevato che poche città raggiungono. Lo standard minimo legale italiano è di 9 m²/abitante.","Non è corretto. 25 m²/abitante è un valore superiore allo standard minimo italiano. Il DM 1444/1968 fissa il minimo a 9 m²/abitante."]],["Cos'è il 'sprawl urbano' (diffusione urbana)?",["La densificazione estrema del centro città con grattacieli che creano congestione","L'espansione non pianificata della città verso la periferia con bassa densità, dipendenza dall'auto e consumo di suolo agricolo","La riqualificazione di quartieri degradati con nuovi edifici che aumentano la densità","Il fenomeno di abbandono dei centri storici a favore delle periferie da parte dei residenti ricchi"],1,"Lo sprawl urbano è l'espansione della città verso la periferia a bassa densità, con case unifamiliari distanziate, centri commerciali su viale trafficato, alta dipendenza dall'auto. Los Angeles è l'esempio canonico. Contrario: città compatta come Bologna o Amsterdam, dove si cammina, si va in bici, si usano i mezzi pubblici.",["Non è corretto. La densificazione del centro è l'opposto dello sprawl. Lo sprawl è la dispersione verso la periferia a bassa densità.","Esatto! Lo sprawl è la diffusione urbana a macchia d'olio: case unifamiliari sparse, centri commerciali, strade a molte corsie. Alta dipendenza dall'auto, basso uso del suolo per abitante, consumo di territorio agricolo.","Non è corretto. La riqualificazione aumenta la densità in zone già urbane. Lo sprawl è la crescita verso l'esterno della città, verso campagna e periferia, a bassa densità.","Non è corretto. La gentrificazione e il 'white flight' sono fenomeni demografici. Lo sprawl è una caratteristica morfologica dell'insediamento (forma fisica della città), non un fenomeno demografico specifico."]],["Chi può presentare osservazioni al piano regolatore durante il processo di approvazione?",["Solo i proprietari di terreni coinvolti dalle modifiche del piano","Chiunque: la partecipazione dei cittadini è un diritto sancito dalla legge","Solo le associazioni di categoria (costruttori, commercianti) registrate alla Camera di Commercio","Solo il Consiglio Comunale e i tecnici incaricati dal Comune"],1,"Il processo di approvazione del PRG prevede una fase di esposizione pubblica in cui chiunque — cittadino singolo, associazione, impresa — può presentare osservazioni scritte. Questo è un diritto sancito dalla legge. Il Comune poi valuterà le osservazioni (può accoglierle o respingerle con motivazione).",["Non è corretto. Il diritto di presentare osservazioni è aperto a tutti i cittadini, non solo ai proprietari di terreni. È un diritto di partecipazione democratica.","Esatto! Chiunque — cittadino, associazione, impresa — può presentare osservazioni scritte durante il periodo di esposizione pubblica del PRG. È un atto politico, non solo tecnico.","Non è corretto. Il processo partecipativo è aperto a tutti i cittadini, non solo alle categorie economiche organizzate.","Non è corretto. Il Consiglio Comunale adotta il piano, ma prima dell'adozione definitiva il piano viene esposto pubblicamente per permettere osservazioni da parte di qualsiasi cittadino."]]],"I":[["Il medico John Snow nel 1854 ha mappato il colera di Londra su una cartina geografica. Cosa ha scoperto e perché è importante per l'urbanistica?",["Ha scoperto che i poveri erano più vulnerabili al colera, giustificando la segregazione residenziale per zone di reddito","Ha dimostrato che tutti i casi erano concentrati attorno a una pompa dell'acqua contaminata: la salute dipende dalla qualità dell'ambiente fisico","Ha dimostrato che i quartieri medievali con strade strette erano più vulnerabili, giustificando la demolizione dei centri storici","Ha scoperto che i topi erano i vettori del colera, dimostrando la necessità di gestione dei rifiuti urbani"],1,"Snow ha mappato i casi di colera di Soho (Londra 1854) e ha trovato che tutti convergevano sulla pompa di Broad Street. Ha dimostrato che la salute dipende dall'ambiente fisico: è la nascita dell'epidemiologia spaziale e della comprensione che le città devono essere progettate con fognature, acquedotti, verde, ventilazione.",["Non è corretto. Snow ha scoperto la causa biologica (una pompa dell'acqua contaminata), non le cause sociali. La conclusione corretta è diversa e ha implicazioni diverse.","Esatto! Snow ha mappato i casi di colera e trovato che tutti convergevano sulla pompa di Broad Street. Ha dimostrato che le malattie dipendono dall'ambiente fisico (acqua, fognature): la nascita dell'epidemiologia spaziale e dell'urbanistica sanitaria.","Non è corretto. Snow ha identificato una pompa specifica come fonte, non la morfologia urbana medievale in generale. Le demolizioni di Haussmann a Parigi erano motivate da ragioni diverse.","Non è corretto. Snow ha identificato l'acqua contaminata (non i topi) come fonte del colera. La teoria dei germi era ancora in sviluppo nel 1854."]],["Perché la città medievale italiana (es. Siena) attrae i turisti oggi ma presentava problemi per i residenti industriali?",["Perché era costruita con materiali preziosi che oggi hanno valore storico e artistico","Perché ha strade organiche e scalate pedonali, ma è inadeguata per il traffico automobilistico e i servizi igienici moderni","Perché mancava di monumenti storici che attirassero visitatori prima del XIX secolo","Perché la pianificazione medievale non prevedeva spazi pubblici: tutta la città era privata"],1,"Le città medievali (Siena, San Gimignano) hanno strade organiche, curve, scalate: bella da visitare, adatta al movimento pedonale. Ma con l'industrializzazione e l'automobile si rivelano inadeguate: troppo strette per i mezzi pesanti, senza marciapiedi, senza sistemi fognari e idrici sufficienti per grandi popolazioni.",["Non è corretto. Il valore turistico non dipende dai materiali ma dalla forma urbana organica. I problemi funzionali erano legati alla morfologia delle strade, non ai materiali.","Esatto! Le strade medievali sono attrattive (strette, curve, pedonali) ma inadeguate per camion, ambulanze, sistemi idrici e fognari moderni. La forma medievale è bellissima ma funzionalmente inadatta alla vita contemporanea.","Non è corretto. Le città medievali italiane avevano già molti monumenti: cattedrali, palazzi comunali, torri. Il loro valore esisteva da secoli.","Non è corretto. La città medievale aveva piazze del mercato e della cattedrale come spazi pubblici fondamentali per la vita collettiva."]],["Cosa fa Haussmann a Parigi tra il 1853 e il 1870 e perché è ancora controverso?",["Costruisce il sistema metropolitano sotterraneo (metro) che ancora oggi connette la città","Demolisce i vicoli medievali e costruisce grandi boulevards rettilinei con fognature: la Parigi moderna, ma con demolizioni di interi quartieri","Progetta le piazze circolari e gli archi di trionfo che caratterizzano il centro di Parigi","Introduce la zonizzazione funzionale separando zona industriale e zona residenziale per la prima volta nella storia"],1,"Haussmann (1853-1870) demolisce i vicoli medievali di Parigi e costruisce i grandi boulevard rettilinei alberati con fognature sotterranee. È la Parigi moderna. Ma è controverso perché ha demolito interi quartieri storici, espellendo centinaia di migliaia di residenti poveri verso le periferie: le forze sociali non si possono ignorare nella pianificazione urbana.",["Non è corretto. La metropolitana di Parigi fu costruita a partire dal 1900. Haussmann ha realizzato i grandi viali di superficie e la rete fognaria.","Esatto! Haussmann demolisce i vicoli medievali e realizza i boulevard parigini (larghi, alberati, con fognature). Risultato: la Parigi che conosciamo. Controversia: ha demolito interi quartieri storici, espellendo i residenti più poveri verso le periferie.","Non è corretto. L'Arco di Trionfo fu commissionato da Napoleone Bonaparte nel 1806, prima di Haussmann. Haussmann ha organizzato i viali che convergono sull'arco, non l'arco stesso.","Non è corretto. Lo zoning formale è del XX secolo (New York 1916). Haussmann ha trasformato la forma urbana (strade, fognature) ma non ha introdotto la zonizzazione funzionale moderna."]],["Cosa si intende per 'indice di fabbricabilità fondiaria' nel piano regolatore?",["Il numero massimo di piani che un edificio può avere in una determinata zona","I metri cubi costruibili per metro quadro di terreno (es. 1,5 m³/m² → 1.500 m³ su lotto di 1.000 m²)","Il costo massimo al metro quadro che un costruttore può richiedere per gli appartamenti","La percentuale di terreno che deve rimanere permeabile rispetto alla superficie totale del lotto"],1,"L'indice di fabbricabilità fondiaria esprime quanti m³ si possono costruire per ogni m² di terreno del lotto. Esempio: indice 1,5 m³/m² su lotto di 1.000 m² → massimo 1.500 m³ di volume edificato. Questo parametro controlla la densità edilizia di ogni zona.",["Non è corretto. Il numero di piani è un parametro separato (altezza massima). L'indice di fabbricabilità fondiaria misura il volume costruibile per unità di superficie del lotto.","Esatto! L'indice di fabbricabilità fondiaria esprime quanti m³ si possono costruire per m² di terreno. Indice 1,5: su un lotto di 1.000 m² si possono costruire al massimo 1.500 m³ di volume edificato.","Non è corretto. Il PRG non regola i prezzi di mercato delle abitazioni. L'indice di fabbricabilità è un parametro urbanistico sulla quantità di costruzione, non sul costo.","Non è corretto. La percentuale di terreno permeabile è un altro parametro urbanistico specifico. L'indice di fabbricabilità riguarda il volume costruibile, non la permeabilità."]],["Perché le zone produttive (industriali) vengono segregate dal residenziale nella zonizzazione?",["Per ragioni fiscali: le industrie pagano tasse diverse e devono essere in zone separate","Per ridurre l'impatto di rumore, traffico pesante e inquinamento sulle zone residenziali","Per concentrare le infrastrutture (gas, elettricità) in un'unica zona riducendo i costi","Per rispettare le regole europee che vietano attività produttive in zone miste"],1,"Le zone produttive (D) vengono segregate dal residenziale per ridurre i conflitti d'uso: le industrie generano rumore, traffico pesante di TIR, emissioni di odori e polveri. Collocarle lontano dalle residenze protegge la qualità della vita. È il principio fondamentale dello zoning funzionale introdotto nel XX secolo.",["Non è corretto. La separazione non è fiscale ma funzionale: ridurre i conflitti tra usi incompatibili (rumore, traffico pesante, inquinamento) e l'uso residenziale.","Esatto! Le industrie generano rumore, traffico pesante di camion, emissioni. Segregarle riduce i conflitti con le residenze. È il principio base dello zoning funzionale del XX secolo.","Non è corretto. Le infrastrutture si distribuiscono in tutta la città indipendentemente dalla zonizzazione. Il motivo della segregazione industriale è la riduzione dei conflitti con il residenziale.","Non è corretto. L'UE non vieta le zone miste. La separazione funzionale è una scelta urbanistica dei singoli piani regolatori, non un obbligo europeo."]],["Il caso di studio dei 'Superblocks' di Barcellona mostra come lo spazio pubblico può essere redistribuito. Quale principio applica?",["Costruisce nuovi edifici altissimi per liberare suolo da destinare a verde e pedonalità","Delimita blocchi di nove isolati come unità pedonale, spostando il traffico di transito sulle strade perimetrali e recuperando spazio interno all'auto","Vieta completamente l'uso dell'automobile in tutta la città di Barcellona","Trasferisce le strade underground e usa la superficie per parchi e piazze"],1,"I Superblocks di Barcellona raggruppano 9 isolati in un'unità pedonale. Il traffico di transito viene reindirizzato sulle strade perimetrali; le strade interne diventano zone pedonali e ciclabili con verde e aree gioco. Senza demolire nulla: solo ridistribuire l'uso dello spazio esistente tra auto, pedoni e vita di quartiere.",["Non è corretto. I Superblocks non prevedono nuova costruzione. Ridistribuiscono lo spazio esistente sottraendolo all'auto privata.","Esatto! I Superblocks raggruppano 9 isolati in un'unità pedonale: il traffico di transito viene spostato sulle strade perimetrali, liberando le strade interne per pedoni, ciclisti, verde e vita di quartiere.","Non è corretto. I Superblocks non vietano l'auto in tutta Barcellona: permettono l'accesso dei residenti e di chi deve caricare/scaricare, spostando solo il traffico di transito.","Non è corretto. I Superblocks non prevedono infrastrutture underground. Ridistribuiscono lo spazio esistente in superficie, non lo moltiplicano scavando sotto."]]],"A":[["Una città vuole espandere un centro commerciale in una zona ora classificata E (agricola). Chi decide e con quale processo?",["Il proprietario del terreno può decidere autonomamente se il progetto rispetta le norme edilizie nazionali","Serve una variante al PRG approvata dal Consiglio Comunale e dalla Regione, dopo un processo che include partecipazione pubblica","La Regione può autorizzare direttamente il cambio di destinazione d'uso senza passare per il Comune","Il Ministero delle Infrastrutture e dei Trasporti autorizza direttamente i grandi centri commerciali con un decreto ministeriale"],1,"Cambiare la destinazione d'uso di un'area da E (agricola) a commerciale richiede una variante al PRG. Il processo: proposta al Consiglio Comunale → adozione → esposizione pubblica (chiunque può presentare osservazioni) → approvazione della Regione. È un processo lungo ma garantisce partecipazione democratica.",["Non è corretto. In Italia i proprietari non possono cambiare la destinazione d'uso del proprio terreno unilateralmente. Serve la variante al PRG.","Esatto! Cambiare la destinazione d'uso da E (agricola) a commerciale richiede una variante al PRG: adozione del Consiglio Comunale, esposizione pubblica (con osservazioni), approvazione della Regione.","Non è corretto. La Regione approva il PRG e le varianti ma non sostituisce il processo di pianificazione comunale. La proposta deve partire dal Comune.","Non è corretto. L'autorizzazione dei grandi centri commerciali è di competenza regionale e comunale, non ministeriale nel normale iter."]],["Una città compatta come Bologna e una dispersa come Los Angeles hanno approcci diversi alla mobilità. Quale impatto ambientale principale differenzia le due?",["Bologna ha più spazi verdi che riducono le isole di calore; Los Angeles ha più parchi privati","Los Angeles ha altissima dipendenza dall'auto con emissioni di CO₂ pro capite molto superiori; Bologna permette mobilità pedonale, ciclistica e su mezzi pubblici","Bologna ha più traffico e congestione perché le strade sono strette; Los Angeles scorre meglio","Non ci sono differenze significative perché entrambe usano combustibili fossili per riscaldamento e trasporti"],1,"La città compatta (Bologna) permette spostamenti a piedi, in bici, sui mezzi pubblici: emissioni di CO₂ pro capite per mobilità molto inferiori. La città dispersa (Los Angeles) costringe quasi ogni spostamento all'auto privata: emissioni pro capite elevatissime. La forma urbana determina i comportamenti di mobilità e l'impatto ambientale.",["Non è corretto. Sebbene la differenza nella struttura del verde esista, il principale impatto ambientale differenziale è il consumo energetico e le emissioni legate alla mobilità.","Esatto! Nella città dispersa ogni spostamento richiede l'auto: emissioni pro capite elevate. Nella città compatta si cammina, si va in bici, si usano i mezzi: emissioni pro capite molto inferiori.","Non è corretto. Los Angeles ha una delle peggiori congestioni al mondo proprio perché costruita sulla dipendenza dall'auto. Le strade larghe non risolvono la congestione: l'inducono.","Non è corretto. Le differenze sono molto significative: a Los Angeles quasi il 100% degli spostamenti avviene in auto; a Bologna una quota rilevante avviene a piedi, in bici o in bus/treno."]],["Perché il PRG è definito 'un atto politico oltre che tecnico'?",["Perché i tecnici che lo redigono vengono nominati direttamente dal partito di governo","Perché determina chi può costruire dove, influenzando interessi economici enormi e richiedendo scelte valoriali su come deve crescere la città","Perché viene approvato solo dopo le elezioni comunali per rispecchiare la volontà elettorale","Perché contiene le regole per le elezioni delle commissioni edilizie comunali"],1,"Il PRG è politico perché stabilisce dove si può costruire (il terreno edificabile vale molto di più di quello agricolo) e dove no. Queste scelte hanno conseguenze economiche enormi per proprietari, costruttori, imprese. Sono anche scelte valoriali: che città vogliamo? Compatta o dispersa? Con più verde o più edifici? Queste domande sono scelte politiche, non solo tecniche.",["Non è corretto. I tecnici sono professionisti (urbanisti, ingegneri) nominati per competenza. La natura politica del PRG è diversa e più strutturale.","Esatto! Il PRG stabilisce dove si può costruire (aumenta enormemente il valore del terreno) e dove no, e quali funzioni dove. Questi sono interessi economici enormi e scelte valoriali su come deve essere la città: rendono il PRG inevitabilmente un atto politico.","Non è corretto. Il PRG non è legato al ciclo elettorale: è uno strumento di pianificazione che dura decenni. La sua approvazione segue un iter tecnico-politico indipendente dal calendario elettorale.","Non è corretto. Il PRG non contiene regole elettorali. La politicità del PRG riguarda le scelte sull'uso del territorio."]],["Una città vuole 'riqualificare' un quartiere degradato. Quali rischi sociali deve considerare oltre agli aspetti fisici?",["Il rischio che i nuovi edifici non rispettino l'estetica del contesto storico circostante","Il rischio di gentrificazione: la riqualificazione aumenta i valori immobiliari espellendo i residenti storici con redditi bassi","Il rischio che la riqualificazione aumenti il turismo di massa rovinando la vita di quartiere","Il rischio che i nuovi edifici producano ombre sugli edifici esistenti riducendone il valore"],1,"La riqualificazione fisica di un quartiere degradato ne aumenta l'attrattività e i valori immobiliari. Il rischio di gentrificazione è che i residenti storici con redditi bassi non riescano più a permettersi di vivere nel quartiere migliorato: vengono espulsi verso periferie più distanti dai servizi. La riqualificazione fisica deve essere accompagnata da politiche di housing sociale.",["Non è corretto. Il rispetto estetico è una preoccupazione urbanistica reale, ma il rischio sociale principale della riqualificazione è diverso e coinvolge le persone che ci vivono.","Esatto! La gentrificazione è il rischio principale: quando un quartiere migliora, gli affitti e i prezzi salgono, i residenti storici (spesso a reddito basso) non possono permetterseli più e vengono espulsi verso periferie più lontane.","Non è corretto. Il turismo di massa è un problema reale in alcune città, ma il rischio sociale più immediato e sistematico della riqualificazione urbana è la gentrificazione.","Non è corretto. Le distanze e le altezze massime nel PRG esistono anche per questo. Ma il rischio sociale principale della riqualificazione non è l'ombreggiamento."]],["Una studentessa analizza il suo quartiere con Google Maps e trova: nessuna pista ciclabile, nessun parco nel raggio di 500 m, supermercato a 2 km senza mezzi pubblici. Che valutazione urbanistica fa?",["Il quartiere è ben pianificato perché le case sono in buone condizioni e le strade sono asfaltate","Il quartiere ha un deficit di servizi di prossimità e mobilità alternativa: sfavorisce chi non ha l'auto e non rispetta i principi della città dei 15 minuti","Il quartiere è accettabile perché il supermercato è raggiungibile in auto in pochi minuti","Il quartiere rispetta la zonizzazione residenziale: non ci sono industrie, quindi è sicuro"],1,"Un quartiere senza piste ciclabili, senza verde entro 500 m e con servizi raggiungibili solo in auto non rispetta i principi della città di prossimità ('città dei 15 minuti'). Sfavorisce chi non ha l'auto (bambini, anziani, persone a basso reddito). È un indicatore di pianificazione urbana car-centric inadatta a una mobilità sostenibile.",["Non è corretto. Le condizioni fisiche degli edifici e delle strade non sono indicatori di pianificazione urbanistica di qualità. I servizi e la mobilità sono i criteri giusti.","Esatto! Un quartiere senza piste ciclabili, verde entro 500 m e servizi raggiungibili a piedi/mezzi non rispetta i principi della città di prossimità. Sfavorisce sistematicamente chi non ha l'auto.","Non è corretto. La dipendenza dall'auto non è un indicatore positivo di qualità urbana. Un quartiere ben pianificato permette di svolgere le attività quotidiane senza auto.","Non è corretto. L'assenza di industrie è solo uno degli aspetti. Un quartiere residenziale di qualità deve anche avere accessibilità pedonale ai servizi, verde pubblico, mobilità alternativa."]],["Il piano regolatore è strumento di prevenzione dei conflitti urbani. Quale conflitto storico ha dimostrato che la salute pubblica dipende dalla pianificazione?",["Il conflitto tra proprietari di veicoli e pedoni per lo spazio stradale nelle città medievali","Le epidemie di colera del XIX secolo nelle città industriali sovraffollate senza fognature e acquedotti","La crisi del traffico automobilistico degli anni '60 che portò alla costruzione delle prime autostrade urbane","I conflitti tra residenti e industrie rumorose nel dopoguerra che portarono allo zoning funzionale"],1,"Le epidemie di colera del XIX secolo (Londra 1854, Napoli 1884) nelle città industriali sovraffollate hanno dimostrato che la salute pubblica dipende dall'ambiente fisico: acqua contaminata, fognature inesistenti, sovraffollamento. Questa comprensione ha spinto alla pianificazione sistematica di fognature, acquedotti, verde pubblico: le fondamenta dell'urbanistica moderna.",["Non è corretto. Il conflitto auto-pedone è moderno (XX secolo). Il conflitto storico che ha dimostrato il legame pianificazione-salute è molto più drammatico.","Esatto! Il colera a Londra (1854), Napoli (1884) e in altre città industriali ha dimostrato che senza pianificazione delle infrastrutture igieniche (fognature, acquedotti) le malattie si diffondono in modo sistemico. La pianificazione urbanistica nasce anche come risposta sanitaria.","Non è corretto. Le autostrade urbane sono un esempio di risposta a un problema di mobilità, non di salute pubblica. Il legame tra pianificazione e salute pubblica è stato dimostrato nel XIX secolo dal colera.","Non è corretto. Lo zoning ha ridotto i conflitti tra usi incompatibili, ma non è stato il primo motore della pianificazione urbana moderna. Il colera del XIX secolo è stato il catalizzatore principale."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
