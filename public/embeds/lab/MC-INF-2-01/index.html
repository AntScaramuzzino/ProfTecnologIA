<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Sei il sistema operativo</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

(function(){

    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-INF-2-01","F":[["Qual è la funzione principale di un sistema operativo?",["Gestire le risorse hardware e permettere ai programmi applicativi di funzionare","Proteggere il computer dai virus informatici e dal malware","Connettersi automaticamente a internet e aggiornare i programmi installati","Produrre l'output visivo sullo schermo per tutte le applicazioni"],0,"Il sistema operativo (OS) è il software di base che fa da intermediario tra l'hardware (componenti fisici del computer) e i programmi applicativi (browser, editor, giochi). Le sue quattro funzioni principali sono: gestione processi, gestione memoria, gestione file system, gestione periferiche tramite driver.",["Esatto! Il sistema operativo è lo strato software che si trova tra l'hardware (componenti fisici) e i programmi applicativi. Gestisce processore, memoria, file e periferiche, consentendo a più programmi di funzionare senza conflitti.","Non è corretto. La protezione dai virus è compito dei software antivirus, non del sistema operativo in senso stretto. Il sistema operativo gestisce le risorse hardware e permette ai programmi di funzionare — la sicurezza è solo una delle sue tante funzioni.","Non è corretto. La connessione a internet e gli aggiornamenti sono servizi specifici che il sistema operativo può offrire, ma non sono la sua funzione principale. Il ruolo fondamentale dell'OS è fare da intermediario tra hardware e software.","Non è corretto. La visualizzazione sullo schermo avviene attraverso il driver della scheda grafica e le API del sistema operativo, ma non è la funzione principale dell'OS. Il sistema operativo gestisce processore, memoria, file system e tutte le periferiche."]],["Chi ha creato CP/M, il primo sistema operativo diffuso per personal computer, e in quale anno?",["Bill Gates di Microsoft nel 1981","Steve Jobs di Apple nel 1977","Gary Kildall di Digital Research nel 1974","Linus Torvalds nel 1991"],2,"Gary Kildall (1942–1994) ha creato CP/M (Control Program for Microcomputers) nel 1974 per la sua azienda Digital Research. CP/M è stato il primo sistema operativo ampiamente adottato per i microcomputer degli anni '70 e '80. La storia di come IBM scelse MS-DOS invece di CP/M per il PC IBM è uno degli episodi più controversi della storia dell'informatica.",["Non è corretto. Bill Gates ha fondato Microsoft e ha commercializzato MS-DOS nel 1981, ma CP/M è precedente. Il primo OS per PC è CP/M, creato da Gary Kildall nel 1974.","Non è corretto. Steve Jobs ha co-fondato Apple e ha contribuito allo sviluppo dell'Apple II (1977), ma CP/M è stato creato da Gary Kildall per Digital Research nel 1974, tre anni prima.","Esatto! Gary Kildall ha creato CP/M (Control Program for Microcomputers) nel 1974 per Digital Research. È stato il primo sistema operativo ampiamente diffuso per microcomputer, ed è diventato lo standard de facto fino all'arrivo di MS-DOS nel 1981.","Non è corretto. Linus Torvalds ha creato il kernel Linux nel 1991. CP/M è molto più antico: è del 1974. Linux è arrivato 17 anni dopo CP/M."]],["Cos'è il kernel di un sistema operativo?",["L'interfaccia grafica che l'utente vede e usa ogni giorno","Il programma installato per primo su un computer nuovo","Il nucleo del sistema operativo che gestisce direttamente le risorse hardware","Il database in cui il sistema operativo salva le impostazioni dell'utente"],2,"Il kernel è il nucleo del sistema operativo: il componente più vicino all'hardware, che gira con i massimi privilegi di sistema. Gestisce i processi (scheduling della CPU), la memoria RAM (allocazione e protezione), le periferiche (tramite driver) e il file system. È il primo componente del SO caricato in memoria all'avvio e vi rimane per tutta la sessione.",["Non è corretto. L'interfaccia grafica (GUI) è il livello visivo con cui l'utente interagisce: finestre, icone, menu. Il kernel è il nucleo nascosto dell'OS che gestisce direttamente l'hardware, invisibile all'utente.","Non è corretto. Il primo programma che si carica all'avvio è il BIOS/UEFI, non il kernel. Il kernel è il nucleo del sistema operativo che gestisce direttamente le risorse hardware: processore, memoria, periferiche.","Esatto! Il kernel è il nucleo dell'OS: il componente più vicino all'hardware. Gestisce l'allocazione della CPU tra i processi, la memoria RAM, l'accesso alle periferiche tramite driver. È il primo programma che si carica dopo il BIOS e rimane in memoria durante tutta la sessione.","Non è corretto. Il database delle impostazioni si chiama 'registro di sistema' in Windows o 'file di configurazione' in Linux. Il kernel è il nucleo del sistema operativo che gestisce hardware e risorse di sistema."]],["Cosa si intende per 'multitasking' in un sistema operativo?",["La possibilità di collegare più monitor allo stesso computer","La capacità del sistema operativo di eseguire più programmi contemporaneamente condividendo le risorse","La funzione che permette di salvare più file contemporaneamente su un disco","La capacità di un processore di eseguire più istruzioni nella stessa operazione"],1,"Il multitasking è la capacità del sistema operativo di eseguire più programmi 'contemporaneamente'. Su un singolo core, la CPU in realtà esegue un solo processo per volta, ma li alterna molto rapidamente (ogni pochi millisecondi) assegnando a ciascuno una 'fetta di tempo' (time slice). Il sistema operativo gestisce questa rotazione tramite lo scheduler, che decide l'ordine e la durata di esecuzione di ogni processo.",["Non è corretto. Collegare più monitor è una funzionalità hardware, non multitasking. Il multitasking riguarda l'esecuzione concorrente di più programmi, non la gestione dei display.","Esatto! Il multitasking permette di eseguire più programmi 'contemporaneamente'. In realtà su un solo core la CPU li esegue uno alla volta, ma li alterna così rapidamente (a fettine di tempo chiamate 'time slice') che sembrano simultanei all'utente.","Non è corretto. Salvare file è una funzione del file system, non il multitasking. Il multitasking riguarda l'esecuzione concorrente di più processi (programmi in esecuzione).","Non è corretto. Eseguire più istruzioni nella stessa operazione si chiama 'pipelining' o 'parallelismo a livello di istruzione' e riguarda l'architettura del processore, non il multitasking dell'OS. Il multitasking gestisce la condivisione della CPU tra più processi."]],["Quale dei seguenti è un sistema operativo per dispositivi mobili?",["Windows 11","macOS Sequoia","Android","Ubuntu"],2,"I principali sistemi operativi per dispositivi mobili sono Android (Google, basato su kernel Linux, open source per i produttori) e iOS (Apple, solo per iPhone). Per desktop/laptop: Windows (Microsoft), macOS (Apple), Linux (open source). Per server: prevalentemente Linux e Windows Server.",["Non è corretto. Windows 11 è un sistema operativo per computer desktop e laptop, sviluppato da Microsoft. Per dispositivi mobili Windows ha avuto Windows Phone (oggi dismesso), ma Windows 11 è destinato ai PC.","Non è corretto. macOS è il sistema operativo per i computer Mac di Apple (iMac, MacBook). Per iPhone e iPad Apple usa iOS e iPadOS — sistemi operativi distinti e ottimizzati per dispositivi touch.","Esatto! Android è il sistema operativo per dispositivi mobili sviluppato da Google (basato sul kernel Linux). È il sistema operativo mobile più diffuso al mondo, usato dalla maggior parte degli smartphone e tablet non Apple.","Non è corretto. Ubuntu è una distribuzione Linux sviluppata da Canonical per desktop e server. Per i dispositivi mobili esistono versioni sperimentali di Ubuntu Touch, ma non è un sistema operativo mobile mainstream."]],["Cosa significa 'interfaccia CLI' in un sistema operativo?",["Un'interfaccia con finestre, icone e menu gestiti col mouse","Un'interfaccia testuale dove l'utente digita comandi e riceve risposte in testo","Un sistema di aggiornamento automatico del sistema operativo","Il linguaggio di programmazione usato per scrivere il sistema operativo"],1,"CLI (Command Line Interface) è l'interfaccia a riga di comando: l'utente interagisce col sistema digitando comandi testuali (es. nel terminale di Linux/macOS o nel prompt dei comandi di Windows) e riceve risposte in formato testo. GUI (Graphical User Interface) usa invece finestre, icone e mouse. La CLI è meno intuitiva ma più potente per automazione, scripting e controllo fine del sistema.",["Non è corretto. Quella descritta è la GUI (Graphical User Interface). La CLI è l'interfaccia a riga di comando: l'utente digita comandi testuali e riceve risposte in testo.","Esatto! CLI (Command Line Interface) è l'interfaccia a riga di comando: l'utente digita comandi testuali (es. 'ls', 'cd', 'mkdir') e il sistema risponde con testo. È meno intuitiva della GUI ma più potente per automazione e scripting.","Non è corretto. Gli aggiornamenti automatici sono una funzionalità specifica del sistema operativo. CLI (Command Line Interface) è un tipo di interfaccia utente — il modo in cui l'utente interagisce con il sistema tramite comandi testuali.","Non è corretto. Il linguaggio di programmazione usato per i sistemi operativi è tipicamente C o C++. CLI (Command Line Interface) è un tipo di interfaccia utente, non un linguaggio di programmazione."]]],"I":[["Come gestisce il sistema operativo la situazione in cui la RAM è esaurita?",["Spegne automaticamente i processi che usano più memoria per liberare spazio","Usa parte dello storage (SSD/HDD) come memoria virtuale (swap) per estendere la RAM disponibile","Chiede all'utente di inserire un modulo RAM aggiuntivo prima di continuare","Copia l'intera RAM su un file di backup e la svuota completamente"],1,"Quando la RAM è piena, il sistema operativo usa la memoria virtuale (swap/file di paging): sposta i dati dei processi meno attivi dalla RAM allo storage (SSD o HDD) e carica in RAM i dati necessari ai processi attivi. Il sistema appare come se avesse più RAM di quella fisica disponibile, ma è molto più lento perché gli SSD sono 10-100 volte più lenti della RAM, gli HDD ancora di più.",["Non è corretto. Spegnere i processi arbitrariamente causerebbe perdita di dati. Il sistema operativo usa principalmente lo swap (memoria virtuale): sposta parti di memoria RAM sull'archiviazione di massa per liberare RAM, senza terminare i processi.","Esatto! Quando la RAM è esaurita, il sistema operativo usa lo swap (o file di paging): sposta i dati dei processi inattivi dalla RAM allo storage (SSD/HDD) per liberare spazio. Questo rallenta il sistema (lo storage è molto più lento della RAM) ma permette di eseguire più programmi di quanta RAM fisica sia disponibile.","Non è corretto. Il sistema operativo non può chiedere hardware aggiuntivo in tempo reale. Gestisce la carenza di RAM tramite meccanismi software come lo swap o la memoria virtuale, senza richiedere intervento fisico.","Non è corretto. Il sistema operativo non svuota l'intera RAM: gestirebbe ogni processo perdendo lo stato di tutti i programmi aperti. Lo swap sposta selettivamente solo le parti di memoria dei processi temporaneamente inattivi."]],["Come è organizzato il file system di un sistema operativo moderno?",["In una lista piatta di file tutti allo stesso livello senza cartelle","In una struttura ad albero gerarchica con cartelle annidate che partono da una directory radice","In un database relazionale con tabelle e chiavi primarie per ogni file","In ordine cronologico di creazione, con i file più vecchi archiviati automaticamente"],1,"Il file system è organizzato ad albero gerarchico: una directory radice (in Windows 'C:\\', in Linux e macOS '/') contiene cartelle (directory) che possono contenere altre cartelle e file. Ogni file ha: un nome, un percorso (path) che indica la sua posizione nell'albero, metadati (data creazione, dimensione, permessi) e il contenuto effettivo. I permessi di lettura/scrittura/esecuzione controllano chi può accedere a ogni file.",["Non è corretto. Una struttura piatta sarebbe impossibile da navigare con milioni di file. I file system moderni usano una struttura ad albero gerarchica: cartelle che contengono file e altre cartelle, con una directory radice al vertice.","Esatto! Il file system è organizzato ad albero: una directory radice (in Windows 'C:\\', in Linux '/') contiene cartelle, che possono contenere altre cartelle e file. Il percorso (path) di un file descrive il cammino dalla radice fino al file stesso.","Non è corretto. I database relazionali sono usati per dati strutturati delle applicazioni. Il file system ha una propria struttura ad albero gerarchica, distinta dai database. Alcuni file system moderni usano concetti simili ai database per i metadati, ma la struttura di base è ad albero.","Non è corretto. L'ordine cronologico è uno dei possibili criteri di visualizzazione, non la struttura del file system. Il file system è organizzato ad albero gerarchico, indipendentemente dalla data di creazione dei file."]],["Cosa fa un driver nel sistema operativo?",["Protegge il computer da virus che si nascondono nei dispositivi USB","Traduce i comandi generici del sistema operativo in istruzioni specifiche per un dispositivo hardware","Gestisce la velocità del processore in base al carico di lavoro","Comprime i file prima di salvarli sull'archiviazione di massa"],1,"Un driver è un software che fa da traduttore tra il sistema operativo e un dispositivo hardware specifico. Il sistema operativo parla un linguaggio generico; ogni periferica (stampante, scheda grafica, tastiera, mouse, webcam) ha le sue istruzioni proprietarie. Il driver traduce le richieste generiche dell'OS in comandi specifici comprensibili dal dispositivo. Per questo motivo collegare una nuova periferica richiede spesso di installare il suo driver.",["Non è corretto. La protezione da virus è compito del software antivirus. Un driver è un programma che permette al sistema operativo di comunicare con una specifica periferica hardware (stampante, scheda grafica, tastiera ecc.).","Esatto! Un driver è un software che fa da traduttore tra il sistema operativo e un dispositivo hardware specifico. Il sistema operativo invia comandi generici ('stampa questo documento'); il driver li traduce nelle istruzioni specifiche che la stampante capisce.","Non è corretto. La gestione della velocità del processore (scaling della frequenza) è compito del kernel e del gestore dell'alimentazione. Un driver gestisce la comunicazione tra OS e un dispositivo hardware specifico.","Non è corretto. La compressione dei file è una funzione del file system o di programmi specifici. Un driver gestisce la comunicazione tra il sistema operativo e un dispositivo hardware (stampante, scheda grafica, tastiera, mouse ecc.)."]],["Come funziona il multitasking su un computer con un singolo core di CPU?",["Il processore esegue tutti i processi nello stesso momento dividendo la sua potenza","Il sistema operativo alterna rapidamente tra i processi, assegnando a ciascuno una fetta di tempo (time slice)","I processi aspettano in fila e vengono eseguiti uno alla volta completamente prima del successivo","Il sistema operativo usa la RAM al posto della CPU per eseguire i processi in parallelo"],1,"Su un singolo core CPU, il multitasking è implementato tramite time-sharing: lo scheduler del kernel assegna a ogni processo una fetta di tempo (time slice, tipicamente 1-50 ms), poi passa al processo successivo. Ogni processo conserva il proprio 'contesto' (stato dei registri, stack, variabili) mentre aspetta. La velocità di alternanza (centinaia di volte al secondo) crea l'illusione di esecuzione simultanea.",["Non è corretto. Un singolo core non può fisicamente eseguire più istruzioni simultaneamente. Il multitasking simula la simultaneità alternando rapidamente tra i processi: ogni processo riceve una 'fetta di tempo' (time slice) di pochi millisecondi.","Esatto! Su un singolo core, il processore esegue un solo processo alla volta. Lo scheduler del sistema operativo alterna tra i processi ogni pochi millisecondi (time slice). La velocità di alternanza è tale che all'utente sembra che i programmi girino simultaneamente.","Non è corretto. Quella descritta è l'esecuzione batch (sequenziale), non il multitasking. Nel multitasking i processi si alternano rapidamente e nessuno aspetta che un altro finisca completamente prima di avere accesso alla CPU.","Non è corretto. La RAM è memoria, non un'unità di calcolo. Il calcolo avviene sempre nella CPU. Il multitasking è gestito dallo scheduler del sistema operativo, che alterna l'accesso alla CPU tra i processi."]],["Qual è la principale differenza tra Windows e Linux come sistemi operativi?",["Windows funziona solo su PC, Linux funziona solo su server","Windows è un software proprietario a pagamento di Microsoft; Linux è open source e liberamente distribuibile","Windows è più sicuro di Linux perché ha più aggiornamenti di sicurezza","Linux non ha un'interfaccia grafica, Windows sì"],1,"Windows (Microsoft): software proprietario, codice sorgente chiuso, licenza a pagamento, mercato prevalentemente consumer e aziendale desktop. Linux: open source (kernel rilasciato da Linus Torvalds nel 1991), codice pubblico, gratuito, altamente configurabile. Linux domina i server web (>90% dei server internet), i supercomputer (100% dei top 500), i sistemi embedded e i dispositivi Android.",["Non è corretto. Linux funziona su una gamma enorme di dispositivi: desktop, server, smartphone (Android è basato su Linux), router, dispositivi embedded. Windows funziona prevalentemente su PC e server, ma la distinzione non è assoluta.","Esatto! Windows è sviluppato da Microsoft, è software proprietario (il codice sorgente non è pubblico) e richiede l'acquisto di una licenza. Linux è open source: il codice sorgente è pubblico, liberamente modificabile e distribuibile. È sviluppato collaborativamente da una comunità globale.","Non è corretto. Linux è generalmente considerato più sicuro per i server, specialmente perché il codice sorgente è pubblico e esaminato da milioni di sviluppatori. Gli aggiornamenti di sicurezza esistono in entrambi i sistemi.","Non è corretto. Linux ha molte interfacce grafiche (GNOME, KDE, Xfce ecc.), alcune paragonabili a Windows in termini di usabilità. La differenza principale riguarda la natura del software (proprietario vs open source), non la presenza di GUI."]],["Perché un dispositivo smette di funzionare correttamente quando il suo driver non è compatibile con il sistema operativo?",["Perché il driver incompatibile usa troppa RAM e rallenta il sistema","Perché senza il driver corretto il sistema operativo non sa come comunicare con quel dispositivo specifico","Perché i driver incompatibili cancellano automaticamente i file del dispositivo","Perché il sistema operativo blocca automaticamente tutti i driver non aggiornati"],1,"Il driver è l'unico 'traduttore' tra le chiamate generiche del sistema operativo e i comandi specifici del dispositivo hardware. Se il driver non è compatibile con la versione del sistema operativo (es. un driver per Windows 10 su Windows 11), le interfacce di programmazione potrebbero essere cambiate e il driver non riesce più a fare la traduzione correttamente. Il dispositivo risulta 'sconosciuto' o non funzionante.",["Non è corretto. Il consumo di RAM non è la causa principale. Un driver incompatibile non riesce a tradurre correttamente le comunicazioni tra OS e hardware: il dispositivo non riceve le istruzioni giuste o le riceve in formato incomprensibile.","Esatto! Il driver è l'unico traduttore tra le richieste generiche del SO e i comandi specifici del dispositivo. Se il driver è incompatibile, il SO invia comandi in un 'dialetto' sbagliato che il dispositivo non capisce, oppure riceve risposte che non sa interpretare. Risultato: il dispositivo non funziona o viene ignorato.","Non è corretto. I driver non gestiscono i file utente e non li cancellano. Un driver incompatibile causa problemi di comunicazione tra OS e hardware, non perdita di dati.","Non è corretto. Il sistema operativo non blocca i driver solo perché non aggiornati — verifica la compatibilità con la versione del kernel. Un driver incompatibile crea problemi di comunicazione tra OS e dispositivo."]]],"A":[["Perché il sistema operativo è necessario come strato intermedio tra hardware e software applicativo? Cosa succederebbe senza di esso?",["Senza OS i programmi sarebbero più veloci perché accederebbero direttamente all'hardware senza intermediari","Senza OS ogni programma dovrebbe gestire l'hardware direttamente, rendendo impossibile la compatibilità e la condivisione delle risorse","Senza OS il computer non potrebbe essere spento correttamente e perderebbe tutti i dati","Senza OS il computer avrebbe bisogno di più RAM per funzionare"],1,"L'OS risolve tre problemi fondamentali: 1) Astrazione: offre alle applicazioni un'interfaccia uniforme indipendentemente dall'hardware sottostante (es. 'scrivi su file' funziona uguale su SSD Samsung o HDD WD). 2) Isolamento: impedisce che i processi si sovrappongano in memoria o interferiscano tra loro. 3) Condivisione: gestisce l'accesso ordinato alle risorse condivise (CPU, RAM, disco, rete) tra processi multipli.",["Non è corretto. Senza OS ogni programma dovrebbe includere al suo interno tutto il codice per gestire CPU, memoria, disco, schermo — moltiplicate per ogni combinazione hardware esistente. Il risultato sarebbe programmi enormi, incompatibili tra loro e impossibili da mantenere. L'OS è un'astrazione necessaria.","Esatto! Senza OS: ogni programma dovrebbe contenere driver per ogni possibile hardware; due programmi non potrebbero condividere la RAM senza sovrapporsi; non ci sarebbe protezione tra i processi; ogni applicazione dovrebbe reimplementare accesso al disco, rete, schermo ecc. L'OS risolve tutti questi problemi offrendo un'interfaccia comune e controllando l'accesso alle risorse.","Non è corretto. Lo spegnimento sicuro è una funzionalità utile dell'OS, ma non è la ragione fondamentale per cui un OS è necessario. La ragione principale è la gestione delle risorse condivise e l'astrazione dell'hardware per i programmi applicativi.","Non è corretto. La quantità di RAM dipende dalle applicazioni usate, non dall'assenza dell'OS. Senza OS il problema fondamentale è l'impossibilità di gestire hardware diverse e risorse condivise in modo sicuro e compatibile."]],["Come protegge il sistema operativo la memoria di un processo da quella di un altro processo che gira contemporaneamente?",["Assegna a ogni processo una 'memoria virtuale' separata e controlla ogni accesso tramite il kernel","Cifra la memoria di ogni processo così che gli altri non possano leggerla","Avvia ogni processo su un core di CPU diverso così che non condividano la stessa memoria","Riavvia automaticamente il computer ogni volta che un processo tenta di accedere alla memoria di un altro"],0,"Il sistema operativo usa la memoria virtuale per isolare i processi: ogni processo riceve uno spazio di indirizzi virtuali privato (es. da 0 a 4 GB). La MMU (Memory Management Unit, un componente hardware del processore) traduce ogni indirizzo virtuale in indirizzo fisico reale, in base alle tabelle gestite dal kernel. Se un processo tenta di accedere a un indirizzo fuori dal suo spazio virtuale, la MMU genera un'eccezione di protezione e il kernel termina il processo.",["Esatto! Ogni processo riceve un spazio di memoria virtuale privato: il processo 'crede' di avere accesso a tutta la memoria, ma in realtà il kernel mappa indirizzi virtuali su indirizzi fisici reali. Se un processo tenta di accedere alla memoria di un altro, il kernel genera un 'segmentation fault' e termina il processo colpevole.","Non è corretto. La cifratura della memoria è una tecnica di sicurezza opzionale, non il meccanismo principale di protezione della memoria. Il sistema operativo usa la memoria virtuale e la MMU (Memory Management Unit) per isolare i processi.","Non è corretto. Avere core diversi non isola automaticamente la memoria: su architetture multicore i processi condividono comunque la stessa RAM fisica. L'isolamento è garantito dalla memoria virtuale e dai permessi gestiti dal kernel, non dalla distribuzione sui core.","Non è corretto. Un riavvio per ogni violazione di memoria renderebbe il sistema inutilizzabile. Il kernel termina solo il processo che ha tentato l'accesso non autorizzato (con un errore 'segmentation fault'), lasciando il resto del sistema operativo funzionante."]],["Perché Linux domina il mercato dei server web (oltre il 90% dei server internet) rispetto a Windows Server?",["Perché Linux è più facile da usare per gli amministratori di sistema","Perché è gratuito, open source, altamente stabile, personalizzabile e ha un ecosistema di strumenti server maturi","Perché Microsoft non vende Windows Server, solo Windows per desktop","Perché Linux è l'unico sistema operativo che supporta la connessione a internet"],1,"Linux domina i server web per una combinazione di fattori: 1) Costo: nessuna licenza (Windows Server costa centinaia di €/anno per macchina). 2) Stabilità: sistemi Linux con uptime di anni senza riavvio. 3) Leggerezza: può girare senza GUI, usando meno risorse. 4) Personalizzabilità: si può ottimizzare esattamente per il workload specifico. 5) Ecosistema: Apache, Nginx, MySQL, PostgreSQL, Docker sono nativamente Linux. 6) Sicurezza: codice open source esaminato da milioni di sviluppatori.",["Non è corretto. Linux richiede una curva di apprendimento più ripida rispetto a Windows, specialmente per la gestione via CLI. I vantaggi di Linux sui server sono altri: costo zero, stabilità, personalizzabilità, sicurezza e un ecosistema di strumenti open source.","Esatto! Linux sui server offre: costo zero (nessuna licenza), open source (codice ispezionabile e personalizzabile), stabilità elevata (uptime di anni senza riavvii), leggerezza (può girare senza GUI), vasto ecosistema di strumenti server gratuiti (Apache, Nginx, MySQL, PostgreSQL) e una comunità di supporto globale.","Non è corretto. Microsoft vende Windows Server come prodotto separato e ha una quota significativa del mercato server (specialmente in ambienti aziendali con Active Directory). Ma Linux domina i server web pubblici per i vantaggi sopra descritti.","Non è corretto. Tutti i sistemi operativi moderni supportano la connessione a internet. Linux domina i server per ragioni economiche (gratuito), tecniche (stabile, leggero) e di ecosistema (strumenti open source maturi)."]],["Come gestisce lo scheduler del sistema operativo le priorità tra processi? Quale problema deve evitare?",["Assegna sempre tutta la CPU al processo che ha usato meno tempo in totale, per garantire equità assoluta","Assegna livelli di priorità ai processi e garantisce più tempo CPU a quelli più importanti, evitando la 'starvation' dei processi a bassa priorità","Lascia che ogni processo richieda alla CPU esattamente il tempo che gli serve, senza limiti","Spegne tutti i processi meno prioritari quando il sistema è sotto carico elevato"],1,"Lo scheduler del kernel assegna priorità ai processi e usa algoritmi per decidere quale processo eseguire e per quanto tempo. Il problema critico da evitare è la 'starvation': un processo a bassa priorità che attende indefinitamente perché quelli ad alta priorità occupano sempre la CPU. La soluzione tipica è l'aging: la priorità di un processo aumenta proporzionalmente al tempo trascorso in attesa, garantendo che prima o poi ogni processo venga eseguito.",["Non è corretto. Una politica di 'equità assoluta' ignora le priorità: un processo critico (es. driver audio) potrebbe essere ritardato da un processo in background (es. backup). Gli scheduler reali bilanciano priorità, equità e reattività.","Esatto! Lo scheduler assegna priorità (es. processi kernel > processi interattivi > processi in background). Il problema da evitare è la 'starvation': un processo a bassa priorità che non riceve mai la CPU perché i processi ad alta priorità la monopolizzano. Gli scheduler moderni usano tecniche come l'invecchiamento (aging) per aumentare gradualmente la priorità dei processi in attesa da troppo tempo.","Non è corretto. Se i processi potessero usare la CPU senza limiti, un singolo processo potrebbe bloccare l'intero sistema. Lo scheduler preemptivo interrompe i processi che superano il loro time slice, anche contro la loro volontà.","Non è corretto. Spegnere processi è una misura estrema (il 'killer OOM' lo fa solo in casi critici di memoria). Lo scheduler gestisce le priorità allocando il tempo CPU proporzionalmente, non terminando i processi meno prioritari."]],["Perché i sistemi operativi mobile (iOS, Android) impongono restrizioni più rigide all'accesso hardware rispetto ai sistemi desktop?",["Perché i processori dei telefoni sono troppo deboli per gestire accessi hardware diretti","Per ragioni di sicurezza (sandbox delle app), stabilità e ottimizzazione della durata della batteria","Perché le leggi sulla privacy vietano alle app mobile di accedere all'hardware","Perché i telefoni non hanno un kernel come i computer desktop"],1,"I sistemi mobile usano il modello 'sandbox' (isolamento delle app): ogni app gira in un ambiente confinato e deve richiedere esplicite autorizzazioni per accedere a risorse sensibili (fotocamera, microfono, GPS, contatti, posizione). Questo design: 1) limita i danni di app malevole; 2) dà all'utente il controllo su cosa ogni app può fare; 3) ottimizza il consumo energetico impedendo ad app in background di accedere continuamente all'hardware; 4) garantisce la stabilità del sistema.",["Non è corretto. I processori moderni degli smartphone sono potenti quanto molti laptop. Le restrizioni non dipendono dalla potenza del processore, ma da scelte architetturali deliberate per sicurezza e durata della batteria.","Esatto! Nei sistemi mobile ogni app è eseguita in una 'sandbox' (ambiente isolato) con accesso limitato a risorse di sistema. Questo impedisce a un'app malevola di leggere i dati di un'altra app o controllare hardware sensibile (microfono, GPS, fotocamera) senza esplicita autorizzazione. Limita anche il consumo energetico, estendendo la durata della batteria.","Non è corretto. Le leggi sulla privacy (es. GDPR) impongono obblighi sul trattamento dei dati personali, non limitano direttamente l'architettura del sistema operativo. Le restrizioni di iOS e Android sono scelte tecniche, non obblighi legali.","Non è corretto. iOS è basato su XNU (un kernel derivato da Mach/BSD Unix) e Android è basato sul kernel Linux — lo stesso kernel dei computer desktop. Le restrizioni sono scelte architetturali deliberate, non conseguenza dell'assenza del kernel."]],["Un server web riceve 10.000 richieste al secondo da utenti diversi. Quale funzionalità del sistema operativo è più critica per gestire questo carico?",["La gestione dell'interfaccia grafica, per mostrare le risposte agli utenti in modo visivo","La gestione concorrente dei processi/thread e delle connessioni di rete, per servire migliaia di richieste simultanee senza blocchi","La gestione del risparmio energetico, per ridurre la bolletta del datacenter","La gestione del file system, per leggere rapidamente i file HTML dal disco"],1,"Un server web ad alto traffico dipende criticamente dal sistema operativo per: 1) Gestione concorrente: creare e schedulare migliaia di thread/processi; 2) Network stack: gestire connessioni TCP concorrenti (apertura, trasmissione, chiusura); 3) Allocazione memoria: allocare/deallocare memoria rapidamente per ogni richiesta; 4) I/O asincrono (epoll su Linux): permettere a un singolo thread di gestire migliaia di connessioni simultanee senza bloccarsi. È per questo che i server ad alto traffico usano quasi universalmente Linux: il suo kernel è ottimizzato per questo tipo di carico.",["Non è corretto. I server web producono risposte HTTP (testo, HTML, JSON) indipendentemente da qualsiasi interfaccia grafica. I server di produzione tipicamente girano senza GUI per risparmiare risorse. La funzionalità critica è la gestione dei processi/thread e della rete.","Esatto! Con 10.000 richieste/secondo il SO deve: creare e gestire thread/processi per ogni richiesta (o usare I/O asincrono), allocare e deallocare memoria rapidamente, gestire migliaia di connessioni TCP simultanee tramite il network stack del kernel, schedulare i processi in modo efficiente per minimizzare la latenza di risposta.","Non è corretto. Il risparmio energetico è importante ma non è la funzionalità critica per gestire 10.000 richieste/secondo. Sotto carico il server deve massimizzare le prestazioni, non l'efficienza energetica. La gestione concorrente dei processi è ciò che determina la capacità di servire quelle richieste.","Non è corretto. La lettura dal file system è importante ma non è il collo di bottiglia principale a 10.000 richieste/secondo. I server moderni usano cache in RAM per i file statici. Il collo di bottiglia critico è la gestione concorrente delle connessioni di rete e dei thread di elaborazione."]]]};

  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
