<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Dove vanno i tuoi soldi</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-SIS-3-01","F":[["Quali sono i tre settori tradizionali dell'economia?",["Primario (agricoltura, estrazione), secondario (industria manifatturiera), terziario (servizi)","Pubblico, privato e misto","Consumo, produzione e distribuzione","Locale, nazionale e internazionale"],0,"I tre settori economici tradizionali: Primario = attività che estraggono/raccolgono risorse naturali (agricoltura, allevamento, pesca, estrazione mineraria). Secondario = attività che trasformano le risorse in prodotti (industria manifatturiera, edilizia, artigianato). Terziario = attività che producono servizi (trasporti, commercio, sanità, istruzione, finanza).",["Esatto! La teoria economica classica divide le attività in: settore primario (estrae/raccoglie risorse naturali), secondario (trasforma in prodotti), terziario (produce servizi immateriali).","Non corretto. Quella è la distinzione per tipo di proprietà (pubblico vs privato vs misto). I tre settori economici sono primario, secondario e terziario.","Non corretto. Quella è una classificazione per funzione economica. I tre settori tradizionali sono primario (estrazione), secondario (manifattura), terziario (servizi).","Non corretto. Quella è una classificazione geografica. I tre settori tradizionali sono primario, secondario e terziario."]],["Cos'è il PIL (Prodotto Interno Lordo)?",["La somma del valore di tutti i beni e servizi prodotti in un paese in un anno","Il reddito medio di ogni cittadino di un paese","Il saldo tra le esportazioni e le importazioni di un paese","Il valore delle riserve auree di un paese"],0,"Il PIL (Prodotto Interno Lordo) è la somma del valore di tutti i beni e servizi prodotti in un paese in un anno. È la misura più usata per confrontare le dimensioni e la crescita delle economie. Limite: non misura la distribuzione della ricchezza né la sostenibilità.",["Esatto! Il PIL misura l'attività economica totale di un paese in un anno, sommando il valore di tutto ciò che viene prodotto: beni manufatti, servizi, costruzioni, ecc.","Non corretto. Il reddito pro capite si calcola dividendo il PIL per il numero di abitanti, ma il PIL stesso è il totale della produzione, non la media per persona.","Non corretto. Quello è il saldo commerciale (o bilancia commerciale). Il PIL è la somma del valore di tutti i beni e servizi prodotti nel paese.","Non corretto. Le riserve auree sono una componente delle riserve valutarie della banca centrale, non il PIL. Il PIL misura la produzione annua di beni e servizi."]],["In quale paese vengono prodotte fisicamente la maggior parte delle magliette da 5,99 euro, secondo l'analisi della catena del valore nel testo?",["Bangladesh, Cambogia o Etiopia (paesi con bassi costi del lavoro)","Francia o Germania (paesi con alta qualità manifatturiera)","Cina (per il basso costo delle materie prime)","Italia (per la qualità del Made in Italy)"],0,"Nella catena del valore della maglietta da 5,99 euro: taglio e cucito avviene in Bangladesh, Cambogia o Etiopia (salario cucitore: meno di 1 centesimo per maglietta). Il cotone viene dall'India o USA, la filatura dalla Cina o Turchia, mentre marketing e distribuzione avvengono in Europa dove si accumula il maggiore profitto.",["Esatto! La fase di taglio e cucito della maglietta avviene principalmente in Bangladesh, Cambogia o Etiopia, dove il costo del lavoro è molto basso (il cucitore guadagna meno di un centesimo per maglietta).","Non corretto. In Francia e Germania il costo del lavoro è alto: rendono impossibile produrre magliette a 5,99 euro. Il cucito avviene in paesi a basso costo del lavoro come Bangladesh, Cambogia, Etiopia.","Non corretto (parzialmente). La Cina è un grande produttore tessile, ma la catena del testo identifica Bangladesh, Cambogia e Etiopia come luoghi principali del cucito, con paesi come Cina e India nella filatura.","Non corretto. Le magliette da 5,99 euro non sono prodotte in Italia: il costo del lavoro italiano (18-22 euro/ora) renderebbe impossibile quel prezzo. Il cucito avviene in paesi con costi del lavoro molto più bassi."]],["Cosa si intende per 'inflazione'?",["L'aumento generale del livello dei prezzi nel tempo, che riduce il potere d'acquisto se i salari non aumentano proporzionalmente","L'aumento del numero di prodotti disponibili sul mercato","Il gonfiamento artificiale dei prezzi delle azioni in borsa","L'aumento delle importazioni che supera le esportazioni di un paese"],0,"Inflazione: aumento generale del livello dei prezzi nel tempo. Un tasso di inflazione del 5% significa che i beni e servizi costano il 5% in più rispetto a un anno fa. Se il salario rimane invariato con inflazione al 5%, il potere d'acquisto (quanti beni si comprano con il reddito) diminuisce del 5%.",["Esatto! L'inflazione è l'aumento generale dei prezzi nel tempo. Se i prezzi aumentano del 5% e il salario rimane invariato, si compra il 5% in meno: il potere d'acquisto diminuisce.","Non corretto. L'aumento della varietà di prodotti è legato all'innovazione e alla diversificazione produttiva, non all'inflazione. L'inflazione riguarda il livello dei prezzi.","Non corretto. Le bolle speculative sono un fenomeno dei mercati finanziari. L'inflazione è l'aumento generale dei prezzi nell'economia reale (beni di consumo, servizi).","Non corretto. La differenza tra importazioni ed esportazioni è il saldo commerciale (o deficit/surplus commerciale). L'inflazione riguarda il livello generale dei prezzi nell'economia."]],["Nella catena del valore della maglietta da 5,99 euro, quale fase cattura il profitto maggiore?",["Marketing, brand e rivenditore finale (che insieme prendono circa 2,50-4,50 euro sui 5,99 totali)","Il coltivatore di cotone (perché la materia prima è il componente più importante)","Il trasporto marittimo (perché le distanze sono enormi)","La tintoria (perché i processi chimici sono costosi)"],0,"Distribuzione del valore nella maglietta da 5,99 euro: cucito (\u003c0,05€), cotone (0,10-0,20€), filatura (0,05-0,10€), tintoria (0,10-0,20€), logistica (0,50-0,80€), grossista (0,50-1,00€), marketing/brand (1,00-2,00€), rivenditore (1,50-2,50€). Il valore si accumula nelle fasi dove c'è potere di mercato: brand e distribuzione.",["Esatto! Marketing/brand cattura 1,00-2,00 euro e il rivenditore 1,50-2,50 euro. Insieme rappresentano la quota maggiore del prezzo finale. Il cucitore a Dhaka guadagna meno di 0,05 euro.","Non corretto. Il coltivatore guadagna 0,10-0,20 euro per maglietta — una delle quote minori. Il valore si accumula nelle fasi di marketing, brand e distribuzione.","Non corretto. La logistica e il trasporto guadagnano 0,50-0,80 euro — una quota intermedia. Il massimo profitto va al marketing/brand e al rivenditore finale.","Non corretto. La tintoria e i finissaggi guadagnano 0,10-0,20 euro. La quota maggiore va a marketing/brand (1,00-2,00 euro) e rivenditore (1,50-2,50 euro)."]],["Quante fasi compone il ciclo economico?",["Quattro: espansione, picco, recessione, ripresa","Tre: crescita, stagnazione, declino","Due: boom e bust (crescita e crollo)","Sei: crescita lenta, crescita rapida, picco, recessione lieve, recessione grave, ripresa"],0,"Il ciclo economico ha quattro fasi: 1) ESPANSIONE: crescita del PIL, disoccupazione cala, investimenti aumentano; 2) PICCO: massima crescita, rischio inflazione; 3) RECESSIONE: crescita negativa (definizione tecnica: due trimestri consecutivi di PIL negativo), disoccupazione sale; 4) RIPRESA: la crescita riprende, spesso sostenuta da politiche pubbliche.",["Esatto! Il ciclo economico ha quattro fasi: 1) Espansione (crescita, bassa disoccupazione), 2) Picco (massima crescita, possibile inflazione), 3) Recessione (rallentamento, disoccupazione sale), 4) Ripresa (la crescita riprende).","Non corretto. Il ciclo economico ha quattro fasi, non tre: espansione, picco, recessione, ripresa.","Non corretto. Sebbene 'boom and bust' sia un modo colloquiale di descrivere il ciclo, il modello economico classico identifica quattro fasi: espansione, picco, recessione, ripresa.","Non corretto. Il ciclo economico canonico ha quattro fasi: espansione, picco, recessione, ripresa."]]],"I":[["Il testo afferma che il salario minimo del settore tessile in Bangladesh era 95 euro al mese nel 2023. Come si confronta con il costo del lavoro in Italia (18-22 euro/ora)?",["Un cucitore italiano lavorerebbe 4-5 ore a parità di paga mensile di un lavoratore bangladeshi: la differenza è di circa 50-100 volte il costo orario","Non è possibile confrontare perché il costo della vita in Bangladesh è uguale a quello italiano","La differenza è trascurabile: i costi di trasporto dall'Asia annullano il vantaggio del basso costo del lavoro","La differenza di salario non è rilevante perché i lavoratori bangladeshi sono meno produttivi"],0,"Costo del lavoro: Bangladesh 95 euro/mese → ~0,47 euro/ora (25 giorni × 8 ore). Italia: 18-22 euro/ora → 3.500-4.400 euro/mese. Differenza: fattore 38-47. La cucitura di un paio di jeans (60 minuti) costa \u003c0,50 euro in Bangladesh vs 18-22 euro in Italia. Questo spiega la delocalizzazione massiva del tessile dall'Europa verso Asia e Africa.",["Esatto! 95 euro/mese in Bangladesh. In Italia con 18-22 euro/ora: 95/18 ≈ 5 ore di lavoro italiano per raggiungere uno stipendio mensile bangladeshi. La differenza di costo orario è di fattore 50-100 (18-22 euro/h in Italia vs ~0,47 euro/h in Bangladesh con 25 giorni × 8 ore).","Non corretto. Il costo della vita in Bangladesh è significativamente inferiore a quello italiano, ma anche tenendo conto del diverso costo della vita, la differenza di salario è enorme e spiega la delocalizzazione.","Non corretto. Il testo mostra che il trasporto per unità costa 0,20-0,40 euro per paio di jeans, molto inferiore al risparmio sul costo del lavoro. La differenza salariale (50-100×) è il principale motore della delocalizzazione.","Non corretto. La produttività dei lavoratori tessili nel Bangladesh non è così inferiore da compensare una differenza di 50-100 volte nel costo orario. La delocalizzazione è guidata principalmente dal costo del lavoro."]],["Il testo presenta il BES (Benessere Equo e Sostenibile) italiano come misura complementare al PIL. Perché 'complementare' e non 'alternativa'?",["Perché il PIL misura l'attività economica (necessaria ma non sufficiente per valutare il benessere) mentre il BES misura dimensioni che il PIL non cattura: salute, sicurezza, ambiente, relazioni sociali","Perché il BES è meno preciso del PIL e quindi non può sostituirlo nelle decisioni di policy","Perché il PIL è obbligatorio per legge (standard Eurostat) mentre il BES è solo facoltativo","Perché il BES misura le stesse cose del PIL ma in modo più dettagliato"],0,"PIL e BES sono complementari perché misurano cose diverse: PIL = attività economica (produzione totale). BES (12 dimensioni) = salute, istruzione, lavoro, benessere economico, relazioni sociali, sicurezza, ambiente, ricerca, qualità servizi. Il PIL può crescere (disastro naturale che richiede ricostruzione) mentre il benessere cala. Il BES coglie quello che il PIL non vede.",["Esatto! Il PIL e il BES misurano cose diverse: il PIL misura la produzione economica, il BES misura 12 dimensioni di benessere. Non si escludono: entrambi sono utili per capire lo stato di un paese.","Non corretto. Il testo non dice che il BES sia meno preciso. Lo descrive come complementare perché misura dimensioni diverse dal PIL, non perché sia meno affidabile.","Non corretto. La ragione per cui il BES è complementare non è normativa ma concettuale: misura dimensioni (salute, sicurezza, ambiente) che il PIL non misura.","Non corretto. Il BES non misura le stesse cose del PIL in modo più dettagliato: misura dimensioni DIVERSE (salute, istruzione, benessere soggettivo, ambiente) che il PIL non considera affatto."]],["Il testo afferma che l'inflazione italiana del 2022 (8,1%) è stata causata principalmente dall'aumento dei prezzi dell'energia dopo la guerra in Ucraina. Come si trasmette l'aumento dei prezzi dell'energia all'inflazione generale?",["Tramite la propagazione attraverso la catena produttiva: energia più cara → trasporti più cari → prezzi di produzione e distribuzione più alti → prezzi al consumatore più alti in tutti i settori","Tramite la svalutazione dell'euro: i prezzi dell'energia in dollari aumentano e l'euro si svaluta","Tramite l'aumento dell'occupazione nel settore energetico che aumenta i salari generali","Solo attraverso il riscaldamento domestico: gli altri prezzi non dipendono dall'energia"],0,"Meccanismo di trasmissione dell'inflazione energetica: energia cara → 1) costi di produzione industriale aumentano, 2) costi di trasporto aumentano, 3) costi agricoli aumentano (fertilizzanti, macchinari). Questi aumenti di costo si propagano attraverso tutta la catena produttiva aumentando i prezzi finali di quasi tutti i beni e servizi. È la propagazione 'a cascata' dell'energia nel sistema economico.",["Esatto! L'energia entra in ogni fase della produzione e distribuzione: le fabbriche usano energia per produrre, i camion usano carburante per trasportare, i negozi usano energia per funzionare. Un aumento dell'energia si propaga attraverso tutta la catena del valore, aumentando i prezzi finali in quasi tutti i settori.","Non corretto (parzialmente rilevante). La svalutazione dell'euro può amplificare l'impatto, ma il meccanismo principale è la propagazione attraverso la catena produttiva: l'energia entra come costo in ogni fase di produzione e distribuzione.","Non corretto. Il meccanismo non è occupazione/salari. La trasmissione dell'inflazione energetica avviene attraverso i costi di produzione: energia più cara → produzione più cara → prezzi al consumatore più alti.","Non corretto. Il riscaldamento domestico è una parte dell'impatto, ma l'energia entra in OGNI fase produttiva: produzione industriale, agricoltura, trasporti, distribuzione. L'impatto è pervasivo in tutta l'economia."]],["Il testo descrive come nella catena del valore della maglietta 'il cucito è facilmente delocalizzabile mentre il brand non lo è'. Quale principio economico spiega questa asimmetria?",["Le fasi che richiedono solo lavoro non qualificato si delocalizzano facilmente nei paesi a basso costo; le fasi che richiedono reputazione, accesso ai mercati e know-how specifico (il brand) non possono essere spostate","Le fasi iniziali della catena (vicino alle materie prime) sono sempre meno redditizie delle fasi finali (vicino al consumatore)","La legge italiana proibisce di spostare le attività di marketing fuori dal paese","I consumatori italiani preferiscono brand italiani e quindi il marketing deve restare in Italia"],0,"L'asimmetria nella catena del valore riflette il potere di mercato: il cucito è una commodity (può essere fatto ovunque con le stesse macchine) → si compete solo sul prezzo del lavoro → delocalizzazione verso i paesi più economici. Il brand è unico (reputazione specifica, relazioni con i rivenditori, design riconoscibile) → potere di mercato alto → non delocalizzabile.",["Esatto! Il cucito richiede lavoro non qualificato + macchine: si può delocalizzare ovunque ci sia manodopera a basso costo. Il brand richiede: reputazione costruita nel tempo, accesso ai mercati, design, comunicazione, relazioni con i rivenditori — tutte competenze non delocalizzabili geograficamente.","Non corretto (parzialmente vero ma incompleto). Non è solo la posizione nella catena: è il tipo di valore aggiunto. Il brand ha valore alto non perché è 'vicino al consumatore' ma perché richiede competenze specifiche non replicabili altrove.","Non corretto. Non esiste tale divieto. La resistenza alla delocalizzazione del brand è economica (reputazione costruita nei mercati di destinazione), non legale.","Non corretto (parzialmente rilevante). Le preferenze dei consumatori influenzano le strategie di marketing, ma il punto più generale è che il brand (in qualsiasi paese) richiede competenze e risorse non facilmente spostabili."]],["Il testo descrive le cooperative come imprese 'dove chi lavora decide e il profitto va ai soci-lavoratori'. In quali contesti questo modello può essere preferibile alla società per azioni?",["Quando l'obiettivo è creare valore condiviso per i lavoratori e la comunità locale, non massimizzare il profitto per azionisti esterni","Quando il profitto atteso è molto alto: le cooperative distribuiscono più profitto delle SRL","Quando si vuole evitare qualsiasi forma di tassazione sui profitti","Quando si vuole raccogliere capitali da molti investitori anonimi in borsa"],0,"Cooperative vs SRL: la cooperativa è preferibile quando: 1) l'obiettivo non è massimizzare il profitto per azionisti esterni ma creare valore per i lavoratori-soci, 2) si vuole stabilità occupazionale a lungo termine nel territorio, 3) il servizio ha forte vocazione locale (cooperative sociali, cooperative agricole). L'1% dei voti per ogni socio (indipendentemente dalla quota) garantisce controllo democratico.",["Esatto! Le cooperative sono vantaggiose quando: i lavoratori hanno interessi di lungo termine nel territorio (non escono se il costo del lavoro aumenta), quando l'obiettivo è la stabilità occupazionale e la distribuzione equa del valore aggiunto, quando i servizi da produrre hanno forte vocazione locale (cooperative sociali, cooperative agricole).","Non corretto. Le cooperative non necessariamente distribuiscono più profitto: spesso reinvestono nell'impresa o distribuiscono a tutti i soci in modo eguale. Sono preferibili per stabilità e valore condiviso, non per massimizzare il profitto.","Non corretto. Le cooperative non sono esenti da tassazione: hanno un regime fiscale specifico ma non sono un modo per evitare le tasse. La ragione di scegliere la cooperativa è la governance partecipativa, non la fiscalità.","Non corretto. Per raccogliere capitali da investitori anonimi in borsa si usano le società per azioni quotate. Le cooperative sono di proprietà dei soci-lavoratori, non di investitori anonimi."]],["Il testo descrive tre limiti del PIL come misura del benessere: cresce anche con eventi negativi, non misura la distribuzione, non misura la sostenibilità. Quale di questi tre limiti è più rilevante per confrontare il benessere tra paesi con PIL simile?",["Il limite della distribuzione: due paesi con PIL identico possono avere livelli di benessere molto diversi se in uno la ricchezza è distribuita equamente e nell'altro è concentrata nel 5% della popolazione","Il limite degli eventi negativi: un paese con molti disastri naturali ha PIL più alto degli altri ma benessere inferiore","Il limite della sostenibilità: un paese che esaurisce le risorse naturali ha PIL alto oggi ma basso in futuro","Tutti e tre i limiti sono ugualmente rilevanti: non si può dare priorità a nessuno"],0,"Per confrontare paesi con PIL simile, il limite più rilevante è la distribuzione (indice di Gini). Esempio: paesi del Golfo con PIL alto e pochi super-ricchi vs paesi nordici con PIL simile ma distribuzione molto più equa → benessere diffuso molto diverso. Il Gini dell'Italia è ~0,35, della Svezia ~0,28, degli USA ~0,41 (dati Eurostat/OCSE).",["Esatto! Per confrontare il benessere tra paesi con PIL simile, il limite più rilevante è la distribuzione. L'indice di Gini misura questa distribuzione: due paesi con stesso PIL ma Gini diverso (0,25 vs 0,50) hanno livelli di benessere diffuso molto diversi.","Non corretto (rilevante ma non il più rilevante per il confronto tra paesi). Per confrontare paesi con PIL simile, la distribuzione è il fattore più importante: un paese può avere uguale PIL totale ma molto diversa distribuzione.","Non corretto (rilevante ma non il più rilevante per il confronto attuale). Per confrontare due paesi con stesso PIL oggi, la distribuzione è più immediatamente rilevante per valutare il benessere diffuso della popolazione.","Non corretto. Il testo li presenta tutti, ma per il confronto tra paesi con PIL simile la distribuzione è il fattore discriminante più immediato per il benessere diffuso della popolazione."]]],"A":[["Il testo afferma che 'il prezzo basso è spesso il risultato di costi esternalizzati — pagati non da chi compra né da chi vende, ma da chi lavora in condizioni insufficienti o dall'ambiente'. Quale implicazione ha questo per la valutazione del 'prezzo giusto' di un prodotto?",["Il prezzo di mercato non riflette il costo sociale e ambientale totale della produzione: un prodotto economico può avere costi nascosti che ricadono su terzi (lavoratori sfruttati, ecosistemi inquinati) non inclusi nel prezzo","I prodotti economici sono sempre di qualità inferiore: si ottiene quello per cui si paga","Comprare prodotti economici è sempre moralmente sbagliato e va evitato","I governi dovrebbero vietare i prodotti a basso prezzo per proteggere i lavoratori"],0,"La teoria delle esternalità (economista Arthur Pigou, 1920): il prezzo di mercato riflette solo i costi privati (materia prima, lavoro diretto, distribuzione) ma non i costi sociali e ambientali che ricadono su terzi. Una maglietta da 5,99 euro ha un 'costo vero' molto più alto se includi: costi sanitari dei lavoratori esposti a coloranti tossici, degrado ambientale dei fiumi, emissioni dei trasporti. Questi costi non scompaiono: vengono pagati da altri (lavoratori, comunità, governo).",["Esatto! Il 'costo esternalizzato' è la definizione economica di esternalità negativa: costi che ricadono su chi non ha partecipato alla transazione (lavoratori, comunità locali, ambiente). Un prodotto che 'costa poco' può avere costi totali molto più alti che non compaiono nel prezzo.","Non corretto. Il testo non dice che la qualità sia bassa: una maglietta da 5,99 euro può essere tecnicamente della stessa qualità di una da 30 euro. La differenza sta nei costi esternalizzati (condizioni di lavoro, impatto ambientale), non nella qualità materiale.","Non corretto. Il testo non fa una valutazione morale assoluta ma una descrizione economica delle esternalità. Comprare prodotti economici può essere una necessità economica per molte famiglie; la questione è sistemica, non solo individuale.","Non corretto. Il testo descrive il problema delle esternalità ma non propone il divieto dei prodotti economici come soluzione. Le soluzioni discusse includono normative sulla due diligence delle filiere, standard di lavoro internazionali, e scelte di consumo consapevole."]],["Il testo descrive la Grande Recessione del 2008-2009 come innescata dai 'mutui subprime' americani. Come si è propagata dalla finanza americana a tutta l'economia globale?",["Le banche americane avevano distribuito il rischio dei mutui ad alto rischio globalmente attraverso prodotti finanziari complessi (CDO, MBS): quando i mutui sono andati in default, il collasso si è diffuso alle banche di tutto il mondo","Il governo americano ha imposto dazi a tutti i paesi del mondo per ridurre le importazioni, causando una recessione globale","Il crollo del mercato immobiliare americano ha ridotto la domanda di esportazioni dai paesi europei, causando recessione in Europa","Il panico psicologico dei consumatori americani ha contagiato i consumatori di altri paesi tramite i media"],0,"La trasmissione della crisi 2008: 1) Banche americane impacchettano mutui subprime in CDO (Collateralized Debt Obligations) e MBS (Mortgage-Backed Securities), 2) Li vendono a banche di tutto il mondo come investimenti sicuri (con rating AAA), 3) Default sui mutui → valore CDO/MBS crolla → banche globali subiscono perdite simultanee → credit crunch → recessione globale. L'interconnessione finanziaria globale ha trasformato una crisi locale in globale.",["Esatto! Le banche americane avevano 'impacchettato' i mutui ad alto rischio in prodotti finanziari (CDO, MBS) venduti globalmente. Quando i default sui mutui sono iniziati, il valore di questi prodotti è crollato ovunque: le banche europee, asiatiche, americane hanno subito perdite simultaneamente.","Non corretto. Non ci sono stati dazi generalizzati nel 2008. La trasmissione della crisi è avvenuta attraverso i mercati finanziari globali (prodotti finanziari derivati dai mutui subprime distribuiti alle banche di tutto il mondo).","Non corretto (parzialmente rilevante nel secondo effetto). Il meccanismo principale è stato finanziario (CDO/MBS), non commerciale (riduzione delle esportazioni). La crisi si è trasmessa principalmente attraverso il sistema bancario globale.","Non corretto. Sebbene la fiducia dei consumatori sia stata influenzata, il meccanismo principale di trasmissione è stato il sistema bancario globale attraverso i prodotti finanziari derivati dai mutui subprime."]],["Il testo afferma che il terziario avanzato (informatica, finanza, consulenza) sta subendo una 'trasformazione profonda' per automazione e IA. Quale implicazione paradossale ha questo per la nozione tradizionale di 'lavoro qualificato' come rifugio sicuro dall'automazione?",["L'automazione non riguarda più solo i lavori manuali ripetitivi ma anche i lavori cognitivi routinari (analisi di documenti, inserimento dati, compiti contabili standard): la qualificazione non protegge se il lavoro è routinario","I lavori del terziario avanzato non possono essere automatizzati perché richiedono creatività e giudizio umano in ogni decisione","L'automazione del terziario crea solo problemi in Italia ma non in altri paesi europei con sistemi formativi migliori","L'automazione non è un problema reale: creerà sempre più posti di quanti ne eliminerà nel lungo periodo"],0,"Il paradosso dell'automazione del terziario: la distinzione rilevante non è qualificato/non qualificato ma ROUTINARIO/NON-ROUTINARIO. Lavori qualificati routinari (analisi contrattuale standard, diagnosi su pattern comuni, contabilità) sono automatizzabili dall'IA. Lavori qualificati non routinari (creatività, giudizio in situazioni nuove, empatia, leadership) sono meno automatizzabili. La formazione dovrebbe puntare alla seconda categoria.",["Esatto! La prima ondata di automazione (robot industriali) ha sostituito lavori fisici ripetitivi. L'IA ora automatizza anche lavori cognitivi routinari: analisi legale di contratti, diagnosi medica standardizzata, contabilità di routine. Non è più vero che 'lavoro qualificato = sicuro dall'automazione'.","Non corretto. Il testo dice esplicitamente che il terziario avanzato sta subendo trasformazioni profonde da automazione e IA. La distinzione non è 'qualificato vs non qualificato' ma 'routinario vs non routinario'.","Non corretto. L'automazione del terziario avanzato è un fenomeno globale, non specifico dell'Italia. La qualità del sistema formativo influenza la velocità di adattamento, non l'esistenza del fenomeno.","Non corretto (incerto). Il saldo tra lavori creati e distrutti dall'IA è dibattuto dagli economisti. Il testo non afferma che l'automazione sia automaticamente positiva: descrive la trasformazione come profonda con conseguenze da gestire."]],["Il testo descrive come l'Italia ha un PIL tra i primi 10 al mondo ma con crescita media tra le più basse dell'Eurozona negli ultimi 20 anni. Quale tensione sistemica rivela questa combinazione?",["Un paese può essere grande in valore assoluto (PIL alto) ma stagnante in dinamica (crescita bassa): il stock di ricchezza accumulato non garantisce la capacità di generarne di nuova, se le strutture produttive non si rinnovano","Non c'è tensione: PIL alto e crescita bassa sono la stessa cosa espressa in unità diverse","Il PIL basso significa che l'Italia non è davvero tra i primi 10 al mondo: i dati devono essere sbagliati","La crescita bassa significa che l'Italia sta diventando un paese povero che perderà presto la sua posizione"],0,"Il paradosso italiano: PIL tra i primi 10 mondiali (stock accumulato) + crescita media ~0,5%/anno negli ultimi 20 anni (flusso molto basso). Spiegazioni possibili: struttura industriale basata su PMI tradizionali con bassa innovazione, sistema educativo/ricerca debole, inefficienze burocratiche, peso del debito pubblico, scarsa concorrenza nei mercati dei servizi. Il PIL alto riflette la ricchezza passata; la crescita bassa segnala difficoltà nel crearne di nuova.",["Esatto! L'Italia ha un grande stock di ricchezza (PIL alto in valore assoluto) ma problemi strutturali che impediscono la crescita: bassa produttività, sistema educativo non allineato con il mercato del lavoro, burocrazia, peso del debito pubblico. PIL alto e crescita lenta coesistono quando le strutture produttive non si rinnovano.","Non corretto. PIL assoluto (stock) e tasso di crescita (flusso) sono misure diverse. Un paese può avere PIL alto (ricchezza accumulata) e crescita bassa (scarsa creazione di nuova ricchezza). Non sono la stessa cosa.","Non corretto. Il dato che l'Italia sia tra le prime 10 economie mondiali è corretto (circa 9° posto per PIL nominale). Il paradosso è reale: grande economia ma bassa crescita.","Non corretto (esagerato). Crescita bassa non equivale a impoverimento immediato. Il problema è il rischio di un divario crescente con i paesi che crescono più velocemente nel lungo periodo."]],["Il testo descrive il costo dei jeans da 15 euro: 0,50 euro per 60 minuti di cucitura in Bangladesh. Con un cucitore italiano a 18 euro/ora, quanto costerebbe il solo cucito in Italia?",["18 euro per 60 minuti = 18 euro solo per il cucito — più che il prezzo di vendita finale dei jeans","5 euro: circa un terzo del costo del lavoro italiano perché il cucito di jeans è parzialmente automatizzato","3 euro: lo stesso del cucito in Bangladesh perché i lavoratori italiani producono 6 volte di più per ora","Non è possibile produrre jeans a basso costo in Italia nemmeno con i robot: i costi fissi delle fabbriche sono troppo alti"],0,"Calcolo: 60 minuti di cucito in Italia = 1 ora × 18 euro/ora = 18 euro. In Bangladesh: 1 ora × 0,47 euro/ora = 0,47 euro. Differenza: 38 volte. Se i jeans da 15 euro fossero cuciti in Italia, il solo costo del lavoro (18 euro) supererebbe il prezzo di vendita finale (15 euro) — prima ancora di aggiungere tessuto, bottoni, trasporto, distribuzione e profitto. Questo spiega matematicamente la delocalizzazione.",["Esatto! 60 minuti di cucito × 18 euro/ora = 18 euro. Ma il jeans completo costa 15 euro al consumatore. Se il cucito fosse fatto in Italia, il solo costo del lavoro supererebbe il prezzo di vendita finale. Questo rende impossibile produrre jeans a questi prezzi in Italia senza un radicale cambiamento dei prezzi finali.","Non corretto. Non c'è indicazione di automazione del cucito dei jeans a questo livello. Il calcolo è semplice: 1 ora × 18 euro/ora = 18 euro.","Non corretto. Anche se un cucitore italiano fosse 6 volte più produttivo (producendo 6 paia di jeans/ora invece di 1), il costo per paio sarebbe 18/6 = 3 euro — comunque 6 volte più del costo in Bangladesh (0,50 euro).","Non corretto (parzialmente rilevante). I costi fissi sono un fattore, ma la domanda chiede specificamente il costo del lavoro per il cucito. Con automazione il costo del lavoro potrebbe diminuire, ma questo non è il calcolo richiesto."]],["Il testo presenta il 'Supply Chain Sustainability Analyst' come professione del futuro. Quale competenza trasversale (non tecnica) è più critica per questo ruolo, secondo la descrizione?",["Il pensiero sistemico: la capacità di vedere come le scelte di un'azienda si collegano alle condizioni di lavoro in un paese lontano e agli impatti ambientali lungo tutta la catena","La conoscenza approfondita della lingua bengalese per comunicare con i fornitori bangladeshi","La capacità di programmare software di analisi statistica per elaborare grandi dataset aziendali","La conoscenza delle normative doganali di importazione per verificare la provenienza delle merci"],0,"Il Supply Chain Sustainability Analyst lavora alla intersezione tra decisioni aziendali (quale fornitore scegliere), condizioni sociali (lavoro dignitoso in paesi di produzione), impatti ambientali (qualità dell'acqua, deforestazione, emissioni CO₂) e normative (CSDD europea, SA8000, ISO 14001). La competenza più critica è il pensiero sistemico: la capacità di vedere come questi elementi si connettono e si influenzano reciprocamente attraverso catene di fornitura globali.",["Esatto! Il Supply Chain Sustainability Analyst deve vedere le connessioni tra decisioni aziendali (scelta del fornitore), condizioni di lavoro (Bangladesh, Congo), impatti ambientali (fiumi, deforestazione), reputazione aziendale, e normative (CSDD). È un ruolo che richiede pensiero sistemico per connettere fenomeni apparentemente distanti.","Non corretto. La conoscenza di lingue specifiche è utile ma non la competenza più critica. Il pensiero sistemico — la capacità di vedere le connessioni tra decisioni e impatti distanti — è la competenza più distintiva del ruolo.","Non corretto (rilevante ma non la più critica). La capacità di analisi dei dati è utile ma non la competenza più distinctiva. Il pensiero sistemico — connettere scelte aziendali e impatti socio-ambientali distanti — è la competenza chiave.","Non corretto (utile ma non la più critica). Le normative doganali sono uno strumento. La competenza più distintiva è il pensiero sistemico che connette decisioni di acquisto aziendali con impatti sociali e ambientali lungo tutta la filiera."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
