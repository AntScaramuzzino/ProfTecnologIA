<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">

<title>IA: che cosa fa, chi decide</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>

<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-DIG-3-02","F":[["Cosa sono le 'allucinazioni' in un modello linguistico come ChatGPT?",["Effetti visivi anomali che il sistema AI produce quando è sovraccarico di richieste","Risposte false prodotte con lo stesso tono sicuro delle risposte vere — il modello non ha un sistema di verifica interno tra vero e falso e genera testo plausibile, non necessariamente corretto","Risposte che il modello fornisce solo quando non ha abbastanza dati di addestramento sull'argomento","Errori grammaticali che il modello commette in lingue diverse dall'inglese"],1,"Le allucinazioni sono risposte false prodotte da un LLM con lo stesso tono sicuro delle risposte vere. Il modello genera il token statisticamente più probabile dato il contesto, ma 'plausibile' non significa 'corretto'. Esempi classici: citazioni scientifiche con titoli, autori e riviste plausibili ma inesistenti; date storiche errate descritte in modo fluente; funzioni di codice che non esistono.",["Non è corretto. Le allucinazioni non sono effetti visivi. Sono risposte testuali che contengono informazioni false presentate con lo stesso tono sicuro delle risposte vere.","Esatto! Il modello non sa di stare sbagliando. Non ha un meccanismo che distingua il vero dal falso: genera il token statisticamente più probabile, che può essere plausibile ma errato.","Non è corretto. Le allucinazioni possono avvenire anche su argomenti molto rappresentati nel corpus di addestramento. Non dipendono dalla quantità di dati disponibili.","Non è corretto. Le allucinazioni non sono errori grammaticali. Sono informazioni fattuali false presentate come vere, indipendentemente dalla lingua."]],["Cosa afferma davvero il Test di Turing del 1950 — e cosa NON afferma?",["Afferma che le macchine hanno già superato l'intelligenza umana in tutti i compiti cognitivi","Definisce un criterio operativo: se un umano non riesce a distinguere in una conversazione scritta se sta parlando con una macchina o un umano, la macchina può essere considerata 'intelligente' — senza implicare che la macchina 'capisce' davvero","Dimostra matematicamente che le macchine non potranno mai superare l'intelligenza umana","Misura la velocità di elaborazione di un sistema AI rispetto a quella del cervello umano"],1,"Alan Turing propone nel 1950 un criterio operativo: se un essere umano, conversando per iscritto con un interlocutore nascosto, non riesce a capire se sta parlando con un uomo o una macchina, la macchina può essere considerata 'intelligente'. Il testo sottolinea: Turing non stava dicendo che una macchina che supera il test capisce davvero — stava definendo un criterio pratico per una domanda filosoficamente difficile.",["Non è corretto. Turing non afferma questo. Il test è un criterio operativo per definire quando una macchina può essere considerata 'intelligente' in senso pratico, non una dichiarazione di superiorità.","Esatto! Turing propone un criterio operativo per evitare la domanda filosofica 'le macchine possono pensare?' Il test non afferma che la macchina comprende — afferma solo che se supera il test, il comportamento è indistinguibile da quello intelligente.","Non è corretto. Il Test di Turing non è una prova matematica di impossibilità. È un esperimento mentale che propone un criterio pratico per valutare l'intelligenza delle macchine.","Non è corretto. Il test non misura la velocità di elaborazione. È basato sulla qualità e l'indistinguibilità di una conversazione in linguaggio naturale, non sulle prestazioni computazionali."]],["Cos'è il machine learning 'supervisionato' e come si differenzia dagli altri tipi?",["Il sistema impara guardando un supervisore umano che esegue compiti in tempo reale","Il sistema riceve esempi etichettati (coppie input + output corretto) e impara a riprodurre l'associazione su nuovi input mai visti","Il sistema trova strutture e pattern nei dati autonomamente, senza etichette predefinite","Il sistema impara attraverso l'interazione con un ambiente, ricevendo reward per azioni corrette e penalità per quelle sbagliate"],1,"Nell'apprendimento supervisionato il sistema riceve esempi etichettati: coppie (input, output corretto). Un riconoscitore di immagini viene addestrato su milioni di foto già etichettate ('gatto', 'cane', 'auto'). Dopo l'addestramento, dato un nuovo input mai visto, il sistema predice la categoria. È il tipo più diffuso in applicazioni pratiche: filtri antispam, diagnosi medica, riconoscimento facciale.",["Non è corretto. 'Supervisionato' non significa che c'è un umano che supervisiona durante l'apprendimento. Si riferisce al fatto che i dati di addestramento sono 'supervisionati', cioè già etichettati con le risposte corrette.","Esatto! Un classificatore di spam addestrato su 100.000 email già etichettate ('spam' o 'non spam') impara a classificare nuove email. L'etichetta è la 'supervisione' — l'output corretto già fornito.","Non è corretto. Trovare strutture senza etichette è il machine learning non supervisionato (es. clustering). Nell'apprendimento supervisionato ogni esempio ha un output corretto associato.","Non è corretto. Quello che descrivi è l'apprendimento per rinforzo. Nel supervisionato il sistema riceve coppie (input, output corretto) già pronte, senza interagire con un ambiente."]],["Come genera testo un LLM (Large Language Model) come GPT-4?",["Cerca nel suo database interno la risposta più recente all'argomento richiesto","Dato il testo di input, calcola la probabilità di ogni possibile token successivo e seleziona uno con alta probabilità — un token alla volta, ripetendo il processo","Chiede a ingegneri umani di verificare le risposte prima di mostrarle all'utente","Copia e incolla frasi da siti web che corrispondono semanticamente alla domanda"],1,"Un LLM genera testo un token alla volta: dato il testo di input (il prompt), calcola la distribuzione di probabilità su tutti i possibili token successivi (decine di migliaia di opzioni) e seleziona uno con alta probabilità. Il processo si ripete finché la risposta è completa. Il parametro 'temperature' controlla la casualità: bassa = risposte conservative e prevedibili; alta = risposte più creative ma meno accurate.",["Non è corretto. I LLM non cercano in database in tempo reale (a meno di strumenti aggiuntivi). Generano testo token per token basandosi su distribuzioni statistiche apprese durante il training.","Esatto! La risposta viene costruita un token alla volta. Ogni token è condizionato da tutti quelli precedenti. Il parametro 'temperature' controlla quanto è casuale la selezione.","Non è corretto. I LLM generano risposte automaticamente senza intervento umano in tempo reale. La supervisione umana avviene nella fase di addestramento (RLHF), non durante le conversazioni.","Non è corretto. I LLM non copiano da siti web in tempo reale: generano nuovo testo basandosi su pattern statistici appresi durante l'addestramento. Non è una funzione di copia-incolla."]],["Cos'è un 'bias algoritmico' in un sistema di intelligenza artificiale?",["Un errore casuale di calcolo causato da imprecisioni nella matematica del processore","Una distorsione sistematica nei risultati di un sistema AI, causata da bias nei dati di addestramento, nella definizione del problema o nel meccanismo di feedback — non è casuale, è appresa","Un bug nel codice sorgente del sistema che produce errori solo in certi casi","Un problema che riguarda solo i sistemi di riconoscimento facciale, non i LLM"],1,"Il bias algoritmico è una distorsione sistematica nei risultati di un sistema AI. Tre fonti principali: (1) dati di addestramento sbilanciati (es. dataset prevalentemente maschile e con pelle chiara → errori maggiori su donne con pelle scura); (2) definizione del problema — cosa si ottimizza; (3) feedback loop — le raccomandazioni amplificano preferenze esistenti. Non è casuale: è appreso e ripetibile.",["Non è corretto. Il bias algoritmico non è casuale né un errore di calcolo. È una distorsione sistematica e ripetibile nei risultati del sistema, appresa durante l'addestramento.","Esatto! Un sistema ML impara dai dati: se i dati riflettono bias del mondo reale (es. dataset prevalentemente maschile), il sistema li apprende e può amplificarli. Il bias non è un bug casuale — è un pattern.","Non è corretto. Il bias algoritmico non è un bug nel codice. Il codice può funzionare perfettamente dal punto di vista tecnico e produrre comunque risultati distorti, perché il bias è nei dati o nelle scelte di design.","Non è corretto. Il bias algoritmico può colpire qualsiasi sistema AI: sistemi di raccomandazione, LLM, sistemi di selezione del personale, sistemi di credito — non solo il riconoscimento facciale."]],["L'AI Act europeo (Reg. UE 2024/1689) classifica come 'rischio inaccettabile' e vieta esplicitamente alcune categorie di sistemi AI. Quale delle seguenti rientra in questa categoria?",["I filtri antispam nelle email","Il social scoring: sistemi che assegnano punteggi ai cittadini in base al loro comportamento per determinare l'accesso a servizi o opportunità","I chatbot di assistenza clienti usati dalle aziende per rispondere alle domande frequenti","I sistemi AI usati per personalizzare i risultati di ricerca su Google"],1,"L'AI Act (agosto 2024) classifica i sistemi AI per livello di rischio. Rischio inaccettabile (vietati): social scoring, manipolazione subliminale, sistemi di classificazione per etnia/religione/orientamento sessuale, riconoscimento delle emozioni in contesti lavorativi e scolastici, identificazione biometrica in tempo reale in spazi pubblici (con poche eccezioni). Questi sistemi sono considerati incompatibili con i valori fondamentali dell'UE.",["Non è corretto. I filtri antispam sono classificati come rischio minimo dall'AI Act — non richiedono obblighi specifici perché il rischio per le persone è trascurabile.","Esatto! Il social scoring (come quello usato in Cina) è vietato come rischio inaccettabile, insieme a: manipolazione subliminale, identificazione biometrica in tempo reale in spazi pubblici, riconoscimento delle emozioni a scuola e al lavoro.","Non è corretto. I chatbot per l'assistenza clienti sono classificati come rischio limitato dall'AI Act. Devono dichiarare di essere AI, ma non sono vietati.","Non è corretto. I sistemi di personalizzazione dei risultati di ricerca sono classificati come rischio minimo o limitato. Il rischio inaccettabile riguarda sistemi che minano i diritti fondamentali o che manipolano il comportamento in modo occulto."]]],"I":[["Lo studio Gender Shades (2018, Joy Buolamwini e Timnit Gebru, MIT) ha rivelato tassi di errore molto diversi nei sistemi di riconoscimento facciale. Quali erano i risultati e cosa li causava?",["Errore maggiore per le persone anziane rispetto ai giovani, causato dalla qualità delle foto nelle banche dati","Errore \u003c 1% per uomini con pelle chiara; fino al 34,7% per donne con pelle scura — causato da dataset di addestramento sbilanciati, prevalentemente maschili e con pelle chiara","Errore uguale per tutti i gruppi demografici, circa il 15% — lo studio ha concluso che i sistemi erano giusti","Errore maggiore di notte rispetto al giorno, a causa delle condizioni di illuminazione delle fotocamere"],1,"Joy Buolamwini (MIT) e Timnit Gebru (Google Brain) hanno analizzato tre sistemi commerciali di classificazione del genere da immagine facciale: errore \u003c 1% per uomini con pelle chiara; fino al 34,7% per donne con pelle scura. Causa: dataset di addestramento prevalentemente composti da volti maschili e di pelle chiara. Il sistema aveva appreso dai dati disponibili, che erano sistematicamente sbilanciati.",["Non è corretto. Lo studio ha analizzato le differenze per genere e tono della pelle, non per età. Il bias demografico rilevato riguardava donne con pelle scura, non anziani.","Esatto! I sistemi avevano imparato principalmente da dataset sbilanciati. Con meno esempi di donne con pelle scura nel training, il sistema era molto meno preciso su quel gruppo.","Non è corretto. Gender Shades ha dimostrato esattamente il contrario: grandi differenze nei tassi di errore tra gruppi demografici. L'errore variava da \u003c 1% a 34,7% — una differenza enorme.","Non è corretto. Il bias rilevato da Gender Shades era demografico (genere e tono della pelle), non ambientale. Le condizioni di illuminazione sono un problema tecnico diverso."]],["Il sistema COMPAS (2016) veniva usato nei tribunali americani per predire la probabilità di recidiva. ProPublica ha dimostrato che era discriminatorio — ma l'azienda produttrice sosteneva che fosse 'statisticamente calibrato'. Come è possibile che entrambe le affermazioni siano vere?",["Non è possibile: se un sistema è statisticamente calibrato, non può essere discriminatorio per definizione","'Calibrato' significa accurato sulla media statistica del gruppo totale — ma il tasso di falsi positivi era quasi doppio per i cittadini neri (28%) rispetto ai bianchi (16%): le medie nascondono le disuguaglianze tra sottogruppi","L'azienda mentiva: i dati di ProPublica dimostrano che il sistema non era calibrato in nessun senso","ProPublica usava dati sbagliati: il sistema era sia calibrato sia non discriminatorio"],1,"Il caso COMPAS illustra il conflitto tra diverse definizioni di 'giustizia algoritmica'. L'azienda aveva ottimizzato la calibrazione complessiva (l'accuratezza media era simile per tutti i gruppi). ProPublica ha misurato il false positive rate per sottogruppo: 28% per cittadini neri vs 16% per bianchi. Le scelte di quali metriche ottimizzare riflettono scelte di valori — e queste scelte possono essere in conflitto matematico.",["Non è corretto. Accuratezza statistica globale e giustizia tra sottogruppi sono metriche diverse che possono essere in conflitto. Un sistema può essere accurato sulla media e al contempo distribuire gli errori in modo ineguale tra gruppi.","Esatto! Il sistema era calibrato nel senso che la sua accuratezza globale era simile tra i gruppi. Ma la distribuzione degli errori era sistematicamente ineguale: i cittadini neri venivano erroneamente classificati come 'ad alto rischio' quasi il doppio delle volte.","Non è corretto. L'azienda usava una definizione tecnica legittima di 'calibrazione' (accuratezza globale simile tra gruppi). Il problema era che questa metrica non cattura la distribuzione ineguale dei falsi positivi.","Non è corretto. ProPublica ha analizzato 7.000 casi reali in Florida con una metodologia peer-reviewed. I risultati hanno aperto un dibattito scientifico su quali metriche usare per valutare la 'giustizia' algoritmica."]],["Come si distingue il machine learning 'per rinforzo' dall'apprendimento supervisionato, e come lo ha usato AlphaGo?",["Non ci sono differenze: il rinforzo è solo un modo più rapido di fare apprendimento supervisionato","Nel rinforzo non ci sono esempi etichettati: un agente interagisce con un ambiente, riceve reward per azioni corrette e penalità per quelle errate. AlphaGo ha giocato milioni di partite contro se stesso per imparare strategie che nessun umano aveva mai concepito","Il rinforzo usa etichette negative (penalità) invece di etichette positive (output corretto) — è solo una variante del supervisionato","Il rinforzo non è adatto a giochi come il Go: AlphaGo ha usato solo apprendimento supervisionato"],1,"Apprendimento per rinforzo: un agente esplora un ambiente, riceve reward per azioni corrette e penalità per quelle sbagliate, e aggiorna la strategia per massimizzare il reward totale. Non ci sono etichette: il sistema scopre da solo cosa funziona. AlphaGo: fase 1 — supervisionato su milioni di partite umane; fase 2 — rinforzo con milioni di partite contro se stesso. Dalla fase 2 sono emerse mosse che i maestri di Go non avevano mai visto.",["Non è corretto. Sono paradigmi fondamentalmente diversi. Nel supervisionato il sistema riceve esempi già etichettati. Nel rinforzo non ci sono etichette: il sistema impara dall'interazione con un ambiente tramite reward e penalità.","Esatto! AlphaGo ha usato prima apprendimento supervisionato (partite umane) poi per rinforzo (auto-play). Dalla fase di rinforzo sono emerse strategie talmente inusuali che i maestri di Go le hanno studiate come nuove aperture.","Non è corretto. Il rinforzo non usa etichette nel senso tradizionale. L'agente scopre da solo cosa funziona interagendo con l'ambiente: non esiste un 'output corretto' predefinito per ogni azione.","Non è corretto. AlphaGo ha usato entrambi i tipi: prima supervisionato per apprendere dalle partite umane, poi per rinforzo giocando milioni di partite contro se stesso. La fase di rinforzo ha prodotto le strategie più innovative."]],["Il parametro 'temperature' di un LLM controlla la casualità nella generazione del testo. Cosa cambia tra una temperature bassa e una alta?",["La temperature controlla la velocità di risposta: alta = risposta più veloce, bassa = risposta più lenta","Temperature alta → più casualità nella selezione del token → risposte più creative ma meno accurate; bassa → sceglie quasi sempre il token più probabile → risposte prevedibili e conservative","La temperature determina la lunghezza della risposta: alta = risposta lunga, bassa = risposta corta","Non cambia nulla nel risultato finale: la temperature è un parametro tecnico interno senza effetti visibili"],1,"La temperature regola la 'casualità' nella generazione: modifica la distribuzione di probabilità da cui il modello campiona il token successivo. Temperature bassa (0-0.3): favorisce quasi sempre il token più probabile — risposte prevedibili, accurate, adatte a compiti tecnici. Temperature alta (0.7-1.5): distribuisce la probabilità su più opzioni — risposte più creative e variabili, adatte alla generazione creativa ma con maggiore rischio di allucinazioni.",["Non è corretto. La temperature non influisce sulla velocità di generazione. Controlla la distribuzione di probabilità usata per selezionare il token successivo, non la velocità di calcolo.","Esatto! Con temperature bassa il modello sceglie quasi sempre il token con probabilità più alta — risposte coerenti e accurate. Con temperature alta introduce più casualità — risposte più creative e variabili, ma con maggiore rischio di errori.","Non è corretto. La lunghezza della risposta è controllata da altri parametri (es. max_tokens). La temperature controlla solo la distribuzione di probabilità nella selezione di ogni token.","Non è corretto. La temperature ha effetti molto visibili sul tipo di risposta. A temperature 0 il modello è quasi deterministico (risponde sempre allo stesso modo alla stessa domanda). A temperature 1+ le risposte variano significativamente."]],["GPT-4 ha circa 1 trilione di parametri. Cosa rappresentano questi parametri e cosa NON rappresentano?",["Rappresentano le righe di codice sorgente del modello: più codice = più intelligente","Sono i pesi numerici della rete neurale, modificati durante l'addestramento — non rappresentano 'conoscenza' memorizzata ma associazioni statistiche tra token che guidano la generazione","Rappresentano i fatti memorizzati nel database del modello: 1 trilione di parametri = 1 trilione di fatti","Sono campioni del corpus di testo usato per l'addestramento: il modello memorizza frasi intere"],1,"I parametri di un LLM sono i pesi numerici della rete neurale — circa 1 trilione per GPT-4. Durante il training, la backpropagation modifica questi pesi per minimizzare l'errore di predizione sul corpus. I parametri non rappresentano fatti discreti: la 'conoscenza' è distribuita e implicita nelle associazioni statistiche tra token. L'addestramento di GPT-4 ha richiesto mesi su migliaia di GPU specializzate.",["Non è corretto. I parametri non sono righe di codice. Sono valori numerici (pesi) della rete neurale, modificati durante il training per minimizzare gli errori.","Esatto! I parametri sono numeri reali che pesano le connessioni nella rete neurale. Non c'è 'conoscenza' esplicita memorizzata: ci sono pattern statistici appresi dall'enorme corpus di testo su cui il modello è stato addestrato.","Non è corretto. I parametri non sono fatti memorizzati in modo discreto. Sono pesi continui di una rete neurale: la 'conoscenza' è distribuita tra miliardi di parametri, non archiviata come record singoli.","Non è corretto. I LLM non memorizzano frasi intere del corpus (a meno di overfitting). I parametri sono pesi appresi che generalizzano i pattern del corpus, non copie delle frasi originali."]],["Perché il 2012 è considerato un anno di svolta nella storia dell'intelligenza artificiale, grazie ad AlexNet?",["Perché AlexNet ha usato più dati con lo stesso algoritmo dei sistemi precedenti, ottenendo risultati leggermente migliori","AlexNet ha usato reti neurali profonde addestrate su GPU, ottenendo il 15,3% di errore su ImageNet contro il 26,2% del secondo classificato — quasi la metà — aprendo l'era del deep learning","Perché AlexNet ha introdotto i sistemi esperti con migliaia di regole scritte a mano dagli esperti di visione artificiale","Perché AlexNet ha creato il primo chatbot capace di conversare in linguaggio naturale"],1,"Al contest ImageNet 2012, AlexNet (Krizhevsky, Sutskever e Hinton) ha ottenuto il 15,3% di errore contro il 26,2% del secondo classificato — quasi la metà. AlexNet usava una rete neurale profonda (8 strati) addestrata su GPU NVIDIA. Il risultato era così netto da segnare l'inizio dell'era del deep learning: da quel momento, le reti neurali profonde su GPU sono diventate lo standard per tutti i problemi di AI.",["Non è corretto. La rivoluzione non era solo nella quantità dei dati, ma nell'architettura (rete neurale profonda con più strati) e nell'uso delle GPU per l'addestramento — un approccio radicalmente diverso.","Esatto! Il salto di prestazione era così netto (da 26% a 15% di errore) da convincere l'intera comunità scientifica ad abbandonare i metodi tradizionali in favore del deep learning con GPU.","Non è corretto. I sistemi esperti con regole scritte a mano erano il paradigma precedente — quello che AlexNet ha superato. AlexNet usava l'approccio opposto: apprendimento automatico dai dati senza regole esplicite.","Non è corretto. AlexNet era un sistema di classificazione di immagini, non un chatbot. I LLM conversazionali sono arrivati molto dopo: GPT-3 nel 2020, ChatGPT nel 2022."]]],"A":[["L'AI Act europeo impone ai chatbot di dichiarare che sono AI (rischio limitato — obbligo di trasparenza). Perché il DM 183/2024 Traguardo D3 collega questa norma alla cittadinanza digitale?",["Perché l'obbligo di trasparenza serve principalmente alle aziende per evitare sanzioni, non ha rilevanza civica per i singoli utenti","Perché il cittadino ha il diritto di sapere se sta interagendo con una macchina o un essere umano: senza questa trasparenza non può esercitare giudizio critico sull'affidabilità delle informazioni — prerequisito per la libertà di scelta informata","Perché i chatbot AI devono essere usati solo a scuola, non nella vita privata: la dichiarazione serve a separare i due contesti","Perché la norma protegge i minori dal rischio di innamorarsi di un chatbot, un problema medico riconosciuto dall'OMS"],1,"Il Traguardo D3 del DM 183/2024 riguarda la valutazione critica dei sistemi IA come tema di cittadinanza. L'obbligo dell'AI Act di dichiarare che un chatbot è AI è rilevante per la cittadinanza perché: (1) il cittadino ha il diritto di sapere se sta ricevendo informazioni da una macchina; (2) senza questa trasparenza non può calibrare criticamente la fiducia; (3) la libertà di scelta informata — prerequisito della partecipazione democratica — richiede consapevolezza delle proprie fonti.",["Non è corretto. Il Traguardo D3 collega esplicitamente la norma alla cittadinanza: il diritto di sapere con chi si interagisce è un prerequisito per esercitare il giudizio critico, che è una competenza civica fondamentale.","Esatto! Sapere che si sta interagendo con un AI cambia come si valuta l'informazione ricevuta: si sa che può allucinare, che non ha esperienza vissuta, che le sue risposte dipendono da pattern statistici.","Non è corretto. L'AI Act non limita l'uso dei chatbot alla sfera scolastica. L'obbligo di trasparenza si applica in tutti i contesti perché il diritto a sapere con chi si interagisce è universale.","Non è corretto. Sebbene esistano preoccupazioni sull'attaccamento emotivo ai chatbot, il DM 183/2024 D3 non fa riferimento a questo. La norma riguarda il diritto fondamentale a sapere con chi si interagisce per esercitare giudizio critico."]],["L'AI Act classifica alcuni sistemi come 'ad alto rischio' quando usati in istruzione o nell'occupazione. Quali obblighi impone e perché sono più stringenti rispetto ai sistemi a rischio limitato?",["Nessun obbligo specifico aggiuntivo: i sistemi ad alto rischio in istruzione funzionano come quelli a rischio minimo","Valutazione di conformità prima del deployment, supervisione umana obbligatoria, documentazione trasparente, accuratezza e robustezza certificate — perché le decisioni impattano direttamente vita e opportunità delle persone","Sono vietati come il rischio inaccettabile: nessun sistema AI può essere usato in istruzione o occupazione","Solo l'obbligo di dichiarare che il sistema è AI — lo stesso dei chatbot a rischio limitato"],1,"L'AI Act applica il principio di proporzionalità: più alto il rischio per le persone, più stringenti gli obblighi. Per i sistemi ad alto rischio in istruzione e occupazione: (1) valutazione di conformità obbligatoria prima del deployment; (2) supervisione umana obbligatoria — nessuna decisione automatica finale; (3) documentazione trasparente del funzionamento; (4) accuratezza, robustezza e sicurezza certificate; (5) registrazione in un database europeo. La ragione: un sistema che decide l'ammissione universitaria o la selezione del personale impatta direttamente la vita delle persone.",["Non è corretto. L'AI Act prevede obblighi molto più stringenti per i sistemi ad alto rischio proprio perché le decisioni impattano direttamente le opportunità di vita delle persone.","Esatto! Un sistema che decide chi viene ammesso a un corso universitario o chi ottiene un lavoro ha conseguenze enormi sulla vita reale. Per questo servono garanzie stringenti prima che il sistema possa essere usato.","Non è corretto. L'AI Act non vieta l'uso dell'AI in istruzione e occupazione. Lo permette, ma con obblighi stringenti: valutazione di conformità, supervisione umana, documentazione. I sistemi vietati sono solo quelli a rischio inaccettabile.","Non è corretto. La dichiarazione di essere AI è l'obbligo minimo dei sistemi a rischio limitato. I sistemi ad alto rischio hanno obblighi molto più ampi: conformità, supervisione umana, accuratezza certificata, registrazione in un database europeo."]],["I sistemi di raccomandazione (TikTok, YouTube, Spotify) amplificano le preferenze esistenti tramite un meccanismo di feedback. Quale problema etico strutturale emerge?",["Amplificano solo le fake news, non i contenuti autentici: il problema è solo informativo, non valoriale","La bolla informativa si restringe progressivamente — il sistema mostra più di ciò che già consumi, eliminando prospettive diverse; le piattaforme non hanno incentivo economico a diversificare perché l'engagement è massimizzato dalla specializzazione","Il problema si risolve facilmente se gli utenti scelgono consapevolmente cosa guardare: la responsabilità è solo individuale","Riguarda solo le piattaforme di notizie, non le piattaforme di intrattenimento come TikTok o Spotify"],1,"Il feedback loop dei sistemi di raccomandazione: il sistema mostra contenuti simili a quelli già consumati (massimizza l'engagement) → l'utente consuma più di quei contenuti → il sistema ne mostra ancora di più. La bolla si restringe progressivamente. Il problema etico strutturale: le piattaforme traggono ricavi dall'engagement, non dalla qualità informativa. Diversificare le raccomandazioni riduce l'engagement → riduce i ricavi. Non c'è incentivo economico a rompere la bolla.",["Non è corretto. Il problema non è limitato alle fake news. Qualsiasi contenuto — autentico o falso — che genera engagement viene amplificato. Il problema valoriale è che la bolla si restringe progressivamente, indipendentemente dalla qualità del contenuto.","Esatto! È un conflitto strutturale: la piattaforma ottimizza l'engagement (che massimizza i ricavi pubblicitari) — la diversificazione riduce l'engagement, quindi va contro gli interessi economici della piattaforma.","Non è corretto. Il design del sistema è costruito per ridurre la scelta consapevole e massimizzare il tempo di sessione. Affidarsi alla sola responsabilità individuale trascura il potere strutturale del design dell'interfaccia.","Non è corretto. Il feedback loop colpisce tutte le piattaforme basate su raccomandazione algoritmica, indipendentemente dal tipo di contenuto. Anche le playlist musicali e i video di intrattenimento creano bubble di preferenza."]],["L'affermazione 'l'IA non ha opinioni, quindi è neutrale e obiettiva' è un errore comune. Perché è sbagliata, secondo il testo?",["Perché i sistemi AI hanno effettivamente opinioni politiche programmate dagli ingegneri che li costruiscono","Perché ogni scelta di design — quali dati usare, quale funzione ottimizzare, quale architettura scegliere — riflette preferenze e valori umani; un LLM su dati prevalentemente anglofoni performa meglio su argomenti anglofoni","Perché i sistemi AI mentono deliberatamente per proteggere gli interessi economici delle aziende che li producono","Perché l'IA usa matematica, e la matematica non è neutrale perché i numeri hanno un valore politico intrinseco"],1,"Nessun sistema AI è neutrale perché nessuna delle scelte che lo costituiscono è neutrale: (1) quali dati raccogliere (e quali escludere); (2) quale funzione ottimizzare (engagement? accuratezza? equità? profit?); (3) quale architettura usare; (4) chi ha accesso e a quale costo. Un LLM addestrato su testo prevalentemente anglofono performa meglio su argomenti della cultura anglofona. Un sistema ottimizzato per il 'tempo di sessione' mostra contenuti che tengono incollati, non contenuti utili. La neutralità è un'illusione — e riconoscerlo è la prima forma di pensiero critico.",["Non è corretto. I sistemi AI non hanno 'opinioni' nel senso umano, e gli ingegneri non programmano ideologie esplicitamente. Il problema è più sottile: ogni scelta di design riflette valori, indipendentemente dalle intenzioni.","Esatto! La 'neutralità' è impossibile: scegliere quali dati includere, cosa ottimizzare, chi ha accesso al sistema — sono tutte scelte valoriali. Il sistema riflette le priorità di chi lo ha costruito.","Non è corretto. I LLM non 'mentono deliberatamente'. Il problema della non-neutralità non riguarda l'intenzione di ingannare ma le scelte progettuali (dati, funzione obiettivo) che producono risultati sistematicamente influenzati da certe prospettive.","Non è corretto. La matematica non ha un valore politico intrinseco. Il problema non è il calcolo matematico in sé, ma le scelte umane su quali dati raccogliere, quale obiettivo ottimizzare, quale architettura usare."]],["Il caso COMPAS mostra che un sistema AI può essere 'statisticamente calibrato' e al tempo stesso discriminatorio. Come è matematicamente possibile?",["Non è possibile: la definizione matematica di calibrazione include automaticamente l'assenza di discriminazione tra sottogruppi","La calibrazione misura l'accuratezza globale media, ma il false positive rate può essere distribuito in modo sistematicamente disuguale tra sottogruppi — ottimizzare una metrica può andare a discapito dell'altra","La 'calibrazione statistica' non è una misura reale di accuratezza: è un termine di marketing usato dalle aziende AI per giustificare sistemi discriminatori","ProPublica ha sbagliato la metodologia: un sistema calibrato non può avere tassi di falsi positivi diversi tra gruppi"],1,"Il teorema di impossibilità di Chouldechova (2017) dimostra formalmente che alcune definizioni di equità algoritmica sono in conflitto matematico: non si possono soddisfare tutte simultaneamente quando i tassi di base differiscono tra gruppi. COMPAS era calibrato nel senso che la sua probabilità prevista corrispondeva alla frequenza osservata — ma questo è compatibile con false positive rate diversi tra sottogruppi. La scelta di quale metrica ottimizzare è una scelta di valori, non solo tecnica.",["Non è corretto. Le definizioni matematiche di 'calibrazione' e di 'equità demografica' sono distinte e possono essere in conflitto — questo è un risultato dimostrato formalmente (il teorema di impossibilità di Chouldechova, 2017).","Esatto! Questo è il cuore del dibattito sulla 'giustizia algoritmica': le diverse definizioni matematiche di equità sono in conflitto. Non si possono soddisfare tutte contemporaneamente — bisogna scegliere quale privilegiare, e questa è una scelta di valori.","Non è corretto. La calibrazione statistica è una metrica tecnica legittima e ampiamente usata in statistica. Il problema non è che sia falsa, ma che non cattura tutte le dimensioni rilevanti dell'equità.","Non è corretto. La metodologia di ProPublica è stata esaminata da ricercatori accademici e la discrepanza nei false positive rate è stata confermata. La questione scientifica riguarda quale metrica usare per valutare la 'giustizia', non se i dati siano corretti."]],["Un LLM ha affermato che 'il politico Rossi ha votato contro la legge X nel 2023'. Come dovresti verificare questa affermazione prima di citarla in un articolo scolastico?",["Chiedere la stessa cosa a un secondo LLM più avanzato: se anche lui conferma, l'informazione è affidabile","Verificare su fonti primarie indipendenti: sito ufficiale del Parlamento, archivi giornalistici affidabili, fonti istituzionali — 'il modello ha detto X' non è sufficiente; serve 'ho verificato su Y e confermato perché Z'","Accettare l'informazione se il tono della risposta è sicuro e dettagliato: i modelli avanzati non allucinano su fatti politici recenti","Cercare su Wikipedia: se corrisponde a quanto detto dal LLM, è confermato"],1,"Il Box T8 stabilisce la regola della verifica: ogni output su cui fare affidamento va verificato su fonti indipendenti. Per fatti politici: (1) sito ufficiale del Parlamento (es. camera.it, senato.it); (2) archivi giornalistici di testate verificate; (3) fonti istituzionali primarie. Il ragionamento corretto non è 'il modello ha detto X' ma 'il modello ha suggerito X, ho verificato su Y (fonte istituzionale), ho confermato perché Z (link diretto al documento)'. Solo così una fonte è citabile.",["Non è corretto. Due LLM che concordano non verificano la veridicità: possono entrambi allucinare la stessa risposta plausibile dalla stessa distribuzione statistica. La conferma tra modelli non è una fonte indipendente.","Esatto! Il modello non sa di stare sbagliando — può affermare con sicurezza fatti falsi o distorti. Ogni affermazione fattuale deve essere verificata su fonti indipendenti prima di essere citata.","Non è corretto. Il tono sicuro e la ricchezza di dettaglio sono caratteristiche delle allucinazioni, non garanzie di accuratezza. I modelli allucinano con la stessa sicurezza sia su fatti veri che falsi.","Non è corretto. Wikipedia può essere aggiornata con ritardo o contenere errori. Inoltre, alcuni LLM sono stati addestrati su Wikipedia — concordare con Wikipedia non garantisce l'indipendenza della verifica. Per fatti politici recenti, usa fonti istituzionali primarie."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
