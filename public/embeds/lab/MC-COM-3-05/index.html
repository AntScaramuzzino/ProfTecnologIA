<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Internet non è una nuvola</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>

<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

          note: (p, o) => ["ok", `Anche con una rete perfetta, ${LABENGINE.fmt(p.d)} km non si possono percorrere andata e ritorno in meno di ${LABENGINE.fmt((2 * p.d / 200000) * 1000)} ms: è il limite fisico della velocità della luce nella fibra.`] },
        { type: "canvas", fields: [["out", "Incolla qui il risultato di traceroute (o tracert)", ""], ["paesi", "In quali paesi passano gli hop? Dove c'è il salto di ritardo più grande?", "usa un servizio di geolocalizzazione degli IP"]],

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-COM-3-05","F":[["Che percentuale del traffico Internet mondiale viaggia su cavi sottomarini?",["Il 97% del traffico Internet e delle comunicazioni telefoniche internazionali","Il 30% del traffico, il resto via satellite","Il 50% del traffico Internet, il resto via Wi-Fi","Il 10% del traffico, il resto attraverso i data center"],0,"Circa 550 cavi sottomarini attivi trasportano il 97% di tutto il traffico Internet e delle comunicazioni telefoniche internazionali. Questi cavi — con da 8 a 24 paia di fibre ottiche — percorrono i fondi degli oceani collegando i continenti.",["Esatto! Il testo indica che circa 550 cavi sottomarini attivi trasportano il 97% di tutto il traffico Internet e delle comunicazioni telefoniche internazionali.","Non è corretto. I satelliti sono usati per zone remote e applicazioni specifiche, ma il 97% del traffico globale viaggia su cavi sottomarini.","Non è corretto. Il Wi-Fi è una tecnologia di rete locale, non per le comunicazioni intercontinentali.","Non è corretto. I data center ospitano i dati ma non trasmettono intercontinentalmente. La quota dei cavi è il 97%."]],["Qual è il primo messaggio inviato su ARPANET nella storia di Internet?",["Solo le lettere 'lo' (il sistema crashò prima di completare 'login')","Il messaggio completo 'Hello, World!'","La parola completa 'login'","Il testo 'Message received' di conferma"],0,"Il 29 ottobre 1969, Charley Kline all'UCLA tentò di inviare 'login' al computer dello Stanford Research Institute via ARPANET. Il sistema crashò dopo le prime due lettere. Il primo messaggio di Internet nella storia è 'lo' — forse la parola più umile e accidentale dell'era digitale.",["Esatto! Il 29 ottobre 1969, Charley Kline tentò di inviare 'login' ma il sistema crashò dopo le prime due lettere. Il primo messaggio di Internet è stato 'lo'.","Non è corretto. 'Hello World' è una tradizione della programmazione, non il primo messaggio di Internet.","Non è corretto. Il sistema crashò dopo le prime due lettere: il primo messaggio fu solo 'lo'.","Non è corretto. Il messaggio di risposta non fu mai ricevuto perché il sistema crashò dopo 'lo'."]],["Cosa gestisce ICANN (Internet Corporation for Assigned Names and Numbers)?",["Il sistema dei nomi di dominio (DNS) e degli indirizzi IP a livello mondiale","Il contenuto pubblicato su Internet in tutti i paesi","I cavi sottomarini transatlantici","La velocità massima delle connessioni Internet"],0,"ICANN (Internet Corporation for Assigned Names and Numbers), con sede a Los Angeles, gestisce il sistema DNS globale e l'assegnazione degli indirizzi IP. Dal 2016 risponde a una struttura multistakeholder globale (non più solo al governo americano che la supervisionava dalla fondazione nel 1998).",["Esatto! ICANN, con sede a Los Angeles, gestisce il DNS globale e l'assegnazione degli indirizzi IP. Quando registri un dominio (.it, .com), usi il sistema ICANN.","Non è corretto. ICANN gestisce l'infrastruttura tecnica dei nomi, non i contenuti.","Non è corretto. I cavi sottomarini sono di proprietà di aziende private (telecom e big tech). ICANN gestisce i nomi e gli indirizzi.","Non è corretto. La velocità delle connessioni dipende dagli operatori e dalle tecnologie, non da ICANN."]],["Cosa significa 'net neutrality' (neutralità della rete)?",["Tutti i dati su Internet vanno trattati allo stesso modo dagli operatori, senza discriminazioni","Internet deve essere neutro dal punto di vista politico","Tutti gli utenti devono pagare lo stesso prezzo per Internet","I governi non possono regolamentare Internet"],0,"La net neutrality (neutralità della rete) è il principio per cui tutti i dati su Internet devono essere trattati allo stesso modo dagli operatori: nessun sito, servizio o tipo di traffico può essere accelerato, rallentato o bloccato preferenzialmente. In Europa è garantita dal Regolamento (UE) 2015/2120.",["Esatto! La net neutrality impone che nessun sito, servizio o tipo di traffico sia accelerato, rallentato o bloccato preferenzialmente dagli operatori di rete.","Non è corretto. La 'neutralità' riguarda il traffico dati, non i contenuti politici.","Non è corretto. La net neutrality riguarda come i dati vengono trattati in rete, non il prezzo degli abbonamenti.","Non è corretto. La net neutrality è spesso una regolamentazione governativa che vincola gli operatori privati."]],["Cos'è il Great Firewall cinese?",["Il sistema nazionale di filtraggio che blocca Google, Facebook, YouTube e Wikipedia in Cina","Un sistema di protezione antivirale per le reti cinesi","Una rete militare separata da Internet civile in Cina","Un sistema di pagamento digitale nazionale cinese"],0,"Il Great Firewall (ufficialmente 'Golden Shield') è il sistema cinese di filtraggio di Internet che blocca Google (inclusi Gmail, YouTube, Drive), Facebook, Instagram, Twitter, WhatsApp, Wikipedia e migliaia di altri servizi. Usa blocco IP, filtraggio DNS e Deep Packet Inspection.",["Esatto! Il Great Firewall (Golden Shield) blocca i principali servizi digitali occidentali, sostituiti da alternative cinesi: Baidu, WeChat, Weibo.","Non è corretto. Il Great Firewall non è un antivirus: è un sistema di censura e filtraggio del traffico Internet.","Non è corretto. La Cina ha Internet civile (censurata), non una rete militare separata come la Corea del Nord.","Non è corretto. Il Great Firewall è un sistema di censura di Internet, non un sistema di pagamento."]],["Quante persone nel mondo ancora non hanno accesso a Internet nel 2024?",["Circa 2,5 miliardi di persone","Circa 100 milioni di persone","Circa 500 milioni di persone","Circa 5 miliardi di persone"],0,"Nel 2024, 5,5 miliardi di persone usano Internet. Circa 2,5 miliardi non hanno ancora accesso — concentrati principalmente in Africa subsahariana, Asia meridionale e zone rurali globali. La 'connettività universale' è ancora lontana dall'essere realizzata.",["Esatto! Con 5,5 miliardi di utenti Internet nel 2024, circa 2,5 miliardi — concentrati in Africa subsahariana, Asia meridionale e zone rurali — non hanno ancora accesso.","Non è corretto. Il digital divide è molto più ampio: circa 2,5 miliardi di persone non hanno accesso.","Non è corretto. Il numero reale è molto più alto: circa 2,5 miliardi di persone senza accesso.","Non è corretto. 5,5 miliardi usano già Internet: i senza accesso sono circa 2,5 miliardi."]]],"I":[["Perché l'architettura originale di ARPANET (1969) è ancora il motivo per cui Internet funziona oggi?",["Perché fu progettata senza nodo centrale: nessun punto di fallimento unico, nessun controllo unico","Perché usava gli stessi cavi in rame delle reti telefoniche","Perché fu finanziata dal governo americano che ne garantisce il funzionamento","Perché era già predisposta per la fibra ottica"],0,"ARPANET fu progettata specificatamente per 'resistere a un attacco nucleare': nessun nodo centrale significa nessun punto di fallimento unico. Questa architettura distribuita è ancora la ragione per cui Internet funziona — e la ragione per cui è così difficile da regolamentare o censurare completamente.",["Esatto! ARPANET fu progettata per resistere a un attacco nucleare: se una parte è distrutta, i dati trovano un percorso alternativo. Questo spiega sia la resilienza sia la difficoltà di regolamentazione di Internet.","Non è corretto. La caratteristica fondamentale è l'architettura distribuita, non il mezzo fisico.","Non è corretto. Il governo americano ha supervisione su ICANN (e neanche più dal 2016): non 'garantisce il funzionamento' di Internet.","Non è corretto. Nel 1969 non esisteva la fibra ottica: la scelta architettonica che conta è la distribuzione dei nodi."]],["Cosa permise la scelta 'end-to-end' del protocollo TCP/IP (1973-74)?",["Chiunque poteva costruire nuove applicazioni sopra Internet senza chiedere il permesso a nessuno","La rete era più veloce perché non doveva analizzare i dati","I dati erano automaticamente cifrati durante il transito","Internet era accessibile solo ai computer militari americani"],0,"La scelta end-to-end di TCP/IP (Cerf e Kahn, 1973-74) pose l'intelligenza agli estremi della rete: la rete si limita a consegnare pacchetti senza sapere cosa contengono. Chiunque poteva costruire qualsiasi applicazione sopra Internet senza chiedere permesso. Per questo il web, le email, il gaming online, le criptovalute sono stati tutti possibili.",["Esatto! Il testo spiega: TCP/IP è 'end-to-end': la rete non conosce il contenuto. L'intelligenza è agli estremi. Per questo web, email, streaming, criptovalute sono stati possibili senza autorizzazione centrale.","Non è corretto. Il vantaggio principale non è la velocità ma la capacità di innovare liberamente sopra l'infrastruttura.","Non è corretto. TCP/IP non include cifratura nativa. La cifratura è gestita da protocolli superiori come TLS.","Non è corretto. L'architettura end-to-end fu pensata per essere aperta e accessibile, non riservata."]],["Il Deep Packet Inspection (DPI) usato nel Great Firewall: in cosa supera il semplice blocco IP?",["Analizza il contenuto dei pacchetti in transito cercando pattern associati a VPN o contenuti proibiti","Rallenta tutto il traffico Internet per scoraggiare l'uso","Blocca fisicamente i cavi sottomarini verso i paesi censurati","Richiede all'utente di identificarsi prima di accedere a Internet"],0,"Il blocco IP blocca indirizzi noti (facilmente aggirabile). Il filtraggio DNS reindirizza le richieste (aggirabile con DNS alternativi). La Deep Packet Inspection (DPI) analizza il contenuto stesso dei pacchetti cercando pattern di VPN, parole chiave, o fingerprint di protocolli proibiti — molto più difficile da aggirare.",["Esatto! Il blocco IP è facilmente aggirabile con indirizzi alternativi. La DPI analizza il contenuto stesso dei pacchetti, rilevando anche le VPN dai loro pattern di traffico.","Non è corretto. La DPI è selettiva: analizza e blocca specifici contenuti, non tutto il traffico.","Non è corretto. I cavi fisici non sono bloccati: il filtraggio avviene a livello software.","Non è corretto. La DPI è trasparente all'utente: analizza i pacchetti senza richiedere autenticazione."]],["Perché il World Wide Web (1991) non è la stessa cosa di Internet?",["Il Web è un'applicazione costruita sopra Internet: usa HTML, URL e HTTP per collegare pagine ipertestuali","Il Web è più sicuro di Internet perché usa la cifratura HTTPS","Il Web è la parte visibile di Internet; Internet include anche il 'deep web'","Internet è il vecchio sistema; il Web è il nuovo sistema che lo ha sostituito"],0,"Internet è l'infrastruttura di rete (cavi, protocolli TCP/IP, router, indirizzi IP). Il World Wide Web — inventato da Tim Berners-Lee nel 1991 al CERN — è un'applicazione costruita sopra Internet, che usa HTML (linguaggio di pagine), URL (indirizzi) e HTTP (protocollo). Esistono molte altre applicazioni su Internet: email, streaming, gaming, VoIP.",["Esatto! Il testo chiarisce: Internet è l'infrastruttura di rete (cavi, protocolli, router). Il Web (inventato da Berners-Lee nel 1991 al CERN) è una delle tante applicazioni costruite sopra quella infrastruttura.","Non è corretto. La distinzione riguarda cosa sono (infrastruttura vs applicazione), non la sicurezza.","Non è corretto. Il 'deep web' è un concetto diverso. Il Web e Internet si distinguono per essere applicazione vs infrastruttura.","Non è corretto. Il Web non ha sostituito Internet: è un servizio che usa Internet, insieme a email, VoIP, gaming, ecc."]],["Qual è l'implicazione della 'data sovereignty' (sovranità dei dati) per le aziende che servono cittadini europei?",["I dati dei cittadini europei devono essere trattati secondo le norme GDPR, con conseguenze sulla localizzazione dei data center","I dati europei devono essere fisicamente conservati in Europa senza eccezioni","Le aziende europee non possono usare cloud americano","I dati dei cittadini europei devono essere gratuiti e accessibili a tutti"],0,"La 'data sovereignty' (sovranità sui dati) riguarda quale legge si applica ai dati. Il GDPR europeo (2018) stabilisce che i dati dei cittadini europei devono essere trattati secondo le norme europee, con conseguenze sulla localizzazione e configurazione dei data center. La Cina va oltre: impone che i dati dei propri cittadini restino fisicamente in Cina.",["Esatto! Il GDPR (2018) impone che i dati dei cittadini europei siano trattati secondo le norme europee, il che ha conseguenze su dove i data center possono essere localizzati o come devono essere configurati.","Non è corretto. Il GDPR non impone necessariamente la localizzazione fisica in Europa: impone le norme di trattamento.","Non è corretto. Le aziende europee possono usare cloud americano se garantiscono il rispetto del GDPR.","Non è corretto. La data sovereignty riguarda la protezione e la giurisdizione, non la gratuità."]],["Perché il 'DNS spoofing' è più pericoloso del semplice blocco di un sito web?",["Perché reindirizza l'utente a un sito fraudolento senza che il browser mostri nessun errore visibile","Perché cancella i file dell'utente","Perché blocca tutti i siti web contemporaneamente","Perché rallenta la connessione Internet dell'utente"],0,"Il DNS spoofing sostituisce la risposta DNS legittima con un indirizzo IP falso, reindirizzando l'utente su un sito fraudolento. Il browser non mostra nessun errore: l'utente è convinto di essere sul sito corretto. La difesa è DNSSEC, che verifica l'autenticità delle risposte DNS con firma digitale.",["Esatto! Il DNS spoofing sostituisce l'IP legittimo con uno falso: l'utente digita il sito reale ma arriva su un sito truffaldino, senza alert visibili nel browser.","Non è corretto. Il DNS spoofing non cancella file: reindirizza il traffico verso siti fraudolenti.","Non è corretto. Il DNS spoofing è selettivo: colpisce specifici domini, non tutti.","Non è corretto. Il DNS spoofing non rallenta la connessione: reindirizza silenziosamente il traffico."]]],"A":[["Il caso del sabotaggio dei cavi baltici (2024) solleva una domanda di governance: chi è responsabile di proteggere i cavi sottomarini?",["Esiste un vuoto: le convenzioni di Ginevra li proteggono, ma l'enforcement in acque internazionali è quasi impossibile","L'ONU ha piena autorità di proteggere i cavi sottomarini con le proprie forze navali","I proprietari privati (Google, Meta) devono proteggere militarmente i propri cavi","I cavi sono già protetti dalle acque profonde: non hanno bisogno di protezione aggiuntiva"],0,"Il testo descrive un vuoto di governance: le convenzioni di Ginevra del 1958 proteggono i cavi in acque internazionali, ma 'l'enforcement è quasi impossibile'. La NATO ha creato nel 2023 una Coordination Cell specificamente per i cavi atlantici. L'UE li ha inseriti nella Critical Entities Resilience Directive (2022). Ma il quadro rimane frammentato.",["Esatto! Il testo indica che i cavi vivono in un 'vuoto di governance internazionale': le convenzioni del 1958 esistono ma l'enforcement è quasi impossibile. La NATO ha creato una Coordination Cell nel 2023.","Non è corretto. L'ONU non ha forze navali autonome e il testo non indica l'ONU come responsabile della protezione dei cavi.","Non è corretto. Le aziende private non hanno mandato militare: la protezione è responsabilità statale e internazionale.","Non è corretto. Il testo indica che 'in acque profonde, la protezione è minima — l'isolamento geografico è la loro principale difesa'."]],["La Cina impone che i dati dei propri cittadini restino su server fisicamente in Cina. Quali sono le due motivazioni del testo?",["Controllo politico dei dati e sicurezza nazionale","Protezione della privacy dei cittadini e riduzione dei costi","Velocità delle connessioni e riduzione della dipendenza dai cavi sottomarini","Promozione dell'industria tecnologica cinese e tutela del diritto d'autore"],0,"Il testo indica che la localizzazione forzata dei dati cinesi è 'sia di controllo politico che di sicurezza nazionale'. Controllo politico: il governo può accedere ai dati degli utenti. Sicurezza nazionale: ridurre la dipendenza da servizi stranieri che potrebbero interrompere l'accesso in caso di conflitto.",["Esatto! Il testo identifica entrambe le motivazioni: il controllo politico (il governo può accedere ai dati) e la sicurezza nazionale (ridurre l'esposizione ai servizi stranieri).","Non è corretto. Il testo non indica la privacy dei cittadini come motivazione: la Cina ha motivazioni di controllo statale, non di tutela della privacy individuale.","Non è corretto. La velocità non è la motivazione: è il controllo e la sicurezza nazionale.","Non è corretto. Sebbene ci siano effetti sull'industria tech cinese, il testo identifica controllo politico e sicurezza nazionale come motivazioni."]],["Sei il rappresentante di Wikimedia Italia che deve scrivere una lettera al Parlamento contro una legge di DPI per la disinformazione. Qual è il primo argomento più solido?",["Il meccanismo è facilmente abusabile per bloccare dissenso legittimo, violando la net neutrality EU","Il DPI è tecnicamente impossibile da implementare","La disinformazione non esiste e quindi la legge è inutile","Il costo di implementazione è troppo alto per l'Italia"],0,"Il testo descrive il dibattito nel compito di realtà: i critici della legge DPI sostengono che 'è censura, crea un meccanismo facilmente abusabile per bloccare dissenso legittimo, e viola la net neutrality garantita dal Regolamento UE 2015/2120'. L'argomento legale (violazione del diritto europeo) è il più forte per un'organizzazione come Wikimedia.",["Esatto! Il testo identifica questi due argomenti nel dibattito sul DPI: il rischio di censura del dissenso legittimo e la violazione del Regolamento UE 2015/2120 sulla net neutrality.","Non è corretto. Il DPI è già usato dal Great Firewall cinese: è tecnicamente possibile. L'argomento efficace riguarda i diritti e la legge.","Non è corretto. La disinformazione esiste: negarlo è un argomento fragile. L'argomentazione deve riguardare il metodo proposto.","Non è corretto. L'argomento economico è debole: se fosse economico, non cambierebbe il problema dei diritti fondamentali."]],["Un traceroute da Roma verso Seoul attraversa 4-7 paesi. Qual è l'implicazione legale di questo percorso?",["Ogni paese attraversato può richiedere accesso ai dati in transito secondo le proprie leggi nazionali","I dati sono automaticamente protetti dalla legge italiana per tutta la durata del transito","I dati vengono decifrati in ogni paese attraversato","Non ci sono implicazioni legali: Internet è uno spazio senza leggi"],0,"Il testo indica esplicitamente: 'Questo ha implicazioni legali: ogni paese i cui cavi vengono usati può teoricamente richiedere accesso ai dati in transito secondo le proprie leggi.' Un pacchetto da Roma a Seoul che passa per un paese con leggi di sorveglianza permissive è potenzialmente accessibile a quel governo — anche se cifrato (può essere registrato per decifrarlo in futuro).",["Esatto! Il testo lo indica esplicitamente: 'ogni paese i cui cavi vengono usati può teoricamente richiedere accesso ai dati in transito secondo le proprie leggi'.","Non è corretto. La legge italiana non si applica ai server e cavi di altri paesi.","Non è corretto. I dati cifrati rimangono cifrati in transito: un paese potrebbe registrarli ma non necessariamente decifrarli.","Non è corretto. Internet non è uno spazio senza leggi: ogni paese ha giurisdizione sui propri segmenti di infrastruttura."]],["L'affermazione 'Internet è decentralizzato, quindi non si può censurare né fermare' è vera o falsa?",["Parzialmente falsa: il traffico fisico si concentra in pochi nodi IXP (Francoforte, Amsterdam) e pochi cavi sottomarini","Completamente vera: Internet per definizione non ha nodi critici","Vera: solo il Great Firewall cinese è un'eccezione","Falsa: Internet non è distribuita, ha un centro di controllo fisico"],0,"Il testo chiarisce l'errore: 'Internet è stata costruita per essere resiliente agli attacchi — ma la sua infrastruttura fisica è più vulnerabile di quanto sembri.' Il traffico fisico si concentra nei principali IXP mondiali (DE-CIX a Francoforte, AMS-IX ad Amsterdam, LINX a Londra). Un attacco a questi nodi avrebbe conseguenze enormi sul traffico regionale.",["Esatto! Il testo chiarisce l'errore comune: l'architettura è distribuita ma il traffico fisico si concentra in pochissimi nodi. Un attacco ai principali IXP o cavi potrebbe avere conseguenze enormi.","Non è corretto. Il testo identifica esplicitamente i nodi IXP e i cavi sottomarini come punti di concentrazione e vulnerabilità.","Non è corretto. Il testo indica che anche la censura è possibile in molti paesi, e che i nodi fisici sono vulnerabili.","Non è corretto. Internet ha architettura distribuita, ma il traffico si concentra in certi punti fisici critici."]],["Perché la concentrazione dei cavi sottomarini nelle mani di Google, Meta e Microsoft è considerata un problema geopolitico?",["Perché poche aziende private americane controllano l'infrastruttura di comunicazione globale senza oversight democratico","Perché queste aziende fanno pagare tariffe troppo alte per l'uso dei cavi","Perché i cavi privati sono meno affidabili di quelli pubblici","Perché queste aziende usano i cavi solo per i propri servizi e non per quelli concorrenti"],0,"Il testo indica che la proprietà dei cavi da parte di Google, Meta, Amazon, Microsoft 'concentra il controllo dell'infrastruttura di comunicazione globale in poche mani private — una concentrazione di potere che non aveva precedenti storici.' Questo significa che poche aziende private americane controllano l'infrastruttura di cui dipendono miliardi di persone nel mondo.",["Esatto! Il testo indica: 'questo concentra il controllo dell'infrastruttura globale di comunicazione in poche mani private — una concentrazione di potere senza precedenti storici'.","Non è corretto. Il testo non menziona tariffe: il problema è la concentrazione del controllo infrastrutturale.","Non è corretto. Il testo non confronta affidabilità pubblico/privato: il problema è la concentrazione del potere.","Non è corretto. I cavi trasportano anche traffico di terzi: il problema è il controllo dell'infrastruttura, non l'esclusività."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
