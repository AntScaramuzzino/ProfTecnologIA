<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Il piatto equilibrato</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>
window.LABVERIFICA={"id":"MC-ALI-2-03","F":[["Cosa sono i macronutrienti?",["Sostanze che regolano le reazioni biochimiche senza fornire energia","Nutrienti che danno energia e materiale per costruire i tessuti","Elementi chimici come ferro, calcio e zinco essenziali per il corpo","Sostanze prodotte dall'organismo durante la digestione"],1,"I macronutrienti (carboidrati, proteine, grassi) forniscono energia e i mattoni per costruire tessuti. I micronutrienti (vitamine, minerali) non forniscono energia ma regolano migliaia di reazioni biochimiche essenziali.",["Non è corretto. Hai descritto i micronutrienti (vitamine e minerali). I macronutrienti hanno una funzione diversa.","Esatto! I macronutrienti (carboidrati, proteine, grassi) forniscono l'energia e i mattoni strutturali per l'organismo. I micronutrienti invece regolano le reazioni biochimiche.","Non è corretto. Questi sono minerali, una categoria di micronutrienti. I macronutrienti sono carboidrati, proteine e grassi.","Non è corretto. I macronutrienti sono componenti degli alimenti che introduciamo dall'esterno, non sostanze prodotte dall'organismo."]],["Quale macronutriente fornisce 9 kcal per grammo, il valore più alto?",["I carboidrati","Le proteine","I grassi (lipidi)","Le fibre alimentari"],2,"I grassi forniscono 9 kcal/g, il doppio di carboidrati e proteine (4 kcal/g). Per questo sono la riserva energetica più efficiente del corpo. Il cervello è composto per il 60% da grassi.",["Non è corretto. I carboidrati forniscono 4 kcal/g. Sono la fonte energetica principale ma non la più concentrata.","Non è corretto. Le proteine forniscono 4 kcal/g, come i carboidrati. La loro funzione primaria è strutturale, non energetica.","Esatto! I grassi forniscono 9 kcal per grammo, il doppio di carboidrati e proteine. Sono la fonte energetica più concentrata e sono indispensabili per le membrane cellulari e gli ormoni.","Non è corretto. Le fibre non sono digeribili dall'uomo e non forniscono calorie significative. Il loro valore è diverso: nutrono il microbioma intestinale."]],["Cosa distingue i 9 aminoacidi 'essenziali' dagli altri 11?",["Gli essenziali si trovano solo negli alimenti animali","Gli essenziali devono essere introdotti con la dieta perché il corpo non sa produrli","Gli essenziali sono necessari solo durante la crescita, non per gli adulti","Gli essenziali forniscono energia, gli altri costruiscono i tessuti"],1,"Il corpo umano usa 20 aminoacidi: 11 li produce da solo; 9 sono 'essenziali' perché non può sintetizzarli e devono venire obbligatoriamente dall'alimentazione. Una carenza di aminoacidi essenziali compromette la sintesi proteica.",["Non è corretto. Alcuni alimenti vegetali come soia, quinoa e amaranto contengono tutti e 9 gli aminoacidi essenziali (proteine complete).","Esatto! Il corpo sa produrre 11 aminoacidi da solo. Gli altri 9 sono 'essenziali' perché devono necessariamente venire dal cibo: senza di loro, alcune proteine non possono essere sintetizzate.","Non è corretto. Gli aminoacidi essenziali sono necessari per tutta la vita: per la sintesi proteica, la riparazione dei tessuti, la produzione di ormoni e anticorpi.","Non è corretto. La distinzione essenziale/non essenziale non riguarda la funzione dell'aminoacido ma la capacità del corpo di sintetizzarlo o meno."]],["La piramide alimentare mediterranea mette alla base quale gruppo di alimenti?",["Carne e pesce, da consumare ad ogni pasto","Cereali integrali, frutta, verdura, legumi e olio d'oliva","Latticini e formaggi, fonti principali di calcio","Dolci e zuccheri, da consumare come fonte energetica principale"],1,"La piramide della dieta mediterranea mette alla base cereali integrali, frutta, verdura, legumi e olio d'oliva, da consumare ad ogni pasto. Al vertice ci sono carne rossa e dolci, da consumare raramente.",["Non è corretto. Carne e pesce sono nel secondo livello della piramide. La base è riservata agli alimenti da consumare più frequentemente.","Esatto! La piramide mediterranea mette alla base cereali integrali, frutta, verdura, legumi e olio d'oliva: gli alimenti da consumare ad ogni pasto.","Non è corretto. I latticini sono nel secondo livello della piramide mediterranea. Non sono alla base.","Non è corretto. I dolci si trovano al vertice della piramide, da consumare raramente, non alla base."]],["Cos'è la celiachia?",["Un'allergia stagionale al polline che colpisce anche il sistema digestivo","Un'intolleranza permanente al glutine che danneggia l'intestino tenue","Una scelta dietetica di eliminare il glutine per migliorare le prestazioni fisiche","Una condizione che colpisce solo i bambini e che si risolve con la crescita"],1,"La celiachia è un'intolleranza autoimmune permanente al glutine. Il glutine scatena una risposta immunitaria che danneggia le pareti dell'intestino tenue. Colpisce circa l'1% della popolazione italiana. L'unica terapia è l'eliminazione permanente del glutine.",["Non è corretto. La celiachia non è un'allergia stagionale. È una patologia autoimmune permanente legata a uno specifico alimento.","Esatto! La celiachia è un'intolleranza permanente al glutine: nelle persone celiache il glutine scatena una risposta autoimmune che danneggia l'intestino tenue, compromettendo l'assorbimento di tutti i nutrienti.","Non è corretto. La celiachia è una patologia medica, non una scelta dietetica. Non va confusa con la dieta senza glutine per altre motivazioni.","Non è corretto. La celiachia è una condizione permanente: l'intolleranza al glutine non scompare con l'età. L'unica terapia è l'eliminazione totale e permanente del glutine."]],["Quale vitamina non si trova in nessun alimento di origine vegetale e deve essere integrata nelle diete vegane?",["Vitamina C","Vitamina D","Vitamina B12","Vitamina A"],2,"La vitamina B12 si trova esclusivamente in alimenti animali. I vegani devono integrarla obbligatoriamente con supplementi o alimenti arricchiti. La sua carenza provoca anemia megaloblastica e danni neurologici progressivi.",["Non è corretto. La vitamina C è abbondante in frutta e verdura (agrumi, kiwi, peperoni). Non è un problema per i vegani.","Non è corretto. La vitamina D è prodotta dalla pelle con la luce solare. Anche vegetali come funghi esposti al sole ne contengono. Il problema principale dei vegani è la B12.","Esatto! La vitamina B12 si trova solo in alimenti animali. I vegani devono necessariamente integrarla con supplementi. La sua carenza causa danni neurologici.","Non è corretto. I vegani possono ottenere vitamina A attraverso il beta-carotene (precursore della vitamina A) presente in molti vegetali arancioni come carote e zucca."]]],"I":[["Perché i carboidrati complessi (amidi) sono preferibili agli zuccheri semplici come fonte energetica quotidiana?",["Perché forniscono più calorie per grammo rispetto agli zuccheri semplici","Perché si digeriscono lentamente e rilasciano glucosio poco alla volta","Perché non aumentano mai la glicemia, a differenza degli zuccheri semplici","Perché contengono proteine e grassi oltre ai carboidrati"],1,"I carboidrati complessi (amidi) vengono digeriti lentamente, rilasciando glucosio gradualmente. Nessun picco glicemico, energia costante per ore. Gli zuccheri semplici causano picchi rapidi che stimolano la produzione di insulina e, nel lungo periodo, aumentano il rischio di diabete tipo 2.",["Non è corretto. Sia i carboidrati complessi che gli zuccheri semplici forniscono 4 kcal/g. La differenza riguarda la velocità di assorbimento, non la quantità di calorie.","Esatto! Gli amidi vengono digeriti lentamente e rilasciano glucosio gradualmente nel sangue. Gli zuccheri semplici causano picchi glicemici rapidi che nel lungo periodo aumentano il rischio di diabete.","Non è corretto. Anche i carboidrati complessi aumentano la glicemia, ma in modo graduale e controllato. Non la azzerano.","Non è corretto. I carboidrati complessi non contengono naturalmente proteine o grassi significativi. Il vantaggio è il profilo glicemico, non la composizione macronutrizionale."]],["Perché la combinazione pasta e fagioli fornisce un profilo proteico completo, pur usando solo alimenti vegetali?",["Perché la cottura insieme crea nuovi aminoacidi","Perché cereali e legumi insieme coprono tutti gli aminoacidi essenziali","Perché fagioli e pasta hanno entrambi aminoacidi essenziali identici che si sommano","Perché i fagioli, essendo legumi, contengono proteine complete come quelle animali"],1,"Cereali (pasta, riso) e legumi (fagioli, lenticchie) hanno profili aminoacidici complementari: i cereali mancano di alcuni aminoacidi che i legumi hanno, e viceversa. Insieme coprono tutti i 9 aminoacidi essenziali, come le proteine animali complete.",["Non è corretto. La cottura non crea aminoacidi. I due alimenti si completano perché hanno profili aminoacidici complementari.","Esatto! I cereali mancano di lisina ma sono ricchi di metionina; i legumi sono ricchi di lisina ma carenti di metionina. Insieme coprono tutti gli aminoacidi essenziali: è un principio scoperto prima ancora della biochimica.","Non è corretto. La complementarità non è nella somma degli stessi aminoacidi, ma nell'integrazione di aminoacidi diversi che ciascun alimento manca.","Non è corretto. I fagioli hanno un profilo aminoacidico incompleto. La qualità proteica completa si ottiene solo dalla combinazione con i cereali."]],["Lo Studio PREDIMED ha dimostrato che la dieta mediterranea riduce del 30% il rischio cardiovascolare. Quali elementi sono stati identificati come protettivi?",["L'alto contenuto di proteine animali e il basso contenuto di carboidrati","Acidi grassi monoinsaturi dell'olio d'oliva, omega-3 del pesce azzurro, polifenoli e fibre dei legumi","Il consumo quotidiano di vino rosso in grandi quantità e l'uso del burro come grasso principale","L'eliminazione totale dei grassi e dei carboidrati dalla dieta"],1,"Lo Studio PREDIMED (oltre 7.000 adulti) ha dimostrato che la dieta mediterranea riduce del 30% il rischio cardiovascolare. I fattori protettivi chiave: acidi grassi monoinsaturi dell'olio d'oliva, omega-3 del pesce azzurro, polifenoli delle verdure, fibre dei legumi e cereali integrali.",["Non è corretto. La dieta mediterranea non è una dieta ad alto contenuto proteico animale. La protezione cardiovascolare viene da grassi insaturi, polifenoli, omega-3 e fibre.","Esatto! Il PREDIMED ha identificato questi elementi come responsabili della riduzione del 30% del rischio cardiovascolare: olio d'oliva extravergine, pesce azzurro (omega-3), polifenoli e fibre.","Non è corretto. Il vino è considerato in quantità moderate, non in grandi quantità. Il grasso principale della dieta mediterranea è l'olio d'oliva, non il burro.","Non è corretto. La dieta mediterranea non elimina né grassi né carboidrati. È una dieta equilibrata che privilegia i grassi insaturi e i carboidrati complessi."]],["Quali sono gli acidi grassi trans e perché sono considerati i più pericolosi per la salute cardiovascolare?",["Sono grassi di origine animale presenti nella carne rossa che aumentano il colesterolo HDL","Nascono dall'idrogenazione industriale degli oli e alzano il colesterolo LDL","Sono grassi polinsaturi naturali presenti nel pesce azzurro che riducono l'infiammazione","Sono grassi tropicali come l'olio di palma e di cocco, vietati in Europa"],1,"I grassi trans si formano dall'idrogenazione industriale degli oli vegetali. Aumentano il colesterolo LDL (cattivo) e riducono quello HDL (buono). Dal 2021, nessun olio o grasso in Europa può contenere più del 2% di grassi trans sul totale dei grassi.",["Non è corretto. I grassi trans si formano dall'idrogenazione industriale degli oli vegetali, non sono naturalmente presenti in grande quantità nella carne. E aumentano il colesterolo LDL (cattivo), non HDL.","Esatto! I grassi trans si formano nell'idrogenazione industriale (produzione di margarine e prodotti da forno). Aumentano il colesterolo LDL (cattivo) e riducono quello HDL (buono): la combinazione peggiore per il sistema cardiovascolare.","Non è corretto. Hai descritto gli omega-3, che sono benefici. I grassi trans sono invece dannosi e artificiali.","Non è corretto. L'olio di palma e cocco sono saturi (non trans) e non sono vietati. I grassi trans sono stati limitati dall'UE dal 2021 a max 2% del totale grassi."]],["Un barattolo da 330 ml di bibita zuccherata contiene mediamente 35 g di zucchero. Come si confronta con la quota giornaliera raccomandata per un adolescente?",["Rappresenta circa il 10% della quota di zuccheri aggiunti raccomandata giornalmente","Rappresenta circa l'87% della quota massima di zuccheri aggiunti raccomandata per un adolescente","Non supera mai la quota raccomandata perché la bibita contiene anche acqua","Rappresenta meno del 50% della quota raccomandata perché gli adolescenti hanno un fabbisogno calorico elevato"],1,"Un barattolo da 330 ml contiene mediamente 35 g di zucchero, pari all'87% della quota massima di zuccheri aggiunti raccomandata per un adolescente in un'intera giornata. Il testo indica che la quota non dovrebbe superare il 10% dell'apporto calorico totale.",["Non è corretto. Il rapporto è molto più alto. 35 g di zucchero in una sola bibita è già quasi la quota giornaliera massima.","Esatto! Il testo indica che 35 g di zucchero in una sola bibita rappresenta già l'87% della quota massima di zuccheri aggiunti raccomandata per un adolescente in un'intera giornata.","Non è corretto. L'acqua della bibita non 'diluisce' il contenuto calorico e non riduce la quantità di zucchero che viene assorbita dall'organismo.","Non è corretto. Il fabbisogno calorico elevato non giustifica un alto consumo di zuccheri semplici, soprattutto aggiunti artificialmente."]],["Perché lo spreco alimentare ha anche un impatto ambientale oltre a quello economico?",["Perché il cibo sprecato produce metano in discarica che contribuisce al cambiamento climatico","Perché il cibo sprecato contamina le falde acquifere con sostanze chimiche","Perché il trasporto del cibo sprecato occupa inutilmente i camion della nettezza urbana","Perché il cibo sprecato deve essere incenerito con emissione di CO₂ e diossine"],0,"Sprecare cibo significa sprecare tutto ciò che è servito per produrlo: acqua, energia, suolo. Se lo spreco alimentare mondiale fosse un Paese, sarebbe il terzo emettitore mondiale di gas serra dopo Cina e USA. Ogni famiglia italiana butta in media 67 kg di cibo l'anno.",["Esatto! Il cibo sprecato in discarica produce metano (gas serra). Ma lo spreco significa anche sprecare tutta l'acqua, l'energia e il suolo usati per produrre quel cibo. Il sistema alimentare mondiale produce il 26% delle emissioni globali.","Parzialmente corretto ma incompleto. L'impatto principale è più ampio: sprecare cibo significa sprecare anche tutta l'acqua, l'energia e il suolo usati per produrlo.","Non è corretto. L'impatto ambientale principale dello spreco alimentare non è il trasporto della spazzatura, ma la produzione di risorse (acqua, terra, energia) che non hanno generato beneficio.","Non è corretto. Il problema principale non è lo smaltimento in sé, ma il fatto che tutte le risorse (acqua, terra, energia) impiegate per produrre quel cibo sono state sprecate."]]],"A":[["La Barretta C (22 g di grassi, 12 g saturi, 32 g zuccheri) è confrontata con la Barretta B (8 g grassi, 1 g saturi, 12 g zuccheri, 14 g proteine) per uno spuntino post-allenamento. Quale sceglieresti e perché?",["La Barretta C perché ha più calorie totali e aiuta il recupero energetico post-allenamento","La Barretta B perché ha più proteine per il recupero muscolare, meno zuccheri e meno grassi saturi","La Barretta A perché ha il miglior rapporto tra carboidrati e grassi totali","Non si può scegliere senza conoscere anche il prezzo di ciascuna barretta"],1,"Per uno spuntino post-allenamento, la Barretta B è ottimale: 14 g di proteine (recupero muscolare), 12 g di zuccheri (meno picco glicemico), 1 g di grassi saturi (profilo cardiovascolare migliore). La Barretta C ha il doppio dei grassi saturi e quasi il triplo degli zuccheri.",["Non è corretto. Le calorie totali non sono il criterio principale per un recupero muscolare ottimale. Il profilo dei macronutrienti (soprattutto proteine e tipo di grassi) è più rilevante.","Esatto! La B ha 14 g di proteine (ottimo per il recupero muscolare), solo 12 g di zuccheri (meno picco glicemico), 1 g di grassi saturi. È la scelta ottimale per uno spuntino post-allenamento.","Non è corretto. La Barretta A ha meno proteine della B e più grassi saturi della B. Non è la scelta ottimale per il recupero post-allenamento.","Non è corretto. I valori nutrizionali sono sufficienti per fare una scelta informata. Il prezzo è un fattore aggiuntivo, non necessario per la valutazione nutrizionale."]],["Un prodotto pubblicizza 'Light 0% grassi'. Quale analisi critica dell'etichetta dovresti fare prima di concludere che è la scelta più sana?",["Verificare solo che il prodotto abbia il marchio di qualità europeo","Verificare se al posto dei grassi ci sono zuccheri o dolcificanti","Comprare comunque il prodotto perché 'light' garantisce sempre meno calorie","Evitarlo sempre perché i prodotti light contengono sempre additivi pericolosi"],1,"I prodotti 'light 0% grassi' spesso compensano la mancanza di grassi aggiungendo zuccheri o dolcificanti artificiali. Un yogurt greco intero con frutti di bosco freschi può essere nutrizionalmente più completo di uno yogurt scremato artificialmente dolcificato. La qualità degli ingredienti conta più del profilo calorico.",["Non è corretto. Un marchio di qualità non sostituisce la lettura critica dei valori nutrizionali e degli ingredienti. Sono informazioni diverse.","Esatto! I prodotti light spesso riducono i grassi ma aumentano lo zucchero per compensare il sapore, o usano dolcificanti artificiali (aspartame, stevia) con effetti ancora studiati sul microbioma. La qualità degli ingredienti conta più del profilo calorico.","Non è corretto. Un prodotto light può avere meno grassi ma più zuccheri, risultando non necessariamente più sano per il metabolismo complessivo.","Non è corretto. I prodotti light non contengono necessariamente additivi pericolosi. La valutazione corretta richiede di leggere l'etichetta, non di escludere categoricamente una categoria."]],["Il testo indica che il microbioma intestinale svolge funzioni fondamentali. Quale tipo di dieta lo favorisce?",["Una dieta ricca di proteine animali per fornire aminoacidi ai batteri intestinali","Una dieta ricca di fibre diversificate che nutrono la varietà di batteri intestinali","Una dieta senza carboidrati per evitare fermentazioni batteriche indesiderate","Una dieta liquida per facilitare il transito intestinale e ridurre il carico batterico"],1,"Il microbioma intestinale ospita 100.000 miliardi di batteri di oltre 1.000 specie che producono vitamine, educano il sistema immunitario e producono neurotrasmettitori (il 90% della serotonina viene dall'intestino). Una dieta ricca di fibre diversificate mantiene alta la diversità e la salute del microbioma.",["Non è corretto. Il testo indica che sono le fibre diversificate a nutrire il microbioma. Le proteine animali in eccesso non sono indicate come favorevoli alla diversità microbica intestinale.","Esatto! Il microbioma intestinale ospita 100.000 miliardi di batteri di oltre 1.000 specie. Una dieta ricca di fibre diversificate mantiene alta la diversità del microbioma, con benefici su digestione, sistema immunitario e produzione di neurotrasmettitori.","Non è corretto. I carboidrati fermentabili (fibre) sono esattamente il nutrimento principale del microbioma intestinale. Eliminarli riduce la diversità e la salute del microbioma.","Non è corretto. Il microbioma intestinale non va 'ridotto' ma diversificato e nutrito con fibre. Una dieta liquida poverebbe di substrati i batteri benefici."]],["Perché i disturbi del comportamento alimentare (DCA) non devono essere trattati nel solo contesto scolastico?",["Perché sono rari e non riguardano gli studenti delle scuole medie","Perché sono patologie psicologiche che richiedono trattamento specialistico (psicologico, medico, nutrizionale)","Perché la scuola non ha l'autorizzazione legale per trattare argomenti di salute mentale","Perché sono causati esclusivamente da abitudini familiari scorrette che la scuola non può modificare"],1,"I DCA (anoressia, bulimia, binge eating) sono patologie psicologiche che si manifestano attraverso il comportamento alimentare. Non sono capricci o scelte dietetiche. Richiedono trattamento specialistico multidisciplinare. Il Ministero della Salute ha un numero verde dedicato: 800 180 969.",["Non è corretto. I DCA colpiscono anche gli adolescenti. Non sono rari e il contesto scolastico può svolgere un ruolo di sensibilizzazione, ma non di trattamento.","Esatto! I DCA (anoressia, bulimia, binge eating) sono patologie riconosciute che richiedono trattamento multidisciplinare specialistico. Il contesto scolastico non è il luogo appropriato per il trattamento, ma può orientare verso il supporto.","Non è corretto. La scuola può affrontare argomenti di salute e benessere. La ragione per cui i DCA richiedono specialisti è clinica, non legale.","Non è corretto. I DCA hanno cause multifattoriali (psicologiche, sociali, biologiche). Non dipendono solo dalla famiglia e richiedono approcci terapeutici specializzati."]],["La ricerca ha trovato che un'alta 'alfabetizzazione nutrizionale' è associata a scelte più sane indipendentemente dal reddito. Cosa significa questo per l'educazione alimentare?",["Che l'alimentazione sana è accessibile solo a chi guadagna bene, rendendo l'educazione alimentare secondaria","Che la conoscenza del cibo è uno strumento di autonomia per fare scelte migliori anche con risorse economiche limitate","Che la scuola può sostituire completamente il ruolo della famiglia nell'educazione alimentare","Che mangiare sano è facile per tutti e che chi non lo fa non ne ha voglia"],1,"L'alfabetizzazione nutrizionale — la capacità di leggere etichette, interpretare valori nutrizionali e valutare criticamente le scelte alimentari — è associata a diete più sane indipendentemente dal reddito. È una competenza di cittadinanza che questa MC intende sviluppare.",["Non è corretto. È l'affermazione opposta: l'alfabetizzazione nutrizionale migliora le scelte indipendentemente dal reddito. L'educazione alimentare è tanto più importante quanto più il reddito è limitato.","Esatto! L'alfabetizzazione nutrizionale — capire etichette, valori nutrizionali, composizione degli alimenti — permette di fare scelte più sane indipendentemente dal reddito. È una competenza di cittadinanza.","Non è corretto. La scuola può sviluppare competenze di alfabetizzazione nutrizionale, ma non sostituisce la famiglia. I due ambienti si complementano.","Non è corretto. Il testo riconosce che le scelte alimentari dipendono da molti fattori (famiglia, pubblicità, disponibilità, ambiente). L'alfabetizzazione nutrizionale è uno strumento, non una garanzia automatica."]],["Il ferro degli alimenti vegetali si assorbe meglio in presenza di vitamina C. Quale pasto è progettato in modo ottimale per un adolescente vegetariano che vuole massimizzare l'apporto di ferro?",["Pasta al pomodoro senza condimenti aggiuntivi e yogurt","Lenticchie con pomodoro e peperoni crudi","Cereali integrali con latte e caffè al mattino","Broccoli con formaggio grattugiato e pane bianco"],1,"Il ferro degli alimenti vegetali (ferro non-eme) ha una biodisponibilità inferiore rispetto al ferro animale. La vitamina C ne aumenta significativamente l'assorbimento. Lenticchie (ricche di ferro) + pomodoro/peperoni (ricchi di vitamina C) è la combinazione ottimale per un vegetariano.",["Non è corretto. La pasta al pomodoro contiene poco ferro e vitamina C. Lo yogurt non aiuta l'assorbimento del ferro. Non è ottimale per un adolescente che vuole massimizzare il ferro.","Esatto! Le lenticchie sono ricche di ferro non-eme (vegetale). Il pomodoro e i peperoni sono fonti eccellenti di vitamina C che aumenta significativamente l'assorbimento del ferro non-eme dagli alimenti vegetali.","Non è corretto. Il caffè inibisce l'assorbimento del ferro. I cereali integrali contengono ferro ma il caffè riduce significativamente la biodisponibilità.","Non è corretto. I broccoli contengono ferro e vitamina C, ma il calcio del formaggio può interferire con l'assorbimento del ferro. E il pane bianco ha meno ferro del pane integrale."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}

.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}

/* bersagli più grandi per il tocco (prima dell'ingrandimento) */

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
