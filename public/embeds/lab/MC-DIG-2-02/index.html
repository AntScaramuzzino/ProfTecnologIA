<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Le tracce che lasci</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-DIG-2-02","F":[["Secondo il GDPR, quale di queste informazioni è considerata un dato personale?",["Solo il nome e il cognome di una persona","L'indirizzo IP del dispositivo","Solo i dati sui documenti di identità fisici (passaporto, carta d'identità)","Nessun dato digitale è personale perché non è associato a un documento ufficiale"],1,"Il GDPR (Regolamento UE 2016/679, applicato da maggio 2018) definisce dato personale come 'qualsiasi informazione riguardante una persona fisica identificata o identificabile'. La definizione include: indirizzo IP, cookie, geolocalizzazione GPS, dati biometrici, dati sanitari, comportamenti di navigazione. Anche dati apparentemente innocui possono diventare personali se combinati con altri.",["Non è corretto. Il GDPR definisce dato personale in modo molto ampio: qualsiasi informazione che, da sola o combinata con altre, può identificare una persona fisica. Nome e cognome sono solo uno degli esempi più ovvi.","Esatto. L'indirizzo IP è un dato personale secondo il GDPR: identifica il dispositivo e, associato ad altri dati, identifica la persona che lo usa. Lo stesso vale per geolocalizzazione, cookie, dati biometrici e comportamenti di navigazione.","Non è corretto. Il GDPR si applica specificamente anche ai dati digitali. I documenti fisici sono solo una categoria. L'IP, i cookie, la geolocalizzazione e i comportamenti online sono dati personali a tutti gli effetti.","Non è corretto. Il GDPR è nato proprio per proteggere i dati digitali. Un documento ufficiale non è necessario: basta che il dato possa identificare una persona, anche indirettamente o combinato con altri dati."]],["Cosa sono i cookie di profilazione e come differiscono dai cookie tecnici?",["I cookie di profilazione migliorano la velocità del sito; i cookie tecnici lo rallentano","I cookie tecnici sono necessari per far funzionare il sito (es. sessione di login); i cookie di profilazione tracciano il comportamento per costruire un profilo pubblicitario","I cookie di profilazione proteggono il sito dagli hacker; i cookie tecnici raccolgono statistiche","Sono la stessa cosa: tutti i cookie raccolgono dati personali allo stesso modo"],1,"I cookie sono file salvati dal browser. I cookie tecnici permettono il funzionamento base (mantenerti loggato, salvare il carrello). I cookie analitici raccolgono statistiche di navigazione. I cookie di profilazione — spesso di terze parti — tracciano il comportamento su molti siti diversi per costruire un profilo e vendere pubblicità. Il GDPR richiede consenso esplicito solo per analitici e di profilazione.",["Non è corretto. La velocità del sito è migliorata dalla cache del browser, non dai cookie. I cookie tecnici sono necessari per il funzionamento (es. mantenerti loggato); i cookie di profilazione tracciano il comportamento per pubblicità.","Esatto. I cookie tecnici sono indispensabili (senza di essi il sito non funziona). I cookie di profilazione — spesso di terze parti — seguono la tua navigazione su molti siti diversi per costruire un profilo delle tue preferenze.","Non è corretto. La protezione dagli hacker è compito dei sistemi di sicurezza lato server, non dei cookie. I cookie di profilazione servono per la pubblicità mirata, non per la sicurezza.","Non è corretto. Esistono almeno tre categorie distinte di cookie: tecnici (necessari), analitici (statistiche anonimizzate) e di profilazione (tracking pubblicitario). La differenza è importante sia tecnicamente sia legalmente."]],["Cosa permette di fare il 'diritto all'oblio' previsto dall'Art. 17 del GDPR?",["Dimenticare la password e reimpostarla senza conseguenze legali","Richiedere la cancellazione dei propri dati personali da una piattaforma, con alcune limitazioni","Accedere a tutti i dati che una piattaforma ha raccolto su di te","Navigare su internet in modo completamente anonimo senza tracce"],1,"Il diritto all'oblio (Art. 17 GDPR) consente di chiedere a una piattaforma di cancellare i propri dati personali. Non è assoluto: la richiesta può essere rifiutata se i dati sono necessari per adempiere a obblighi legali, per interesse pubblico, o per difendere diritti in sede legale. Le piattaforme hanno 30 giorni per rispondere. Nella pratica, esercitare questo diritto su contenuti già ampiamente diffusi è molto più complicato.",["Non è corretto. Il diritto all'oblio riguarda i dati personali conservati da aziende e piattaforme, non la gestione delle password. È uno dei sei diritti fondamentali del GDPR.","Esatto. Il diritto all'oblio (Art. 17 GDPR) permette di chiedere la cancellazione dei propri dati. Non è assoluto: le piattaforme possono rifiutare se hanno motivi legali per conservarli (es. obblighi fiscali). Hanno 30 giorni per rispondere.","Non è corretto. Accedere ai propri dati è il diritto di accesso (Art. 15), non il diritto all'oblio. Il diritto all'oblio (Art. 17) riguarda la cancellazione — due diritti distinti con procedure diverse.","Non è corretto. Il GDPR non garantisce l'anonimato nella navigazione. Il diritto all'oblio riguarda la cancellazione di dati già raccolti su di te da piattaforme specifiche."]],["Cos'è il GDPR e da quando è in applicazione?",["Un sistema di valutazione dei siti web creato da Google nel 2010","Il Regolamento Generale sulla Protezione dei Dati dell'Unione Europea (2016/679), applicato dal 25 maggio 2018","Una legge italiana del 2022 che regola l'uso dei social media da parte dei minorenni","Un accordo volontario tra le grandi aziende tecnologiche per tutelare la privacy degli utenti"],1,"Il GDPR (General Data Protection Regulation) è il Regolamento UE 2016/679, in applicazione dal 25 maggio 2018. È vincolante in tutti i paesi dell'Unione Europea e ha effetto extraterritoriale: si applica a qualsiasi organizzazione nel mondo che raccoglie dati di cittadini europei. Le sanzioni possono arrivare al 4% del fatturato annuo globale — questo spiega perché anche Google e Meta debbano rispettarlo.",["Non è corretto. Il GDPR non è un sistema di Google. È un regolamento dell'Unione Europea sulla protezione dei dati personali. Google è soggetta al GDPR come qualsiasi altra azienda che tratta dati di cittadini europei.","Esatto. GDPR = General Data Protection Regulation, Regolamento UE 2016/679. Adottato nel 2016 e applicato dal 25 maggio 2018 in tutti i paesi dell'Unione Europea. È uno dei sistemi di protezione dei dati più stringenti al mondo.","Non è corretto. Il GDPR è un regolamento europeo, non una legge italiana. Si applica in tutti i 27 paesi dell'Unione Europea dall'anno 2018, non dal 2022.","Non è corretto. Il GDPR è un regolamento vincolante con forza di legge — non un accordo volontario. Le aziende che lo violano ricevono sanzioni fino al 4% del fatturato annuo globale."]],["Quale caratteristica distingue il cyberbullismo da un normale litigio tra compagni?",["Il cyberbullismo avviene solo su Instagram; i litigi normali avvengono di persona","Il cyberbullismo è ripetuto, intenzionale e implica uno squilibrio di potere tra chi agisce e chi subisce","Il cyberbullismo è un crimine penale solo se commesso da adulti; tra minorenni non è reato","Il cyberbullismo esiste solo se la vittima lo denuncia alle forze dell'ordine"],1,"Il cyberbullismo (Legge n. 71/2017) è comportamento aggressivo, intenzionale e ripetuto tramite strumenti digitali verso una persona. I tre criteri che lo distinguono da un conflitto normale: (1) ripetitività — non un singolo episodio; (2) intenzionalità — deliberato, non accidentale; (3) squilibrio di potere — l'autore ha un vantaggio (anonimato, numero, influenza) rispetto alla vittima.",["Non è corretto. Il cyberbullismo può avvenire su qualsiasi piattaforma digitale — messaggistica, giochi online, email, commenti. La piattaforma specifica non definisce il cyberbullismo.","Esatto. La Legge n. 71/2017 definisce il cyberbullismo attraverso tre criteri: è ripetuto (non un episodio isolato), è intenzionale (non accidentale), e c'è uno squilibrio di potere (es. molti contro uno, o anonimato).","Non è corretto. La Legge n. 71/2017 si applica specificamente al cyberbullismo tra minorenni. Prevede strumenti di tutela anche senza procedimento penale: le vittime possono chiedere la rimozione dei contenuti direttamente alle piattaforme.","Non è corretto. La Legge n. 71/2017 permette alla vittima minorenne di chiedere la rimozione dei contenuti direttamente alle piattaforme, e al questore di ammonire l'autore, senza necessità di una denuncia penale formale."]],["La modalità privata (o 'in incognito') del browser — cosa fa e cosa NON fa?",["Ti rende completamente anonimo su internet, nascondendo la tua identità a tutti i siti","Non salva cronologia, cookie e password sul tuo dispositivo — ma il tuo IP rimane visibile ai siti e al provider internet","Cifra tutto il traffico internet come una VPN, proteggendoti dagli hacker","Blocca tutti i cookie, inclusi quelli tecnici, rendendo inaccessibili i siti che richiedono login"],1,"La modalità privata del browser impedisce solo al browser di salvare localmente cronologia, cookie e password sulla sessione corrente. Non cifra il traffico di rete: il tuo indirizzo IP è ancora visibile ai siti visitati, al provider internet (ISP), e alla rete scolastica o aziendale. Per una protezione più completa esistono strumenti diversi come VPN o Tor — con caratteristiche e limiti propri.",["Non è corretto. La modalità privata non ti rende anonimo. Il tuo indirizzo IP è ancora visibile ai siti che visiti, al tuo provider internet, e alla rete scolastica o aziendale.","Esatto. La modalità privata protegge solo la privacy locale (sul tuo dispositivo): nessun altro che usa quel computer vedrà la cronologia. Ma non cifra il traffico: il provider e i siti visitati vedono comunque la tua attività.","Non è corretto. La modalità privata non cifra il traffico di rete. Una VPN (Virtual Private Network) fa questo. La modalità privata è semplicemente una sessione del browser che non salva dati localmente.","Non è corretto. La modalità privata non blocca tutti i cookie durante la sessione — li accetta ma non li salva dopo la chiusura della finestra. Puoi fare login normalmente, ma al termine della sessione il cookie viene eliminato."]]],"I":[["Cos'è il browser fingerprinting e cosa lo rende diverso dai cookie?",["È la funzione di riconoscimento delle impronte digitali fisiche per sbloccare il telefono — simile ai cookie perché salva un file biometrico","Identifica il browser attraverso la combinazione di caratteristiche tecniche (OS, risoluzione, font, plugin) senza salvare alcun file — diversamente dai cookie che richiedono un file","È un virus che copia i cookie da un browser e li trasmette ad altri siti senza consenso","È identico ai cookie di profilazione: entrambi salvano un file nel browser con le informazioni dell'utente"],1,"Il browser fingerprinting identifica il browser attraverso la combinazione di caratteristiche tecniche: browser e versione, sistema operativo, risoluzione schermo, font installati, plugin, lingua, fuso orario, scheda grafica. Questa combinazione è unica o quasi per ogni dispositivo. Diversamente dai cookie, non richiede nessun file salvato: cancellare la cronologia o i cookie non blocca il fingerprinting.",["Non è corretto. Il browser fingerprinting non riguarda le impronte digitali fisiche. È una tecnica di identificazione del browser attraverso le sue caratteristiche tecniche, senza salvare nessun file sul dispositivo.","Esatto. Il fingerprinting analizza dozzine di caratteristiche del tuo browser e dispositivo. La combinazione è statisticamente unica o quasi. Eliminando i cookie non lo blocchi: non c'è nessun file da eliminare.","Non è corretto. Il browser fingerprinting non è un virus e non copia cookie. È una tecnica legale (anche se controversa) usata da molti siti per identificare i visitatori senza cookie.","Non è corretto. Questa è la differenza chiave: i cookie salvano un file; il fingerprinting no. Questo rende il fingerprinting molto più difficile da bloccare, perché non c'è nulla da cancellare sul dispositivo."]],["Quale diritto del GDPR ti permette di usare Google Takeout per scaricare tutti i dati che Google ha su di te?",["Il diritto all'oblio (Art. 17) — per eliminare tutti i dati di Google","Il diritto di accesso (Art. 15) — per sapere quali dati Google ha raccolto e riceverne copia","Il diritto di opposizione (Art. 21) — per opporsi all'uso dei tuoi dati per il marketing","Il diritto relativo a decisioni automatizzate (Art. 22) — per capire come gli algoritmi Google ti classificano"],1,"L'Art. 15 GDPR garantisce il diritto di accesso: puoi richiedere a qualsiasi organizzazione che tratta i tuoi dati di sapere quali dati ha, perché li usa, con chi li condivide, e di riceverne copia. Google Takeout (takeout.google.com) è lo strumento di Google per esercitare questo diritto: permette di scaricare email, ricerche, cronologia YouTube, posizioni GPS, contatti. I file scaricati rivelano spesso quanto dati vengano raccolti.",["Non è corretto. Il diritto all'oblio (Art. 17) è il diritto di CANCELLARE i dati. Google Takeout serve per SCARICARE (ottenere una copia) dei dati — che è il diritto di accesso e portabilità.","Esatto. L'Art. 15 GDPR garantisce il diritto di accesso: sapere quali dati ha raccolto su di te e richiederne copia. Google Takeout è lo strumento pratico per esercitare questo diritto: scarichi email, ricerche, posizioni, video guardati su YouTube e molto altro.","Non è corretto. Il diritto di opposizione (Art. 21) riguarda il blocco dell'uso dei dati per marketing diretto — non il download dei dati. Google Takeout esercita il diritto di accesso (Art. 15).","Non è corretto. L'Art. 22 riguarda il diritto a una revisione umana delle decisioni automatizzate significative. Google Takeout scarica i dati raccolti su di te — esercitando il diritto di accesso (Art. 15)."]],["Lo scandalo Cambridge Analytica: come sono stati raccolti i dati di circa 87 milioni di profili se solo 270.000 persone avevano installato l'app?",["Cambridge Analytica aveva hackerato i server di Facebook rubando i dati","Le policy di Facebook dell'epoca permettevano alle app di raccogliere i dati degli amici degli utenti senza il loro consenso: 270.000 utenti × ~300 amici = ~87 milioni di profili","Cambridge Analytica aveva comprato i dati direttamente da Facebook con un contratto regolare","Gli utenti avevano condiviso volontariamente i propri dati su Facebook, che erano quindi pubblici"],1,"Cambridge Analytica usò un'app ('thisisyourdigitallife', un quiz di personalità) che raccoglieva dati dagli utenti di Facebook. Le policy di Facebook del 2014 permettevano alle app di raccogliere anche i dati degli amici degli utenti che le installavano — senza consenso di quegli amici. 270.000 utenti × media ~300 amici = ~87 milioni di profili. Questi dati furono usati per costruire modelli psicologici degli elettori americani e targetizzare messaggi politici personalizzati.",["Non è corretto. Non si trattò di un hack. Facebook consentiva legalmente alle app di raccogliere anche i dati degli amici degli utenti che le installavano — senza che quegli amici avessero dato consenso.","Esatto. All'epoca Facebook permetteva alle app di raccogliere non solo i dati dell'utente che le installava, ma anche quelli di tutti i suoi amici. 270.000 utenti diretti × media ~300 amici = ~87 milioni di profili, senza che quegli amici avessero mai acconsentito.","Non è corretto. I dati furono raccolti tramite un'app esterna (un quiz di personalità). Non fu un acquisto diretto da Facebook: fu uno sfruttamento delle API di Facebook che all'epoca consentivano l'accesso ai dati degli amici.","Non è corretto. I dati degli amici non erano pubblici: erano informazioni del profilo personale. Il punto è che le API di Facebook permettevano alle app di accedervi senza che quegli amici avessero dato consenso specifico."]],["Cosa succede nei circa 50 millisecondi che passano mentre la pagina web sta caricando, prima che tu veda un annuncio pubblicitario?",["Google seleziona manualmente l'annuncio più adatto in base alla tua ultima ricerca","Si svolge un'asta automatica (Real-Time Bidding) tra centinaia di inserzionisti che offrono per mostrarti il loro annuncio basandosi sul tuo profilo","Il sito web che stai visitando sceglie l'annuncio più coerente con il suo argomento","Il browser carica un database locale di annunci salvati in precedenza e ne sceglie uno a caso"],1,"Il Real-Time Bidding (RTB) è il sistema che sta dietro alla pubblicità personalizzata: in ~50 millisecondi (mentre la pagina carica) si svolge un'asta automatica tra centinaia di reti pubblicitarie. Ognuna ha accesso al tuo profilo (costruito dai cookie di terze parti) e fa un'offerta automatica per mostrarti il proprio annuncio. Vince chi offre di più per quel profilo in quel momento.",["Non è corretto. Il processo è completamente automatizzato, non manuale. Avviene in ~50 millisecondi — nessun essere umano potrebbe farlo in quel tempo.","Esatto. Il Real-Time Bidding è un'asta lampo: in ~50ms centinaia di reti pubblicitarie accedono al tuo profilo (costruito dai cookie) e fanno offerte automatiche. Chi offre di più vince e mostra il suo annuncio.","Non è corretto. Nel Real-Time Bidding, l'annuncio non si basa sull'argomento del sito ma sul profilo dell'utente. Lo stesso sito può mostrare annunci completamente diversi a utenti diversi.","Non è corretto. Non esiste un database locale di annunci nel browser. Il Real-Time Bidding avviene su server remoti in tempo reale — non localmente."]],["La Legge n. 71/2017 sul cyberbullismo: cosa può fare concretamente una vittima minorenne senza aspettare un processo penale?",["Niente: deve aspettare la maggiore età per sporgere denuncia formale alle forze dell'ordine","Può chiedere direttamente alle piattaforme la rimozione dei contenuti; il questore può ammonire l'autore senza denuncia penale formale","Può bloccare l'autore sui social media — questa è l'unica tutela prevista dalla legge","Può pubblicare i nomi degli autori online in risposta — la legge protegge il diritto di difendersi"],1,"La Legge n. 71/2017 prevede procedure rapide per le vittime minorenni: (1) la vittima o un genitore può segnalare i contenuti alla piattaforma, che ha 24 ore per rispondere (48 in casi complessi); (2) il questore — su richiesta della vittima — può convocare e ammonire l'autore, senza avviare un processo penale formale. L'ammonizione è un avvertimento ufficiale che crea un precedente in caso di recidiva.",["Non è corretto. La Legge n. 71/2017 è nata proprio per dare strumenti rapidi alle vittime minorenni senza dover attendere un processo penale, che è lento e non sempre applicabile.","Esatto. La legge prevede due strumenti rapidi: (1) la vittima minorenne (o un genitore) può chiedere direttamente alla piattaforma la rimozione dei contenuti entro 24 ore; (2) il questore può emettere un'ammonizione verso l'autore senza procedimento penale.","Non è corretto. Bloccare l'autore è una misura personale, non uno strumento legale. La Legge n. 71/2017 prevede strumenti più efficaci: richiesta di rimozione alle piattaforme e ammonizione del questore.","Non è corretto. Pubblicare nomi altrui potrebbe configurare a sua volta diffamazione. La legge offre strumenti di tutela formali — rimozione contenuti e ammonizione — non autorizza azioni ritorsive."]],["Quale categoria di dati costituisce la 'zona grigia' più pericolosa dell'identità digitale — apparentemente privata ma spesso accessibile a molti?",["I dati di pagamento (numero carta di credito) — ovviamente sensibili ma protetti dalle banche","La lista degli amici, le foto con geolocalizzazione e i commenti in gruppi 'chiusi' — sembrano privati ma sono accessibili a molti","Il nome utente e la foto del profilo — pubblici per definizione","I messaggi privati in chat — completamente al sicuro perché cifrati end-to-end"],1,"La zona grigia dell'identità digitale include dati che sembrano privati ma non lo sono: gruppi Facebook 'chiusi' con migliaia di membri, foto con geolocalizzazione integrata (EXIF), commenti in community online, elenco degli amici (che può rivelare appartenenze politiche o religiose), reazioni e like visibili ad altri. Questi dati, combinati, costruiscono un profilo molto dettagliato anche senza accesso diretto ai messaggi privati.",["Non è corretto. I dati di pagamento sono sensibili e generalmente protetti da standard di sicurezza specifici (PCI-DSS). La 'zona grigia' riguarda dati che sembrano privati ma non lo sono.","Esatto. I gruppi 'chiusi' su Facebook possono avere migliaia di membri. Le foto con geolocalizzazione rivelano abitudini, luoghi frequentati, domicilio. La lista degli amici può rivelare affiliazioni politiche o religiose.","Non è corretto. Nome utente e foto del profilo sono consapevolmente pubblici — non sono 'zona grigia'. La zona grigia riguarda dati che si crede siano privati ma in realtà sono accessibili a molte persone.","Non è corretto. Non tutti i servizi di messaggistica usano la cifratura end-to-end, e anche quando la usano i metadati (chi ha scritto a chi, quando, da dove) rimangono spesso accessibili. Inoltre i messaggi possono essere salvati dagli interlocutori."]]],"A":[["Il D.M. 183/2024 (Traguardo D2) afferma che la privacy è un diritto fondamentale, non solo una preferenza personale. Quale argomento supporta meglio questa posizione?",["Perché le persone stanno più tranquille sapendo che i loro dati sono al sicuro","Perché è sancita dalla Carta dei Diritti UE (Art. 8), tutela la libertà di pensiero e associazione, e — come mostra Cambridge Analytica — la sua violazione può influenzare elezioni","Perché le aziende che violano la privacy devono pagare multe elevate — e le multe fanno paura","Perché i dati personali hanno un valore economico elevato sul mercato pubblicitario"],1,"L'Art. 8 della Carta dei Diritti Fondamentali dell'UE sancisce la protezione dei dati personali come diritto fondamentale. Il D.M. 183/2024 Traguardo D2 chiede di comprenderne le implicazioni: la privacy non è solo riservatezza individuale — protegge la libertà di pensiero (sapere di essere osservati cambia il comportamento), di associazione, e di voto (Cambridge Analytica: 87 milioni di profili usati per messaggi politici personalizzati). La violazione della privacy di massa può alterare processi democratici.",["Non è corretto. Il benessere soggettivo non è la base del diritto. La privacy è un diritto fondamentale perché tutela libertà concrete: di pensiero, di associazione, di voto — senza le quali la democrazia non funziona.","Esatto. La privacy non è solo comfort personale: è un pilastro della democrazia. Senza privacy, non c'è libertà di pensiero, associazione o voto. Cambridge Analytica ha dimostrato che la raccolta massiva di dati può influenzare il comportamento elettorale di milioni di persone.","Non è corretto. Le sanzioni sono un meccanismo di enforcement, non la ragione per cui la privacy è un diritto. La ragione è più profonda: la privacy protegge le condizioni di possibilità della democrazia stessa.","Non è corretto. Il valore economico dei dati descrive il problema, non il fondamento del diritto. La privacy è un diritto fondamentale per ragioni politiche e democratiche, non per ragioni di mercato."]],["Il caso Cambridge Analytica mostra una connessione diretta tra raccolta massiva di dati personali e democrazia. Quale?",["Che Facebook ha violato la legge americana sulle donazioni politiche finanziando direttamente i candidati","I dati psicologici di 87 milioni di persone furono usati per targetizzare messaggi politici personalizzati — dimostrando che la privacy individuale ha conseguenze collettive e può influenzare elezioni","Che i social media sono stati creati deliberatamente per raccogliere dati politici fin dall'inizio","Che le elezioni americane del 2016 furono annullate a causa della violazione dei dati di Facebook"],1,"Cambridge Analytica raccolse i dati di ~87 milioni di profili Facebook tramite un'app, li analizzò per costruire profili psicologici dettagliati degli elettori, e li usò per inviare messaggi politici personalizzati — adattati alle paure e ai valori specifici di ciascuno. Il caso dimostrò che la privacy individuale ha conseguenze collettive: quando i dati di molte persone vengono aggregati e usati politicamente, ne può risentire la democrazia stessa. Facebook pagò $5 miliardi di multa alla FTC.",["Non è corretto. Il caso Cambridge Analytica non riguardava finanziamenti politici diretti, ma l'uso di profili psicologici costruiti sui dati di 87 milioni di persone per targetizzare messaggi politici personalizzati.","Esatto. Cambridge Analytica costruì profili psicologici degli elettori usando i dati Facebook e li usò per inviare messaggi politici su misura per le paure e i valori di ciascuno. La privacy non era solo una questione individuale: la sua violazione influenzò (o tentò di influenzare) il risultato di elezioni.","Non è corretto. I social media non furono creati per raccogliere dati politici. Cambridge Analytica sfruttò le API di Facebook — progettate per altri scopi — per raccogliere dati e usarli in modo politico non previsto originariamente.","Non è corretto. Le elezioni del 2016 non furono annullate. L'impatto reale di Cambridge Analytica sul risultato è dibattuto. Ma il caso ha dimostrato la possibilità tecnica di usare dati personali per influenzare il comportamento elettorale su larga scala."]],["Perché i dati comportamentali (per quanto tempo hai guardato un video, dove ti sei fermato nel feed) sono più preziosi per le piattaforme rispetto ai dati che hai dichiarato nel profilo?",["Perché sono più facili da raccogliere tecnicamente rispetto ai dati del profilo","Perché rivelano preferenze reali e non dichiarate — non ciò che dici di preferire, ma ciò che fai davvero — e non sono falsificabili come i dati del profilo","Perché i dati dichiarati nel profilo sono protetti dal GDPR, mentre i dati comportamentali no","Perché i dati comportamentali possono essere venduti alle aziende farmaceutiche, mentre i dati del profilo no"],1,"I dati comportamentali sono considerati i più preziosi dalle piattaforme per tre motivi: (1) sono autentici — non falsificabili consciamente, come i dati del profilo; (2) sono predittivi — permettono di anticipare comportamenti futuri con alta accuratezza; (3) sono granulari — rivelano sfumature che nessun questionario cattura (es. ti fermi sui contenuti politici di sinistra per 3 secondi, poi scorri via; sui contenuti di destra ti fermi 15 secondi). Questi dati costruiscono modelli psicologici molto precisi.",["Non è corretto. Entrambi i tipi di dati sono relativamente facili da raccogliere. La differenza di valore non è tecnica ma informativa: i dati comportamentali rivelano preferenze reali che l'utente stesso non dichiarebbe.","Esatto. Nel profilo puoi scrivere qualsiasi cosa. I dati comportamentali no: il tempo passato su un video, il punto esatto dove hai smesso di guardare, i post su cui ti sei fermato nel feed rivelano preferenze autentiche che non falsifichi consapevolmente.","Non è corretto. Il GDPR protegge entrambe le categorie di dati — sia quelli dichiarati sia quelli comportamentali, se possono identificare una persona. La differenza di valore non è legale ma informativa.","Non è corretto. Entrambe le categorie di dati possono teoricamente essere cedute a terzi (con i limiti del GDPR). Il valore superiore dei dati comportamentali dipende dalla loro autenticità e predittività, non dal destinatario."]],["Hai pubblicato una foto a 13 anni. Ora ne hai 17 e vuoi toglierla definitivamente. Perché il 'diritto all'oblio' GDPR non risolve completamente il problema?",["Perché il GDPR non si applica ai minorenni: devi aspettare i 18 anni per esercitare questo diritto","Perché chiunque ha visto la foto può averne fatto uno screenshot, copie possono esistere su server terzi, la Wayback Machine può averne una versione archiviata — il contenuto esiste indipendentemente dall'originale","Perché la piattaforma può rifiutare sempre la richiesta di cancellazione se la foto ha ricevuto molti like","Perché il GDPR si applica solo alle aziende europee — le piattaforme americane possono ignorarlo"],1,"Il diritto all'oblio (Art. 17 GDPR) è reale ma limitato: può far rimuovere l'originale dalla piattaforma, ma non elimina le copie già distribuite. Le copie possono esistere come: screenshot salvati da chiunque abbia visto la foto, versioni archiviate su Wayback Machine (archive.org), copie in cache dei motori di ricerca, reposts su altri siti o account. L'impronta digitale è 'permanente' non perché sia impossibile cancellare l'originale, ma perché le copie si moltiplicano indipendentemente.",["Non è corretto. Il GDPR si applica a tutti, indipendentemente dall'età. Un minorenne (o un genitore per conto suo) può esercitare il diritto all'oblio. Il problema non è legale ma tecnico: le copie già fatte da altri.","Esatto. Il diritto all'oblio rimuove la fonte originale, ma non le copie già distribuite: screenshot salvati da altri, versioni in cache dei motori di ricerca, archivi web come archive.org, copie su altri server. Ogni contenuto pubblicato può avere una vita indipendente dall'originale.","Non è corretto. Il numero di like non è un motivo legale per rifiutare la cancellazione. Le piattaforme possono rifiutare solo per motivi specifici (obblighi legali, interesse pubblico). Il problema è la diffusione delle copie, non il rifiuto della piattaforma.","Non è corretto. Il GDPR ha effetto extraterritoriale: si applica a qualsiasi azienda che tratta dati di cittadini europei, incluse le piattaforme americane come Facebook, Instagram, TikTok."]],["Il D.M. 183/2024 (Traguardo D3) chiede di distinguere cyberbullismo e hate speech. Qual è il confine tra i due e quali norme li regolano?",["Sono la stessa cosa: entrambi sono reati penali regolati dall'Art. 604-bis del codice penale","Cyberbullismo (L. 71/2017) = comportamento ripetuto verso un individuo specifico; hate speech (Art. 604-bis c.p.) = incitamento all'odio verso gruppi per caratteristiche identitarie — possono sovrapporsi","Il cyberbullismo riguarda solo i minorenni; l'hate speech riguarda solo gli adulti — due fenomeni completamente separati","L'hate speech è sempre meno grave del cyberbullismo perché non si rivolge a una persona specifica"],1,"Il D.M. 183/2024 Traguardo D3 chiede di distinguere: cyberbullismo (L. 71/2017) = comportamento aggressivo ripetuto verso un individuo specifico tramite strumenti digitali, con squilibrio di potere; hate speech (Art. 604-bis c.p.) = istigazione all'odio, alla discriminazione o alla violenza verso gruppi per razza, etnia, religione, orientamento sessuale. I due possono sovrapporsi: un attacco ripetuto verso qualcuno per la sua identità può essere entrambi contemporaneamente.",["Non è corretto. Cyberbullismo e hate speech sono fenomeni distinti con norme diverse. Il cyberbullismo (L. 71/2017) riguarda comportamenti ripetuti verso un individuo; l'hate speech (Art. 604-bis c.p.) riguarda l'incitamento all'odio verso gruppi.","Esatto. Un attacco ripetuto online verso una persona per la sua etnia, religione o orientamento sessuale può configurare entrambi: cyberbullismo (ripetuto verso individuo, L. 71/2017) e hate speech (incitamento odio per caratteristiche identitarie, Art. 604-bis c.p.).","Non è corretto. La L. 71/2017 si applica specificamente al cyberbullismo che coinvolge minorenni (vittime o autori). L'hate speech può coinvolgere chiunque. Ma i fenomeni possono sovrapporsi: un minorenne può commettere hate speech, e un adulto cyberbullismo.","Non è corretto. La gravità non dipende dal target specifico vs gruppo. L'hate speech può avere effetti devastanti sulle comunità bersaglio e può incitare a violenza reale. La gravità dipende dal contesto, dall'intensità e dagli effetti."]],["I modelli di intelligenza artificiale vengono spesso addestrati su testi e immagini raccolti da internet, spesso senza consenso esplicito degli utenti. Quale questione di diritto questo solleva rispetto al GDPR?",["Nessuna: i dati pubblici su internet possono essere usati liberamente da chiunque per qualsiasi scopo, incluso l'addestramento di AI","Il GDPR richiede una base legale per qualsiasi trattamento di dati personali, incluso l'addestramento AI; i modelli possono memorizzare e riprodurre informazioni personali presenti nel corpus","Il problema è solo il copyright: i testi usati per addestrare AI possono essere coperti da diritto d'autore","Non c'è nessun problema perché i modelli AI non leggono i testi: li elaborano solo statisticamente senza 'capire' le persone"],1,"L'addestramento di modelli AI su dati raccolti da internet solleva due questioni GDPR distinte: (1) base legale — qualsiasi trattamento di dati personali richiede una base legale (consenso, legittimo interesse, contratto); i termini di servizio spesso non coprono esplicitamente questo uso; (2) memorizzazione — i modelli linguistici possono memorizzare e riprodurre quasi testualmente porzioni del corpus, incluse informazioni personali. L'Autorità Garante italiana ha già avviato istruttorie su questo tema.",["Non è corretto. Il GDPR non distingue tra dati 'pubblici' e 'privati' nel senso comune: se un dato può identificare una persona, è personale indipendentemente dal fatto che sia visibile online. Il trattamento per addestramento AI richiede una base legale.","Esatto. Due questioni distinte: (1) legale — il trattamento dei dati per addestramento AI richiede una base legale GDPR (consenso, legittimo interesse, contratto); (2) tecnica — i modelli possono memorizzare e riprodurre informazioni personali presenti nel corpus di addestramento.","Non è corretto. Il copyright è un problema reale e separato. Ma la questione GDPR riguarda specificamente i dati personali: l'addestramento su testi che contengono informazioni identificabili sulle persone richiede una base legale.","Non è corretto. Il fatto che i modelli elaborino statisticamente non elimina il problema: studi dimostrano che i modelli linguistici possono memorizzare e riprodurre quasi testualmente porzioni del corpus di addestramento, incluse informazioni personali."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}
html.lim header.lab-head{padding-right:230px;gap:6px;padding-bottom:10px}
html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
