<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Robot segui-linea</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

          items: [["Microfono", "sen", ""], ["Display a LED", "att", ""], ["Accelerometro", "sen", "Misura inclinazione e scosse."], ["Altoparlante (buzzer)", "att", ""], ["Sensore di luce", "sen", ""], ["Motori delle ruote", "att", ""], ["Fotoriflettore a infrarossi per la linea", "sen", "Distingue il nero (assorbe) dal bianco (riflette)."], ["Pulsanti A e B", "sen", "Anche un pulsante è un sensore: rileva la pressione."]] },
        { type: "order", title: "L'allarme della biblioteca", items: [["Evento: quando il microfono rileva un suono forte", "La programmazione a eventi reagisce a ciò che succede."], ["Mostra un'icona sul display", ""], ["Suona un breve avviso", ""], ["Aspetta 2 secondi", "Senza pausa l'allarme suonerebbe in continuazione."], ["Cancella il display", ""]] } ],
      reflect: "Come sceglieresti la soglia di «suono forte» per una biblioteca? Come la verificheresti?" },
    { brief: "Programma il robot segui-linea: per ogni combinazione dei due sensori scegli l'azione. La tabella mostra come si comporta sul percorso di prova.",
      blocks: [
        { type: "sim", params: COMB.map(([l, r], i) => ({ id: "a" + i, label: `Sinistro ${l}, destro ${r}`, options: AZ, value: i === 0 ? "dritto" : i === 1 ? "destra" : i === 2 ? "destra" : "dritto" })),

          draw: (p) => `<div class="scroll-x"><table><thead><tr><th>Sensore sinistro</th><th>Sensore destro</th><th>Che cosa vuol dire</th><th>Il tuo robot</th></tr></thead><tbody>${COMB.map(([l, r, a], i) => `<tr><td>${l}</td><td>${r}</td><td>${["la linea è in mezzo", "la linea è a sinistra", "la linea è a destra", "linea trasversale: incrocio o arrivo"][i]}</td><td style="font-weight:700;color:var(${p["a" + i] === a ? "--ok" : "--ko"})">${AZ.find((x) => x[0] === p["a" + i])[1]}</td></tr>`).join("")}</tbody></table></div>`,
          note: (p) => p.a1 === "destra" ? ["ko", "Bug: con il sensore sinistro sul nero la linea si è spostata a sinistra, ma il robot gira a destra e la perde. Documentalo nel registro di debug."] : COMB.every((c, i) => p["a" + i] === c[2]) ? ["ok", "Il robot segue la linea e si ferma all'incrocio."] : ["warn", "Qualche combinazione non è ancora giusta: immagina dove si trova la linea rispetto ai sensori."] },
        { type: "canvas", title: "Registro di debug", fields: [["sint", "Sintomo osservato", "es. in curva il robot esce dalla linea"], ["ipo", "Ipotesi sulla causa", ""], ["test", "Test fatto per verificarla", ""], ["fix", "Correzione e risultato", ""]],
          checks: [["Ipotesi e test sono separati", (v) => v.ipo.length > 10 && v.test.length > 10]], out: (v) => `REGISTRO DI DEBUG\nSintomo: ${v.sint}\nIpotesi: ${v.ipo}\nTest: ${v.test}\nCorrezione: ${v.fix}` } ],
      reflect: "In curva stretta il robot esce comunque. Che cosa cambieresti: la velocità, la posizione dei sensori o il programma?" },
    { label: "Scenario · il corridoio affollato", brief: "Il preside vuole sapere in tempo reale se il corridoio è libero, affollato o sovraffollato, senza telecamere e senza internet. Un sensore conta chi entra e chi esce dalla porta. Imposta le soglie.",
      blocks: [
        { type: "sim", params: [{ id: "ent", label: "Persone entrate", min: 0, max: 200, step: 1, value: 64 }, { id: "usc", label: "Persone uscite", min: 0, max: 200, step: 1, value: 20 }, { id: "s1", label: "Soglia «affollato» da", min: 10, max: 80, step: 5, value: 30, unit: "persone" }, { id: "s2", label: "Soglia «sovraffollato» da", min: 20, max: 120, step: 5, value: 60, unit: "persone" }],
          outputs: [{ key: "n", label: "Persone nel corridoio", f: (p) => Math.max(0, p.ent - p.usc) }, { key: "st", label: "Stato sul display", f: (p, o) => p.s2 <= p.s1 ? "soglie da correggere" : o.n >= p.s2 ? "SOVRAFFOLLATO" : o.n >= p.s1 ? "AFFOLLATO" : "LIBERO" }],
          note: (p) => p.usc > p.ent ? ["ko", "Più uscite che entrate: il contatore ha perso qualcuno (due persone insieme? una che torna indietro?). È un caso da gestire nel programma."] : p.s2 <= p.s1 ? ["ko", "La soglia di sovraffollamento deve essere più alta di quella di affollamento."] : null },
        { type: "check", key: "rob", items: ["Il sistema non usa telecamere né riconoscimento facciale", "Funziona senza connessione internet", "Gestisce il caso di due persone che passano insieme", "Si azzera a ogni cambio dell'ora o su comando", "Ho documentato le soglie scelte e perché", "Ho testato il prototipo con almeno 3 prove reali"],
          result: (n, t) => n === t ? ["ok", "<strong>Progetto completo.</strong>"] : ["warn", `${n} requisiti su ${t}.`] } ],
      reflect: "Quale errore del sensore è più grave: contare una persona in più o una in meno? Perché?" }],
  bridge: "Progetta un robot che risolve un problema reale della scuola (rumore in corridoio, posti in mensa…): scegli sensori e attuatori, scrivi il programma e documenta i test.",
});

<script>
// Motore comune: schede livello accessibili (WAI-ARIA Tabs) + utilità
(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

</script>

<script>
window.LABVERIFICA={"id":"MC-DIG-3-01","F":[["Cosa significa la parola 'astrazione' nel pensiero computazionale avanzato?",["Creare disegni astratti come decorazione per il codice","Ignorare i dettagli irrilevanti per concentrarsi sull'essenziale","Tradurre il codice da un linguaggio di programmazione a un altro","Rimuovere tutte le istruzioni ridondanti per rendere il codice più breve"],1,"L'astrazione è scegliere quale livello di dettaglio è rilevante per il problema che stai risolvendo. Quando programmi il movimento di un robot non ti interessano i voltaggi esatti dei motori: ti interessa la velocità risultante. L'astrazione permette di lavorare a un livello gestibile ignorando complessità irrilevanti.",["Non è corretto. L'astrazione nel pensiero computazionale non ha nulla a che fare con le arti visive. È una strategia di gestione della complessità.","Esatto! Quando programmi il comportamento di un robot, non ti interessa la tensione esatta dei motori: ti interessa la velocità risultante. L'astrazione elimina i dettagli non necessari.","Non è corretto. La traduzione tra linguaggi è transpilazione o compilazione. L'astrazione è una strategia cognitiva per gestire la complessità.","Non è corretto. Rimuovere codice ridondante è ottimizzazione. L'astrazione è scegliere a quale livello di dettaglio lavorare."]],["Qual è la differenza principale tra micro:bit, LEGO Mindstorms EV3 e Arduino?",["micro:bit è il più costoso; Arduino è gratuito; LEGO Mindstorms è per bambini piccoli","micro:bit è il più semplice; EV3 unisce costruzione e codice; Arduino è il più flessibile","Tutti e tre usano lo stesso linguaggio di programmazione a blocchi, ma hanno hardware diverso","Sono strumenti identici con marche diverse"],1,"Tre piattaforme, tre filosofie: micro:bit (4×5 cm, 2015) è per iniziare con l'hardware aperto; LEGO Mindstorms EV3 integra la costruzione fisica dei robot con la programmazione; Arduino (2005, C/C++) offre massima flessibilità ed è usato in prototipazione industriale. La scelta dipende dagli obiettivi didattici.",["Non è corretto. Le differenze non riguardano principalmente il prezzo o l'età target, ma la filosofia e il tipo di progettazione che supportano.","Esatto! Tre filosofie diverse: micro:bit = semplicità di accesso; EV3 = costruzione + programmazione integrate; Arduino = massima flessibilità e potenza con linguaggio reale.","Non è corretto. Arduino si programma in C/C++ (linguaggio testuale), non a blocchi. micro:bit usa MakeCode (blocchi o JavaScript). EV3 ha il suo ambiente dedicato.","Non è corretto. Rappresentano tre approcci completamente diversi alla robotica educativa, con architetture hardware e software molto differenti."]],["Cosa fa un sensore di prossimità a ultrasuoni (HC-SR04)?",["Rileva i colori delle superfici di fronte al robot","Emette un impulso sonoro e misura il tempo di ritorno dell'eco","Misura la temperatura e l'umidità dell'ambiente circostante","Regola la velocità dei motori del robot in base al peso del carico"],1,"Il sensore HC-SR04 emette un impulso sonoro a 40 kHz (ultrasuoni, inudibili all'orecchio umano) e misura il tempo impiegato dall'eco a tornare. Distanza = (tempo × 343 m/s) / 2. Range: 2-400 cm, precisione ±3 mm. Usato per rilevare ostacoli, misurare livelli, contare presenze.",["Non è corretto. Rilevare i colori è compito del sensore di colore (TCS34725). Il sensore ultrasuoni misura la distanza da un ostacolo.","Esatto! La formula è: distanza = (tempo × velocità del suono) / 2. Il fattore 2 perché il suono fa andata e ritorno. Range tipico: 2-400 cm, precisione ±3 mm.","Non è corretto. Temperatura e umidità sono misurate dal sensore DHT22. Il sensore ultrasuoni misura le distanze dagli oggetti.","Non è corretto. La regolazione dei motori è compito degli attuatori. Il sensore ultrasuoni rileva la distanza da ostacoli."]],["Cos'è la programmazione 'event-driven' (guidata dagli eventi)?",["Un tipo di programmazione dove le istruzioni si eseguono dall'alto verso il basso in ordine fisso","Un modo di programmare in cui le istruzioni partono quando accade un evento","Un sistema in cui il robot esegue solo le istruzioni più importanti saltando quelle secondarie","Un paradigma dove il programma si ferma e aspetta input dall'utente prima di continuare"],1,"Nella programmazione event-driven, il codice si esegue quando accade qualcosa (un evento): il sensore rileva distanza \u003c 15 cm, il pulsante viene premuto, passano 5 secondi. Il vantaggio: il robot può rispondere a più eventi contemporaneamente senza che uno blocchi l'altro. In MakeCode ogni blocco 'on event X' è un gestore di eventi.",["Non è corretto. La programmazione sequenziale esegue le istruzioni in ordine fisso. La programmazione event-driven esegue il codice in risposta a eventi specifici.","Esatto! Gli eventi possono essere: il sensore rileva distanza \u003c 15 cm, il pulsante viene premuto, passano 5 secondi. Il codice dell'evento si esegue automaticamente quando l'evento si verifica.","Non è corretto. La programmazione event-driven non filtra le istruzioni per importanza. Esegue codice specifico in risposta a eventi specifici.","Non è corretto. Aspettare input dall'utente è una forma di interazione sincrona. La programmazione event-driven è asincrona: il codice reagisce agli eventi senza bloccarsi."]],["Cos'è un 'attuatore' in un sistema robotico?",["Un componente che legge le informazioni dall'ambiente (temperatura, luce, distanza)","Un componente che trasforma i segnali elettrici in azioni fisiche, come motori, LED e buzzer","Il processore centrale che elabora le istruzioni del programma","Il software che coordina la comunicazione tra sensori e robot"],1,"Gli attuatori sono i 'muscoli' del robot: trasformano i segnali elettrici in azioni fisiche. Esempi: motori DC (ruotano le ruote), servomotori (angolo preciso 0-180°), LED e display (segnali luminosi), buzzer (suoni). Il sistema robotico completo è: sensori (organi di senso) + microcontroller + programma + attuatori (muscoli).",["Non è corretto. Leggere le informazioni dall'ambiente è il compito dei sensori. Gli attuatori producono azioni sull'ambiente.","Esatto! Gli attuatori sono i 'muscoli' del robot: motori DC (movimento), servomotori (angolo preciso), LED (luce), buzzer (suono). Trasformano i comandi del programma in azioni fisiche.","Non è corretto. Il processore centrale è il microcontroller (come quello nel micro:bit). L'attuatore è il componente che esegue l'azione fisica.","Non è corretto. Il software di coordinazione è il programma. L'attuatore è hardware fisico che esegue azioni."]],["Cosa distingue un robot con 'comportamento programmato esplicitamente' da uno con 'apprendimento automatico'?",["Il robot con comportamento programmato è sempre più preciso di quello con apprendimento automatico","Nel primo ogni risposta è scritta dall'ingegnere; nel secondo il sistema ricava le regole dai dati","Il robot con apprendimento automatico non può sbagliare perché impara dai propri errori","Non c'è differenza pratica: entrambi producono lo stesso comportamento"],1,"Comportamento programmato: l'ingegnere specifica ogni risposta a ogni condizione ('se distanza \u003c 15cm → ruota destra'). Il Roomba classico funziona così. Apprendimento automatico: il sistema riceve dati e impara regole autonomamente. AlphaGo ha imparato strategie che nessun ingegnere aveva specificato. Il risultato può essere più efficiente ma meno prevedibile.",["Non è corretto. L'apprendimento automatico può produrre comportamenti più efficienti di quelli progettati manualmente in molti contesti (es. AlphaGo vs Go giocato da ingegneri).","Esatto! Il Roomba classico ha regole esplicite scritte da ingegneri (se ostacolo → ruota). AlphaGo ha imparato strategie dai dati (milioni di partite) che nessun ingegnere aveva specificato.","Non è corretto. L'apprendimento automatico può produrre comportamenti inefficienti o dannosi se i dati di addestramento sono sbagliati o insufficienti.","Non è corretto. La differenza è fondamentale: uno segue regole esplicite scritte da esseri umani; l'altro inferisce regole dai dati in modo che nessun essere umano avrebbe specificato esplicitamente."]]],"I":[["Il robot Roomba 'sembra' intelligente perché costruisce una mappa della casa. Il testo dice che questa è un'affermazione sbagliata. Cosa fa realmente?",["Costruisce una mappa 3D della casa usando telecamere ad alta risoluzione","Aggiorna di continuo una stima probabilistica della posizione: non 'conosce' la casa","Scarica la mappa della casa dal cloud ogni volta che inizia la pulizia","Memorizza la mappa durante la prima pulizia e la riusa nelle successive senza modificarla"],1,"L'INNESCA del testo inizia proprio con questa distinzione critica: 'Il Roomba evita i muri, copre tutta la stanza, torna alla base — ma non ha una mappa della tua casa. Non sa dove si trova. Costruisce ogni secondo una stima probabilistica di dove potrebbe essere.' Sembra intelligente, ma è un algoritmo. Capire la differenza è la competenza fondamentale di questa MC.",["Non è corretto. Il testo dice che il Roomba 'non ha una mappa della tua casa'. Non sa dove si trova — costruisce ogni secondo una stima probabilistica.","Esatto! L'INNESCA spiega: 'Non sa dove si trova. Costruisce ogni secondo una stima probabilistica di dove potrebbe essere.' È un algoritmo che simula un comportamento intelligente.","Non è corretto. Il testo parla di stima probabilistica in tempo reale, non di mappe scaricate dal cloud.","Non è corretto. Il testo descrive un processo dinamico: 'costruisce ogni secondo una stima probabilistica'. Non è una mappa statica memorizzata."]],["Il Box T8 afferma che 'un robot non pensa, esegue istruzioni'. Perché questa distinzione è importante per la sicurezza?",["Perché i robot che 'pensano' consumano meno energia di quelli che 'eseguono istruzioni'","Perché l'errore va cercato nel codice o nei dati, e crederlo 'intelligente' porta a fidarsi troppo","Perché i robot che 'pensano' sono proibiti dalla legge europea sulla sicurezza","Perché i robot più intelligenti richiedono programmatori più esperti e quindi costano di più"],1,"Il Box T8 spiega due ragioni per la distinzione: (1) quando un robot sbaglia, si cerca l'errore nel codice o nei dati di addestramento, non in una 'intenzione malvagia' — questo permette di trovare e correggere il problema; (2) attribuire intelligenza a un sistema che segue regole porta a fidarsi acriticamente, con rischi concreti (es. il robot chirurgico da Vinci: le decisioni rimangono sempre del chirurgo umano).",["Non è corretto. Il consumo energetico non è la ragione della distinzione. Il punto riguarda la responsabilità e la verifica degli errori.","Esatto! Il Box T8 spiega: (1) gli errori hanno cause tecniche verificabili, non intenzioni; (2) attribuire intelligenza porta a fidarsi acriticamente — con conseguenze potenzialmente gravi.","Non è corretto. Non esiste una legge che proibisca robot che 'pensano'. La questione è concettuale: comprendere cosa fa davvero un sistema automatizzato.","Non è corretto. Il costo non è la ragione della distinzione. Il punto riguarda la responsabilità umana e la verifica del comportamento dei sistemi automatizzati."]],["Il sensore ultrasuoni misura un tempo di eco di 5,8 ms. La velocità del suono nell'aria è 343 m/s. Qual è la distanza dall'ostacolo?",["Circa 2 metri","Circa 1 metro","Circa 50 centimetri","Circa 3 metri"],1,"La formula è: distanza = (tempo × velocità del suono) / 2. Con tempo = 5,8 ms = 0,0058 s e velocità = 343 m/s: distanza = (0,0058 × 343) / 2 = 1,989 / 2 = 0,995 m ≈ 1 m. Il fattore 2 è fondamentale: il suono percorre il tragitto due volte (andata verso l'ostacolo + ritorno come eco).",["Non è corretto. Distanza = (0,0058 s × 343 m/s) / 2 = 0,995 m ≈ 1 m. Il fattore 2 è perché il suono fa andata E ritorno.","Esatto! Distanza = (tempo × velocità del suono) / 2 = (0,0058 s × 343 m/s) / 2 = 1,989 / 2 = 0,995 m ≈ 1 m. Il fattore 2 perché il suono fa andata e ritorno.","Non è corretto. Il calcolo è: (0,0058 × 343) / 2 = 0,995 m, non 0,5 m.","Non è corretto. Se non si divide per 2, si ottiene 1,99 m. Dividendo per 2 (percorso di andata e ritorno) si ottiene circa 1 m."]],["Cosa studia il sistema robotico Amazon Kiva (Proteus) e quale problema ha sollevato socialmente?",["Sostituisce i robot più vecchi nei magazzini senza problemi sociali, poiché è solo un upgrade tecnologico","Porta gli scaffali agli addetti e accelera il lavoro, ma riduce il personale necessario","Funziona solo di notte per non interferire con i lavoratori durante il giorno","Sostituisce completamente gli esseri umani nei magazzini, che sono ormai completamente automatizzati"],1,"I robot Amazon Kiva/Proteus navigano nei magazzini usando marker QR code sul pavimento e comunicano via WiFi con un sistema centrale. Portano gli scaffali interi agli addetti umani invece del contrario, triplicando la velocità di prelievo. Il testo evidenzia il costo sociale: riduzione significativa della manodopera umana nei magazzini.",["Non è corretto. Il testo evidenzia esplicitamente: 'Costo sociale: riduzione significativa della manodopera umana nei magazzini.'","Esatto! Il testo descrive il sistema: invece che far camminare gli addetti tra gli scaffali, i robot Kiva portano gli scaffali agli addetti. Velocità 3-4 volte maggiore. Costo sociale: riduzione della manodopera.","Non è corretto. I robot Amazon operano in continuo. Il testo non descrive una distinzione giorno/notte.","Non è corretto. Il sistema lavora con gli addetti umani (porta gli scaffali agli addetti), non li sostituisce completamente. Riduce però il numero necessario."]],["Perché il principio KISS (Keep It Simple, Stupid) è particolarmente importante in robotica?",["Perché i robot semplici sono sempre più veloci di quelli complessi","Perché un robot semplice e affidabile è più utile di uno ricco di funzioni che si blocca","Perché i microcontroller come il micro:bit non hanno abbastanza memoria per programmi complessi","Perché i robot semplici costano meno e quindi sono più accessibili nelle scuole"],1,"Il principio KISS (Keep It Simple, Stupid), enunciato dagli ingegneri della Marina americana negli anni '60, dice che la soluzione più semplice che funziona è quasi sempre la migliore. In robotica: la tendenza dei principianti è aggiungere funzionalità finché il codice diventa ingestibile. Un robot con comportamento semplice e affidabile è più utile di uno con cento funzionalità che fallisce.",["Non è corretto. La semplicità non garantisce sempre la velocità. Il principio KISS riguarda l'affidabilità e la manutenibilità del sistema.","Esatto! Il testo dice: 'la soluzione più semplice che funziona è quasi sempre la migliore.' La tendenza dei principianti è aggiungere funzionalità finché il codice diventa ingestibile.","Non è corretto. I microcontroller hanno memoria limitata, ma il principio KISS non riguarda la memoria fisica. È un principio progettuale generale.","Non è corretto. Il principio KISS riguarda la qualità progettuale, non il costo. Un sistema semplice può essere sia economico che costoso."]],["Nel robot per studenti con disabilità visiva (caso studio), perché il 90% del lavoro è design centrato sull'utente e non programmazione?",["Perché la programmazione per accessibilità richiede linguaggi speciali che richiedono più tempo da imparare","Perché capire chi lo usa e con quali bisogni conta più del codice: un robot inadatto è pericoloso","Perché gli studenti con disabilità visiva non possono interagire con il codice sorgente del robot","Perché il micro:bit è troppo semplice per gestire la logica di navigazione avanzata"],1,"Il robot per studenti con disabilità visiva usa hardware da meno di 50€. La sfida non è tecnologica: un robot troppo veloce è pericoloso, segnali sonori troppo simili all'ambiente scolastico creano confusione. Il testo afferma: 'Il 90% del lavoro è design centrato sull'utente, non programmazione.' Capire i bisogni reali è sempre la sfida principale.",["Non è corretto. Il testo non parla di linguaggi speciali. Il punto è che l'hardware è semplice (micro:bit + 50€ di componenti) e il problema principale è capire i bisogni reali dell'utente.","Esatto! Il testo dice: 'Un robot che si muove troppo velocemente per un adolescente non vedente è inutile o pericoloso. Il 90% del lavoro è design centrato sull'utente, non programmazione.'","Non è corretto. La ragione non riguarda l'interazione con il codice, ma il fatto che comprendere i bisogni reali dell'utente è la sfida principale.","Non è corretto. Il testo dice che il sistema richiede hardware da meno di 50€ (micro:bit, motori, sensori HC-SR04, modulo audio). La semplicità hardware è un vantaggio, non un limite."]]],"A":[["Qual è la differenza fondamentale tra Deep Blue (1997) e AlphaGo (2016) nella modalità con cui 'battono' i campioni umani?",["Deep Blue era più veloce di AlphaGo perché usava hardware migliore","Deep Blue seguiva regole scritte da esperti; AlphaGo ha imparato dalle partite","Deep Blue giocava a scacchi; AlphaGo giocava a Go. Non si possono confrontare","Entrambi usano lo stesso approccio ma con hardware diverso"],1,"Il testo spiega la differenza: Deep Blue valutava 200 milioni di posizioni al secondo con regole scritte da ingegneri e Grandmaster — 'la sua intelligenza era la somma dell'intelligenza degli umani che lo avevano programmato.' AlphaGo ha usato apprendimento supervisionato + rinforzo per imparare strategie che nessun essere umano aveva specificato. Alla mossa 78 della 4° partita, Sedol ha giocato una mossa che AlphaGo non aveva mai visto.",["Non è corretto. La differenza fondamentale non è la velocità hardware, ma il meccanismo di apprendimento: uno cerca esplicitamente, l'altro impara dai dati.","Esatto! Il testo lo spiega: Deep Blue = intelligenza della somma degli esperti che lo hanno programmato. AlphaGo = ha imparato schemi che nessun umano aveva specificato. Due approcci radicalmente diversi.","Non è corretto. Il testo confronta esplicitamente i due sistemi per mostrare la differenza tra AI programmatica (Deep Blue) e AI basata su apprendimento automatico (AlphaGo).","Non è corretto. Il testo descrive approcci radicalmente diversi: ricerca esaustiva con funzioni di valutazione definite da umani (Deep Blue) vs. apprendimento da dati (AlphaGo)."]],["Il progetto AGISCI chiede di progettare un sistema robotico con implicazioni etiche sulla raccolta di dati. Quale principio del GDPR si applica alla raccolta di dati sul movimento delle persone?",["Nessuno: i dati di movimento non sono dati personali secondo il GDPR","La 'data minimization': raccogliere solo i dati strettamente necessari alla funzione del sistema","Il principio di 'right to be forgotten': ogni persona può chiedere che i suoi dati vengano cancellati dopo ogni sessione","Il principio di 'data portability': gli utenti devono poter scaricare i dati raccolti su di loro"],1,"Il progetto AGISCI chiede di progettare un sistema che conta le persone in un corridoio. La domanda 4 della metacognizione lo affronta: 'Il sistema raccoglie dati sul movimento delle persone — chi ha accesso? Come potresti raccogliere solo i dati strettamente necessari?' Il principio GDPR si chiama 'data minimization': raccogliere solo ciò che è strettamente necessario alla funzione dichiarata del sistema.",["Non è corretto. I dati di movimento e posizione (geolocalizzazione) sono dati personali secondo il GDPR perché possono identificare indirettamente una persona.","Esatto! La domanda 4 della metacognizione chiede: 'il sistema raccoglie dati sul movimento delle persone — come potresti modificarlo per raccogliere solo i dati strettamente necessari?' È il principio GDPR di data minimization.","Non è corretto. Il right to be forgotten (diritto all'oblio) riguarda la cancellazione di dati già raccolti. La data minimization (raccogliere solo il necessario) è il principio più direttamente applicabile in fase di progettazione.","Non è corretto. La portabilità riguarda il trasferimento dei dati. Il principio più rilevante per la progettazione è la data minimization."]],["Il robot da Vinci è un esempio di sistema 'telemanipolato', non autonomo. Qual è la differenza pratica per la sicurezza?",["Il robot telemanipolato è più lento del robot autonomo, quindi più sicuro","Nel telemanipolato decide tutto il chirurgo; il robot esegue con più precisione e non sceglie nulla","Il robot da Vinci usa l'intelligenza artificiale per decidere quali movimenti sono sicuri e blocca quelli pericolosi","Non c'è differenza pratica: sia i sistemi autonomi sia quelli telemanipolati hanno gli stessi rischi"],1,"Il robot chirurgico da Vinci è telemanipolato: il chirurgo siede a una console e muove joystick; il robot traduce e scala i movimenti in azioni precise con precisione sub-millimetrica ed eliminando il tremore. 'Il robot non decide nulla: è un'estensione amplificata delle mani del chirurgo.' La responsabilità rimane sempre al medico umano.",["Non è corretto. La velocità non è la distinzione rilevante. La differenza è chi prende le decisioni critiche.","Esatto! Il testo dice: 'Il robot non decide nulla: è un'estensione amplificata delle mani del chirurgo.' La responsabilità della diagnosi e della decisione chirurgica è sempre del medico umano.","Non è corretto. Il da Vinci è telemanipolato, non autonomo: traduce i movimenti del chirurgo in movimenti precisi, non prende decisioni autonome su quali movimenti fare.","Non è corretto. La distinzione è critica per la sicurezza: in un sistema telemanipolato la responsabilità è chiaramente del chirurgo umano; in un sistema autonomo la catena di responsabilità è più complessa."]],["Nel progetto avanzato SPERIMENTA, il sistema a due micro:bit comunicanti via radio deve gestire 'errori di comunicazione'. Qual è il problema algoritmico specifico?",["I due micro:bit potrebbero contarsi a vicenda come persone che passano nel corridoio","Se un messaggio radio si perde, il conteggio delle persone nel corridoio risulta sbagliato","I due micro:bit potrebbero interferire l'uno con l'altro e smettere di funzionare","I due micro:bit consumano la batteria più velocemente se comunicano via radio"],1,"Nel sistema distribuito con due micro:bit che comunicano via radio, il problema critico è: 'Cosa succede se un messaggio viene perso?' Se il micro:bit all'uscita non riceve l'aggiornamento del conteggio dall'entrata, il terzo micro:bit (che calcola il numero totale di persone nel corridoio) usa dati obsoleti e mostra un numero errato. Gestire questa eventualità è un classico problema di sistemi distribuiti.",["Non è corretto. I micro:bit non conterebbero se stessi come persone (non attraversano la porta). Il problema di comunicazione è diverso.","Esatto! Il testo del progetto distribuito chiede: 'Cosa succede se un messaggio viene perso?' Se il micro:bit all'uscita non riceve l'aggiornamento dal micro:bit all'entrata, il conteggio totale è errato.","Non è corretto. L'interferenza fisica è un problema diverso dalla perdita di messaggi. Il problema algoritmico è la gestione dei messaggi persi, non l'interferenza hardware.","Non è corretto. Il consumo di batteria è un problema tecnico reale ma non è l'errore algoritmico critico descritto nel progetto."]],["Perché il riconoscimento di schemi (pattern recognition) è una competenza così importante nel pensiero computazionale avanzato applicato alla robotica?",["Perché permette al robot di riconoscere visivamente le persone in un corridoio","Perché riconoscere strutture ricorrenti permette di riusare la stessa soluzione in problemi diversi","Perché è necessario per capire quali linguaggi di programmazione usano i robot avanzati","Perché permette al microcontroller di processare più dati contemporaneamente grazie alla parallelizzazione"],1,"Il riconoscimento di schemi (pattern recognition) permette di identificare strutture ricorrenti in problemi diversi. Il testo usa l'esempio: 'Un robot che evita ostacoli e un termostato hanno lo stesso pattern: sensore → condizione → azione → verifica.' Una volta riconosciuto il pattern, la soluzione si trasferisce da un dominio all'altro senza dover ricominciare da zero.",["Non è corretto. Il riconoscimento visivo di persone usa computer vision (non trattato in questa MC). Il riconoscimento di schemi nel pensiero computazionale riguarda i pattern nei problemi.","Esatto! Il testo usa questo esempio: il pattern 'sensore → condizione → azione → verifica' si applica a un robot che evita ostacoli E a un termostato che controlla la temperatura. Riconoscere il pattern trasferisce la soluzione da un dominio all'altro.","Non è corretto. Il riconoscimento di schemi è una strategia cognitiva generale, non una competenza specifica per linguaggi di programmazione.","Non è corretto. La parallelizzazione è una caratteristica hardware (multi-core). Il riconoscimento di schemi è una strategia mentale per la risoluzione di problemi."]],["La documentazione tecnica richiesta nel livello Avanzato della SPERIMENTA include 'implicazioni etiche'. Perché un sistema che conta le persone in un corridoio solleva questioni etiche concrete?",["Non solleva questioni etiche: è solo un contatore, non raccoglie dati personali identificativi","Raccoglie dati sui movimenti delle persone, che potrebbero servire a sorvegliarle","Perché potrebbe malfunzionare e lasciare passare persone non autorizzate","Perché gli studenti hanno meno di 18 anni e non possono progettare sistemi di monitoraggio"],1,"Il sistema che conta persone in un corridoio raccoglie dati comportamentali: quando le persone entrano, escono, pattern di affollamento nel tempo. La documentazione richiesta dal livello Avanzato chiede esplicitamente: 'chi ha accesso a questi dati? Come potrebbero essere usati impropriamente? Come applicare la data minimization?' Anche dati aggregati possono rivelare informazioni sensibili.",["Non è corretto. Anche dati aggregati (numero di persone in un luogo nel tempo) possono rivelare pattern comportamentali rilevanti per la privacy.","Esatto! Il testo chiede: 'questo sistema raccoglie dati sul movimento delle persone — chi ha accesso a questi dati? Come potrebbero essere usati impropriamente?' Anche dati apparentemente anonimi possono identificare indirettamente.","Non è corretto. Il malfunzionamento è un problema tecnico, non etico. Le questioni etiche riguardano la raccolta e l'uso dei dati, non il funzionamento tecnico.","Non è corretto. Non esiste un'età minima per progettare sistemi di monitoraggio. Le questioni etiche riguardano la gestione responsabile dei dati, non l'età del progettista."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}

.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}

/* bersagli più grandi per il tocco (prima dell'ingrandimento) */

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
