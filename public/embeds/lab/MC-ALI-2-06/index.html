<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Il comitato del cibo futuro</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>

<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }

      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},

    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-ALI-2-06","F":[["Di quanto deve aumentare la produzione alimentare mondiale entro il 2050 per nutrire circa 10 miliardi di persone?",["Del 10-15%","Del 50-70%","Del 200-300%","Del 20-30%"],1,"Per nutrire circa 10 miliardi di persone previsti per il 2050, la produzione alimentare dovrà aumentare del 50-70%. Ma quasi tutta la terra coltivabile è già sfruttata, l'acqua è sempre meno, il clima cambia. Servono innovazioni tecnologiche radicali.",["Non è corretto. L'aumento necessario è molto maggiore. Il sistema alimentare attuale è già sotto pressione con 8 miliardi di persone.","Esatto! La produzione alimentare dovrà aumentare del 50-70% rispetto a oggi per nutrire circa 10 miliardi di persone entro il 2050, ma quasi tutta la terra coltivabile è già sfruttata.","Non è corretto. Sebbene la sfida sia enorme, l'aumento necessario stimato da FAO e altri enti è del 50-70%, non del 200%.","Non è corretto. Il 20-30% sarebbe insufficiente. La crescita demografica e il miglioramento delle diete in paesi in sviluppo richiedono un aumento molto maggiore."]],["La fermentazione è usata nell'industria alimentare da quanti anni?",["Da circa 200 anni (dalla Rivoluzione Industriale)","Da circa 10.000 anni","Da circa 500 anni (dalla scoperta dell'America)","Da circa 150 anni (da quando Pasteur ha scoperto i microrganismi)"],1,"La fermentazione è una biotecnologia vecchia di almeno 10.000 anni: pane lievitato, vino, birra, yogurt, formaggio, kimchi, kefir, miso. La tecnologia alimentare moderna segue la stessa logica antica: risolvere problemi pratici con strumenti biologici. Solo la scala e la precisione sono cambiate.",["Non è corretto. La fermentazione è molto più antica della Rivoluzione Industriale. È una delle biotecnologie più antiche dell'umanità.","Esatto! La fermentazione (pane, vino, birra, yogurt, formaggio) è una biotecnologia vecchia di almeno 10.000 anni. La tecnologia alimentare non è nuova: è sempre esistita.","Non è corretto. La fermentazione del pane, del vino e della birra è documentata in Mesopotamia, Egitto e Cina da almeno 8.000-10.000 anni.","Non è corretto. Pasteur ha spiegato il meccanismo biologico della fermentazione nel 1864, ma la fermentazione veniva usata dagli esseri umani da millenni prima, senza capire perché funzionasse."]],["Cosa si intende per 'agricoltura di precisione'?",["L'agricoltura biologica che non usa pesticidi per non danneggiare l'ecosistema","L'uso di sensori, dati e tecnologie digitali per gestire ogni zona del campo in modo differenziato","La coltivazione in piccoli appezzamenti con tecniche artigianali tradizionali","La misurazione precisa delle rese agricole per calcolare i profitti dell'azienda"],1,"L'agricoltura di precisione usa sensori nel suolo, droni con telecamere multispettrali, GPS e algoritmi per gestire ogni zona del campo in modo differenziato. Ogni pianta riceve esattamente quello di cui ha bisogno: meno sprechi di acqua e fertilizzanti, rese più alte.",["Non è corretto. L'agricoltura di precisione e quella biologica sono concetti diversi. L'agricoltura di precisione può usare pesticidi, ma solo dove e quando necessario.","Esatto! L'agricoltura di precisione usa sensori nel suolo, droni, GPS e algoritmi per dare a ogni pianta esattamente quello di cui ha bisogno, dove ne ha bisogno, quando ne ha bisogno.","Non è corretto. L'agricoltura di precisione è ad alta tecnologia. Non riguarda la dimensione degli appezzamenti ma l'uso di dati per ottimizzare ogni decisione colturale.","Non è corretto. La misurazione delle rese è uno degli output dell'agricoltura di precisione, non la sua definizione. L'obiettivo principale è ottimizzare l'uso di acqua, fertilizzanti e pesticidi."]],["Il Feed Conversion Ratio (FCR) del grillo è circa 1,7. Cosa significa?",["Un grillo produce 1,7 grammi di proteina per ogni ora di allevamento","Per produrre 1 kg di peso corporeo di grillo, servono 1,7 kg di mangime vegetale","Il 17% del peso del grillo è composto da proteine","Un grillo può sopravvivere mangiando 1,7 volte il suo peso al giorno"],1,"FCR (Feed Conversion Ratio) indica quanti kg di cibo servono per produrre 1 kg di peso corporeo. Grillo: 1,7 (molto efficiente). Pollo: 2,5. Maiale: 5,0. Bovino: 8,0. Il grillo è quasi 5 volte più efficiente del bovino: produce la stessa proteina con molto meno mangime vegetale.",["Non è corretto. Il FCR misura un rapporto di peso cibo/peso corporeo, non un rapporto tempo/proteina.","Esatto! FCR = kg di cibo necessari per produrre 1 kg di peso corporeo. Il grillo (FCR 1,7) è molto più efficiente del bovino (FCR 8): per la stessa quantità di proteine, il bovino richiede quasi 5 volte più cibo.","Non è corretto. Il contenuto proteico (70% del peso secco del grillo) è diverso dall'indice di conversione alimentare che misura l'efficienza nel trasformare mangime in massa corporea.","Non è corretto. Il FCR non indica il consumo giornaliero di cibo ma il rapporto totale tra cibo consumato e massa corporea prodotta durante l'allevamento."]],["Quali paesi hanno autorizzato la vendita pubblica di carne coltivata in laboratorio?",["Francia e Germania nel 2022","Singapore nel 2023 e USA nel 2024","Cina e India nel 2021","Italia e Paesi Bassi nel 2025"],1,"Singapore (2023) è stato il primo Paese al mondo ad autorizzare la vendita pubblica di carne coltivata (pollo, prodotto da Upside Foods). Gli USA hanno approvato due prodotti nel 2024. In Europa il percorso di approvazione normativa è ancora in corso. La disponibilità nei supermercati europei è attesa forse entro il 2027-2030.",["Non è corretto. I paesi europei non hanno ancora autorizzato la vendita pubblica di carne coltivata. Il percorso normativo in Europa è in corso.","Esatto! Singapore è stato il primo Paese al mondo ad autorizzare la vendita di pollo coltivato (2023). Gli USA hanno approvato due prodotti di carne coltivata nel 2024. In Europa il percorso è ancora in corso.","Non è corretto. Né la Cina né l'India hanno ancora autorizzato la vendita pubblica di carne coltivata in laboratorio.","Non è corretto. In Europa, inclusa l'Italia, la carne coltivata non è ancora in vendita. Il processo di approvazione normativa è in corso."]],["Quante specie di insetti ha approvato l'Unione Europea per il consumo umano tra il 2021 e il 2024?",["Una sola specie (il grillo domestico)","Quattro specie","Dodici specie diverse di insetti commestibili","Nessuna: in Europa è ancora vietato consumare insetti"],1,"Tra il 2021 e il 2024 l'UE ha approvato 4 specie per il consumo umano: grillo domestico, larva di farina gialla (Tenebrio molitor), locusta migratrice e verme della farina minore. Prodotti come farina di grillo e snack proteici sono già disponibili in alcuni supermercati italiani.",["Non è corretto. L'UE ha approvato più specie, non solo il grillo.","Esatto! L'UE ha approvato 4 specie: grillo domestico (Acheta domesticus), larva di farina gialla (Tenebrio molitor), locusta migratrice e verme della farina minore.","Non è corretto. Il numero di specie approvate dall'UE per il consumo umano è quattro, non dodici.","Non è corretto. L'UE ha già approvato quattro specie di insetti per il consumo umano, e i prodotti (farina di grillo, snack proteici) si trovano già in alcuni supermercati italiani."]]],"I":[["La vertical farming riduce il consumo idrico del 95% rispetto all'agricoltura tradizionale. Qual è il suo principale svantaggio ambientale?",["Produce grandi quantità di rifiuti organici difficili da smaltire","Richiede elevato consumo di energia elettrica per l'illuminazione LED artificiale","Produce alimenti con valori nutritivi inferiori rispetto all'agricoltura in pieno campo","Genera inquinamento sonoro significativo nelle aree urbane dove viene installata"],1,"La vertical farming riduce il consumo idrico del 95% e non usa pesticidi (ambienti chiusi). Ma richiede molta energia per i LED. Se proviene da fonti fossili, l'impatto carbonio può essere peggiore dell'agricoltura tradizionale. Per questo è conveniente solo dove c'è energia rinnovabile abbondante.",["Non è corretto. La vertical farming produce meno scarti organici rispetto all'agricoltura tradizionale. Il problema principale è energetico.","Esatto! La vertical farming riduce acqua del 95% ma richiede molta energia elettrica per i LED. Se quell'energia viene da fonti fossili, l'impatto ambientale complessivo può essere peggiore dell'agricoltura tradizionale.","Non è corretto. Le ricerche non mostrano una riduzione sistematica dei valori nutritivi nella vertical farming. Il problema è energetico, non nutrizionale.","Non è corretto. L'inquinamento sonoro non è il problema principale della vertical farming. Il consumo energetico è la sfida ambientale principale."]],["Come funziona la micoproteina di Quorn (già in vendita in Italia) e qual è il suo impatto ambientale rispetto alla carne?",["È estratta da funghi selvatici commestibili: impatto simile alla carne per l'impatto di raccolta","È prodotta dalla fermentazione del fungo Fusarium venenatum in bioreattori: -90% CO₂, -90% uso terra, -70% acqua rispetto alla carne","È una proteina estratta chimicamente dalle pareti cellulari dei funghi coltivati tradizionalmente","È prodotta da alghe marine fermentate: processo simile alla produzione di yogurt"],1,"La micoproteina Quorn è prodotta dalla fermentazione del fungo Fusarium venenatum in bioreattori industriali con glucosio come fonte energetica. I filamenti proteici prodotti hanno una texture fibrosa simile alla carne. Impatto vs. carne: -90% CO₂, -90% uso di terra, -70% acqua. Già in vendita in Italia dal 1985.",["Non è corretto. La micoproteina non è estratta da funghi selvatici ma prodotta dalla fermentazione industriale di un fungo microscopico in bioreattori controllati.","Esatto! Quorn usa la micoproteina prodotta da un fungo (Fusarium venenatum) fermentato in bioreattori. Rispetto alla carne: -90% emissioni CO₂, -90% uso di terra, -70% uso di acqua.","Non è corretto. Non si tratta di un'estrazione chimica. È un processo di fermentazione biologica in bioreattori industriali.","Non è corretto. La micoproteina viene da un fungo microscopico (Fusarium venenatum), non da alghe. Il processo è fermentazione in bioreattori industriali."]],["Perché chi è allergico ai crostacei deve prestare attenzione anche alla farina di grillo?",["Perché i grilli vengono allevati nello stesso impianto dei crostacei","Perché esiste un'allergia crociata documentata: le proteine degli insetti sono simili a quelle dei crostacei","Perché la farina di grillo contiene spesso impurità di crostacei per contaminazione in produzione","Perché il regolamento UE impone di etichettare la farina di grillo nello stesso gruppo dei crostacei"],1,"Insetti e crostacei sono entrambi artropodi e condividono alcune proteine strutturali (come la tropomiosina). Chi è allergico ai crostacei (gamberetti, aragoste) o agli acari della polvere può avere reazioni allergiche anche agli insetti. L'etichetta obbligatoria dei prodotti con farina di grillo deve segnalare questo rischio.",["Non è corretto. La ragione è biologica, non logistica. Riguarda la struttura proteica degli insetti, non il processo di allevamento.","Esatto! Gli insetti e i crostacei sono entrambi artropodi e condividono alcune proteine strutturali (come la tropomiosina). Le persone allergiche ai crostacei o agli acari della polvere possono reagire anche agli insetti.","Non è corretto. Non si tratta di contaminazione. L'allergia crociata è una caratteristica biologica delle proteine degli artropodi, non un problema di contaminazione produttiva.","Non è corretto. Il regolamento UE non classifica la farina di grillo insieme ai crostacei. Li distingue, ma impone di segnalare il rischio di allergia crociata."]],["Cosa usa la stampa 3D alimentare negli ospedali per i pazienti con disfagia?",["Crea pasti liquidi ad alto contenuto nutritivo simili ai frullati","Crea pasti dall'aspetto normale (pasta, dolci) ma con consistenza morbida sicura per chi ha difficoltà a deglutire","Produce farmaci in forma commestibile integrati negli alimenti per facilitarne l'assunzione","Riduce le dimensioni delle porzioni per controllo calorico preciso nella gestione del diabete"],1,"La disfagia (difficoltà a deglutire) richiede cibi di consistenza morbida e omogenea. Gli omogeneizzati tradizionali hanno aspetto poco invitante. La stampa 3D alimentare crea pasti dall'aspetto normale (pasta, torta, bistecca) ma con consistenza sicura per chi ha difficoltà a deglutire: più piacevole e stimola l'appetito.",["Non è corretto. I pasti liquidi non richiedono la stampa 3D. La tecnologia serve a creare qualcosa di molto specifico per pazienti con disfagia.","Esatto! I pazienti con disfagia rischiano di soffocare con cibo di consistenza normale, ma gli omogeneizzati hanno aspetto poco appetitoso. La stampa 3D crea pasti visivamente invitanti (spaghetti, fette di torta) con consistenza morbida e omogenea sicura.","Non è corretto. La stampa 3D alimentare in ambito ospedaliero si occupa di texture e aspetto dei pasti, non di farmaci integrati negli alimenti.","Non è corretto. La controllo delle porzioni non richiede stampa 3D. Il vantaggio specifico per ospedaliero è la gestione della consistenza per pazienti con problemi di deglutizione."]],["Come garantisce la blockchain la non falsificabilità dei dati di tracciabilità alimentare?",["Perché è gestita dall'EFSA (autorità alimentare europea) che certifica ogni transazione","Perché ogni passaggio è registrato in un sistema distribuito e immutabile: modificare un dato richiederebbe alterare tutte le copie del registro simultaneamente","Perché usa la crittografia quantistica che non può essere violata da nessun computer attuale","Perché ogni transazione richiede la firma digitale di tre enti pubblici indipendenti"],1,"La blockchain registra ogni passaggio in un sistema distribuito (migliaia di copie simultanee). Ogni blocco contiene un hash del blocco precedente: modificare un dato storico richiederebbe ricalcolare tutti i blocchi successivi su tutte le copie contemporaneamente. Praticamente impossibile. È il caso del Parmigiano Reggiano tracciato in blockchain.",["Non è corretto. La blockchain non è gestita da un ente centrale come l'EFSA. Il suo punto di forza è esattamente il contrario: è distribuita e non ha un'autorità centrale.","Esatto! La blockchain è distribuita: esiste in migliaia di copie contemporaneamente. Per falsificare un dato bisognerebbe modificare tutte le copie simultaneamente, il che è praticamente impossibile.","Non è corretto. La blockchain usa crittografia convenzionale (hash crittografici), non quantistica. La sua sicurezza deriva dalla struttura distribuita, non da un tipo specifico di crittografia.","Non è corretto. La blockchain non richiede necessariamente la firma di enti pubblici. La validazione è distribuita tra i nodi della rete (aziende, controparti, nodi tecnici)."]],["Il sistema alimentare globale produce attualmente quale percentuale delle emissioni globali di gas serra?",["Il 5% circa","Il 26% circa","Il 60% circa","Il 3% circa"],1,"Il sistema alimentare globale produce circa il 26% delle emissioni globali di gas serra. L'allevamento animale da solo è responsabile del 14,5%. Questo spiega perché le scelte alimentari (riduzione della carne, riduzione degli sprechi) hanno un impatto climatico significativo.",["Non è corretto. La percentuale è molto più alta. Il sistema alimentare, incluso l'allevamento, è uno dei maggiori emettitori mondiali.","Esatto! Il sistema alimentare globale produce circa il 26% delle emissioni globali di gas serra. Di questi, l'allevamento animale da solo è responsabile del 14,5%.","Non è corretto. Il 60% rappresenterebbe la quasi totalità delle emissioni antropiche. Il sistema alimentare, pur rilevante, non arriva a quella percentuale.","Non è corretto. Il sistema alimentare ha un impatto molto maggiore del 3%. È uno dei settori più emissivi, paragonabile ai trasporti."]]],"A":[["Confronta l'efficienza proteica di 1.000 kg di cereali usati per allevare grilli vs. bovini. Quanta proteina ottieni con ciascuno?",["I bovini producono più proteina dei grilli perché la carne bovina ha un contenuto proteico più alto per grammo","Grilli: circa 413 kg di proteina. Bovini: circa 31 kg di proteina. Differenza di oltre 13 volte","Le due quantità sono comparabili perché le proteine animali hanno valori biologici diversi","Non si può calcolare senza conoscere il tipo specifico di cereale usato come mangime"],1,"Con 1.000 kg di cereali: Grilli (FCR 1,7) → ~588 kg di grillo × 70% proteina = ~413 kg proteina. Bovini (FCR 8,0) → ~125 kg di manzo × 25% proteina = ~31 kg proteina. La differenza è di oltre 13 volte a favore dei grilli. Per questo gli insetti sono considerati una proteina del futuro.",["Non è corretto. Anche se la carne bovina è ricca di proteine, l'inefficienza della conversione alimentare fa sì che i bovini producano molta meno proteina totale dalla stessa quantità di mangime iniziale.","Esatto! Con 1.000 kg di cereali: grilli (FCR 1,7) → 588 kg di grillo → 70% proteina = ~413 kg. Bovini (FCR 8) → 125 kg di manzo → 25% proteina = ~31 kg. Il grillo è oltre 13 volte più efficiente.","Non è corretto. Il confronto riguarda la proteina totale prodotta, non il valore biologico. L'efficienza di conversione alimentare è il fattore determinante.","Non è corretto. Il calcolo usa il FCR (indice di conversione alimentare) che è indipendente dal tipo specifico di cereale. I valori di FCR del testo sono applicabili al calcolo."]],["La carne coltivata non è 'carne artificiale' nel senso chimico. Perché questa distinzione è importante?",["Perché dimostra che la carne coltivata è identica alla carne tradizionale in tutti gli aspetti","Perché chiarisce che è carne biologica reale (cellule animali) prodotta senza allevamento e macellazione, non un sostituto chimico","Perché permette di evitare le regolamentazioni della sicurezza alimentare per i prodotti chimici","Perché implica che può essere prodotta da chiunque in casa senza competenze specializzate"],1,"La carne coltivata è biologicamente autentica: cellule muscolari animali che crescono e si moltiplicano in bioreattori come farebbero nell'animale. Non è sintesi chimica (come una proteina costruita da aminoacidi separati). Questa distinzione è importante per la percezione del consumatore e per le implicazioni etiche e normative.",["Non è corretto. La carne coltivata non è identica alla tradizionale in tutti gli aspetti (es. texture di un filetto è difficile da replicare). La distinzione è sulla natura biologica vs. sintetica.","Esatto! La carne coltivata è biologicamente vera: cellule muscolari animali che crescono come nell'animale, ma in un bioreattore invece di un corpo. Non è una simulazione chimica come potrebbe essere la 'carne di soia'. È vera carne.","Non è corretto. La carne coltivata è soggetta a rigide regolamentazioni di sicurezza alimentare proprio perché è un prodotto alimentare, non perché sia chimica.","Non è corretto. La produzione di carne coltivata richiede bioreattori industriali, soluzioni nutritive specializzate e controllo rigoroso delle condizioni. Non è replicabile in casa."]],["Un'azienda di vertical farming deve scegliere dove aprire un nuovo impianto. Quali fattori sono più critici per la sostenibilità?",["Vicinanza ai centri commerciali e ampi parcheggi per i clienti","Disponibilità di energia rinnovabile a basso costo e vicinanza ai consumatori per ridurre i food miles","Temperatura esterna bassa per ridurre i costi di raffreddamento dell'impianto","Presenza di manodopera a basso costo per la gestione manuale delle piante"],1,"La vertical farming è conveniente solo dove: 1) c'è energia elettrica rinnovabile a basso costo (i LED sono il costo principale); 2) la vicinanza ai consumatori riduce i food miles del prodotto finito. Senza energia rinnovabile, l'impatto carbonio può essere peggiore dell'agricoltura tradizionale.",["Non è corretto. La logistica di distribuzione è importante, ma i fattori critici per la sostenibilità della vertical farming sono energetici e di mercato.","Esatto! Il problema principale della vertical farming è l'energia per i LED. Se disponibile da fonti rinnovabili a basso costo, l'impatto ambientale si riduce drasticamente. La vicinanza ai consumatori riduce i food miles del prodotto finito.","Non è corretto. La temperatura esterna è meno rilevante perché gli impianti di vertical farming sono ambienti completamente controllati. Il costo principale è l'illuminazione LED, non il raffreddamento.","Non è corretto. La vertical farming è altamente automatizzata e non richiede manodopera intensiva. Il costo principale è energetico, non del lavoro."]],["Il testo afferma che la sfida alimentare del 2050 non ha 'un'unica tecnologia miracolosa'. Perché questa affermazione è importante?",["Perché suggerisce che il problema è irrisolvibile e bisogna prepararsi alla scarsità alimentare","Perché indica che la soluzione richiede combinare innovazioni tecnologiche diverse con cambiamenti nel consumo (meno sprechi, meno carne)","Perché implica che le tecnologie descritte non funzioneranno realmente su scala globale","Perché dimostra che l'innovazione tecnologica da sola non può risolvere problemi di equità nella distribuzione del cibo"],1,"La sfida alimentare del 2050 richiede una combinazione di: agricoltura di precisione (meno acqua e fertilizzanti), vertical farming (produzione urbana), fermentazione moderna (proteine efficienti), carne coltivata, insetti, stampa 3D, tracciabilità digitale — più riduzione degli sprechi e diversificazione delle scelte proteiche. Nessuna singola tecnologia basta.",["Non è corretto. Il testo afferma esattamente l'opposto: esistono molte soluzioni che insieme possono risolvere il problema. Non è un messaggio pessimistico.","Esatto! Il testo presenta 7 tecnologie diverse, ciascuna con vantaggi e limiti. La sfida si risolve combinandole con scelte di consumo (meno sprechi, diverse scelte proteiche). Non esiste una singola soluzione tecnologica.","Non è corretto. Il testo presenta le tecnologie come reali e funzionanti. Il messaggio è sulla necessità di usarle in combinazione, non che siano inefficaci.","Parzialmente corretto come idea, ma non è il messaggio principale del testo su questo punto. Il testo indica che servono più soluzioni tecnologiche combinate, insieme a scelte di consumo."]],["La barriera culturale agli insetti come alimento è il principale ostacolo alla loro diffusione in Europa. Come si sta affrontando questo problema in Italia?",["Con campagne di marketing che mostrano insetti interi in modo da abituare progressivamente il consumatore","Incorporando la farina di insetti in prodotti già familiari (pasta, biscotti, farine) dove non sono visibili","Vietando per legge di indicare la presenza di insetti sull'etichetta per non creare resistenza nei consumatori","Importando pratiche culinarie asiatiche dove gli insetti sono consumati interi come cibo tradizionale"],1,"In Italia la strategia prevalente è incorporare la farina di insetti in prodotti familiari (pasta, biscotti, farine) dove non sono visibili. I test organolettici mostrano che la maggior parte dei consumatori non percepisce differenze di gusto al 5-10% di farina di grillo. La resistenza è psicologica, non sensoriale. L'etichetta deve comunque dichiararne la presenza.",["Non è corretto. Il testo indica la strategia opposta: incorporare la farina di insetti in prodotti familiari (pasta, biscotti) dove non sono visibili, per superare la resistenza sensoriale.","Esatto! La strategia prevalente in Italia è nascondere gli insetti in prodotti familiari: pasta di grillo al 5-10%, biscotti proteici, snack. I test organolettici mostrano che la maggior parte dei consumatori non percepisce differenze di gusto.","Non è corretto. È il contrario: la normativa europea impone di indicare chiaramente la presenza di insetti in etichetta. La non dichiarazione sarebbe illegale.","Non è corretto. Il testo non indica questa strategia di importazione culturale. La strategia italiana è basata sull'incorporazione nei prodotti già esistenti."]],["La Genuino startup usa blockchain per tracciare il Parmigiano Reggiano con sensori IoT. Quale problema risolve rispetto alla tracciabilità tradizionale?",["Permette di produrre Parmigiano Reggiano in paesi diversi dall'Emilia-Romagna mantenendo la certificazione DOP","Rende impossibile la falsificazione dei dati di filiera e permette al consumatore di verificare l'autenticità del prodotto con uno smartphone","Accelera il processo di stagionatura del Parmigiano usando algoritmi di ottimizzazione della temperatura","Riduce il costo di produzione del Parmigiano grazie all'automazione dei controlli di qualità"],1,"Il Parmigiano Reggiano è uno dei prodotti più contraffatti al mondo (molto 'Italian sounding' non autentico circola globalmente). La blockchain con sensori IoT crea un registro immutabile di ogni fase della stagionatura: il consumatore scannerizza il QR e vede tutta la storia della forma, autenticata da dati non falsificabili.",["Non è corretto. La blockchain non cambia le regole della denominazione DOP. Serve per tracciare e certificare il prodotto autentico, non per espanderne la produzione geografica.","Esatto! La blockchain rende i dati immutabili (non falsificabili retroattivamente) e accessibili al consumatore via QR code. Il Parmigiano Reggiano è uno dei prodotti più contraffatti al mondo: la blockchain certifica l'autenticità in modo verificabile.","Non è corretto. La blockchain registra dati, non controlla la stagionatura. I sensori IoT monitorano le condizioni ma non modificano il processo biologico della stagionatura.","Non è corretto. L'implementazione della blockchain è un costo aggiuntivo, non una riduzione. Il beneficio è la trasparenza e la certificazione dell'autenticità, non il risparmio economico."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
