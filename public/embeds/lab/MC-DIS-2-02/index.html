<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Cavaliera o isometrica?</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>

<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

// Disegno di un parallelepipedo in assonometria: restituisce un SVG
function axo(W, H, D, tipo) {
  const c30 = Math.cos(Math.PI / 6), s30 = 0.5, k = tipo === "cav1" ? 1 : 0.5;
  const P = (x, y, z) => tipo === "iso" ? [(x - y) * c30, z + (x + y) * s30] : [x + k * y * Math.SQRT1_2, z + k * y * Math.SQRT1_2];
  const V = []; for (const x of [0, W]) for (const y of [0, D]) for (const z of [0, H]) V.push([x, y, z]);
  const hid = tipo === "iso" ? [W, D, 0] : [0, D, 0];
  const E = [];
  V.forEach((a, i) => V.forEach((b, j) => { if (j <= i) return; const d = [0, 1, 2].filter((q) => a[q] !== b[q]); if (d.length === 1) E.push([a, b]); }));
  const pts = V.map((v) => P(...v)); const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const pad = 20, sc = Math.min(560 / (maxx - minx || 1), 300 / (maxy - miny || 1));
  const T = ([x, y]) => [pad + (x - minx) * sc, pad + (maxy - y) * sc];
  const isH = (v) => v[0] === hid[0] && v[1] === hid[1] && v[2] === hid[2];
  let s = `<svg viewBox="0 0 ${(maxx - minx) * sc + 2 * pad} ${(maxy - miny) * sc + 2 * pad}" style="width:100%;max-width:600px;display:block" role="img" aria-label="Parallelepipedo in assonometria">`;
  E.forEach(([a, b]) => { const [x1, y1] = T(P(...a)), [x2, y2] = T(P(...b)); const h = isH(a) || isH(b); s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--fg)" stroke-width="${h ? 1.2 : 2.4}" ${h ? 'stroke-dasharray="6 4" opacity=".6"' : ""}/>`; });
  return s + "</svg>";
}

          note: (p) => p.t === "cav1" ? ["warn", "Senza riduzione la profondità sembra troppo lunga: per questo nella cavaliera si dimezza l'asse y."] : null },
        { type: "order", title: "La procedura della cavaliera", items: [["Segna il punto O, angolo anteriore in basso a sinistra", ""], ["Traccia gli assi: x orizzontale, z verticale, y a 45° con la squadra", ""], ["Riporta 80 mm su x e 50 mm su z: disegni la faccia frontale in vera forma", "Nella cavaliera la faccia frontale non si deforma."], ["Riporta la profondità ridotta (60 × 0,5 = 30 mm) sulle oblique a 45°", ""], ["Unisci i punti e ripassa in linea grossa i contorni visibili; cancella le linee guida", ""]] } ],
      reflect: "In quale dei due sistemi la faccia frontale resta in vera forma? Perché è comodo?" },
    { brief: "Lo stesso oggetto nei due metodi ha vantaggi diversi. Scegli il sistema giusto per ogni situazione.",
      blocks: [

          ["Devi disegnare a mano velocemente un oggetto con molti dettagli sulla faccia frontale (per esempio una presa elettrica).", ["Cavaliera", "Isometrica"], 0, "La faccia frontale resta in vera forma: i dettagli si disegnano come in un prospetto."],

          ["Il metodo del box per i solidi composti consiste nel…", ["disegnare prima il parallelepipedo che contiene tutto, poi togliere le parti", "disegnare ogni pezzo separatamente", "partire dai dettagli"], 0, "Il box dà le misure d'ingombro e l'allineamento di tutte le parti."]] } ],
      reflect: "Nel tuo disegno del gradino, quale metodo ti è sembrato più chiaro? E più veloce?" },
    { label: "Scenario · il supporto per smartphone", brief: "Base 100 × 80 × 20 mm, colonna cilindrica ⌀ 40 × 60 mm, supporto 90 × 30 × 10 mm. Devi comunicare la forma al marketing (che non legge le proiezioni) e le misure alla produzione. Usa la lista di controllo mentre disegni l'isometrica.",
      blocks: [

        { type: "check", key: "supp", items: ["Ho disegnato il box d'ingombro 100 × 80 × 90 mm in linee sottili", "Ho disegnato la base 100 × 80 × 20 mm", "Ho costruito le due ellissi del cilindro dal quadrato di lato 40 mm", "Ho unito le ellissi con le due tangenti verticali", "Ho centrato il supporto 90 × 30 × 10 mm sulla colonna", "Ho ripassato in linea grossa solo i contorni visibili", "Ho preparato anche le viste quotate per la produzione"],
          result: (n, t) => n === t ? ["ok", "<strong>Pronto per marketing e produzione.</strong>"] : ["warn", `${n} passi su ${t}.`] } ],
      reflect: "Perché il marketing preferisce l'assonometria e la produzione le proiezioni quotate?" }],
  bridge: "Disegna in assonometria cavaliera e isometrica lo stesso oggetto che hai proiettato ortogonalmente nella MC-DIS-2-01: confronta i due metodi e spiega quale preferisci e perché.",
});

<script>
window.LABVERIFICA={"id":"MC-DIS-2-02","F":[["Cos'è l'assonometria e qual è la sua differenza principale rispetto alla proiezione ortogonale?",["L'assonometria usa meno viste della proiezione ortogonale — di solito solo una invece di tre","L'assonometria proietta l'oggetto su un unico piano mostrando tre facce contemporaneamente, dando una percezione tridimensionale; la proiezione ortogonale mostra una faccia per volta ma con misure esatte","L'assonometria è una versione semplificata della prospettiva, usata quando non si conosce la distanza dell'osservatore","L'assonometria è usata solo per oggetti simmetrici; la proiezione ortogonale per qualsiasi oggetto"],1,"L'assonometria proietta l'oggetto su un unico piano ruotando e inclinando gli assi cartesiani dell'oggetto secondo angoli precisi. Risultato: si vedono tre facce contemporaneamente, l'oggetto sembra tridimensionale. A differenza della proiezione ortogonale (che mostra una faccia per volta con misure esatte) e della prospettiva (che distorce), l'assonometria mantiene misure leggibili e dà percezione 3D.",["Non è corretto. Anche la proiezione ortogonale può usare una sola vista per oggetti semplici. La differenza fondamentale è che l'assonometria mostra tre facce contemporaneamente su un solo piano.","Esatto! L'assonometria mostra profondità, altezza e larghezza in un solo disegno — più intuitiva. La proiezione ortogonale mostra una faccia per volta ma ogni dimensione è esatta e misurabile.","Non è corretto. L'assonometria e la prospettiva sono sistemi diversi. Nell'assonometria le rette parallele rimangono parallele (nessun punto di fuga); nella prospettiva convergono verso punti di fuga.","Non è corretto. L'assonometria si applica a qualsiasi forma — simmetrica o no. Non è limitata agli oggetti simmetrici."]],["Nell'assonometria cavaliera obliqua, qual è il fattore di riduzione sull'asse obliquo (y)?",["0,816 — lo stesso dell'assonometria isometrica rigorosa","0,5 — la profondità viene ridotta alla metà: se un oggetto è profondo 60 mm, lungo l'asse obliquo si disegna come se fosse profondo 30 mm","1 — la profondità viene mantenuta uguale alla misura reale, come per gli altri assi","2 — la profondità viene raddoppiata per compensare la distorsione visiva dell'angolo obliquo"],1,"Nell'assonometria cavaliera: asse x (larghezza) a 0° con fattore 1 (misure reali), asse z (altezza) a 90° con fattore 1, asse y (profondità) a 45° con fattore 0,5 (metà della misura reale). La riduzione del 50% sull'asse obliquo è intenzionale: se si mantenesse la misura intera a 45°, l'oggetto sembrerebbe schiacciato e innaturale.",["Non è corretto. 0,816 è il fattore di riduzione dell'isometria rigorosa. Nella cavaliera il fattore è 0,5: la profondità viene ridotta alla metà.","Esatto! Nella cavaliera, l'asse y (profondità) a 45° subisce una riduzione del 50%: misura sul disegno = misura reale × 0,5. Gli assi x e z mantengono le misure reali (fattore 1).","Non è corretto. Se la profondità fosse mantenuta intera a 45°, l'oggetto sembrerebbe schiacciato e innaturale. La riduzione a 0,5 è intenzionale per un aspetto visivo più corretto.","Non è corretto. Raddoppiare la profondità renderebbe l'oggetto enormemente deformato. Il fattore 0,5 è scelto per un aspetto visivamente equilibrato."]],["Nell'assonometria isometrica (semplificata, quella usata in pratica), qual è il fattore di riduzione degli assi?",["0,5 sull'asse y, 1 sugli altri assi — come nella cavaliera","1 su tutti e tre gli assi — le misure si riportano in scala reale su x, y e z","0,816 su tutti e tre gli assi — la riduzione uniforme dell'isometrica rigorosa","√2/2 ≈ 0,707 su tutti e tre gli assi — derivato dalla geometria dei cubi isometrici"],1,"L'isometrica semplificata (quella usata in pratica): fattore di riduzione 1 su tutti e tre gli assi (x, y, z). Le misure si riportano in scala reale. Il disegno è leggermente ingrandito rispetto all'isometrica rigorosa (fattore 0,816), ma le proporzioni tra le tre dimensioni sono corrette. Costruzione: asse z verticale, assi x e y a 30° rispetto all'orizzontale.",["Non è corretto. Questo è il fattore della cavaliera. Nell'isometrica semplificata (quella usata in pratica) le misure si riportano in scala reale su tutti e tre gli assi: fattore 1 su tutti.","Esatto! L'isometrica semplificata usa fattore 1 su tutti gli assi. Il disegno risultante è leggermente ingrandito rispetto all'isometria rigorosa (fattore 0,816), ma le proporzioni tra le tre dimensioni sono corrette.","Non è corretto. L'isometrica rigorosa usa 0,816, ma in pratica si usa quasi sempre l'isometrica semplificata con fattore 1. Il testo dice: 'quasi tutti i manuali scolastici italiani usano l'isometrica semplificata.'","Non è corretto. 0,707 (= √2/2) non è il fattore dell'isometrica semplificata. Il fattore pratico è 1 su tutti gli assi."]],["Perché IKEA usa l'assonometria cavaliera (e non la prospettiva o l'isometrica) nelle istruzioni di montaggio?",["Perché l'assonometria cavaliera è la più moderna e quella con il miglior aspetto estetico","Perché la faccia frontale dell'oggetto non subisce deformazioni nella cavaliera — un pannello rettangolare appare rettangolare, un foro tondo appare tondo — essenziale per capire come incastrare i pezzi","Perché la cavaliera non richiede strumenti di disegno — si può costruire a mano libera","Perché IKEA è svedese e la Svezia ha una norma che richiede la cavaliera nelle istruzioni di montaggio"],1,"IKEA sceglie la cavaliera per una ragione funzionale precisa: nella cavaliera, la faccia frontale dell'oggetto non subisce deformazioni. Rettangoli appaiono rettangoli; cerchi appaiono cerchi. In prospettiva le forme si deformano con la distanza; in isometrica i rettangoli diventano parallelogrammi. Per capire come incastrare i pezzi, vedere la forma reale è fondamentale.",["Non è corretto. La scelta di IKEA non è estetica, ma funzionale: la cavaliera mostra la faccia frontale senza deformazioni, il che è essenziale per capire come incastrare i pezzi.","Esatto! Il testo dice: 'la cavaliera ha un vantaggio pratico decisivo: la faccia frontale dell'oggetto non subisce nessuna deformazione. Per chi deve capire come incastrare due pezzi, vedere la forma reale è più importante che avere bella tridimensionalità.'","Non è corretto. Anche la cavaliera richiede strumenti (riga, squadra a 45°). La ragione della scelta IKEA è funzionale: la faccia frontale non si deforma.","Non è corretto. Non esiste una norma svedese specifica sulle istruzioni di montaggio. IKEA ha scelto la cavaliera per ragioni funzionali di usabilità."]],["Qual è l'angolo dell'asse obliquo nell'assonometria cavaliera e quale squadra si usa per tracciarlo?",["30° rispetto all'orizzontale — si usa la squadra 60°-30°","45° rispetto all'orizzontale — si usa la squadra a 45°","60° rispetto all'orizzontale — si usa il rapportatore","L'angolo può variare liberamente — l'importante è che i tre assi siano distinti tra loro"],1,"Nell'assonometria cavaliera obliqua: asse x (larghezza) a 0° orizzontale, asse z (altezza) a 90° verticale, asse y (profondità) a 45° obliquo verso l'alto-destra. Lo strumento naturale per tracciare l'asse a 45° è la squadra a 45°. Il fattore di riduzione sull'asse y è 0,5 (metà della misura reale).",["Non è corretto. 30° è l'angolo degli assi x e y nell'isometrica, non nella cavaliera. Nella cavaliera l'asse obliquo è a 45°.","Esatto! Nella cavaliera: asse x a 0° (orizzontale), asse z a 90° (verticale), asse y (profondità) a 45° obliquo verso l'alto-destra. La squadra a 45° è lo strumento naturale per tracciare l'asse y.","Non è corretto. L'asse obliquo della cavaliera è a 45°, non 60°. Il rapportatore non è necessario: la squadra a 45° traccia direttamente l'angolo corretto.","Non è corretto. Nella cavaliera l'angolo dell'asse obliquo è fisso a 45°. Non è variabile: è parte della definizione della cavaliera come tipo specifico di assonometria."]],["Cosa è il 'metodo del box' per disegnare oggetti compositi in assonometria?",["Un sistema che divide l'oggetto in scatole di cartone per la spedizione, calcolandone il volume","Si immagina il volume totale dell'oggetto come un parallelepipedo contenitore, lo si disegna in assonometria, poi si 'scolpisce' l'oggetto rimuovendo e aggiungendo volumi","Un sistema che disegna prima tutti i bordi dell'oggetto e poi aggiunge le superfici visibili","Un sistema per disegnare solo oggetti che hanno forma di scatola (parallelepipedi) — non si applica a forme curve"],1,"Il metodo del box: (1) immagina il parallelepipedo minimo che contiene l'oggetto; (2) disegnalo in assonometria; (3) 'scolpisci' aggiungendo e sottraendo volumi dall'esterno verso l'interno; (4) cancella le linee che non appartengono all'oggetto finale; (5) tratteggia gli spigoli nascosti. Funziona per qualsiasi forma composita.",["Non è corretto. Il metodo del box è una tecnica di disegno, non di imballaggio. Il 'box' è il parallelepipedo immaginario che contiene l'oggetto.","Esatto! I passi: (1) parallelepipedo che contiene l'oggetto; (2) disegno del box in assonometria; (3) scolpire tagliando angoli, aggiungendo volumi sporgenti, rimuovendo volumi mancanti; (4) cancellare le linee non appartenenti all'oggetto.","Non è corretto. Il metodo del box parte da un parallelepipedo contenitore e lo 'scolpisce' per ottenere la forma finale. Non si parte dai bordi.","Non è corretto. Il metodo del box si applica a qualsiasi forma: forme curve si inseriscono nel box come approssimazione e poi si rifiniscono. Anche i cilindri si costruiscono partendo da un box."]]],"I":[["Un oggetto ha profondità reale di 40 mm. In cavaliera lo disegno con fattore 0,5 → 20 mm sull'asse obliquo. In isometrica (semplificata) quanti mm lungo l'asse corrispondente?",["20 mm — uguale alla cavaliera","40 mm — nell'isometrica semplificata il fattore è 1 su tutti gli assi","32,6 mm — 40 mm × 0,816 (fattore isometrico rigoroso)","28,3 mm — 40 mm × (√2/2)"],1,"Confronto tra i due tipi: Cavaliera (asse y a 45°, fattore 0,5): 40 mm → 20 mm. Isometrica semplificata (assi a 30°, fattore 1 su tutti): 40 mm → 40 mm. L'isometrica semplificata non riduce le misure — le riporta reali su tutti e tre gli assi. Il disegno risultante è proporzionalmente corretto tra le tre dimensioni.",["Non è corretto. In isometrica semplificata il fattore è 1 su tutti gli assi. La profondità di 40 mm si riporta come 40 mm (non ridotta).","Esatto! Isometrica semplificata: fattore 1 su tutti gli assi → la profondità di 40 mm si riporta come 40 mm lungo l'asse isometrico corrispondente. Cavaliera: 40 × 0,5 = 20 mm.","Non è corretto. 0,816 è il fattore dell'isometrica rigorosa, ma in pratica si usa l'isometrica semplificata con fattore 1. Il testo specifica: 'quasi tutti i manuali scolastici italiani usano l'isometrica semplificata.'","Non è corretto. √2/2 ≈ 0,707 non è il fattore dell'isometrica semplificata. Il fattore pratico è 1."]],["Perché un cerchio in assonometria cavaliera diventa un'ellisse se è sul piano orizzontale (xy), ma rimane un cerchio se è sul piano frontale (xz)?",["Perché la cavaliera usa un asse obliquo a 45° — l'angolo distorce i cerchi in tutti i piani tranne quello frontale","Perché il piano frontale (xz) mantiene le proporzioni reali nella cavaliera (fattori 1 e 1), mentre il piano orizzontale (xy) include l'asse y con fattore 0,5 — la riduzione distorce il cerchio in ellisse","Perché i cerchi orizzontali non sono importanti nel disegno tecnico e si approssimano con ellissi per semplicità","Perché la squadra a 45° distorce i cerchi quando si usano per tracciare gli archi che li compongono"],1,"Nella cavaliera, il piano frontale xz ha entrambi i fattori pari a 1: qualsiasi figura su questo piano mantiene le sue proporzioni reali → il cerchio rimane cerchio. Il piano orizzontale xy include l'asse y con fattore 0,5: la dimensione lungo y si riduce della metà → il cerchio si 'schiaccia' in un'ellisse con asse minore = raggio × 0,5 × sin(45°).",["Non è del tutto corretto. La ragione è più specifica: il piano frontale (xz) non subisce alcuna deformazione nella cavaliera — la faccia frontale rimane invariata. Solo i piani che includono l'asse obliquo y distorcono i cerchi.","Esatto! Il piano xz usa assi x (fattore 1) e z (fattore 1): nessuna distorsione, il cerchio rimane cerchio. Il piano xy usa assi x (fattore 1) e y (fattore 0,5): la riduzione del 50% sull'asse y trasforma il cerchio in ellisse.","Non è corretto. I cerchi orizzontali non si 'approssimano' per semplicità: diventano effettivamente ellissi per una proprietà geometrica precisa della proiezione assonometrica.","Non è corretto. La distorsione non dipende dallo strumento (squadra a 45°). È una proprietà geometrica della proiezione: i cerchi nei piani che includono l'asse obliquo diventano ellissi."]],["Il collegamento STEM dice che nell'assonometria 'le linee parallele nell'oggetto reale rimangono parallele nel disegno'. Perché questa è una proprietà matematicamente importante?",["Perché rende più facile disegnare a mano senza commettere errori","Perché distingue l'assonometria dalla prospettiva (proiezione conica): nell'assonometria le misure sono leggibili direttamente sugli assi, nella prospettiva le linee convergono e le misure non si leggono direttamente","Perché permette di calcolare l'area e il volume dell'oggetto direttamente dal disegno assonometrico","Perché dimostra che l'assonometria è superiore alla prospettiva per qualsiasi uso"],1,"Il testo spiega: 'l'assonometria conserva il parallelismo: è una proiezione parallela (cilindrica), non una proiezione centrale (conica).' La conseguenza pratica: se una linea è parallela all'asse x, la sua lunghezza nel disegno corrisponde alla misura reale (o alla misura scalata). Questo è il motivo per cui le misure si leggono direttamente sugli assi — proprietà che la prospettiva non ha.",["Non è corretto. La facilità di esecuzione è un vantaggio pratico, ma non la proprietà matematica fondamentale. La proprietà è che l'assonometria è una proiezione parallela, non conica.","Esatto! Il testo dice: 'l'assonometria conserva il parallelismo: è una proiezione parallela (o cilindrica), non una proiezione centrale (conica). Questa proprietà matematica è ciò che rende le misure leggibili.' Le misure lungo gli assi si leggono direttamente.","Non è corretto. L'area e il volume non si calcolano facilmente da un disegno assonometrico (a meno che non si conosca il fattore di riduzione e lo si compensi). La proprietà rilevante è la leggibilità delle misure lineari sugli assi.","Non è corretto. I due sistemi hanno scopi diversi. L'assonometria è migliore per la misurabilità; la prospettiva è migliore per la percezione visiva realistica. Non c'è un sistema 'superiore' in assoluto."]],["Tinkercad è un software CAD 3D. Come si collega con l'assonometria che impari a mano?",["Tinkercad sostituisce completamente l'assonometria a mano: chi usa il software non ha più bisogno di imparare il metodo manuale","Tinkercad mostra di default la vista isometrica: chi sa costruire l'assonometria a mano capisce cosa sta guardando nel software e viceversa — la stessa competenza con strumenti diversi","Tinkercad usa solo l'assonometria cavaliera, non l'isometrica — quindi chi ha imparato la cavaliera a mano può usarlo immediatamente","Tinkercad usa la prospettiva 3D — non le assonometrie che si imparano a mano"],1,"Il testo stabilisce la continuità: 'Guardare la vista isometrica di Tinkercad e sapere disegnare a mano l'assonometria sono la stessa competenza, espressa con strumenti diversi.' Imparare l'assonometria a mano non è obsoleto nell'era del CAD: è comprendere il principio che il software implementa. Chi ha la competenza manuale capisce meglio il software 3D.",["Non è corretto. Il testo dice il contrario: 'guardare la vista isometrica di Tinkercad e sapere disegnare a mano l'assonometria sono la stessa competenza, espressa con strumenti diversi.'","Esatto! Il testo dice: 'Guardare la vista isometrica di Tinkercad e sapere disegnare a mano l'assonometria sono la stessa competenza, espressa con strumenti diversi. Chi sa costruire a mano capisce immediatamente cosa sta guardando nel software 3D.'","Non è corretto. Tinkercad mostra la vista isometrica per default, non la cavaliera. La comprensione di entrambi i tipi di assonometria aiuta a lavorare con il software.","Non è corretto. Tinkercad usa la proiezione isometrica come vista di default per la navigazione 3D. Non usa la prospettiva tradizionale con punti di fuga."]],["Albrecht Dürer (1471-1528) è citato come precursore delle assonometrie tecniche. Perché il suo lavoro è rilevante oggi?",["Perché ha inventato l'assonometria isometrica moderna con i suoi trattati matematici","Perché voleva capire le regole matematiche della percezione della profondità — la stessa domanda che sta alla base delle assonometrie moderne, esplorando la geometria della rappresentazione spaziale","Perché ha disegnato le prime tavole tecniche standardizzate usate ancora oggi nell'industria tedesca","Perché ha dimostrato matematicamente che l'assonometria è superiore alla prospettiva per il disegno tecnico"],1,"Dürer (1471-1528) è rilevante perché la sua domanda — 'quali regole matematiche governano come l'occhio percepisce la profondità?' — è la stessa domanda alla base di tutti i sistemi di rappresentazione spaziale, incluse le assonometrie moderne. 'La differenza tra un artista del Rinascimento e un progettista CAD di oggi è minore di quanto sembri: la stessa logica geometrica, strumenti diversi.'",["Non è corretto. L'assonometria isometrica moderna come sistema formalizzato è del XIX secolo (William Farish, 1820). Dürer ha esplorato la geometria della rappresentazione spaziale, ma non ha formalizzato l'isometrica.","Esatto! Il testo dice: 'La differenza tra un artista del Rinascimento e un progettista CAD di oggi è minore di quanto sembri: entrambi stanno risolvendo lo stesso problema — la rappresentazione della profondità su un piano — con strumenti diversi ma con la stessa logica geometrica.'","Non è corretto. Le tavole tecniche standardizzate moderne sono invenzioni del XIX-XX secolo. Dürer era un artista e teorico, non un ingegnere industriale.","Non è corretto. Dürer non dimostrò la superiorità di un sistema sull'altro. Studiava i principi della percezione e della rappresentazione geometrica, non la comparazione dei sistemi tecnici."]],["La tabella di confronto cavaliera/isometrica dice che la cavaliera ha 'impatto visivo più inclinato' e l'isometrica è 'più equilibrata'. Cosa significa praticamente?",["La cavaliera è inclinata fisicamente sul foglio; l'isometrica è dritta","La cavaliera enfatizza visivamente la faccia frontale (le altre due sembrando secondarie per effetto dell'asse a 45°); l'isometrica mostra le tre facce con pari enfasi grazie agli assi simmetrici a 30°","La cavaliera dà un effetto simile alla prospettiva con punti di fuga; l'isometrica è più formale e tecnica","L'impatto visivo non è rilevante nel disegno tecnico: conta solo la precisione delle misure"],1,"Nella cavaliera (asse y a 45°, fattore 0,5): la faccia frontale xz è intatta e domina, le altre sembrano aggiunto laterale. Impatto visivo: asimmetrico, la faccia frontale 'comanda'. Nell'isometrica (assi a 120° tra loro, fattore 1): le tre facce hanno pari importanza visiva — l'oggetto sembra 'sospeso' nello spazio in modo equilibrato.",["Non è corretto. Entrambe le assonometrie sono disegnate su un foglio piano. 'Inclinato' si riferisce all'effetto visivo percepito — non all'orientamento fisico del foglio.","Esatto! Nella cavaliera, la faccia frontale è inalterata e domina visivamente; le altre due sembrano 'aggiunte'. Nell'isometrica, i tre assi a 120° tra loro danno pari importanza alle tre facce.","Non è corretto. La cavaliera non crea effetti di punti di fuga (quella è la prospettiva). Sia cavaliera che isometrica sono proiezioni parallele senza punti di fuga.","Non è corretto. La scelta tra cavaliera e isometrica dipende anche dall'effetto visivo desiderato: cavaliera quando si vuole enfatizzare la faccia frontale, isometrica quando si vogliono le tre facce con pari importanza."]]],"A":[["Un designer deve presentare un telefono a un cliente non tecnico. Quale sistema di rappresentazione scegliere e perché?",["Proiezione ortogonale, perché mostra tutte le dimensioni esatte e il cliente può verificarle","Prospettiva (o assonometria di alta qualità), perché comunica l'aspetto visivo dell'oggetto in modo intuitivo — il cliente deve capire come sarà il prodotto, non costruirlo","Assonometria cavaliera, perché è la più facile da capire per chiunque grazie alla faccia frontale invariata","Nessun sistema di disegno: si usa direttamente un prototipo fisico"],1,"La regola pratica del testo: 'proiezione ortogonale per costruire, assonometria per spiegare, prospettiva per convincere.' Per presentare a un cliente non tecnico si usa la prospettiva (o un render digitale): simula la visione naturale, comunica l'aspetto finale del prodotto, è immediatamente comprensibile senza formazione tecnica. Il cliente deve approvare, non costruire.",["Non è corretto. Un cliente non tecnico fatica a ricostruire la forma 3D da tre viste separate. La proiezione ortogonale è per chi deve costruire, non per chi deve approvare il design.","Esatto! La regola del testo: 'prospettiva per convincere.' Il cliente non ha bisogno di misure precise — ha bisogno di capire come apparirà il telefono. La prospettiva simula la visione reale.","Non è corretto (anche se non è sbagliato). La prospettiva è ancora più intuitiva della cavaliera per un non tecnico — simula la visione reale. La cavaliera rimane un sistema tecnico.","Non è corretto. I prototipi fisici sono utili ma costosi e richiedono tempo. I sistemi di rappresentazione visiva (prospettiva, render digitale) permettono di comunicare il design prima di produrre un prototipo."]],["Stai costruendo in assonometria cavaliera un parallelepipedo 80×60×50 mm (larghezza × profondità × altezza). Quali misure riporti lungo i tre assi?",["Asse x: 80 mm; asse y (obliquo 45°): 60 mm; asse z: 50 mm","Asse x (0°): 80 mm; asse y (obliquo 45°): 60 × 0,5 = 30 mm; asse z (90°): 50 mm","Asse x: 80 mm; asse y: 30 mm; asse z: 25 mm","Tutti e tre gli assi mantengono le misure reali: 80 mm, 60 mm, 50 mm"],1,"Cavaliera per parallelepipedo 80×60×50 mm: asse x (larghezza, orizzontale a 0°) = 80 mm (fattore 1), asse y (profondità, obliquo a 45°) = 60 × 0,5 = 30 mm (fattore 0,5), asse z (altezza, verticale a 90°) = 50 mm (fattore 1). Se invece fosse isometrica semplificata: 80 mm, 60 mm, 50 mm su tutti gli assi (fattore 1 su tutto).",["Non è corretto. Nella cavaliera l'asse y (profondità) ha fattore 0,5. La profondità di 60 mm diventa 30 mm sull'asse obliquo.","Esatto! Nella cavaliera: asse x (larghezza, 0°) = misura reale = 80 mm; asse y (profondità, 45°) = misura reale × 0,5 = 60 × 0,5 = 30 mm; asse z (altezza, 90°) = misura reale = 50 mm.","Non è corretto. Nella cavaliera solo l'asse y (profondità) viene ridotto del 50%. L'altezza (asse z) mantiene la misura reale: 50 mm, non 25 mm.","Non è corretto. In cavaliera l'asse y (profondità) ha fattore 0,5: la profondità di 60 mm diventa 30 mm. Solo in isometrica semplificata tutti gli assi mantengono le misure reali."]],["L'errore comune citato dice: 'nell'isometrica le misure orizzontali si riducono ma quella verticale rimane uguale'. Perché questo è sbagliato?",["Perché nell'isometrica è l'asse verticale a ridursi, non quelli orizzontali","Perché nell'isometrica semplificata (quella usata in pratica) tutti e tre gli assi hanno fattore 1 — nessuno si riduce rispetto agli altri. Nella rigorosa tutti si riducono ugualmente (0,816)","Perché l'errore è nell'opposto: nell'isometrica la misura verticale si riduce, e quelle orizzontali rimangono uguali","Perché la riduzione nell'isometrica riguarda solo le diagonali, non gli assi principali"],1,"L'errore descritto confonde cavaliera e isometrica: nella cavaliera, l'asse y (profondità) si riduce del 50% mentre x e z rimangono interi. Nell'isometrica semplificata tutti e tre gli assi hanno fattore 1 (misure reali). Nell'isometrica rigorosa tutti si riducono di 0,816. Non c'è mai una differenza tra verticale e orizzontale nell'isometrica.",["Non è corretto. Nell'isometrica (sia rigorosa sia semplificata) tutti e tre gli assi hanno lo stesso trattamento — nessuno si riduce più degli altri.","Esatto! Il testo spiega: 'nell'isometrica semplificata le misure vengono riportate in scala reale su tutti e tre gli assi (fattore 1). Confondere l'isometrica rigorosa con la semplificata è uno degli errori più comuni.'","Non è corretto. Nell'isometrica (sia rigorosa che semplificata) non c'è asimmetria tra verticale e orizzontale: tutti gli assi ricevono lo stesso trattamento.","Non è corretto. La riduzione nell'isometrica rigorosa (fattore 0,816) si applica a tutti e tre gli assi principali — x, y e z — in modo uniforme."]],["Il designer di prodotto industriale citato nel testo come professione usa l'assonometria in modo diverso rispetto al tecnico che usa le proiezioni ortogonali. Qual è la differenza di ruolo nella catena progettuale?",["Il designer usa l'assonometria per calcolare le tolleranze; il tecnico usa le ortogonali per l'aspetto estetico","Il designer usa l'assonometria per comunicare le idee ai clienti (non tecnici) e nelle fasi di ideazione; poi le proiezioni ortogonali comunicano con i tecnici che producono i pezzi","Il designer usa le proiezioni ortogonali; il tecnico usa l'assonometria — è il contrario di quanto si pensa","Non c'è differenza di ruolo: designer e tecnici usano gli stessi sistemi di rappresentazione per coerenza"],1,"Il testo descrive la catena del designer di prodotto: (1) schizzi assonometrici veloci durante l'ideazione (strumento di pensiero visivo); (2) modelli CAD 3D; (3) tavole tecniche in proiezione ortogonale per la produzione. L'assonometria comunica l'idea visiva; le ortogonali comunicano le specifiche tecniche. Due strumenti per due interlocutori diversi.",["Non è corretto. È il contrario: le ortogonali servono per le specifiche tecniche precise (incluse tolleranze); l'assonometria serve per comunicare visivamente l'idea del design.","Esatto! Il testo descrive la catena: 'schizzi assonometrici veloci durante l'ideazione → modelli CAD 3D → tavole tecniche (proiezioni ortogonali) per la produzione.' La catena parte dall'assonometria come strumento di pensiero visivo.","Non è corretto. Il testo descrive la sequenza nel lavoro del designer: assonometria nelle fasi di ideazione → ortogonali per la produzione. Non è invertita.","Non è corretto. Il testo descrive esplicitamente la differenza: 'il designer usa assonometrie e prospettive per comunicare con i clienti, e proiezioni ortogonali per comunicare con i tecnici che producono i pezzi.'"]],["Perché nel disegno di un oggetto composito con il metodo del box si inizia dal parallelepipedo contenitore e si 'scolpisce' invece di costruire le parti separatamente?",["Perché le norme UNI vietano di costruire le parti separatamente nel disegno assonometrico","Perché partire dal volume contenitore garantisce che le proporzioni globali siano corrette prima di definire i dettagli, evitando errori di posizionamento e scala tra le parti","Perché il parallelepipedo contenitore è sempre più semplice da disegnare e si finisce prima","Perché il metodo del box è usato solo per oggetti in legno o pietra che vengono letteralmente scolpiti — non si applica a oggetti metallici"],1,"Il metodo del box garantisce la coerenza geometrica globale: partendo dal parallelepipedo contenitore, si stabiliscono le proporzioni generali dell'oggetto prima di procedere ai dettagli. Costruire le parti separatamente rischia di ritrovarsi con elementi che non si allineano correttamente tra loro. Il box è un'ancora geometrica per l'intero disegno.",["Non è corretto. Non esiste una norma che lo vieti. Il metodo del box è una strategia pratica, non un obbligo normativo.","Esatto! Costruire le parti separatamente rischia di ritrovarsi con pezzi che non si incastrano correttamente. Il box stabilisce il volume globale corretto; poi si scolpisce mantenendo la coerenza geometrica.","Non è corretto. La semplicità del parallelepipedo non è la ragione principale. Il vantaggio è la garanzia della coerenza geometrica globale prima di procedere ai dettagli.","Non è corretto. 'Scolpire' è una metafora per il processo di disegno. Il metodo si applica a qualsiasi materiale e qualsiasi forma composita."]],["Perché nella assonometria isometrica rigorosa il fattore di riduzione è 0,816 (= 1/√(1.5)) e non un valore 'tondo' come 0,8 o 1?",["Perché 0,816 è stato scelto da ingegneri nel XIX secolo per convenienza di calcolo con i righelli dell'epoca","Perché deriva dalla geometria: quando i tre assi formano angoli di 120° tra loro e sono ugualmente inclinati rispetto al piano di proiezione, la lunghezza apparente di ogni asse rispetto alla sua lunghezza reale è 1/√(3/2) ≈ 0,816","Perché 0,816 è il reciproco del numero aureo φ ≈ 1,618","Perché 0,816 è il fattore che produce una riduzione visivamente piacevole secondo studi di psicologia della percezione"],1,"Il fattore 0,816 ≈ √(2/3) è il risultato matematico della proiezione isometrica: quando i tre assi cartesiani sono ugualmente inclinati rispetto al piano di proiezione (angolo di 35,26° rispetto al piano) e formano angoli di 120° tra loro sul piano, ogni asse si accorcia di questo fattore preciso. Non è scelto arbitrariamente — è determinato dalla geometria. Per praticità, si usa l'isometrica semplificata con fattore 1.",["Non è corretto. Il fattore 0,816 non è una convenzione arbitraria — è il risultato di un calcolo geometrico preciso legato all'angolo di inclinazione degli assi isometrici.","Esatto! Il fattore 0,816 è una conseguenza matematica della geometria isometrica: quando si proiettano su un piano le tre assi cartesiane ugualmente inclinate a 120° tra loro, ogni asse si 'accorcia' di quel fattore preciso.","Non è corretto. 1/1,618 ≈ 0,618, non 0,816. Il fattore isometrico deriva dalla geometria delle proiezioni a 120°, non dal numero aureo.","Non è corretto. Il fattore 0,816 non è scelto per ragioni estetiche o psicologiche, ma è una conseguenza matematica della geometria isometrica."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
