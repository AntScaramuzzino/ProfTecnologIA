<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Passaporto tecnologico</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

          ["Fine vita", ["A: 80% poliestere + 20% cotone", "B: 100% lana"], 1, "Una fibra mista non si separa e quasi non si ricicla; la lana pura si biodegrada in anni."]] } ],

(function(){
  const tabs=[...document.querySelectorAll('.tab')];
  function select(t,focus){
    tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;
      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});
    if(focus)t.focus();
    try{localStorage.setItem('lab-level-'+document.title,t.id)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},
    fmt(n,d=0){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});},
    copy(btn,text){
      const done=()=>{const o=btn.textContent;btn.textContent='Copiato';setTimeout(()=>btn.textContent=o,1500)};
      try{navigator.clipboard.writeText(text).then(done,()=>{})}catch(e){}
    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-MAT-1-02","F":[["Come si chiama il percorso completo che un oggetto compie dalla produzione allo smaltimento?",["Filiera produttiva","Ciclo di vita (life cycle)","Ciclo tecnologico del prodotto","Catena del valore"],1,"Il ciclo di vita (life cycle) è il percorso completo di un oggetto: estrazione materie prime → lavorazione → produzione → distribuzione → uso → smaltimento. Le Indicazioni Nazionali 2025 lo chiamano 'ciclo tecnologico', sottolineando che ogni fase è frutto di scelte umane organizzate, non solo di processi naturali.",["Non è corretto. La filiera produttiva descrive i passaggi della produzione. Il ciclo di vita è più ampio: include anche uso, smaltimento e fine vita.","Esatto! Il ciclo di vita (o life cycle) è il percorso completo di un oggetto: dall'estrazione delle materie prime, alla produzione, alla distribuzione, all'uso, fino allo smaltimento o riciclo.","Non è corretto. 'Ciclo tecnologico' è il termine usato nelle Indicazioni Nazionali 2025, ma il termine più diffuso è 'ciclo di vita' (life cycle). Entrambi descrivono lo stesso concetto.","Non è corretto. La catena del valore analizza dove si crea valore economico in ogni fase. È un concetto economico correlato ma diverso dal ciclo di vita, che si concentra sull'impatto ambientale e sul percorso fisico."]],["Quante fasi ha il ciclo tecnologico di un oggetto secondo il testo?",["Tre: produzione, uso e smaltimento","Sette: estrazione, lavorazione, produzione, distribuzione, uso, smaltimento e riciclo","Cinque: progettazione, produzione, trasporto, vendita e uso","Undici, incluse tutte le sottofasi del processo di trasformazione industriale"],1,"Il ciclo tecnologico ha sette fasi: 1) Estrazione materie prime; 2) Lavorazione e trasformazione; 3) Produzione del bene; 4) Logistica e distribuzione; 5) Uso; 6) Fine vita (smaltimento); 7) Riciclo o riuso. Ogni fase ha i propri attori, impatti e responsabilità.",["Non è corretto. Tre fasi è una semplificazione. Il testo identifica sette fasi distinte nel ciclo di vita di un oggetto.","Esatto! Le sette fasi sono: 1) estrazione materie prime, 2) lavorazione e trasformazione, 3) produzione del bene, 4) logistica e distribuzione, 5) uso, 6) smaltimento/fine vita, 7) riciclo o riuso.","Non è corretto. Il testo identifica sette fasi. La progettazione è implicita nella produzione; il fine vita (smaltimento, riciclo) è separato.","Non è corretto. Il testo identifica sette grandi fasi. Le sottofasi del processo industriale sono parte della fase di lavorazione/produzione."]],["Cos'è il 'tenore del minerale' nell'estrazione dei metalli?",["La profondità massima a cui si può scavare una miniera in sicurezza","Il rapporto tra la quantità di metallo puro ottenuto e la quantità di roccia estratta e processata","La durezza della roccia che contiene il minerale, determinante per la scelta degli esplosivi da usare","Il grado di purezza del metallo dopo la prima fase di raffinazione"],1,"Il tenore del minerale è la percentuale di metallo puro nella roccia estratta. La calcopirite (principale minerale del rame) ha circa il 30% di rame. Quando il tenore scende (miniere sempre più sfruttate), servono sempre più roccia, energia e acqua per ottenere la stessa quantità di metallo.",["Non è corretto. La profondità di scavo è determinata da fattori tecnici e di sicurezza. Il tenore del minerale è una caratteristica chimica del minerale stesso.","Esatto! Il tenore del minerale indica la percentuale di metallo nella roccia. La calcopirite del rame ha circa il 30% di rame: per 100 kg di rame servono 333 kg di roccia. Quando il tenore scende, serve estrarre più roccia per lo stesso metallo.","Non è corretto. La durezza della roccia è un parametro di coltivazione mineraria. Il tenore è la percentuale di metallo prezioso nel minerale estratto.","Non è corretto. La purezza dopo raffinazione è un parametro della fase di lavorazione. Il tenore del minerale descrive la ricchezza della roccia grezza prima di qualsiasi trattamento."]],["Cos'è l'obsolescenza programmata?",["La pratica di progettare un prodotto per aggiornarlo regolarmente con nuove funzionalità","La pratica di progettare un prodotto perché si guasti o diventi non più desiderabile entro un certo periodo, spingendo l'acquisto di un nuovo prodotto","Il ciclo naturale di invecchiamento dei materiali che causa il deterioramento inevitabile nel tempo","La norma europea che stabilisce la durata minima garantita di ogni categoria di prodotto"],1,"L'obsolescenza programmata è la pratica di progettare un prodotto per guastarsi o diventare obsoleto entro un certo periodo. Casi famosi: alcuni smartphone rallentano con gli aggiornamenti su modelli vecchi; alcune stampanti si bloccano dopo N copie. La Francia ha introdotto nel 2021 un indice di riparabilità da 1 a 10 come risposta.",["Non è corretto. Gli aggiornamenti migliorano il prodotto. L'obsolescenza programmata è la pratica opposta: progettare il prodotto per guastarsi o diventare obsoleto prima del necessario.","Esatto! L'obsolescenza programmata può essere tecnica (il prodotto si rompe dopo N cicli) o psicologica (il design viene reso 'vecchio' dal lancio di nuovi modelli). La Francia ha introdotto un indice di riparabilità come risposta.","Non è corretto. Il deterioramento naturale dei materiali (corrosione, usura, fatica) è un fenomeno fisico inevitabile. L'obsolescenza programmata è invece una scelta progettuale intenzionale.","Non è corretto. Le norme europee sulla garanzia esistono (due anni per i beni di consumo), ma l'obsolescenza programmata è la pratica dei produttori di fare prodotti che durano meno di quanto tecnicamente possibile."]],["Qual è l'impatto del trasporto merci globale sulle emissioni di CO₂?",["Circa il 2-3% delle emissioni globali","Circa l'8% delle emissioni globali di CO₂","Circa il 40% delle emissioni globali","Meno dell'1% delle emissioni globali, perché le navi sono molto efficienti"],1,"Il trasporto merci globale è responsabile di circa l'8% delle emissioni di CO₂. Il marittimo circa il 3% (molto efficiente per t-km ma enormi volumi), l'aereo circa l'1,5% (altissime emissioni per t-km, bassi volumi), il stradale il resto. Una felpa può percorrere 40.000 km prima di arrivare all'acquirente.",["Non è corretto. Il 2-3% è la quota del solo trasporto marittimo. Il trasporto merci complessivo (marittimo + aereo + stradale) ha un impatto maggiore.","Esatto! Il trasporto merci globale è responsabile di circa l'8% delle emissioni globali di CO₂. Il marittimo circa il 3%, l'aereo circa l'1,5%, il stradale il resto.","Non è corretto. Il 40% è un valore molto eccessivo. Il settore edilizio è già al 39% da solo. Il trasporto merci contribuisce con circa l'8%.","Non è corretto. Anche se le navi sono efficienti per tonnellata-km, i volumi del trasporto marittimo globale sono enormi. Il trasporto merci complessivo è all'8%."]],["Cosa fa il cobalto delle miniere della Repubblica Democratica del Congo?",["Viene usato principalmente per produrre vernici industriali rosse e arancioni","Finisce nelle batterie degli smartphone e dei veicoli elettrici","Viene usato come catalizzatore nella produzione della plastica PET","Serve per produrre l'acciaio inossidabile usato nella posateria"],1,"Il cobalto della RDC (circa il 70% della produzione mondiale) finisce nelle batterie agli ioni di litio di smartphone, laptop, tablet e veicoli elettrici. L'UNICEF stima che circa 40.000 bambini lavorino nelle miniere di cobalto in condizioni di lavoro minorile. Un oggetto che compri porta con sé questa storia invisibile.",["Non è corretto. Il cobalto è usato principalmente come componente delle batterie ricaricabili agli ioni di litio, non per le vernici.","Esatto! Il cobalto della RDC (circa il 70% della produzione mondiale) finisce nelle batterie agli ioni di litio di smartphone, laptop e veicoli elettrici. Ogni batteria di EV contiene da 5 a 30 kg di cobalto.","Non è corretto. Il cobalto non è il catalizzatore principale nella produzione di PET. La sua applicazione principale è nelle batterie ricaricabili.","Non è corretto. L'acciaio inossidabile usa cromo e nichel come elementi principali, non cobalto."]]],"I":[["Perché riciclare l'alluminio richiede solo il 5% dell'energia necessaria per produrlo dalla bauxite?",["Perché i forni per riciclare l'alluminio sono più efficienti dei forni per la bauxite","Perché riciclare alluminio significa solo rifonderlo: non serve il processo elettrochimico di estrazione dalla bauxite che consuma 13-15 kWh per kg","Perché l'alluminio riciclato ha una struttura cristallina più semplice che richiede meno energia per essere lavorata","Perché i governi sovvenzionano il riciclo dell'alluminio con incentivi fiscali che abbassano il costo apparente"],1,"Produrre 1 kg di alluminio dalla bauxite richiede ~13-15 kWh per il processo di elettrolisi (separare l'alluminio dall'ossigeno nell'allumina). Riciclare 1 kg di alluminio richiede solo la fusione a 660°C: ~0,7 kWh. Il processo elettrochimico costoso non serve perché il metallo è già isolato. Risparmio: 95%.",["Non è corretto. L'efficienza dei forni è simile. Il motivo è che riciclare non richiede il processo di estrazione e separazione dell'alluminio dalla roccia (che richiede moltissima elettricità).","Esatto! Produrre alluminio dalla bauxite richiede 13-15 kWh/kg per il processo elettrochimico (elettrolisi). Riciclare alluminio significa solo rifonderlo a 660°C: la reazione elettrochimica costosa non è necessaria perché il metallo è già separato dalla roccia.","Non è corretto. L'alluminio riciclato ha la stessa struttura cristallina di quello primario. Il risparmio energetico riguarda il processo di estrazione, non la struttura del metallo.","Non è corretto. Gli incentivi fiscali non cambiano il consumo energetico fisico. Il risparmio del 95% è reale e fisico: meno elettricità consumata nel processo di riciclo rispetto alla produzione primaria."]],["Cosa significa che la supply chain globale di un'automobile è 'vulnerabile' come dimostrato dall'incidente nel Canale di Suez nel 2021?",["Che le automobili diventano più costose quando le materie prime viaggiano su rotte più lunghe","Che una singola interruzione logistica può bloccare fabbriche in tutto il mondo che aspettano componenti da fornitori lontani","Che il canale di Suez è troppo stretto per le navi portacontainer moderne e dovrà essere ampliato","Che le aziende automobilistiche devono mantenere scorte di ricambio più alte nei magazzini europei"],1,"La supply chain globale è ottimizzata per il costo (produrre ogni componente dove è più economico) ma è fragile. Quando nel 2021 una nave ha bloccato il Canale di Suez per sei giorni, migliaia di fabbriche si sono fermate perché le scorte erano esaurite (just-in-time) e i componenti non arrivavano. Efficienza e resilienza sono in tensione.",["Non è corretto. Il costo maggiore è una conseguenza, non la 'vulnerabilità' descritta nel testo. La vulnerabilità è più strutturale.","Esatto! La nave incagliata nel Canale di Suez per sei giorni ha bloccato il traffico globale. Fabbriche in tutto il mondo si sono fermate in attesa di componenti. Una supply chain globale ottimizzata per i costi è fragile alle interruzioni.","Non è corretto. Il Canale di Suez è già stato ampliato. La questione sollevata dall'incidente non è tecnico-infrastrutturale ma strutturale-economica: la fragilità delle catene di fornitura globale.","Parzialmente corretto come soluzione, ma non è la 'vulnerabilità' in sé. La vulnerabilità è la dipendenza da componenti da fornitori lontani con zero scorte (just-in-time)."]],["Perché la fase di 'uso' di un oggetto ha impatti ambientali molto diversi da oggetto a oggetto?",["Perché alcuni oggetti sono prodotti in paesi con normative ambientali più severe","Perché per alcune categorie (auto, lavatrice) l'impatto del carburante/energia durante l'uso supera quello della produzione, mentre per altri oggetti (borraccia monouso) l'uso è trascurabile","Perché gli oggetti costosi durano di più, riducendo l'impatto per anno di utilizzo","Perché l'utente può cambiare l'impatto ambientale dell'uso solo attraverso la scelta del fornitore di energia elettrica"],1,"La fase di uso ha impatto molto variabile: per un'auto o una lavatrice, l'uso (carburante, energia elettrica su anni) può rappresentare il 60-80% dell'impatto totale del ciclo di vita. Per un bicchiere usa-e-getta, l'uso è trascurabile (pochi minuti) rispetto a produzione e smaltimento. Il LCA (Life Cycle Assessment) quantifica questo per ogni prodotto.",["Non è corretto. Le normative di produzione influenzano la fase di produzione, non quella di uso. L'impatto nella fase d'uso dipende dalle caratteristiche del prodotto stesso.","Esatto! Un'automobile: la fase di uso (carburante consumato) domina il ciclo di vita. Una bottiglia usa-e-getta: la produzione e lo smaltimento dominano (l'uso dura pochi minuti). Non c'è una regola universale: dipende dall'oggetto.","Parzialmente vero (la durata è importante), ma non è la risposta completa alla domanda. Il testo indica che l'impatto varia in funzione del tipo di oggetto e di come viene usato, non solo del prezzo.","Non è corretto. L'utente può influenzare l'impatto anche attraverso: frequenza d'uso, modalità d'uso (temperatura del lavaggio, velocità di guida), durata prima dello smaltimento."]],["Cosa indica il dato che la miniera di rame Chuquicamata (Cile) è visibile dallo spazio?",["Che la tecnologia estrattiva moderna è avanzata al punto da poter scavare ovunque","Che l'estrazione mineraria modifica il paesaggio in modo permanente e su scala enorme","Che i satelliti possono monitorare in tempo reale le violazioni delle normative minerarie nei paesi in via di sviluppo","Che la sicurezza nelle miniere a cielo aperto è maggiore rispetto alle miniere sotterranee"],1,"La miniera di rame Chuquicamata in Cile: 4,3 km di larghezza e 850 m di profondità, visibile dallo spazio. È un dato concreto per rendere tangibile la scala dell'impatto dell'estrazione mineraria sul territorio: l'estrazione di materie prime per gli oggetti che usiamo causa trasformazioni fisiche permanenti e di enormi dimensioni.",["Non è corretto. La visibilità dallo spazio non indica il livello tecnologico ma la scala di trasformazione fisica del territorio causata dall'estrazione.","Esatto! Chuquicamata è larga 4,3 km e profonda 850 m. Una cavità così grande, visibile dallo spazio, mostra quanto l'estrazione mineraria possa trasformare fisicamente il territorio in modo permanente.","Non è corretto. Il testo usa la visibilità dallo spazio come dato per comunicare le dimensioni della miniera e l'impatto paesaggistico, non come strumento di controllo normativo.","Non è corretto. La visibilità dallo spazio indica la grandezza della miniera, non le condizioni di sicurezza dei lavoratori."]],["Cosa significa che il 'Made in Italy' non garantisce che tutti gli ingredienti/componenti siano italiani?",["Che il Made in Italy è un'etichetta falsa che inganna i consumatori","Che l'etichetta di origine indica dove avviene l'assemblaggio o la lavorazione principale, non la provenienza di ogni componente o materia prima","Che le aziende italiane producono gli oggetti all'estero con manodopera a basso costo e li vendono come Made in Italy illegalmente","Che in Italia non vengono prodotti oggetti complessi come le automobili: vengono solo assemblati da parti straniere"],1,"Made in Italy indica dove avviene la lavorazione o l'assemblaggio principale (la 'sostanziale trasformazione'). I componenti possono venire da decine di paesi. Una pasta Made in Italy può contenere grano canadese; un'auto Made in Germany può avere il motore ungherese. Le etichette di origine sono utili ma non raccontano tutta la storia della supply chain.",["Non è corretto. Il Made in Italy non è falso: indica legalmente dove avviene la lavorazione principale. Non implica che tutti i componenti siano italiani, ma non è una frode.","Esatto! Made in Italy significa che la fase produttiva principale avviene in Italia. I materiali, i componenti e le lavorazioni intermedie possono provenire da decine di paesi. È legale e obbligatorio comunicarlo, ma non dice tutta la storia della filiera.","Non è corretto. L'esempio citato (la pasta italiana con grano canadese) è perfettamente legale. Il Made in Italy indica la lavorazione principale, non la provenienza di tutti i componenti.","Non è corretto. L'Italia produce molti oggetti complessi, incluse automobili (Ferrari, Lamborghini, Ducati). Il punto è che qualsiasi prodotto complesso ha componenti da più paesi."]],["Il titanio è il nono elemento più abbondante nella crosta terrestre, eppure è rarissimo come materiale industriale. Perché?",["Perché viene estratto solo in pochi paesi che ne controllano l'esportazione con dazi altissimi","Perché isolarlo dai suoi minerali richiede il processo Kroll, altamente energivoro, che lo rende molto costoso","Perché è altamente radioattivo e richiede impianti speciali per la lavorazione in sicurezza","Perché la domanda industriale supera la produzione possibile, creando una scarsità strutturale"],1,"Il titanio (nono elemento più abbondante nella crosta terrestre) è rarissimo come materiale industriale perché isolarlo richiede il processo Kroll: clorizazione + riduzione con magnesio fuso, un processo altamente energivoro e costoso. Per questo il titanio si usa solo dove le prestazioni (leggerissimo, resistente, biocompatibile) valgono il costo: impianti dentali, aerei, orologi di lusso.",["Non è corretto. Il titanio è distribuito nel mondo. Il problema non è geografico-politico ma tecnico-energetico.","Esatto! Il titanio è abbondante ma si trova in forme mineralogiche difficilissime da ridurre. Il processo Kroll (clorizazione + riduzione con magnesio) è altamente energivoro. Per questo il titanio puro costa molto di più di metalli meno abbondanti.","Non è corretto. Il titanio non è radioattivo. È un metallo biocompatibile usato negli impianti dentali e nelle protesi ossee proprio perché non è tossico né radioattivo.","Non è corretto. La scarsità non è dovuta alla limitazione della produzione ma al costo elevato del processo di estrazione. Si produce tanto titanio quanto la domanda richiede, ma a un costo elevato."]]],"A":[["Un consumatore ha due scelte: comprare uno smartphone nuovo ogni due anni o tenerlo per cinque anni riparando le parti rotte. Quale impatto ambientale cambia di più?",["Nessun impatto significativo: lo smaltimento dell'elettronica è gestito dai sistemi RAEE in modo efficiente","L'impatto della produzione del nuovo dispositivo (materie prime, energia, trasporto) che viene evitato tenerlo per cinque anni invece che due","Il consumo di energia per la ricarica: uno smartphone vecchio consuma più energia durante la ricarica di uno nuovo","L'impatto dello smaltimento: i componenti rari come il cobalto nelle batterie causano inquinamento irreversibile"],1,"Per uno smartphone, la fase di produzione (estrazione di metalli rari, assemblaggio in condizioni energivore, trasporto) rappresenta il 70-80% dell'impatto ambientale del ciclo di vita. L'uso energetico (ricarica) è relativamente piccolo. Tenere un dispositivo 5 anni invece di 2 dimezza il numero di dispositivi prodotti in quel periodo: l'azione più efficace.",["Non è corretto. I sistemi RAEE raccolgono gli elettrodomestici ma non eliminano l'impatto della produzione di uno nuovo. La produzione di ogni smartphone nuovo ha un costo ambientale enorme.","Esatto! Per uno smartphone, la fase di produzione (estrazione materie prime rare, assemblaggio, trasporto) domina il ciclo di vita rispetto all'uso energetico. Tenere un dispositivo 5 anni invece di 2 dimezza l'impatto di produzione pro-anno.","Parzialmente vero: i caricatori più vecchi sono meno efficienti. Ma il consumo di ricarica su anni è ordini di grandezza inferiore all'impatto della produzione di un dispositivo nuovo.","Parzialmente vero, ma lo smaltimento (se fatto correttamente tramite RAEE) è gestibile. L'impatto maggiore evitato è la produzione del nuovo dispositivo."]],["Il triangolo del litio (Cile-Argentina-Bolivia) detiene il 60% del litio mondiale. Quali implicazioni geopolitiche e di sicurezza delle risorse crea questa concentrazione?",["Nessuna implicazione: il litio è abbondante e i prezzi sono stabili perché ci sono molti fornitori alternativi","I paesi consumatori di batterie (UE, USA, Giappone) dipendono da tre paesi per una risorsa critica, creando vulnerabilità nelle catene di fornitura della transizione energetica","Garantisce ai paesi del triangolo un vantaggio commerciale ma non crea dipendenze pericolose perché il litio non è usato in applicazioni militari","Non crea implicazioni perché l'UE sta sviluppando miniere di litio in Europa che saranno operative entro il 2025"],1,"Il 60% del litio mondiale è in Chile-Argentina-Bolivia ('triangolo del litio'). Per i produttori di auto elettriche e sistemi di storage energetico dell'UE, USA e Giappone, questa concentrazione crea dipendenze strategiche simili a quelle del petrolio. È una delle ragioni per cui l'UE considera il litio una 'materia prima critica' e investe nella ricerca di alternative.",["Non è corretto. La concentrazione in tre paesi crea dipendenza per i produttori di batterie. I prezzi del litio sono molto volatili e soggetti a crisi geopolitiche.","Esatto! Il litio è indispensabile per le batterie degli EV e dello stoccaggio energetico. Concentrato in tre paesi, crea dipendenza simile a quella del petrolio dal Medio Oriente. Diversificare o trovare alternative è una priorità strategica.","Non è corretto. Il litio è usato anche in applicazioni militari (bombe nucleari, aerei militari). E la dipendenza per la transizione energetica è di per sé strategica.","Non è corretto. L'UE sta esplorando fonti di litio europee (Portogallo, Finlandia, Serbia) ma la disponibilità è molto inferiore alle riserve sudamericane. La dipendenza rimane significativa nel medio termine."]],["Una felpa in cotone percorre 40.000 km prima di arrivare al consumatore. Come si calcola l'impatto del trasporto e cosa si può fare?",["L'impatto del trasporto è trascurabile perché le navi sono molto efficienti: la produzione del cotone domina il ciclo di vita","Si calcola moltiplicando il peso per la distanza per il fattore emissivo del mezzo (t-km): la scelta di produttori con filiera più corta riduce l'impatto","Non si può calcolare senza conoscere la modalità di trasporto specifica usata in ogni segmento del percorso","L'impatto si azzera se il produttore usa energia rinnovabile per i suoi stabilimenti produttivi"],1,"L'impatto del trasporto si calcola con: tonnellate × km × fattore emissivo CO₂/t-km (diverso per aereo, camion, nave, treno). 40.000 km è una stima per una felpa prodotta in Asia e venduta in Europa. Per ridurre: 1) scegliere filiere più corte; 2) evitare l'aereo (emissioni 10-50 volte maggiori della nave per t-km); 3) preferire produttori nazionali/europei.",["Parzialmente corretto che la produzione del cotone (acqua, pesticidi) domina. Ma 40.000 km di trasporto con diversi mezzi (nave, camion, aereo) non sono trascurabili, specialmente le fasi aeree.","Esatto! Impatto = peso (tonnellate) × distanza (km) × fattore emissivo (CO₂/t-km per tipo di mezzo). Per ridurlo: scegliere produttori con filiere più corte, preferire il trasporto marittimo all'aereo, scegliere prodotti locali dove possibile.","Parzialmente vero che la precisione richiede i dati di ogni segmento. Ma stime approssimative sono possibili con dati medi per tipo di tratta, e il concetto (ridurre le distanze e usare mezzi meno inquinanti) rimane valido.","Non è corretto. L'energia rinnovabile negli stabilimenti riduce l'impatto della produzione, non quello del trasporto dei prodotti finiti sulle rotte commerciali globali."]],["Il LCA (Life Cycle Assessment) mostra che per un frigorifero la fase di uso (energia elettrica per 15 anni) domina sull'impatto della produzione. Cosa suggerisce questo per una scelta d'acquisto consapevole?",["Comprare il frigorifero più economico possibile perché l'impatto principale è l'energia che si paga già in bolletta","Investire in un frigorifero di classe A+++ anche se più costoso inizialmente: l'efficienza energetica su 15 anni riduce sia il costo economico che l'impatto ambientale","Non c'è nulla che il consumatore possa fare: l'impatto energetico è determinato dalla rete elettrica nazionale","Comprare un frigorifero più piccolo per ridurre la quantità di materie prime usate nella produzione"],1,"Se per un frigorifero la fase di uso (15 anni × energia elettrica) domina il ciclo di vita, allora ottimizzare l'efficienza energetica è la priorità. Un frigorifero A+++ consuma 60-70% meno di uno in classe D. Su 15 anni a 0,30 €/kWh, la differenza in bolletta può essere di 400-600 euro — spesso più del maggior costo di acquisto del modello efficiente.",["Non è corretto. Il frigorifero più economico è spesso meno efficiente energeticamente: costa di più in bolletta e ha un impatto ambientale maggiore nel lungo periodo.","Esatto! Se la fase di uso domina il ciclo di vita, ottimizzare quella fase è la priorità. Un frigorifero A+++ consuma 60-70% meno di uno in classe D. Su 15 anni, il risparmio in bolletta può superare il maggior costo di acquisto.","Non è corretto. La classe energetica del frigorifero è scelta dal consumatore al momento dell'acquisto. Un A+++ consuma meno di un D indipendentemente dalla rete.","Non è corretto. Se la fase di uso domina, la dimensione (che influenza principalmente la produzione) è meno importante dell'efficienza energetica. Un piccolo frigorifero in classe D consuma più di un grande in A+++."]],["Perché lo studio del ciclo di vita di un oggetto è più utile di sapere solo com'è fatto?",["Perché il ciclo di vita contiene informazioni sul prezzo storico di ogni componente del prodotto","Perché rivela l'impatto totale lungo tutta la vita del prodotto, comprese le fasi invisibili (estrazione, produzione, trasporto) e la fine vita","Perché permette di confrontare due oggetti esteticamente simili per scegliere il più bello","Perché è richiesto dalla normativa europea per tutti i prodotti venduti nel mercato unico"],1,"Sapere solo 'com'è fatto' un oggetto rivela solo la fase di produzione. Il ciclo di vita (LCA) include: estrazione delle materie prime (spesso in condizioni problematiche), lavorazione energivora, trasporto globale (food miles), impatto durante l'uso, e fine vita. Solo con questa visione completa si possono fare scelte consapevoli.",["Non è corretto. Il LCA non analizza i prezzi storici. Studia gli impatti ambientali, energetici e sociali in ogni fase della vita del prodotto.","Esatto! Sapere 'com'è fatto' un oggetto dice solo la fase di produzione. Il LCA include fasi spesso invisibili al consumatore: l'estrazione in Congo, la produzione energivora in Asia, 40.000 km di trasporto, e cosa succede quando si butta. È una visione completa.","Non è corretto. La bellezza estetica è soggettiva e non fa parte dell'analisi del ciclo di vita. Il LCA è uno strumento quantitativo di valutazione dell'impatto.","Non è corretto. Il LCA non è (ancora) obbligatorio per tutti i prodotti nel mercato UE. È uno strumento volontario sempre più usato, e alcune normative lo richiedono per specifiche categorie di prodotti."]],["Il canale di Suez blocca 6 giorni e ferma fabbriche in tutto il mondo. Che sistema di produzione ha reso possibile questa reazione a catena?",["Il sistema fordista di produzione di massa con linee di montaggio standardizzate","Il sistema just-in-time con supply chain globale: fabbriche senza scorte che dipendono dall'arrivo puntuale di componenti da tutto il mondo","Il sistema cooperativo europeo di condivisione delle risorse produttive tra paesi UE","Il sistema di produzione decentrata con molte PMI locali che subappaltano alla grande industria"],1,"Il just-in-time (JIT) è un sistema di produzione in cui i componenti arrivano 'appena in tempo' per essere assemblati, senza scorte. Riduce i costi di magazzino ma è fragile: qualsiasi interruzione logistica si trasmette immediatamente alla produzione. Il blocco del Canale di Suez (6 giorni) ha dimostrato la fragilità sistemica di supply chain globali ottimizzate per il costo ma non per la resilienza.",["Non è corretto. La produzione fordista è caratteristica del XX secolo con fabbriche integrate localmente. Il problema del Canale di Suez riguarda un modello produttivo più recente.","Esatto! Il just-in-time elimina le scorte per ridurre i costi: i componenti arrivano 'appena in tempo' per essere assemblati. Quando la logistica si interrompe, le linee di produzione si fermano subito perché non ci sono scorte tampone.","Non è corretto. La crisi del Canale di Suez coinvolgeva supply chain globali non limitate all'UE. Il problema è il just-in-time globale, non specificamente il modello cooperativo europeo.","Non è corretto. La frammentazione in molte PMI locali avrebbe al contrario ridotto la vulnerabilità alle interruzioni logistiche. Il problema è la concentrazione della produzione di componenti critici in pochi siti lontani."]]]};

  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>
<style>
/* Modalità LIM */
.lim-btn{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--lab);background:var(--surface);border:2px solid var(--lab);border-radius:999px;padding:4px 12px;cursor:pointer}
.lim-btn:hover{background:var(--lab-bg)}
.lim-btn:focus-visible,.lim-bar button:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.chips{align-items:center}
.lim-bar{position:fixed;top:10px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lim-bar[hidden]{display:none}
.lim-bar button{font:inherit;font-weight:800;font-size:20px;min-width:52px;height:52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 14px}
.lim-bar .lim-out{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.lim-lvl{font-family:var(--mono);font-weight:700;font-size:15px;min-width:52px;text-align:center;color:var(--muted)}
html.lim,html.lim body{background:var(--bg)}
html.lim body{padding:12px 24px 40px;overflow-y:auto}
html.lim .wrap{zoom:var(--limz,1.5);max-width:1250px;gap:14px}

html.lim .wrap:not(.es) header.lab-head .hook{display:none}
html.lim .wrap p{max-width:none}
/* bersagli più grandi per il tocco (prima dell'ingrandimento) */
html.lim .btn,html.lim .tab,html.lim .item,html.lim .cat,html.lim .opts button,html.lim .vq-opts button,html.lim .es-opts button{min-height:44px}
html.lim input[type=range]{height:32px}
html.lim input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
html.lim input[type=range]::-moz-range-thumb{width:28px;height:28px}
html.lim select,html.lim input:not([type=range]):not([type=checkbox]):not([type=radio]),html.lim textarea{min-height:44px;font-size:17px}
html.lim input[type=checkbox],html.lim input[type=radio]{width:24px;height:24px}
html.lim .lab-foot,html.lim .lim-btn{display:none}
html.lim .muted{color:var(--fg);opacity:.85}
</style>
<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  const param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    if (!param) set(false);
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
