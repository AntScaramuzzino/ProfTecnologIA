<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Casa domotica per Carmelo</title>
<style>
/* Layout: colonna unica da libro digitale (max 920px), testata d'area, schede livello, banco di lavoro, feedback.
   Token dal design system TecnologIA (design-tokens.json): brand navy, zona 4 Laboratorio, colori d'area. */
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(../_fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF3FC; --fg:#1A1C24; --muted:#5A5F76; --line:#D8DAE8;
  --brand:#1A2B4A; --lab:#00695C; --lab-bg:#E0F2F1; --energy:#C24010;
  --ok:#166534; --ok-bg:#DCFCE7; --ko:#B42318; --ko-bg:#FEE4E2; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --area:#1A3A7A; --area-bg:#E8EFF9;
  --sans:'Atkinson Hyperlegible','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16223A; --surface-2:#1C2B48; --fg:#ECEEF6; --muted:#B8BCCE; --line:#2C3C5C;
  --brand:#D8E3F7; --lab:#5ED1C2; --lab-bg:#123A3A; --energy:#FFA07A;
  --ok:#7EE2A0; --ok-bg:#12351F; --ko:#FF9C92; --ko-bg:#3D1715; --warn:#F5C969; --warn-bg:#3A2C0C;
  --area-bg:#1C2B48; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;color:var(--brand)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.lab-head{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:2px solid var(--area)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--area-bg);color:var(--area)}
.chip.lab{background:var(--lab-bg);color:var(--lab)}
.hook{font-size:17px;color:var(--fg)}
/* level tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--lab);border-bottom-color:var(--lab)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.dots{letter-spacing:-.1em;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--lab);background:var(--lab);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--lab)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--ko-bg);color:var(--ko)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb strong{font-weight:800}
.meta{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.bridge{border:2px dashed var(--area);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.bridge .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--area)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--lab)}
label{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lab)}
footer.lab-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){.tab{padding:10px 8px;font-size:14px}h1{font-size:26px}}

/* Motore laboratori: stili dei blocchi riutilizzabili */
.blk-h{font-size:17px;font-weight:700;color:var(--brand);margin:0}
.blk-p{margin:0;color:var(--muted);font-size:15px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.item[aria-pressed="true"]{background:var(--area);color:var(--surface);border-color:var(--area)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{font:inherit;text-align:left;border:2px solid var(--area);border-top-width:6px;border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:disabled{cursor:default;opacity:.75}
.cat .n{font-weight:800;color:var(--area)}
.cat .h{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qq:first-of-type{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chipbtn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{border-color:var(--area);background:var(--area-bg);color:var(--area)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.readout>div{background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.readout .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--area);transition:width .2s}
.bar .val{font-family:var(--mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:90px 1fr 70px}}
.olist{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.orow .t{flex:1;min-width:0}
.orow .num{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:22px}
.orow button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ko{border-color:var(--ko);background:var(--ko-bg)}
.orow .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt strong{font-size:15px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter-b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.meter-b .track{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.meter-b .fill{height:100%;background:var(--area);transition:width .3s}
.story{font-size:16px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.choices button:hover{border-color:var(--area)}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docsel{display:flex;flex-wrap:wrap;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:16px;line-height:1.7}
.doc .dt{font-weight:800;font-size:17px;margin-bottom:4px}
.doc .ds{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"]{background:#FFE08A;color:#3A2C00}
.seg.hit{outline:2px solid var(--ok)}
.seg.miss{outline:2px dashed var(--ko)}
.seg.fp{outline:2px dotted var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fields .hint{font-size:13px;color:var(--muted);font-weight:400}
.checks{display:flex;flex-direction:column;gap:6px}
pre.out{white-space:pre-wrap;font-family:var(--sans);font-size:15px;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;max-width:100%;overflow-wrap:anywhere}
svg.chart{width:100%;height:auto;display:block;max-width:760px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600}
.toggles input{accent-color:var(--lab);width:18px;height:18px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.cl input{accent-color:var(--lab);width:18px;height:18px;margin-top:3px;flex:none}
.info{font-size:15px;display:flex;flex-direction:column;gap:8px}
.info table{font-size:14px}
.src{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<script>
// Motore dei laboratori ProfTecnologIA — costruisce la pagina da una configurazione.
// Blocchi: sort · quiz · sim · order · compare · scenario · inspect · canvas · chart · check · info
(function () {
  const AREA = {
    MAT: ["#6D4C41", "#EFEBE9", "Materiali e Rifiuti"], DIS: ["#1A3A7A", "#E8EFF9", "Disegno Tecnico"],
    DIG: ["#006064", "#E0F7FA", "Digitale"], ALI: ["#4E7A26", "#F1F8E9", "Alimentazione"],
    AMB: ["#BF360C", "#FBE9E7", "Abitazione, Città, Territorio"], ENE: ["#C24010", "#FFF3E0", "Energia e Macchine"],
    COM: ["#6A1B9A", "#F3E5F5", "Comunicazioni e Trasporti"], SIS: ["#1B5E7A", "#E1F0F8", "Sistemi, Economia e Lavoro"],
    INF: ["#37474F", "#ECEFF1", "Informatica"],
  };
  const $c = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const fmt = (n, d = 0) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }) : (n == null ? "—" : String(n));
  const fb = (el, kind, html) => { el.className = "fb " + kind; el.innerHTML = html; el.hidden = false; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let uid = 0; const nid = (p) => `lb-${p}${++uid}`;
  let LABID = "lab";
  const store = {
    get(k) { try { return localStorage.getItem(LABID + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(LABID + ":" + k, v); } catch (e) {} },
  };
  function seeded(arr, seed) { const r = [...arr]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function head(box, b) { if (b.title) box.appendChild($c("h3", "blk-h", b.title)); if (b.text) box.appendChild($c("p", "blk-p", b.text)); }

  /* ---------- SORT: tocca un elemento, poi la categoria ---------- */
  function sort(b) {
    const box = $c("div", "bench"); head(box, b);
    const cats = Object.fromEntries(b.categories.map((c) => [c[0], c]));
    const items = b.shuffle === false ? b.items : seeded(b.items, b.items.length * 3 + 1);
    const status = $c("div", "row"); const left = $c("span", "muted"); left.setAttribute("aria-live", "polite"); const sc = $c("span", "score"); status.append(left, sc);
    const tray = $c("div", "tray"); const catBox = $c("div", "cats"); const fbx = $c("div"); fbx.hidden = true; const log = $c("div", "log"); log.setAttribute("aria-live", "polite");
    const reset = $c("button", "btn ghost", "Ricomincia"); const rr = $c("div", "row"); rr.appendChild(reset);
    box.append(status, tray, catBox, fbx, log, rr);
    let sel = null, done = {}, score = 0;
    function draw() {
      tray.innerHTML = "";
      items.forEach((it, i) => { if (done[i] !== undefined) return; const x = $c("button", "item", esc(it[0])); x.setAttribute("aria-pressed", sel === i); x.onclick = () => { sel = sel === i ? null : i; draw(); }; tray.appendChild(x); });
      catBox.innerHTML = "";
      b.categories.forEach(([id, label, hint]) => { const x = $c("button", "cat", `<span class="n">${esc(label)}</span>${hint ? `<span class="h">${esc(hint)}</span>` : ""}`); x.disabled = sel === null; x.onclick = () => drop(id); catBox.appendChild(x); });
      const n = items.length - Object.keys(done).length, d = Object.keys(done).length;
      left.textContent = n ? (sel === null ? `${n} da classificare: scegli un elemento.` : `Dove va «${items[sel][0]}»?`) : "Hai classificato tutto.";
      sc.textContent = d ? `${score}/${d}` : "";
      if (!n) fb(fbx, score === items.length ? "ok" : "warn", score === items.length ? `<strong>Tutto giusto.</strong> ${b.done || ""}` : `<strong>${score} su ${items.length}.</strong> Rileggi le spiegazioni in rosso: sono gli errori da non ripetere.`);
    }
    function drop(id) { if (sel === null) return; const it = items[sel], ok = it[1] === id; done[sel] = id; if (ok) score++;
      const d = $c("div", "fb " + (ok ? "ok" : "ko")); d.innerHTML = ok ? `<strong>${esc(it[0])}</strong> → ${esc(cats[id][1])}. ${it[2] || ""}` : `<strong>${esc(it[0])}</strong> non va in «${esc(cats[id][1])}», ma in «${esc(cats[it[1]][1])}». ${it[2] || ""}`;
      log.prepend(d); sel = null; draw(); }
    reset.onclick = () => { sel = null; done = {}; score = 0; log.innerHTML = ""; fbx.hidden = true; draw(); };
    draw(); return box;
  }

  /* ---------- QUIZ: domande a scelta con spiegazione ---------- */
  function quiz(b) {
    const box = $c("div", "bench"); head(box, b); let right = 0, answered = 0; const sc = $c("span", "score");
    b.questions.forEach(([q, opts, a, why]) => {
      const d = $c("div", "qq"); d.appendChild($c("strong", null, q)); const g = $c("div", "opts"); g.setAttribute("role", "group"); const f = $c("div"); f.hidden = true; let tried = false;
      opts.forEach((o, j) => { const x = $c("button", null, o); x.onclick = () => {

<script>

        { type: "quiz", questions: [["Il termostato accende la caldaia sotto i 20 °C e la spegne sopra. Che cos'è questo meccanismo?", ["Un ciclo aperto", "Una retroazione: il risultato dell'azione torna al sensore", "Un caso"], 1, "La temperatura cambia per effetto della caldaia e viene misurata di nuovo: è un sistema ad anello chiuso."]] } ],
      reflect: "Quale sistema automatico usi ogni giorno senza accorgertene? Trova sensore, logica e attuatore." },
    { brief: "Rendi «smart» l'aula con un budget di 500 €. Scegli le automazioni: ognuna risponde a un'esigenza. Prezzi d'esempio, da verificare online.",
      blocks: [
        { type: "sim", params: [{ id: "luci", label: "Luci con sensore di presenza (120 €)", options: [[0, "No"], [1, "Sì"]], value: 1 }, { id: "co2", label: "Sensore di CO₂ con avviso «apri la finestra» (90 €)", options: [[0, "No"], [1, "Sì"]], value: 1 }, { id: "term", label: "Valvole termostatiche programmabili sui termosifoni (160 €)", options: [[0, "No"], [1, "Sì"]], value: 0 }, { id: "tapp", label: "Tapparelle motorizzate con sensore di luce (280 €)", options: [[0, "No"], [1, "Sì"]], value: 0 }, { id: "pres", label: "Prese smart che spengono lo stand-by (60 €)", options: [[0, "No"], [1, "Sì"]], value: 1 }],

          note: (p, o) => o.c > 500 ? ["ko", "Fuori budget: togli qualcosa o cerca una soluzione più economica."] : ["ok", "Per ogni automazione indica il sensore, la logica e l'attuatore."] } ],
      reflect: "Quale automazione ha il miglior rapporto fra costo e beneficio? Come lo misureresti dopo un mese?" },
    { label: "Scenario · le luci notturne di Carmelo", brief: "Carmelo vive solo e di notte si alza. Programma la luce del corridoio: si accende se c'è movimento, se è buio e se siamo nella fascia notturna. Regola le soglie e guarda come si comporta il sistema nei cinque casi di prova.",
      blocks: [
        { type: "sim", params: [{ id: "lux", label: "Soglia di buio: accendi sotto", min: 5, max: 200, step: 5, value: 150, unit: "lux" }, { id: "ini", label: "Inizio fascia notturna", min: 17, max: 23, step: 1, value: 19, unit: "h" }, { id: "fin", label: "Fine fascia notturna", min: 4, max: 9, step: 1, value: 7, unit: "h" }, { id: "int", label: "Intensità della luce", min: 10, max: 100, step: 10, value: 30, unit: "%" }],
          outputs: [{ key: "ok", label: "Casi gestiti come previsto", f: (p) => CASI.filter(([, o, l, m], i) => accesa(p, o, l, m) === [true, false, false, false, true][i]).length + " su 5" }],
          draw: (p) => `<div class="scroll-x"><table><thead><tr><th>Caso</th><th>Ora</th><th>Luce (lux)</th><th>Movimento</th><th>Luce del corridoio</th><th>Atteso</th></tr></thead><tbody>${CASI.map(([d, o, l, m], i) => { const a = accesa(p, o, l, m), att = [true, false, false, false, true][i]; return `<tr><td>${d}</td><td class="mono">${o}:00</td><td class="mono">${l}</td><td>${m ? "sì" : "no"}</td><td style="color:var(${a === att ? "--ok" : "--ko"});font-weight:700">${a ? `accesa al ${p.int}%` : "spenta"}</td><td>${att ? "accesa" : "spenta"}</td></tr>`; }).join("")}</tbody></table></div>`,
          note: (p) => p.int > 60 ? ["warn", "Di notte una luce forte abbaglia chi si è appena svegliato: una luce bassa basta per vedere e non sveglia del tutto."] : null },
        { type: "quiz", questions: [["Il gatto attraversa il corridoio di notte e la luce si accende. Come si migliora la logica?", ["Si toglie il sensore", "Si usa un sensore che ignori i piccoli animali o si richiede movimento per più di un secondo", "Si accende la luce sempre"], 1, "È un falso positivo: si correggono la sensibilità del sensore o la condizione nella logica."]] } ],
      reflect: "Che cosa dovrebbe fare il sistema se Carmelo non si muove per molte ore durante il giorno? Quali questioni di privacy nascono?" }],
  bridge: "Progetta una casa domotica per un anziano che vive solo: individua 5 esigenze (sicurezza, comfort, salute, comunicazione, risparmio), scegli i dispositivi e descrivi la logica di funzionamento.",
});

      document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});

  }

    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      let j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
      if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();select(tabs[j],true);}
    });
  });
  let saved=null;try{saved=localStorage.getItem('lab-level-'+document.title)}catch(e){}
  select(document.getElementById(saved)||tabs[0]);
  window.LAB={
    fb(el,kind,html){el.className='fb '+kind;el.innerHTML=html;el.hidden=false;},

    }
  };
})();

<script>
window.LABVERIFICA={"id":"MC-COM-3-04","F":[["In quale anno fu coniato il termine 'Industria 4.0'?",["2011, in Germania, come strategia industriale","1995, negli USA con l'avvento di Internet","2020, durante la pandemia Covid-19","1913, con la catena di montaggio di Ford"],0,"Il termine 'Industria 4.0' fu coniato nel 2011 in Germania come strategia industriale nazionale. Descrive l'integrazione di quattro tecnologie — IoT, Big Data, IA, Cloud — che, prese insieme, creano qualcosa di radicalmente nuovo rispetto alle rivoluzioni industriali precedenti.",["Esatto! Il termine Industria 4.0 fu coniato nel 2011 in Germania (Industrie 4.0) come strategia per mantenere la competitività manifatturiera.","Non è corretto. Il termine nasce nel 2011 in Germania, non nel 1995 negli USA.","Non è corretto. Il termine è del 2011, ben prima della pandemia.","Non è corretto. Il 1913 è l'anno della catena di montaggio di Ford, che appartiene alla Seconda Rivoluzione Industriale."]],["Cosa distingue l'automazione rigida da quella flessibile?",["La rigida fa una cosa sola; la flessibile si adatta","L'automazione rigida è più moderna di quella flessibile","L'automazione flessibile non usa computer","L'automazione rigida è più costosa da installare"],0,"L'automazione rigida (es. imbottigliatrice) fa una sola cosa con altissima velocità: se il prodotto cambia, bisogna fermare e riconfigurare tutto. L'automazione flessibile (es. braccio robotico programmabile) è più lenta ma si adatta a compiti diversi senza smontarla fisicamente.",["Esatto! L'automazione rigida (imbottigliatrice) è ottimale per un solo compito ad alto volume. Quella flessibile (braccio robotico programmabile) si riconfigura per diversi compiti.","Non è corretto. L'automazione rigida è storicamente più antica. Quella flessibile è una tendenza più recente dell'Industria 4.0.","Non è corretto. L'automazione flessibile dipende proprio dai computer per la riprogrammazione.","Non è corretto. In genere è il contrario: l'automazione flessibile (bracci robotici programmabili) è più costosa delle macchine dedicate."]],["Cosa misura la 'ripetibilità' di un robot industriale?",["La precisione con cui torna ogni volta nello stesso punto","La velocità massima di movimento del braccio robotico","Il numero di operazioni per ora che il robot può compiere","Il peso massimo che il robot può sollevare"],0,"La ripetibilità di un robot industriale misura con quanta precisione torna esattamente allo stesso punto ogni ciclo. I migliori hanno ±0,01 mm — 5 volte più precisi di un chirurgo esperto (±0,1 mm) e 50 volte più precisi della mano umana media (±0,5 mm).",["Esatto! La ripetibilità è la precisione con cui un robot torna allo stesso punto. I migliori arrivano a ±0,01 mm — 5 volte più precisi della mano umana esperta.","Non è corretto. La velocità è una caratteristica diversa dalla ripetibilità.","Non è corretto. Il numero di operazioni orarie è un dato di produttività, non di ripetibilità.","Non è corretto. Quello è il 'payload'. La ripetibilità misura la precisione del posizionamento."]],["Cos'è un 'cobot'?",["Un robot progettato per lavorare accanto alle persone","Un robot che opera solo in ambienti sottomarini","Un robot che sostituisce completamente il lavoratore umano","Un computer portatile usato in fabbrica"],0,"I cobot (collaborative robots) sono robot industriali progettati per operare nello stesso spazio fisico degli esseri umani senza gabbie di protezione. Hanno sensori di forza su tutti i giunti: se toccano qualcosa di inaspettato, si fermano immediatamente o cedono.",["Esatto! I cobot (collaborative robots) usano sensori di forza per rilevare il contatto umano e fermarsi immediatamente, permettendo la collaborazione senza gabbie.","Non è corretto. 'Cobot' sta per 'collaborative robot': lavora insieme agli umani, non sott'acqua.","Non è corretto. Il cobot è progettato per collaborare con gli umani, non per sostituirli completamente.","Non è corretto. Il cobot è un robot fisico con braccio meccanico, non un computer."]],["Qual è la differenza principale tra stampa FDM e stampa SLS?",["FDM fonde un filo di plastica; SLS fonde polveri con un laser","FDM produce pezzi metallici; SLS produce solo pezzi in plastica","SLS è più economica di FDM perché non richiede filamento","FDM usa raggi UV; SLS usa calore per indurire la resina"],0,"FDM (Fused Deposition Modeling) deposita filamento plastico fuso strato per strato: economica ma con superfici 'a strisce' e resistenza non uniforme. SLS (Selective Laser Sintering) usa un laser per fondere polveri di nylon o metallo: produce pezzi con resistenza meccanica paragonabile a quelli stampati tradizionalmente.",["Esatto! FDM deposita strati di plastica fusa (economica, per prototipi visivi); SLS usa laser su polveri e produce pezzi con resistenza meccanica paragonabile alle parti forgiate.","Non è corretto. È il contrario: SLS può usare polveri metalliche; FDM usa principalmente plastiche.","Non è corretto. Le macchine SLS industriali costano da 300.000 euro in su, molto più delle FDM.","Non è corretto. Stai descrivendo SLA (stereolitografia). FDM usa filamento fuso, SLS usa laser su polveri."]],["Cosa fa un sistema di 'manutenzione predittiva' in una fabbrica IoT?",["Prevede i guasti analizzando i dati dei sensori","Effettua riparazioni automatiche senza intervento umano","Sostituisce i componenti a intervalli fissi di tempo","Blocca automaticamente la produzione dopo ogni guasto"],0,"La manutenzione predittiva usa i dati IoT (temperatura, vibrazione, consumo energetico) per prevedere quando una macchina si guasterà, prima che accada. Invece di aspettare il guasto (reattiva) o fermarsi a intervalli fissi (preventiva), il sistema dice 'questa macchina si guasterà tra 48 ore' con un livello di probabilità calcolato.",["Esatto! Invece di aspettare il guasto (reattiva) o fermare ogni tot ore (preventiva), il sistema analizza vibrazione, temperatura, consumo e dice quando si guasterà una macchina.","Non è corretto. La manutenzione predittiva prevede i guasti ma non li ripara autonomamente: avvisa i tecnici.","Non è corretto. Quello è il metodo 'preventivo'. La manutenzione predittiva usa i dati per capire quando realmente sostituire.","Non è corretto. Quello è il comportamento reattivo. La manutenzione predittiva interviene prima che il guasto avvenga."]]],"I":[["In cosa consiste la differenza fondamentale tra automazione e intelligenza artificiale in fabbrica?",["L'automazione segue regole fisse; l'IA impara dai dati","L'automazione usa computer; l'IA usa solo meccanismi fisici","L'IA è sempre più veloce dell'automazione","L'automazione è più costosa dell'IA"],0,"L'automazione segue regole fisse scritte da un programmatore: 'se temperatura > 80°C, apri la valvola'. L'IA apprende da milioni di esempi e generalizza: riconosce i difetti anche in modi mai visti. Il Box T8 chiarisce che la maggior parte dei sistemi in fabbrica è automazione, non IA vera.",["Esatto! Il Box T8 chiarisce: l'automazione esegue istruzioni predefinite. L'IA impara dai dati e può riconoscere situazioni mai viste prima.","Non è corretto. Entrambe usano computer. La distinzione riguarda la capacità di apprendere vs seguire regole fisse.","Non è corretto. La velocità dipende dall'applicazione. L'IA può essere più lenta per compiti semplici ma più capace per compiti complessi.","Non è corretto. Il costo non distingue automazione da IA: la distinzione è sulla capacità di apprendimento."]],["Quali tre vantaggi specifici ha il gemello digitale (digital twin) rispetto alla progettazione tradizionale?",["Simula prima di costruire, manutenzione predittiva avanzata, ottimizzazione continua su tutti gli impianti","Riduce il numero di dipendenti, aumenta la velocità di produzione, abbassa il costo dei materiali","Elimina gli errori di produzione, garantisce zero difetti, riduce i resi","Sostituisce i progettisti, automatizza il marketing, gestisce i fornitori"],0,"Il testo identifica tre funzioni del gemello digitale: 1) simulare configurazioni prima di costruire fisicamente; 2) manutenzione predittiva personalizzata su quella specifica macchina (non stime medie); 3) ottimizzazione continua distribuita su tutti gli impianti del mondo contemporaneamente.",["Esatto! Il testo elenca queste tre funzioni del gemello digitale: simulare prima di investire, manutenzione predittiva personalizzata, ottimizzazione distribuita.","Non è corretto. Il testo non identifica questi come le tre funzioni del digital twin.","Non è corretto. Il gemello digitale non garantisce zero difetti ma permette di simulare e ottimizzare.","Non è corretto. Il gemello digitale è uno strumento per ingegneri e tecnici, non per sostituire persone."]],["Perché i cobot BMW nello stabilimento di Dingolfing non sostituiscono gli operai ma lavorano con loro?",["Il montaggio richiede la forza del robot e il giudizio dell'operaio","Le leggi tedesche vietano ai robot di lavorare senza supervisione umana","I cobot sono ancora troppo lenti per lavorare da soli","Gli operai controllano che il robot non commetta errori"],0,"Il testo descrive il caso BMW: montare guarnizioni flessibili in scanalature su percorsi curvi irregolari. Il robot fa la forza precisa e la ripetibilità millimetrica; l'operaio guida la traiettoria adattandosi alle variazioni. Il risultato è qualcosa che nessuno dei due potrebbe fare da solo.",["Esatto! Il testo descrive il caso specifico: le guarnizioni flessibili su percorsi curvi irregolari richiedono la forza precisa del robot e la guida adattiva dell'operaio.","Non è corretto. La scelta non è normativa ma tecnica: certi compiti richiedono le capacità combinate di robot e umano.","Non è corretto. La velocità ridotta dei cobot è una scelta di sicurezza, non un limite tecnico superabile con la collaborazione.","Non è corretto. La collaborazione non è supervisione: l'operaio contribuisce con la destrezza che il robot non ha."]],["Nel caso domotico di nonno Carmelo, perché il monitoraggio del frigorifero è preferito alle videocamere?",["Perché segue le abitudini di Carmelo senza riprenderlo","Perché le videocamere costano troppo per un anziano","Perché le videocamere richiedono connessione a Internet costosa","Perché le videocamere non funzionano in case senza Wi-Fi"],0,"Il testo spiega che 'Carmelo le rifiuterebbe, giustamente'. I sistemi di monitoraggio del benessere registrano pattern di vita (frigorifero aperto, tv accesa, uscita e rientro) senza video, garantendo sicurezza senza invadere la privacy. Questo dimostra che la progettazione domotica parte sempre dai bisogni e dai valori dell'utente.",["Esatto! Il testo descrive i 'sistemi di monitoraggio del benessere': registrano attività (frigorifero aperto, tv accesa, porta di uscita) senza video, rispettando l'autonomia.","Non è corretto. Il testo indica che Carmelo rifiuterebbe le videocamere per motivi di dignità e privacy, non economici.","Non è corretto. La motivazione è la privacy e il rispetto dell'autonomia, non il costo della connessione.","Non è corretto. Il testo non menziona problemi di connessione: la ragione è la privacy e la dignità di Carmelo."]],["Qual è il protocollo domotico più recente (2022) che punta a risolvere il problema della compatibilità tra marche?",["Matter, sostenuto da Apple, Google, Amazon, Samsung","Zigbee, protocollo aperto a basso consumo","Z-Wave, protocollo proprietario di Silicon Labs","Bluetooth 5.0, sviluppato per dispositivi a bassa energia"],0,"Matter (2022), sostenuto da Apple, Google, Amazon e Samsung, è il protocollo domotico più recente progettato per risolvere la frammentazione: un dispositivo Matter funziona con qualsiasi sistema domotico Matter, indipendentemente dalla marca. È basato su IP e funziona su Wi-Fi e Thread.",["Esatto! Matter (2022) è basato su IP e punta a garantire che i dispositivi di produttori diversi funzionino insieme. È destinato a diventare lo standard dominante.","Non è corretto. Zigbee è più vecchio e non risolve completamente la compatibilità tra produttori diversi.","Non è corretto. Z-Wave è più standardizzato di Zigbee ma è precedente e più limitato di Matter.","Non è corretto. Bluetooth 5.0 è un protocollo di comunicazione radio generale, non specifico per la domotica."]],["Come funziona la componente 'D' (Derivativa) del controllo PID in un sistema automatico?",["Frena la correzione quando ci si avvicina in fretta al target","Compensa gli errori accumulati nel tempo","Applica una correzione proporzionale all'errore attuale","Spegne il sistema quando la variabile supera il target"],0,"La componente D (Derivativa) del PID misura quanto velocemente la variabile controllata si sta avvicinando al target. Se si avvicina troppo rapidamente, riduce la correzione anticipatamente per evitare di superare il valore desiderato per inerzia. È usata in droni, auto a guida autonoma, bracci robotici.",["Esatto! La D anticipa per evitare di 'superare' il valore target per inerzia: se la temperatura sale rapidamente verso il target, frena prima di arrivarci.","Non è corretto. Quella è la componente I (Integrale). La D anticipa i cambiamenti futuri.","Non è corretto. Quella è la componente P (Proporzionale). La D riguarda la velocità di cambiamento.","Non è corretto. Il PID non spegne il sistema: riduce gradualmente la correzione per non superare il target."]]],"A":[["Nel caso Lamborghini, perché il reparto interni è fatto quasi interamente a mano senza robot, mentre la carrozzeria usa cobot?",["Perché il valore sta nel lavoro artigianale, che un robot non replica","Perché i robot non riescono a lavorare con la pelle","Perché i robot sono troppo costosi per il reparto interni","Perché le normative europee vietano i robot nella lavorazione delle pelli"],0,"Il testo indica che Lamborghini ha fatto una scelta deliberata: 'il valore del prodotto è nell'unicità artigianale, e quella unicità non è replicabile automaticamente.' Il caso Lamborghini mostra che l'Industria 4.0 non è 'tutto automatizzato': è l'integrazione intelligente che decide dove ha senso la macchina e dove l'umano.",["Esatto! Il testo indica che Lamborghini ha fatto 'una scelta deliberata': il valore degli interni è nell'artigianalità unica. L'Industria 4.0 non ha eliminato l'artigianato — ha definito dove usarla.","Non è corretto. I robot possono lavorare con la pelle, ma Lamborghini ha scelto deliberatamente la lavorazione artigianale per ragioni di valore percepito.","Non è corretto. Lamborghini usa già robot costosi per la carrozzeria: la scelta degli interni è strategica, non economica.","Non è corretto. Non esistono tali normative: è una scelta deliberata di posizionamento di prodotto."]],["Progetti un sistema domotico per una scuola: un sensore di movimento nel corridoio non rileva l'alunno perché è fermo a leggere. Questo è un limite di quale tipo?",["Un'eccezione che la regola del sistema non prevedeva","Un guasto tecnico del sensore PIR","Un errore di progettazione dello schema elettrico","Un problema di latenza nella rete Wi-Fi scolastica"],0,"Il Box T8 spiega che l'automazione funziona 'finché le condizioni rientrano in quelle previste' e 'crolla se succede qualcosa fuori dai parametri'. Un alunno fermo a leggere non produce movimento: la regola 'nessun movimento = assenza' è corretta nel 99% dei casi ma sbaglia in questo caso limite. Un sistema IA potrebbe imparare il pattern.",["Esatto! Il Box T8 spiega che l'automazione 'crolla se succede qualcosa fuori dai parametri del programma'. Un alunno fermo non rientra nella regola 'se c'è movimento → presenza rilevata'.","Non è corretto. Il sensore funziona correttamente: rileva il movimento. Il problema è che la regola di automazione non copre il caso 'persona ferma = presente'.","Non è corretto. Il circuito è corretto: il limite è concettuale nella logica dell'automazione.","Non è corretto. La latenza di rete non c'entra: il sensore non riceve segnali dal soggetto fermo."]],["La stampa 3D SLS consente di creare 'geometrie impossibili'. Qual è un esempio concreto e perché è importante per l'aerospazio?",["Canali di raffreddamento a spirale dentro un pezzo di turbina","Pezzi completamente trasparenti per le cabine degli aerei","Pezzi colorati con gradiente senza verniciatura","Pezzi più leggeri semplicemente riducendo lo spessore delle pareti"],0,"Il testo cita 'canali di raffreddamento a spirale dentro una componente metallica, impossibili da forare dall'esterno' come esempio di geometria impossibile. Per le turbine aeronautiche, poter raffreddare in modo ottimale i componenti internamente (senza forature esterne) aumenta l'efficienza termica e la durata.",["Esatto! Il testo cita i 'canali di raffreddamento a spirale dentro una componente metallica, impossibili da forare dall'esterno' come esempio di geometria impossibile abilitata dalla stampa 3D.","Non è corretto. La trasparenza non è una proprietà della stampa SLS in metallo. L'esempio del testo riguarda canali interni.","Non è corretto. La SLS metallica non produce colori: il vantaggio riguarda la geometria interna, non l'estetica.","Non è corretto. La riduzione dello spessore è possibile anche con tecniche tradizionali. La vera geometria impossibile sono le strutture interne."]],["Se un sistema automatico prende una decisione sbagliata che danneggia qualcuno, chi è responsabile?",["È distribuita tra progettista, produttore, installatore e utente, secondo l'origine dell'errore","Solo l'azienda produttrice del robot è sempre responsabile","Solo l'utente è responsabile perché ha scelto di usare il sistema","Il sistema non è responsabile perché è una macchina: solo gli umani possono essere responsabili"],0,"Il testo pone esplicitamente questa domanda come aperta: 'chi è responsabile? Il programmatore? Il produttore del sensore? Chi ha installato il sistema? Chi ha scelto di affidarsi a quella tecnologia?' La responsabilità è distribuita lungo la catena e dipende da dove si è originato l'errore: nel design, nella produzione, nell'installazione o nell'uso.",["Esatto! Il testo pone esplicitamente questa domanda nella metacognizione: 'chi è responsabile? Il programmatore? Il produttore? Chi ha installato? Chi ha scelto di affidarsi a quella tecnologia?' Non c'è una risposta semplice.","Non è corretto. La responsabilità dipende da dove si è generato l'errore: nel codice, nella calibrazione, nell'installazione o nell'uso.","Non è corretto. La responsabilità non è solo dell'utente: dipende dalla correttezza della progettazione, della produzione e dell'installazione.","Non è corretto. Sebbene le macchine non abbiano responsabilità legale, le persone fisiche e giuridiche coinvolte nella catena sono responsabili."]],["Perché la Germania ha sviluppato l'Industria 4.0 come strategia nazionale contro la concorrenza dei paesi a basso costo del lavoro?",["Perché fabbriche intelligenti compensano i salari alti con qualità e produttività","Perché la Germania non aveva materie prime e doveva compensare con la tecnologia","Perché le leggi europee obbligano i paesi a investire in automazione","Perché la Germania voleva eliminare i sindacati attraverso l'automazione"],0,"Il box Geo-Storia spiega: la Germania, con economia basata sulla manifattura di alta qualità, ha risposto alla concorrenza dei paesi a basso costo del lavoro non abbassando i salari, ma rendendo le fabbriche 'smart' — con produttività e personalizzazione talmente elevate da essere irreplicabili altrove.",["Esatto! Il box Geo-Storia chiarisce: la risposta tedesca non era abbassare i salari, ma rendere le fabbriche talmente smart da essere irreplicabili per produttività e qualità.","Non è corretto. La strategia tedesca risponde alla concorrenza sui costi del lavoro, non alla mancanza di materie prime.","Non è corretto. L'Industria 4.0 è una scelta strategica nazionale, non un obbligo europeo.","Non è corretto. Il testo non collega l'Industria 4.0 a obiettivi di riduzione del potere sindacale."]],["Quali sono le differenze fondamentali tra i protocolli Zigbee e Matter per la domotica?",["Zigbee è per sensori a batteria; Matter unisce marche diverse","Zigbee funziona solo con Apple; Matter funziona solo con Google","Zigbee usa il Wi-Fi; Matter usa il Bluetooth","Entrambi richiedono un canone mensile per funzionare"],0,"Zigbee è un protocollo aperto a basso consumo energetico, ideale per sensori a batteria che devono durare anni, con rete a maglia (mesh). Matter (2022) è il nuovo protocollo basato su IP, sostenuto dai principali ecosystem (Apple, Google, Amazon, Samsung), progettato per garantire compatibilità universale tra dispositivi di marche diverse.",["Esatto! Il testo descrive Zigbee come protocollo aperto a basso consumo per sensori a batteria, e Matter come il nuovo standard IP-based per risolvere la frammentazione tra brand.","Non è corretto. Zigbee è aperto e funziona con molti brand. Matter è sostenuto da Apple, Google, Amazon e Samsung insieme.","Non è corretto. Zigbee usa una propria banda radio a 2,4 GHz; Matter è basato su IP e funziona su Wi-Fi e Thread.","Non è corretto. Né Zigbee né Matter richiedono canoni mensili: sono protocolli standard."]]]};
// Verifica di fine livello: 4 domande estratte dal quiz della micro-competenza (data/quiz, livelli F/I/A)
// in fondo a ogni scheda livello. Il risultato migliore resta sul dispositivo e, se il laboratorio è
// incorporato nella pagina della MC, viene inviato alla pagina (postMessage) che lo registra nei progressi.
(function () {
  const V = window.LABVERIFICA; if (!V) return;
  const LV = ["F", "I", "A"], NOMI = { F: "Base", I: "Intermedio", A: "Avanzato" }, N = 4;
  const key = (l) => V.id + ":verifica:" + l;
  const get = (l) => { try { return JSON.parse(localStorage.getItem(key(l)) || "null"); } catch (e) { return null; } };
  const put = (l, v) => { try { localStorage.setItem(key(l), JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  function send(l, score, total) {
    try { if (window.parent !== window) window.parent.postMessage({ type: "proftec-lab-result", mcId: V.id, level: l, score, total }, location.origin); } catch (e) {}
  }
  function box(l, panel) {
    const pool = V[l] || []; if (!pool.length) return;
    const wrap = el("section", "verif"); wrap.setAttribute("aria-label", "Verifica di fine livello " + NOMI[l]);
    const head = el("div", "verif-head", `<span class="lbl">Verifica di fine livello · ${NOMI[l]}</span><p>${Math.min(N, pool.length)} domande dal quiz della micro-competenza. Conta la prima risposta; con 3 su 4 il livello è superato.</p>`);
    const best = el("p", "verif-best"); const body = el("div", "verif-body"); const foot = el("div", "row");
    const again = el("button", "btn ghost", "Nuove domande"); again.type = "button"; const sc = el("span", "score"); const msg = el("span", "verif-msg"); msg.setAttribute("aria-live", "polite");
    foot.append(again, sc, msg); wrap.append(head, best, body, foot); panel.appendChild(wrap);
    function showBest() { const b = get(l); best.textContent = b ? `Miglior risultato: ${b.score}/${b.total}${b.score / b.total >= 0.7 ? " · livello superato" : ""}` : ""; best.hidden = !b; }
    function start() {
      body.innerHTML = ""; sc.textContent = ""; msg.textContent = ""; let answered = 0, right = 0;
      const qs = shuf(pool).slice(0, N);
      qs.forEach((q, qi) => {
        const [text, opts, a, why, fbs] = q; const d = el("div", "vq");
        const id = `vq-${l}-${qi}`; d.appendChild(el("p", "vq-q", `<span class="vq-n">${qi + 1}</span><span id="${id}">${esc(text)}</span>`));
        const g = el("div", "vq-opts"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", id);
        const f = el("div"); f.hidden = true; let done = false;
        shuf(opts.map((o, j) => [o, j])).forEach(([o, j]) => {
          const b = el("button", null, esc(o)); b.type = "button";
          b.onclick = () => {
            if (done) return; done = true; answered++; if (j === a) right++;
            [...g.children].forEach((y) => { y.disabled = true; });
            b.classList.add(j === a ? "ok" : "ko"); b.setAttribute("aria-pressed", "true");
            if (j !== a) [...g.children].forEach((y) => { if (+y.dataset.j === a) y.classList.add("ok"); });
            const msg = j === a ? why : (fbs && fbs[j] ? fbs[j] : why);
            f.className = "fb " + (j === a ? "ok" : "ko"); f.innerHTML = (j === a ? "<strong>Giusto.</strong> " : "<strong>Non proprio.</strong> ") + esc(msg); f.hidden = false;
            sc.textContent = `${right}/${answered}`;
            if (answered === qs.length) {
              const prev = get(l); const r = { score: right, total: qs.length, at: new Date().toISOString() };
              if (!prev || right / qs.length >= prev.score / prev.total) put(l, r);
              send(l, right, qs.length); showBest();
              msg.textContent = right / qs.length >= 0.7 ? "Livello superato." : "Rileggi le spiegazioni e riprova con nuove domande.";
            }
          };
          b.dataset.j = j; g.appendChild(b);
        });
        d.append(g, f); body.appendChild(d);
      });
    }
    again.onclick = start; showBest(); start();
  }
  LV.forEach((l, i) => { const p = document.getElementById("p" + (i + 1)); if (p) box(l, p); });
})();
</script>

<script>
// Modalità LIM: schermo intero, contenuto ingrandito per essere letto da lontano e usato col tocco.
// Si attiva con il pulsante «Schermo intero» (Fullscreen API, anche dentro l'iframe della pagina MC)
// o aprendo la pagina con ?lim=1. Nella barra: A− / A+ per regolare l'ingrandimento, Esci.
(function () {
  const root = document.documentElement;
  const DESIGN = 1250; // larghezza di progetto del contenuto, in px CSS
  const KEY = "proftec:lim-zoom";
  let param = new URLSearchParams(location.search).get("lim") === "1";
  let delta = 0; try { delta = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  // vero anche quando è la pagina della MC a mettere a schermo intero l'iframe che ci contiene
  const fsAny = () => { if (fsEl()) return true; try { return !!window.frameElement && window.parent.document.fullscreenElement === window.frameElement; } catch (e) { return false; } };
  const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  function zoom() {
    const z = Math.max(1, Math.min(2.4, (window.innerWidth - 48) / DESIGN + delta));
    root.style.setProperty("--limz", z.toFixed(3));
    if (lvl) lvl.textContent = Math.round(z * 100) + "%";
  }
  function set(on) {
    root.classList.toggle("lim", on);
    bar.hidden = !on; btn.hidden = on;
    btn.setAttribute("aria-pressed", String(on));
    if (on) zoom();
    window.dispatchEvent(new Event("resize")); // i grafici e il 3D si ridisegnano
  }
  async function enter() {
    if (canFs) { try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen()); return; } catch (e) {} }
    set(true); // senza Fullscreen API (es. iPhone): solo ingrandimento
  }
  function exit() {
    if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    // dentro la pagina della MC lo schermo intero può essere dell'iframe (aperto dalla pagina)
    try { const pd = window.parent !== window && window.parent.document; if (pd && pd.fullscreenElement) return pd.exitFullscreen(); } catch (e) {}
    // aperta con ?lim=1 (scheda a sé): Esci prova a chiudere la scheda; se il browser non lo consente, torna alla vista normale
    const viaParam = param; param = false;
    if (viaParam) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    set(false);
    if (viaParam && window.parent === window) { try { window.close(); } catch (e) {} }
  }

  const btn = mk("button", "lim-btn", '<span aria-hidden="true">⛶</span> Schermo intero (LIM)'); btn.type = "button";
  btn.title = "Apri a schermo intero, con testo e pulsanti grandi per la lavagna interattiva";
  btn.onclick = enter;
  const bar = mk("div", "lim-bar"); bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Modalità LIM"); bar.hidden = true;
  const minus = mk("button", null, "A−"); minus.type = "button"; minus.setAttribute("aria-label", "Riduci");
  const lvl = mk("span", "lim-lvl"); lvl.setAttribute("aria-live", "polite");
  const plus = mk("button", null, "A+"); plus.type = "button"; plus.setAttribute("aria-label", "Ingrandisci");
  const out = mk("button", "lim-out", "Esci ✕"); out.type = "button";
  const step = (d) => { delta = Math.round((delta + d) * 10) / 10; try { localStorage.setItem(KEY, String(delta)); } catch (e) {} zoom(); };
  minus.onclick = () => step(-0.1); plus.onclick = () => step(0.1); out.onclick = exit;
  bar.append(minus, lvl, plus, out);

  function mount() {
    const head = document.querySelector(".lab-head .chips") || document.querySelector(".lab-head");
    if (head) head.appendChild(btn); else document.body.prepend(btn);
    document.body.appendChild(bar);
    ["fullscreenchange", "webkitfullscreenchange"].forEach((ev) => document.addEventListener(ev, () => set(fsAny() || param)));
    window.addEventListener("resize", () => { if (root.classList.contains("lim")) zoom(); });
    if (param) set(true);
    window.PROFTEC_LIM = { set, enter, exit };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>
</body>
</html>
