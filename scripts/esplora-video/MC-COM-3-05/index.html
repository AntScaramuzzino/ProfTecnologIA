<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Pop;src:url(fonts/Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:PopM;src:url(fonts/Poppins-Medium.ttf);font-weight:400 500}
@font-face{font-family:ISerif;src:url(fonts/InstrumentSerif-Regular.ttf);font-style:normal}
@font-face{font-family:ISerif;src:url(fonts/InstrumentSerif-Italic.ttf);font-style:italic}
@font-face{font-family:Mono;src:url("fonts/JetBrainsMono[wght].ttf");font-weight:100 800}
html,body{margin:0;background:#0C0A09}svg{display:block}
</style></head><body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script src="data.js"></script><script src="kit.js"></script><script src="scenes.js"></script>
<script>
Promise.all(['800 40px Pop','500 40px PopM','400 40px ISerif','italic 400 40px ISerif','500 40px Mono','700 40px Mono'].map(f=>document.fonts.load(f)))
.then(()=>document.fonts.ready).then(()=>{window.FONTS_OK=['Pop','PopM','ISerif','Mono'].every(f=>document.fonts.check('40px '+f));render(0);window.READY=true})
</script>
</body></html>
