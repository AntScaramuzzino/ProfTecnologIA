sa</text><rect x="90" y="575" width="460" height="85" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2" /><text x="110" y="613" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="700" text-anchor="start" >Oneri di sistema</text><text x="110" y="641" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start" >incentivi, sussidi, costi del passato</text><line x1="560" y1="617" x2="640" y2="617" stroke="#D97706" stroke-width="3" marker-end="url(#aD97706)" stroke-linecap="round"/><text x="660" y="625" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >finanziano scelte di interesse generale</text><rect x="90" y="680" width="460" height="85" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" /><text x="110" y="718" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="700" text-anchor="start" >Imposte</text><text x="110" y="746" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start" >IVA + accisa</text><line x1="560" y1="722" x2="640" y2="722" stroke="#DC2626" stroke-width="3" marker-end="url(#aDC2626)" stroke-linecap="round"/><text x="660" y="730" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >IVA 10% o 22% secondo il tipo di utenza</text><rect x="1180" y="560" width="360" height="260" rx="14" fill="#FEF3C7" stroke="none" stroke-width="2" /><text x="1205" y="605.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >Esempio dal testo:</text><text x="1205" y="635.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >termostato da 22 °C a 20 °C</text><text x="1205" y="666.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >→ consumi di riscaldamento</text><text x="1205" y="697.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >−10/14% ogni anno</text><text x="660" y="830" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="700" text-anchor="start" >Totale da pagare = somma delle cinque voci</text><text x="1560" y="878" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" fill="#94A3B8" font-weight="400" text-anchor="end" >Schema didattico · ProfTecnologIA</text></svg>