</marker><marker id="sDC2626" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="a7C3AED" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="s7C3AED" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="a2563EB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="s2563EB" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1600" height="96" rx="0" fill="#0F172A" stroke="none" stroke-width="0" /><rect x="0" y="92" width="1600" height="4" rx="0" fill="#0891B2" stroke="none" stroke-width="0" /><text x="56" y="62" font-family="Inter, DejaVu Sans, sans-serif" font-size="38" fill="#FFFFFF" font-weight="700" text-anchor="start" >Come si calcola la scala</text><rect x="60" y="140" width="700" height="230" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><text x="90" y="190" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start" >Formula (scala 1:n)</text><text x="90" y="255" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#0891B2" font-weight="700" text-anchor="start" >misura sul disegno = misura reale ÷ n</text><text x="90" y="320" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#D97706" font-weight="700" text-anchor="start" >misura reale = misura sul disegno × n</text><rect x="820" y="140" width="720" height="230" rx="14" fill="#CFFAFE" stroke="none" stroke-width="2" /><text x="850" y="190" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0891B2" font-weight="700" text-anchor="start" >Esempio 1 · dalla realtà al disegno</text><text x="850" y="235.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="400" text-anchor="start" >Parete reale: 6 m = 600 cm · scala 1:50</text><text x="850" y="268.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="400" text-anchor="start" >600 cm ÷ 50 = 12 cm</text><text x="850" y="302.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="400" text-anchor="start" >Sul disegno la parete è lunga 12 cm</text><rect x="820" y="395" width="720" height="230" rx="14" fill="#FEF3C7" stroke="none" stroke-width="2" /><text x="850" y="445" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#D97706" font-weight="700" text-anchor="start" >Esempio 2 · dal disegno alla realtà</text><text x="850" y="490.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="400" text-anchor="start" >Finestra sul disegno: 2,4 cm · scala 1:50</text><text x="850" y="523.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="400" text-anchor="start" >2,4 cm × 50 = 120 cm</text><text x="850" y="557.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="400" text-anchor="start" >Nella realtà la finestra è larga 1,2 m</text><text x="90" y="440" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start" >Stessa parete, due misure</text><rect x="90" y="470" width="600" height="40" rx="4" fill="#94A3B8" stroke="none" stroke-width="0" /><text x="90" y="545" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#475569" font-weight="400" text-anchor="start" >realtà: 600 cm (6 m)</text><rect x="90" y="580" width="12" height="40" rx="2" fill="#0891B2" stroke="none" stroke-width="0" /><text x="120" y="610" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0891B2" font-weight="700" text-anchor="start" >disegno 1:50 → 12 cm (50 volte più corta)</text><rect x="60" y="660" width="1480" height="150" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><text x="90" y="705.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="400" text-anchor="start" >Scale di ingrandimento (es. 5:1): misura sul disegno = misura reale × 5</text><text x="90" y="741.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="400" text-anchor="start" >Bullone reale 18 mm a scala 5:1 → 18 × 5 = 90 mm sul disegno</text><text x="1560" y="878" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" fill="#94A3B8" font-weight="400" text-anchor="end" >Schema didattico · ProfTecnologIA</text></svg>