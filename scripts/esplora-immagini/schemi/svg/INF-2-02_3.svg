</marker><marker id="sDC2626" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="a7C3AED" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="s7C3AED" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="a2563EB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="s2563EB" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1600" height="96" rx="0" fill="#0F172A" stroke="none" stroke-width="0" /><rect x="0" y="92" width="1600" height="4" rx="0" fill="#0891B2" stroke="none" stroke-width="0" /><text x="56" y="62" font-family="Inter, DejaVu Sans, sans-serif" font-size="38" fill="#FFFFFF" font-weight="700" text-anchor="start" >Perché la crittografia RSA è difficile da rompere</text><rect x="60" y="150" width="700" height="300" rx="14" fill="#DCFCE7" stroke="none" stroke-width="2" /><text x="90" y="200" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" fill="#16A34A" font-weight="800" text-anchor="start" >Moltiplicare: facile</text><text x="410" y="320" font-family="DejaVu Sans Mono, monospace" font-size="56" fill="#0F172A" font-weight="800" text-anchor="middle" >17 × 19 = 323</text><text x="90" y="410" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >Un solo calcolo, risultato immediato.</text><rect x="840" y="150" width="700" height="300" rx="14" fill="#FEE2E2" stroke="none" stroke-width="2" /><text x="870" y="200" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" fill="#DC2626" font-weight="800" text-anchor="start" >Fattorizzare: difficile</text><text x="1190" y="270" font-family="DejaVu Sans Mono, monospace" font-size="50" fill="#0F172A" font-weight="800" text-anchor="middle" >323 = ? × ?</text><text x="870" y="330" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#475569" font-weight="400" text-anchor="start" >323 ÷ 2 no</text><text x="1035" y="330" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#475569" font-weight="400" text-anchor="start" >323 ÷ 3 no</text><text x="1200" y="330" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#475569" font-weight="400" text-anchor="start" >323 ÷ 5 no</text><text x="1365" y="330" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#475569" font-weight="400" text-anchor="start" >323 ÷ 7 no</text><text x="870" y="370" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#475569" font-weight="400" text-anchor="start" >323 ÷ 11 no</text><text x="1035" y="370" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#475569" font-weight="400" text-anchor="start" >323 ÷ 13 no</text><text x="1200" y="370" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#16A34A" font-weight="700" text-anchor="start" >323 ÷ 17 = 19 ✓</text><text x="870" y="425" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >Bisogna provare un divisore dopo l&#x27;altro.</text><line x1="770" y1="300" x2="830" y2="300" stroke="#475569" stroke-width="3" marker-end="url(#a475569)" stroke-linecap="round"/><rect x="60" y="490" width="1480" height="330" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><text x="90" y="540" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start" >Con numeri enormi la differenza diventa abissale</text><rect x="90" y="600" width="292" height="38" rx="19" fill="#E2E8F0" stroke="none" stroke-width="0" /><text x="236.0" y="624" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle" >due primi da 2 cifre</text><line x1="420" y1="619" x2="500" y2="619" stroke="#475569" stroke-width="3" marker-end="url(#a475569)" stroke-linecap="round"/><rect x="520" y="600" width="278" height="38" rx="19" fill="#E2E8F0" stroke="none" stroke-width="0" /><text x="659.0" y="624" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle" >prodotto da 3 cifre</text><line x1="840" y1="619" x2="920" y2="619" stroke="#475569" stroke-width="3" marker-end="url(#a475569)" stroke-linecap="round"/><rect x="940" y="600" width="388" height="36" rx="18" fill="#DCFCE7" stroke="none" stroke-width="0" /><text x="1134.0" y="622" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" fill="#16A34A" font-weight="700" text-anchor="middle" >per scomporlo: pochi tentativi</text><rect x="90" y="690" width="318" height="38" rx="19" fill="#E2E8F0" stroke="none" stroke-width="0" /><text x="249.0" y="714" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle" >due primi da 600 cifre</text><line x1="420" y1="709" x2="500" y2="709" stroke="#475569" stroke-width="3" marker-end="url(#a475569)" stroke-linecap="round"/><rect x="520" y="690" width="318" height="38" rx="19" fill="#E2E8F0" stroke="none" stroke-width="0" /><text x="679.0" y="714" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle" >prodotto da 1200 cifre</text><line x1="840" y1="709" x2="920" y2="709" stroke="#475569" stroke-width="3" marker-end="url(#a475569)" stroke-linecap="round"/><rect x="940" y="690" width="580" height="36" rx="18" fill="#FEE2E2" stroke="none" stroke-width="0" /><text x="1230.0" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" fill="#DC2626" font-weight="700" text-anchor="middle" >per scomporlo: più anni dell&#x27;età dell&#x27;universo</text><text x="90" y="790" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#475569" font-weight="400" text-anchor="start" >RSA (1977) usa chiavi da 2048 o 4096 bit: per questo è sicuro con i computer di oggi.</text><text x="1560" y="878" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" fill="#94A3B8" font-weight="400" text-anchor="end" >Schema didattico · ProfTecnologIA</text></svg>