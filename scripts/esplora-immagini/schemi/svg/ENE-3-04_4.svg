 stroke-width="0" /><text x="378.08" y="276" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start" >8 W</text><text x="340" y="364" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="end" >Caricatore telefono</text><rect x="360" y="334" width="7.6499999999999995" height="48" rx="6" fill="#0891B2" stroke="none" stroke-width="0" /><text x="381.65" y="368" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start" >15 W</text><text x="340" y="456" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="end" >Televisore</text><rect x="360" y="426" width="51.0" height="48" rx="6" fill="#0891B2" stroke="none" stroke-width="0" /><text x="425.0" y="460" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start" >100 W</text><text x="340" y="548" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="end" >Asciugacapelli</text><rect x="360" y="518" width="1020.0" height="48" rx="6" fill="#D97706" stroke="none" stroke-width="0" /><text x="1394.0" y="552" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start" >2.000 W</text><text x="360" y="620" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#475569" font-weight="400" text-anchor="start" >L&#x27;asciugacapelli assorbe circa 250 volte la potenza di una lampadina LED.</text><rect x="60" y="660" width="700" height="160" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><text x="90" y="705.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start" >P = V × I</text><text x="90" y="744.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start" >LED a 5 V con 0,4 A → P = 5 × 0,4 = 2 W</text><rect x="800" y="660" width="740" height="160" rx="14" fill="#FEF3C7" stroke="none" stroke-width="2" /><text x="830" y="705.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start" >Energia (kWh) = potenza (kW) × tempo (h)</text><text x="830" y="744.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start" >2 kW per 1,5 h → 3 kWh</text><text x="1560" y="878" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" fill="#94A3B8" font-weight="400" text-anchor="end" >Schema didattico · ProfTecnologIA</text></svg>