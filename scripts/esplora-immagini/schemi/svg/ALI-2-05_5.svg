</marker><marker id="sDC2626" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="a7C3AED" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="s7C3AED" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="a2563EB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="s2563EB" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1600" height="96" rx="0" fill="#0F172A" stroke="none" stroke-width="0" /><rect x="0" y="92" width="1600" height="4" rx="0" fill="#0891B2" stroke="none" stroke-width="0" /><text x="56" y="62" font-family="Inter, DejaVu Sans, sans-serif" font-size="38" fill="#FFFFFF" font-weight="700" text-anchor="start" >I simboli sul packaging: cosa significano davvero</text><text x="60" y="150" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start" >Riconosci il simbolo, poi chiediti: dice davvero che il prodotto verrà riciclato?</text><rect x="60" y="190" width="355" height="310" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><path d="M237,220 L289,308 L185,308 Z" stroke="#0F172A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="237" y="294" font-family="Inter, DejaVu Sans, sans-serif" font-size="40" fill="#0F172A" font-weight="800" text-anchor="middle" >1</text><text x="317" y="300" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="700" text-anchor="middle" >PET</text><text x="80" y="370" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="800" text-anchor="start" >Codice del materiale</text><text x="80" y="398" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start" >numero 1–7 nel triangolo</text><text x="80" y="435.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >Indica il tipo di plastica.</text><text x="80" y="459.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >Non dice se nel tuo comune</text><text x="80" y="484.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >viene riciclata.</text><rect x="435" y="190" width="355" height="310" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><path d="M623,229 A42,42 0 0 1 654,274" stroke="#16A34A" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M652,290 L665,275 L643,273 Z" fill="#16A34A"/><path d="M642,300 A42,42 0 0 1 588,304" stroke="#16A34A" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M575,295 L582,313 L594,295 Z" fill="#16A34A"/><path d="M571,281 A42,42 0 0 1 594,232" stroke="#16A34A" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M609,225 L590,222 L599,242 Z" fill="#16A34A"/><text x="455" y="370" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="800" text-anchor="start" >Ciclo di Möbius</text><text x="455" y="398" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start" >tre frecce che si inseguono</text><text x="455" y="435.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >Materiale tecnicamente</text><text x="455" y="459.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >riciclabile. Non garantisce</text><text x="455" y="484.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >che lo sia davvero.</text><rect x="810" y="190" width="355" height="310" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><rect x="917" y="230" width="140" height="80" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/><text x="987" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" fill="#475569" font-weight="400" text-anchor="middle" font-style="italic" >marchio</text><text x="830" y="370" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="800" text-anchor="start" >Punto verde</text><text x="830" y="398" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start" >marchio del sistema di raccolta</text><text x="830" y="435.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >Il produttore ha finanziato il</text><text x="830" y="459.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >sistema di riciclo. Non vuol</text><text x="830" y="484.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >dire «riciclato».</text><rect x="1185" y="190" width="355" height="310" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><rect x="1292" y="230" width="140" height="80" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/><text x="1362" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" fill="#475569" font-weight="400" text-anchor="middle" font-style="italic" >marchio</text><text x="1205" y="370" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="800" text-anchor="start" >FSC</text><text x="1205" y="398" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start" >marchio su carta e cartone</text><text x="1205" y="435.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >Carta da foreste gestite in</text><text x="1205" y="459.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >modo responsabile.</text><rect x="60" y="520" width="355" height="310" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><rect x="167" y="560" width="140" height="80" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/><text x="237" y="608" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" fill="#475569" font-weight="400" text-anchor="middle" font-style="italic" >marchio</text><text x="80" y="700" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="800" text-anchor="start" >Ecolabel UE</text><text x="80" y="728" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start" >marchio europeo</text><text x="80" y="765.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >Il prodotto rispetta criteri</text><text x="80" y="789.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >ambientali fissati dall&#x27;UE.</text><rect x="435" y="520" width="355" height="310" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><rect x="542" y="560" width="140" height="80" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/><text x="612" y="608" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" fill="#475569" font-weight="400" text-anchor="middle" font-style="italic" >marchio</text><text x="455" y="700" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="800" text-anchor="start" >Biologico UE</text><text x="455" y="728" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start" >marchio su alimenti</text><text x="455" y="765.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >Prodotto secondo le regole UE</text><text x="455" y="789.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >del biologico.</text><rect x="810" y="520" width="355" height="310" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><rect x="997" y="590" width="40" height="55" rx="4" fill="none" stroke="#0F172A" stroke-width="4" /><circle cx="957" cy="560" r="10" fill="#0F172A" stroke="none" stroke-width="0"/><path d="M957,572 L957,610 L942,645 M957,610 L972,645 M957,582 L992,595" stroke="#0F172A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="830" y="700" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="800" text-anchor="start" >Omino col cestino</text><text x="830" y="728" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" fill="#475569" font-weight="400" text-anchor="start" >invito generico</text><text x="830" y="765.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >Butta i rifiuti nel posto</text><text x="830" y="789.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >giusto. Non dice nulla sulla</text><text x="830" y="814.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" fill="#0F172A" font-weight="400" text-anchor="start" >riciclabilità.</text><text x="1560" y="878" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" fill="#94A3B8" font-weight="400" text-anchor="end" >Schema didattico · ProfTecnologIA</text></svg>