</marker><marker id="sDC2626" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="a7C3AED" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="s7C3AED" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="a2563EB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="s2563EB" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1600" height="96" rx="0" fill="#0F172A" stroke="none" stroke-width="0" /><rect x="0" y="92" width="1600" height="4" rx="0" fill="#0891B2" stroke="none" stroke-width="0" /><text x="56" y="62" font-family="Inter, DejaVu Sans, sans-serif" font-size="38" fill="#FFFFFF" font-weight="700" text-anchor="start" >Il vantaggio meccanico</text><path d="M950,630 L1010,532 L1070,630 Z" stroke="#0F172A" stroke-width="3" fill="#E2E8F0" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="510" width="950" height="20" rx="4" fill="#A16207" stroke="none" stroke-width="0" /><rect x="1100" y="370" width="120" height="140" rx="10" fill="#64748B" stroke="none" stroke-width="0" /><text x="1160" y="450" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" fill="#fff" font-weight="800" text-anchor="middle" >500 N</text><line x1="1160" y1="550" x2="1160" y2="680" stroke="#DC2626" stroke-width="6" marker-end="url(#aDC2626)" stroke-linecap="round"/><text x="1186" y="630" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#DC2626" font-weight="700" text-anchor="start" >F resistente = 500 N</text><line x1="260" y1="320" x2="260" y2="490" stroke="#0891B2" stroke-width="6" marker-end="url(#a0891B2)" stroke-linecap="round"/><text x="280" y="340" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0891B2" font-weight="700" text-anchor="start" >F motrice = 100 N</text><line x1="260" y1="720" x2="1010" y2="720" stroke="#0891B2" stroke-width="2" marker-end="url(#a0891B2)" marker-start="url(#s0891B2)" stroke-linecap="round"/><text x="630.0" y="754" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0891B2" font-weight="700" text-anchor="middle" >braccio motore 1,0 m</text><line x1="1010" y1="720" x2="1160" y2="720" stroke="#DC2626" stroke-width="2" marker-end="url(#aDC2626)" marker-start="url(#sDC2626)" stroke-linecap="round"/><text x="1085.0" y="754" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#DC2626" font-weight="700" text-anchor="middle" >0,2 m</text><text x="1010" y="660" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#475569" font-weight="400" text-anchor="middle" >fulcro</text><rect x="1250" y="140" width="300" height="300" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><text x="1275" y="190.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" fill="#0F172A" font-weight="400" text-anchor="start" >VM = F res / F mot</text><text x="1275" y="221.05" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" fill="#0F172A" font-weight="400" text-anchor="start" >= 500 / 100 = 5</text><text x="1275" y="252.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" fill="#0F172A" font-weight="400" text-anchor="start" ></text><text x="1275" y="283.15" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" fill="#0F172A" font-weight="400" text-anchor="start" >e anche:</text><text x="1275" y="314.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" fill="#0F172A" font-weight="400" text-anchor="start" >VM = b mot / b res</text><text x="1275" y="345.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" fill="#0F172A" font-weight="400" text-anchor="start" >= 1,0 / 0,2 = 5</text><text x="80" y="180" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start" >Il carico vicino al fulcro, la forza lontana: serve 5 volte meno forza.</text><text x="80" y="220" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#475569" font-weight="400" text-anchor="start" >Ma la mano deve abbassarsi 5 volte di più del carico: il lavoro resta lo stesso.</text><text x="1560" y="878" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" fill="#94A3B8" font-weight="400" text-anchor="end" >Schema didattico · ProfTecnologIA</text></svg>