rif" font-size="78" fill="#0F172A" font-weight="800" text-anchor="middle" >A2</text><text x="624.9" y="356.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" fill="#475569" font-weight="400" text-anchor="middle" >420 × 594</text><rect x="446.4" y="452.0" width="178.2" height="252.6" rx="0" fill="#FEF3C7" stroke="#0F172A" stroke-width="2" /><text x="535.5" y="582.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="55" fill="#0F172A" font-weight="800" text-anchor="middle" >A3</text><text x="535.5" y="608.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" fill="#475569" font-weight="400" text-anchor="middle" >297 × 420</text><rect x="624.6" y="452.0" width="178.79999999999998" height="126.0" rx="0" fill="#DCFCE7" stroke="#0F172A" stroke-width="2" /><text x="714.0" y="519.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="39" fill="#0F172A" font-weight="800" text-anchor="middle" >A4</text><text x="714.0" y="545.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" fill="#475569" font-weight="400" text-anchor="middle" >210 × 297</text><rect x="624.6" y="578.0" width="89.39999999999999" height="126.6" rx="0" fill="#EDE9FE" stroke="#0F172A" stroke-width="2" /><text x="669.3" y="645.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="27" fill="#0F172A" font-weight="800" text-anchor="middle" >A5</text><rect x="714.0" y="578.0" width="89.39999999999999" height="126.6" rx="0" fill="#EDE9FE" stroke="#0F172A" stroke-width="2" /><text x="758.6999999999999" y="645.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="27" fill="#0F172A" font-weight="800" text-anchor="middle" >A5</text><text x="90" y="180" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="700" text-anchor="start" >A0 = 841 × 1189 mm (1 m²) · ogni piega a metà dà il formato successivo</text><rect x="900" y="200" width="640" height="300" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" /><text x="930" y="250.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" fill="#0F172A" font-weight="400" text-anchor="start" >Lato lungo ÷ lato corto = √2 ≈ 1,414</text><text x="930" y="282.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" fill="#0F172A" font-weight="400" text-anchor="start" >per tutti i formati della serie A.</text><text x="930" y="314.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" fill="#0F172A" font-weight="400" text-anchor="start" ></text><text x="930" y="346.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" fill="#0F172A" font-weight="400" text-anchor="start" >Piegando a metà si dimezza l&#x27;area,</text><text x="930" y="378.79999999999995" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" fill="#0F172A" font-weight="400" text-anchor="start" >ma le proporzioni restano uguali.</text><rect x="900" y="530" width="640" height="280" rx="14" fill="#FEF3C7" stroke="none" stroke-width="2" /><text x="930" y="580.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >Da A3 ad A4 si riduce al 70,7%:</text><text x="930" y="610.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >una scala 1:50 diventa circa 1:70,7.</text><text x="930" y="641.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" ></text><text x="930" y="672.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >Per passare da 1:50 a 1:100</text><text x="930" y="703.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#0F172A" font-weight="400" text-anchor="start" >le lunghezze vanno ridotte al 50%.</text><text x="1560" y="878" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" fill="#94A3B8" font-weight="400" text-anchor="end" >Schema didattico · ProfTecnologIA</text></svg>