zione</text><text x="870.0" y="222.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start" >acqua, calore, ossigeno:</text><text x="870.0" y="249.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start" >esce la radichetta</text><path d="M1016,438 A225,225 0 0 1 1016,562" stroke="#16A34A" stroke-width="6" fill="none" marker-end="url(#a16A34A)" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1059.8076211353316" cy="350.0" r="46" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="1059.8076211353316" y="363.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="36" fill="#16A34A" font-weight="800" text-anchor="middle" >2</text><text x="1125.8076211353316" y="340.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start" >Piantina</text><text x="1125.8076211353316" y="370.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start" >prime foglie vere,</text><text x="1125.8076211353316" y="397.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start" >inizia la fotosintesi</text><path d="M962,656 A225,225 0 0 1 854,718" stroke="#16A34A" stroke-width="6" fill="none" marker-end="url(#a16A34A)" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1059.8076211353316" cy="650.0" r="46" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="1059.8076211353316" y="663.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="36" fill="#16A34A" font-weight="800" text-anchor="middle" >3</text><text x="1125.8076211353316" y="640.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start" >Crescita vegetativa</text><text x="1125.8076211353316" y="670.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start" >radici, fusto, foglie;</text><text x="1125.8076211353316" y="697.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start" >serve molto azoto</text><path d="M746,718 A225,225 0 0 1 638,656" stroke="#16A34A" stroke-width="6" fill="none" marker-end="url(#a16A34A)" stroke-linecap="round" stroke-linejoin="round"/><circle cx="800.0" cy="800.0" r="46" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="800.0" y="813.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="36" fill="#16A34A" font-weight="800" text-anchor="middle" >4</text><text x="870.0" y="808.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start" >Fioritura</text><text x="870.0" y="838.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start" >impollinazione: insetti,</text><text x="870.0" y="865.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start" >vento o acqua</text><path d="M584,562 A225,225 0 0 1 584,438" stroke="#16A34A" stroke-width="6" fill="none" marker-end="url(#a16A34A)" stroke-linecap="round" stroke-linejoin="round"/><circle cx="540.1923788646684" cy="650.0" r="46" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="540.1923788646684" y="663.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="36" fill="#16A34A" font-weight="800" text-anchor="middle" >5</text><text x="474.1923788646684" y="640.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="end" >Fruttificazione</text><text x="474.1923788646684" y="670.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="end" >l&#x27;ovario diventa frutto</text><text x="474.1923788646684" y="697.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="end" >che contiene i semi</text><path d="M638,344 A225,225 0 0 1 746,282" stroke="#16A34A" stroke-width="6" fill="none" marker-end="url(#a16A34A)" stroke-linecap="round" stroke-linejoin="round"/><circle cx="540.1923788646684" cy="350.0" r="46" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="540.1923788646684" y="363.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="36" fill="#16A34A" font-weight="800" text-anchor="middle" >6</text><text x="474.1923788646684" y="340.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="end" >Maturazione</text><text x="474.1923788646684" y="370.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="end" >i semi cadono nel suolo:</text><text x="474.1923788646684" y="397.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="end" >il ciclo ricomincia</text><text x="800" y="470.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="middle" >Ciclo di vita di una</text><text x="800" y="501.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="middle" >pianta da fiore</text><text x="800" y="532.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="middle" >(angiosperma)</text><text x="800" y="570" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" fill="#475569" font-weight="400" text-anchor="middle" font-style="italic" >stessa specie dall&#x27;inizio alla fine</text><text x="1560" y="878" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" fill="#94A3B8" font-weight="400" text-anchor="end" >Schema didattico · ProfTecnologIA</text></svg>